<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Install pkit</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Install pkit</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Install the tool once, then add pkit to each project with one command.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Upgrades replace pkit's files, never yours.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">pkit status shows what pkit set up in a project. Optional parts, called capabilities, come later.</tspan></text>
<rect x="80" y="216" width="736" height="104" rx="8" fill="#f2f4f6"/>
<text x="104" y="250" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f"># once, on your machine</tspan></text>
<text x="104" y="274" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">uv tool install</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> \</tspan></text>
<text x="104" y="298" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">    git+ssh://git@github.com/aleskalfas/project-kit.git@latest</tspan></text>
<rect x="848" y="216" width="352" height="104" rx="8" fill="#f2f4f6"/>
<text x="872" y="250" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f"># in each project</tspan></text>
<text x="872" y="274" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">cd</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> your-project</tspan></text>
<text x="872" y="298" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit init</tspan></text>
<rect x="80" y="344" width="736" height="296" rx="8" fill="#f2f4f6"/>
<text x="104" y="378" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">tree</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> -a -L 2 your-project</tspan></text>
<text x="104" y="402" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">your-project/</tspan></text>
<text x="104" y="426" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">                      # the methodology</tspan></text>
<text x="104" y="450" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">agents/     </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● core/   </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ project/</tspan></text>
<text x="104" y="474" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">decisions/  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● core/   </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ project/</tspan></text>
<text x="104" y="498" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">rules/      </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● core.md </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ project.md</tspan></text>
<text x="104" y="522" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">…</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">                   # and more of both</tspan></text>
<text x="104" y="546" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.claude/settings.json</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">       # </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ yours</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">, </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● pkit's</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f"> merged in</tspan></text>
<text x="104" y="570" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ CLAUDE.md</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">                 # loads the rules</tspan></text>
<text x="104" y="594" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">└── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ src/</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">                      # your code, untouched</tspan></text>
<text x="104" y="618" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f"># </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">● pkit's files</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">, replaced by each upgrade · </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">○ your files</tspan></text>
<rect x="848.5" y="344.5" width="351" height="295" rx="8" fill="none" stroke="#d5d8db" stroke-width="1"/>
<text x="872" y="384" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Don't want pkit</tspan></text>
<text x="872" y="414" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">in your repository?</tspan></text>
<rect x="872" y="442" width="304" height="40" rx="8" fill="#f2f4f6"/>
<text x="888" y="468" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit visibility private</tspan></text>
<text x="872" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">pkit stays only in your clone, hidden</tspan></text>
<text x="872" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">by git's exclude file. Nothing of it is</tspan></text>
<text x="872" y="579" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">committed, and your agent still uses</tspan></text>
<text x="872" y="607" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">all of it.</tspan></text>
</svg>
