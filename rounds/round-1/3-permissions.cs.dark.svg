<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Odkud se berou oprávnění</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Odkud se berou oprávnění</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Z pravidel, která projekt zapíše jako data.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">AI nástroj je uplatní při každém volání, i když na ně agent zapomene.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">V project-kitu: agent project-manager nesmí nic měnit přímým příkazem gh. Používá příkazy pkitu, které issue nejdřív ověří.</tspan></text>
<path d="M 376 216 L 624 216 L 640 240 L 624 264 L 376 264 Q 368 264 368 256 L 368 224 Q 368 216 376 216 Z" fill="#07835e"/>
<text x="396" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Zapsáno jako data</tspan></text>
<path d="M 672 216 L 912 216 L 928 240 L 912 264 L 656 264 L 672 240 L 656 216 Z" fill="#00593e"/>
<text x="684" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">AI nástroj dostane</tspan></text>
<path d="M 960 216 L 1192 216 Q 1200 216 1200 224 L 1200 256 Q 1200 264 1192 264 L 944 264 L 960 240 L 944 216 Z" fill="#002f1f"/>
<text x="972" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Výsledek volání</tspan></text>
<line x1="80" y1="280" x2="1200" y2="280" stroke="#35383c" stroke-width="1"/>
<text x="80" y="323" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Pojistky</tspan></text>
<text x="80" y="351" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">pro vás i každého agenta</tspan></text>
<text x="396" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">rm -r, sudo a force-push,</tspan></text>
<text x="396" y="351" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">zakázané všem</tspan></text>
<text x="684" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">zákaz v nastavení</tspan></text>
<text x="972" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">odmítnuto v každém</tspan></text>
<text x="972" y="351" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">režimu</tspan></text>
<line x1="80" y1="380" x2="1200" y2="380" stroke="#35383c" stroke-width="1"/>
<text x="80" y="423" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Vlastní nástroje agenta</tspan></text>
<text x="80" y="451" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">v souboru agenta</tspan></text>
<text x="396" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">critic: Read, Glob, Grep,</tspan></text>
<text x="396" y="451" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">WebFetch</tspan></text>
<text x="684" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">seznam nástrojů</tspan></text>
<text x="972" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">žádný příkaz, žádný zápis</tspan></text>
<line x1="80" y1="480" x2="1200" y2="480" stroke="#35383c" stroke-width="1"/>
<text x="80" y="523" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Pravidlo agenta</tspan></text>
<text x="80" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">z </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#eeae7e">project-management</tspan></text>
<text x="396" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">project-manager: žádné</tspan></text>
<text x="396" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">změny přímým gh</tspan></text>
<text x="684" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">hook před voláním</tspan></text>
<text x="972" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">odmítnuto, použije příkazy</tspan></text>
<text x="972" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">pkitu</tspan></text>
<line x1="80" y1="580" x2="1200" y2="580" stroke="#35383c" stroke-width="1"/>
<text x="80" y="625" font-size="20"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Omezení  </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Zákaz zastaví jen ty podoby příkazu, které pkit pozná. Příkaz schovaný za jiným může proklouznout.</tspan></text>
</svg>
