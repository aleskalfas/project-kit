<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Where permissions come from</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Where permissions come from</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">From rules your project writes down as data.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Your AI tool applies them to every call, so they hold when an agent forgets them.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">In project-kit: the project-manager agent is refused raw gh changes, and uses pkit's commands, which validate the issue first.</tspan></text>
<path d="M 376 216 L 624 216 L 640 240 L 624 264 L 376 264 Q 368 264 368 256 L 368 224 Q 368 216 376 216 Z" fill="#39a37c"/>
<text x="396" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Written as data</tspan></text>
<path d="M 672 216 L 912 216 L 928 240 L 912 264 L 656 264 L 672 240 L 656 216 Z" fill="#8dceb1"/>
<text x="684" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Your AI tool gets</tspan></text>
<path d="M 960 216 L 1192 216 Q 1200 216 1200 224 L 1200 256 Q 1200 264 1192 264 L 944 264 L 960 240 L 944 216 Z" fill="#d9f2e6"/>
<text x="972" y="248" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">A call meets</tspan></text>
<line x1="80" y1="280" x2="1200" y2="280" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="323" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Guardrails</tspan></text>
<text x="80" y="351" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">for you and every agent</tspan></text>
<text x="396" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">rm -r, sudo and force-push,</tspan></text>
<text x="396" y="351" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">denied to all</tspan></text>
<text x="684" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">a deny in its settings</tspan></text>
<text x="972" y="323" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">refused, in every mode</tspan></text>
<line x1="80" y1="380" x2="1200" y2="380" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="423" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">An agent's own tools</tspan></text>
<text x="80" y="451" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">in the agent's file</tspan></text>
<text x="396" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">critic: Read, Glob, Grep,</tspan></text>
<text x="396" y="451" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">WebFetch</tspan></text>
<text x="684" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">that agent's list of tools</tspan></text>
<text x="972" y="423" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">no command run, no file</tspan></text>
<text x="972" y="451" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">written</tspan></text>
<line x1="80" y1="480" x2="1200" y2="480" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="523" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">One agent's rule</tspan></text>
<text x="80" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">from </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#904c03">project-management</tspan></text>
<text x="396" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">project-manager: no raw</tspan></text>
<text x="396" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">gh changes</tspan></text>
<text x="684" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">the hook, before each call</tspan></text>
<text x="972" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">refused, so it uses</tspan></text>
<text x="972" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">pkit's commands</tspan></text>
<line x1="80" y1="580" x2="1200" y2="580" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="625" font-size="20"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Limit  </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">A deny stops the forms of a command pkit can tell. A command hidden behind another can slip past.</tspan></text>
</svg>
