<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How capabilities work together</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">How capabilities work together</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">A capability never names another, only a role.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">One that needs something opens a slot, and any other can fill it.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">In project-kit: 3 roles, each played by one capability, and 6 slots, 4 of them filled.</tspan></text>
<rect x="464" y="216" width="352" height="270" rx="8" fill="#332215"/>
<text x="484" y="254" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#f7caa9">project-management</tspan></text>
<rect x="484" y="264" width="229.2" height="32" rx="8" fill="#121416"/>
<text x="496" y="286" font-size="18"><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">pkit::work-tracking</tspan></text>
<rect x="484" y="308" width="312" height="44" rx="8" fill="#121416"/>
<text x="500" y="337" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">the docs a change must update</tspan></text>
<rect x="484" y="362" width="312" height="44" rx="8" fill="#121416"/>
<text x="500" y="391" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">which agent fixes each doc</tspan></text>
<rect x="484" y="416" width="312" height="44" rx="8" fill="#121416"/>
<text x="500" y="445" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">the use cases to plan from</tspan></text>
<rect x="80" y="282" width="256" height="96" rx="8" fill="#332215"/>
<text x="100" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#f7caa9">living-docs</tspan></text>
<rect x="100" y="330" width="229.2" height="32" rx="8" fill="#121416"/>
<text x="112" y="352" font-size="18"><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">pkit::documentation</tspan></text>
<rect x="80" y="390" width="256" height="96" rx="8" fill="#332215"/>
<text x="100" y="428" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#f7caa9">software-analysis</tspan></text>
<rect x="100" y="438" width="175.2" height="32" rx="8" fill="#121416"/>
<text x="112" y="460" font-size="18"><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">pkit::analysis</tspan></text>
<path d="M 336 330 L 474 330" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 484 330 L 474 335 L 474 325 Z" fill="#af91ee"/>
<path d="M 400 330 L 400 377" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 400 377 L 474 377" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 484 377 L 474 382 L 474 372 Z" fill="#af91ee"/>
<circle cx="400" cy="330" r="4" fill="#af91ee"/>
<path d="M 336 438 L 474 438" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 484 438 L 474 443 L 474 433 Z" fill="#af91ee"/>
<path d="M 432 438 L 432 391" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 432 391 L 474 391" fill="none" stroke="#af91ee" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 484 391 L 474 396 L 474 386 Z" fill="#af91ee"/>
<circle cx="432" cy="438" r="4" fill="#af91ee"/>
<rect x="80" y="512" width="736" height="128" rx="8" fill="#1e2124"/>
<text x="104" y="546" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> status</tspan></text>
<text x="104" y="570" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">    pkit::work-tracking:fixers</tspan></text>
<text x="104" y="594" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">      bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#eeae7e">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="104" y="618" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">      bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#eeae7e">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="848" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Swap a capability for one in the</tspan></text>
<text x="884" y="264" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">same role.</tspan></text>
<text x="848" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Install only what you need.</tspan></text>
<text x="848" y="376" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="376" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">pkit validate checks the wiring.</tspan></text>
<text x="848" y="546" font-size="20"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Limit  </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Each role has one capability so far,</tspan></text>
<text x="848" y="574" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">so swapping one for another is designed,</tspan></text>
<text x="848" y="602" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">not yet shown.</tspan></text>
</svg>
