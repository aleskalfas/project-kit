<text x="104" y="618" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">      bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#eeae7e">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="848" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Capability vyměníte za jinou ve</tspan></text>
<text x="884" y="264" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">stejné roli.</tspan></text>
<text x="848" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Instalujete jen to, co</tspan></text>
<text x="884" y="352" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">potřebujete.</tspan></text>
<text x="848" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#9b9fa3">✓</tspan></text>
<text x="884" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">pkit validate zapojení</tspan></text>
<text x="884" y="440" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">zkontroluje.</tspan></text>
<text x="848" y="546" font-size="20"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Omezení  </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Každou roli zatím hraje jen</tspan></text>
<text x="848" y="574" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">jedna capability. Výměna je tedy</tspan></text>
<text x="848" y="602" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">navržená, ale ještě nevyzkoušená.</tspan></text>
