<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Jak je pkit poskládaný</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Jak je pkit poskládaný</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Skládá se z pěti vrstev, od vašich rozhodnutí až po váš kód.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Každá vrstva provádí to, co určují vrstvy nad ní.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">pkit zapsal toto pořadí jako své vlastní rozhodnutí, COR-065.</tspan></text>
<rect x="688" y="216" width="384" height="76" rx="8" fill="#03402d"/>
<text x="880" y="249" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Rozhodnutí</tspan></text>
<text x="880" y="275" font-size="20" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">Co jste schválili a proč.</tspan></text>
<rect x="656" y="300" width="448" height="76" rx="8" fill="#047252"/>
<text x="880" y="333" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Pracovní pravidla · schémata · procesy</tspan></text>
<text x="880" y="359" font-size="20" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">Co přesně má dělat každá session i nástroj.</tspan></text>
<rect x="624" y="384" width="512" height="76" rx="8" fill="#39a37c"/>
<text x="880" y="417" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Skilly · agenti · oprávnění</tspan></text>
<text x="880" y="443" font-size="20" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Jak agenti jednají, v jaké roli a s jakými právy.</tspan></text>
<rect x="592" y="468" width="576" height="76" rx="8" fill="#8dceb1"/>
<text x="880" y="501" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Příkazy a kontroly pkitu</tspan></text>
<text x="880" y="527" font-size="20" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Provádějí, co jste rozhodli, a kontrolují každou změnu.</tspan></text>
<rect x="560" y="552" width="640" height="76" rx="8" fill="#d9f2e6"/>
<text x="880" y="585" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Váš kód a dokumenty</tspan></text>
<text x="880" y="611" font-size="20" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Samotná práce, navázaná na to, na čem závisí.</tspan></text>
<rect x="81" y="217" width="446" height="122" rx="8" fill="none" stroke="#65696f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="104" y="256" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Kde vznikají nápady</tspan></text>
<text x="104" y="288" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">V rozhovoru. A když nápad potřebuje víc času,</tspan></text>
<text x="104" y="316" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">v poznámce ve scratchpadu.</tspan></text>
<path d="M 530 254 L 674 254" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 686 254 L 674 260 L 674 248 Z" fill="#4f5358"/>
<text x="104" y="404" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Provádění</tspan></text>
<text x="104" y="436" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Důvody zůstávají na jednom místě. Agent si je tam</tspan></text>
<text x="104" y="464" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">přečte dřív, než cokoli změní.</tspan></text>
<path d="M 82 386 L 82 460" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 82 472 L 76 460 L 88 460 Z" fill="#4f5358"/>
<text x="104" y="536" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Kontrola</tspan></text>
<text x="104" y="568" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Když vrstva nesedí s rozhodnutím, nejdřív se</tspan></text>
<text x="104" y="596" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">prověří vrstva. Rozhodnutí se tak nikdy</tspan></text>
<text x="104" y="624" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">nepřizpůsobí kódu. Změnit ho můžete jen vy.</tspan></text>
<path d="M 82 632 L 82 530" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 82 518 L 88 530 L 76 530 Z" fill="#4f5358"/>
</svg>
