<text x="104" y="546" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> status</tspan></text>
