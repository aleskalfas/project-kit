<text x="104" y="618" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">      bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#904c03">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> (contributes)</tspan></text>
<text x="848" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#65696f">✓</tspan></text>
<text x="884" y="232" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Capability vyměníte za jinou ve</tspan></text>
<text x="884" y="264" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">stejné roli.</tspan></text>
<text x="848" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#65696f">✓</tspan></text>
<text x="884" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Instalujete jen to, co</tspan></text>
<text x="884" y="352" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">potřebujete.</tspan></text>
<text x="848" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#65696f">✓</tspan></text>
<text x="884" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">pkit validate zapojení</tspan></text>
<text x="884" y="440" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">zkontroluje.</tspan></text>
<text x="848" y="546" font-size="20"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Omezení  </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Každou roli zatím hraje jen</tspan></text>
<text x="848" y="574" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">jedna capability. Výměna je tedy</tspan></text>
<text x="848" y="602" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">navržená, ale ještě nevyzkoušená.</tspan></text>
