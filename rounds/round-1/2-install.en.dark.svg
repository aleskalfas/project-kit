<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Install pkit</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Install pkit</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Install the tool once, then add pkit to each project with one command.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Upgrades replace pkit's files, never yours.</tspan></text>
<text x="80" y="688" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">pkit status shows what pkit set up in a project. Optional parts, called capabilities, come later.</tspan></text>
<rect x="80" y="216" width="736" height="104" rx="8" fill="#1e2124"/>
<text x="104" y="250" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3"># once, on your machine</tspan></text>
<text x="104" y="274" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">uv tool install</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> \</tspan></text>
<text x="104" y="298" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">    git+ssh://git@github.com/aleskalfas/project-kit.git@latest</tspan></text>
<rect x="848" y="216" width="352" height="104" rx="8" fill="#1e2124"/>
<text x="872" y="250" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3"># in each project</tspan></text>
<text x="872" y="274" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">cd</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> your-project</tspan></text>
<text x="872" y="298" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit init</tspan></text>
<rect x="80" y="344" width="736" height="296" rx="8" fill="#1e2124"/>
<text x="104" y="378" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">tree</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> -a -L 2 your-project</tspan></text>
<text x="104" y="402" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">your-project/</tspan></text>
<text x="104" y="426" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">.pkit/</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">                      # the methodology</tspan></text>
<text x="104" y="450" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">agents/     </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● core/   </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ project/</tspan></text>
<text x="104" y="474" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">decisions/  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● core/   </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ project/</tspan></text>
<text x="104" y="498" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">rules/      </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● core.md </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ project.md</tspan></text>
<text x="104" y="522" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">│   └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">…</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">                   # and more of both</tspan></text>
<text x="104" y="546" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">.claude/settings.json</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">       # </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ yours</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">, </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● pkit's</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3"> merged in</tspan></text>
<text x="104" y="570" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ CLAUDE.md</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">                 # loads the rules</tspan></text>
<text x="104" y="594" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">└── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ src/</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">                      # your code, untouched</tspan></text>
<text x="104" y="618" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3"># </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#c6affa">● pkit's files</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">, replaced by each upgrade · </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#93c1fc">○ your files</tspan></text>
<rect x="848.5" y="344.5" width="351" height="295" rx="8" fill="none" stroke="#35383c" stroke-width="1"/>
<text x="872" y="384" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Don't want pkit</tspan></text>
<text x="872" y="414" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">in your repository?</tspan></text>
<rect x="872" y="442" width="304" height="40" rx="8" fill="#1e2124"/>
<text x="888" y="468" font-size="18" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit visibility private</tspan></text>
<text x="872" y="523" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">pkit stays only in your clone, hidden</tspan></text>
<text x="872" y="551" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">by git's exclude file. Nothing of it is</tspan></text>
<text x="872" y="579" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">committed, and your agent still uses</tspan></text>
<text x="872" y="607" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">all of it.</tspan></text>
</svg>
