<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Jak capabilities spolupracují</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Jak capabilities spolupracují</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Capability nikdy nejmenuje jinou capability, jen roli.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Když něco potřebuje, otevře slot. Vyplní ho kterákoli jiná.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9ea2a6">V project-kitu: každou ze 3 rolí zatím hraje jedna capability, výměna je tedy navržená, ne vyzkoušená.</tspan></text>
<rect x="560" y="224" width="640" height="268" rx="8" fill="#1c1e21"/>
<rect x="573" y="237" width="614" height="46" rx="7" fill="#121416" stroke="#7c8186" stroke-width="2"/>
<text x="584" y="268" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">doc-check</tspan></text>
<text x="726.8" y="268" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">které dokumenty změna upraví</tspan></text>
<rect x="573" y="293" width="614" height="46" rx="7" fill="#113124" stroke="#82d9b4" stroke-width="2"/>
<text x="584" y="324" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#82d9b4">fixers</tspan></text>
<text x="726.8" y="324" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">který agent opraví dokument</tspan></text>
<rect x="573" y="349" width="614" height="46" rx="7" fill="#121416" stroke="#7c8186" stroke-width="2"/>
<text x="584" y="380" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">use-cases</tspan></text>
<text x="726.8" y="380" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">případy užití k plánování</tspan></text>
<rect x="572" y="408" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="596" y="438" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="636.8" y="438" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::work-tracking</tspan></text>
<text x="596" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">project-management</tspan></text>
<text x="948" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">otevírá 3 sloty</tspan></text>
<rect x="80" y="224" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="104" y="254" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="144.8" y="254" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::documentation</tspan></text>
<text x="104" y="282" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">living-docs</tspan></text>
<rect x="80" y="336" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="104" y="366" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="144.8" y="366" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::analysis</tspan></text>
<text x="104" y="394" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">software-analysis</tspan></text>
