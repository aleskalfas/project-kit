<text x="584" y="532" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9ea2a6">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit status</tspan></text>
<text x="584" y="560" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="584" y="588" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="1176" y="532" font-size="22" text-anchor="end"><tspan font-family="Source Code Pro" font-weight="400" fill="#9ea2a6"># pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#82d9b4">fixers</tspan></text>
<text x="80" y="468" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Co vám to dá</tspan></text>
<text x="80" y="508" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Vyměňte ji za jinou ve stejné roli.</tspan></text>
<text x="80" y="548" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Instalujte jen to, co potřebujete.</tspan></text>
<text x="80" y="588" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit validate</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1"> zapojení zkontroluje.</tspan></text>
