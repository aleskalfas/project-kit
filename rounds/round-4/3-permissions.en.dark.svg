<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Where permissions come from</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Where permissions come from</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">From rules your project writes down as data.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Your AI tool applies them to every call, so they hold when an agent forgets them.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">In project-kit: Claude Code's settings, written by pkit from this data, hold 14 denies and 62 allows.</tspan></text>
<text x="344" y="241" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Written as data</tspan></text>
<rect x="344" y="258" width="264" height="2" fill="#79bfa1"/>
<path d="M 608 259 L 628 259" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 640 259 L 628 264.4 L 628 253.6 Z" fill="#bbbec2"/>
<text x="640" y="241" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Your AI tool gets</tspan></text>
<rect x="640" y="258" width="264" height="2" fill="#57ac89"/>
<path d="M 904 259 L 924 259" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 936 259 L 924 264.4 L 924 253.6 Z" fill="#bbbec2"/>
<text x="936" y="241" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">A call meets</tspan></text>
<rect x="936" y="258" width="264" height="2" fill="#369974"/>
<text x="80" y="309" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Guardrails</tspan></text>
<text x="80" y="339" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">for you and every agent</tspan></text>
<text x="344" y="309" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">rm -r</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">sudo</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">,</tspan></text>
<text x="344" y="341" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">git push -f</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">: denied</tspan></text>
<text x="640" y="309" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">a deny in its settings</tspan></text>
<circle cx="947" cy="301" r="11" fill="#edeff1"/>
<rect x="941" y="299.5" width="12" height="3" rx="1.5" fill="#121416"/>
<text x="970" y="309" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Refused</tspan></text>
<text x="936" y="341" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#91debc">in every mode</tspan></text>
<text x="80" y="397" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">An agent's own tools</tspan></text>
<text x="80" y="427" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">in the agent's file</tspan></text>
<text x="344" y="397" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">critic</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">: only </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">Read</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">,</tspan></text>
<text x="344" y="429" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">Glob</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">Grep</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">WebFetch</tspan></text>
<text x="640" y="397" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">its list of tools</tspan></text>
<circle cx="947" cy="389" r="11" fill="#edeff1"/>
<rect x="941" y="387.5" width="12" height="3" rx="1.5" fill="#121416"/>
<text x="970" y="397" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Refused</tspan></text>
<text x="936" y="429" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#91debc">any tool not listed</tspan></text>
<text x="80" y="485" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">One agent's rule</tspan></text>
<text x="80" y="515" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">from project-management</tspan></text>
<text x="344" y="485" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">project-manager</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">:</tspan></text>
<text x="344" y="517" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">no raw </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">gh</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1"> changes</tspan></text>
<text x="640" y="485" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">a hook, before each call</tspan></text>
<circle cx="947" cy="477" r="11" fill="#edeff1"/>
<rect x="941" y="475.5" width="12" height="3" rx="1.5" fill="#121416"/>
<text x="970" y="485" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Refused</tspan></text>
<text x="936" y="517" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#91debc">uses pkit's commands</tspan></text>
<rect x="80" y="550" width="1120" height="2" fill="#3a3d41"/>
<text x="80" y="593" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Limit: </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">a deny stops the forms of a command pkit can tell. One hidden behind another can slip past.</tspan></text>
</svg>
