<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Jak capabilities spolupracují</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Jak capabilities spolupracují</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Capability nikdy nejmenuje jinou capability, jen roli.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Když něco potřebuje, otevře slot. Vyplní ho kterákoli jiná.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f6469">V project-kitu: každou ze 3 rolí zatím hraje jedna capability, výměna je tedy navržená, ne vyzkoušená.</tspan></text>
<rect x="428" y="225" width="505" height="226" rx="8" fill="#ffffff" stroke="#777b7f" stroke-width="2"/>
<text x="451" y="254" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Role </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">pkit::work-tracking</tspan></text>
<text x="451" y="282" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">project-management</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358"> otevírá 3 sloty</tspan></text>
<rect x="429" y="295" width="503" height="2" fill="#777b7f"/>
<text x="451" y="329" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">doc-check</tspan></text>
<text x="593.8" y="329" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">které dokumenty změna upraví</tspan></text>
<rect x="429" y="347" width="503" height="2" fill="#c8cbce"/>
<path d="M 429 349 L 932 349 L 932 399 L 429 399 L 429 349 Z" fill="#dff7eb"/>
<text x="451" y="381" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="593.8" y="381" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">který agent opraví dokument</tspan></text>
<rect x="429" y="399" width="503" height="2" fill="#c8cbce"/>
<text x="451" y="433" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">use-cases</tspan></text>
<text x="593.8" y="433" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">případy užití k plánování</tspan></text>
<rect x="81" y="297" width="297" height="70" rx="8" fill="#ffffff" stroke="#777b7f" stroke-width="2"/>
<text x="104" y="326" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">pkit::documentation</tspan></text>
<text x="104" y="354" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">living-docs</tspan></text>
<rect x="81" y="381" width="297" height="70" rx="8" fill="#ffffff" stroke="#777b7f" stroke-width="2"/>
<text x="104" y="410" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">pkit::analysis</tspan></text>
<text x="104" y="438" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">software-analysis</tspan></text>
<path d="M 379 322 L 415 322" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 322 L 415 327.4 L 415 316.6 Z" fill="#4f5358"/>
<path d="M 379 342 L 395 342 A 8 8 0 0 1 403 350 L 403 356 A 8 8 0 0 0 411 364 L 415 364" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 364 L 415 369.4 L 415 358.6 Z" fill="#4f5358"/>
<path d="M 379 426 L 415 426" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 426 L 415 431.4 L 415 420.6 Z" fill="#4f5358"/>
<path d="M 379 406 L 395 406 A 8 8 0 0 0 403 398 L 403 392 A 8 8 0 0 1 411 384 L 415 384" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 384 L 415 389.4 L 415 378.6 Z" fill="#4f5358"/>
<rect x="80" y="476" width="854" height="130" rx="8" fill="#e3e5e7"/>
<path d="M 80 527.84 L 934 527.84 L 934 598 A 8 8 0 0 1 926 606 L 88 606 A 8 8 0 0 1 80 598 L 80 527.84 Z" fill="#dff7eb"/>
<text x="104" y="511" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="104" y="556" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">                     bound    </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> (contributes)</tspan></text>
<text x="104" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">                     bound    </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> (contributes)</tspan></text>
<text x="966" y="241" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Co vám to dá</tspan></text>
<text x="966" y="277" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Vyměňte ji za jinou</tspan></text>
<text x="966" y="309" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">ve stejné roli.</tspan></text>
<text x="966" y="349" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Instalujte jen to,</tspan></text>
<text x="966" y="381" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">co potřebujete.</tspan></text>
<text x="966" y="421" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">pkit validate</tspan></text>
<text x="966" y="453" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">zapojení zkontroluje.</tspan></text>
<text x="966" y="556" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f6469">Výpis </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">pkit status</tspan></text>
<text x="966" y="584" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f6469">pro tento slot.</tspan></text>
</svg>
