<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Install pkit</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Install pkit</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Install the tool once, then add pkit to each project with one command.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Upgrades replace pkit's files, never yours.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f6469">In project-kit: 69 of pkit's decisions sit beside 13 of the project's own, in the same folder.</tspan></text>
<circle cx="98" cy="242" r="18" fill="#181b1f"/>
<text x="98" y="250" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">1</tspan></text>
<text x="132" y="250" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Once, on your machine</tspan></text>
<rect x="80" y="272" width="1052" height="57" rx="8" fill="#e3e5e7"/>
<text x="104" y="307" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">uv tool install git+ssh://git@github.com/aleskalfas/project-kit.git@latest</tspan></text>
<circle cx="98" cy="371" r="18" fill="#181b1f"/>
<text x="98" y="379" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">2</tspan></text>
<text x="132" y="379" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">In each project</tspan></text>
<rect x="80" y="401" width="273" height="85" rx="8" fill="#e3e5e7"/>
<text x="104" y="436" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">cd </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">your-project</tspan></text>
<text x="104" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit init</tspan></text>
<text x="656" y="379" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Then each project holds</tspan></text>
<text x="656" y="416" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/</tspan></text>
<text x="656" y="444" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">decisions/</tspan></text>
<text x="656" y="472" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">core/</tspan></text>
<text x="933.6" y="472" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#047554">pkit's</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#047554">, replaced</tspan></text>
<text x="656" y="500" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">│   └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">project/</tspan></text>
<text x="933.6" y="500" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">yours</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, untouched</tspan></text>
<text x="656" y="528" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">└── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">rules/</tspan></text>
<text x="656" y="556" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">    ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">core.md</tspan></text>
<text x="933.6" y="556" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#047554">pkit's</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#047554">, replaced</tspan></text>
<text x="656" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">    └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">project.md</tspan></text>
<text x="933.6" y="584" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">yours</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, untouched</tspan></text>
<text x="80" y="533" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">To keep pkit out of your repository:</tspan></text>
<rect x="80" y="549" width="378" height="57" rx="8" fill="#e3e5e7"/>
<text x="104" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f6469">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit visibility private</tspan></text>
</svg>
