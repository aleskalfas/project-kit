<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How capabilities work together</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">How capabilities work together</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">A capability never names another, only a role.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">One that needs something opens a slot, and any other can fill it.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">In project-kit: each of its 3 roles has one capability so far, so a swap is designed, not yet shown.</tspan></text>
<rect x="428" y="225" width="505" height="226" rx="8" fill="#121416" stroke="#777b7f" stroke-width="2"/>
<text x="451" y="254" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Role </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit::work-tracking</tspan></text>
<text x="451" y="282" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">project-management</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2"> opens 3 slots</tspan></text>
<rect x="429" y="295" width="503" height="2" fill="#777b7f"/>
<text x="451" y="329" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">doc-check</tspan></text>
<text x="593.8" y="329" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">the docs a change must update</tspan></text>
<rect x="429" y="347" width="503" height="2" fill="#3a3d41"/>
<path d="M 429 349 L 932 349 L 932 399 L 429 399 L 429 349 Z" fill="#112d21"/>
<text x="451" y="381" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#91debc">fixers</tspan></text>
<text x="593.8" y="381" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">which agent fixes each doc</tspan></text>
<rect x="429" y="399" width="503" height="2" fill="#3a3d41"/>
<text x="451" y="433" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">use-cases</tspan></text>
<text x="593.8" y="433" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">the use cases to plan from</tspan></text>
<rect x="81" y="297" width="297" height="70" rx="8" fill="#121416" stroke="#777b7f" stroke-width="2"/>
<text x="104" y="326" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit::documentation</tspan></text>
<text x="104" y="354" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">living-docs</tspan></text>
<rect x="81" y="381" width="297" height="70" rx="8" fill="#121416" stroke="#777b7f" stroke-width="2"/>
<text x="104" y="410" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit::analysis</tspan></text>
<text x="104" y="438" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">software-analysis</tspan></text>
<path d="M 379 322 L 415 322" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 322 L 415 327.4 L 415 316.6 Z" fill="#bbbec2"/>
<path d="M 379 342 L 395 342 A 8 8 0 0 1 403 350 L 403 356 A 8 8 0 0 0 411 364 L 415 364" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 364 L 415 369.4 L 415 358.6 Z" fill="#bbbec2"/>
<path d="M 379 426 L 415 426" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 426 L 415 431.4 L 415 420.6 Z" fill="#bbbec2"/>
<path d="M 379 406 L 395 406 A 8 8 0 0 0 403 398 L 403 392 A 8 8 0 0 1 411 384 L 415 384" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 427 384 L 415 389.4 L 415 378.6 Z" fill="#bbbec2"/>
<rect x="80" y="476" width="854" height="130" rx="8" fill="#27292c"/>
<path d="M 80 527.84 L 934 527.84 L 934 598 A 8 8 0 0 1 926 606 L 88 606 A 8 8 0 0 1 80 598 L 80 527.84 Z" fill="#112d21"/>
<text x="104" y="511" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#91debc">fixers</tspan></text>
<text x="104" y="556" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">                     bound    </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="104" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">                     bound    </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="966" y="241" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">What it gives you</tspan></text>
<text x="966" y="277" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Swap one for another</tspan></text>
<text x="966" y="309" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">in the same role.</tspan></text>
<text x="966" y="349" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Install only what</tspan></text>
<text x="966" y="381" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">you need.</tspan></text>
<text x="966" y="421" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit validate</tspan></text>
<text x="966" y="453" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">checks the wiring.</tspan></text>
<text x="966" y="556" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">What </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">pkit status</tspan></text>
<text x="966" y="584" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">prints for this slot.</tspan></text>
</svg>
