<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How pkit fits together</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">How pkit fits together</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">In five layers, from your decisions down to your code:</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">each carries out the ones above it.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">In project-kit: this order is itself written down as one of its decisions.</tspan></text>
<rect x="448" y="224" width="384" height="70" rx="8" fill="#bee5d3"/>
<text x="640" y="253" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">Decisions</tspan></text>
<text x="640" y="281" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">Choices you accepted, and why.</tspan></text>
<rect x="416" y="302" width="448" height="70" rx="8" fill="#9cd2ba"/>
<text x="640" y="331" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">Working rules · schemas · processes</tspan></text>
<text x="640" y="359" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">Exactly what to do, in every session.</tspan></text>
<rect x="384" y="380" width="512" height="70" rx="8" fill="#79bfa1"/>
<text x="640" y="409" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">Skills · agents · permissions</tspan></text>
<text x="640" y="437" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">How agents act, and with what rights.</tspan></text>
<rect x="352" y="458" width="576" height="70" rx="8" fill="#57ac89"/>
<text x="640" y="487" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">pkit's commands and checks</tspan></text>
<text x="640" y="515" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">Carry out decisions, and check each change.</tspan></text>
<rect x="320" y="536" width="640" height="70" rx="8" fill="#369974"/>
<text x="640" y="565" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">Your code and documents</tspan></text>
<text x="640" y="593" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">The work itself, tied to what it depends on.</tspan></text>
<path d="M 448 286 L 424 286 A 24 24 0 0 0 400 310 L 400 364 L 392 364 A 24 24 0 0 0 368 388 L 368 442 L 360 442 A 24 24 0 0 0 336 466 L 336 524" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 336 536 L 330.6 524 L 341.4 524 Z" fill="#bbbec2"/>
<path d="M 944 536 L 944 466 A 24 24 0 0 0 920 442 L 912 442 L 912 388 A 24 24 0 0 0 888 364 L 880 364 L 880 310 A 24 24 0 0 0 856 286 L 844 286" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 832 286 L 844 280.6 L 844 291.4 Z" fill="#bbbec2"/>
<rect x="81" y="225" width="259" height="118" rx="8" fill="none" stroke="#777b7f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="104" y="260" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Where ideas start</tspan></text>
<text x="104" y="292" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">In conversation,</tspan></text>
<text x="104" y="324" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">or a scratchpad note.</tspan></text>
<path d="M 341 259 L 436 259" fill="none" stroke="#bbbec2" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 448 259 L 436 264.4 L 436 253.6 Z" fill="#bbbec2"/>
<text x="80" y="529" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Carried out</tspan></text>
<text x="80" y="561" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">An agent reads</tspan></text>
<text x="80" y="593" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">the reasons first.</tspan></text>
<text x="992" y="529" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">If they disagree</tspan></text>
<text x="992" y="561" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">the layer is</tspan></text>
<text x="992" y="593" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">checked first.</tspan></text>
</svg>
