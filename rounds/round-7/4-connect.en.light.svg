<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How capabilities work together</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#171b20">How capabilities work together</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">A capability never names another, only a role.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">One that needs something opens a slot, and any other can fill it.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f646a">In project-kit: each of its 3 roles has one capability so far, so a swap is designed, not yet shown.</tspan></text>
<rect x="560" y="224" width="640" height="252" rx="8" fill="#f3f4f6"/>
<rect x="573" y="237" width="614" height="42" rx="7" fill="#ffffff" stroke="#767b80" stroke-width="2"/>
<text x="596" y="266" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">doc-check</tspan></text>
<text x="738.8" y="266" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">the docs a change must update</tspan></text>
<rect x="573" y="289" width="614" height="42" rx="7" fill="#dcf8ea" stroke="#047554" stroke-width="2"/>
<text x="596" y="318" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="738.8" y="318" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">which agent fixes each doc</tspan></text>
<rect x="573" y="341" width="614" height="42" rx="7" fill="#ffffff" stroke="#767b80" stroke-width="2"/>
<text x="596" y="370" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">use-cases</tspan></text>
<text x="738.8" y="370" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">the use cases to plan from</tspan></text>
<rect x="572" y="396" width="352" height="68" rx="8" fill="#1e2a39"/>
<text x="596" y="424" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="636.8" y="424" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::work-tracking</tspan></text>
<text x="596" y="452" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">project-management</tspan></text>
<text x="948" y="452" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">opens 3 slots</tspan></text>
<rect x="80" y="224" width="352" height="68" rx="8" fill="#1e2a39"/>
<text x="104" y="252" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="144.8" y="252" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::documentation</tspan></text>
<text x="104" y="280" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">living-docs</tspan></text>
<rect x="80" y="328" width="352" height="68" rx="8" fill="#1e2a39"/>
<text x="104" y="356" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="144.8" y="356" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::analysis</tspan></text>
<text x="104" y="384" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">software-analysis</tspan></text>
<path d="M 432 258 L 560 258" fill="none" stroke="#767b80" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 258 L 560 263.4 L 560 252.6 Z" fill="#767b80"/>
<path d="M 432 258 L 476 258 A 16 16 0 0 1 492 274 L 492 286 A 16 16 0 0 0 508 302 L 560 302" fill="none" stroke="#767b80" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 302 L 560 307.4 L 560 296.6 Z" fill="#767b80"/>
<path d="M 432 362 L 560 362" fill="none" stroke="#767b80" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 362 L 560 367.4 L 560 356.6 Z" fill="#767b80"/>
<path d="M 432 362 L 476 362 A 16 16 0 0 0 492 346 L 492 334 A 16 16 0 0 1 508 318 L 560 318" fill="none" stroke="#767b80" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 318 L 560 323.4 L 560 312.6 Z" fill="#767b80"/>
<rect x="560" y="492" width="640" height="108" rx="8" fill="#e2e9f0"/>
<text x="584" y="524" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="584" y="552" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056"> (contributes)</tspan></text>
<text x="584" y="580" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056"> (contributes)</tspan></text>
<text x="80" y="460" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#171b20">What it gives you</tspan></text>
<text x="80" y="500" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Swap one for another in the same role.</tspan></text>
<text x="80" y="540" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Install only what you need.</tspan></text>
<text x="80" y="580" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#171b20">pkit validate</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20"> checks the wiring.</tspan></text>
</svg>
