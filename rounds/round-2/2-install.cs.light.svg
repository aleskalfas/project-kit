<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Instalace pkitu</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Instalace pkitu</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu jedním příkazem.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Upgrade mění jen soubory pkitu, nikdy vaše.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">V project-kitu: 69 rozhodnutí pkitu leží v core/, vedle 13 vlastních rozhodnutí projektu v project/.</tspan></text>
<circle cx="98" cy="226" r="18" fill="#181b1f"/>
<text x="98" y="234" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">1</tspan></text>
<text x="132" y="234" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Jednou, na vašem počítači</tspan></text>
<circle cx="674" cy="226" r="18" fill="#181b1f"/>
<text x="674" y="234" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">2</tspan></text>
<text x="708" y="234" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">V každém projektu</tspan></text>
<rect x="80" y="260" width="544" height="113" rx="8" fill="#f2f4f6"/>
<text x="104" y="295" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">uv tool install</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> git+ssh://\</tspan></text>
<text x="104" y="323" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">&gt; </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">git@github.com/aleskalfas/\</tspan></text>
<text x="104" y="351" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">&gt; </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358">project-kit.git@latest</tspan></text>
<rect x="656" y="260" width="544" height="113" rx="8" fill="#f2f4f6"/>
<text x="680" y="295" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">cd</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> your-project</tspan></text>
<text x="680" y="323" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit init</tspan></text>
<text x="80" y="429" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#6e44b0">Soubory pkitu</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, které každý upgrade nahradí</tspan></text>
<rect x="80" y="449" width="4" height="85" rx="2" fill="#7c53c0"/>
<text x="104" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">.pkit/decisions/core/</tspan></text>
<text x="104" y="492" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">.pkit/rules/core.md</tspan></text>
<text x="104" y="520" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">.pkit/skills/core/</tspan></text>
<text x="104" y="548" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0"></tspan></text>
<text x="656" y="429" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Vaše soubory</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, na které pkit nesahá</tspan></text>
<rect x="656" y="449" width="4" height="113" rx="2" fill="#7d8085"/>
<text x="680" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/decisions/project/</tspan></text>
<text x="680" y="492" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/rules/project.md</tspan></text>
<text x="680" y="520" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/skills/project/</tspan></text>
<text x="680" y="548" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">src/</tspan></text>
<text x="80" y="600" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Nechcete pkit v repozitáři? </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit visibility private</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358"> ho nechá jen ve vašem klonu.</tspan></text>
</svg>
