<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Odkud se berou oprávnění</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Odkud se berou oprávnění</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Z pravidel, která projekt zapíše jako data.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">AI nástroj je uplatní při každém volání, i když na ně agent zapomene.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">V project-kitu: nastavení Claude Code, které z těchto dat zapsal pkit, má 14 zákazů a 63 povolení.</tspan></text>
<path d="M 376 208 L 624 208 L 640 232 L 624 256 L 376 256 Q 368 256 368 248 L 368 216 Q 368 208 376 208 Z" fill="#016c4d"/>
<text x="396" y="240" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Zapsáno jako data</tspan></text>
<path d="M 672 208 L 912 208 L 928 232 L 912 256 L 656 256 L 672 232 L 656 208 Z" fill="#07835e"/>
<text x="684" y="240" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">AI nástroj dostane</tspan></text>
<path d="M 960 208 L 1192 208 Q 1200 208 1200 216 L 1200 248 Q 1200 256 1192 256 L 944 256 L 960 232 L 944 208 Z" fill="#47a17e"/>
<text x="972" y="240" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Výsledek volání</tspan></text>
<line x1="80" y1="272" x2="1200" y2="272" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="312" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Pojistky</tspan></text>
<text x="80" y="340" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">pro vás i každého agenta</tspan></text>
<text x="396" y="312" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">rm -r</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">, </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">sudo</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">,</tspan></text>
<text x="396" y="344" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">force-push: zakázané</tspan></text>
<text x="684" y="312" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">zákaz v nastavení</tspan></text>
<text x="972" y="312" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">odmítnuto v každém</tspan></text>
<text x="972" y="344" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">režimu</tspan></text>
<line x1="80" y1="368" x2="1200" y2="368" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Vlastní nástroje agenta</tspan></text>
<text x="80" y="436" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">v souboru agenta</tspan></text>
<text x="396" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">critic: Read, Glob,</tspan></text>
<text x="396" y="440" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Grep, WebFetch</tspan></text>
<text x="684" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">jeho seznam nástrojů</tspan></text>
<text x="972" y="408" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">žádný příkaz,</tspan></text>
<text x="972" y="440" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">žádný zápis</tspan></text>
<line x1="80" y1="464" x2="1200" y2="464" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Pravidlo jednoho agenta</tspan></text>
<text x="80" y="532" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">z project-management</tspan></text>
<text x="396" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">project-manager: bez</tspan></text>
<text x="396" y="536" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">přímého </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">gh</tspan></text>
<text x="684" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">hook, před</tspan></text>
<text x="684" y="536" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">každým voláním</tspan></text>
<text x="972" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">odmítnuto, použije</tspan></text>
<text x="972" y="536" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">příkazy pkitu</tspan></text>
<line x1="80" y1="560" x2="1200" y2="560" stroke="#d5d8db" stroke-width="1"/>
<text x="80" y="600" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Omezení: </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">zákaz zastaví jen podoby příkazu, které pkit pozná. Příkaz schovaný za jiným může proklouznout.</tspan></text>
</svg>
