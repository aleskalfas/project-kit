<text x="976" y="228" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Vyměňte ji za jinou ve</tspan></text>
<text x="976" y="260" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">stejné roli.</tspan></text>
