<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Jak capabilities spolupracují</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Jak capabilities spolupracují</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Capability nikdy nejmenuje jinou capability, jen roli.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Když něco potřebuje, otevře slot. Vyplní ho kterákoli jiná.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">V project-kitu: každou ze 3 rolí zatím hraje jedna capability, výměna je tedy navržená, ne vyzkoušená.</tspan></text>
<rect x="80" y="467" width="1120" height="141" rx="8" fill="#f2f4f6"/>
<text x="104" y="502" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4f5358"> status</tspan></text>
<text x="104" y="530" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#125fb3">    pkit::work-tracking:fixers</tspan></text>
