<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Instalace pkitu</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Instalace pkitu</tspan></text>
<text x="80" y="136" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu jedním příkazem.</tspan></text>
<text x="80" y="168" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Upgrade mění jen soubory pkitu, nikdy vaše.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9b9fa3">V project-kitu: 69 rozhodnutí pkitu leží v core/, vedle 13 vlastních rozhodnutí projektu v project/.</tspan></text>
<circle cx="98" cy="226" r="18" fill="#edeff1"/>
<text x="98" y="234" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">1</tspan></text>
<text x="132" y="234" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Jednou, na vašem počítači</tspan></text>
<circle cx="674" cy="226" r="18" fill="#edeff1"/>
<text x="674" y="234" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#121416">2</tspan></text>
<text x="708" y="234" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">V každém projektu</tspan></text>
<rect x="80" y="260" width="544" height="113" rx="8" fill="#212326"/>
<text x="104" y="295" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">uv tool install</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> git+ssh://\</tspan></text>
<text x="104" y="323" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">&gt; </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">git@github.com/aleskalfas/\</tspan></text>
<text x="104" y="351" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">&gt; </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">project-kit.git@latest</tspan></text>
<rect x="656" y="260" width="544" height="113" rx="8" fill="#212326"/>
<text x="680" y="295" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">cd</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> your-project</tspan></text>
<text x="680" y="323" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#9b9fa3">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit init</tspan></text>
<text x="80" y="429" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#af91ee">Soubory pkitu</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">, které každý upgrade nahradí</tspan></text>
<rect x="80" y="449" width="4" height="85" rx="2" fill="#af91ee"/>
<text x="104" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#af91ee">.pkit/decisions/core/</tspan></text>
<text x="104" y="492" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#af91ee">.pkit/rules/core.md</tspan></text>
<text x="104" y="520" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#af91ee">.pkit/skills/core/</tspan></text>
<text x="104" y="548" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#af91ee"></tspan></text>
<text x="656" y="429" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">Vaše soubory</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">, na které pkit nesahá</tspan></text>
<rect x="656" y="449" width="4" height="113" rx="2" fill="#717579"/>
<text x="680" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">.pkit/decisions/project/</tspan></text>
<text x="680" y="492" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">.pkit/rules/project.md</tspan></text>
<text x="680" y="520" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">.pkit/skills/project/</tspan></text>
<text x="680" y="548" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">src/</tspan></text>
<text x="80" y="600" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">Nechcete pkit v repozitáři? </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit visibility private</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2"> ho nechá jen ve vašem klonu.</tspan></text>
</svg>
