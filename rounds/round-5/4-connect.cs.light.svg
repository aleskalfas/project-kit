<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Jak capabilities spolupracují</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#171b20">Jak capabilities spolupracují</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Capability nikdy nejmenuje jinou capability, jen roli.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Když něco potřebuje, otevře slot. Vyplní ho kterákoli jiná.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#5f646a">V project-kitu: každou ze 3 rolí zatím hraje jedna capability, výměna je tedy navržená, ne vyzkoušená.</tspan></text>
<rect x="560" y="224" width="640" height="256" rx="8" fill="#f3f4f6"/>
<rect x="573" y="237" width="614" height="46" rx="7" fill="#ffffff" stroke="#767b80" stroke-width="2"/>
<text x="584" y="268" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">doc-check</tspan></text>
<text x="726.8" y="268" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">které dokumenty změna upraví</tspan></text>
<rect x="573" y="293" width="614" height="46" rx="7" fill="#dcf8ea" stroke="#047554" stroke-width="2"/>
<text x="584" y="324" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="726.8" y="324" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">který agent opraví dokument</tspan></text>
<rect x="573" y="349" width="614" height="46" rx="7" fill="#ffffff" stroke="#767b80" stroke-width="2"/>
<text x="584" y="380" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">use-cases</tspan></text>
<text x="726.8" y="380" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">případy užití k plánování</tspan></text>
<rect x="560" y="408" width="352" height="72" rx="8" fill="#1e2a39"/>
<text x="584" y="438" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="624.8" y="438" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::work-tracking</tspan></text>
<text x="584" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">project-management</tspan></text>
<text x="936" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4b5056">otevírá 3 sloty</tspan></text>
<rect x="80" y="224" width="352" height="72" rx="8" fill="#1e2a39"/>
<text x="104" y="254" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="144.8" y="254" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::documentation</tspan></text>
<text x="104" y="282" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">living-docs</tspan></text>
<rect x="80" y="336" width="352" height="72" rx="8" fill="#1e2a39"/>
<text x="104" y="366" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">role</tspan></text>
<text x="144.8" y="366" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#ffffff">pkit::analysis</tspan></text>
<text x="104" y="394" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">software-analysis</tspan></text>
