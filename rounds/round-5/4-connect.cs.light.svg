<text x="584" y="528" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#047554">fixers</tspan></text>
<text x="584" y="556" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056"> (contributes)</tspan></text>
<text x="584" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#171b20">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#4b5056"> (contributes)</tspan></text>
<text x="1176" y="528" font-size="22" text-anchor="end"><tspan font-family="Source Code Pro" font-weight="400" fill="#5f646a"># pkit status</tspan></text>
<text x="80" y="464" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#171b20">Co vám to dá</tspan></text>
<text x="80" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Vyměňte ji za jinou ve stejné roli.</tspan></text>
<text x="80" y="544" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20">Instalujte jen to, co potřebujete.</tspan></text>
<text x="80" y="584" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#171b20">pkit validate</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#171b20"> zapojení zkontroluje.</tspan></text>
