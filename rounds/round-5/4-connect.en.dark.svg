<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How capabilities work together</title>
<rect width="1280" height="720" fill="#121416"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">How capabilities work together</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">A capability never names another, only a role.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">One that needs something opens a slot, and any other can fill it.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#9ea2a6">In project-kit: each of its 3 roles has one capability so far, so a swap is designed, not yet shown.</tspan></text>
<rect x="560" y="224" width="640" height="256" rx="8" fill="#1c1e21"/>
<rect x="573" y="237" width="614" height="46" rx="7" fill="#121416" stroke="#7c8186" stroke-width="2"/>
<text x="584" y="268" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">doc-check</tspan></text>
<text x="726.8" y="268" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">the docs a change must update</tspan></text>
<rect x="573" y="293" width="614" height="46" rx="7" fill="#113124" stroke="#82d9b4" stroke-width="2"/>
<text x="584" y="324" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#82d9b4">fixers</tspan></text>
<text x="726.8" y="324" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">which agent fixes each doc</tspan></text>
<rect x="573" y="349" width="614" height="46" rx="7" fill="#121416" stroke="#7c8186" stroke-width="2"/>
<text x="584" y="380" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">use-cases</tspan></text>
<text x="726.8" y="380" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">the use cases to plan from</tspan></text>
<rect x="560" y="408" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="584" y="438" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="624.8" y="438" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::work-tracking</tspan></text>
<text x="584" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">project-management</tspan></text>
<text x="936" y="466" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#bbbec2">opens 3 slots</tspan></text>
<rect x="80" y="224" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="104" y="254" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="144.8" y="254" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::documentation</tspan></text>
<text x="104" y="282" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">living-docs</tspan></text>
<rect x="80" y="336" width="352" height="72" rx="8" fill="#d0e0f4"/>
<text x="104" y="366" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">role</tspan></text>
<text x="144.8" y="366" font-size="22"><tspan font-family="Source Code Pro" font-weight="400" fill="#121416">pkit::analysis</tspan></text>
<text x="104" y="394" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#121416">software-analysis</tspan></text>
<path d="M 432 260 L 560 260" fill="none" stroke="#7c8186" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 260 L 560 265.4 L 560 254.6 Z" fill="#7c8186"/>
<path d="M 432 260 L 476 260 A 16 16 0 0 1 492 276 L 492 290 A 16 16 0 0 0 508 306 L 560 306" fill="none" stroke="#7c8186" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 306 L 560 311.4 L 560 300.6 Z" fill="#7c8186"/>
<path d="M 432 372 L 560 372" fill="none" stroke="#7c8186" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 372 L 560 377.4 L 560 366.6 Z" fill="#7c8186"/>
<path d="M 432 372 L 476 372 A 16 16 0 0 0 492 356 L 492 342 A 16 16 0 0 1 508 326 L 560 326" fill="none" stroke="#7c8186" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 572 326 L 560 331.4 L 560 320.6 Z" fill="#7c8186"/>
<rect x="560" y="496" width="640" height="108" rx="8" fill="#1f252a"/>
<text x="584" y="528" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">pkit::work-tracking:</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#82d9b4">fixers</tspan></text>
<text x="584" y="556" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">software-analysis</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="584" y="584" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2">  bound  </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#edeff1">living-docs</tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#bbbec2"> (contributes)</tspan></text>
<text x="1176" y="528" font-size="22" text-anchor="end"><tspan font-family="Source Code Pro" font-weight="400" fill="#9ea2a6"># pkit status</tspan></text>
<text x="80" y="464" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#edeff1">What it gives you</tspan></text>
<text x="80" y="504" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Swap one for another in the same role.</tspan></text>
<text x="80" y="544" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1">Install only what you need.</tspan></text>
<text x="80" y="584" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#edeff1">pkit validate</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#edeff1"> checks the wiring.</tspan></text>
</svg>
