<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="cs">
<title>Instalace pkitu</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Instalace pkitu</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">jedním příkazem. Upgrade mění jen soubory pkitu, nikdy vaše.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">V project-kitu: 69 rozhodnutí pkitu leží ve stejné složce vedle 13 vlastních rozhodnutí projektu.</tspan></text>
<circle cx="98" cy="242" r="18" fill="#181b1f"/>
<text x="98" y="250" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">1</tspan></text>
<text x="132" y="250" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Jednou, na vašem počítači</tspan></text>
<rect x="80.5" y="276.5" width="1119" height="56" rx="8" fill="#edeff1" stroke="#ced1d5" stroke-width="1"/>
<text x="104" y="311" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">uv tool install git+ssh://git@github.com/aleskalfas/project-kit.git@latest</tspan></text>
<circle cx="98" cy="383" r="18" fill="#181b1f"/>
<text x="98" y="391" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">2</tspan></text>
<text x="132" y="391" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">V každém projektu</tspan></text>
<rect x="80.5" y="417.5" width="447" height="84" rx="8" fill="#edeff1" stroke="#ced1d5" stroke-width="1"/>
<text x="104" y="452" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">cd </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">your-project</tspan></text>
<text x="104" y="480" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">$ </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">pkit init</tspan></text>
<text x="656" y="391" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Pak každý projekt obsahuje</tspan></text>
<text x="656" y="436" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">.pkit/</tspan></text>
<text x="656" y="464" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">decisions/</tspan></text>
<text x="656" y="492" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">core/</tspan></text>
<text x="933.6" y="492" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#6e44b0">pkitu</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, nahradí se</tspan></text>
<text x="656" y="520" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">│   └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">project/</tspan></text>
<text x="933.6" y="520" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">vaše</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, nedotčené</tspan></text>
<text x="656" y="548" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">└── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">rules/</tspan></text>
<text x="656" y="576" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">    ├── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#6e44b0">core.md</tspan></text>
<text x="933.6" y="576" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#6e44b0">pkitu</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, nahradí se</tspan></text>
<text x="656" y="604" font-size="22" xml:space="preserve"><tspan font-family="Source Code Pro" font-weight="400" fill="#65696f">    └── </tspan><tspan font-family="Source Code Pro" font-weight="400" fill="#181b1f">project.md</tspan></text>
<text x="933.6" y="604" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">vaše</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">, nedotčené</tspan></text>
<text x="80" y="572" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Když pkit v repozitáři nechcete:</tspan></text>
<text x="80" y="604" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">pkit visibility private</tspan></text>
</svg>
