<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>How pkit fits together</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">How pkit fits together</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">In five layers, from your decisions down to your code:</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">each carries out the ones above it.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">In project-kit: this order is itself written down as one of its decisions.</tspan></text>
<rect x="448" y="224" width="384" height="70" rx="8" fill="#013726"/>
<text x="640" y="253" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Decisions</tspan></text>
<text x="640" y="281" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">Choices you accepted, and why.</tspan></text>
<rect x="416" y="302" width="448" height="70" rx="8" fill="#004933"/>
<text x="640" y="331" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Working rules · schemas · processes</tspan></text>
<text x="640" y="359" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">Exactly what to do, in every session.</tspan></text>
<rect x="384" y="380" width="512" height="70" rx="8" fill="#015c41"/>
<text x="640" y="409" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Skills · agents · permissions</tspan></text>
<text x="640" y="437" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">How agents act, and with what rights.</tspan></text>
<rect x="352" y="458" width="576" height="70" rx="8" fill="#036f4f"/>
<text x="640" y="487" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">pkit's commands and checks</tspan></text>
<text x="640" y="515" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">Carry out decisions, and check each change.</tspan></text>
<rect x="320" y="536" width="640" height="70" rx="8" fill="#078661"/>
<text x="640" y="565" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Your code and documents</tspan></text>
<text x="640" y="593" font-size="24" text-anchor="middle"><tspan font-family="Source Sans Pro" font-weight="400" fill="#ffffff">The work itself, tied to what it depends on.</tspan></text>
<path d="M 394.382 302 L 274.219 594.898" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 269.664 606 L 269.223 592.848 L 279.215 596.948 Z" fill="#4f5358"/>
<path d="M 1010.34 606 L 890.172 313.102" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 885.618 302 L 895.168 311.052 L 885.176 315.152 Z" fill="#4f5358"/>
<rect x="81" y="225" width="258.232" height="118" rx="8" fill="none" stroke="#7d8085" stroke-width="2" stroke-dasharray="8 6"/>
<text x="104" y="260" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Where ideas start</tspan></text>
<text x="104" y="292" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">In conversation,</tspan></text>
<text x="104" y="324" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">or a scratchpad note.</tspan></text>
<path d="M 340.232 259 L 436 259" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 448 259 L 436 264.4 L 436 253.6 Z" fill="#4f5358"/>
<text x="288.326" y="428" font-size="24" text-anchor="end"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Carried out</tspan></text>
<text x="288.326" y="460" font-size="24" text-anchor="end"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">An agent reads</tspan></text>
<text x="288.326" y="492" font-size="24" text-anchor="end"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">the reasons first.</tspan></text>
<text x="991.674" y="428" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Checked first</tspan></text>
<text x="991.674" y="460" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">Decisions never</tspan></text>
<text x="991.674" y="492" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">bend to the code.</tspan></text>
</svg>
