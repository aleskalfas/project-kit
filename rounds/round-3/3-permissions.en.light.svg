<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="en">
<title>Where permissions come from</title>
<rect width="1280" height="720" fill="#ffffff"/>
<text x="80" y="96" font-size="48" letter-spacing="-0.5"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Where permissions come from</tspan></text>
<text x="80" y="140" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">From rules your project writes down as data.</tspan></text>
<text x="80" y="178" font-size="30"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">Your AI tool applies them to every call, so they hold when an agent forgets them.</tspan></text>
<text x="80" y="656" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#65696f">In project-kit: Claude Code's settings, written by pkit from this data, hold 14 denies and 62 allows.</tspan></text>
<rect x="344" y="224" width="264" height="48" rx="8" fill="#015c41"/>
<text x="364" y="256" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Written as data</tspan></text>
<path d="M 608 248 L 628 248" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 640 248 L 628 253.4 L 628 242.6 Z" fill="#4f5358"/>
<rect x="640" y="224" width="264" height="48" rx="8" fill="#036f4f"/>
<text x="660" y="256" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">Your AI tool gets</tspan></text>
<path d="M 904 248 L 924 248" fill="none" stroke="#4f5358" stroke-width="2" stroke-linejoin="round" stroke-linecap="butt"/>
<path d="M 936 248 L 924 253.4 L 924 242.6 Z" fill="#4f5358"/>
<rect x="936" y="224" width="264" height="48" rx="8" fill="#078661"/>
<text x="956" y="256" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#ffffff">A call meets</tspan></text>
<text x="80" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Guardrails</tspan></text>
<text x="80" y="350" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">for you and every agent</tspan></text>
<text x="344" y="320" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">rm -r</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">sudo</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">,</tspan></text>
<text x="344" y="352" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">git push -f</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">: denied</tspan></text>
<text x="640" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">a deny in its settings</tspan></text>
<rect x="936" y="288" width="264" height="80" rx="8" fill="#e8f1ff"/>
<circle cx="967" cy="312" r="11" fill="#2068cb"/>
<rect x="961" y="310.5" width="12" height="3" rx="1.5" fill="#ffffff"/>
<text x="990" y="320" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Refused</tspan></text>
<text x="956" y="352" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">in every mode</tspan></text>
<text x="80" y="416" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">An agent's own tools</tspan></text>
<text x="80" y="446" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">in the agent's file</tspan></text>
<text x="344" y="416" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">critic</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">: only </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">Read</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">,</tspan></text>
<text x="344" y="448" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">Glob</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">Grep</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">, </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">WebFetch</tspan></text>
<text x="640" y="416" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">its list of tools</tspan></text>
<rect x="936" y="384" width="264" height="80" rx="8" fill="#e8f1ff"/>
<circle cx="967" cy="408" r="11" fill="#2068cb"/>
<rect x="961" y="406.5" width="12" height="3" rx="1.5" fill="#ffffff"/>
<text x="990" y="416" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Refused</tspan></text>
<text x="956" y="448" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">any tool not listed</tspan></text>
<text x="80" y="512" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">One agent's rule</tspan></text>
<text x="80" y="542" font-size="20"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">from project-management</tspan></text>
<text x="344" y="512" font-size="24"><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">project-manager</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">:</tspan></text>
<text x="344" y="544" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f">no raw </tspan><tspan font-family="Source Code Pro" font-weight="400" font-size="22" fill="#181b1f">gh</tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#181b1f"> changes</tspan></text>
<text x="640" y="512" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">a hook, before each call</tspan></text>
<rect x="936" y="480" width="264" height="80" rx="8" fill="#e8f1ff"/>
<circle cx="967" cy="504" r="11" fill="#2068cb"/>
<rect x="961" y="502.5" width="12" height="3" rx="1.5" fill="#ffffff"/>
<text x="990" y="512" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Refused</tspan></text>
<text x="956" y="544" font-size="24"><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">uses pkit's commands</tspan></text>
<text x="80" y="600" font-size="24"><tspan font-family="Source Sans Pro" font-weight="600" fill="#181b1f">Limit: </tspan><tspan font-family="Source Sans Pro" font-weight="400" fill="#4f5358">a deny stops the forms of a command pkit can tell. One hidden behind another can slip past.</tspan></text>
</svg>
