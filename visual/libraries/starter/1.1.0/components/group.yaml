pkit_schema: visual-communication:component
schema_version: 1

status: experimental
# Where its form comes from (DEC-007 point 3): Yuri Engelhardt's containment, which also
# checks the groups pattern, whose groups it draws.
about: >-
  One group of items that belong together: a box with rounded corners on its colour
  family's fill, which holds a head, a tag and the group's items, one under another, the
  head and the tag where the content gives them. Where its concept has a sign, the sign
  stands at the end of its head's row. Its items stand in a column, each as wide as the
  group, drawn by the card. It is as wide as it is given, and as tall as what it holds.

fields:
  type: object
  required: [items]
  properties:
    head:
      type: string
      description: What the items have in common, in a few words, such as the group's name.
      x-pkit-prose: true
    tag:
      type: string
      description: A short label under the head, such as a role the group plays.
    items:
      type: array
      minItems: 1
      description: The group's items, each with the fields of the component that draws it.
      items: {type: object}
    item:
      type: object
      description: >-
        The component that draws each item that names none, with words for its options:
        the card unless the content names another.

lists:
  items: {component: item}

colour: neutral

values:
  # Where what the group holds starts, inside its edge, and how wide it is.
  inner: "=:width - 2 * @starter.inset"
  # The head's row holds the head and, at its end, the sign, with a gap between them where
  # the sign is drawn. What stands under the row starts under the taller of the two.
  heading: "=max(head.height, sign.height)"
  under: "=@starter.inset + heading"

parts:
  box:
    box:
      fill: ":colour.fill"
      stroke: ":colour.line"
      stroke-width: "=@starter.edge"
      rx: "=@starter.corner"
    width: "=:width"
    height: "=:height"
  # The concept's sign, at the end of the head's row, as a card draws its own, in the
  # family's text. A group whose family comes from no concept with a sign draws none, and
  # the sign then has no size.
  sign:
    sign: {fill: ":colour.text"}
    x: "=:width - @starter.inset - sign.width"
    y: "=@starter.inset + (heading - sign.height) / 2"
    width: "=@starter.sign"
    height: "=@starter.sign"
  # The head is the family's text on the family's fill, a pair the foundations declare.
  # Each of the head, the tag and the items keeps a gap from what stands above it only
  # where both are drawn: a part not drawn has no height.
  head:
    when: head
    text:
      content: head
      style: starter.type.head
      fill: ":colour.text"
    x: "=@starter.inset"
    y: "=@starter.inset"
    width: "=inner - sign.width - min(sign.width, @space.2)"
  tag:
    when: tag
    use: starter/tag
    fields: {label: tag}
    x: "=@starter.inset"
    y: "=under + min(heading, tag.height, @space.2)"
  items:
    repeat: items
    draw: starter/card
    x: "=@starter.inset"
    y: "=tag.bottom + min(max(heading, tag.height), @starter.gap)"
    width: "=inner"
    column: {gap: "=@starter.gap", align-items: stretch}

preferred:
  height: "=items.bottom + @starter.inset"
