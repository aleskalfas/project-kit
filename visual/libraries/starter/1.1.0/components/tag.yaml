pkit_schema: visual-communication:component
schema_version: 1

status: experimental
# The design systems its form comes from (DEC-007 point 3): the GOV.UK Design System's
# tag, IBM Carbon's tag and Material Design's chip.
about: >-
  A short label on a small box with rounded corners, painted in its colour family: its
  fill, its edge, and its text on that fill. Where its concept has a sign, the sign
  stands before the label. It is as large as its label and its sign, on one line.
  Content places it alone, a list lays tags in a row, or a card shows one.

fields:
  type: object
  required: [label]
  properties:
    label:
      type: string
      description: What the tag says, in a word or a few.
      x-pkit-prose: true

colour: neutral

values:
  # How tall the row is that the sign and the label share, each centred on it.
  band: "=max(sign.height, label.height)"

parts:
  box:
    box:
      fill: ":colour.fill"
      stroke: ":colour.line"
      stroke-width: "=@starter.edge"
      rx: "=@starter.corner"
    width: "=:width"
    height: "=:height"
  # The concept's sign, before the label, as a run's sign stands before its text. It takes
  # the family's text, as the label does. A tag whose family comes from no concept with a
  # sign draws none, and the sign then has no size, so the label starts at the inset.
  sign:
    sign: {fill: ":colour.text"}
    x: "=@space.2"
    y: "=@space.1 + (band - sign.height) / 2"
    width: "=@starter.sign"
    height: "=@starter.sign"
  # The label is the family's text on the family's fill, a pair the foundations declare.
  label:
    text: {content: label, style: type.body, fill: ":colour.text"}
    x: "=sign.right + min(sign.width, @space.sign-gap)"
    y: "=@space.1 + (band - label.height) / 2"

preferred:
  width: "=label.right + @space.2"
  height: "=@space.1 + band + @space.1"
