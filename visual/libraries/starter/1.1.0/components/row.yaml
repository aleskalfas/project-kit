pkit_schema: visual-communication:component
schema_version: 1

status: experimental
# The design systems its form comes from (DEC-022 point 4): the rows of the GOV.UK Design
# System's table and of the U.S. Web Design System's table, as for the table.
about: >-
  One row of a table: its cells side by side, sharing the row's width, each drawn by the
  cell unless the content names another, and a rule along its foot. The cells share the
  width equally, unless a cell gives its span: a narrow cell takes half the share of a
  normal one, and a wide cell half as much again. The row is as tall as its tallest cell.

fields:
  type: object
  required: [cells]
  properties:
    cells:
      type: array
      minItems: 1
      description: The cells, from the start of the row, each with the fields of the component that draws it.
      items: {type: object}
    cell:
      type: object
      description: >-
        The component that draws each cell that names none, with words for its options:
        the cell unless the content names another.

lists:
  cells:
    component: cell
    # How much of the row a cell takes: a normal cell two shares, a narrow one one, and a
    # wide one three. A row cannot read the table's columns, so each row's cells give the
    # same spans for its columns to line up.
    arrangement:
      span:
        words: [normal, narrow, wide]
        shares: {normal: 2, narrow: 1, wide: 3}

parts:
  cells:
    repeat: cells
    draw: starter/cell
    width: "=:width"
    row:
      gap: {by: ":device", desktop: "=@starter.gap", phone: "=@space.2"}
      sizes: shares
      align-items: stretch
  rule:
    box: {fill: line}
    y: "=cells.bottom"
    width: "=:width"
    height: "=@starter.edge"

preferred:
  height: "=rule.bottom"
