pkit_schema: visual-communication:component
schema_version: 1

status: experimental
about: >-
  A line from where a tie starts to where it ends, in its colour family's text, straight
  or with corners, and an arrowhead at its end, at its start, at both or at neither. Where
  its concept has a sign, the sign stands on the line, halfway along it. It takes the two
  ends a pattern's list of ties gives it, and routes around nothing.

options:
  # The connector tool's route between the two ends.
  route: [straight, corners]
  # Where an arrowhead points away from the line.
  arrow: [end, start, both, none]

colour: neutral

ends: true

parts:
  # The line is a mark that nothing beside it shows, so it needs 3:1 against what it lies
  # on (WCAG 2.1, 1.4.11). It takes its family's text, the member a brand makes legible:
  # the foundations pair it with the family's fill. A family's line edges a fill, and may
  # be faint.
  line:
    line:
      stroke: ":colour.text"
      stroke-width: "=@starter.connector"
      marker-start: {by: arrow, end: none, start: arrow, both: arrow, none: none}
      marker-end: {by: arrow, end: arrow, start: none, both: arrow, none: none}
    connect: {by: route, straight: straight, corners: corners}
  # The concept's sign, centred on the middle of the line's frame, which lies on the line
  # halfway along it, with corners or without. It takes the line's paint, so it reaches
  # what the line reaches against what it lies on. A tie whose family comes from no
  # concept with a sign draws none.
  sign:
    sign: {fill: ":colour.text"}
    x: "=line.x + (line.width - sign.width) / 2"
    y: "=line.y + (line.height - sign.height) / 2"
    width: "=@starter.sign"
    height: "=@starter.sign"
