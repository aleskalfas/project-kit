pkit_schema: visual-communication:component
schema_version: 1

status: experimental
about: >-
  What rests on what: levels stacked one on another, the top first, drawn by the level. As
  a stack, each level is as wide as the stack; as steps, each is a step narrower than the
  one under it, centred on it, so the levels narrow to the top. Each level is shaded by
  its place, from the order's first end at the top to its last at the foot, unless the
  content asks for none. To the right of the stack, notes may stand that hold across the
  levels, sharing the stack's height. Ties join a note or a level to another, each drawn
  by the connector, and end at a level's drawn edge.

options:
  # The levels as a stack of one width, or as steps that narrow to the top.
  shape: [stack, steps]
  # Each level shaded by its place in the order, a step between the order's two ends, or
  # none, so each level takes its own colour family (DEC-032 point 3). The steps are the
  # default, since layers' point is an order: each level rests on those under it.
  shade: [steps, plain]

fields:
  type: object
  required: [levels]
  properties:
    levels:
      type: array
      minItems: 1
      description: The levels, the top first, each with the fields of the component that draws it.
      items: {type: object}
    level:
      type: object
      description: >-
        The component that draws each level that names none, with words for its options:
        the level unless the content names another.
    notes:
      type: array
      description: >-
        What holds across the levels, to the right of the stack, each with the fields of
        the component that draws it.
      items: {type: object}
    note:
      type: object
      description: >-
        The component that draws each note that names none, with words for its options:
        the card unless the content names another.
    ties:
      type: array
      description: >-
        The ties between the levels and the notes, each from one item to another, both
        named by their key paths.
      items: {type: object}
    tie:
      type: object
      description: >-
        The component that draws each tie that names none, with words for its options:
        the connector unless the content names another.

lists:
  levels: {component: level}
  notes: {component: note}
  ties: {component: tie, ends: [from, to]}

values:
  # How wide the notes stand: a third of the width, less the gap beside them.
  aside: "=(:width - @starter.gap) / 3"

parts:
  # Without notes the stack takes the whole width: a part not drawn has no width.
  notes:
    when: notes
    repeat: notes
    draw: starter/card
    x: "=:width - aside"
    width: "=aside"
    height: "=levels.height"
    column: {gap: "=@starter.gap", sizes: equal, align-items: stretch}
  # As steps, each level is one step narrower than the one under it, a step being the
  # stack's width over twice the number of levels: the last is as wide as the stack, and
  # the first half of it and one step, so the top stays wider than half the stack. With
  # `shade: steps`, each level's place takes a step of the order, spread from its first end
  # at the top to its last at the foot over the levels drawn, and its default component,
  # the level, shows the step in its fill (DEC-032 points 3 and 4). A level that names a
  # concept keeps its concept's colour.
  levels:
    repeat: levels
    draw: starter/level
    colour: {by: shade, steps: ":steps", plain: null}
    width: "=:width - notes.width - min(notes.width, @starter.gap)"
    column:
      gap: "=@starter.gap"
      align-items: {by: shape, stack: stretch, steps: center}
      cross-size: {by: shape, stack: null, steps: "=levels.width * (:places + :place) / (2 * :places)"}
  # Drawn last, over the levels and the notes.
  ties:
    repeat: ties
    draw: starter/connector

preferred:
  height: "=levels.bottom"
