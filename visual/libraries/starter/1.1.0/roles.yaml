pkit_schema: visual-communication:roles
schema_version: 1

# The starter's own roles (DEC-008 point 1): one for each value of its look that a brand
# may want to set apart from the shared roles. Each defaults to the role the starter's
# owner judged its fairest stand-in, and each chain of defaults ends at a shared role, so
# a brand that does not name the starter draws it in its own values (DEC-008 point 2). A
# brand that names the starter may give any of them a value of its own. None is a colour:
# the starter paints with the shared roles and the colour families alone, so it declares
# no pair.
roles:
  # The radius of the corners of a card and of a tag: a small spacing.
  starter.corner: {type: dimension, default: '{space.1}'}
  # The space between a card's edge and what it holds.
  starter.inset: {type: dimension, default: '{space.3}'}
  # The space between the items a pattern lays out.
  starter.gap: {type: dimension, default: '{space.3}'}
  # How thick a card's bar is.
  starter.bar: {type: dimension, default: '{space.1}'}
  # How wide the edge of a card and of a tag is.
  starter.edge: {type: dimension, default: '{stroke.thin}'}
  # How wide a connector's line is. It defaults to the width of a line drawn on its own,
  # not to the edge's: an arrowhead is as long as five widths of its line, so an edge's
  # width would draw it too small to read.
  starter.connector: {type: dimension, default: '{stroke.thick}'}
  # The radius a connector's turns are drawn round at: a small spacing, so a line with
  # corners reads as one smooth path, which the eye follows more easily than one that
  # bends sharply (Colin Ware, good continuation). A brand that wants sharp turns gives it
  # no length.
  starter.turn: {type: dimension, default: '{space.2}'}
  # The typography of a card's head and of a list's head.
  starter.type.head: {type: typography, default: '{type.heading}'}
  # The typography of a strong run in a card's text: the shared strong type, the body's
  # size and line height in a heavier weight, so a strong run keeps the line it lies in.
  starter.type.strong: {type: typography, default: '{type.strong}'}
  # The typography of the code block's text: the shared type of code, in a monospace
  # family, so the columns of a terminal's lines and of a file's text stay in line.
  starter.type.code: {type: typography, default: '{type.code}'}
  # The space between a page's edge and what a web part that fills the page's width holds,
  # and between a web part's own rows, on a wide page: a large spacing. On a phone a web
  # part keeps the inset from the edge instead.
  starter.margin: {type: dimension, default: '{space.4}'}
  # How wide a header draws the brand's logo, at most: a large spacing, so a square mark
  # stands about as tall as the title beside it.
  starter.logo: {type: dimension, default: '{space.4}'}
  # The radius of a button's corners: a card's, unless a brand rounds its buttons apart.
  starter.button.corner: {type: dimension, default: '{starter.corner}'}
  # The side of the square a component draws its concept's sign in (DEC-036 point 2): a
  # medium spacing, so a sign stands about as tall as a letter of the body's text.
  starter.sign: {type: dimension, default: '{space.3}'}
