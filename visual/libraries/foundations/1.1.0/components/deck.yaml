pkit_schema: visual-communication:component
schema_version: 1

status: experimental
about: >-
  A presentation, one page for each of its slides. Each slide takes one of the deck's
  layouts, a cover or a slide, and fills that layout's slots; or it names the component
  that draws it. Every page is as wide as the brand's slide, and nine sixteenths as tall.

fields:
  type: object
  required: [slides]
  properties:
    # The field that holds the pages. It lies in no layout: each page takes one.
    slides:
      type: array
      minItems: 1
      items: {type: object}
      description: >-
        The deck's pages, in order. Each names its layout with `layout`, or the component
        that draws it with `use`.
      x-pkit-pages: true

values:
  margin: "=@space.4 * 2"

# The types of what a page says first, so a brand can size them for where the deck is
# shown, such as larger on a projector, apart from the type of the rest of its text. Each
# defaults to the shared type the deck drew it in before, so a brand that gives neither
# draws the deck as it did.
tokens:
  # A page's title: the cover's and each slide's.
  title: {type: typography, default: '{type.heading}'}
  # The line under a title: a slide's lead and the cover's subtitle.
  lead: {type: typography, default: '{type.body}'}

# Every page is as large as the deck asks to be.
preferred:
  width: "=@size.slide"
  height: "=@size.slide * 9 / 16"

# The forms a page takes. Each layout declares the slots a page in it fills, and holds the
# deck's own drawing of it, the layout's default. Each part that places a slot is named
# after that slot.
layouts:
  cover:
    slots:
      title:
        type: string
        description: What the presentation is about.
        x-pkit-prose: true
      subtitle:
        type: string
        description: A line under the title.
        x-pkit-prose: true
      author:
        type: string
        description: Who presents it.
      link:
        type: string
        description: Where to find more, such as a web address.
    required: [title]
    parts:
      background:
        box: {fill: surface}
        width: "=:width"
        height: "=:height"
      title:
        text: {content: title, style: component.foundations.deck.title, fill: text-primary}
        x: "=margin"
        y: "=:height / 3"
        width: "=:width - 2 * margin"
      rule:
        box: {fill: accent}
        x: "=margin"
        y: "=title.bottom + @space.3"
        width: "=margin"
        height: "=@space.1"
      subtitle:
        when: subtitle
        text: {content: subtitle, style: component.foundations.deck.lead, fill: text-secondary}
        x: "=margin"
        y: "=rule.bottom + @space.3"
        width: "=:width - 2 * margin"
      # The author stands above the link, and the link at the foot.
      author:
        when: author
        text: {content: author, style: type.body, fill: text-primary}
        x: "=margin"
        y: "=link.y - @space.2 - author.height"
        width: "=:width - 2 * margin"
      link:
        when: link
        text: {content: link, style: type.body, fill: text-secondary}
        x: "=margin"
        y: "=:height - margin - link.height"
        width: "=:width - 2 * margin"
  slide:
    slots:
      title:
        type: string
        description: What the slide says, in a sentence.
        x-pkit-prose: true
      lead:
        type: string
        description: The answer to the title, in a sentence or two.
        x-pkit-prose: true
      visual:
        type: object
        description: The picture that shows the lead, as the component the content places in it.
      limit:
        type: string
        description: Where what the slide says stops holding.
        x-pkit-prose: true
      footer:
        type: string
        description: A line at the foot, such as where the slide's claim can be seen.
        x-pkit-prose: true
    required: [title]
    parts:
      background:
        box: {fill: background}
        width: "=:width"
        height: "=:height"
      title:
        text: {content: title, style: component.foundations.deck.title, fill: text-primary}
        x: "=margin"
        y: "=margin"
        width: "=:width - 2 * margin"
      # The lead answers the title, so it stands closer under the title than the visual
      # stands under the lead, and the two read as the page's head.
      lead:
        when: lead
        text: {content: lead, style: component.foundations.deck.lead, fill: text-secondary}
        x: "=margin"
        y: "=title.bottom + @space.2"
        width: "=:width - 2 * margin"
      # The visual takes the height between the lead and the limit, or the footer, so a
      # visual that asks for more is reported. A large space stands above the limit and
      # above the footer only where each is drawn: a part drawn holds a line of text,
      # taller than the smallest space, and one not drawn has no height. So the visual
      # reaches down to the limit, the footer or the margin, one large space above it.
      visual:
        slot: visual
        x: "=margin"
        y: "=lead.bottom + @space.4"
        width: "=:width - 2 * margin"
        height: "=limit.y - min(limit.height, @space.1) / @space.1 * @space.4 - visual.y"
      # The limit stands above the footer, a bar of the accent at its side.
      limit-bar:
        when: limit
        box: {fill: accent}
        x: "=margin"
        y: "=limit.y"
        width: "=@space.1"
        height: "=limit.height"
      limit:
        when: limit
        text: {content: limit, style: type.body, fill: text-primary}
        x: "=margin + @space.1 + @space.3"
        y: "=footer.y - min(footer.height, @space.1) / @space.1 * @space.4 - limit.height"
        width: "=:width - 2 * margin - @space.1 - @space.3"
      footer:
        when: footer
        text: {content: footer, style: type.body, fill: text-secondary}
        x: "=margin"
        y: "=:height - margin - footer.height"
        width: "=:width - 2 * margin"
