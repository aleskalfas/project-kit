pkit_schema: visual-communication:content
schema_version: 1

# The deck's pages, in the order of the talk. Its text comes from the talk's slides, cut to
# what a slide holds under the neutral brand. The Czech file has the same ids.
slides:
  - id: fits
    layout: slide
    title: How pkit fits together
    lead: "In five layers, from your decisions down to your code: each carries out the decisions above it."
    visual:
      # The lead's order runs down the pyramid: decisions at the top, each layer under it
      # carrying out the decisions above it, down to your code. The talk adds where the
      # decisions come from, which opens the page at its top left, and what runs back up.
      use: piece/pyramid
      start: [{text: "Where ideas start. ", style: strong}, "In conversation, and in a scratchpad note when one needs longer."]
      levels:
        - {id: decisions, label: Decisions}
        - {id: rules, label: "Working rules · schemas · processes"}
        - {id: skills, label: "Skills · agents · permissions"}
        - {id: commands, label: "pkit's commands and checks"}
        - {id: work, label: Your code and documents}
      down: [{text: "↓ Carried out. ", style: strong}, "Each layer carries out the decisions above it. The reasons stay in one place, where an agent reads them before it changes anything."]
      up: [{text: "↑ Checked. ", style: strong}, "If a layer and a decision disagree, the layer is checked first, so decisions never drift to match the code. Only a person, never your AI tool, changes a decision."]
    footer: pkit wrote down as a decision of its own, COR-065, that an accepted decision governs and the rest carries it out.

  - id: install
    layout: slide
    title: Install pkit
    lead: Install the tool once, then add pkit to each project with one command. Upgrades replace pkit's files, never yours.
    visual:
      # The lead's order runs down: the tool installed once, then pkit added to each project,
      # then what that leaves, pkit's files beside yours. So the two commands stand first,
      # across the page, each with a comment saying when it runs, and the project's tree
      # under them. The legend stands beside the tree's top, where the eye leaves its first
      # line, and the aside last, as something beside the point.
      use: starter/panels
      panels:
        - use: starter/code
          text: [
            {text: "$ ", style: prompt}, {text: "uv tool install git+https://github.com/aleskalfas/project-kit.git@latest", style: command}, {text: "  # once\n", style: comment},
            {text: "$ ", style: prompt}, {text: "pkit init", style: command}, {text: "  # in each project", style: comment}]
      under:
        use: starter/panels
        panels:
          - use: starter/code
            # A real tree of a new project, cut to what a slide holds: two of pkit's folders
            # split into pkit's part and yours, a line for more of pkit's, and two of your
            # files. Each of pkit's files starts with its concept's sign, a full circle, and
            # each of yours with a ring, so the two differ without their colours too, under
            # forced colours or without colour vision. The legend says what each stands for.
            text: [
              "your-project/\n",
              "├── .pkit/", {text: "       # the methodology\n", style: comment},
              "│   ├── decisions/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
              "│   ├── rules/ ", {text: "core.md", concept: pkit/core}, " ", {text: "project.md\n", concept: pkit/yours},
              "│   └── ", {text: "…", concept: pkit/core}, {text: "      # and more of pkit's\n", style: comment},
              "├── ", {text: "CLAUDE.md", concept: pkit/yours}, {text: "  # loads the rules\n", style: comment},
              "└── ", {text: "src/", concept: pkit/yours}, {text: "       # your code, untouched", style: comment}]
          - use: starter/panels
            panels:
              - use: starter/legend
                entries:
                  - {id: core, concept: pkit/core, label: "pkit's files, replaced by each upgrade"}
                  - {id: yours, concept: pkit/yours, label: your files}
            under:
              use: starter/aside
              head: Don't want pkit in your repository?
              command: $ pkit visibility private
              text: It stays in your clone, and your agent uses it all.
    footer: pkit status shows what pkit set up in a project. Optional parts, called capabilities, come later.

  - id: permissions
    layout: slide
    title: Where permissions come from
    lead: Permissions come from rules your project writes down as data. Your AI tool applies them to every call, so they hold when an agent forgets them.
    visual:
      # The lead's order runs across: what the project writes down as data, what the AI
      # tool gets from it, and what a call then meets. Each row is one of the three places
      # an agent's limits come from, read in that order; the column heads number the steps,
      # so the order holds without arrows, in either language.
      use: piece/matrix
      rows:
        - id: steps
          cells:
            - {id: kind}
            - {id: data, head: "1  Written as data"}
            - {id: tool, head: "2  Your AI tool gets"}
            - {id: call, head: "3  A call meets"}
        - id: guardrails
          cells:
            - {id: kind, head: Guardrails}
            - {id: data, text: "rm -r, sudo and force-push, denied to all"}
            - {id: tool, text: a deny in its settings}
            - {id: call, text: "refused, in every mode"}
        - id: own-tools
          cells:
            - {id: kind, head: "An agent's own tools"}
            - {id: data, text: "the critic's file: Read, Glob, Grep, WebFetch"}
            - {id: tool, text: "that agent's list of tools"}
            - {id: call, text: "no command run, no file written"}
        - id: one-agent
          cells:
            - {id: kind, head: "One agent's rule"}
            - {id: data, text: "project-manager: no raw gh changes"}
            - {id: tool, text: "the hook, before each call"}
            - {id: call, text: "refused, so it uses pkit's commands"}
    limit: A deny stops the forms of a command pkit can tell. A command hidden behind another can slip past.
    footer: "In project-kit: the project-manager agent uses pkit's commands, which validate the issue first."

  - id: connect
    layout: slide
    title: How capabilities work together
    lead: "Capabilities meet through roles: one that needs something opens a slot any other can fill."
    # Each capability is one block, the role it plays on its first line, by its job in
    # plain words. The slots are those pkit::work-tracking opens, in the frame of
    # project-management, which plays it now; every tie ends at a slot, never at
    # project-management. pkit's name for that role stands beside its block, since the
    # status output names it. The wiring is project-kit's, as each capability's
    # package.yaml declares it and pkit status prints it, cut to the slots of one role and
    # to the fills of the two other capabilities: project-management fills doc-check
    # itself, which the page leaves out.
    visual:
      use: piece/wiring
      opener:
        - id: project-management
          concept: pkit/capability
          role: "role: tracking the work"
          name: [{text: "capability: ", style: kind}, {text: project-management, style: name}]
      opens: [{text: "pkit::work-tracking", style: code}, "\nopens 3 slots"]
      slots:
        - {id: doc-check, name: doc-check, text: the docs a change must update}
        - {id: fixers, name: fixers, text: which agent fixes each doc, fill: tint, concept: pkit/proof}
        - {id: use-cases, name: use-cases, text: the use cases to plan from}
      fillers:
        - id: living-docs
          concept: pkit/capability
          role: "role: keeping the docs"
          name: [{text: "capability: ", style: kind}, {text: living-docs, style: name}]
        - id: software-analysis
          concept: pkit/capability
          role: "role: analysing the software"
          name: [{text: "capability: ", style: kind}, {text: software-analysis, style: name}]
      tie: {use: starter/connector, route: corners, override: {line: text-secondary}}
      ties:
        - {id: living-docs-doc-check, from: {item: "fillers[living-docs]"}, to: {item: "slots[doc-check]"}}
        - {id: living-docs-fixers, from: {item: "fillers[living-docs]"}, to: {item: "slots[fixers]"}}
        - {id: software-analysis-fixers, from: {item: "fillers[software-analysis]"}, to: {item: "slots[fixers]"}}
        - {id: software-analysis-use-cases, from: {item: "fillers[software-analysis]"}, to: {item: "slots[use-cases]"}}
      # What pkit status printed in project-kit, cut by whole lines to the slot fixers and
      # the two capabilities bound to it. The bound lines hang under the slot's line, as pkit
      # prints them, by fewer spaces, and clear of the sign that opens the slot's line.
      evidence:
        use: starter/code
        text: [
          {text: "pkit::work-tracking:fixers", concept: pkit/proof}, {text: "  # from pkit status\n", style: comment},
          "    bound    software-analysis (contributes)\n",
          "    bound    living-docs (contributes)"]
      gains: [{text: "What it gives you\n", style: strong}, "Swap a capability for one in its role.\nInstall only what you need.\n", {text: "pkit validate", style: code}, " checks the wiring."]
    footer: "In project-kit: each of the 3 roles has one capability so far, so a swap is designed, not yet shown."
