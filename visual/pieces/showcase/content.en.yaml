pkit_schema: visual-communication:content
schema_version: 1

# The deck's pages, in the order of the talk. Its text comes from the talk's slides, cut to
# what a slide holds under the neutral brand. The Czech file has the same ids.
slides:
  - id: fits
    layout: slide
    title: How pkit fits together
    lead: "In five layers, from your decisions down to your code: each carries out the ones above it."
    visual:
      use: starter/layers
      level: {use: starter/card, fill: tint}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          concept: pkit/decision
          text: [{text: "Decisions. ", style: strong}, "Choices you accepted, and why."]
        - id: rules
          concept: pkit/rule
          text: [{text: "Working rules · schemas · processes. ", style: strong}, "Exactly what to do, for every session and tool."]
        - id: skills
          concept: pkit/skill
          text: [{text: "Skills · agents · permissions. ", style: strong}, "How agents act, in which role, with what rights."]
        - id: commands
          concept: pkit/core
          text: [{text: "pkit's commands and checks. ", style: strong}, "Carry out what is decided, and check every change."]
        - id: work
          concept: pkit/yours
          text: [{text: "Your code and documents. ", style: strong}, "The work itself, tied to what it depends on."]
      notes:
        - id: ideas
          text: [{text: "Where ideas start. ", style: strong}, "In conversation, and in a scratchpad note when one needs longer."]
        - id: carried-out
          text: [{text: "↓ Carried out. ", style: strong}, "Each layer carries out the decisions above it. The reasons stay in one place, where an agent reads them before it changes anything."]
        - id: checked
          text: [{text: "↑ Checked. ", style: strong}, "If a layer and a decision disagree, the layer is checked first, so decisions never drift to match the code. Only you change a decision."]
      ties:
        - {id: ideas-decisions, from: {item: "notes[ideas]"}, to: {item: "levels[decisions]"}}
    footer: pkit wrote this order down as a decision of its own, COR-065.

  - id: install
    layout: slide
    title: Install pkit
    lead: Install the tool once, then add pkit to each project with one command. Upgrades replace pkit's files, never yours.
    visual:
      use: starter/panels
      panels:
        - use: starter/panels
          panels:
            - use: starter/code
              text: [
                {text: "# once, on your machine\n", style: comment},
                {text: "$ ", style: prompt}, {text: "uv tool install \\\n", style: command},
                {text: "    git+ssh://git@github.com/aleskalfas/project-kit.git@latest\n", style: command},
                {text: "$ ", style: prompt}, {text: "pkit --version\n", style: command},
                {text: "# in each project\n", style: comment},
                {text: "$ ", style: prompt}, {text: "cd your-project\n", style: command},
                {text: "$ ", style: prompt}, {text: "pkit init", style: command}]
          under:
            use: starter/aside
            head: Don't want pkit in your repository?
            command: $ pkit visibility private
            text: pkit stays only in your clone, hidden by git's exclude file. Nothing of it is committed, and your agent still uses all of it.
        - use: starter/code
          # A real tree of a new project, cut to what a slide holds. Until a legend comes
          # (project-kit#2576), its last line names what each colour tells apart.
          text: [
            {text: "$ ", style: prompt}, {text: "tree", style: command}, " -a -L 2 your-project\n",
            "your-project/\n",
            "├── .pkit/", {text: "                    # the methodology\n", style: comment},
            "│   ├── agents/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── decisions/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── permissions/ ", {text: "project/", concept: pkit/yours}, {text: " # what agents may do\n", style: comment},
            "│   ├── rules/ ", {text: "core.md", concept: pkit/core}, " ", {text: "project.md", concept: pkit/yours}, {text: " # yours to add\n", style: comment},
            "│   ├── ", {text: "schemas/", concept: pkit/core}, {text: "              # what the tools read\n", style: comment},
            "│   ├── ", {text: "scratchpad/", concept: pkit/yours}, {text: "           # your unfinished ideas\n", style: comment},
            "│   ├── skills/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── ", {text: "…", concept: pkit/core}, {text: "                     # and more of pkit's\n", style: comment},
            "│   └── ", {text: "manifest.yaml", concept: pkit/core}, {text: "         # what is installed\n", style: comment},
            "├── .claude/", {text: "                  # your Claude Code setup\n", style: comment},
            "│   └── settings.json", {text: "         # ", style: comment}, {text: "yours", concept: pkit/yours}, {text: ", ", style: comment}, {text: "pkit's", concept: pkit/core}, {text: " merged in\n", style: comment},
            "├── ", {text: "CLAUDE.md", concept: pkit/yours}, {text: "                 # loads the rules\n", style: comment},
            "└── ", {text: "src/", concept: pkit/yours}, {text: "                      # your code, untouched\n", style: comment},
            {text: "# ", style: comment}, {text: "pkit's files", concept: pkit/core}, {text: ", replaced by each upgrade · ", style: comment}, {text: "your files", concept: pkit/yours}]
    footer: pkit status shows what pkit set up in a project. Optional parts, called capabilities, come later.

  - id: permissions
    layout: slide
    title: Where permissions come from
    lead: From rules your project writes down as data. Your AI tool applies them to every call, so they hold when an agent forgets them.
    visual:
      use: starter/groups
      groups:
        - id: guardrails
          head: Guardrails
          tag: for you and every agent
          items:
            - {id: data, text: [{text: "Written as data: ", style: strong}, "rm -r, sudo and force-push, denied to all"]}
            - {id: tool, text: [{text: "Your AI tool gets: ", style: strong}, "a deny in its settings"]}
            - {id: call, text: [{text: "A call meets: ", style: strong}, "refused, in every mode"]}
        - id: own-tools
          head: An agent's own tools
          tag: in the agent's file
          items:
            - {id: data, text: [{text: "Written as data: ", style: strong}, "critic: Read, Glob, Grep, WebFetch"]}
            - {id: tool, text: [{text: "Your AI tool gets: ", style: strong}, "that agent's list of tools"]}
            - {id: call, text: [{text: "A call meets: ", style: strong}, "no command run, no file written"]}
        - id: one-agent
          head: One agent's rule
          tag: from project-management
          items:
            - {id: data, text: [{text: "Written as data: ", style: strong}, "project-manager: no raw gh changes"]}
            - {id: tool, text: [{text: "Your AI tool gets: ", style: strong}, "the hook, before each call"]}
            - {id: call, text: [{text: "A call meets: ", style: strong}, "refused, so it uses pkit's commands"]}
    limit: A deny stops the forms of a command pkit can tell. A command hidden behind another can slip past.
    footer: "In project-kit: the project-manager agent is refused raw gh changes, and uses pkit's commands, which validate the issue first."

  - id: connect
    layout: slide
    title: How capabilities work together
    lead: A capability never names another, only a role. One that needs something opens a slot, and any other can fill it.
    visual:
      use: starter/panels
      panels:
        - id: network
          use: starter/network
          span: wide
          item: {use: starter/card, fill: tint}
          tie: {use: starter/connector, concept: pkit/core}
          left:
            - {id: living-docs, concept: pkit/capability, head: living-docs, tag: "pkit::documentation", text: docs for each reader}
            - {id: software-analysis, concept: pkit/capability, head: software-analysis, tag: "pkit::analysis", text: what the software must do}
          right:
            - id: slots
              use: starter/groups
              groups:
                - id: project-management
                  concept: pkit/capability
                  head: project-management
                  tag: plays pkit::work-tracking
                  items:
                    - {id: doc-check, text: the docs a change must update}
                    - {id: fixers, text: which agent fixes each doc}
                    - {id: use-cases, text: the use cases to plan from}
          ties:
            - {id: docs-doc-check, from: {item: "left[living-docs]"}, to: {item: "right[slots].groups[project-management].items[doc-check]"}}
            - {id: docs-fixers, from: {item: "left[living-docs]"}, to: {item: "right[slots].groups[project-management].items[fixers]"}}
            - {id: analysis-fixers, from: {item: "left[software-analysis]"}, to: {item: "right[slots].groups[project-management].items[fixers]"}}
            - {id: analysis-use-cases, from: {item: "left[software-analysis]"}, to: {item: "right[slots].groups[project-management].items[use-cases]"}}
        - id: status
          use: starter/code
          head: What pkit status shows
          text: [
            {text: "$ ", style: prompt}, {text: "pkit", style: command}, " status\n",
            "  Connections\n",
            "    roles   3 named: 3 active, 0 in conflict\n",
            {text: "      pkit::analysis      → ", concept: pkit/core}, {text: "software-analysis\n", concept: pkit/capability},
            {text: "      pkit::documentation → ", concept: pkit/core}, {text: "living-docs\n", concept: pkit/capability},
            {text: "      pkit::work-tracking → ", concept: pkit/core}, {text: "project-management\n", concept: pkit/capability},
            "    points  6 defined: 2 unfilled\n",
            {text: "    pkit::work-tracking:fixers\n", concept: pkit/core},
            "      data v1 · project-management — filled\n",
            "      bound  ", {text: "software-analysis", concept: pkit/capability}, " (contributes)\n",
            "      bound  ", {text: "living-docs", concept: pkit/capability}, " (contributes)"]
      under:
        use: starter/list
        items:
          - {id: swap, text: Swap a capability for one in the same role.}
          - {id: only-what-you-need, text: Install only what you need.}
          - {id: wiring, text: pkit validate checks the wiring.}
    limit: Each role has one capability so far, so swapping one for another is designed, not yet shown.
    footer: "In project-kit: 3 roles, each played by one capability, and 6 slots, 4 of them filled."
