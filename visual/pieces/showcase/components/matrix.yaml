pkit_schema: visual-communication:component
schema_version: 1

# Facts in rows and columns, for the permissions page: the starter's rows, one under
# another, as wide as the page's text. The starter's table draws the same rows, but sets
# the inset a web page's part keeps from the page's edge, so its columns would start a
# large space to the right of the slide's title and lead. This piece stacks the rows on
# the slide's own margin instead.
status: experimental
about: >-
  Rows of a table, one under another, each as wide as the matrix and drawn by the
  starter's row unless the content names another: a first row of heads names the columns,
  and each row after it holds one row's facts. It is as tall as its rows.

fields:
  type: object
  required: [rows]
  properties:
    rows:
      type: array
      minItems: 1
      description: The rows, from the top, each with the fields of the component that draws it.
      items: {type: object}
    row:
      type: object
      description: >-
        The component that draws each row that names none, with words for its options:
        the starter's row unless the content names another.

lists:
  rows: {component: row}

parts:
  rows:
    repeat: rows
    draw: starter/row
    width: "=:width"
    column: {align-items: stretch}

preferred:
  height: "=rows.bottom"
