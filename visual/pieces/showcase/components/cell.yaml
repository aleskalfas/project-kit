pkit_schema: visual-communication:component
schema_version: 1

# The starter's cell, with the smallest space above and below its words, where the starter
# keeps the next one up. The permissions page's lead and its limit now take the room the
# starter's cell leaves its rows, and its rows, of two lines each, need the height the page
# gives its visual. A row's rule still separates the rows, so the smaller space does not
# run one row's words into the next.
status: experimental
about: >-
  One cell of a table's row: a head in a strong type, such as the name of a column, or a
  text, or both, one under the other, each broken to the cell's width, with the smallest
  space above and below. It is as wide as it is given, and as tall as what it holds.

fields:
  type: object
  properties:
    head:
      type: string
      description: What the cell names, in a word or a few, such as the name of its column.
      x-pkit-prose: true
    text:
      type: string
      description: What the cell holds, in a word or a sentence.
      x-pkit-prose: true

parts:
  head:
    when: head
    text: {content: head, style: type.strong, fill: text-primary}
    y: "=@space.1"
    width: "=:width"
  text:
    when: text
    text: {content: text, style: type.body, fill: text-primary}
    y: "=head.bottom + min(head.height, text.height, @space.1)"
    width: "=:width"

preferred:
  height: "=text.bottom + @space.1"
