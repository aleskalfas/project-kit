pkit_schema: visual-communication:content
schema_version: 1

# Překlad souboru content.en.yaml, se stejnými id a ve stejném pořadí stránek.
slides:
  - id: fits
    layout: slide
    title: Jak je pkit poskládaný
    lead: "Pět vrstev, od vašich rozhodnutí po váš kód: každá provádí rozhodnutí nad sebou."
    visual:
      # Pořadí perexu běží po stupních dolů: rozhodnutí nahoře, každá vrstva pod nimi
      # provádí rozhodnutí nad sebou, až po váš kód. Vedle stupňů stojí poznámky přednášky
      # v pořadí, v jakém je vypráví: odkud rozhodnutí přicházejí, spojené s horní vrstvou,
      # pak co běží dolů a co zpátky nahoru.
      use: starter/layers
      shape: steps
      level: {use: starter/card, fill: tint}
      levels:
        - {id: decisions, head: Rozhodnutí}
        - {id: rules, head: "Pracovní pravidla · schémata · procesy"}
        - {id: skills, head: "Skilly · agenti · oprávnění"}
        - {id: commands, head: Příkazy a kontroly pkitu}
        - {id: work, head: Váš kód a dokumenty}
      notes:
        - id: start
          text: [{text: "Kde vznikají nápady. ", style: strong}, "Rozhovor, nebo poznámka ve scratchpadu."]
        - id: down
          text: [{text: "↓ Provádění. ", style: strong}, "Agent si přečte důvody, než začne."]
        - id: up
          text: [{text: "↑ Kontrola. ", style: strong}, "Rozhodnutí mění jen člověk, nikdy váš AI nástroj."]
      ties:
        - id: start-decisions
          from: {item: "notes[start]"}
          to: {item: "levels[decisions]"}
    footer: pkit si jako vlastní rozhodnutí, COR-065, zapsal, že přijaté rozhodnutí řídí a zbytek ho provádí.

  - id: install
    layout: slide
    title: Instalace pkitu
    lead: Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu jedním příkazem. Upgrade mění jen soubory pkitu.
    visual:
      # Pořadí perexu běží shora dolů: nástroj nainstalovaný jednou, pak pkit přidaný do
      # každého projektu, pak co po něm zůstane, soubory pkitu vedle vašich. Oba příkazy
      # proto stojí první, přes celou stránku, každý s komentářem, kdy se spouští, a strom
      # projektu pod nimi. Legenda stojí vedle horního okraje stromu, kam oko odchází z jeho
      # prvního řádku, a odbočka poslední, jako něco vedle hlavní myšlenky.
      use: starter/panels
      panels:
        - use: starter/code
          text: [
            {text: "$ ", style: prompt}, {text: "uv tool install git+https://github.com/aleskalfas/project-kit.git@latest", style: command}, {text: "  # jednou\n", style: comment},
            {text: "$ ", style: prompt}, {text: "pkit init", style: command}, {text: "  # v každém projektu", style: comment}]
      under:
        use: starter/panels
        panels:
          - use: starter/code
            # Skutečný strom nového projektu, zkrácený na to, co se na slajd vejde: dvě složky
            # pkitu rozdělené na část pkitu a vaši, řádek s dalšími částmi pkitu a dva vaše
            # soubory. Každý soubor pkitu začíná znakem svého konceptu, plným kruhem, a každý
            # váš prstencem, takže se ty dva liší i bez barev, ve vynucených barvách nebo bez
            # barevného vidění. Legenda říká, co který znak značí.
            text: [
              "your-project/\n",
              "├── .pkit/", {text: "       # metodika\n", style: comment},
              "│   ├── decisions/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
              "│   ├── rules/ ", {text: "core.md", concept: pkit/core}, " ", {text: "project.md\n", concept: pkit/yours},
              "│   └── ", {text: "…", concept: pkit/core}, {text: "      # a další části pkitu\n", style: comment},
              "├── ", {text: "CLAUDE.md", concept: pkit/yours}, {text: "  # načte pravidla\n", style: comment},
              "└── ", {text: "src/", concept: pkit/yours}, {text: "       # váš kód, nedotčený", style: comment}]
          - use: starter/panels
            panels:
              - use: starter/legend
                entries:
                  - {id: core, concept: pkit/core, label: "soubory pkitu, upgrade je nahradí"}
                  - {id: yours, concept: pkit/yours, label: vaše soubory}
            under:
              use: starter/aside
              head: Nechcete mít pkit v repozitáři?
              command: $ pkit visibility private
              text: Zůstane ve vašem klonu a agent ho používá celý.
    footer: pkit status ukáže, co pkit v projektu nastavil. Volitelné části, kterým pkit říká capabilities, přijdou později.

  - id: permissions
    layout: slide
    title: Odkud se berou oprávnění
    lead: Oprávnění pocházejí z pravidel, která projekt zapíše jako data. AI nástroj je uplatní při každém volání, i když na ně agent zapomene.
    visual:
      # Pořadí perexu běží napříč: co projekt zapíše jako data, co z toho dostane AI
      # nástroj a co pak potká volání. Každý řádek je jedno ze tří míst, odkud agent
      # dostává svá omezení, a čte se v tomto pořadí. Záhlaví sloupců kroky čísluje, takže
      # pořadí platí i bez šipek, v obou jazycích. Tabulka nemá vlastní odsazení, takže její
      # první sloupec začíná na hraně nadpisu.
      use: starter/table
      inset: none
      rows:
        - id: steps
          cells:
            - {id: kind}
            - {id: data, head: "1  Zapsáno jako data"}
            - {id: tool, head: "2  AI nástroj dostane"}
            - {id: call, head: "3  Volání narazí na"}
        - id: guardrails
          cells:
            - {id: kind, head: Pojistky}
            - {id: data, text: "rm -r, sudo a force-push, zakázané všem"}
            - {id: tool, text: zákaz v nastavení}
            - {id: call, text: odmítnutí v každém režimu}
        - id: own-tools
          cells:
            - {id: kind, head: Vlastní nástroje agenta}
            - {id: data, text: "soubor criticu: Read, Glob, Grep, WebFetch"}
            - {id: tool, text: seznam nástrojů agenta}
            - {id: call, text: "žádný příkaz, žádný zápis"}
        - id: one-agent
          cells:
            - {id: kind, head: Pravidlo jednoho agenta}
            - {id: data, text: "project-manager: žádné změny přímým gh"}
            - {id: tool, text: hook před každým voláním}
            - {id: call, text: "odmítnutí, použije příkazy pkitu"}
    limit: Zákaz zastaví jen ty podoby příkazu, které pkit pozná. Příkaz schovaný za jiným může proklouznout.
    footer: "V project-kitu: agent project-manager používá příkazy pkitu, které issue nejdřív ověří."

  - id: connect
    layout: slide
    title: Jak capability spolupracují
    lead: "Capability se propojují přes role: která něco potřebuje, otevře slot, kterákoli jiná ho vyplní."
    visual:
      use: piece/wiring
      opener:
        - id: project-management
          concept: pkit/capability
          role: "role: sledování práce"
          name: [{text: "capability: ", style: kind}, {text: project-management, style: name}]
      opens: [{text: "pkit::work-tracking", style: code}, "\notevírá 3 sloty"]
      slots:
        - {id: doc-check, name: doc-check, text: které dokumenty změna musí upravit}
        - {id: fixers, name: fixers, text: který agent opraví dokument, fill: tint, concept: pkit/proof}
        - {id: use-cases, name: use-cases, text: případy užití k plánování}
      fillers:
        - id: living-docs
          concept: pkit/capability
          role: "role: údržba dokumentace"
          name: [{text: "capability: ", style: kind}, {text: living-docs, style: name}]
        - id: software-analysis
          concept: pkit/capability
          role: "role: analýza softwaru"
          name: [{text: "capability: ", style: kind}, {text: software-analysis, style: name}]
      tie: {use: starter/connector, route: corners, override: {line: text-secondary}}
      ties:
        - {id: living-docs-doc-check, from: {item: "fillers[living-docs]"}, to: {item: "slots[doc-check]"}}
        - {id: living-docs-fixers, from: {item: "fillers[living-docs]"}, to: {item: "slots[fixers]"}}
        - {id: software-analysis-fixers, from: {item: "fillers[software-analysis]"}, to: {item: "slots[fixers]"}}
        - {id: software-analysis-use-cases, from: {item: "fillers[software-analysis]"}, to: {item: "slots[use-cases]"}}
      evidence:
        use: starter/code
        text: [
          {text: "pkit::work-tracking:fixers", concept: pkit/proof}, {text: "  # z pkit status\n", style: comment},
          "    bound    software-analysis (contributes)\n",
          "    bound    living-docs (contributes)"]
      gains: [{text: "Co vám to dá\n", style: strong}, "Capability vyměníte v téže roli.\nInstalujete jen to, co potřebujete.\n", {text: "pkit validate", style: code}, " ověří zapojení."]
    footer: "V project-kitu: každou ze 3 rolí zatím hraje jedna capability, výměna je tedy navržená, ne vyzkoušená."
