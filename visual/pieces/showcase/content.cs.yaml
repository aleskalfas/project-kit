pkit_schema: visual-communication:content
schema_version: 1

# Překlad souboru content.en.yaml, se stejnými id a ve stejném pořadí stránek.
slides:
  - id: fits
    layout: slide
    title: Jak je pkit poskládaný
    lead: Skládá se z pěti vrstev, od vašich rozhodnutí až po váš kód. Každá vrstva provádí to, co určují vrstvy nad ní.
    visual:
      use: starter/layers
      level: {use: starter/card, fill: tint}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          concept: pkit/decision
          text: [{text: "Rozhodnutí. ", style: strong}, "Co jste schválili a proč."]
        - id: rules
          concept: pkit/rule
          text: [{text: "Pracovní pravidla · schémata · procesy. ", style: strong}, "Co přesně má dělat každá session i nástroj."]
        - id: skills
          concept: pkit/skill
          text: [{text: "Skilly · agenti · oprávnění. ", style: strong}, "Jak agenti jednají, v jaké roli a s jakými právy."]
        - id: commands
          concept: pkit/core
          text: [{text: "Příkazy a kontroly pkitu. ", style: strong}, "Provádějí, co jste rozhodli, a kontrolují každou změnu."]
        - id: work
          concept: pkit/yours
          text: [{text: "Váš kód a dokumenty. ", style: strong}, "Samotná práce, navázaná na to, na čem závisí."]
      notes:
        - id: ideas
          text: [{text: "Kde vznikají nápady. ", style: strong}, "V rozhovoru. A když nápad potřebuje víc času, v poznámce ve scratchpadu."]
        - id: carried-out
          text: [{text: "↓ Provádění. ", style: strong}, "Každá vrstva provádí rozhodnutí nad sebou. Důvody zůstávají na jednom místě. Agent si je tam přečte dřív, než cokoli změní."]
        - id: checked
          text: [{text: "↑ Kontrola. ", style: strong}, "Když vrstva nesedí s rozhodnutím, nejdřív se prověří vrstva. Rozhodnutí se tak nikdy nepřizpůsobí kódu. Změnit ho můžete jen vy."]
      ties:
        - {id: ideas-decisions, from: {item: "notes[ideas]"}, to: {item: "levels[decisions]"}}
    footer: pkit zapsal toto pořadí jako své vlastní rozhodnutí, COR-065.

  - id: install
    layout: slide
    title: Instalace pkitu
    lead: Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu jedním příkazem. Upgrade mění jen soubory pkitu.
    visual:
      use: starter/panels
      panels:
        - use: starter/panels
          panels:
            - use: starter/code
              text: [
                {text: "# jednou, na vašem počítači\n", style: comment},
                {text: "$ ", style: prompt}, {text: "uv tool install \\\n", style: command},
                {text: "    git+ssh://git@github.com/aleskalfas/project-kit.git@latest\n", style: command},
                {text: "$ ", style: prompt}, {text: "pkit --version\n", style: command},
                {text: "# v každém projektu\n", style: comment},
                {text: "$ ", style: prompt}, {text: "cd your-project\n", style: command},
                {text: "$ ", style: prompt}, {text: "pkit init", style: command}]
          under:
            use: starter/aside
            head: Nechcete mít pkit v repozitáři?
            command: $ pkit visibility private
            text: pkit zůstane jen ve vašem klonu a git ho díky souboru exclude ignoruje. Nic z něj se necommitne, a agent ho přesto používá celý.
        - use: starter/code
          # Skutečný strom nového projektu, zkrácený na to, co se na slajd vejde. Dokud
          # nepřijde legenda (project-kit#2576), poslední řádek říká, co která barva značí.
          text: [
            {text: "$ ", style: prompt}, {text: "tree", style: command}, " -a -L 2 your-project\n",
            "your-project/\n",
            "├── .pkit/", {text: "                    # metodika\n", style: comment},
            "│   ├── agents/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── decisions/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── permissions/ ", {text: "project/", concept: pkit/yours}, {text: " # co agenti smějí\n", style: comment},
            "│   ├── rules/ ", {text: "core.md", concept: pkit/core}, " ", {text: "project.md", concept: pkit/yours}, {text: " # sem píšete vy\n", style: comment},
            "│   ├── ", {text: "schemas/", concept: pkit/core}, {text: "              # co čtou nástroje\n", style: comment},
            "│   ├── ", {text: "scratchpad/", concept: pkit/yours}, {text: "           # vaše nedotažené nápady\n", style: comment},
            "│   ├── skills/ ", {text: "core/", concept: pkit/core}, " ", {text: "project/\n", concept: pkit/yours},
            "│   ├── ", {text: "…", concept: pkit/core}, {text: "                     # a další části pkitu\n", style: comment},
            "│   └── ", {text: "manifest.yaml", concept: pkit/core}, {text: "         # co je nainstalováno\n", style: comment},
            "├── .claude/", {text: "                  # vaše nastavení Claude Code\n", style: comment},
            "│   └── settings.json", {text: "         # ", style: comment}, {text: "vaše", concept: pkit/yours}, {text: ", ", style: comment}, {text: "pkit", concept: pkit/core}, {text: " přidá svoje\n", style: comment},
            "├── ", {text: "CLAUDE.md", concept: pkit/yours}, {text: "                 # načte pravidla\n", style: comment},
            "└── ", {text: "src/", concept: pkit/yours}, {text: "                      # váš kód, pkit na něj nesahá\n", style: comment},
            {text: "# ", style: comment}, {text: "soubory pkitu", concept: pkit/core}, {text: ", každý upgrade je nahradí · ", style: comment}, {text: "vaše soubory", concept: pkit/yours}]
    footer: pkit status ukáže, co pkit v projektu nastavil. Volitelné části, kterým pkit říká capabilities, přijdou později.

  - id: permissions
    layout: slide
    title: Odkud se berou oprávnění
    lead: Z pravidel, která projekt zapíše jako data. AI nástroj je uplatní při každém volání, i když na ně agent zapomene.
    visual:
      use: starter/groups
      groups:
        - id: guardrails
          head: Pojistky
          tag: pro vás i každého agenta
          items:
            - {id: data, text: [{text: "Zapsáno jako data: ", style: strong}, "rm -r, sudo a force-push, zakázané všem"]}
            - {id: tool, text: [{text: "AI nástroj dostane: ", style: strong}, "zákaz v nastavení"]}
            - {id: call, text: [{text: "Výsledek volání: ", style: strong}, "odmítnuto v každém režimu"]}
        - id: own-tools
          head: Vlastní nástroje agenta
          tag: v souboru agenta
          items:
            - {id: data, text: [{text: "Zapsáno jako data: ", style: strong}, "critic: Read, Glob, Grep, WebFetch"]}
            - {id: tool, text: [{text: "AI nástroj dostane: ", style: strong}, "seznam nástrojů"]}
            - {id: call, text: [{text: "Výsledek volání: ", style: strong}, "žádný příkaz, žádný zápis"]}
        - id: one-agent
          head: Pravidlo agenta
          tag: z project-management
          items:
            - {id: data, text: [{text: "Zapsáno jako data: ", style: strong}, "project-manager: žádné změny přímým gh"]}
            - {id: tool, text: [{text: "AI nástroj dostane: ", style: strong}, "hook před voláním"]}
            - {id: call, text: [{text: "Výsledek volání: ", style: strong}, "odmítnuto, použije příkazy pkitu"]}
    limit: Zákaz zastaví jen ty podoby příkazu, které pkit pozná. Příkaz schovaný za jiným může proklouznout.
    footer: "V project-kitu: agent project-manager nesmí nic měnit přímým příkazem gh. Používá příkazy pkitu, které issue nejdřív ověří."

  - id: connect
    layout: slide
    title: Jak capabilities spolupracují
    lead: Capability nikdy nejmenuje jinou capability, jen roli. Když něco potřebuje, otevře slot. Vyplní ho kterákoli jiná.
    visual:
      use: starter/panels
      panels:
        - id: network
          use: starter/network
          span: wide
          item: {use: starter/card, fill: tint}
          tie: {use: starter/connector, concept: pkit/core}
          left:
            - {id: living-docs, concept: pkit/capability, head: living-docs, tag: "pkit::documentation", text: dokumenty na míru čtenáři}
            - {id: software-analysis, concept: pkit/capability, head: software-analysis, tag: "pkit::analysis", text: co musí software umět}
          right:
            - id: slots
              use: starter/groups
              groups:
                - id: project-management
                  concept: pkit/capability
                  head: project-management
                  tag: plays pkit::work-tracking
                  items:
                    - {id: doc-check, text: "dokumenty, které změna upraví"}
                    - {id: fixers, text: který agent opraví dokument}
                    - {id: use-cases, text: případy užití k plánování}
          ties:
            - {id: docs-doc-check, from: {item: "left[living-docs]"}, to: {item: "right[slots].groups[project-management].items[doc-check]"}}
            - {id: docs-fixers, from: {item: "left[living-docs]"}, to: {item: "right[slots].groups[project-management].items[fixers]"}}
            - {id: analysis-fixers, from: {item: "left[software-analysis]"}, to: {item: "right[slots].groups[project-management].items[fixers]"}}
            - {id: analysis-use-cases, from: {item: "left[software-analysis]"}, to: {item: "right[slots].groups[project-management].items[use-cases]"}}
        - id: status
          use: starter/code
          head: Co vypíše pkit status
          text: [
            {text: "$ ", style: prompt}, {text: "pkit", style: command}, " status\n",
            "  Connections\n",
            "    roles   3 named: 3 active, 0 in conflict\n",
            {text: "      pkit::analysis      → ", concept: pkit/core}, {text: "software-analysis\n", concept: pkit/capability},
            {text: "      pkit::documentation → ", concept: pkit/core}, {text: "living-docs\n", concept: pkit/capability},
            {text: "      pkit::work-tracking → ", concept: pkit/core}, {text: "project-management\n", concept: pkit/capability},
            "    points  6 defined: 2 unfilled\n",
            {text: "    pkit::work-tracking:fixers\n", concept: pkit/core},
            "      data v1 · project-management — filled\n",
            "      bound  ", {text: "software-analysis", concept: pkit/capability}, " (contributes)\n",
            "      bound  ", {text: "living-docs", concept: pkit/capability}, " (contributes)"]
      under:
        use: starter/list
        items:
          - {id: swap, text: Capability vyměníte za jinou ve stejné roli.}
          - {id: only-what-you-need, text: "Instalujete jen to, co potřebujete."}
          - {id: wiring, text: pkit validate zapojení zkontroluje.}
    limit: Každou roli zatím hraje jen jedna capability. Výměna je tedy navržená, ale ještě nevyzkoušená.
    footer: "V project-kitu: 3 role, každou hraje jedna capability. Ze 6 slotů jsou 4 vyplněné."
