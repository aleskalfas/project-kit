component: living-docs
kind: minor
custom:
  category: Added
body: >
  `pkit living-docs validate`, and its `living-docs:spaces` member of `pkit
  validate`, warn without failing of two passages that more often break a rule
  than a mention does (#2642). One is a link to a section of another page that
  the page does not anchor at that section, where the rule on one home binds:
  an anchor on the whole page is not that anchor. The other is a citation of a
  record the page's anchors do not stand on: a parenthesis that opens with a
  record's id, such as `(COR-050 point 5)`. Each warning names the page, the
  line, the link or the citation and the anchor to add, and states the rule by
  what it says. A mark after the passage passes it over. A link's fragment is
  read as the slug an artefact anchor names a section by, in the report of
  unanchored mentions too. The shared rule set declares no check for either, so
  a reviewer still judges both. The summary's last line counts the warnings
  where there are any.
