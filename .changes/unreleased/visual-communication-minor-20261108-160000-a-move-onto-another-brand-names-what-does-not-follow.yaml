component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A command that moves a piece's lock onto another brand names what does not
  follow it (#2859). `pkit visual render` of a draft that is not pinned,
  `pkit visual upgrade`, and `pkit visual mark-final` where the lock it puts
  back names another brand, print `another brand: <old> to <new>`. They then
  name, in each language, each picture file of the piece a scene shows, whether
  the content or a local component names it, and each picture role a part
  shows that the new brand gives no file, each with its image's trace id. One
  shown or left out at some keys over the size axes alone names those keys.
  `pkit visual before-after` says the same, looking ahead or back, wherever its
  two locks name different brands. A library's own file and a produced picture
  are not named, and a move that keeps the brand says none of it. No record
  keeps what a move says, and the check is silent on it. The brand a lock names
  is the one no other brand it locks builds on. Four commands come to name
  what none named, and nothing an adopter holds breaks.
