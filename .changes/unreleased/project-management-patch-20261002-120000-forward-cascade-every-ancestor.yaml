component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The forward cascade now reaches every ancestor of a moved issue and moves
  each only through transitions `workflow.yaml` declares (#1230, #1229). It
  stopped one level up, so a Task starting moved its Feature and left the
  Feature's EPIC behind; and a parent still in Todo under a child starting from
  Backlog was written straight to In Progress, a move the workflow does not
  declare, which the engine refused to record — `pkit pm history <N>
  --check-drift` then showed drift for a move pkit made. `move-issue` now walks
  from the issue to the top of its hierarchy and brings each ancestor that is
  behind up to the issue's state, capped at In Progress: one in Todo goes to
  Backlog and then to In Progress, two label writes and two journaled moves,
  each naming the issue's move as its reason. An ancestor at or past the target
  is left alone and the walk goes on above it. The preview and `--dry-run` list
  each ancestor's steps. The walk follows the parent each first line names, read
  against the issue's type, so `Related: #N` is no longer followed and a
  milestone ref ends the walk; it stops with a warning at an ancestor it cannot
  read, one that is not a container, one it has passed already, and one whose
  native parent differs from its first line. A move to Done from Todo or
  Backlog (a won't-do close) moves no ancestor. A cascade that did not complete
  ends with a `[warn]` block naming each ancestor's outcome; the issue's own move
  stands, the exit code stays 0, and running the same `move-issue` again
  finishes it — an issue already at its target now walks its ancestors too.
  Where state is not written as a label (a board, a derivation, the title, a
  degraded axis, or a label binding with no Backlog or In Progress value) the
  cascade does not run and one line says so. After upgrading, the first forward
  move under a chain the one-level cascade left behind brings its upper
  ancestors level — an EPIC in Todo goes to Backlog and then In Progress — with
  no hook and no comment, as for every cascaded move.
