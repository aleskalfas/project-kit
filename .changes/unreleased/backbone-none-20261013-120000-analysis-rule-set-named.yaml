component: backbone
kind: none
body: >
  project-kit's own operational rules (.pkit/rules/project.md) now send the
  analysis's writers to ANA, project-kit's rule set for its analysis, which
  inherits WRITE, its general writing rule set. The file is project-owned and
  sync never touches it, so nothing reaches an adopter. The changeset guard
  counts any change under .pkit/rules/ as the backbone's.
