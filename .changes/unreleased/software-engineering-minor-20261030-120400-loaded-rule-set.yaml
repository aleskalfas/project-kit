component: software-engineering
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  software-engineering ships its operational rules as its loaded rule set
  `SWE`, whose `rules.md` every session loads wherever the capability is
  installed (COR-070): while building, run the tests of what your change
  touches and the project's fast checks, and leave the full suite to where
  the project runs it, where it runs one.
