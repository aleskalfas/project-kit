component: project-management
kind: minor
custom:
  category: Added
body: >
  A project that runs agents in parallel can now declare a topology of seats in
  `project/topology.yaml` (DEC-059 points 1 to 3, #2140), whose shape is the new
  schema `topology.yaml`. `scripts/_lib/topology.py` reads the topology from the
  default branch, at the commit the backbone resolves it to, and says which
  commit it read. The new `create-seats` runs on the change that adds seats: it
  creates each new seat's state issue and writes its number into the file,
  idempotently. The new `check-topology` checks the file against the default
  branch's topology, or `--base`: a seat name used twice, more than one
  organizer seat, a seat with no state issue, a scope naming an undeclared
  workstream or type, the `label` ownership substrate, a seat deleted or moved
  rather than retired, and a base that cannot be resolved. The commands that
  take, release and list seats come later.
