component: backbone
kind: minor
custom:
  category: Added
body: >
  The report channel's bookkeeping now fires on every path (#664, from
  #660's dogfood inventory §C): any scratchpad-backed compose that ends at
  a URL instead of a post — `--url`, `--open`, the no-auth fallback, or an
  API post degraded to the URL — ends with the required tracking follow-up
  as its last line (`after filing in the browser, run: pkit scratchpad
  reported <slug> <issue-ref>`), so the manual stamp is never a hidden
  step; the compose-time redaction lint is test-pinned on all four paths
  (interactive API, `--url`/`--open`, `--yes` stage, `submit` resurface).
  The two tracking surfaces reconcile to one declared truth — the issue
  (upstream) is the truth for state, the note's frontmatter for what was
  sent — by derivation only: `report list` tags a row `[note: <slug>]`
  when a local `reported/` note references that issue (no sync mechanism,
  nothing stored). And the `report show` / `report --tree` Tracked-by
  rollups now render each fix's title and URL beside its number + state
  (bare numbers forced a browser round-trip), degrading to number + state
  when a ref can't be resolved offline.
