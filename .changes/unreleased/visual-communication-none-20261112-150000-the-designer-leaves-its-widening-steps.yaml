component: visual-communication
kind: none
body: >
  The body of `graphic-designer`, which no release has shipped yet, leaves the
  person each step that widens what it may write (#3063): where its grant names
  no location, it asks where the visual work goes and names the commands that
  record the location and move its grant there. It lists the cases where the
  capability's folder is the source, with how `pkit status` tells them, and
  names the rule sets it reads by what they cover. `graphic-design-reviewer`
  names the rule set loaded into sessions by its role. The pending minor that
  ships the designer declares its surface, so no surface moves.
