component: backbone
kind: minor
custom:
  category: Added
body: >
  The change check, `pkit friction check`, reads answer files as COR-062 and
  ADR-068 decide, and nothing writes one yet. The change's answers are the
  live ones in the answer files its diff adds, judged as a block's are. A file
  put back writes no answer, and an answer moved word for word out of a block
  is listed apart, under the new JSON key `moved`. What each answer read is
  judged against the change's own head, which `PKIT_CHECK_HEAD` names for a run
  that reads the working tree: HEAD or a parent of it, such as a pull
  request's head under a host's merge. `--head` keeps its meaning. Enforcing
  mode fails four new findings: `answer-file-rewritten`, `prune-mixed`,
  `read-incomplete` and `answers-nothing`. Three new findings fail nothing:
  `answer-on-what-is-gone`, `answer-file-ignored` for an answer file on an
  artefact whose block still holds answers, and `answered-apart`. The last,
  with the JSON key `answered_apart_at_tip`, reports the base tip's
  revalidations a change's answer did not read. Each
  listed answer gains `file`, `replaces_apart` and `moved`, and `head` gains
  `own`. No query inherits `PKIT_CHECK_HEAD`. A project with no answer file
  reads as before.
