component: backbone
kind: patch
custom:
  category: Fixed
body: >
  A rule that fills an extension point binds only where the rule it fills
  binds, as COR-051 point 7 says, also when that rule is itself a fill
  (#1616). Take an accepted rule that fills a point of a proposed rule. It
  binds nowhere, so a rule that fills a point it offers binds nowhere either.
  Under `--preview` such a fill binds only where the rule it fills would bind,
  marked as previewed, and a fill that binds without the preview is never
  marked. A fill conflict at a point of a rule that binds nowhere is no
  validation error. Every reader of the walk gives this answer: `pkit
  rule-sets reach`, `pkit rule-sets altered`, validation's `rule-sets` member,
  and a component's check that reads `pkit rule-sets reach --json`, such as
  the living-docs validator.
