component: software-analysis
kind: patch
custom:
  category: Changed
body: >
  The new record software-analysis DEC-007 refines DEC-005 point 2 at three
  edges of what a path is (#2391). An actor's own use cases are those whose
  goal is its own, even where others do their work. Any hand-over one of them
  states from another, in a precondition, a trigger or a step, is a sign of a
  path, never proof. A step that names the next use case, one with a trigger
  of its own, hands over to it, and a use case reaches alone only what its own
  steps make true.
  **The skill and the rule.** The `analysis-author` skill's `journey.md` and
  `build-analysis.md` say how to judge each edge, a standing condition and a
  result that falls short among them. `RS-SAN-014`, still proposed, states the
  same. Proposed rules bind nothing, so `SAN` stays at 1.0.0.
