component: project-management
kind: minor
custom:
  category: Changed
  pr: "770"
body: >
  The capability's default local-path reviewer agent is renamed `reviewer` →
  `pm-reviewer` (#770). The single-token name collided with the English
  role-noun "reviewer" that saturates this capability (required reviewers,
  reviewer-contribution rules, per-reviewer overrides), making the registered
  agent name indistinguishable from the role. It now deploys at
  `.claude/agents/pm-reviewer.md` and is registered as `local_registered:
  - name: pm-reviewer`. The verdict-line GRAMMAR is unchanged
  (`Reviewer agent (local, <name>): <VERDICT>`); only the bound `<name>` moves.
  A capability-tier migration (0.55.0) rewrites an adopter's `local_registered`
  entry from `reviewer` to `pm-reviewer` — but ONLY when it is the shipped
  default, keyed on the deployed agent's provenance so an adopter's OWN agent
  named `reviewer` is left untouched — and removes the stale kit-deployed
  `reviewer.md`. Any OPEN PR carrying a `Reviewer agent (local, reviewer):`
  verdict goes stale after the rename (the gate now matches `pm-reviewer`) and
  self-heals on the next `review-pr` run.
