component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual add <library>` copies a library the capability ships into
  the location's library folder (#2508): the version whole, at
  `libraries/<library>/<version>/`, listed in `libraries/libraries.yaml`
  with the source `shipped` and `released: false`, every other byte of the
  list kept. `pkit visual add foundations` brings in the foundations. It
  never overwrites a version the folder holds, and refuses a version whose
  files lack their binding, a library the capability does not ship, naming
  the ones it ships, and a library the list names from another source.
  Running it is the consent for the copy: no install, sync or upgrade
  writes in the location.
