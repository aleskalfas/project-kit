component: demo-recording
kind: patch
custom:
  category: Fixed
body: >
  `pkit demo-recording record` no longer ends with no message when a recording
  configuration lacks a key (#2707). A configuration without `recordings_dir`
  now records into `./recordings`, as the schema and the `new-bundle` operation
  say. One without `cwd` now stops with status 2 and the message naming the
  required fields. `record windows` stops the same way, with its own message.
