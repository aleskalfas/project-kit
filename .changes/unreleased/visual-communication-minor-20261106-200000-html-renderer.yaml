component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The capability ships the `html` renderer, at version 1.0.0 (#2783). It draws a
  scene as one page file for each language, at one key: real HTML text over SVG
  layers that keep the scene's draw order. Each line lies where the engine put
  it, and every length is a share of the page's width, so a page shrinks with a
  narrower window and never grows. The file holds its faces and its pictures, so
  it asks for nothing, and writing it takes no browser. No format or command
  reaches the renderer yet. The SVG renderer's output and version do not change.
