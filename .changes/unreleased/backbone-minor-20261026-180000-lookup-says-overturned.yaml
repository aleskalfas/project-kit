component: backbone
kind: minor
body: >
  A lookup of a point another record overturns in part says so. pkit refs lookup X#N
  prints, after the point's place, the record's top line, which reads "Partially
  superseded by ...", since the point stays as it stood and a reader sent to it would
  never see that line (COR-058 point 5). With --json, each answer gains
  partial_supersession, that line for a point of such a record and null otherwise;
  paths is unchanged, and schema_version stays 1. The line names the overturning
  record, not whether it overturns this point.
