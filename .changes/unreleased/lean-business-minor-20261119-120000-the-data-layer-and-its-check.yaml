component: lean-business
kind: minor
custom:
  category: Added
body: >
  The capability keeps an idea as a folder of data files, and `pkit lean check`
  holds them to the capability's records (#3426, DEC-002). Each idea under
  the location, `lean-business/` unless a project records another, holds its
  goal, a canvas and assumptions for each variant, its experiments and its
  cycles, each bound to its schema, format 1: `lean-business:goal`,
  `canvas`, `assumptions`, `experiment`, `cycle`, and `config` for the
  capability's configuration. Ids are qualified by what holds them, and a
  file names another's subject as `[canvas:<id>]`, `[assumptions:<id>]`,
  `[experiment:<id>]` or `[cycle:<id>]`. Each judgement keeps a fingerprint
  of what it judged, over canonical form 1. `check` joins `pkit validate` as
  the `lean-business:check` member: a broken invariant, such as a changed
  declaration or plan, a decision or a review the gates would refuse, or a
  suspension that breaks its rules, is an error, and a guideline of the book
  or a judgement gone stale is a warning. It works out where each window and
  time box falls under the cycle's suspensions, and reads no clock. No
  command writes an idea yet.
