component: backbone
kind: patch
custom:
  category: Fixed
  pr: "884"
body: >
  `pkit schemas add` and `pkit schemas rename` now find a namespace stamped
  into the core schemas area (`.pkit/schemas/`) by `pkit new schema core`,
  the whole-tree `pkit schemas validate` / `schemas list` / `schemas show`
  cover that area alongside the capability ones, and an unknown namespace is
  reported naming both homes searched (#879).
