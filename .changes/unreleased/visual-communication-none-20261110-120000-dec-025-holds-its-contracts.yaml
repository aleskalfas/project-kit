kind: none
body: >
  The picture record, DEC-025, is trimmed in place (#2992). Each rule is
  said once, in its point, with its reason once in the Rationale, and the
  detail the capability's pages hold, its review trail and its Task plans
  leave the record. Every point keeps its number and every rule stands, so
  no command, file, key or check changes, and no surface moves.
