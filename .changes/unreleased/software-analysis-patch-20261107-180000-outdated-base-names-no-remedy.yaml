component: software-analysis
kind: patch
custom:
  category: Changed
body: >
  `pkit analysis check-numbers` reports an outdated base as the friction change
  check does since #2662 (#2830; COR-050 point 12). The note says that the base
  moved on after the branch left it, and that the numbers were compared with its
  tip. It no longer advises a merge or a rebase onto the base, or a second run:
  whether and how a branch takes in its base is the project's to decide. An
  outdated base still fails nothing, and the `outdated` key of the `--json`
  document is as it was. The advice on a number the base has taken is unchanged.
