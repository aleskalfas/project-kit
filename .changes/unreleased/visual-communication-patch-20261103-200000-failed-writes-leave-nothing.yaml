component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  A command that fails while writing leaves nothing half-written (#2510).
  `render`, `export`, `produce`, `write-code` and `add` each write the files
  of a run as one change, its records last: where a write fails, the command
  prints `error: …` naming the file and exits 1, where it ended in a
  traceback, and puts every file back as it was before the run, the
  location's record included, or names each it could not put back. So a
  failed `render` keeps the previews from before whole, a failed `export`
  removes the files it wrote, a failed `produce` keeps the variants its
  record names, and a failed `write-code` never leaves new code beside its
  old record. A render takes the findings record's key before its first
  write, so every refusal writes nothing. An export takes a number past
  every file of its exports folder too, so a file the record does not name
  refuses no later export and is never overwritten. The search for a draft's
  lock stops after 10 000 versions tried, and the render then refuses,
  naming the libraries it was choosing.
