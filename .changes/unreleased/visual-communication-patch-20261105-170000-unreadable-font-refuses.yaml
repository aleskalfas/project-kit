component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  A font file the engine cannot measure from refuses as a missing font does,
  naming the file, where it stopped the command with a traceback (#2608).
  `pkit visual render` and `pkit visual export` refuse, and `pkit visual check`
  reports `font-missing`. A side of the before-and-after `pkit visual add` shows
  says why it cannot be drawn, for a font it cannot measure from or embed, and
  the run goes on.
