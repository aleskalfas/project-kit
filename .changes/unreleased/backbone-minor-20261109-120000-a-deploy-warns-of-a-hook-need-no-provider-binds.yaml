component: backbone
kind: minor
custom:
  category: Added
body: >
  Every command that deploys warns of each `needs:` entry whose hook no
  provider binds, as COR-013 point 4 has install and sync check it (#2467).
  `pkit init`, `pkit sync`, `pkit upgrade`, and a capability's install,
  register, upgrade and uninstall each print a `warning` line naming the agent
  or skill, its file and the hook. A hook whose providers collide at its
  winning tier is named with both. The warning writes nothing and fails
  nothing. `pkit validate` and `pkit refs validate` fail such a need, as before.
