component: backbone
kind: minor
custom:
  category: Added
body: >
  The core's operational rules are now the backbone's loaded rule set `OPS`,
  in a new area, `.pkit/rule-sets/` (COR-068). Each rule keeps its number and
  gains a permanent id, a status and an origin: core rule 19 is
  `backbone:RS-OPS-019`. `.pkit/rules/core.md` keeps its path and is generated
  from the set, each rule headed `### N. Title (RS-OPS-0NN)`, and arrives with
  the set by sync as before. The rule-set schema gains an optional `loaded`
  key, which refuses a scope, an inheritance, checks and extension points.
  `pkit rule-sets generate` writes a loaded set's file, and `pkit validate`
  fails one out of step with its set where the set is authored. Its `refs`
  member warns of a citation such as "core rule 99" of a missing or retired
  rule. Each rule of `OPS` is anchored, or gives the reason it has none,
  so the friction checks now run in every project from its first install
  and count none of them as unanchored. A project's own `project.md` stays
  a plain file and needs no migration; the rules README says how to
  convert it.
