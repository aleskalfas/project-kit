component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit validate`'s backward citation check no longer flags un-actionable
  references on kit-owned agent/skill content (#584). Three kinds of body path
  reference are exempted from the reads.paths-declaration requirement because
  they are not overlay-resolved external reads: anchor/same-file links (already),
  decision-record links (`[COR-026](.../COR-026-…md)` — the record is the real
  reference, checked separately), and a capability artifact's pointers into its
  own tree (`scripts/*.py`, sibling sub-procedures, `project/config.yaml`).
  Record and hook citations, and paths resolving outside the capability, are
  still flagged. Also resolves a bare sibling `storyboards:` entry against the
  agent's own directory (not just target-root), fixing a false "file does not
  exist" for capability agents whose storyboard sits beside them.
