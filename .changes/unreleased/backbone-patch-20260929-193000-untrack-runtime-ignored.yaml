component: backbone
kind: patch
custom:
  category: Fixed
body: >
  Upgrading now untracks the runtime-local files an adopter committed before
  their `runtime_ignore` declaration shipped (#288). The rendered
  `.pkit/.gitignore` ignores them, but an ignore rule does not untrack a file git
  already tracks, so a committed `sandbox-provenance.yaml`, diagnose log or
  `__pycache__/` stayed tracked for good. A backbone migration at 1.150.0 removes
  every tracked file the rendered `.pkit/.gitignore` ignores from the index with
  `git rm --cached` alone: the working copy, which is per-machine state, is never
  touched, and the removal is staged for the operator to commit. Only declared
  files move — git's own matcher decides, against that file alone, so a shared
  `config.yaml` or a file the adopter's own `.gitignore` ignores but tracks on
  purpose stays tracked, and private visibility does not hide the declared ones.
  It is skipped while a merge, rebase, cherry-pick or revert is in progress, a
  path whose staged content git would refuse to drop stays tracked, and both are
  reported with the command to finish by hand. A re-run finds nothing to untrack
  and says so. Once the removal is committed, another clone that pulls it while
  still tracking the files has git delete its copies; the migration's report
  says to untrack them there first.
