component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The ownership rule now recognises every declared position of an adopter's
  `project/` tier, rather than only the one directly under an area (#823). It
  matched `.pkit/<area>/project/` alone, so the adapter settings pair —
  `.pkit/adapters/<harness>/settings/project/`, which nests one level deeper —
  fell through to the closing "everything else under `.pkit/` is the kit's"
  rule. The tier is enumerated by position rather than by searching for a
  `project` component at any depth: a `project/` directory inside a kit-owned
  refresh root (`<area>/core/`, a capability subdir) belongs to the kit and is
  overwritten and pruned like any other kit content, which ADR-012 Decision 2
  already pinned for capabilities. The file that holds an adopter's own permission additions was therefore
  reported as kit-owned. The consequence is not what the report assumed and is
  worth stating precisely, because the predicate's name (`is_sync_managed`)
  describes a consumer it does not have: `pkit sync` never calls it, and decides
  what it writes through the copy path, which already treats adopter-owned files
  as seed-once — verified by installing a scratch adopter, writing a sentinel
  into that file and running a sync, which left it byte-identical. The one
  production consumer is the agent-overlay write-authority guard, so the real
  effect was that an adopter could not grant an agent write authority over their
  own allow-list: the guard rejected the path as kit content. It now accepts it,
  while still refusing the kit's half of the same settings pair. The same
  depth-1 assumption is fixed for capability subtrees. A test asserts the two
  ownership predicates never contradict each other across the real tree — a path
  the tier rule calls the adopter's can no longer read as the kit's — and the
  predicate's docstring, the lifecycle README and the test module now say what
  the predicate actually governs, since the previous wording is what produced
  the misfiled report.
