component: backbone
kind: patch
custom:
  category: Fixed
body: >
  Every `pkit new` command that stamps into a folder a sync may write now
  refuses one whose files the project receives as synced copies, as
  `pkit new decision <capability>` did alone before. That covers
  `new decision core`, `new agent` and `new storyboard` for a core or
  capability agent, `new schema` for the core schemas area or a capability,
  and `new migration` for the backbone or a capability. Each asks the
  lifecycle's ownership predicate (`is_synced_copy`) before it writes
  anything, in a dry run too. Where the folder holds synced copies, the next
  sync would overwrite what the project writes there, so the command writes
  nothing, exits 1, and names the folder and where the project's own
  artefact goes. In the methodology's source repository, and for a
  capability incubated in the project, each stamps as before.
