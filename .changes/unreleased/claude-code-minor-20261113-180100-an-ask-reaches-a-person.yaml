component: claude-code
kind: minor
custom:
  category: Added
body: >
  The adapter answers the harness requirement `ask-reaches-person` at a cost,
  for Claude Code 2.1.321, the version a trial on an agent host ran (#3004).
  A session keeps a person who answers its asks. In a turn that something
  other than a person answers, each ask is refused, and the refusal reads as
  the person's own. In a turn nobody answers, each ask holds the turn until
  someone answers it. The README's "Harness support" says so, with what the
  trial saw.
