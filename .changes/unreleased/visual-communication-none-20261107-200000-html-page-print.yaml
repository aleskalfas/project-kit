component: visual-communication
kind: none
body: >
  Design-ahead: DEC-026, accepted, decides how a printed HTML page file sets
  its pages: one after another down the reader's sheets, a page that does not
  fit moved whole to the next sheet, and a page taller than a sheet run on.
  Only a fixed page, such as a deck's slide, prints inside its keyline, and the
  backdrop stays on screen. Each page prints on the browser's ground in its own
  colours, and the file picks no mode for print (#2824). DEC-020, DEC-023 and
  DEC-031 state what it decides of them, and the page on outputs says what such
  a print will give. Nothing is built yet, so no command, file or check moves.
