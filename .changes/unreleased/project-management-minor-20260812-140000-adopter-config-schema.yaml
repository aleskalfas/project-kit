component: project-management
kind: minor
custom:
  category: Added
body: >
  The adopter's `project/config.yaml` now ships a companion JSON Schema
  (`schemas/config.schema.json`), bound to the installed config path by a
  COR-023 `binds_to:` glob, so `pkit data validate` resolves it instead of
  reporting `no schema binding found` (#691, from #689). The schema enumerates
  every documented key — `default_branch`, the `gh:` host/owner block, the
  Projects-v2 board flag plus board id and cached node id, doc-path mappings,
  milestone categories, the review mode and registered agents, mesh peers, and
  the pre-close triage lead time — with `additionalProperties: false`, so an
  unknown or misspelled key is a loud refusal naming the offending key rather
  than a silent default. That closes the reported gap where
  `has_projects_v2_boards` (trailing `s`) validated fine and left the adopter
  in label-fallback mode until classification landed in the wrong substrate;
  `pre-check` covers value-level problems but cannot see a key that was never
  read. The required set mirrors `pre-check`'s, so the two gates agree, and
  `schemas/config.yaml` doubles as the shipped reference instance an adopter
  copies. The glob is anchored at the installed path rather than the
  `**/config.yaml` form the sibling schemas use, because `config.yaml` is a
  generic name that a bare glob would also claim on unrelated files.
