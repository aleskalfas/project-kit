component: project-management
kind: minor
custom:
  category: Added
body: >
  New `pkit project-management history <N>` (#698, DEC-049) — renders an issue's
  **engine journal**, the canonical pkit-governed audit trail of lifecycle moves,
  so the state log is **discoverable** without hand-reading the GitHub timeline
  (the #672 "looked unlogged" gap). `--check-drift` surfaces the **governance
  boundary**: it diffs the journal against the GitHub timeline's `state:*` label
  events and flags state changes with no journal entry — an ungoverned change (a
  manual label edit / raw `gh`), or a governed move the journal didn't record
  (drift accuracy sharpens once the journal is fully reliable, #697). Read-only.
