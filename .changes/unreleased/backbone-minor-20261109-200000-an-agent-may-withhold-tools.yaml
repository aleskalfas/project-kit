component: backbone
kind: minor
custom:
  category: Added
body: >
  An agent's definition may name the tools it is withheld, under `withheld`, in
  place of the tools it is granted, under `tools` (COR-013 point 7, #2951). It
  names one of them or neither, never both. One reader in the agents area,
  `.pkit/agents/tool_access.py`, reads a definition's tool access for the
  deploy, the agent runner and `pkit refs validate`, and sync copies it with the
  area. The validator reports as an error a definition whose tool access the
  reader refuses, such as one naming both keys, and reads the storyboard check's
  `Read` through it, so a definition with no grant passes and one withholding
  `Read` fails. Where the project's tree holds no reader, it records an error
  that says whether to run `pkit sync` or upgrade `pkit`. It warns of each key in
  an agent's definition that is none of its fields, such as Claude Code's
  `disallowedTools`. Core's harness requirements gain two:
  `session-agent-withheld-tools` and `helper-withheld-tools`.
