component: project-management
kind: patch
custom:
  category: Changed
body: >
  Every listing of issues in project-management now runs through one read,
  which leaves state issues out by their marker, as DEC-058 point 3 decides
  (#2139). An issue whose description holds the line
  `<!-- pkit:state-issue … -->`, outside a code block, is then no child, no
  parent and no carrier of a workstream. It is in no sample of pre-check or
  adopt-existing, and nothing back-fill, link-parent or a migration's
  label-delete acts on. No state issue exists until the state-issue primitive
  is built, so every issue of work reads as before. A listing that reached its
  limit is judged by every issue it returned, state issues included. The check
  a label-delete makes that no issue uses the label reads a page of 100 issues
  instead of one, so that a state issue on it hides no issue of work.
