component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  `pkit visual look` draws each run of a line in its own font and weight
  (#2712). Where a run's face lacked any character of its line, the run could
  take the font of the face that held the line, so a strong run beside a plain
  one came out regular, or a plain one semibold, and the report said nothing.
  The tool shaped the whole line in each run's font. Each run on a line now
  reaches the tool as a piece of its own, as the engine measured it, on a line
  anchored at its middle or its end too. The `drawn-otherwise` list holds what
  it held, and says now that the tool may set the whole run on a line in one
  family, no longer the whole line.
