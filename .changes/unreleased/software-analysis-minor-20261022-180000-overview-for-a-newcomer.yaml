component: software-analysis
kind: minor
custom:
  category: Changed
body: >
  An analysis's overview is written for a newcomer first, someone new to the
  analysis joining work on the component, who reads it from top to bottom,
  and it reads in two parts. The story opens with what the component is for:
  the title of the accepted decision record that the analysis's new optional
  `purpose` setting names, linked, or a line that says no record states it
  yet. Then two sentences say what the analysis is and what it builds on,
  such as "This analysis describes what core does: who uses it, what they do
  with it, and what it must meet. It builds on no other analysis." The areas
  follow in their order, each with its goal, the areas it builds on, read from
  its use cases' `after`, its requirements, read from their folder, and its
  use cases. An area with a goal and no use case yet shows as not written yet, so
  such a goal no longer fails the check. Reference follows, under its own
  heading. One table there shows who takes part, with each actor's new
  optional `summary`, the first sentence of its opening, which the check holds
  equal to it where the format rule binds. The concepts, the requirements in
  no area, the journeys, each with its flow, and the open shortfalls follow
  it. The overview no longer shows the requirement map, the chain of use
  cases or the use-case diagram. Reference ends with one line that names
  `pkit analysis diagram`, which prints them, with its subjects.
  `pkit analysis validate` fails a
  `purpose` that names no record, one that is not accepted, or another
  capability's decision, and warns of an area of requirements without a goal.
  An area's goal is one phrase that starts with its verb, a summary goal over
  the area's use cases, such as `010-ordering: Place an order and pay for it`,
  as the README, the authoring skill and that warning say.
  The overview's fingerprint reads other data of the analysis, and its
  version is 4, so an overview written before is a warning until
  `pkit analysis overview` writes it anew. DEC-001 point 1, DEC-002 point 3
  and DEC-003 are refined in place.
