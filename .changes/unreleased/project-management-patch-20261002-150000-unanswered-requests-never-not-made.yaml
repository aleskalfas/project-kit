component: project-management
kind: patch
custom:
  category: Fixed
  pr: "1303"
  requires_backbone: release
body: >
  `done-work`, `merge-pr` and `land-work` no longer conclude that a merge or
  an enqueue was not made from one reading. When the backbone settles a
  request that got no answer, the verbs take its word. If the backbone says
  the request was made, the landing goes on. If two readings did not see it
  made, the landing fails, the verbs say the request may still show, and a
  re-run reads the pull request first and completes it if it has merged
  since. `merge-pr` now records the after-merge steps as owed whenever its run
  sent a merge or an enqueue GitHub did not refuse and did not see merged, so
  its re-run completes a merge that showed late instead of refusing it as
  merged by someone else. If the backbone says the request is unconfirmed,
  the verbs report it unconfirmed, exit 4, and name `pkit pull-request read
  <PR>`. When the backbone gives no answer at all, the verbs read the pull
  request once. Merged is the merge and queued is waited for; anything else
  is now unconfirmed, exit 4, where it used to be "not made". When taking a
  pull request out of the queue ends unconfirmed, the verbs say whether it
  left is not known, never that it failed. When it finds the pull request
  merged, they say it merged and at which head. The backbone's `[warn]` line
  that a request is in flight is passed on as it comes. The bounds on the
  backbone's answers now hold the longest the backbone states each command
  can run: a minute and a half for a reading, three and a half minutes for
  a merge or an enqueue, and ten for a dequeue. Upgrade the capability
  together with the backbone: it needs the release that settles an
  unanswered request.
