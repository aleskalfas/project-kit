component: living-docs
kind: patch
custom:
  category: Changed
body: >
  living-docs' README becomes a reference for the AI agent that uses the
  capability (#2397). It keeps the install, the authoring command and the
  connections, and links its guide for people. Four pages beside it hold the
  rest: `pages.md` (a page's fields, kinds, types, sources and visual
  elements), `spaces.md` (declaring spaces, definitions and `LDOC`),
  `validation.md` and `agent.md` (the agent, onboarding and the review
  contribution). Every section that moved keeps its old address on the README.
  The `living-docs` agent and the `docs-author` skill read the four pages
  beside the README.
