component: project-management
kind: minor
custom:
  category: Added
body: >
  New `comment-issue` / `comment-pr` verbs (#586, DEC-047): the project-manager
  agent — denied direct `gh` writes — can post a freeform comment (evidence,
  analysis, triage notes) on an issue or PR through the validated path, instead of
  a human pasting it. Membership + foreign-repo guarded, `--dry-run` / `--yes`,
  `--body` (comments take `--body` only; `--body-file` stays reserved for body
  writes). Because the methodology drives its merge gate off
  comment text, the verb refuses a body whose first line would impersonate a
  structured comment — a DEC-028 reviewer verdict, a human-mode `Approved`-prefix,
  or a DEC-014 audit template — so a freeform note can never spoof the gate or be
  read as an audit record; every posted comment also carries a `<!-- pkit-freeform
  -->` marker. No migration.
