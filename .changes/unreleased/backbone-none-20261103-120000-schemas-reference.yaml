component: backbone
kind: none
body: >
  The schemas area's README, `.pkit/schemas/README.md`, becomes a reference
  for the AI agent, linking its new guide at `latest` (#2493). It keeps the
  schema pair, its YAML and JSON Schema conventions, the references between
  schemas, the tooling, the layout, and what a rule set is beyond its
  file's shape. Three pages beside it hold the rest: `backbone-files.md`
  (the backbone file schemas, the container, the friction block, answer
  files and a rule-set file's shape), `shape-patterns.md` (the common shape
  patterns) and `data-binding.md` (how adopter data binds to a schema).
  Every moved heading keeps its address in the README, as a heading that
  links its new home. Why schemas exist moves to the guide, which does not
  ship. No command, path or format changes, so no surface moves.
