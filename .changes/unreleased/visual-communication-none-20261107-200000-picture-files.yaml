component: visual-communication
kind: none
body: >
  DEC-025, accepted, decides how a picture file reaches a piece and a library's
  part (#2794): content names a file of the piece's `pictures/` folder by its
  bare name, a library's part names a file of its own version, and a brand
  gives its logo as the value of the picture role `picture.logo`, which no
  brand owes. It names the PNG and JPEG encodings read, and has the picture
  group land before the foundations' first release. Six accepted records say
  what it decides of them. The record designs ahead: the picture file lands in
  later pull requests, so no command, path or file format changes, and no
  surface moves yet.
