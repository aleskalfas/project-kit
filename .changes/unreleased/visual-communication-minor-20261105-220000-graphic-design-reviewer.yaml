component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `graphic-design-reviewer`, the capability's agent, in its first form (#2675).
  Dispatched on demand, it reads the images `pkit visual look` draws, with the
  piece and the brand, and the frames and the report beside them, and reports
  what no check measures. Its findings are faults, which its list names, or
  notes, each naming the page and the element's trace id, and its report says
  which pages, languages and modes it looked at. It is read-only and advisory.
  It needs a harness that reads images, and stops and says so where it has none.
