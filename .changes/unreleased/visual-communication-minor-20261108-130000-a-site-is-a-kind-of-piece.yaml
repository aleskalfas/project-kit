component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The foundations ship a top, `site`, whose pages are web pages (#2818,
  DEC-022). A single web page is a site of one page, and a portal a site of
  several. Its pages lie in its field `pages`, each in its layout `standard`,
  whose slot is `main`, or drawn by the component it names. Every page in a
  layout takes the site's optional `header` and `footer`. A page is as wide as
  the new shared role `size.site`, whose default is `{size.slide}`, and as tall
  as its content. A layout of a top whose layouts are its pages' forms may say
  its page's height under `preferred`, and must where its top asks for none. It
  never says a width. The neutral brand's version being built, 1.1.0, gives
  `desktop`, `tablet` and `phone`, its `size.site` 1,280, 768 and 390 px. The
  check asks for attention where a piece's top is as wide at a size as at the
  default (`size-width`). A finding in what a site's header or footer draws is
  reported once, naming its pages. The release's comparison breaks a top that
  starts or ceases to ask for a height. The foundations' version being built,
  which holds `device`, now also holds `site` and `size.site`. `pkit visual
  look` draws a page too tall for one image in bands, `<stem>.band-<k>.png`,
  through the SVG renderer and through the browser alike, each with its frames,
  and its report lists each page's bands in order. A page too wide for one image
  whose smallest text reads is drawn 1,568 pixels wide, and the report marks it
  `too-wide`. The PDF renderer 1.2.0 draws a page taller or wider than 14,400 pt
  smaller to fit, and reports the loss; every other page draws as before, but
  for the version the file names. The reviewer reads every band of a page and
  has each size a piece names drawn, and the `visual-author` skill offers
  `foundations/site` and `device`.
