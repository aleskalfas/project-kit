component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A piece may name the format `svg-modes` (#2772), whose switching file follows
  the reader's colour scheme: one SVG file for each page, language and set of
  combinations that share one, under the first key it serves, its extension
  `svg`. Its plain drawing is the first key's one-key file, and a rule under
  `prefers-color-scheme` repaints each other key's colours, arrowheads and
  pictures. The SVG renderer's declaration names the format under
  `holds-modes`, with the colour scheme's pairs alone. An export reads each
  switching file in each combination it holds and compares it, element by
  element, with the SVG renderer's file of that combination; a difference stops
  the export unless `--use-differing <element>`, on export and upgrade, names
  it, and the record of exports keeps it under `differing`. The check fails a
  piece that names both `svg` and `svg-modes` (`exports-same-name`), or whose
  combinations differ in a mode of no pair the format reads
  (`exports-unpaired-mode`), and every export refuses it. A page of a switching
  file with no ground of its own asks for attention (`switching-no-ground`), as
  does a published piece's copy made with an element let through
  (`current-copy-differing`). mark-final names each element let through. The
  SVG renderer stays at 1.1.0, and the seam at 5: a one-key file draws as
  before.
