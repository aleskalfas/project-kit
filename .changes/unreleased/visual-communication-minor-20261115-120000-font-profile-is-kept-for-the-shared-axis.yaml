component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The name `font-profile` is kept for the shared axis of font profiles (#3274,
  DEC-057), in the release that lets a brand hold axes of its own. An axis of a
  brand's own by that name fails as `own-axis-name`, whether or not the
  foundations declare the axis, and the release comparison reads a new shared
  axis of that name as an addition, where a new shared axis by any other name
  breaks. No brand holds an axis of that name, since none could before this
  release.
