component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A draft's render holds back versions under which an item of the piece
  carries a key both its component and its list declare, or an end its lock
  finds would be lost, where neither happens under the lock (#2562, DEC-010
  point 2, DEC-011 point 4). It judges each whole combination it reaches by
  placing the piece under it, with no scene computed, and reads each
  component and picture of a version once across them. The search keeps one
  order, backs off first a library the fault implicates, and moves a library
  below its locked version only where nothing at or above it fits. Past 50
  combinations judged it keeps the lock, with the newest fitting version of
  each library the lock does not name yet. The render prints, as facts at
  the lock, each version it held back with the item and the key or the tie
  and the end (`held-clash`, `held-end`), each library it moved below its
  lock (`lock-below`), and a search that kept the lock (`lock-kept`); the
  findings record keeps none of them. A clash or a lost end the piece shows
  under its lock holds nothing back, and stays a finding.
