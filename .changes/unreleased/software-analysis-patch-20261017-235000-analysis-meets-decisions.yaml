component: software-analysis
kind: patch
custom:
  category: Changed
body: >
  software-analysis DEC-001 point 11 says how the analysis and a project's
  decisions and architecture point at each other. The analysis always anchors
  the solution: a use case anchors each record it rests on or that answers
  it, and each architecture view that realises it. No record and no view
  anchors the analysis. What a record serves is worked out from the
  analysis's anchors for display, and never stored. The use-case template's
  record anchor and the analysis-author skill say so, and the README says it
  in "How it meets your decisions". No check changes.
