component: backbone
kind: minor
custom:
  category: Added
body: >
  Implemented the COR-043 scratchpad reported side-state (#643): `pkit report
  bug|feedback|change-request --scratchpad <slug>` inlines a note into the
  report as a collapsed as-sent section, with a compose-time redaction lint on
  every path (drafts included; interactive findings prompt edit-or-send-anyway).
  An oversized note is sent as an excerpted body plus one overflow comment
  carrying the full as-sent text, confirmed as a single gesture; a partial
  failure (issue posted, comment failed) stamps nothing and names the created
  issue with remediation and the verbatim error (ADR-047 refinement). A fully
  successful post moves the note to the lazily-created `reported/` with
  refs/date/content-hash frontmatter — draft/URL paths stamp nothing. New `pkit
  scratchpad reported <slug> <ref>...` is the manual stamp gesture (accepts
  issue URLs, appends refs idempotently), and new `pkit scratchpad list`
  resolves reported refs live (offline degrades to "state unknown"), flags
  notes modified since reported, and prompts retirement when all refs close.
  `scratchpad done`/`drop` now also retire from `reported/` (removing the lazy
  directory when it empties), and every report verb warns pre-send when a
  reported note has drifted.
