component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit friction check --all` warns of an artefact that anchors a target whole
  beside anchors on the target's parts (#2659; COR-050 point 7). Whatever
  flags a part anchor flags the whole anchor, so the part anchors add nothing.
  The new finding kind, `whole-and-parts`, names the whole anchor and the
  anchors on parts beside it. It reads HEAD alone, with no history and no
  number. The whole anchor is a record or artefact anchor that names a record
  or a document whole, or a path anchor, for each file it stands on. The anchors
  on its parts name a record's live points, a document's sections or its lead.
  A value of a registered kind counts too, where the whole anchor stands on
  every file its resolver names. The finding is reported only and owes no
  answer, and an artefact that owes no answer has none. `pkit friction explain`
  shows it with what clears it. The JSON documents of `check --all` and
  `explain` add one key to each finding: `parts`, the anchors on parts a
  `whole-and-parts` finding names, `null` for any other finding. Their
  `schema_version` stays 1.
