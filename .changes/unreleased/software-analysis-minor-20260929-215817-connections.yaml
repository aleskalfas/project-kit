component: software-analysis
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  Connections (DEC-001 points 7 and 8): the capability provides the
  `pkit::analysis` role and defines the `pkit::analysis:revalidation-evidence`
  data point under it — executed results that confirm or refute an artefact at
  a commit, one entry per result keyed `<artefact>@<commit>#<check>`, the check
  being the name its filler gives one executed check, opening with the
  filler's own name (`project` for a project file's), the commit by its full
  name, an optional `steps` set by the artefact's kind (a use case's steps and
  variants by number and letter, a journey's use cases by id, none for an
  actor or a term), `union`, no default, inert policy `fallback` — with its
  companion schema, `schemas/revalidation-evidence.schema.json`, which reads
  alone, filled by a capability or by the project's filler file. A
  revalidation record keeps a copy of each entry it drew on, under `evidence`,
  whole and in the point's shape, so it shows that evidence whatever the
  fillers report later. `pkit analysis validate` fails a record copying
  evidence for an artefact it gives no outcome, since evidence supports an
  outcome and never replaces one; an entry whose id is not its own
  `<artefact>@<commit>#<check>`; and a journey's evidence naming a step that
  is no use case of the analysis, withdrawn ones counting. It warns on a
  `failed` result under `holds` or a `passed` one under `code-regressed`, and
  on a copy that differs from what the point now holds under its id; and where
  it reads the point, it warns on a capability's entry whose check opens with
  another name, and on an entry whose id is not its own. The capability contributes its actors in force to
  `pkit::documentation:readers` through a new query command, `pkit analysis
  fill-readers`: each actor a reader whose id is the actor's id in lower case
  (`ACT-tester` → `act-tester`) and whose description is its name and needs.
  The contribution is inert when no capability provides the documentation
  role. The check reads the evidence point through `pkit connections resolve`,
  which the backbone this release ships adds: upgrade the capability together
  with the backbone.
