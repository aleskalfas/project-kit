component: project-management
kind: patch
custom:
  category: Fixed
body: >
  After a merge, `done-work` and `merge-pr` switch their clone to the default
  branch and pull it only where the clone is on the merged pull request's
  head branch with a clean working tree. A clone on another branch or a
  detached HEAD, or with uncommitted changes, untracked files included, is
  now left where it is, nothing pulled, and the merged branch's local copy is
  kept, said in one line. Before, the clean-up checked out the default branch
  whatever the clone held, so a worker's clone in the middle of a Task was
  moved onto it with its changes, and its next commit could land there. A
  clone already on the default branch with a clean working tree is still
  brought up to date, by a fast-forward only and with no switch, and the
  merged branch's local copy there is now kept, said in one line. A
  fast-forward that fails warns and changes nothing. Where the switch fails,
  the clone stays on the head branch and the local copy is kept, with a
  warning, rather than a delete that cannot succeed. The deletion of the head
  branch on GitHub is unchanged. `land-work` lands through `done-work`, so it
  treats its clone the same way.
