component: visual-communication
kind: none
body: >
  DEC-072 decides which roles the foundations' shared roles gain from what
  rebuilt presentations lacked (#3488). They gain `type.lead`, for running text
  read before the body, defaulting to `type.body`, so no brand owes it a value
  and none breaks. It names a use of running text, not which text is a page's
  lead. The deck's lead token comes to default to it, and the starter gains
  `starter.type.lead`, defaulting to it, for its title's lead. The neutral brand
  gives it a step above the body at every size. A display type, an emphasis
  type and a second accent are not added: each waits until the person calls a
  rebuild's stand-in for it short of shipping at a ship call, or a project
  files an issue asking for it, since a shared role is cheap to add and costly
  to remove, and only the lead held a page back. The role, the deck's token,
  the starter's role, the neutral brand's values and the capability's pages
  follow in a slice under #3149. No surface moves here.
