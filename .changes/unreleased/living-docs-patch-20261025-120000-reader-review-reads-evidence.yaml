component: living-docs
kind: patch
custom:
  category: Fixed
body: >
  The `living-docs` agent's reader-review reads the reading-evidence point,
  as DEC-001 points 6 and 7 say it does. It resolves
  `pkit::documentation:reading-evidence` and takes the entries for the page,
  each the result of an executed check that followed it. It reads them as
  advice that never replaces its own reading, and its findings record names
  each entry it read, by its `id`. Where the point holds no entry for the
  page, or does not resolve, the review runs as before.
