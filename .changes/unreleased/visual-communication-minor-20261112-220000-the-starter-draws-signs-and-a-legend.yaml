component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The starter's version being built, 1.1.0, draws each concept's sign beside its
  colour, and holds a legend (#3048; visual-communication DEC-036 points 2, 3
  and 6). Each component that paints a part from its concept's colour family
  places a sign part, painted in the family's text: a card, a group, a code
  block and an aside at the end of the head's row, or, a card, a code block and
  an aside with no head, at the end of their first row, which leaves it room; a
  tag and a button before the label; a field inside its box; a header before its
  title; a section before its head; and a connector halfway along its line. A
  component whose concept maps no sign draws none, and lays out as before. A run
  of a card's text, and a plain run of a code block's, that names a concept with
  a sign starts with that sign. The new pattern `legend`, experimental, draws its
  `entries` in a row, each a tag in its concept's family with its sign, beside
  the label content gives in each language; the component field `entry` names
  another component to draw them. The starter adds the role `starter.sign`, the
  side of a sign's square, whose default is `{space.3}`, and reads the
  foundations' `space.sign-gap`, so it needs the foundations' version being
  built. Its README covers the sign parts and the legend.
