component: project-management
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The capability ships its operational rules as its loaded rule set
  `PM`, whose `rules.md` every session loads wherever the capability is
  installed (COR-070): a pull request that closes issues names each with a
  closing keyword, first in its body as the PR template puts it; and an issue
  carries one value on each required axis the project's substrate map
  carries. Branch naming, and a branch's related issue, stay core's (COR-008).
