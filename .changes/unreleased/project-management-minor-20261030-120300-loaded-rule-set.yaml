component: project-management
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The capability ships its operational rules as its loaded rule set
  `PM`, whose `rules.md` every session loads wherever the capability is
  installed (COR-070): a pull request's body opens with `Closes #<issue>`, by
  the PR template; work starts from a Task the tracker holds, and its branch
  and pull request link to it; and an issue carries one value on each
  classification axis. Branch naming itself stays core's (COR-008).
