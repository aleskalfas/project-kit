component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit friction artefacts --json` gives each artefact's path anchors with the
  files each stands on, `path_anchors`, matched by the rule both friction checks
  use: what `friction.exclude` leaves out and the answer files are not among
  them, and a dead anchor stands on none. A capability's script reads what such
  an anchor covers from it, and matches no pattern itself.
