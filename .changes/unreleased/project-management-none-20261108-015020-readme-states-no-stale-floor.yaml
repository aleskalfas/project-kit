component: project-management
kind: none
body: >
  Only the README's wording moves (#2867). The passage on `create-issue
  --from-report` no longer says the command needs backbone v1.144.0+, "the
  capability's declared floor", where the package's floor is 2.1.0. It says
  the command needs a backbone that ships `report link`, as every backbone in
  the range the capability's package.yaml declares under `requires_backbone`
  does. The range itself and the command stay as they were, so no surface
  moves.
