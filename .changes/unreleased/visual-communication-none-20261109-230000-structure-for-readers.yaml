component: visual-communication
kind: none
body: >
  Design-ahead: DEC-033, accepted, decides how a piece declares what a reader
  who does not see it gets: a run's structure and its link, a text's heading
  or caption, a list, a picture's text and a reading order, in words the
  format fixes and each renderer spells (#2739). DEC-001, DEC-002, DEC-003,
  DEC-005, DEC-006, DEC-009, DEC-012, DEC-019, DEC-020 and DEC-025 state what
  it decides of them, and the outputs page says what the PDF's later tagged
  version gives emphasis, an instance's text and a picture not drawn. Nothing
  is built yet, so no command, file or check moves.
