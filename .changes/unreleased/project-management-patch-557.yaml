component: project-management
kind: patch
body: >-
  The create-issue `--body-file` first-line parent-ref check now consults the
  hierarchy mode, mirroring the requiredness gate above it. Under
  `hierarchy: advisory` a non-parent-ref first line is accepted (parentless,
  body verbatim) so a flat brownfield tracker can file a prepared parentless
  body; greenfield / `hierarchy: gated` still hard-rejects a non-parent-ref
  first line unchanged.
custom:
  category: Fixed
  pr: https://github.com/aleskalfas/project-kit/issues/557
