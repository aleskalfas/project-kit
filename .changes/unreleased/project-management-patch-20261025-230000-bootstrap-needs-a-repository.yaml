component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The command `bootstrap` refuses when no GitHub repository resolves for the checkout,
  `--dry-run` included, and exits 2 (#2087). It names what is missing, with
  the reason `gh` gave, and how to add it: a remote on GitHub and `gh auth
  login`, or `gh` itself. Until now a dry run printed `target repo:
  <unresolved>`, planned its labels and exited 0, and a missing `gh` ended in a
  traceback. The README's setup now says the capability needs a GitHub
  repository, and its config example declares the workstreams in
  `project/workstreams.yaml`, so `pre-check` no longer calls it a legacy
  fallback. The config reference names no version that has not shipped.
