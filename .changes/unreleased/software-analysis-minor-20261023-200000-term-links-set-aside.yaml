component: software-analysis
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  The term links `pkit analysis link` writes no longer flag what rests on the
  documents that hold them (#1844, software-analysis DEC-004 point 7). The
  places of the glossary and of the domain-model views declare the links'
  form, a link to a glossary entry, as the core's derived links (COR-050 point
  5). So a change that only adds, removes or retargets those links asks no
  revalidation of the views and pages that rest on an entry or a section. A
  word changed beside a link still does. A revalidation whose only edit is
  links is `unchanged`. The declaration needs the backbone this release
  ships. The README says what a moved link asks.
