component: project-management
kind: minor
custom:
  category: Changed
body: >
  The `pm-reviewer` agent states its read-only claim precisely: it never
  changes the pull request, a tracked file, the repository or the issue
  tracker, which is not "writes nothing anywhere". Its body gains the
  `## What read-only covers` section every reviewer that can execute
  carries: the working files a review needs — a dumped diff, a script, a
  reproduction, captured output — go in the agent workspace, never loose in
  the repository, where an author's `git add` would commit them, nor in
  `/tmp/`, and a review leaves no file of its own outside the workspace. The `pm-reviewer` agent gain the `Write` tool, scoped by their bodies to the agent workspace, so a review's working files land there without a prompt instead of through a shell redirect, which the permission hook judges like any other shell write.
