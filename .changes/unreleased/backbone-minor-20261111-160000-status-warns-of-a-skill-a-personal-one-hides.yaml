component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit status` warns of each skill pkit deployed that a personal skill of the
  same name hides, naming the skill and the personal skill's folder (#3033).
  Claude Code runs a skill in `~/.claude/skills/` over the project's of the same
  name, so a person's own skill could hide one pkit deployed, such as `pm`, with
  no sign. The warning appears under `hidden skills` in the adapter section. It
  reads names only, follows a link in the personal skills folder, says nothing
  where that folder is missing, and fails no command.
