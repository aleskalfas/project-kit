component: software-analysis
kind: minor
custom:
  category: Added
body: >
  The new command `pkit analysis renumber <id> [--to <id>] [--base <ref>]
  [--dry-run | --yes]` gives a use case, a journey or a requirement your branch
  numbered a free number before your change reaches the default branch, with
  every reference to it (DEC-001 point 3). It renames the artefact's file,
  rewrites its `id` and its heading, and rewrites each mention of the id in the
  repository's analyses: front matter, anchors and deferrals, prose, links to
  the file or its heading, revalidation records, and a mention written with
  its analysis's name, such as `core:UC-021`. Each overview that names the id
  is drawn anew. Without `--to`, the new number is the next free one, as the
  stamp would give it. The command refuses an artefact the default branch
  holds, a number your working tree holds, and one not past every number the
  default branch holds or its history gave. It shows the files it would change
  first: `--dry-run` writes nothing, `--yes` writes, a terminal is asked, and
  off a terminal it refuses. Each collision `pkit analysis check-numbers`
  reports now names the command, with the base where it is not the default
  branch.
