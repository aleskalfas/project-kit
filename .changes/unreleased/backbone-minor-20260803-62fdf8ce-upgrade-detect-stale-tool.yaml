component: backbone
kind: minor
custom:
  category: Added
  pr: https://github.com/aleskalfas/project-kit/issues/574
body: >
  `pkit upgrade` now runs a best-effort staleness check against the release
  source (`git ls-remote --tags` on the compiled distribution URL) and, when the
  installed tool is behind the latest release, prints the exact `uv tool install
  --force <url>@v<latest>` command to update it (then re-run `pkit upgrade`) — it
  installs nothing itself (ADR-044). When the tool is current it says so plainly
  instead of the ambiguous "nothing to upgrade". The check is read-only and
  never fails the command: any lookup failure (offline, missing credentials, git
  unavailable, timeout) warns loudly and continues with today's project sync, and
  it is suppressed on a source checkout / self-host.
