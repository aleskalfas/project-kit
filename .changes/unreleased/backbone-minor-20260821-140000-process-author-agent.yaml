component: backbone
kind: minor
custom:
  category: Added
body: >
  The core `process-author` agent — COR-044's teeth tier, and the first
  producing agent at core: it writes the predicates behind every evaluable a
  process definition declares (detection, gates, entry guards, `resume_when`,
  invariant checks, both hand-off seams), fail-closed and read-only, routing
  shape problems back through the `process` skill rather than editing shape by
  hand. Its edit authority rides a new overlay category,
  `process-authoring-targets` (per ADR-051), which ships as an explicit empty
  list: the agent deploys owning nothing until you list your own definition
  files and predicate-script locations at file granularity. No entry may
  resolve into sync-managed content — the deploy resolver refuses it, names the
  offending path, and skips the agent, using a single sync-managed predicate
  now propagated at `.pkit/lifecycle/ownership.py` (origin-aware, so a
  kit-shipped capability's `project/` tree and an incubated or unregistered
  subtree are all admissible) rather than a per-adapter copy. `pkit agents
  reconcile --write` fills the category with `[]`, and `adopt` now says plainly
  that it cannot serve a category naming paths only you can enumerate. An
  install that predates the category upgrades into the deploy skip until the
  key is added — safe, loud, no migration owed (#686).
