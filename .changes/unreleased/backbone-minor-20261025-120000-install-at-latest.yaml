component: backbone
kind: minor
custom:
  category: Added
body: >
  One install command gets the highest release:
  `uv tool install git+ssh://git@github.com/aleskalfas/project-kit.git@latest`
  (#2052). The tag `latest` points at the highest release's commit, and the
  release workflow moves it there whenever a release lands. `pkit init` ends by
  printing that command, the errors of `.pkit/cli/pkit` that advise installing
  pkit give it, and the command reference's "Installing pkit on PATH"
  recommends it. Version tags stay as they are: a project records the exact
  version it runs, `@v<version>` installs a given release, and `pkit upgrade`
  picks the highest `v<version>`, skipping `latest`. A git clone that fetched
  `latest` before must force-fetch it (`git fetch --force origin tag latest`),
  while `uv tool install` fetches it afresh.
