kind: none
body: >
  DEC-046, proposed, places the four gaps the review's first calibration found:
  craft, typography and colour each gain a rule in GRAPHIC, and legibility at
  the medium's size stays RS-GRAPHIC-005's, its two sentences judged apart
  (#3225). It is a design-ahead record: the rule sets, the checks and the
  design knowledge follow in later work under #3148. No surface moves here.
