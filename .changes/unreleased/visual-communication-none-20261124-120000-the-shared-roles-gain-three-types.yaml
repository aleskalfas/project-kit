component: visual-communication
kind: none
body: >
  DEC-072 decides which roles the foundations' shared roles gain from what
  rebuilt presentations lacked (#3488): `type.display`, above a page's title,
  defaulting to `type.title`; `type.lead`, running text between the body and a
  page's title, defaulting to `type.body`; and `type.emphasis`, a stressed span
  within running text whose manner, such as italic, is the brand's, defaulting
  to `type.strong`. Each default aliases an older type, so no brand owes a
  value and none breaks. The shared roles gain no second accent, since no older
  colour could stand in for it without merging the two things it sets apart.
  The roles, the deck's lead token, the neutral brand's values, the check and
  the capability's pages follow in a slice under #3149. No surface moves here.
