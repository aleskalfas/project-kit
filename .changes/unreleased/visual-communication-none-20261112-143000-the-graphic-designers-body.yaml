body: >
  The body of `graphic-designer`, which no release has shipped yet, says what
  DEC-030 decides on the points the review of #3057 left (#3058): it
  dispatches the reviewer whole, tells an empty grant the project set from one
  the capability wrote, scopes its asking to mending, and says that it commits
  only when asked. The pending minor that ships the designer declares its
  surface, so no surface moves.
