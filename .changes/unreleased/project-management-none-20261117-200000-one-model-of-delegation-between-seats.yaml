component: project-management
kind: none
body: >
  DEC-081, which a person accepts in this change (#3392), decides one model
  of delegation between agents over the tracker and the harness's messages:
  the topology of seats. A worker's seat may name the planner's or lead's
  seat that directs it, which files Tasks and may message the worker to wake
  it or to name the ready Task in its pools it takes next, never work the
  tracker does not hold. The worker counts a message as direction only from
  the session the directing seat's state issue records, by its name and
  folder; reports done, blocked or in need on the tracker and by message;
  and sends the person's questions to the person. A message is never the
  person's authorisation, nor is a Task, and direction stays within one
  repository's topology. The project-manager agent holds the tools for
  messaging and for listing sessions. It overturns DEC-068 in part and
  refines DEC-029, DEC-059, DEC-061 and DEC-068 in place. The agent's
  definition, the topology, the state issues and the work loop are
  unchanged until the Task that builds them, which declares its own
  changeset, so no surface moves here.
