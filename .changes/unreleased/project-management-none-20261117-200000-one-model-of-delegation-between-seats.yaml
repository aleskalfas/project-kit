component: project-management
kind: none
body: >
  DEC-081, which a person accepts in this change (#3392), fits the harness's
  messages between sessions to the topology of seats. Tasks reach a worker
  through its pools, whoever files them. A worker's seat may name the
  planner's or lead's seat that directs it, whose session may message the
  worker to wake it or to name a ready Task it may take next, never work the
  tracker does not hold. The worker counts a message as a directive only
  from the session that runs its directing seat's loop, recorded on the
  seat's state issue by its name, machine and folder; reports when a Task is
  done or stops; and sends the person's questions to the person. A message
  is never the person's authorisation, nor is a Task, and directives stay
  within one repository's topology. The project-manager agent holds the
  tools for messaging and for listing sessions, allowed by a privilege of
  the capability's own. It overturns DEC-035 and DEC-068 in part, refines
  DEC-059, DEC-061, DEC-063 and DEC-068 in place, and corrects a fact in
  DEC-029. The agent's definition, the grants, the topology, the state
  issues and the work loop are unchanged until the Task that builds them,
  which declares its own changeset, so no surface moves here.
