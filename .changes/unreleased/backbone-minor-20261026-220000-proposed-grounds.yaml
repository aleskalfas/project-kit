component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit refs rot` also lists each accepted record whose body cites a record
  that is still proposed, in every id-space, with the lines it cites it on,
  against the acceptance gate (#2155). A capability's decision is read cited as
  `[<capability>:DEC-NNN]` from any record, or as a bare `DEC-NNN` inside that
  capability's own records, unless another capability's name stands just
  before it. The superseded check reads an agent's or a skill's citations of
  a capability's decision too. The command still reports and exits 0.
