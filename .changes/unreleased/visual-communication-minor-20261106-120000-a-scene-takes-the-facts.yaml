component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A text part may show a fact of its export, naming it by `fact` in place of
  `content`, at format 1: `version`, `date`, `language` or `state` (#2751). Its
  text is one run, in the role `style` names, and it names `fact:<word>` as its
  source. A scene shows the piece's language and state as its files hold them,
  and a fixed stand-in for the number and the date, `v88` and `2088-08-28`. So
  the check, a render and the findings record give the same answer on every
  clone. A stand-in that overflows is a finding at the element, in the component
  that shows it: it fails where the project can correct that component, and asks
  for attention in a released library. `pkit visual export` refuses a piece that
  shows a number or a date, naming each element, and writes nothing. A piece that
  shows only its language or its state exports, with their real text.
