component: backbone
kind: minor
custom:
  category: Added
body: >
  A document schema, whose file is itself one resource, can own a namespace
  (COR-029 point 6). Its companion declares `x-pkit-entry-id`, a JSON Pointer
  to the field that holds the document's own id, in place of
  `x-pkit-id-collection`. Each bound document then adds that one id to its
  namespace's pool, so `pkit data validate` resolves `[<namespace>:<id>]`
  tokens into documents, reports a copy of a document in scope as a duplicate
  id, and reports a document whose pointer reaches no string. Between a
  capability's schemas the schema's own YAML is its one document:
  `pkit schemas validate`, `list`, `show` and `resolve` and the
  `project_kit.schemas` API read its id, and `pkit schemas validate` reports a
  companion that declares both annotations. `pkit schemas add` refuses a
  document namespace, and `pkit schemas rename` renames the example
  document's id and what cites it. No schema declares the annotation yet, so
  nothing that passed validation stops passing. The schemas reference and the
  schema skill say how to declare it.
