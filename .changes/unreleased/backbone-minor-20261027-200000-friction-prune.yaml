component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit friction prune [--yes|--dry-run] [--json]` removes each answer file in
  which no answer is live at HEAD (#2207, COR-062 point 8). It judges liveness
  from HEAD's full history, as `pkit friction check --all` does. A file holding
  one live answer stays whole. A file with no live answer is kept, and named
  with why, where removing it would change one that is live: it cannot be
  read, its removal brings back an answer it replaced, or a live deferral keeps
  its point from it. It removes files from the working tree, adds none and
  stages nothing, so the removal is committed as a change of its own. It asks
  before it removes, or takes `--yes`, and refuses an uncommitted change in the
  answer folder and a shallow clone. The whole-repository check's line on
  answer files names the command, and its `prunable` lists what the command
  would remove. `pkit friction resolve`, added after 1.149.0, is removed before
  any release shipped it: it settled conflicts between answers in the
  artefacts' front-matter blocks, where no answer lives after the move (COR-062
  point 11).
