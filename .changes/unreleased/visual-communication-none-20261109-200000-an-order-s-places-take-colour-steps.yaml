component: visual-communication
kind: none
body: >
  DEC-032 decides how a brand gives an order's colour steps (#2896): two
  ends and a text for each mode, which the engine spreads evenly over a
  list's places, with an item's concept on its line on a step. It lands
  accepted, with the edits its Implications name to accepted records. No
  role, schema, check or renderer changes yet, so no surface moves: the
  foundations, the engine, the starter and the neutral brand change in the
  Tasks under #2882, each with its own changeset.
