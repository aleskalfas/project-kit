component: backbone
kind: minor
custom:
  category: Added
body: >
  The core rules gain rule 24, in "Before changing files". Before an agent
  writes or checks a file, it reads the accepted rules that rule sets bind on
  it and follows them. It runs `pkit rule-sets reach` with the files its
  change will write, or reads `pkit rule-sets altered` for a change it checks.
  No lookup is due for a file no rule set selects, and the rule asks the agent
  to follow no rule but those the rule-set reviewer judges the change
  against. A project's rules about its files thereby bind whoever writes the
  file, with no agent named. No existing rule is renumbered. The rules
  README says that rules about files are kept in ordinary rule sets.
