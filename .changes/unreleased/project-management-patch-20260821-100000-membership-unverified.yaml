component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The board-membership check no longer passes silently when membership cannot
  be determined (#740). Its condition fired only on a definite EMPTY
  projectItems list, so a null or malformed payload — an unreadable board, a
  token without the project scope, a partial API reply — skipped the check
  entirely and was indistinguishable from a satisfied one. An undeterminable
  payload now reports `board_membership.unverified` at DEC-019 own
  drift_severity (warning), worded distinctly from `.missing` so an adopter is
  never sent to add an issue that may already be on the board. No new
  severity, verdict token, exit code, or API call.
