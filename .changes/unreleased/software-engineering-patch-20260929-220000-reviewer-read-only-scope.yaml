component: software-engineering
kind: patch
custom:
  category: Fixed
body: >
  The code-review panel (`code-reviewer`, `security-reviewer`,
  `docs-reviewer`) states its read-only claim precisely: it governs the work
  under review and the repository it lives in, not "writes nothing
  anywhere". Each body gains the `## What read-only covers` section every
  reviewer that can execute carries: the working files a review needs — a
  dumped diff, a script, a reproduction (even one that executes a payload to
  prove a defect), captured output — go in the agent workspace, never loose
  in the repository, where an author's `git add` would commit them, nor in
  `/tmp/`, and a review leaves no file of its own outside the workspace. The
  descriptions say "Read-only on what it reviews".
