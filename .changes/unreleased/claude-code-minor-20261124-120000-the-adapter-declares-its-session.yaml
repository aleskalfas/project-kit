component: claude-code
kind: minor
custom:
  category: Added
requires_backbone: release
body: >
  The adapter declares its session in `session.yaml`, which the backbone's
  `pkit harness session` reads as data: the session's process is the one
  `CLAUDE_PID` names, and its messaging address the socket
  `CLAUDE_CODE_MESSAGING_SOCKET` holds, which each message the session sends
  carries as `from="uds:<address>"`. Only an address of the measured form,
  `/tmp/cc-socks/<id>.sock`, is given, so none in a user's folder reaches a
  tracker. No platform reads a process by its id alone. The adapter answers
  the new harness requirement `session-messaging-address` at a cost, for
  Claude Code 2.1.330 to 2.1.331, the versions project-management DEC-084's
  measurements ran on, on macOS: a subagent's message carries its session's
  address, and the harness was seen checking an address only on a held
  message. The README's "The declaration of a session" and "Harness
  support" say so.
