component: claude-code
kind: minor
custom:
  category: Changed
  pr: "773"
body: >
  The agent deploy resolver now treats `reads.patterns` as an OPTIONAL read
  channel (ADR-052): a category referenced only there resolves to the adopter's
  path when defined, and — when undefined — drops the item and still deploys the
  agent, rather than failing the whole deploy. `reads.paths` / `reads.records`
  and the list keys (`owns` / `needs` / `answers`) stay HARD (an undefined
  placeholder still skips the agent). A category referenced both optionally and
  hard is hard. Tolerance is inferred structurally from the reference site; no
  category is named in resolver code.
