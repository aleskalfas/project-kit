component: project-management
kind: minor
custom:
  category: Added
body: >
  The project-manager agent lists the seats of the project's topology at the
  start of each session, and takes one with `take-seat` where the session was
  started for one or its clone holds one already. It then runs its role's loop
  from the pm skill's new `work-loop` sub-procedure (DEC-059 point 8). A
  planner slices each intent through batch planning and files the work with no
  owner into the shared pool. A worker first goes on with what its clone has in
  flight, then takes the next ready Task with `next-task`, builds it in its own
  clone, opens its pull request with `open-pr --draft` and `review-work`, and
  takes the next. No role authorises a merge, or passes an override that is the
  person's. Batch planning now names the choices the planned Tasks would share
  before it slices, and where nothing settles one yet, its first plan files
  only the EPIC, with an outline of the slices, and the foundation's Feature
  (DEC-060). The slices follow in a second plan once that Feature closes. Its
  gate now lists which issues go to Backlog on approval, and it schedules them
  through `promote-issue`, which audits each move, in place of a raw milestone
  edit. A session that holds no seat works as before.
