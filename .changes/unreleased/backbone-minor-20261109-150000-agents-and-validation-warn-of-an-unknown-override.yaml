component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit agents` and the `refs` member of `pkit validate` warn of each entry under
  the overlay's `overrides:` that the deploy ignores, naming its key (#2468). That
  is a block for an agent no source ships, such as `overrides.critc`, or a
  category in an agent's block that its deploying definition does not name, such
  as `overrides.critic.code-pths`. A typo there used to leave the agent on its old
  value with no sign. `pkit agents` lists each under `UNKNOWN OVERRIDES`, and
  `pkit refs validate` lists each among its warnings. The warning fails no
  command, and the deploy still ignores the entry.
