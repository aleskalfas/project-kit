component: project-management
kind: none
body: >
  Design-ahead: the record DEC-071 decides that, under every credential, a
  run that reads or writes the project's board first confirms, once, that the
  hosting service answers with the configured board, and refuses before
  changing anything where it does not. The check runs in the one path every
  read and write of the board goes through, which an architecture record
  names first. It refines DEC-019's "Auto-add to board" in place once
  accepted. No behaviour changes until the record is built.
