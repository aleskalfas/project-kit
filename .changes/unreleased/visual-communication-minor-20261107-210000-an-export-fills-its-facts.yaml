component: visual-communication
kind: minor
custom:
  category: Added
body: >
  An export fills a version's number and its date (#2770). A piece whose
  component shows either no longer refuses an export, nor `pkit visual
  upgrade`: every file of the version shows the one number and the one date
  its record keeps. The export measures that text where it fills it, from a
  font file, and stops before any write on a text that overflows its width, or
  a component around it that gets less than it asks for, naming the fact, its
  text and the element, whether or not the stand-in overflowed, and in any
  library. `--use-overflowing version` or `--use-overflowing date` uses the
  text as it is, on `export` and on `upgrade`, and the record of exports keeps
  each text let through under `let-through`, an addition at format 1. An
  overflow measured from a table or by an estimate stops nothing and is said.
  `pkit visual mark-final` names each text a version let through, and stops on
  none. A new finding, `current-copy-let-through`, fails a published piece's
  copy made with a text let through, where the project can correct the
  component, and asks the owner of a released library for attention. The
  fingerprint reads none of these facts, so a new number makes nothing stale.
