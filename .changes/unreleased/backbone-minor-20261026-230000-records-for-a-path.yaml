component: backbone
kind: minor
custom:
  category: Added
body: >
  A new lookup, `pkit refs records-for`, goes from the files a change touches
  to the accepted records their anchors lead to, the other way from
  `pkit refs lookup`. It lists apart the records tied to a file directly, by a
  record's own path anchor or by the artefact at the file, and each artefact
  that anchors the file, the narrowest first, with the records it rests on.
  The project's own records come first, and a superseded record is listed by
  the records that replace it. A new core rule, rule 22, tells an agent to run
  it before it changes files. The decisions README, "Finding the records a
  path leads to", says what it reads and what it cannot tell.
