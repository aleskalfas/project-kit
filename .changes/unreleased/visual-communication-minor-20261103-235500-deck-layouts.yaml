component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The foundations ship `deck`, a top component for a presentation, whose
  layouts `cover` and `slide` are the forms its pages take (#2558). A top
  component may now declare several layouts that are its pages' forms: it
  marks one list field of its own `x-pkit-pages: true`, the field that holds
  its pages, and each layout declares the slots a page in it fills, the slots
  it requires, and its own drawing in `parts`, which is the layout's default.
  Each page names its layout with `layout`, or the component that draws it
  with `use`, and is drawn as a page of its own, as large as the top, traced
  as `<top>/<field>[<id>]`. The check reads each page against the layout it
  names and reports `content-layout` for a page that names neither or a
  layout its top does not declare; a top whose pages' forms break their shape
  is a `component-shape` finding. The foundations, not yet released, gain
  the shared role `size.slide`, a slide's width, with no default: a brand
  that locks them gives it a value, or the check reports `role-missing`.
  Every file format 1 accepted is read and drawn as before.
