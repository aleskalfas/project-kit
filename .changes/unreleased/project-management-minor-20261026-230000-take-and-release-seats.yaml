component: project-management
kind: minor
custom:
  category: Added
body: >
  A clone now takes, releases and lists the seats of the topology the default
  branch holds (DEC-059 points 4 to 6, #2141). The new `take-seat` takes the
  seat named, or the first free one of `--role`, only where it names the agent
  definition the session follows, given with `--agent` or `PKIT_AGENT`. A clone
  holds at most one seat, takes up the one it holds, and releases a retired one
  first. The new `release-seat` releases this clone's seat, or a seat by force
  with its reason, from the organizer seat's clone or on a person's
  authorisation. The new `seats` lists each seat with its role and its holder,
  and names the state issues no seat names. In a project with a topology, every
  command that writes as an instance now confirms the clone's seat on its state
  issue first, and refuses where it cannot, and `set-instance` refuses a typed
  number. `next-task` narrows the shared pool by the scope the topology gives
  the clone's seat, and refuses a seat it cannot confirm. A project with no
  topology behaves as before.
