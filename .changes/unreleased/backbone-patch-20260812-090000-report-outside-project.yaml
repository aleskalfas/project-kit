component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit report` composed outside a project no longer emits a misleading
  environment block, and the stage/submit messages now name where they read and
  write (#693, from #689). With no project root resolved, the compose warns
  loudly (naming the directory and the run-from-your-project-root fix) and the
  fenced environment block renders the project half as `NOT COLLECTED —
  composed outside a pkit project` instead of `backbone: unknown` /
  `adapter: none` / `capabilities: (none installed)` — values a maintainer read
  as facts about the reporter's install. The compose still proceeds (a report
  from a scratch directory beats no report), and the marker stays path-free, so
  the redaction discipline is unchanged. The `--yes` stage message adds two
  short lines naming the resolved project root (or `no project — <cwd>`) and
  the per-project draft store, and `report submit` names the store it read —
  in its list, its empty state, and its not-found error, which now points at
  running submit from the root the draft was staged under.
