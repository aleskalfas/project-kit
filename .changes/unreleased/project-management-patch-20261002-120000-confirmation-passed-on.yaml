component: project-management
kind: patch
custom:
  category: Fixed
  requires_backbone: release
body: >
  `done-work`, `merge-pr` and `land-work` pass the operator's cross-repository
  confirmation on to the backbone, which now runs its own guard on every merge,
  enqueue and dequeue it makes for them. When a verb's own guard passed by
  `--allow-foreign-repo` or a yes at its prompt, the verb passes
  `--allow-foreign-repo` on, and never otherwise, so a confirmed landing in
  another repository is not refused by the backbone, and nothing is confirmed
  that the operator did not confirm. `land-work` at a terminal now asks once
  where it asked twice — its own guard and `done-work`'s — since its
  confirmation is passed on to `done-work`. Should the backbone's guard refuse
  all the same, because its comparison and the capability's disagree, the
  landing ends refused, naming both verdicts, with nothing asked of GitHub. The
  capability's guard now reports how it passed; its other verbs behave as
  before. Upgrade the capability together with the backbone: it needs the
  release whose `pkit pull-request` takes `--allow-foreign-repo`.
