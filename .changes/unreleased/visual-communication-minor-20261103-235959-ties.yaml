component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A tie joins two items named by their key paths, with a connector straight
  or with corners, arrowheads and spread ends (#2561, DEC-011). A pattern
  declares a list of ties with two end fields, `lists.<list>.ends: [<start>,
  <end>]`, and a top declares one in a layout that draws a page, beside the
  list's component field and arrangement fields. A component that takes ends
  declares `ends: true`, reads them as `{start}` and `{end}`, and draws the
  connector with a line that gives `connect: straight` or `connect: corners`
  in place of its ends. A line may carry an arrowhead at either end,
  `marker-start` and `marker-end`. Content names each end `{item: <key
  path>}`, perhaps with a point, from the mapping that holds the list, in the
  content file's own keys, through components that rename what they pass on.
  An end is found where its item is drawn once on the tie's page; otherwise
  the tie is left out and reported (`end-not-found`, `end-point`,
  `tie-page`), and the rest of its list is drawn. The ties that meet one side
  of an item spread evenly along it, and the frames of the ends are computed
  in reference order, a loop through them refused. The scene's line holds
  its arrowheads, and a connector its points and the elements its ends meet,
  so the seam's version rises to 3, and every plugin declares seam 3. No
  plugin's own version rose: a scene of seam 2 holds none of these, and the
  SVG renderer, which draws a connector as a polyline and an arrowhead as a
  marker, stays 1.0.1, and the CSS code writer 1.0.0. The check reads each
  tie in the content (`tie-component`, `tie-shape`, `tie-path`, `tie-ends`),
  and, checking a library version alone, a list of ties whose default
  component takes no ends or declares an end field (`tie-default`,
  `end-clash`). A component field that takes runs is refused. Every file
  format 1 accepted is read and drawn as before.
