component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The `touches-code` diff floor no longer waves through an extensionless or
  unknown-suffix file under a `docs/` directory (#749): `docs/tools/helper`
  previously classified as documentation, so a code-carrying PR touching only
  such files escaped the code-review floor (fail-open). The classifier is now
  fail-closed there — under `docs/`, only a recognized documentation suffix
  (`.md`/`.rst`/…) or a recognized non-code asset suffix (image/diagram/font/PDF)
  is documentation; any extensionless or unknown-suffix file is treated as code,
  so the floor fires. A code suffix still dominates the `docs/` location as
  before; docs-only PRs are unaffected.
