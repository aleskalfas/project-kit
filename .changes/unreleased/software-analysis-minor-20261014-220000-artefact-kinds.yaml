component: software-analysis
kind: minor
custom:
  category: Added
body: >
  Each analysis kind declares its structure once, as data, in
  `schemas/artefact-kinds.yaml` (DEC-001 point 1, #1363). Its schema,
  `artefact-kinds.schema.json`, is a strict superset of living-docs'
  `page-kinds.schema.json`. The file declares the actor, the use case, the
  journey, the glossary term and the revalidation record, each with the parts
  the template round chose. Each element has its id, its type, whether it may
  read `None.`, its form, and its hint and example. Nothing reads the file
  yet, and a test holds it to its schema. The revalidation record's schema
  gains `reviewed-against`, the sources of the design a planned record
  reviewed. It is required when `trigger` is `planned`, and refused
  otherwise. Each source has a `title`, a `version` and, outside this
  repository, an absolute `url`. Without a `url`, the version is a commit's
  full id or `this change`. With one, it is the time the text was read or a
  commit's full id. This breaks a planned record without the field: `pkit
  analysis validate` fails it, and `pkit analysis new` refuses to stamp a
  planned record until it takes the sources. The segment is `minor`, as
  semver allows a breaking change before 1.0.0, and the capability is
  installed only in project-kit's own clones, which hold no planned record.
