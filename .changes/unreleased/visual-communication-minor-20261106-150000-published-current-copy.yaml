component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual export` of a published piece keeps a current copy (#2753): an
  unnumbered copy of each file of the version, in the piece's `current-copy/`,
  written in the same change as the numbered files, which replaces that folder
  whole. A piece in any other state writes none. `exports.yaml` gains an
  optional `current-copy`, at format 1, that names the piece and the version
  that wrote the copy, and each file's path and hash. A copy's file takes its
  version's name with the number left out, and holds that file's bytes. An
  export now refuses a published piece whose lock differs from the lock of the
  version that wrote its current copy, and names `pkit visual upgrade` and
  writing back that lock. It reads the record, not the files, and compares
  nothing where the record holds no copy of the piece's own.
