component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual prune` removes each library version that lies behind, with its
  entry in the list of libraries, after it shows its list and asks once
  (#2768). A version lies behind where no lock names it, the lock of the
  version that wrote a current copy included; no lock that moves can still
  reach it; a newer version of its major serves in its place; and it holds no
  unreleased work. So it spares the project's own version not yet released,
  the newest release and the newest readable version of each major, a version
  a lock that moves lies below, a library's last version, and a version the
  list does not name. It names each kept export made under a version it
  removes. `--dry-run` shows the list, `--yes` consents up front, and with
  nobody to ask it refuses. It removes from the working tree alone, stages
  nothing, and stops, naming the file, on a lock, a record of exports or a
  writer's fingerprint it cannot read.
