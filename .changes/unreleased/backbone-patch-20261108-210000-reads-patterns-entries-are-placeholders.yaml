component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The `architect` and `process-author` agents write their `reads.patterns`
  entries as placeholders, `<architecture-docs>`, `<adr-records>` and
  `<process-authoring-targets>`, so a deployed copy now lists the category's
  resolved paths there, as its `owns:` does, not the bare names (#2481).
  `pkit refs validate` and the `refs` member of `pkit validate` report, as an
  error, an agent's `reads.patterns` entry that is neither a `<category>`
  placeholder nor a path, since the deploy never resolves a bare
  name. Write such an entry `<name>`. A path written there, one holding a `/`
  or a `.`, counts as a declared path.
