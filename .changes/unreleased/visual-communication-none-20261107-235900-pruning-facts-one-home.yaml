component: visual-communication
kind: none
body: >
  The capability's pages state each fact of pruning once, and link to it
  (#2827). files.md's "What the location holds" names the three commands that
  change the library folder, `pkit visual prune` among them. The README's
  `pkit visual prune` section links to files.md's "A version that lies behind"
  for what that section holds. checks.md states once that `lock-behind` fails
  nothing, and links to files.md's "Picture roles" for what a picture role
  takes. files.md's "Picture roles" holds that no written code holds a
  picture role. No command, path, file format or check changes, so no surface
  moves.
