component: visual-communication
kind: none
body: >
  DEC-071 proposes how the designer starts a new piece (#3482): a free draft
  of every page, drawn outside the engine from the piece's words and its
  brief with no library and no brand, which the person sees and chooses
  whether to have rebuilt. The designer then rebuilds the chosen draft with
  the piece's brand and the project's libraries, and reports each part they
  could not carry as a need on what lacks it. DEC-070's one round then runs
  on the rebuilt piece. It is a design-ahead record: the designer's and the
  reviewer's definitions, the build skill and UC-111 follow in slices under
  #3468 once it is accepted. No surface moves here.
