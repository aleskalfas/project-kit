component: project-management
kind: patch
body: >
  Batch planning lets a record that serves one Task ride that Task (#2639),
  where no other open Task rests on an accepted record it changes. A choice
  only one Task makes is no shared choice, so it calls for no foundation: the
  Task drafts the record in its own change, a person accepts it there before
  its edits and the Task's work follow, and that acceptance is one of the
  Task's acceptance criteria. A refused record closes the change, and the
  Task is planned again. A record that changes one another open Task rests
  on, or a foundation's record, takes a Task of its own (DEC-060 points 2
  and 5), since the other Tasks start from the default branch.
