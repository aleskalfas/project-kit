component: project-management
kind: patch
body: >
  Batch planning lets a record that serves one Task ride that Task (#2639).
  A choice only one Task makes is no shared choice, so it calls for no
  foundation: the Task drafts the record in its own change, a person accepts
  it there before its edits and the Task's work follow, and that acceptance
  is one of the Task's acceptance criteria. A refused record closes the
  change, and the Task is planned again. A record that changes a
  foundation's record does not ride a Task, since that change goes through a
  Task of its own (DEC-060 point 5). A foundation's own records still come
  first, in its Feature's first Task (DEC-060 point 2).
