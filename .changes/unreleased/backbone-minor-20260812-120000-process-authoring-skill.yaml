component: backbone
kind: minor
custom:
  category: Added
body: >
  A core `process` composite skill (COR-020 folder form) now walks the shape half
  of process authoring over the deterministic stamps (#685): `new` (subject,
  states and their meanings, transitions and who may make them, gates and their
  kind, invariants, waits — plus routing an adopter with no owning capability
  through capability authoring first, the judgment the stamp deliberately
  refuses), `couple` (a `depends_on` entry in your own definition, with the
  closed relation/mode vocabularies read from the shape contract and the required
  `why` pushed for purpose rather than restatement), and `hand-off` (a COR-042
  contract, where that record's two authoring smells become questions the
  walkthrough will not complete without answers to: is this trigger stable, and
  would this candidate source fail loudly rather than silently return empty).
  The predicate logic behind each scaffolded stub is the forthcoming
  `process-author` agent's territory, not the skill's (COR-044); until it ships
  the walkthroughs point at the predicate-runner contract. Deferred operations
  are named in the dispatcher and listed authoritatively in the process area
  README, which now documents all three tiers of the layer.
