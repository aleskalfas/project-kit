component: project-management
kind: patch
custom:
  category: Fixed
body: >
  Every command that reads the topology now says which commit of the default
  branch it read, as DEC-059 point 1 decides (#2177). Each command that confirms
  the clone's seat before it writes, and `next-task`, prints a note naming that
  commit, once in a run: a command that another runs, such as the `move-issue`
  that `start-work` runs, repeats no commit the run named already. A project
  with no topology prints no such note.
