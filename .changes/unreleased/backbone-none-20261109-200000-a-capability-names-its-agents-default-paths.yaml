component: backbone
kind: none
body: >
  COR-073 is added accepted with this change (#2895): a capability may declare,
  under its name and a dot, the overlay categories its agents write, and name a
  default for each that a read-only query of its own answers. Its install, and
  the commands that fill missing overlay categories, write that default into
  the agents overlay, never over a value the project set, asking first where the
  path already holds content. The deploy's check against what sync overwrites
  binds every category a capability's agent owns. COR-013 point 5, COR-017,
  COR-001 and COR-052 point 6 take the edits it names. No command, file, key or
  check changes yet, so no surface moves: the install, the fill commands, the
  deploy and the package schema take the rule in a later change.
