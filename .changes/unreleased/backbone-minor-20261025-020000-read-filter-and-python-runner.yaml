component: backbone
kind: minor
custom:
  category: Added
body: >
  The privilege catalog gains `read-filter`, the read-only filters such as
  `cat`, `grep`, `head`, `tail` and `jq`, with `sort` and `uniq` only in a form
  that writes no file, and `python-runner`, which recognizes `uv`. Every
  shipped profile grants `read-filter` to every agent, so a pipe or chain of
  filters and other granted programs, such as `git log | head -5`, is allowed
  by the permission hook without a prompt. No profile grants `python-runner`
  (ADR-005), and a project grants it in its own grants. A redirection, an
  expansion or another untrusted construct still defers, and a deny still
  wins. `pkit permissions apply` now realizes a `Bash(<program>:*)` rule for
  each filter but `sort` and `uniq`, whose excluded forms no prefix can name.
