component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit rule-sets loaded` lists the project's own rules layer also where
  `.pkit/rules/project.md` is absent, as a plain file the checkout does not
  hold (#2370). A fresh project's `CLAUDE.md` includes that file, which
  `pkit init` does not create, and the command used to leave the layer out
  until the file existed. The human list says `a plain file, missing`, and `--json`
  gives the entry with `present: false`. The backbone's plain
  `.pkit/rules/core.md` is listed the same way where no loaded set generates it.
