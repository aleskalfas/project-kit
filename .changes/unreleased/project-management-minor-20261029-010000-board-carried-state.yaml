component: project-management
kind: minor
custom:
  category: Changed
body: >
  Each axis is put on the board in the substrate map, as DEC-062 decides.
  `has_projects_v2_board` now says only that a project has a Projects v2 board:
  it names which board and puts every issue on it, and carries no axis. An axis
  lives on the board only where `substrate-map.yaml` binds it with `board: true`.
  With no map, every axis reads the kit's own labels, board or no board, and in
  a present map an axis left out or marked `unsupported` degrades, board or no
  board. The map gains a `kit-label: true` arm on every axis, which reads,
  writes and checks the axis on the kit's own labels as with no map, so a
  project can move one axis to its board and keep the others.

  `board: true` is now admissible on `state`. There the board's Status is the
  source of an open issue's position, and a closed issue is Done whatever its
  card says. The Status is read as DEC-051 point 6 says: a board that cannot be
  read, no card, no Status, and a Status naming no open state are four outcomes,
  each with its own message, and none falls back to the labels or the
  milestone. `move-issue` refuses a move the Status does not place, and writes
  the Status as the move, the forward cascade each ancestor's, and
  `create-issue` sets the first one. `next-task` skips a Task it cannot place,
  with a warning, and takes nothing where the board cannot be read.
  `start-work`, `review-work`, `seats` and the lifecycle's classifier read the
  Status too. Where a present map leaves the state out, no board Status is
  written, and `sync-board` refuses, saying why.

  The configuration's schema moves to version 2. The upgrade's migration writes
  it in every project at version 1. Where the flag is set, it keeps priority
  and workstream on the board through the map, keeping each `default:`, writes
  a map where there is none, and leaves state out, so state is read as before.
  Its report names each binding it wrote, and each comment of the map that
  speaks of the board. `pre-check` no longer reports a label binding under a
  board as a double claim, nor nudges an omitted axis towards `board: true`.
