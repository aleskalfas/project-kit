component: software-analysis
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  The `analysis-resolver` agent states the recorded rule for friction
  writers: it names `pkit friction revalidate` and `pkit friction defer` in
  the one paragraph that sets the agents README's four conditions for running
  one, the second of which never holds for it — it has no tool for asking the
  person — so in every session it hands the commands over, without `--yes`,
  runs none, and says who may run them. `pkit friction record-status` is the
  after-merge job's, and the record stamp and the defect's reference stay the
  person's. Its storyboard and the capability README say the same, and the
  `analysis-author` skill says a reason for having no anchors is shown to the
  person word for word and stamped only once they accept it. What the agent
  does is unchanged. The rule is the backbone's this release ships (COR-050
  point 3), so the capability requires that backbone.
