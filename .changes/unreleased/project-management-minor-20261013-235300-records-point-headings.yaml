component: project-management
kind: minor
custom:
  category: Changed
body: >
  The capability's records whose points were a numbered list, or paragraphs
  opening with a bold number or label, write each point as a heading
  carrying its number or label, word for word (#1421, COR-058): DEC-033,
  DEC-035, DEC-036, DEC-038 to DEC-041, DEC-043 to DEC-051 and DEC-053 to
  DEC-055. A page can now anchor to one point of these records, such as
  `project-management:DEC-055#3`, and a change to another point of the
  record does not ask for the page to be revalidated. No point's text,
  number or citation changes. DEC-049 gains point 4, "Format + single-poster
  rules": the paragraph after its point 3, one audit comment per audited
  mutation in one canonical format, is now a point of its own, with the same
  words. The text after the last point of DEC-035, DEC-040, DEC-050 and
  DEC-051 sits under a heading of its own, and DEC-039's moves into the
  Decision's opening. DEC-029 cited DEC-008's Implications by line number,
  and now names the bullet that line held.
