component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The capability ships `neutral`, a brand to start from, so a project can draw
  before it writes a brand of its own (#2566, DEC-004, Implications). `pkit
  visual add neutral` copies it, and lists it with the source `shipped`. It is
  not released yet. It gives every shared role a value in light and dark and
  at both contrasts, in greys with a blue accent. Each pair the foundations
  declare reaches its level in every combination, and each text of the
  starter's reference renders reaches its contrast as drawn under it. It names
  the foundations alone, so it draws the starter at its defaults, and it opens
  no role. Its fonts are Source Sans Pro, in a family for each weight, and
  Source Code Pro, each file committed unchanged with its licence.
