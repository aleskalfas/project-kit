component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual check` holds a final piece to the version handed out (#2765),
  in a run over the location and on the piece alone. Whatever the piece's lock
  shows, it fails a file of that version that is missing or changed, naming the
  file and the version. It fails `state: final` with no version handed out, a
  version handed out with another state or lock, and a version whose lock or
  files cannot be read from the record. A piece set final by hand fails until
  `pkit visual mark-final` names its version, or its state is set back. A piece
  whose record of exports cannot be read reads as final, and the check now says
  why, as `exports-unreadable`.
