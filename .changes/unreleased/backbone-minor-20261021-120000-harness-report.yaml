component: backbone
kind: minor
custom:
  category: Added
body: >
  Each adapter can declare how far its harness meets the harness requirements
  the core declares, in `harness-support.yaml` in its folder (COR-047 point
  2). The new core schema pair `harness-support` shapes it: per requirement a
  grade (`supported`, `at-cost` or `not-achievable`), the cost of an `at-cost`
  answer, the harness versions it holds for, and its evidence. A new command,
  `pkit harness report [--adapter <name>] [--json]`, resolves every
  requirement for each registered adapter to satisfied, unsatisfied or
  indeterminate, offline and from files only. It exits 1 while anything is
  unmet and 3 when a declaration fails its schema. Silence, an answer for no
  version or for versions it cannot check, and a grade nothing was read to
  confirm are indeterminate, never satisfied. `pkit validate`'s `schemas`
  member checks each declaration against its schema, and warns on an answer
  to a requirement the core does not declare. The adapter-author skill gains
  the declaration step. The adapters, CLI and schemas READMEs document it.
