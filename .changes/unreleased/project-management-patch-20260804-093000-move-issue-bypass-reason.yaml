component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `move-issue` now refuses a bare `--bypass` that carries no reason, instead of
  silently substituting a placeholder audit reason (#580). The
  `bypassable-with-audit` gate records the reason in the audit comment (DEC-014)
  and the override-flag convention (DEC-046) requires it non-empty, so
  `move-issue <N> --to <state> --bypass` without a non-empty `--bypass-reason`
  is refused before any mutation or audit comment. Whitespace-only reasons count
  as missing. Wrapper call sites (promote-issue and friends) always pass a
  reason, so only the direct-invocation path is affected.
