component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual take-up <piece> <name>` takes a final piece up again, as a new
  piece copied from it: a draft with its lock pinned to the lock of the
  version handed out, so it draws as the piece it copies until a person moves
  that lock (#2766). It copies the folder whole but for the piece's record of
  exports, its findings record, `handed-out/` and `current-copy/`, drops
  `copy-place`, and keeps every other byte of `piece.yaml`. Where the sources
  changed since that version, the copy holds the later words, and the run
  names each change. It leaves the final piece as it was, and refuses a piece
  with no version handed out, a name taken, and a file reached through a link.
  An export of a final piece, a second mark of one, and the check's fixes on a
  final piece now name the command.
