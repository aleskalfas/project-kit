component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  The HTML renderer's page file prints as DEC-026 decides (#3010). Its pages
  follow one another down the sheets with no backdrop, as many to a sheet as
  fit: the file asks the browser to keep each page on one sheet, so a page
  that does not fit the rest of a sheet moves whole to the next, and a taller
  one runs on. The sheet's area is the window, so pages of one width print at
  one scale, the area over their width, at most 1. A fixed page, such as a
  deck's slide, prints inside its keyline as its border, in the keyline's
  colours on screen, and in the area less the keyline on each side. Each page
  prints on the browser's ground in its own colours, and the sheet around the
  pages follows the reader's setting for backgrounds. The file holds no page
  rule and no rule on where a page that runs on breaks. The screen's rules do
  not change. The HTML renderer rises to 1.4.0, and declares the print under
  `pages.print`. The seam stays at 5.
