component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A brand may draw a layout of a top (#3017, DEC-034 points 1, 2, 5 and 6). A
  component of the brand's version that names, under `draws`, the top and the
  layout it draws is that layout's drawing: it takes the top's fields, options,
  states and colour and the layout's slots and lists, and holds its own parts,
  values, `preferred`, exposed parts and tokens. A piece in that brand is drawn
  by it in each instance it fits, in every language and at every size, and by
  the top's own drawing elsewhere, which the piece states as the fact
  `drawing-misfit`. A drawing of a page's form writes its page's height alone.
  A brand checked alone reads each component it holds and judges its drawings:
  `drawing-shape`, `drawing-size` and `drawing-field-part` fail there, and
  content or a component that places a drawing by `use` fails as
  `drawing-placed`. A top's own drawing that shows a field by no part named
  after it asks the top's owner for attention. Files of format 1 that name no
  `draws` are read and drawn as before.
