component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `create-issue`, `edit-issue` and `validate-issue` warn of a predicted decision
  id, as DEC-010 decides (#1970): an id that no record holds, written in a body
  as if one did. They read a core, project or architecture record's id, and a
  capability's decision named with its capability, `[<capability>:DEC-NNN-<slug>]`
  or `<capability>:DEC-NNN`. A bare `DEC-NNN` names no capability and is not
  checked. The ids are looked up in one run of `pkit refs lookup --json`, only for
  a body that cites one. Where `pkit` gives no answer, one notice says which ids
  were not checked, and why. Neither refuses anything or changes an exit code.
  The rule's entry in `body-format.yaml` now carries its `id`,
  `body.predicted-decision-id`.
