component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  A part that reads a library's own role with no value under the brand is
  found where DEC-008 point 9 places it (#2595). Where neither the brand nor
  a base below it names the library, `unknown-role` lies at the piece's lock,
  `piece.yaml#lock`, naming the library's version, the role and the part,
  and fails; the component's version no longer carries it. Where a brand of
  that chain names the library, the part takes no finding, since that brand's
  `library-role-missing` reports the role. A role no library declares is
  still `unknown-role` in the component. The reference lists `base-shape`,
  `base-lock`, `base-axis`, `alias-private` and `open-wider`, which the check
  already raised.
