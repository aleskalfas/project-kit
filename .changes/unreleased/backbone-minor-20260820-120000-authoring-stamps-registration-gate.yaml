component: backbone
kind: minor
custom:
  category: Fixed
body: >
  The process-authoring layer no longer hands out a green light for work nothing
  watches (#713). `pkit process new` / `couple` / `hand-off` resolved the owning
  capability by directory existence alone, while contract discovery enumerates
  only capabilities the project **registers as components** — so a definition
  stamped into an authored-but-unregistered capability was real, correct, and
  invisible: every command succeeded, then `process health` reported "no hand-off
  contracts declared" and exited 0 over it. All three stamps now additionally
  require registration, refusing with `pkit capabilities register <name>` as the
  named remedy, and the three causes stay distinct (no `<capability>:` half in
  the address, no capability directory, a directory the project does not
  register). The gate shares discovery's own capability lookup rather than
  re-deriving it, fallback included — with no backbone manifest, or one listing
  no capabilities, the installed set is the filesystem scan, so a pre-manifest
  install stays authorable. Separately, a **scoped** health run that resolves to
  nothing is now indeterminate rather than clean: `--process <addr>` matching
  neither a walked definition nor any declared contract's endpoint reports a new
  `unresolved_scope` finding (narrative and `--json`, both the default and the
  `--interpretation-only` authoring view) and exits non-zero, naming the likely
  cause and its remedy — because naming an address is a claim that can fail, and
  what cannot be interpreted is never clean (COR-042). Determinate-empty is
  untouched: a bare run over zero declared contracts, and a scoped run against a
  definition that was walked and declares none, both stay clean at exit 0. Two
  adopter-observable consequences: a stamp into an unregistered capability now
  refuses where it used to succeed, and a scoped health run on a typo'd or
  unwalked address now exits 1 where it used to exit 0. The per-address
  operations (`status` / `move` / `validate`) are deliberately unchanged.
