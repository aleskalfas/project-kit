component: software-analysis
kind: none
body: >
  The README states the contract of each document `met-by`, `obligation`,
  `uses`, `diagram`, `check-numbers`, `check-pointers` and `propose` print
  with `--json`: each key with what it means, and each set with its values
  (ADR-097 point 6). Each set that named no reading of a value a caller does
  not know is marked so. Nothing a command prints changes.
