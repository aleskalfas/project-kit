component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The foundations' version being built declares the shared size axis `device`
  (#2806), with the modes `desktop`, `tablet` and `phone`, and the default
  `desktop` (DEC-021 point 1). It carries 1.1.0, since a new shared axis is an
  addition, and stays unreleased: `pkit visual add foundations --being-built`
  takes it, while `pkit visual add foundations` still takes the release 1.0.0.
  A brand that gives no size, the neutral brand among them, draws on it as on
  1.0.0, but for the version a drawing names. A piece that names a size its
  brand does not give is refused with words that say so, naming the brand, and
  its base where it builds on one.
