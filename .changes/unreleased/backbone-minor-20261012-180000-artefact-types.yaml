component: backbone
kind: minor
custom:
  category: Added
body: >
  Artefacts take a type their owner declares on a place (COR-056, #1406). A
  component declares its types in a type registry, `friction.types` in its
  package metadata, and names one on a place as `type`. A project gives a
  type on its own place, written `{path, type}` under `friction.places`.
  Discovery resolves each artefact's type from the places that match its
  file. Every rule is `backbone:rule`. A project place yields to a
  component's place that is not root-wide, a root-wide place comes last,
  and otherwise the more specific place wins. A kind field gates a type,
  and a tie counts as each type in contention. A rule set's `scope` now
  takes `{paths, exclude, types}` beside a plain list of paths, which keeps
  its meaning. A scope on a method rule set is now an error (COR-051 point
  2): no shipped method rule set has one. `pkit validate`
  reports the type findings: the `configuration` member fails a type the
  project may not give, a bare type taking a declared type's name, and a tie
  the project can mend. It reports a typed project place that yields. The
  `packages` member reports what only a component can mend, and the
  `rule-sets` member fails a type in a scope that no owner declares.
  `pkit friction artefacts --json` gives each artefact its `type`,
  `type_place`, `type_conflict` and `ranked_places`, each place its `type`,
  and every type registry under `types`, at version 1. It prints a
  `warning:` line for a project place whose `type` the schema refuses. The
  install plan names a capability's type whose name a bare project type
  uses. Apart from a scope on a method rule set, nothing that exists changes
  until a place or a scope uses a type. An older
  backbone's readers pass over a typed place and a mapping scope, and its
  validation refuses them.
