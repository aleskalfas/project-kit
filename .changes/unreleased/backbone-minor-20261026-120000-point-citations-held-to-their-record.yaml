component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit decisions validate` warns of each citation in a record that names a
  point its record neither holds nor retires, written after the record's id as
  `#N`, as `point N` or `points N and M`, or as a label alone: `DEC-035 D6`
  where DEC-035 numbers its points, or `point 9` past a record's last. `pkit
  refs validate` warns of the same in an agent's or a skill's body, and the
  `decisions` and `refs` members of `pkit validate` carry both. Each warning
  names the file and line and fails no command, since the citations are read
  from prose. The decisions README's "Citing" says which forms are read and how
  a bare `DEC-NNN` is read.
