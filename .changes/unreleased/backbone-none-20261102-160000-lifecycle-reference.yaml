component: backbone
kind: none
body: >
  The lifecycle area's README, `.pkit/lifecycle/README.md`, becomes the
  entry page of a reference for the AI agent, with four lookup pages beside
  it (#2473): `manifest.md` (the manifests, package metadata, the
  methodology's literals, how registered commands and anchor kinds run,
  filler files, the wiring, data points and discovery),
  `component-registry.md` (the registry, install's and register's checks,
  uninstall), `migrations.md` (the migration framework and the script
  contract) and `upgrade-flow.md` (a version transition, its guards and the
  upgrade of one capability). The README keeps the layout, the two tiers
  and how derivable state is reconciled, and every moved heading keeps its
  address there as a heading that links its new home. The CLI, schemas,
  process, adapters, rules and scratchpad references and the migrations
  README link the new pages. No command, path or format changes, so no
  surface moves.
