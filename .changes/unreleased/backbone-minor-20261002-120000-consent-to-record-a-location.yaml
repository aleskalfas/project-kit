component: backbone
kind: minor
custom:
  category: Changed
body: >
  `pkit agents adopt` asks before it records an overlay category over a folder
  that already holds documents (COR-049 point 5): recording it puts those
  documents within reach of every agent that references the category. At a
  terminal it asks once for the run, listing each `category = path`; `--yes`
  consents without a prompt. **Behaviour change for non-interactive callers:**
  a run off a terminal without `--yes` that would record over such a folder now
  refuses — exit 1, nothing written, no folder created, no deploy — and names
  the command with `--yes`; before, it recorded silently. A folder `adopt`
  creates, or one that holds nothing, is recorded as before, with no prompt.
  `pkit agents reconcile --write` is unchanged: its default shows each entry and
  `--write` is the confirmation. `pkit docs record-location` no longer asks or
  refuses: recording a capability's own location changes nothing in use, so
  running the command is the consent; `--yes` is still accepted and has no
  effect. Each recording now says which root the path was derived from and where
  to change it. No migration.
