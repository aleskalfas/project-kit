component: project-management
kind: minor
custom:
  category: Added
body: >
  The `seats` listing now names, last, each Task in Review that a released
  seat left, with the open pull request from the Task's branch, for a person
  to land or to hand over to a worker (DEC-059 points 5 and 9). Such a Task's
  claim stopped counting when its seat was released, by its clone or by force,
  and no worker's loop takes it up, since the shared pool holds only Tasks in
  Backlog and In Progress. The Tasks are listed under the seat and the clone
  whose claim names them. The listing reads the comments of each Task in Review
  only once some seat's state issue logs a release, and the open pull requests
  in one listing once a Task is found, and it writes nothing to them. It exits
  3 where a Task's comments or the open pull requests could not be read.
