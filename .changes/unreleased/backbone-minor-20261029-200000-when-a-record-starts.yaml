component: backbone
kind: minor
custom:
  category: Added
body: >
  The core rules gain rule 23, `RS-OPS-023`, under "Before changing files":
  before making a choice later work will build on, such as a library, an
  interface or format others use, a convention or a boundary between parts,
  draft the record that decides it, and let no work rest on the choice until a
  person accepts it (COR-065 point 3). A change to what an accepted record
  decides needs a record too, and for a record a project received from
  elsewhere, the project follows it in its own files or proposes the change
  where the record is kept. A choice that binds nothing beyond its own change,
  or that an accepted record already makes, needs no record. An agent now meets
  the rule at every session start, not only when a person asks for a record.
  No existing rule is renumbered, and the set `OPS` moves to its next major, as
  a new accepted rule does.
