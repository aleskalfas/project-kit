component: living-docs
kind: minor
custom:
  category: Added
body: >
  A space's entry in living-docs' project configuration may now name the
  space's `audience`, who the space serves in words, as living-docs DEC-001
  point 1 decides (#1922). `pkit validate` checks it under `data`, and refuses
  one that is not text or names nobody. The configuration stays at version 1,
  and an entry without an audience reads as before. Until the readers point
  resolves, the `living-docs` agent's reader-review reads a page as the
  audience its space's entry names. Where the entry names none, it reads a user
  page as users and a technical page as maintainers. For a space the project
  adds whose entry names none, it names that entry, and stops.
