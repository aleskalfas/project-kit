component: project-management
kind: patch
custom:
  category: Fixed
body: >
  A step that is the person's is now taken only with their authorisation: a
  yes typed at a terminal, or `--yes` (#2015). Off a terminal without `--yes`,
  `close-milestone` refuses the close, `add-workstream`, `rename-workstream`,
  `merge-workstream`, `split-workstream` and `remove-workstream` refuse the
  change, and `edit-workstream` refuses a status flip. `add-member` and
  `remove-member` refuse to write `members.yaml`. Each refuses with exit 1
  before anything is changed, and names the command to run with `--yes`. An
  answer piped into stdin is never read. A re-run of `close-milestone` that
  finishes a rollforward still goes on without `--yes`. At a terminal, and
  with `--yes`, each command works as before.
