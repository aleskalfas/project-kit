component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual release <library>` releases a version of a project's own library
  (#2610). It reads the newest version the library folder holds in full on the
  installed capability, every component a piece places or not included, and
  refuses a finding that fails. It compares the version with the library's
  previous release, prints what the number needs, and refuses a break in a
  version that keeps that release's major. It then writes the installed
  capability's version as the release the version needs, and lists the version
  `released: true` with its hash, every other byte of the list kept. With
  `--shipped`, where the capability is authored, it releases the version being
  built of a library the capability ships, only where no change touched it
  since the release that wrote the capability's current version, on the newest
  released version of each library it builds on. It adds the released place and
  the record's entry, and writes a patch changeset for the capability.
