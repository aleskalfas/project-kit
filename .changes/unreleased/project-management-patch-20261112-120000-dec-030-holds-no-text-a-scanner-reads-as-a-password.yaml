component: project-management
kind: patch
custom:
  category: Fixed
body: >
  DEC-030 holds no text a secret scanner reads as a password (#3070). Its
  rejected alternative on a `session_defaults:` block cited "the prior critic
  pass" before a colon and a path, which a scanner such as Vault Radar read
  as a password assigned a value, refusing the commit that installs the
  capability. The sentence says "critic review" instead, and decides what it
  decided.
