component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A concept shown by colour can show a sign beside it, so colour is never the
  only thing that tells two concepts apart (#3045, DEC-036). A notation may give
  a concept its `icon`, an outline in SVG's path data within a square, or map it
  to a `shape` the foundations declare. The foundations being built, 1.1.0,
  declare six: `circle`, `square`, `triangle`, `diamond`, `hexagon` and `star`.
  A component draws its instance's concept's sign in a part of the new kind
  `sign`, painted as a box is, fitted by its square into its frame, and not
  drawn where the instance takes its family from no concept with a sign. The
  scene holds it as a `path`, so the seam rose to 7, and the SVG renderer rose
  to 1.2.0, the PDF renderer to 1.4.0 and the HTML renderer to 1.5.0, each
  drawing it. An icon that is no outline, or a shape the foundations do not
  declare, fails as `concept-shape`, the concept keeping its colour. A shape
  that is no outline fails as `shape-shape`, and a library other than the
  foundations that declares `shapes` as `roles-declaration`. A release of the
  foundations that removes or renames a shape breaks. A notation, a component
  or a piece that names no sign draws as before.
