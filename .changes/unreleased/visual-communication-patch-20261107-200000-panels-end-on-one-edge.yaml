component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  The panels of a row end on one edge when one holds panels of its own
  (#2805). An item that `align-items: stretch` makes larger across than it
  asks for passes the rest on to the last part it draws, where that part
  places a component by `use` or `slot` and gives no size across. That
  component gets as much more, and passes it on the same way, so the last box
  of a nested `starter/panels` ends where the row's other panels end. The size
  passed on names `engine` as its source. What an item asks for is unchanged,
  and a size a part's formula gives passes nothing on, so a piece whose panels
  hold no panels draws as before, byte for byte.
