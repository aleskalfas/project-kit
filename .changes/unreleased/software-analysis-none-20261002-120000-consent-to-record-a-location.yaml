body: Internal — the README, the analysis-resolver's body and storyboard and two script docstrings say what is true of consent (#1141) — the stamp's recording of the analysis location asks nothing, since running the stamp is the consent (COR-049 point 5); the friction writers each ask once and the record stamp has no prompt. The stamp's command line is unchanged; the second line it prints with a recording is the backbone's notice.
