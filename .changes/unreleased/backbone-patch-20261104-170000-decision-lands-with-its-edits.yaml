component: backbone
kind: patch
body: >
  A decision lands with what it decides (#2639). The decisions reference's
  "The acceptance gate" says that a new record's Implications name each edit
  the change makes to an accepted record, and name, as not made there, an
  edit to a record the project receives by sync. A person accepts the new
  record in its change, and the edits then follow in that change: the
  superseded-by line of each of the project's own records it replaces, and
  each point it narrows or completes, rewritten, with a forward refinement
  pointer where the Implications name one. A person accepts those edits in
  the numbering check's list. "Refining an accepted record" says how each
  edit is made. The `decision-author` skill names the edits in the
  Implications, has a person accept the record in its change, and only then
  makes them, so the record lands accepted, never proposed. The `architect`
  agent's line on an ADR it authors says the same, for the records it owns.
  `pkit decisions check-diff` and `pkit refs rot` behave as before: neither
  fails such a change, and the numbering check lists the edits.
