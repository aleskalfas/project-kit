component: backbone
kind: none
body: >
  Design-ahead: PRJ-016 and ADR-092 decide that a change that must be tested
  before it ships is tested on its own branch before it merges. A candidate is
  cut from that branch's head, a person withdraws a candidate with a tag, a
  candidate's number counts every candidate cut, and every final release is
  the ordinary release PR from the default branch's head, merged only onto the
  commit it was planned from. A tester enters each candidate fresh from a
  final release no newer than the one its branch last took in, and a project
  on a candidate moves to no other release, so a branch may change its
  migration scripts until it merges. In every project, a release refuses
  while a migration script sits in a folder its component already released,
  and the release commit names the commit its plan read. They partly
  supersede PRJ-002 D3 and D5 and ADR-089's points 1, 2, 3, 5, 6, 8 and 9,
  and refine PRJ-002, PRJ-004, ADR-049, ADR-063, ADR-065 and ADR-089. It is
  record text only, and nothing you run changes. The build for #2211 carries
  the real changesets.
