component: backbone
kind: patch
custom:
  category: Changed
body: >
  The agents README, `.pkit/agents/README.md`, becomes a reference for the
  AI agent, linking its new guide at `latest` (#2457). It keeps the layout,
  the front matter, the body conventions, the reference graph, the overlay,
  model and effort, how a definition is deployed, the rule-set reviewer and
  the authoring command. Hooks and storyboards move to two pages beside it
  that ship with it, `hooks.md` and `storyboards.md`, and every heading
  address other text may name is kept. The `agent-author` and
  `storyboard-author` skills read the two new pages. The pages now say what
  the code did before: the deploy fills placeholders in the front matter
  alone, install and sync check no unsatisfied hook need, and an override
  for an unknown agent or category is ignored. No command, path or format
  changes.
