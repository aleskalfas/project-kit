component: software-analysis
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  Where project-management is installed, software-analysis contributes the
  core `rule-set-reviewer` to its merge gate, under the floor
  `touches-ruled-artefact` (DEC-001 point 10; COR-057). A pull request that
  alters an artefact an accepted rule binds on, or brings one under such a
  rule, now needs the reviewer's `APPROVED` before `done-work` merges it, an
  analysis artefact or not. The reviewer runs on the local path only,
  through `review-pr`. While the contribution is in force, resolving any pull
  request reads its base and head commits through `pkit rule-sets altered`,
  so a shallow checkout fails it. living-docs contributes the same rule, and
  the reviewer is required once. To keep your gate as it was, list
  `rule-set-reviewer` under `review.agents.contributed_opt_out` in
  project-management's configuration, once for each capability that
  contributes it. software-analysis declares project-management as an
  optional dependency, from its first release with the floor: it still works
  without project-management, and install and upgrade hold an installed one
  to that range. The capability requires the backbone that ships the reviewer,
  the command and optional dependencies.
