component: software-analysis
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The capability ships its method rule set, `software-analysis:SAN`, in
  `rule-sets/san.md` (DEC-001 point 1). It takes no scope, as no method rule
  set does. It holds the format rule, `RS-SAN-001`: an analysis artefact
  carries its kind's declared structure. Its origin is DEC-001, and it binds
  once it is accepted. For text of the `sentence` form, its *How* says what
  one text is, and where a sentence ends. Under `checks`, the set declares
  what `software-analysis:validate` enforces of the rule: the parts a kind
  ships, their order, the glossary's head and their forms. The name `SAN` is
  now taken, so a rule set of your own named `SAN` fails `pkit validate`.
  Renaming that set renames every rule id in it. The segment is `minor`, as
  semver allows a breaking change before 1.0.0, and the capability is
  installed only in project-kit's own clones, which hold no set named `SAN`.
  The set declares `checks`, which only the rule-set schema of the backbone
  this release ships reads, so the capability requires that backbone.
