component: backbone
kind: minor
custom:
  category: Changed
body: >
  `pkit permissions apply` routes allow rules justified only by the active
  permission profile into the gitignored `.claude/settings.local.json`, tracked
  by a new provenance ledger sidecar
  (`.pkit/permissions/project/profile-realized-allows.yaml`) and
  recompute-replaced on every apply — a profile switch or deactivation heals
  its stale rules away; operator/harness-authored local rules are never touched
  (ADR-046, #611). Rules justified by committed model state keep realizing
  additively into `.claude/settings.json`, so activating a profile no longer
  produces tracked-file drift in repos that commit that file. `diff`
  reconciliation reads the two-file union; floor claims (probe double-lock,
  unjustified-rule attribution) stay committed-scope. Existing drift converges
  by restoring the tracked file and re-running `apply` (documented operator
  gesture; no migration).
