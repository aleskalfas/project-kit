component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  A deck's HTML page shows each slide inside a keyline, on a backdrop of the
  browser's colours (#2944, DEC-031). The scene's root comes to say whether its
  pages are fixed pages, `fixed-pages`: the pages of a top whose layouts are
  its pages' forms, where that top asks for a height, as a deck's slides are. A
  site's pages, a page alone and the pages a slot declares are none. A page
  file of fixed pages shows each inside a 1 px outline, a mix of 48% of the
  browser's text colour into its ground colour, on a backdrop of 7%, with a
  gutter of 32 px, or 4% of the window where that is less. The keyline
  contrasts at least 3 to 1 against the backdrop and the browser's ground in
  light and dark, takes the text colour under more contrast, and under forced
  colours the backdrop and each slide take the reader's background colour and
  the keyline their text colour. A slide keeps its size, shrinks with the room
  the gutter leaves it, and nothing scrolls sideways; a print holds neither the
  keyline nor the backdrop. The HTML renderer rises to 1.3.0, and declares the
  shares, the keyline's width and the gutter under `pages.fixed`. The viewing
  step widens its window by the gutter on each side, for every file, and each
  image is still one page or one band of it. The seam stays at 5. A figure's or
  a site's page file is as before, but for the renderer's version.
