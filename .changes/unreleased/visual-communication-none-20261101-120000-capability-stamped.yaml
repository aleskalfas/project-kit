component: visual-communication
kind: none
body: >
  Design-ahead: the opt-in visual-communication capability is added, with
  its decisions to follow (#2427). A piece, such as a presentation or a
  documentation figure, keeps its content as data, takes its look from
  libraries of components, brands and notations, and is drawn by several
  renderers. Nothing is built yet, so an adopter can observe nothing new.
