component: software-analysis
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The analysis links its citations of records, points and rules, as the new
  point 13 of DEC-001 decides (#1865). In every analysis, `pkit analysis link`
  links the first citation of each record, point and rule in each section of
  an artefact in force to what it cites, as `pkit refs lookup --json` finds
  it: a record's file, a point's heading by GitHub's anchor, a rule's heading.
  The forms are listed in the README's "Linking citations", from `COR-050`
  and `COR-050 point 14` to `points 6 and 9`, `PRJ-002 D1 and D4`,
  `software-analysis DEC-001 point 2` and `RS-WRITE-005`. A `DEC-NNN` names
  the capability a list carries, else the word before it, else the
  analysis's own, and otherwise takes no link and is warned of. A section of
  a use case, an actor, a journey or a requirement is each of its parts.
  Code, headings, labels and other links are skipped, a citation is no
  mention of a term, and `<!-- pkit:not-a-citation -->` marks one citation as
  none. Whatever any rule's status, `pkit analysis validate` reports a link
  missing, extra or stale and names the command. It fails into a file the
  project writes, and warns into one it receives as a synced copy, such as a
  core record. Run `pkit analysis link` once after you take this release, and
  again after a version transition that rewords a heading you cite.
