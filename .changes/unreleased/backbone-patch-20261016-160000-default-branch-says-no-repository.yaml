component: backbone
kind: patch
custom:
  category: Fixed
body: >
  Outside a git repository, or where git cannot run, every reader of the
  default branch says so in plain words: the default branch cannot be read
  because git finds no repository here it can read, with git's own reason, or
  because git could not be run. It no longer says there is no remote and no
  local branch, or offers to declare another name or a base, since neither
  helps. Only the message changes.
