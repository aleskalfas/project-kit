component: project-management
kind: minor
custom:
  category: Added
body: >
  A state issue now holds a piece of shared state that changes while agents
  work (DEC-058, #2138). `scripts/_lib/state_issues.py` is the one module that
  creates, reads, claims and releases one (ADR-071): it reads the whole comment
  log, counts a comment only from an author who may write, and keeps the first
  claim on a free state. The audit-log facility, `scripts/_lib/audit_log.py`,
  builds and parses every event comment of state issues and of instance
  ownership. An ownership event's stamp is now `<!-- pkit:audit v=1 ... -->`,
  naming in a project with a topology the seat, its number and the clone's key.
  The stamps written before it, `<!-- pkit:instance-owner v=1 ... -->`, still
  read. The new schemas `audit-log.yaml` and `state-issues.yaml` declare the
  stamp, the event types and the marker. A clone keeps a key of its own beside
  its instance id, generated the first time it claims on a state issue. Every
  command that reads a single issue refuses a state issue, and the board's reads
  leave one out. No command creates a state issue yet: the commands for seats
  come later.
