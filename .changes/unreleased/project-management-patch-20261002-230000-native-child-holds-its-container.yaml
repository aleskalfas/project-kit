component: project-management
kind: patch
custom:
  category: Fixed
body: >
  A child linked natively under a container now holds the container open until
  the child closes, whatever the child's first line says (#1304). The close
  gate lists a container's children through the containment seam, native
  sub-issues included, but then asked each one whether its first line names a
  parent and left out one that names none — a sub-issue linked in GitHub's UI,
  or one filed with `create-issue --parent <N> --milestone <M>`, whose first
  line is the `Milestone:` ref — so the container could close while that child
  was open. A container may therefore now hold where it closed before:
  `close-issue <N> --mode=cascade-eligibility-close` refuses, naming each open
  child that holds it (`#<n>`) with what releases the container, and
  `pkit process cascade project-management:issue-lifecycle --subject <N>`
  names the member the fold stopped at (`member '<n>'`, with the state it is
  in); `pkit pm show-tree` shows that child under the container, whatever its
  first line names. Close that child — or, if it does not belong under the container, move it
  with `set-field <n> --parent <P>` — and the container closes as before. A
  child whose issue cannot be read still holds the container, as before.
