component: project-management
kind: minor
custom:
  category: Added
body: >
  A worker's loop now reads its own pull requests in Review each time it
  starts and after each `review-work`, before it takes the next Task. It mends
  one that conflicts with the default branch by merging that branch in, never
  by a rebase or a force-push, and runs the fix round on one whose verdict at
  its head asks for changes, carrying only the blocking findings. A pull
  request that a released seat left in Review is the person's to land or hand
  over: `next-task` never offers it (DEC-059 points 7 and 9). `show-pr` takes
  a PR's head branch as well as its number, and shows `mergeable`, GitHub's
  word on whether the PR merges into its base, in its view, its JSON and as
  `--field mergeable`.
