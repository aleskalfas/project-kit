component: claude-code
kind: minor
custom:
  category: Changed
body: >
  The agent resolver now refuses an overlay grant that resolves into
  sync-managed content, naming the offending path and skipping that agent
  rather than deploying an unchecked write authority (ADR-051). It consumes the
  single sync-managed predicate propagated at `.pkit/lifecycle/ownership.py`
  rather than re-deriving the rule, so this adapter and any future one cannot
  drift on what counts as adopter-owned. `deploy-agents.sh` reports the refusal
  distinctly from an undefined category, and the `adopt` hint no longer offers
  itself for a category naming paths only the adopter can enumerate (#686).
