body: >
  Internal. The adapters and permissions READMEs and the evidence of the
  harness requirement `unattended-confined-run` say that a drift command's
  confined run, the form every fixer's run takes where the harness holds it,
  depends on it, and
  `pkit agents run --help` says that nobody can answer the agent during its
  run, where it said nobody watches it. Nothing you run changes.
