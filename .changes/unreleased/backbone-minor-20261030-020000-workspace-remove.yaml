component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit workspace remove <path>...` removes files and folders an agent no
  longer needs from the agent workspace, `.agent-workspace/` at the checkout's
  root. It reads each path as the shell expanded it and tests every one before
  it removes any. One refused path refuses the call, which then removes
  nothing and names each refused path and why. It refuses a path outside the
  checkout's own folder, the folder itself, `.` and `..`, a path at or under a
  child of the folder named after a registered capability, where that
  capability keeps its lasting state, and a nested repository or worktree. A
  symlink given is removed as a link, and no link is followed. The
  cross-repository guard runs first, and the command takes no confirmation
  with the call. `--dry-run` tests every path and removes nothing. It exits 0
  when every path is gone, 1 when refused or stopped partway, and 2 on a usage
  error. It is decided as any `pkit` command: it runs with no prompt wherever
  a profile grants `kit`, and `read-only` denies it. Core rule 16 now asks
  agents to remove what they wrote with it, never with `rm`, and only what
  they wrote; the set `OPS` moves to its next major, since the rule is
  tightened.
