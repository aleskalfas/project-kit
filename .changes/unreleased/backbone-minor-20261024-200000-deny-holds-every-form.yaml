component: backbone
kind: minor
custom:
  category: Security
body: >
  A deny of the permission decision core, a guardrail's included, also matches
  the forms of its command that programs read (ADR-025 point 5): a short flag
  inside a bundle (`git push -uf`), a long flag cut to a prefix (`--force-w`),
  with its value after `=` (`--force-with-lease=main`) or behind one dash
  (`-force`), a program named by its path or in another case
  (`/usr/bin/sudo`, `Git`), and a subcommand behind the options before it
  (`git -C . push --force`). The privilege catalog's Bash matcher gains an
  optional `word_prefix_any` field, through which the `vcs-history-rewrite`
  guardrail names a refspec opening with `+`, so `git push origin +main` is
  denied. The guardrail also names `--mirror`, and the `destructive-fs`
  pattern spells `--recursive` cut down to `--r`. Where an unquoted glob, or an
  assignment that changes the program's configuration, such as `HOME`,
  `XDG_CONFIG_HOME`, a name holding `CONFIG` or `GIT_DIR`, may make a command
  one a deny names, no grant allows it: the core defers, and a strict posture
  denies (ADR-025 point 2). So where `git` is granted,
  `git push origin --forc[e]`, `HOME=/tmp/x git status` and
  `export GIT_CONFIG_GLOBAL=/tmp/x && git push` are no longer allowed unasked.
  Claude Code's adapter baseline allows `git` by prefix, so a deferred glob led
  by `git` may still run unasked there. Grants still match a command as it is
  written, and a git alias or refspec set in a configuration git reads, or
  through `git -c`, stays the grant's breadth.
