component: backbone
kind: patch
custom:
  category: Fixed
body: >
  List rows on both tracking surfaces now carry the full issue reference
  (#678, from #660's adopter feedback on the shipped #664 flow): `pkit
  report` / `report --tree` (and inbox) rows render the report's own URL
  beside the title, and `pkit scratchpad list` renders each reported ref's
  issue title + URL beside its number + state in the same single read —
  both degrading to number + state offline exactly as before.
