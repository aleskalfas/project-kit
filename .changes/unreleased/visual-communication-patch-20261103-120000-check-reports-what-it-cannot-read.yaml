component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  `pkit visual check` reports what it cannot read, and an error it does not
  expect, as findings (#2506). An error on one piece, such as one the engine
  raises on data it does not guard against, fails as `unexpected-error` at
  that piece's `piece.yaml`, naming the error, and the check goes on to the
  next piece; before, it ended in a traceback and `pkit validate` showed no
  finding of any piece. A component whose file is present and cannot be read
  is `component-unreadable` at that file, with the reader's error, in the
  check and in `pkit visual render` alike, where both reported a component
  that does not exist. A top that names no component is reported at
  `piece.yaml#top`, where the piece names it, not in the content.
