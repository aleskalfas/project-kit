component: claude-code
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  `CLAUDE.md` now reaches each installed capability's rules (ADR-076). The
  adapter declares `loaded_rules:` in its package, and its merge keeps
  `@.pkit/rules/capabilities.md` present directly after
  `@.pkit/rules/core.md`, inserted wherever it is absent; the next sync
  inserts it, so no migration is due. A `CLAUDE.md` it creates holds core's
  include, the index's line and the project's, in that order. The merge now
  writes through the file, so a linked `CLAUDE.md` keeps its link and the
  file keeps its mode, and a CRLF file gets CRLF lines. It no longer puts the
  project's include back on its own, takes an H1 inside fenced code for the
  host's, or treats an include of core's rules written only in fenced code or
  a code span as present: it then inserts nothing and reports it. Its answer
  to the new harness requirement `session-loads-rules` is at a cost, naming
  the sessions that skip `CLAUDE.md`, and the runner's known gap apart.
