component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit capabilities install <name> --from <git URL> --ref <tag or commit>`
  is added, to install the capability another git repository incubates at
  `.pkit/capabilities/<name>/`, fetched whole at that tag or commit with
  your own git credentials (COR-041, ADR-040). In this release it refuses,
  naming why, before it reads or writes anything, `--dry-run` and `--plan`
  included: installing from another repository waits on a later release,
  which changes how a fetch takes the commit a pin records once the pin's
  ref has moved (#3349). A capability already registered
  `externally-sourced` is not held: `pkit sync` brings its copy to its
  pin's content and never moves the pin, `pkit upgrade` reads its range
  from its copy, `capabilities uninstall` removes the copy and keeps the
  project's own files in its `project/` tier, `capabilities list` and `pkit
  status` show its source and its ref, and `capabilities upgrade` and
  `capabilities register` refuse it. The CLI reference says so, and the
  lifecycle reference says what sync does with such a capability.
