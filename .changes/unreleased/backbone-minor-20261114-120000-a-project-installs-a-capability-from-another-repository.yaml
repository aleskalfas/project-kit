component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit capabilities install <name> --from <git URL> --ref <tag or commit>`
  installs the capability another git repository incubates at
  `.pkit/capabilities/<name>/`, fetched whole at that tag or commit with
  your own git credentials and none of pkit's (COR-041, ADR-040), over
  git's `https`, `ssh`, `git` and local transports alone, whatever your
  git's `protocol.allow` settings turn on. It fetches, reads the fetched
  `package.yaml`, gates it as any install does, then installs or refuses,
  and a refusal writes nothing. The copy lands outside the capability's
  `project/` tier, which no fetched folder named `project` in another case
  reaches either, and is registered `externally-sourced`; its manifest
  records the source, the ref and the commit the ref named as its `pin`.
  A name
  another capability holds, a branch as the ref, an abbreviated commit id,
  a URL that carries a credential, and a capability already installed from
  another pin are refused; a branch pin and moving a pin are not built yet.
  A source that cannot be reached warns loudly and installs nothing. `pkit
  sync` now brings each externally-sourced copy to its pin's content,
  removing files the pin does not hold, and never moves the pin; where the
  fetch fails, the tag now names another commit than the pin records, or
  the content's `requires_backbone` excludes the backbone the project
  records, it keeps the copy and warns. `pkit upgrade` reads an
  externally-sourced capability's range from its installed copy, never from
  a capability the bundle ships by its name. `capabilities uninstall` removes
  the copy and keeps the project's own files in its `project/` tier, and
  `capabilities list` and `pkit status` show the source and the ref.
  `capabilities upgrade` and `capabilities register` refuse an
  externally-sourced capability. The CLI and lifecycle references say so.
