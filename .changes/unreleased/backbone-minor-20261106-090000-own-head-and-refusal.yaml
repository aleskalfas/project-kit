component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit friction check` gains `--own-head <rev>`, which names the change's own
  head beside `--head`, under the rule `$PKIT_CHECK_HEAD` keeps: the commit
  checked, or a parent of it. So a merge read from git objects is judged
  against its head. `--head` alone still reads no variable. A run away from the
  commit `--head` names now promises to start nothing that commit holds. With
  `--json` and `--own-head`, its refusal to run a resolver is a document, with
  a `refused` key whose `kind` is `resolver-elsewhere` (project-management
  DEC-067, ADR-068 point 6). A run that names no `--own-head` prints nothing on
  standard output there, as before, so a reader older than the flag still knows
  the refusal.
