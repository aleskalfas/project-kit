component: project-management
kind: minor
custom:
  category: Added
body: >
  The clash guard of DEC-035 point 6 (#520): with an instance id set,
  `start-work`, `review-work`, `done-work`, `promote-issue`, `edit-issue` and
  `move-issue` refuse an issue another instance owns, or one they cannot read,
  before they write anything. The refusal is bypassable with an audit:
  `start-work --bypass "<reason>"`, and `--bypass-owner "<reason>"` on the
  other five, post the reason on the issue as an audit comment first. A command hands its reason to the move it
  composes, and the comment is posted once. Instance ownership also takes a
  project's topology of seats (DEC-059) from its caller. In such a project a
  planner's seat files with no owner, and a claim names its seat and counts
  only while its clone holds that seat. No project has a topology until the
  reading of it lands (#2140, #2141), so a clone with no instance id still
  writes and prints exactly what it did before.
