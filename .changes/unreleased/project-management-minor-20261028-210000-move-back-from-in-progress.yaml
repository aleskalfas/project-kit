component: project-management
kind: minor
custom:
  category: Added
body: >
  An issue In Progress that nobody is working on can now move back (DEC-006,
  #2281). `move-issue <N> --to backlog --reason "<why the work stopped>"`, or
  `--to todo`, takes it there on the person's authorisation: `--yes`, or a yes
  at a terminal. It lands in Backlog where the issue is in a milestone, or, for
  a container, where a child of it is in Backlog, and in Todo otherwise. The
  other target is refused, naming the right one. The reason is required, posted
  as the move's audit comment before the label changes, and journaled with the
  move. Every owner of the issue is released after the move, as a close
  releases one (DEC-035 point 4). Where this clone cannot release an owner,
  such as any owner where it takes no part in instance ownership, or a claim
  another account made, the move is refused before anything is written, naming
  the owner. A container is refused while a child of it is In Progress or in
  Review, each such child named, or while its children cannot all be told: an
  open child in another repository holds it until that child closes. A Task's
  branch and draft pull request stay as they are. `workflow.yaml` declares the
  two moves, and the issue lifecycle's definition version rises to 6. Where a
  board is configured and the state is native, the card's Status follows the
  move. Where the board carries the state, the move back is refused until
  #2271.
