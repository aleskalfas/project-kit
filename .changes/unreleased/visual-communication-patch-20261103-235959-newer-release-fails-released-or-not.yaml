component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  A library version the project holds that needs a newer release of the
  capability than the installed one fails the check, released or not, and
  names the project, which upgrades the capability or takes out a version no
  lock names (DEC-014 point 5, #2620). In a released version, this
  `library-unreadable` used to ask the library's owner for attention, so a
  held version the check let pass with a warning now fails. The finding
  names no version, and gives its fix. A `library.yaml` that cannot be read,
  or names another library or version than its folder, keeps its level: it
  fails, or asks the library's owner for attention in a released version.
