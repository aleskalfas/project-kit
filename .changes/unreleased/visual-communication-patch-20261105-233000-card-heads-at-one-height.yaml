component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  The starter's `card` sets its head and text at one height, whichever bar it
  has (#2711). A card with a top bar set them lower than its neighbours. A
  brand's bar thicker than the card's inset now lowers every card's head alike,
  so what a card holds still clears the bar. A change to the starter's version
  being built declares a patch of the capability (DEC-013 point 4). The starter
  has no released version, so its number stays 1.0.0.
