component: backbone
kind: none
body: >
  The decisions area's README, `.pkit/decisions/README.md`, becomes the
  decision-record specification for the AI agent, linking its new guide at
  `latest` (#2472). It keeps what an agent acts on: the namespaces and their
  ids, the no-shared-files invariant, file naming, the schema, the statuses,
  the acceptance gate as COR-066 decides it, adding, writing and refining a
  record, citing, finding the records a path leads to and the two checks of
  a record's points and numbering. It links the lifecycle reference for what
  sync writes, rather than stating it. Why records exist moves to the guide,
  which does not ship. Every heading other text names keeps its address, and
  no command, path or format changes, so no surface moves.
