component: visual-communication
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The capability ships its designer, the agent `graphic-designer` (#2971;
  visual-communication DEC-030 points 2 to 5). It turns a piece's brief into a
  piece: it names the content's structure before it chooses a form, takes type,
  colour and space from the brand's roles, and writes the reason for each
  choice into the brief. Where no library draws the design, it extends the
  project's own library, makes a component for the piece alone, or stops and
  says what is missing. It has `graphic-design-reviewer` read every page before
  it stops, mends what it judges right, tells you what it changed, and asks you
  only where a fix would change what the piece says, needs a write it may not
  make, or two rounds of mending did not clear it. It writes within the
  location, which the capability's new overlay category
  `visual-communication.work` grants it. Installing the capability writes that
  grant into the agents overlay, as the answer of the new query
  `pkit visual work-paths`: the recorded location, or `visual/`. An install
  from before takes it from `pkit agents reconcile --write`, and a value you
  set is kept. The README and the `visual-author` skill name the designer, and
  the build loop says when to hand a page to it.
