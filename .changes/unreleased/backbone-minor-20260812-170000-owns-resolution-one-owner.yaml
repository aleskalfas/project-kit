component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit refs validate` now resolves an agent's `owns:` entries through the
  adopter overlay before checking them — a per-agent `overrides:` entry
  replacing the top-level default, through one shared helper the claude-code
  deploy resolver and the validator both use (pinned by a parity test that runs
  the real resolver, so the two cannot drift). On those resolved sets it
  enforces the exactly-one-owner invariant the agents area spec had stated in
  the present tense but never checked: cross-agent path-prefix containment is
  flagged, naming both agents, both paths, and the category a path came from.
  Conflicts are flagged, never arbitrated; nesting within one agent's own set is
  benign; an entry resolving to zero paths, or naming a category the overlay
  does not define, is clean (per ADR-051). Adopters whose overlay nests paths
  across agents may see new findings on first run (#699).
