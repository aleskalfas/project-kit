component: backbone
kind: none
body: >
  Design-ahead: COR-051 point 6 says what a change of the internal
  documentation root does to the project's rule sets in their default folder:
  the backbone's configuration command that changes the root declares the old
  folder as a place where a rule-set file there would go unfound, and
  validation fails on a file a hand edit left behind. COR-049 point 5 points
  to it. No adopter-observable change until the build lands, which declares
  its own changeset.
