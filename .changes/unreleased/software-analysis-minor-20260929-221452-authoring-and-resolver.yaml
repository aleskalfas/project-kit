component: software-analysis
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  Authoring and resolving the analysis (DEC-001 points 5, 6 and 9). The
  `analysis-author` skill walks an actor, a term, a use case, a journey and a
  revalidation record through `pkit analysis new`: the slug, the area, the actor
  and the steps, what to anchor, and when an actor or term is stamped
  `--unanchored-because <why>` instead of anchors. `pkit analysis new
  revalidation <slug> --change <ref> --trigger <trigger> --outcome
  <id>=<outcome> … [--gap <text> --resolution <text>]…` writes
  `revalidations/<date>-<slug>.md` only when there is something to say — a
  planned revalidation, or one that found a regression or a gap — and refuses
  a routine one, whose artefacts' own revalidations are its record. The
  `analysis-resolver` agent, deployed with the other agents, proposes each
  flagged artefact's outcome (holds, analysis-stale, code-regressed, gap-found)
  with its evidence and, once you confirm, records it through `pkit friction
  revalidate` and `pkit friction defer`; it never rewrites an artefact, and
  when it cannot tell a stale analysis from regressed code it writes nothing
  and asks you. `pkit analysis propose <artefact>` is the read-only rule it
  stops by: from `pkit friction explain` and the code an artefact quotes from
  its anchored files, it proposes holds, stale or regressed, leaves the change
  to be read, or answers ambiguous with the question for a person. It needs
  the backbone's `pkit friction explain`, so the capability requires the
  backbone this release ships.
