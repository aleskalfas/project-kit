component: project-management
kind: minor
custom:
  category: Added
body: >
  Added `--from-report <N>` to create-issue (and documented it as the
  batch-plan filing loop's pass-through flag, #645): filing a fix from
  feedback/change-request #N auto-links the new issue into #N's
  `## Tracked by` by invoking the backbone's canonical `pkit report link`
  editor (DEC-048's one-linker rule — never a second Tracked-by
  implementation). Maintainer-side same-repo, gated by the backbone verb
  (refusal surfaced verbatim); a link failure after a successful create
  warns with the exact remediation command and exits 4, never rolling the
  issue back. `requires_backbone` floor raised to 1.144.0 (the version
  shipping `report link`).
