component: visual-communication
kind: none
body: >
  DEC-024 is accepted: an outside program the capability starts keeps its own
  sandbox on, and for now nothing of the capability's leaves a session's
  sandbox. A look's stop names a build pipeline's drawings, a person's own run
  and the SVG renderer's pages. Later the sandbox lets out only a drawing tool
  a person installs where no agent can change it (#2775). The record and its
  edits to DEC-002, DEC-006, DEC-015 and DEC-020 design ahead: no command, file,
  flag or format changes, so no surface moves.
