component: living-docs
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  The `living-docs` agent states the recorded rule for friction writers: it
  names `pkit friction revalidate` and `pkit friction defer` in the one
  paragraph that points at the agents README's four conditions for running
  one, two of which never hold for it — it has no tool for asking the person,
  and it reviews pages — so in every session it names the command that gives
  the answer, without `--yes`, and runs none, and points at the agents
  README for who may run it. Its storyboard and the capability README say the
  same. What it does is
  unchanged. The rule is the backbone's this release ships (COR-050 point 3),
  so the capability requires that backbone.
