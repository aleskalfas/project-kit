component: claude-code
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  The deploy and the agent runner ask the agents area's picker which definition
  of each name is the agent, through the resolver's new `--plan` and `--pick`
  entries, and keep no order of their own (ADR-087, #2954). The deploy writes
  the definition the picker names: the project's, else an installed
  capability's, the one the project chose, else the first by name in
  code-point order, else core's. A capability's agents deploy only while it is
  registered. Each copy's front matter now carries, under the deploy's mark,
  the definition it was written from, the digest of the text read and the tool
  access read from it, so the first sync after the upgrade rewrites every
  copy. The deploy removes every marked copy that is not the agent's: one
  written from another definition, or of a name with no agent or that no place
  ships, so a copy of an unregistered capability's agent goes, and the
  definition that now wins is written. A refused agent stays the agent and no
  other definition stands in: refused for a cause other than its tool access,
  its earlier copy stays only where the tool access its mark records gives
  nothing the current text's does not. A name whose records cannot be read is
  told in an `error` line and nothing is written or removed for it.
  `undeploy-capability.sh` now removes a capability's skills only. The
  runner's unconfined form, for a name some place ships, passes the harness
  the agent's checked definition with `--agents` under a name unique to the
  run, so the harness runs the picked agent and no other copy of the name; it
  refuses where the confined form refuses that definition, so a review run of
  an agent whose definition carries a field outside the methodology's shape,
  such as `hooks` or `permissionMode`, now stops. A name no place ships still
  runs by name.
