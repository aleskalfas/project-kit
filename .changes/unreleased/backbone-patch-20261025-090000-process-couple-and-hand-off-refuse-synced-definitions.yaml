component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The commands `pkit process couple` and `pkit process hand-off` now refuse a
  process definition whose capability the project receives as synced copies.
  Each asks the lifecycle's ownership predicate (`is_synced_copy`) before it
  writes anything, in a dry run too. The next sync would overwrite
  the entry, the contract, the seam stubs and their registrations written
  there, so the command writes nothing, exits 1, and names the folder. It
  names a capability incubated in the project as where the project's own
  process goes, which may name the refused one as its upstream. In the
  methodology's source repository, and for a capability incubated in the
  project, each writes as before.
