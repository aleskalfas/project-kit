component: backbone
kind: minor
custom:
  category: Added
body: >
  A capability's operational rules now reach every session where it is
  installed (COR-070, ADR-076). A capability may ship one loaded rule set in
  its `rule-sets/` folder; its loaded file is `rules.md` at the root of its
  tree, written by `pkit rule-sets generate` and checked where the capability
  is authored, as `.pkit/rules/core.md` is. Its preface names the capability,
  and its rules are cited `<capability>:RS-<SET>-NNN`. **The capabilities'
  rules index.** The backbone renders `.pkit/rules/capabilities.md`, one entry
  per registered capability that ships a loaded set, in the form the adapter
  declares under its new `loaded_rules:` key, at install, sync, upgrade and
  each capability's install, register, upgrade and uninstall. Nobody edits it,
  and sync and upgrade stop on a file at its path that lacks its marker. The
  new `pkit rule-sets loaded [--json] [--index <adapter>]` lists every
  layer's loaded file with its owner, and `pkit status` shows the index.
  **Validation** fails, under `rule-sets`, an index out of step with the
  registered capabilities, an entry whose file is missing, and a host file
  such as `CLAUDE.md` without the line that reaches the index
  (`loaded-rules-undelivered`), and warns of an adapter with no
  `loaded_rules:`. It also refuses, in any loaded set, a token outside code
  that opens with the import prefix a registered adapter declares, `@` for
  Claude Code: **a project's own loaded set holding a bare `@name` outside
  code now fails validation**; put it in backticks. **What a step newly
  binds.** Install, sync and upgrade, and a capability's install, register
  and upgrade, now print, for each loaded set they deliver, core's included,
  the rules it newly binds, changes or retires. The harness requirements gain
  `session-loads-rules`, which `pkit harness report` reports indeterminate.
  Core's rules now say how every layer's rules stand to them, and core rule 9
  points to COR-008 for branch naming.
