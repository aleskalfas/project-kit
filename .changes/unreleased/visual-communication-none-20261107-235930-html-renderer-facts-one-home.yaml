component: visual-communication
kind: none
body: >
  Only the pages' wording moves (#2853). outputs.md states once, in "Modes",
  that a page file serves one language and one key over the size axes, and
  that a picture draws the first key's variant. "Versions" and "What the HTML
  renderer loses" link "The loss report" for the key a loss names, and no
  longer state it. The other places link to them, and
  "Exports" and "What a run writes" link the HTML renderer's section for
  what a page file holds. The README's `pkit visual look` section links
  "When the browser stops" where it names the ways on. The example in "The
  record of exports" names the test library's `stamp`, which the page now
  anchors. No command, path, file format or check changes, so no surface
  moves.
