component: visual-communication
kind: none
body: >
  Only the pages' wording moves (#2853). outputs.md states once, in "Modes",
  that a page file serves one key over the size axes, and that a picture
  draws the first key's variant. "The loss report" alone states that a loss
  names its key. The other places link to them. The README's `pkit visual
  look` section links "When the browser stops" where it names the ways on.
  The example in "The record of exports" names the test library's `stamp`,
  which the page now anchors. No command, path, file format or check
  changes, so no surface moves.
