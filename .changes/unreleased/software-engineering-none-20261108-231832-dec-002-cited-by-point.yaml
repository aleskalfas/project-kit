component: software-engineering
kind: none
body: >
  Only citation locators move (#2915). The capability's README, DEC-002's own
  references to its points and a comment in `review-contributions.yaml` named
  DEC-002's points by the labels `D1` to `D5`, which the record does not hold.
  Each names the point its heading carries, such as point 3, or no point where
  none holds the sentence. A project's validation does not read a synced
  record or the README, so no warning an adopter sees goes away. What the
  record decides, and what the reviewers do, stay as they were.
