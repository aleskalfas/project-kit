component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit new decision <capability>` refuses a capability whose `decisions/`
  folder arrives in the project as a synced copy, as the lifecycle's ownership
  predicate answers (`is_synced_copy`). That is a kit-shipped capability in a
  project that is not the methodology's source repository, or an
  externally-sourced one in any project. The next sync overwrites what a
  project writes there, so the command now writes nothing, exits 1, and names
  `pkit new decision project <slug>` and `pkit new decision adr <slug>` as
  where the project's own decision goes. A capability incubated in the
  project, and any capability in the methodology's source repository, stamps
  as before.
