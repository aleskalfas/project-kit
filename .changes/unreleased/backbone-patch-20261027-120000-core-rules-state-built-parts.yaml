component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The core rules state two built parts as built (#2201). Rule 7 no longer
  says `pkit migrations check-diff` runs "when available". Rule 12 names
  `deploy-agents.sh` beside `deploy-skills.sh` as the Claude Code adapter's
  deploy primitives, no longer as future, and says that skills deploy as
  symlinks and agents as copies with their placeholders resolved. Neither
  rule asks anything new. No migration.
