component: backbone
kind: minor
custom:
  category: Changed
body: >
  The permission decision core reads a redirection that writes no file as
  harmless (ADR-025 point 2): an fd duplicated onto stdout or stderr or
  closed, such as `2>&1`, `>&2` or `2>&-`, and output discarded to
  `/dev/null`, such as `>/dev/null`, `2>/dev/null` or `&>/dev/null`. It
  removes such a word before it reads the command, so where `git` and `gh` are
  granted, `git status 2>&1 | gh pr list` and `cd src && git log >/dev/null`
  are allowed unasked, and a deny binds on a program behind one, as on
  `2>/dev/null rm -rf ~`. Each form counts only as a whole word, with fd
  numbers of one digit, `1`, `2` or `-` after `>&` or `<&`, the target exactly
  `/dev/null`, unquoted, and `&>` or `&>>` only last in its segment. Every
  lookalike, such as `2>&1t`, `12>&1`, `>&3`, `>&1x` or `{fd}>/dev/null`, a
  segment of redirections alone, and every other redirection, such as
  `> out.txt`, `<`, `>|`, `<>`, a here-string or a heredoc, still defers to the
  harness, and a strict posture denies it. An assignment to zsh's `NULLCMD` or
  `READNULLCMD`, which name the program a command of redirections alone runs,
  now keeps every grant from allowing, as one to `PATH` does.
