component: doc-examples
kind: major
custom:
  category: Added
body: >
  The new doc-examples capability runs the console examples of your pages as
  tests, so a change in behaviour fails your checks wherever in the code it
  comes from. Its run, `.pkit/capabilities/doc-examples/scripts/run-examples.py`,
  is a program you start by its path, never a command of `pkit`, and it needs
  nothing beyond Python's standard library and `pkit`. It runs each `console`
  fence in one shell, in a scratch project your own setup step builds outside
  the repository, and compares what each command prints with the page, through
  placeholders for what varies. `--update` writes new output into the page for
  review. `pkit doc-examples pages` lists the pages it reads, by default the
  documents of living-docs' page type, and `pkit doc-examples validate` joins
  `pkit validate`. The privilege `doc-examples:run-examples` recognizes a call
  to the run, and no grant of it ships. The contract a page is written against
  is the capability's versioned surface from its first release, so that release
  is a major, 1.0.0.
