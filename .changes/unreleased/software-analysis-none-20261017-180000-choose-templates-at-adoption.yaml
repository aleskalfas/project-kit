component: software-analysis
kind: none
body: >
  Documentation only. The README gains its adoption steps, among them choosing
  each kind's parts, a step never skipped (DEC-001 point 1). The
  analysis-author skill gains a sub-procedure, `choose-templates.md`, that
  walks each kind's shipped parts, a candidate filled with the project's own
  example and checked with `pkit analysis validate --preview`, and the choice:
  the shipped parts kept, or the project's relabels and additions in its
  `structures.yaml`. No command, schema, template or check changes, so nothing
  an adopter runs or depends on moves.
