component: software-engineering
kind: minor
custom:
  category: Changed
body: >
  The docs reviewer now checks every answer no change owes that a pull request
  writes, whoever decided it, and blocks where one does not hold (COR-064 point
  4). That is an answer on a document the change check did not ask about, a
  revisit entry it did not ask for, and a reason for having no anchors. So a
  pull request can now be blocked on such an answer a person accepted word for
  word, where the answer does not hold. The person may skip that review on
  record. The reviewer still names each such answer in an advisory finding,
  since it cannot tell whether a person or the delegate a person named decided
  it. The software engineer names such an answer in its hand-off for the
  person, or for that delegate, to decide. DEC-002 point 1 is refined to match.
