component: project-management
kind: none
body: >
  A proposed decision record, DEC-064, decides that the builder of a
  foundation's records Task authors every one of its records, and that the
  critic, then the architect agent, review each before the person accepts
  it (#2513). It designs ahead: the texts that state the rule change only
  once the maintainer accepts it, so no command, path or format moves.
