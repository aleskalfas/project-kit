component: claude-code
kind: patch
custom:
  category: Fixed
body: >
  A sync that puts back core's include in `CLAUDE.md` adds no line already
  there (#2443). Where `CLAUDE.md` lacks `@.pkit/rules/core.md` but holds
  `@.pkit/rules/capabilities.md` or `@.pkit/rules/project.md`, the merge
  inserts only the lines missing, keeping the three in their order: core's
  include directly before the index's line, and the project's include, if
  absent, directly after it, or core's and the index's lines directly before
  the project's include where it holds that alone. Before, it inserted all
  three after the first heading, so the index's line and the project's stood
  twice. A `CLAUDE.md` that holds none of the three still gets all three after
  its first heading. The adapter's README and the rules guide say so.
