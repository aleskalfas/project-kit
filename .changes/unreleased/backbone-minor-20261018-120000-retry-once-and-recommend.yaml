component: backbone
kind: minor
custom:
  category: Added
body: >
  Two conduct rules join the core rules. Rule 17, "Discuss one decision at a
  time", now asks the agent to say what it recommends with each decision. A
  new last section, "When a step fails", holds rule 21. When a step fails for
  a cause outside the agent's own work, such as a locked signing key, a
  service that is down or the network, the agent checks that it did not take
  effect and retries it once. If it fails again, the agent stops its work and
  reports what failed. Waiting on something pending is not a retry. No
  existing rule is renumbered. The rules file and its area's README say that
  a rule may cite the issue holding its decision where no record holds it.
