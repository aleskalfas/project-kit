component: backbone
kind: minor
custom:
  category: Added
body: >
  The core rules gain one rule and one clause. Rule 17, "Discuss one
  decision at a time", now asks the agent to say what it recommends with
  each decision. A new last section, "When a step fails", holds rule 21. An
  agent retries once a step that failed for a cause outside its own work,
  such as a locked signing key, a service that is down or the network. It
  first checks that the step did not take effect. If the step fails again,
  the agent stops its work and reports what failed. Waiting on something
  pending is not a retry. No existing rule is renumbered. The rules file and
  its area's README say that a rule no record or area README holds cites the
  issue that decided it.
