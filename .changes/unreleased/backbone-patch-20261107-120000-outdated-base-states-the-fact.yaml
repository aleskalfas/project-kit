component: backbone
kind: patch
custom:
  category: Changed
body: >
  The change check's report of an outdated base states the fact and names no
  remedy (#2662; COR-050 point 12). `pkit friction check` says that the base
  moved on after the branch left it, and that results hold only against an
  up-to-date base, and no longer advises a merge or a rebase: whether and how a
  branch takes in its base is the project's to decide. `pkit rule-sets altered`
  says the same, for consistency. An outdated base still fails nothing, and the
  `outdated` key of each command's `--json` document is as it was.
