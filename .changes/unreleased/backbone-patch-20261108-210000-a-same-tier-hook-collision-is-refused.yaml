component: backbone
kind: patch
custom:
  category: Fixed
body: >
  A hook whose highest tier with a provider holds two providers binds neither,
  as COR-013 point 4 decides (#2480). `pkit hooks resolve` refuses such a hook,
  naming both providers, and exits 1, where it named the first it read.
  `pkit hooks list` marks it with both providers. A provider at a higher tier
  binds the hook, so `pkit validate` and `pkit refs validate` no longer fail a
  same-tier collision below it: a provider of the project's settles one.
