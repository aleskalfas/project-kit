component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A notation maps concepts to colour families, and an item's colour follows
  what it is (#2509). A library of the new kind `notation` holds a
  `notation.yaml`, of the new `notation` schema, that maps each concept to a
  colour family the foundations declare, never to a value. A piece names the
  notations it uses under `notations`, and its content names a concept as
  `concept: <notation>/<concept>`, which gives the instance its colour family
  ahead of a list's, its component's and its container's; a state may still
  change it. The foundations, whose version is not released, declare six
  colour families, `neutral`, `blue`, `green`, `orange`, `purple` and `red`,
  each with the shared colour roles `family.<family>.fill`, `.line` and
  `.text` and a pair of its text on its fill. The roles have no default, so a
  brand gives each of the eighteen a value, and no library takes the name
  `family`. The check reports a notation that is not one or cannot be read, a
  concept that maps to no declared family, and content that names a concept
  the piece's notations do not hold. Every file the format 1 schemas accepted
  before, they still accept.
