component: visual-communication
kind: none
body: >
  The body of `graphic-designer`, which no release has shipped yet, reads
  plainly on its grant and its sources (#3067): both empty lists forbid writing
  and running a command that writes in the location in the same words; where
  its grant names no location, it leaves recording the location, which also
  brings the foundations library in, and `pkit agents reconcile --write`, which
  widens its writes, to the person, then stops. One list tells each case where
  the capability's folder is the source or a copy by its sign.
  `graphic-design-reviewer` reads the capability's rule-set folder. The pending
  minor that ships the designer declares its surface, so no surface moves.
