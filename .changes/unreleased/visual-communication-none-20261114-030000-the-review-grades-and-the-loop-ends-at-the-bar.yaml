body: >
  DEC-042 proposes how the review grades each rule of COMM and GRAPHIC in
  words, how a project sets its bar, what the review sees, and when the
  designer's loop ends (#3151). It is a design-ahead record: the Tasks under
  #3148 that change the reviewer, the designer and the skill that guides
  building a piece ship the surface. No surface moves here.
