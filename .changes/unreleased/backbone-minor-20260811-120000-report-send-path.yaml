component: backbone
kind: minor
custom:
  category: Added
body: >
  The report channel's send path is API-primary (#662, from #660's dogfood
  inventory; first slice #659): with `gh` authenticated, the full send
  payload is shown once and an explicit confirm — naming the target AND the
  posting identity ("posts as @<login> to <owner/repo>") — posts via `gh`,
  so a real scratchpad-backed note travels as the issue body and is never
  URL-embedded. The prefilled-URL form survives only without `gh` auth or
  behind an explicit `--url`, within a documented ~6000-char budget (beyond
  it GitHub's edge hard-fails the form with HTTP 414), and always warns that
  the browser's logged-in account authors the submit; `--open` opens a
  within-budget form directly. `--yes`/autonomy now STAGES the composed
  payload (compose-time redaction findings ride the stage header) under the
  gitignored `.pkit/scratchpad/.report-drafts/` and prints one line; the new
  interactive-only `pkit report submit <id>` lists, reviews, confirms,
  posts, stamps, and cleans up — ADR-047's asymmetry intact: `--yes` stages,
  never posts.
