component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `edit-issue` now scopes validation to the field(s) being edited (#583). It
  previously re-validated the whole issue state on every edit, so a title-only
  edit hard-rejected on an untouched body that predates the current body schema
  — a legacy issue could not take a clean title fix without a full body rewrite,
  and (before the `--force` crash fix) the escape hatch was unusable. A title-only
  edit now validates the new title but not the untouched body; a body-only edit
  validates the new body but not the untouched title; a body edit still validates
  the new body in full. No migration.
