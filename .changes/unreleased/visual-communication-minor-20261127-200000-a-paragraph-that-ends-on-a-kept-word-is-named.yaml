component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The check names a paragraph that a line feed ends on a word the language
  keeps off a line's end (DEC-075, #3116). The engine keeps such a word, in
  Czech a one-letter word or a short preposition, off the end of each line it
  breaks, but a line feed the content writes ends a paragraph, and no break
  carries the word across it. The check reads each paragraph of a text but its
  last, its runs joined, by the same rules the engine breaks lines by, and
  reports `kept-word-ends-paragraph` where the paragraph's last word, with
  nothing after it but spaces, is such a word. The finding asks the piece's
  author for attention and never fails. It lies in the content file of the
  scene's language, at the key path of the run whose text holds the word, and
  its fix moves the line feed before the word or rewords the paragraph's end.
  No file a project holds changes meaning.
