component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit refs rot` reads a link's target from the folder of the file that holds
  the link, so a relative link whose file is there is no longer listed as
  missing (#2465). It reads any other path from the project's root, or from
  the citing file's folder where the path opens with `./` or `../`. In a
  capability's agent or skill it also finds such a path beside the file or in
  the capability's root, where the reference graph reads a capability's own
  paths. The section after a `#` is left out of the check. The
  `migration-author` skill no longer declares that it reads `.pkit/VERSION`,
  which only the methodology's source holds, so a project `pkit init` makes
  reports no rotten reference. The command still reports and exits 0.
