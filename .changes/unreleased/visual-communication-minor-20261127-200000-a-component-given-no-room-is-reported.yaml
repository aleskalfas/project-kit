component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  The check reports a component placed below the top that gets a size of zero
  or less, whatever gives it (#3113, DEC-073). A component that asks for no
  width, or no height, takes what it is given there, and needs more than zero:
  an item of a list that shares its line whose gaps take the whole line or more,
  an item a stretch gives no size, or a component a part's formula such as
  `=:width - 2 * @space.4`, or a top's slot of pages, gives none, is now
  `gets-less`. So is a component whose own formula asks for less than zero,
  where it gets none. The message names what gave the size. The finding fails
  at the content where the size rests on what the content placed, such as a
  list given more items than its gaps leave room for, and otherwise lies in the
  component that gave the size, where a released version only asks for
  attention. A component that lies in one with no size there is not reported,
  unless a `cross-size` sizes it, nor are the top and a tie. The engine holds
  every size it computes for a frame at zero where it comes out below, the size
  a part's formula gives a box included, so no scene holds a frame below zero,
  and every formula that reads the part reads it so. A list of its items' own
  sizes asks for what their held sizes come to. A draft meets the check at its
  next render.
