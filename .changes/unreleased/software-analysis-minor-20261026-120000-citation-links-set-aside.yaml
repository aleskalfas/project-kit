component: software-analysis
kind: minor
custom:
  category: Changed
body: >
  The citation links `pkit analysis link` writes no longer flag what rests on
  the documents that hold them (#2064, software-analysis DEC-001 point 13).
  Each place of the analysis declares their form beside the term links' form,
  as the core's derived links (COR-050 point 5): a path to a file named by a
  record's id, or to a heading named by a rule's id. So a change that only
  adds, removes or re-points those links asks no answer, and `updated` on it
  alone is a bump. A word changed beside a link still asks. A link of that
  form written by hand is set aside too, whatever its words. The link of a
  citation in brackets, such as `[software-analysis:DEC-001]`, stays content,
  since the core reads no link whose words hold a bracket. The README's
  "Linking citations" says what a moved link asks.
