component: software-analysis
kind: major
custom:
  category: Changed
body: >
  `SAN` 2.0.0 accepts its twelve judgement rules, RS-SAN-003 to RS-SAN-014,
  together (#1727, software-analysis DEC-003 point 10 and DEC-005). They judge
  a use case's actors and goal, what each artefact's anchors name, a
  requirement against its records, the source of each goal, minimal
  guarantee and requirement, the domain concepts the glossary defines, what
  makes each precondition true, which other analyses an analysis names, the
  order of the domain-model views, one name for one concept, a step not built
  yet, and each use case's functional area and journey. RS-SAN-005 leaves a
  requirement's anchors on its `actors` and `refines` to the check that holds
  them, and RS-SAN-014 lets a journey rely on a use case of its own actor
  that the path does not take. Breaking: a rule set pinned at `SAN@1` is now
  behind its set, so no rule of `SAN` binds through it and `pkit validate`
  fails on the pin until you re-pin it at `SAN@2`. Moving the pin brings
  every artefact the rules bind on under them, and the rule-set reviewer
  judges each break the rules' text settles as that change's. Mend the
  analysis first, or leave part of it out of your set's scope until it is
  mended, as the README's "Moving your pin" says. No migration ships: only
  the project can review its analysis against the new rules.
