kind: none
body: >
  DEC-017 decides what the accepted records leave open of a piece's
  final and published states: what marking final does with a version the piece
  changed after, what the check reads of a final piece, which commands write
  one, the moves between states, a current copy left behind, removing a piece,
  and the writers, and DEC-002, DEC-003, DEC-005, DEC-006 and DEC-016 state in
  place what it decides of them (#2699). The records design ahead: later pull
  requests build it, so no surface moves yet.
