component: backbone
kind: minor
custom:
  category: Added
body: >
  New `pkit report bug` / `pkit report feedback` — the built-in adopter→project-kit
  feedback channel (#613, PRJ-008 / ADR-047). Composes a bug or freeform-feedback
  report with a **redacted** environment block (pkit + capability versions, adapter,
  OS/arch — no filesystem paths; incubated capability names withheld unless
  `--include-private`) and prints a **prefilled GitHub new-issue URL** — the
  URL-first path works with no `gh` auth (the browser submit is the review gate).
  An opt-in `--file` posts via `gh` after an interactive **target-naming confirm**,
  degrading to the URL when `gh` isn't authenticated or under `--yes` (the foreign
  write is never auto-posted — the deliberate `--yes` asymmetry, ADR-047).
  `--on-behalf-of @login` attributes a report filed for someone else. `pkit report`
  (no subcommand) lists your reports + states, and `pkit report show <N>` adds the
  maintainer comments and the `## Tracked by` rollup (the issues that will fix it,
  with each one's state); `pkit report --tree` nests each report's tracked-by fixes
  under it. The maintainer side (`inbox` / `link`) lands in a later increment of #613.
