component: project-management
kind: minor
custom:
  category: Changed
body: >
  A native sub-issue that lives in another repository is now read as that
  issue, not as this repository's issue of the same number (#1308). The close
  gate took such a child for the local issue numbered like it and folded that
  issue's state — or a pull request's. It now holds its container like any
  other child, its state read in its own repository by open/closed alone
  (nothing is written there): closed counts as done, open holds, and one the
  container's sub-issue list names but that cannot be read leaves the
  container held. A sub-issue GitHub leaves out of that list — one in a
  repository the reader cannot see — is not seen at all, and the container can
  close over it. So a container may now hold where it closed — its child
  elsewhere is open while the local issue of that number was closed — or close
  where it held — its child elsewhere is closed while that local issue was
  open. Each listed sub-issue is placed by comparing the repository it names
  with this repository's own name: one naming this repository is this
  repository's issue, whatever else its entry lacks. A repository name or an
  issue number spelled other than GitHub spells one is unreadable, and holds
  the container. The subject id `owner/repo#<n>` is new: `cascade-members`
  lists such a child under it, so `pkit process cascade` reasons name it
  (`member 'owner/repo#<n>'`), and `detect-state` and `cascade-membership`
  accept it as their subject. `show-tree` shows such a child as a leaf under
  its parent, `owner/repo#<n>` marked `[in another repository]`, with no
  state, its JSON gains `children_in_other_repositories` (`ref`, `repository`,
  `number`) beside `children`, and `--refresh-children-views` refreshes a
  parent whose only children are elsewhere, as `create-issue` and
  `link-parent` already did. The textual children view writes such a child as
  `owner/repo#<n>` in a code span, which GitHub does not link, so the view
  leaves nothing on that issue's timeline. `close-issue <N>
  --mode=cascade-eligibility-close` now says what holds a container, from its
  own read of the children and the engine's word for a read only the engine
  made (a members list or a candidate's membership it could not read): open
  children, each named — one elsewhere with its
  repository — with what releases the container, for a child elsewhere its
  closing there or the removal of its link in this repository by the command
  the refusal prints (`gh api -X DELETE repos/{owner}/{repo}/issues/<N>/sub_issue
  -F sub_issue_id=<id>`, filled in, never run by pm); children that could not
  be read, each with the read that failed — one elsewhere with its two ways
  out, made readable or unlinked, any other with the advice to re-run once
  `gh` is reachable, which appears only then; both, each block with its own
  remedy; and, where it finds neither, the engine's reason under a header that
  claims no cause.
