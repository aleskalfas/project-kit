component: claude-code
kind: minor
custom:
  category: Added
body: >
  The adapter declares how far Claude Code meets each harness requirement, in
  the new `harness-support.yaml` (COR-047 point 2). It answers
  `delegated-result-complete` at a cost, for every version: a helper's result
  arrives whole unless the agent-teams feature is on and the helper was
  dispatched with a name. It answers `unattended-confined-run` at a cost, for
  no version yet: the bound is the confined runner's tested range, empty until
  the probe passes. The README's "Harness support" says the same in prose.
