component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual check` reads a final piece's files and its lock, and no more
  (#2757): the binding of each file and what its lock names, with no scene,
  findings record, content, id, notation, brand or produced picture. A version
  its lock names that no longer matches what was released fails once, in a run
  on the piece alone too. A finding at a final piece's lock fails only where
  something other than a move of the lock mends it, and states a fact otherwise,
  and the fix each lock finding names fits the piece's state. A new finding,
  `lock-not-released`, fails a published piece on a version not yet released,
  and sorts a final piece's by whose release mends it. `pkit visual export`
  refuses such a published piece, and `pkit visual look` still draws it. The
  summary counts a final piece. `pkit visual render` and `pkit visual status`
  tell a final piece with no lock to write back the lock of the version handed
  out, since no state leads out of final.
