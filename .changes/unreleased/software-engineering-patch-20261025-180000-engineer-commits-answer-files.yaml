component: software-engineering
kind: patch
custom:
  category: Changed
body: >
  The software engineer commits what the friction writers write with its
  change, a new answer file among it, and no longer owes an answer after
  resolving a conflict in an artefact's block. Where the change check flags
  one of its revalidations as replacing revalidations answered apart, it makes
  that revalidation's reason judge their combined state (COR-062 points 1
  and 7).
