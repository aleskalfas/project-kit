body: >
  DEC-002 accepted: a code-review panel ships from software-engineering
  (code-reviewer + security-reviewer + docs-reviewer), registered via the
  reviewer-contribution socket and gating code-carrying PRs through the
  existing all-must-approve gate (closes #715). Design-ahead (`none`): the
  record fixes the panel, its home, and its per-agent block-threshold
  discipline; no adopter-observable surface changes until the implementing
  tasks land under EPIC #725, each carrying its own changeset.
