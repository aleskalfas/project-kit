component: project-management
kind: patch
custom:
  category: Fixed
body: >
  Where `gh.default_owner` is unset, as a single-owner adopter whose board
  lives in the repository's owner leaves it, `set-field` finds the board under
  the repository's owner, which the issue's url names. It read the board with
  no owner, so `gh` looked among the boards of whoever ran it, and an
  organisation's board was not found. Its refusal for an issue with no card now
  names that owner in the `gh project item-add` command it gives.
