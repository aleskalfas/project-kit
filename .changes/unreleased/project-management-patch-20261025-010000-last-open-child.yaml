component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The closure cascade that ends every `close-issue` mode reports a parent
  eligible to close only once its last open child has closed (#1937). It read
  the parent's checkboxes alone, and said "eligible to close pending sibling
  check" while a sibling was still open. It now reads the process engine's fold
  over the parent's children (`pkit process cascade`), as
  `--mode=cascade-eligibility-close` does. A parent with no open child left and
  every box ticked is reported eligible, with the `close-issue <P>
  --mode=cascade-eligibility-close` command that closes it. A parent with an
  open child is reported not eligible, each open child named. Where the fold
  cannot be read, the report says whether a child is open is not known, and the
  parent is not reported eligible.
