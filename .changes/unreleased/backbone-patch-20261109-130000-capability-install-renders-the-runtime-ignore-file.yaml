component: backbone
kind: patch
custom:
  category: Fixed
body: >
  A capability's install writes the ignore lines it declares, so the next sync
  changes no tracked file (#2367). `pkit capabilities install` and `register`
  render `.pkit/.gitignore` after deploying the capability, as `pkit sync` and
  `pkit capabilities upgrade` do. `pkit capabilities uninstall` renders it
  without the removed capability's lines. Before, each left the file as it was
  until the next `pkit sync`, which then changed it: project-management's line
  `capabilities/project-management/project/instance/*.json` arrived only then.
  The CLI reference says so.
