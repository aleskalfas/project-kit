body: >
  Placeholder segment, for the maintainer to judge (#1421). The capability's
  records whose points were a numbered list, or paragraphs opening with a
  bold number or label, write each point as a heading carrying its number or
  label, word for word: DEC-033, DEC-036, DEC-038, DEC-041, DEC-043 to
  DEC-048 and DEC-053 to DEC-055. No point's text, number or citation
  changes. DEC-035, DEC-039, DEC-040, DEC-049, DEC-050 and DEC-051 stay in
  list form until the text after their last point is placed.
