component: visual-communication
kind: none
body: >
  Design-ahead: visual-communication DEC-043 decides that the part that draws
  a list of ties may declare a trunk at one of its end fields, so that the
  ties meeting one side of an item, where they draw alike, meet it at one
  point and branch off the tie that reaches least far. It gives a line two
  measures for the middle of the stretch it alone runs. A group with no room,
  for its lines or for a part placed by those measures, or whose declaration
  would add a crossing, is drawn spread with the side's other ends. The check
  finds a part a tie's component places otherwise on a stretch the tie
  shares, or centred on another line of its group. It is record text only,
  and nothing you run changes. The build carries the real changeset.
