component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit init` and `pkit sync` say when the session they run in will not load
  what they write (#3005). Where the harness names the session's project
  folder, as Claude Code does in `CLAUDE_PROJECT_DIR`, and that folder is not
  the root they wrote to, each ends with a warning naming both folders. It says
  that the harness will not load the settings, agents and rules they write
  there until a session starts at the root. That is the case of a repository
  cloned into a folder below the one the session started in. Outside any
  session, or in one started at the root, they say nothing more. `pkit init`'s
  recommended next steps now end with a new session at the project's root,
  which loads the settings, agents and rules it wrote.
