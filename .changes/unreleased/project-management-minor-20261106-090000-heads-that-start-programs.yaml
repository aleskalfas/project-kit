component: project-management
kind: minor
requires_backbone: release
custom:
  category: Changed
body: >
  `land-work`, `review-work` and the merge check start a pull request head's
  programs only for a head on the base's own repository that holds no sandboxed
  build's commits, or one a person at a terminal names for that run
  (DEC-067). Any other head, a fork's above all, starts nothing, and no flag
  changes that. Its change check reads git objects alone, and where that needs
  a resolver the person at a terminal is asked. With nobody there `land-work`
  merges nothing and exits 9, a new code that asks a person to act, and
  `review-work` stops with exit 2. `review-pr` tells the reviewers of such a
  head to start nothing, and two open pull requests sharing a branch's name
  stop these commands. The merge check now reads git objects first for every
  head. `open-pr` takes no temporary checkout for any head. These commands,
  `show-pr`, `done-work`, `merge-pr`, the documentation check, and `move-issue`
  and `close-issue`, which two of them run, print text from outside them with
  control characters escaped. The other commands' output waits for a sweep
  (#2718).
