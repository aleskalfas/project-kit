component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit refs rot` no longer reads a `PRJ-` or `ADR-` id that a record the
  project receives by sync cites as a record of the project (#2484). Such a
  record, a core record in an adopter's project among them, is authored in
  another repository, and the id names that repository's record. So a project
  whose own PRJ-001 is proposed no longer sees COR-021 listed as an accepted
  record that cites a proposed one. The project's own records are read as
  before, and in the methodology's source every record is.
