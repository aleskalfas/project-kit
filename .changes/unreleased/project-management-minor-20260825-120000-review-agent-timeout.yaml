component: project-management
kind: minor
custom:
  category: Changed
  pr: "768"
body: >
  `review-pr`'s per-agent reviewer timeout is now configurable and its default
  is raised from 300s to 1200s (#766). The default is a generous ceiling, not a
  typical wait: reviewer agent runs are slow and variable (observed 300s to
  >600s on the same reviewer), so 1200s is meant to be hit only by a genuinely
  hung agent. The old hardcoded 300s silently killed heavier reviewers out of
  the box (e.g. `code-reviewer` needs ~323s), and an interim 600s still timed
  `code-reviewer` out on a real panel review. The timeout is a single uniform
  knob applied to every reviewer — deliberately not a per-agent map (COR-007).
  Resolution precedence: the new `--timeout <seconds>` flag > the
  `PKIT_REVIEW_AGENT_TIMEOUT` env var > the default 1200. A non-integer, zero,
  or negative value is a usage error (fail fast) rather than a silent fall-back.
