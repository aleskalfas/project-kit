component: visual-communication
kind: minor
body: >
  `pkit visual look <piece> --forced-colours` also draws each page file of the
  HTML renderer as a reader who forces their own colours sees it
  (visual-communication DEC-027, #2847). A second browser start, under Chrome's
  `--force-high-contrast`, draws each file in the browser's light and dark
  forced palettes; each palette shows the key the file holds for its signals.
  Their images lie in `forced-light/` and `forced-dark/` in the HTML
  renderer's folder, and the report names the palette in a `forced` field of
  each image and entry, and the palettes, flag and what they do not show in its
  own `forced`. That start's first read stops a run where the palette did not
  reach the text. The flag is refused through the SVG renderer. `pkit visual
  pages` names the forced palettes, and the reviewer reads the forced images.
