body: >
  DEC-060 points 2 and 5 point to the new record software-engineering DEC-004.
  Where software-engineering is installed, and its conventions corpus offers
  a location the project owns, a walking skeleton's conventions are drafted
  into that corpus, and a person accepts them before code builds on them. A refinement of the record only, so no command or skill
  changes.
