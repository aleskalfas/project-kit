component: project-management
kind: none
body: >
  DEC-060 points 2 and 5 point to the new record software-engineering DEC-004.
  Where software-engineering is installed, and the conventions corpus it reads
  offers a location the project owns, a walking skeleton's conventions are
  written into that corpus in the skeleton's change. A person accepts them
  with that change, apart from authorising its merge, and the change merges
  only once they are accepted, before the slices are planned. DEC-060 binds
  every builder and whoever lands the change to this, with a reason of its
  own, and names how the landing holds such a change as open. The record
  changes, and no command or skill does.
