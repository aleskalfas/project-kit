component: project-management
kind: minor
custom:
  category: Fixed
body: >
  `done-work` now runs the DEC-007 checkbox close-gate as a pre-flight, closing
  the hole where the PR-merge path — the route every completed Task travels —
  merged without ever checking the closing issue's checkboxes (#734). The check
  happens BEFORE the squash-merge is authorised, which is the only place it can:
  GitHub's `Closes #N` auto-closes the issue on merge, so a check afterwards
  could only report a gate it had already let through. An unticked box refuses
  with exit 1, listing each unticked line and naming the remedy, and no merge is
  attempted; an issue with every box ticked, or with no checkboxes at all, merges
  exactly as before; an issue body that could not be read fails closed, since an
  unverifiable gate is not a satisfied one and the merge it guards is
  irreversible. `--skip-checkbox-gate` overrides it — discouraged, and
  deliberately the same flag name and semantics `close-issue` already carries so
  the two closure paths behave alike; the general `--bypass` does not clear it,
  matching how `--bypass` never clears a red CI. The rule itself now has ONE
  implementation (`scripts/_lib/checkbox_gate.py`) read by `close-issue`,
  `done-work`, `merge-pr` and the engine's `gate-checkboxes-ticked` predicate
  alike, replacing the four separate copies that could drift on what counts as
  an unticked box. The `review → done` transition's notes and that predicate's
  docstring now describe where the check actually runs, rather than the wiring
  that was only ever aspirational.
