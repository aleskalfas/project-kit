component: software-analysis
kind: minor
custom:
  category: Changed
body: >
  RS-SAN-008 lets a pronoun or a shortened name in a domain-model view point
  back to the term the heading of its section names (#2695). Before, it stood
  only where the same part already named the term, so "It" or "the gate" under
  a heading "Merge gate" broke the rule though nobody would misread it. The
  rule only loosens, so `SAN` stays at 2.0.0 and no pin moves. Use cases,
  journeys and requirements keep the rule as it stood.
