component: claude-code
kind: none
body: >
  Internal. The adapter ships `probe-messaging.py`, a script a person runs
  to measure what Claude Code's messaging between sessions does, as
  project-management DEC-081 and DEC-084 ask before their build rests
  anything on it, and what a command can read of a process's space and start
  time inside and outside the sandbox, as ADR-103 asks before the backbone's
  reading of a recorded process is built. It starts real sessions and refuses
  inside an agent's run. Nothing the adapter runs on an adopter's behalf
  changes.
