kind: none
body: >
  The capability's records state their refinements as fact: DEC-005, DEC-006,
  DEC-009, DEC-014, DEC-026, DEC-035, DEC-041, DEC-047, DEC-049 and DEC-050 fold
  their amendment and refinement blocks into the points they refine, with
  forward refinement pointers, and DEC-033's top line says DEC-034 partially
  supersedes it. The records, the README, the scripts, the schemas and the
  tests that named one of them as amended cite the point that holds the
  content, and the citations of DEC-043's points name them by their numbers. No
  claim is added, dropped or changed, and the capability's behaviour is
  unchanged.
