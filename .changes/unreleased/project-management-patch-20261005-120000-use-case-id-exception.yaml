component: project-management
kind: patch
custom:
  category: Changed
body: >
  The use-case point's contract for its filler (DEC-054 point 2) states its
  one exception: an id, once settled, names the same use case for good,
  unless the project declares that nothing cites it. The point's
  description, its companion schema and the README say so. The point stays
  at version 1: while the exception covers only ids nothing cites, no
  consumer breaks, and a citation of a withdrawn use case still passes.
