body: >
  DEC-064 points 3 and 4 and its Implications, and the pm skill's landing step,
  say that the change check's report of an outdated base names no remedy, as
  the backbone's report does (#2662; COR-050 point 12), where they spoke of the
  merge or rebase it advised. DEC-064 decides what it did, and no command or
  file an adopter uses behaves otherwise, so no surface moves.
