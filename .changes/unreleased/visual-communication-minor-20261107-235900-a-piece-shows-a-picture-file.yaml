component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A piece and a library show a picture file (#2856). An `image` part names
  exactly one of `produced`, `content` and `file`. `content` names a field
  whose text is the bare name of a picture file in the piece's new
  `pictures/` folder, so each language names its own, and an empty field draws
  nothing. `file` names a picture file of the component's own library version,
  the same in every mode and under every brand, or of the piece for a local
  component. Each name is found and judged as a brand's logo is, its finding
  in the content, the component or the file, and `pkit visual export` refuses
  a picture file that is missing or cannot be read. A picture is drawn whole,
  centred, as large as its frame allows, and an image with no height takes its
  proportions. The seam rises to 5: a renderer is handed the file each image
  shows in each language and combination, and its kind. The SVG renderer, at
  1.1.0, and the HTML renderer, at 1.2.0, come to draw a JPEG as JPEG data, and
  keep a picture's colour profile; `pkit visual look` names each picture with
  one. The PDF renderer still refuses every image. It breaks nothing an
  adopter holds: every file format 1 accepted reads and draws as before.
