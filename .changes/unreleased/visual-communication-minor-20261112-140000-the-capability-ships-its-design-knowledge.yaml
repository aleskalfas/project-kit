component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The capability ships its design knowledge (#2970), in
  `design-knowledge/`: an index, and a short file for each of six topics of
  the published practice of visual communication, each idea credited to its
  author and work. The topics are the message first, a form that says what
  the content says, hierarchy, type and grid, colour, and diagrams with
  consistency across a piece. It holds no rule, no value and no threshold.
  `graphic-design-reviewer` reads its index, then the topics its task needs,
  and a note of taste names the practice it draws on and the topic that
  teaches it (visual-communication DEC-030 point 8).
