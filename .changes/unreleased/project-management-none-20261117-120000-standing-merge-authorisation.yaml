component: project-management
kind: none
body: >
  DEC-080, proposed with this change (#3385), decides that a key in the
  project's configuration of this capability, which an install and an upgrade
  write on with the person's consent, authorises up front every merge whose
  review passes, and that the landing command merges such a pull request in
  the run that finds it ready, save where a person must see something first.
  No command, schema or migration changes until the record is accepted and
  built, so no surface moves.
