component: project-management
kind: none
body: >
  DEC-080, proposed with this change (#3385), decides that a key in the
  project's configuration of this capability authorises up front every merge
  whose review passes, and that the landing command merges such a pull request
  in the run that finds it ready, save where a person must see something
  first. In the human review mode it counts only a reviewer member's approval
  of the head it merges. A reviewer's finding for the person holds no such
  merge: it reaches the person after the merge, in the run's printout and an
  audit comment on the issue, its verdict linked from the pull request's body,
  and a label on the Task's issue keeps it among what waits on them until they
  judge it.
  An install and an upgrade write the key as an offer, which authorises
  nothing, and the person turns it on by authorising a change that sets it on.
  No command, schema, label or migration changes until the record is accepted
  and built, so no surface moves.
