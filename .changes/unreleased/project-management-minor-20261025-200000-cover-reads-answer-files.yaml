component: project-management
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  `land-work`'s cover of a later head reads version 2 of the backbone's
  `pkit friction since`, as DEC-055 point 3 decides. An authorisation for one
  head covers a later one where every change since lies in answer files the
  change adds, a clean merge of the base counting as none. An answer written
  in an artefact's block, or an answer file removed or rewritten, lies
  outside, so the run stops there. A backbone that answers version 1 gives no
  answer here, which is never read as covered.
