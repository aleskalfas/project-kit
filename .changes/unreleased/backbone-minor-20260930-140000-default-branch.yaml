component: backbone
kind: minor
custom:
  category: Added
body: >
  One meaning of the default branch for every reader of settled state (COR-054,
  #1128). The backbone configuration gains `repository.default-branch` — the
  branch the project's settled work lands on, declared once, `main` when
  absent — resolved as `origin/<name>` when that names a commit, else the local
  `<name>`, and reported with the fixes when neither does, never guessed. The
  friction change check's default base is now that branch — `--base`, else
  `$PKIT_CHECK_BASE`, else the default branch — where it used to be a fixed
  `origin/main`: in a clone without the remote's copy it compares with the
  local branch instead of refusing, and a project that declares another branch
  compares with it. `pkit friction artefacts` gains `--base <ref>` and two keys,
  `default_branch` (name, source, ref, commit) and `base` (ref, source, tip,
  fork, outdated, problem), with two lines in its human view, so a capability's
  script — a filler included — reads which commit is settled there and never
  resolves a base or computes a merge-base itself. A value that is not a
  branch name reads as `main` with a warning; `pkit validate` fails on it.
