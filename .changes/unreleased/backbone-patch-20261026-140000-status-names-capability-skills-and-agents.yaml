component: backbone
kind: patch
custom:
  category: Fixed
body: >
  `pkit status` lists each skill and agent under `.claude/` under where pkit
  deployed it from: core, each capability by name, then the project namespace
  (#2085). A capability's skills and agents, such as `pm` and `project-manager`,
  were listed as "user-managed (untouched by pkit)". Now only what the project
  added itself is listed as the project's own, which pkit does not deploy. A
  marked agent copy that nothing ships any longer is listed apart, as the next
  `pkit sync` removes it. The adapter section's labels change with it: `skills`
  and `agents`, each group reading `<n> deployed from <where>:`. No migration.
