component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  `pkit visual verdict` lapses the hold on a change to the capability's code or to its
  list of checks, as on a change to the rules' text, the reviewer's definition or the
  design knowledge (DEC-065, #3296). It compares two digests more with the accepted
  calibration's data: one of each program file in the capability's `scripts/` folder,
  where each check the review reads lies with the rest of the code, and one of the body
  of `checks.md`. So every change to the code lapses the hold, one that moves no grade
  included, while a compiled cache, a folder's marker, an editor's file or a change to
  the list's front matter lapses nothing. The accepted data's schema,
  `visual-communication:calibration`, requires the two digests, `code` and `checks`, and
  `--json` gives them in its `reading`. The capability ships no accepted data yet, so the
  verdict still informs.
