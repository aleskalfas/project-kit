component: backbone
kind: minor
custom:
  category: Security
body: >
  The permission decision core names the guardrails a deferred Bash command
  may hide, through `hidden_guardrails()` and, for a PreToolUse payload,
  `hook_hidden_guardrails()`. Each names the guardrails among the subject's
  denies that may bind on the command in a form the core cannot see, such as a
  pathname pattern or an assignment that changes the program's configuration,
  with what keeps the core from seeing it. An adapter whose harness may allow
  what the core defers asks the person about such a command (ADR-025 point 2).
  No verdict of `decide()` changes, and `hook_decide()` still returns it.
