component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `review-pr`, and the review step of `land-work`, start each reviewer in the
  project's root, whichever folder of the project the command is run in
  (#2255). Run from a folder below the root, they started the reviewers in
  that folder, where the harness takes none of the project's settings: in a
  run nobody watched, each call the project's settings allow needed an
  approval nobody could give, and a reviewer could request changes without
  judging the change.
