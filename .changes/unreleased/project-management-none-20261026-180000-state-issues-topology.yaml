component: project-management
kind: none
body: >
  Design-ahead: the records DEC-058 and DEC-059 decide how agents in their own
  clones share one project. Shared state that changes at run time lives in
  state issues, outside the work hierarchy. A topology of seats is committed
  configuration, and a clone takes a seat through its state issue. Workers take
  ready Tasks from one shared pool, and a Task's claim lapses once its work
  stops. DEC-059 partially supersedes DEC-035 and DEC-045, whose topology was
  kept per user, and refines them, DEC-029 and DEC-043 in place. No behaviour
  changes until the records are built.
