component: visual-communication
kind: minor
body: >
  `pkit visual before-after <piece>` draws each of a piece's pages under two
  locks, in the clone's local folder, and prints each page that differs
  (#2758). `--ahead` looks ahead, before a move: from the lock of the version
  that wrote a published piece's current copy to what a run would propose,
  with each newer version held back and why, or to the versions named, each
  `<library>@<version>`. A draft takes it only with versions named, which may
  include one not yet released, and a final piece finds its two locks one.
  `--back` looks back, at a change: from the lock at the base `pkit repository
  base` answers, or `--base <ref>`, to the lock the piece holds now. Both
  drawings take today's engine and one filling of an export's facts, so what
  differs is the locks'. The command says where the engine's release differs
  from the one the copy's version recorded, reports stale pictures and runs no
  program. A drawing it cannot make stops nothing.
