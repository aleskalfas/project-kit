component: backbone
kind: minor
custom:
  category: Added
body: >
  The backbone reads answer files in `.pkit/project/friction/answers/`, as
  COR-062 and ADR-068 decide, and nothing writes one yet. Their schema ships
  as `.pkit/schemas/backbone/friction-answers.schema.json`, bound by its
  location. `pkit friction check --all`, `debt` and `explain` read an
  artefact whose block holds no answer from the answer files: the live
  answers, each value's point across both homes. Two revalidations made
  apart are a new finding, `answered-apart`, which is debt, never stale and
  never failed. The JSON documents gain each artefact's live answers with
  their points, the folder's path, and the count of files a prune would
  remove. No place reads a file in the folder, and no anchor stands on an
  answer file. `pkit validate` checks the answer files. A project with no
  answer file reads as before.
