component: software-analysis
kind: minor
custom:
  category: Added
body: >
  Every mention of an analysis artefact by its id now links to it, as DEC-001
  point 13 decides (#2109). In every analysis, a domain model or none,
  `pkit analysis link` links the first mention of each artefact's id in each
  section: a use case, a journey, a requirement, an actor or a view to its
  file, and a term to its glossary entry, by a path from the file. A bold
  label is read, so a journey's seams and a precondition's producers link
  their ids inside the bold, and each step line of a journey links its use
  case's id. An id alone names an artefact of its own analysis, in force or
  withdrawn, and `core:UC-021` one of an analysis yours builds on. Code, a
  goal, an actor's first sentence and an artefact's own id stay plain.
  Whatever any rule's status, `pkit analysis validate` reports such a link
  missing, extra or stale and names the command, so each analysis that
  names an id fails validation until you run `pkit analysis link` once. The
  forms of a journey's steps and seams and of a precondition's producers,
  and `pkit analysis check-numbers`, read a linked id as the id. Each place
  declares the links' form, so a change that only moves them asks no
  answer. The shipped example of a use case's other actors names its id
  plain. DEC-001 and DEC-004 point 7 are refined in place.
