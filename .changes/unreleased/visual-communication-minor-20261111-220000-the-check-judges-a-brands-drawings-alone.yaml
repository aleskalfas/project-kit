component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The check of a brand's version alone judges the forms the brand draws (#3018,
  DEC-009 point 9, DEC-034 points 8 and 10). It fails a drawing of a top whose
  library the brand does not name (`drawing-unnamed`), and each of two drawings
  of one layout (`drawing-twice`). It asks the brand's owner for attention,
  never failing, where a drawing does not take a field, a word of an option or of
  a field of runs, or an exposed part its top declares (`drawing-lacks`), and
  where a brand the brand builds on serves the drawing's top, to take the drawing
  out (`drawing-base-serves`). The version states each top the brand serves, with
  the layouts it leaves to the top's own drawing (`brand-serves`). In a brand's
  drawing, a switch that leaves out a word of its top's option or field of runs,
  and a part that passes a field of runs on, no longer fail: the drawing takes no
  such word, and none of that field's runs, so the top's own drawing draws each
  instance that gives one. A drawing's clash with a list's default component lies
  at the part's `draw`, and a brand's release now judges its patterns and its
  drawings against their lists' default components, and the forms it draws, as
  its check alone does. A brand that holds a drawing of a top of a library it
  does not name, or two drawings of one layout, now fails where it passed before.
