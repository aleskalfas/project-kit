component: backbone
kind: none
body: >
  The permissions README becomes a reference for the agents that act on the
  permission model. It opens with a one-line purpose and a link to the
  model's guide, then holds the contract: grants and verdicts, profiles,
  privileges and how they are recognized, subject resolution, compound
  commands, the forms a deny holds against, scopes, the agent workspace,
  capability fragments, the rules of an agent run and the diagnostic loop.
  Why the model exists and how people turn it on move to a guide that does
  not ship. Every heading address other text names is kept. Nothing the
  backbone ships or runs changes.
