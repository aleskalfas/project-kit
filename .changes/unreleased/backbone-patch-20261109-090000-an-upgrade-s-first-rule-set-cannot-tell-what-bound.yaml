component: backbone
kind: patch
custom:
  category: Fixed
body: >
  An upgrade from a version before core's rule set no longer lists every rule
  of `OPS` as newly binding (#2369). Such a project held no rule set, and its
  sessions loaded `.pkit/rules/core.md` as a plain file, whose rules carry no
  ids to compare by. The upgrade now says it cannot tell which of the set's
  rules bound before, and why, and lists each rule the set holds after
  `holds`, none after `binds`. The lifecycle and CLI references, and the rules
  guide, say so.
