component: backbone
kind: minor
custom:
  category: Changed
body: >
  `pkit init` now tells you where it will install before it does, and asks first
  when that target isn't your current folder (#780). Every run announces the
  resolved target and why it was picked, plus any existing project-kit install it
  finds between your current directory and that target. When the target is a
  parent directory (a git repository root above you) or a fresh non-git folder,
  init asks for confirmation on an interactive terminal and refuses on a
  non-interactive one (an absent or closed stdin counts as non-interactive) — a
  piped `yes |` no longer silently installs somewhere you did not expect.
  Declining the prompt exits non-zero, so a chained `pkit init && …` stops. If
  the target already has a project-kit install, init refuses (non-zero) and
  points you at `pkit sync` to refresh it; a leftover `.pkit` there that is not
  an install is refused too, naming what is wrong and asking you to move it
  aside — both before any prompt. Every refusal's suggested remedy is one the
  same command accepts. A new `--here` installs into the current directory
  (refused when it is a subfolder of a git worktree, where a `.pkit/` there
  would be unreachable, or sits inside an existing project-kit project, where it
  would nest a second install), and `--yes` accepts the offer to install in a
  fresh non-git current folder non-interactively; `--dry-run` previews without
  prompting, but every refusal still applies.
