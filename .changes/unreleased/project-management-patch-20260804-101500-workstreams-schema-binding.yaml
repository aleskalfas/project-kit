component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `pkit data validate` now resolves the capability's seeded
  `project/workstreams.yaml` instead of reporting "no schema binding found"
  (#585). The capability shipped only `workstreams.schema.json` with no
  `schemas/workstreams.yaml`, so neither the `pkit_schema:` field path (the
  resolver requires the `<schema>.yaml` + `.schema.json` pair to exist) nor a
  `binds_to:` glob (read only from `schemas/*.yaml`) could bind the file. Ship a
  `schemas/workstreams.yaml` binding carrier declaring `binds_to: ["**/workstreams.yaml"]`
  (mirroring the instance-ownership / substrate-map schemas), let the companion
  accept the `binds_to` / `pkit_schema` fields, and add the self-describing
  `pkit_schema: project-management:workstreams` tag to the seed. No behaviour
  change to how workstreams are read; no migration.
