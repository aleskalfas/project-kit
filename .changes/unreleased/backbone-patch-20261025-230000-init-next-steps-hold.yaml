component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The next steps `pkit init` prints now hold for the project it set up
  (#2083). It leaves out the install of pkit where a `pkit` is installed on
  the PATH already. A `pkit` that `uv run` or `uvx` puts there for one run does
  not count. It names no capability's configuration, since first install
  installs no capability, and names the `.claude/settings.json.pre-pkit` backup
  only where it made one. The `.gitignore` step says why the lines are left to
  the project: pkit never writes the project's own `.gitignore` (ADR-009). The
  steps are numbered in order whichever are printed.
