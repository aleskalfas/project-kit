component: backbone
kind: major
custom:
  category: Changed
body: >
  Your project's answers to friction move out of the artefacts' blocks into
  answer files, once, as COR-062 point 11 decides. **The upgrade to 2.0.0
  makes the move:** the backbone migration
  `2.0.0/002-move-answers-to-files.sh` takes each artefact's `revalidated`
  block and `revisited` list out of its front matter into a
  `moved-<hash>.yaml` file in `.pkit/project/friction/answers/`, every other
  byte kept and each value keeping its revalidation point. It leaves what
  your project receives by sync, writes over no answer file, and writes
  nothing when run again. The change check lists each moved answer apart,
  and asks nobody to accept it. **From then on an answer left in a block
  fails `pkit validate`**, naming the move. Where no answer file exists,
  one error says your answers have not moved. In a file your project
  receives by sync it is only reported. **A branch open at the move** that
  answered in a block conflicts with it, or merges cleanly where the block
  held no answer before. It catches up by merging the default branch in and
  running the move again from the project's root, `ROOT=. bash
  .pkit/migrations/backbone/2.0.0/002-move-answers-to-files.sh`, which takes
  its answer out into a new moved file. **`pkit friction since`** now
  answers whether every change since a commit lies in answer files the
  change adds, which the base where the head left it does not hold. Its
  `--json` document goes to `schema_version` 2, and a reader of version 1
  refuses it. An answer written in a block lies outside.
