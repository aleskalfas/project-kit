component: project-management
kind: patch
custom:
  category: Fixed
body: >
  `merge-pr` refuses to merge a pull request whose checks it cannot read
  (#1952), as `done-work` does since #1946. A `statusCheckRollup` that the
  answer from GitHub leaves out or carries as null was read as a rollup of
  no checks, and passed the CI-status gate. Now it refuses with exit 2,
  names the cause and writes nothing, and `--bypass-ci` does not clear it.
  An answer that is not a pull request's JSON is said, rather than refused
  in silence. A rollup GitHub answers with no checks, as for a project that
  runs none, still passes, and the run now says
  `ci-status: green (no checks configured)`.
