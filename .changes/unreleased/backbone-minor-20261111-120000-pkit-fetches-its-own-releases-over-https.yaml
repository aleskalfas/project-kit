component: backbone
kind: minor
custom:
  category: Changed
body: >
  Every fetch pkit makes of its own releases goes over the repository's public
  HTTPS URL, `git+https://github.com/aleskalfas/project-kit.git`, which needs no
  SSH key and no token (PRJ-015, ADR-090, #3002). The URL compiled into the tool is now
  that one, for the upgrade's lookup of the latest release and its install of
  the tool, the router's run of a pinned version and the raise of a pin. No such
  fetch waits at a terminal for a credential. Each fetch, and each probe of a
  release, runs with git's terminal prompt off. The raise of a pin now probes
  its target before it runs it, so a target it cannot fetch runs nothing and
  leaves the pin as it was. `pkit init`, the CLI reference and every install
  line the tool prints give the HTTPS form. uv caches each URL apart, so each
  pinned version is fetched and built once more, from the new URL, the first
  time a project runs it. A tool installed over SSH stays until its next tool
  step installs it over HTTPS. A machine that reaches github.com over SSH alone
  configures its own git and uv to send these fetches over SSH, such as by
  git's `url.<base>.insteadOf`. A new script in the CLI area,
  `.pkit/cli/install-pkit.sh`, installs a fresh clone's pkit with nobody at the
  keyboard. Run as `sh .pkit/cli/install-pkit.sh`, it installs the version the
  project pins, or else the backbone version its manifest records, never
  `latest`, and only where it finds no pkit installed. It succeeds only where
  the project's own `pkit` then reports that version. In a project's clone the
  in-tree dispatcher names the script where it named an install of `latest`. A
  project pinned below this release, on a machine with no SSH key, raises its
  pin with `PKIT_NO_ROUTE=1 pkit pin <version>`, run by a pkit of this release
  or later.
