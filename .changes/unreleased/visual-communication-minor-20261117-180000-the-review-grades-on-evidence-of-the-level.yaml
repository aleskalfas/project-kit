component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  The graphic-design review grades a rule professional only on evidence of
  that level (#3396): before it grades a rule professional it names the
  strongest weakness the rule's own words fail on. A break the rule's text
  settles is below professional. A weakness the text leaves to judgment holds
  the grade below professional only where a reader meets it and a professional
  would not hand the page over without mending it. Where a professional would
  polish it, the grade stays professional, and its evidence names it. A doubt
  stays a note, and moves no grade. Before excellent it names what makes the
  page an example. A fault that cites no rule moves no grade. A weakness of
  design that is no fault lowers each rule whose own words fail on it, by that
  condition, as a fault holds the grade of each rule whose words name it, and
  is described once, in the finding of the first rule by id that it lowers. A
  grade judges the page a reader meets, wherever the cause lies, and a grade
  only a tool the engine lacks would raise is marked a need. Where a page's
  part of the brief gives no relation and no takeaway, a path that does not
  follow its statement, its lead or its title where it has no lead, is filed
  as for a piece with no brief. The reviewer's steps for the rules on the
  focal point, the form and the pages' order point to the design knowledge's
  topics, which gain Minto's deductive order, Duarte's shape of a story,
  Wathan and Schoger's ranking of a page's actions, and a question on whether
  the facts that matter most take the variables read most accurately. The
  designer ranks a page's head, its focal point and the action it asks above
  the rest. Five rules are reworded, with the new record DEC-068 as their
  origin: `RS-GRAPHIC-001`, one focal point: a page's head, its focal point
  and the action it asks of its reader stand above the rest, in any order
  among them. `RS-GRAPHIC-003`, nothing extra: it says what decoration and a
  page's frame are, and judges the frame as any part. `RS-GRAPHIC-007`, the
  form says what the content says: the strongest difference goes to what the
  point is about, or to the action the page asks. `RS-COMM-001`, a page makes
  one point, and shows it: it defines a page's title and its lead, and, by
  their kind, the pages whose job is not to make a point, such as a cover, an
  agenda or a section's opening page, which it does not judge, and a page
  whose title states its point needs no lead. `RS-COMM-003`, the pages tell the story in order: each page's lead, or
  its title, keeps one of five named orders, and a page whose job is not to
  make a point stands where its kind does. So `GRAPHIC` rises to 3.0.0 and
  `COMM` to 2.0.0, new majors. A project's set that inherits an earlier major
  of `GRAPHIC`, or `visual-communication:COMM@1`, fails validation, and no
  rule of that set binds through it, until the project reads again
  `RS-GRAPHIC-008` and the five reworded rules, in `rule-sets/graphic.md` and
  `rule-sets/comm.md`, and moves its pins to `GRAPHIC@3` and `COMM@2`. A bar
  that names an earlier major of `GRAPHIC`, `COMM@1`, or a rule of either set
  at such a major fails the capability's check (`bar-major`) until the project
  names the new major in the configuration's `bar`. No migration moves a pin
  or a bar, since the project's own reading of the rules is what each waits
  for.
