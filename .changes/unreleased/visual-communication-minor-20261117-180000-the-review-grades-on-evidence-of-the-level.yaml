component: visual-communication
kind: minor
custom:
  category: Changed
body: >
  The graphic-design review grades a rule professional only on evidence of
  that level (#3396): before it grades a rule professional it names the
  strongest weakness the rule's own words fail on. A break the rule's text
  settles is below professional. A weakness the text leaves to judgment holds
  the grade below professional only where a reader meets it and a
  professional would not hand the page over without mending it. Where a
  professional would polish it, the grade stays professional, and its
  evidence names it. A doubt stays a note, and moves no grade. Before
  excellent it names what makes the page an example. A fault that cites no
  rule moves no grade. A weakness of design that is no fault lowers each rule
  whose own words fail on it, as a fault holds the grade of each rule whose
  words name it, and is described once, in the finding of the first rule by
  id that it lowers; each other rule it lowers takes a finding that names it.
  A grade judges the page a reader meets, wherever the cause lies, and a
  grade only a tool the engine lacks would raise is marked a need. Where a
  page's part of the brief gives no relation and no takeaway, a path that does
  not follow its lead is filed as for a piece with no brief. The reviewer's
  steps for the rules on the focal point (`RS-GRAPHIC-001`), the form
  (`RS-GRAPHIC-007`) and the pages' order (`RS-COMM-003`) point to the design
  knowledge's topics, which gain Minto's deductive order, Duarte's movement
  between what is and what could be, and a question on which difference the
  eye reads best. The designer ranks what shows a page's point to be seen
  first apart from its title and its lead. Four rules are reworded, with the
  new record DEC-068 as their origin. `RS-GRAPHIC-001`: a page's focal point
  is what shows its point, and the rule ranks the page's content, its title,
  its lead, what shows the point and the rest. On a page with a title and a
  lead, nothing outranks them but what shows the point, or the action the
  page asks of its reader, such as a landing page's call to sign up; among
  the rest of the page what shows the point is seen first. A band or a ground
  that holds the title is judged with the title. A page's lead is read from
  its content alone, never from its layout's slots. On a page whose content
  gives no lead, the title is judged with the rest, and is the focal point
  itself only where it is the page's content, as on a cover, or states the
  page's takeaway. Where nothing beyond the title and the lead bears the point
  out, as on a statement slide, the two are the focal point. A page with no
  single point is one whose content states no point, such as an agenda. A
  group the content gives as one, or a list whose point is its order, may be
  the focal point as one, and no part is one by the order of reading alone,
  though a part's place gives it weight. A figure's caption is its lead only
  where the figure has a title. The page's frame is left out.
  `RS-GRAPHIC-003`: decoration is what carries none of the content, whether
  the piece or a component draws it; a part drawn louder than its job needs,
  such as a heavy grid or border, competes as decoration does; marking whose
  piece it is is part of a page's job; and the rule alone judges the page's
  frame, what a piece's layout or brand draws around the content of each
  page, by whether it competes with the content. `RS-GRAPHIC-007`: it counts
  every visual variable, and a reader takes a difference for meaning where it
  sets apart parts the content gives as alike; the strongest difference in
  the page's content, apart from its title and its lead, goes to what its
  point is about; it leaves the frame out, and leaves whether what shows the
  point is seen first to `RS-GRAPHIC-001`. `RS-COMM-003`: the leads, read with
  the titles of the section openers, keep one reasoned order in each group
  and through the sections: a deductive order, one of time, of structure or
  of rank, or a story's movement between what is and what could be. It breaks
  on a lead that cannot be understood without what a later page shows, on a
  lead whose place that order does not explain, and on a section whose place
  that order does not explain; a page with no lead, other than one that opens
  a section, such as a cover, an agenda or a closing page, is not judged by
  its place. So `GRAPHIC` rises to 3.0.0 and `COMM` to 2.0.0, new majors. A
  project's set that inherits `visual-communication:GRAPHIC@1` or
  `GRAPHIC@2`, or `visual-communication:COMM@1`, fails validation, and no
  rule of that set binds through it, until the project reads again
  `RS-GRAPHIC-008` and the four reworded rules, in `rule-sets/graphic.md` and
  `rule-sets/comm.md`, and moves its pins to `GRAPHIC@3` and `COMM@2`. A bar
  that names `GRAPHIC@1`, `GRAPHIC@2`, `COMM@1` or a rule of either set at
  such a major fails the capability's check (`bar-major`) until the project
  names the new major in the configuration's `bar`. No migration moves a pin
  or a bar, since the project's own reading of the rules is what each waits
  for.
