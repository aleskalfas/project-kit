component: software-analysis
kind: minor
custom:
  category: Added
body: >
  The new record software-analysis DEC-005 decides how a reader finds each
  function in an analysis (#2106), and partially supersedes DEC-001's
  optional grouping of use cases by area. Every use case lies in the
  functional area of the function it serves, cut by what the use cases do and
  never by how many there are. A journey tells each path one actor takes
  through several of its own use cases, and each concept leads back to what
  is built on it.
  **The skill.** The `analysis-author` skill plans the areas before the first
  use case, writes each use case with `--area`, and writes a journey for each
  path as part of building. DEC-001 point 12, DEC-002 point 3 and DEC-003
  point 8 name what the record adds.
  **The rule.** `SAN` gains `RS-SAN-014`, proposed, which judges where each
  use case lies and that a journey tells each path. Proposed rules bind
  nothing, so `SAN` stays at 1.0.0. The check of a use case in no area, and
  each area's journeys in the overview, are not built yet.
