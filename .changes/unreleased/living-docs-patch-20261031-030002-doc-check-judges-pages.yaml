component: living-docs
kind: patch
custom:
  category: Fixed
  requires_backbone: release
body: >
  `fill-doc-check`, the contribution to `pkit::work-tracking:doc-check`, has
  the whole-repository friction check judge the pages alone (#2365). It starts
  the check beside its other two readings with `--artefacts-from -`, hands it
  the pages once it knows them, and takes a check that judged anything else
  for no answer. On project-kit's own tree it judged 386 artefacts to read 24
  pages' state, about 15 seconds alone and over the 30 seconds `pkit validate`
  gives a component's command on some CI runners, failing pull requests with
  nothing wrong in them; it now takes about half that. The obligations are the
  same.
