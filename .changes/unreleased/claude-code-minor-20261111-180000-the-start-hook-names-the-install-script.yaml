component: claude-code
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  Where no `pkit` command is on the `PATH` it runs with, the start hook adds
  one line to the context of each session and subagent (#3005). The line names
  the install script the backbone ships, and says to run `sh
  .pkit/cli/install-pkit.sh` at the project's root to install the project's
  version. With a `pkit` on the `PATH`, the hook adds nothing. It only names
  the script, and never runs it. The adapter needs the backbone of this
  release, the first to ship the script.
