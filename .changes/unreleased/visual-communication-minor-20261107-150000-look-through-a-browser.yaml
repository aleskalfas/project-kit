component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual look <piece> --renderer html` draws the HTML renderer's pages
  through a browser of the Chromium family (#2785). A piece that declares `html`
  is read through it by default, any other through the SVG renderer, which draws
  what it drew before. Its images, frames, report and page files lie in a folder
  of their own, `look/<piece>.html/`, beside the SVG renderer's. The report names
  the renderer, for either renderer, and through a browser it names the browser
  and its version, each text whose words differ, each span with no face or in a
  font of the machine, and each request refused. The capability's configuration
  may name another browser under the new key `browser`. Where no browser runs, or
  one stops, the run leaves the page files and a report, and exits 3, a new exit.
  `pkit visual pages` names the renderer a run reads by default and each
  renderer's tool: its `--json` document holds `renderer` and `tools` in place of
  `tool`. `graphic-design-reviewer` reads either renderer's folder, other images
  a session hands it, and a folder a stop left.
