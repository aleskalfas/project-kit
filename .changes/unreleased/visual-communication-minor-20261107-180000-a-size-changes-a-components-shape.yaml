component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A component's shape can follow a size (#2798). A switch or a `when` reads a
  size axis by its marked name, as `{by: ":device", desktop: ..., phone: ...}`.
  Each names the axis's default, and a mode it leaves out takes that branch, so
  a new mode draws as the default does. A list changes direction on two
  `repeat` parts over it, a `row` and a `column`, each with a `when` by the
  size. A part a size hides has zero size at its place, and a value a size
  chose names `size:<axis>` as its source. Three new findings: `size-switch`
  and `size-repeat` fail in the component, and `size-hidden` states the content
  a size does not draw. The search for a draft's lock places the piece at each
  size key, and a held-back end names the key it is lost at. A component that
  reads no size, and every format-1 file, draws as before, byte for byte.
