component: software-analysis
kind: minor
custom:
  category: Added
body: >
  A use case and a journey carry the anchors DEC-001 point 4 gives them, so a
  change to an actor or a use case flags every artefact that rests on it
  (#1507). A use case lists each other actor who takes part in a new
  front-matter field, `other-actors`, and anchors to each beside its own
  actor. A journey lists each use case outside it that a step relies on in
  `relies-on`, which its schema now takes, and anchors to its actor and to the
  use cases of its `steps` and its `relies-on`. `pkit analysis new` writes
  both lists from `--other-actor` and `--relies-on`, each repeatable, and the
  anchors from them. `pkit analysis validate` resolves each to an actor or a
  use case of the analysis, in force for one in force, refuses a use case's own
  actor among its other actors and a journey's step among its `relies-on`,
  requires each actor anchor, and fails a journey whose use-case anchors differ
  from its `steps` and its `relies-on`. So a journey with a hand-over from a
  use case outside it can pass the check of its *Steps* once the format rule
  binds. The templates show both fields. A journey stamped before this change
  has no anchor to its actor, and `pkit analysis validate` now fails it,
  withdrawn ones included: add its actor to its artefact anchors.
