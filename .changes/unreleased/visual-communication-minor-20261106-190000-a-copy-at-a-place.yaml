component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A published piece may name a folder for its current copy, under `copy-place`
  in `piece.yaml` (#2761). `pkit visual export` writes the copy there, in place
  of the piece's folder, and the record of exports holds each file's path from
  the repository's root. It refuses a place outside the repository, one version
  control does not keep, one in the location or under `.pkit/`, and a path
  through a link. It writes over only a file of the piece's own copy with the
  hash the record keeps. It removes nothing there: it names each file of the
  last copy it did not write again, which stays where it lies.
