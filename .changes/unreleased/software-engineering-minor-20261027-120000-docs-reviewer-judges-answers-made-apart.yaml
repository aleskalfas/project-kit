component: software-engineering
kind: minor
custom:
  category: Changed
body: >
  The docs reviewer now checks each revalidation that the change check flags as
  replacing revalidations answered apart. Its `unchanged` reason, or the
  `updated` document, must hold against what changed since each replaced
  revalidation, or the review blocks (COR-062 point 7). So a pull request can
  now be blocked on a revalidation that judges only one of two lines of work.
  An `answered-apart` finding of the change check is debt that no change owes,
  and the reviewer never blocks on it. The capability's README lists the new
  block.
