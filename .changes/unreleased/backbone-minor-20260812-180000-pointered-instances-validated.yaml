component: backbone
kind: minor
custom:
  category: Fixed
body: >
  The `$schema` pointer a YAML carries is now validated, not just used to
  classify the file (#710). Previously an external pointer — a `#
  yaml-language-server: $schema=<path>` directive or a top-level `$schema:`
  key naming a schema other than the YAML's own companion — bought only the
  COR-018 companion exemption: nothing checked the file against the schema it
  named, so a hand-edited process definition was shape-checked by nothing.
  `pkit schemas validate` (both the project-wide gate and a path-scoped run)
  now validates every such instance against its declared target, resolved
  relative to the YAML's own directory, reporting findings against the
  instance's path with a JSON pointer into the offending position; a target
  that is missing, unreadable, not JSON, or not a valid Draft 2020-12 schema
  is itself a finding rather than a silent skip, and a remote (`https://`)
  pointer stays exempt and unvalidated. The companion exemption is unchanged —
  an instance still ships no companion of its own, including when named
  directly as the path argument. The shared process shape contract
  (`.pkit/schemas/_defs/process.schema.json`) gained the root constraints that
  make this bite: a `$defs`-only document accepts every instance, so the
  pointer stamped onto a definition validated nothing. Capability companions
  that cross-file `$ref` its `#/$defs/*` are unaffected by the root keywords.
  The cross-file reference passes stay pair-scoped (an instance has no
  namespace of its own); instance-side references remain `pkit data validate`'s
  surface per COR-029.
