component: software-engineering
kind: minor
custom:
  category: Changed
  pr: "773"
body: >
  The four agents (`software-engineer` and the `code-reviewer` /
  `security-reviewer` / `docs-reviewer` panel) now declare their project
  conventions corpus read as `reads.patterns: [<project-conventions>]` — the
  angle-bracket form ADR-013 D1 always specified — instead of a bare literal.
  Combined with the resolver's new optional-read behaviour (ADR-052), the
  adopter's resolved `project-conventions` path now actually reaches each
  deployed agent when defined, and `pkit agents reconcile` surfaces the category
  (as OPTIONAL — the agents already deploy without it). Undefined, the agents
  still deploy and act as careful generalists.
