component: project-management
kind: patch
custom:
  category: Changed
  pr: "1205"
body: >
  `pm-reviewer` reads a pull request's diff from the local checkout,
  `git diff <base>...<head>`, when `gh pr diff` refuses it for changing more
  than 300 files, and requests changes for a diff it cannot read only when
  neither source yields it — however it was started (#1190). Its body also
  describes the verdict marker as it is posted, naming the reviewed head and
  base, and tells a reader to match its `<!-- pkit-verdict` prefix rather than
  the bare string.
