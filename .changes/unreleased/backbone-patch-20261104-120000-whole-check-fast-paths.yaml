component: backbone
kind: patch
custom:
  category: Fixed
body: >
  The whole-repository friction check, `pkit friction check --all`, takes
  about a third of the time it took on project-kit's own tree (#2410).
  living-docs' `fill-doc-check` reads it inside its own thirty-second run, and
  on a slow CI runner it overran, so validation and project-management's doc
  check failed. The backbone now reads plain block YAML, the form answer files
  and front matter are written in, through a reader of its own that hands
  every other text to the YAML loader. It keeps a settings text's parse for
  the life of the process, keyed on its content, seeks a time in a version's
  front matter alone where it can cut one, and finds the files of a path
  anchor without glob characters through a sorted index of the listing. What every friction command and `pkit validate`
  report is unchanged. A text that reader hands on is read by ruamel's
  pure-Python loader, never by libyaml where ruamel's compiled binding is
  installed. Under a ruamel.yaml version the reader was not tested against, or
  one that lacks a part of the loader the reader takes, the reader turns itself
  off, and every text goes to the loader.
