component: software-analysis
kind: patch
custom:
  category: Changed
  requires_backbone: release
body: >
  The check's open regression reads an artefact's revalidations through the
  backbone, never from the artefact's file, so it needs no change when the
  answers move into answer files of their own (COR-062, #1872). It reads the
  `at` of each live revalidation from `pkit friction explain --json` at HEAD,
  whether the backbone read it from the artefact's block or from an answer
  file. A revalidation therefore counts once it is committed, where the check
  read the working tree before. An artefact the backbone cannot explain is
  still reported open, with why.
