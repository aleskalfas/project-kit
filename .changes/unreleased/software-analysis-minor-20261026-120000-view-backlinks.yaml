component: software-analysis
kind: minor
custom:
  category: Added
body: >
  A reader who starts from a concept now finds what is built on it, as DEC-004
  point 7 and DEC-005 point 3 decide (#2104). In an analysis that keeps a domain model,
  `pkit analysis link` ends each view in force with a section
  `## What is built on these concepts`. Under each concept the view explains, it
  lists each use case, journey and requirement in force of the view's analysis
  whose body links the concept's term, by its id and title, or `None.`. The
  stamp writes the section on a new view. Whatever any rule's status,
  `pkit analysis validate` reports the section missing or stale and names the
  command, so an analysis with a view fails validation until you run
  `pkit analysis link` once. The structure check reads the section as no part
  of the view. The views' places declare the form of its links, so a change
  that only retargets them asks no answer. The overview's areas gain
  "Its concepts": each view of the analysis that explains a term one of the
  area's use cases links, read from those links. The
  overview's fingerprint reads them, and its version is 5, so an overview
  written before is a warning until `pkit analysis overview` writes it anew.
  Run `pkit analysis link` before `pkit analysis overview`. The proposed rules
  RS-SAN-005, RS-SAN-008 and RS-SAN-011 read a view's closing section as no
  statement. DEC-001 points 1
  and 11, DEC-003 point 8 and DEC-004 points 2 and 7 are refined in place.
