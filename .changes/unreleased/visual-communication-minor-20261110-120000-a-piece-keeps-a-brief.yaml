component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A piece may keep a brief, `brief.yaml` in its folder (#2969, DEC-029): what
  the piece must show and why it is designed so, for whoever makes or reviews
  it. Its schema, `visual-communication:brief`, an addition to format 1, holds
  a part for the whole piece, `piece`, and a part for each page under `pages`,
  keyed by the page's id. Each part may hold `relations`, `goals`, a
  `takeaway` and `reasons`, each reason with its `aspect` (`structure`,
  `form`, `hierarchy`, `type`, `colour` or `space`), the part it is `about`,
  its `text` and its `principle` by name and source. It names the content by
  key paths, as a tie's end does, and holds no value, no layout and no
  language. The check fails, as `brief-page` and `brief-path`, a page or a key
  path the brief names that names nothing in the content of the piece's
  source language, and reads no final piece's brief but for its binding. No
  command changes what a brief says, and nothing drawn reads it: it is no input of a
  findings record or of an export's fingerprint, so a change to it stales
  nothing. A fingerprint kept from before that read a file of that name in a
  piece's folder finds it no longer read, until the next render or export.
  `pkit visual take-up` copies it with a final piece as it is. The
  visual-author skill guides writing one, and its build loop reads the pages
  against it and names the reviewer's rule findings and brief findings beside
  its faults. A piece with no brief reads as before.
