component: visual-communication
kind: patch
custom:
  category: Fixed
body: >
  A brand that names a component library draws that library's tops by its own
  drawings, even where the library declares neither an own role nor a
  component token (#3039). Before, the brand's drawing of such a top drew
  nothing, and the brand checked alone failed it as a drawing of a top whose
  library it does not name. A token the brand holds under such a library's
  name is now judged as one under any library's name: it is a finding where
  the brand names the library, and asks for attention where a piece's lock
  holds the library with a brand that does not name it.
