component: backbone
kind: none
body: >
  The record COR-004 is refined so its rule says what its text says. A
  command offers `--dry-run` where its effect reaches past what the person
  named: where it changes or removes content that already exists, beyond the
  one value or entry named. A command that only creates new files, or only
  writes the one value or entry named, needs none. No command changes.
