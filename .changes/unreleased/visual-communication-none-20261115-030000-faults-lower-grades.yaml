component: visual-communication
kind: none
body: >
  DEC-046 places the four gaps the review's first calibration found:
  a fault lowers the grade of the rule whose words name it, running text gains
  a rule in GRAPHIC, and craft, legibility at the medium's size and colour gain
  none (#3225). It is a design-ahead record. The rule, the reviewer's body, the
  design knowledge and two checks of boxes follow in later work under #3148,
  each with its own changeset. With the rule the set rises to GRAPHIC@3, a new
  major that also holds the rules #3396 rewords. No surface moves here.
