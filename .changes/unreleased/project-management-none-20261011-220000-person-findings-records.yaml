component: project-management
kind: none
body: >
  Design-ahead: DEC-028 owns three finding tags. [block] withholds the
  approval, [advisory] withholds and holds nothing, and [person] leaves a
  finding to the person who authorises the merge. DEC-055 point 3 states
  that the landing command shows each [person] finding and merges a run
  authorised up front only on verdicts it found when it started. It is
  record text only, and nothing you run changes yet. The code that realises
  it, in the same pull request, carries the real changeset.
