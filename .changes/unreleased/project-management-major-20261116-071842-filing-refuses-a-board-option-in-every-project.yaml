component: project-management
kind: major
custom:
  category: Changed
body: >
  `create-issue --board <N>` is refused, with exit 2, unless N is the
  configured board's number, in every project (#3300, DEC-071): where the
  board's Status mirrors the state or the state degrades, as already where
  the board holds the state, and in a project with no board, where the option
  was dropped without a word. Every issue belongs on the configured board,
  which every command reads and writes. A number below 1, which no board has,
  is refused first, with a message that says so, in place of the message for
  another board where the board holds the state. Each refusal comes before
  anything is written or asked and before the board is read, `--dry-run`
  included, and says what holds in the project's own case: to leave
  `--board` out, and where the issue belongs on another board too, to add a
  card there after filing with `gh project item-add`. A `--board` naming the
  configured board's number goes on, the two read as numbers. This breaks
  every use of `--board` to file onto another board, and every use of it in
  a project with no board.
