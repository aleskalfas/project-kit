component: visual-communication
kind: none
body: >
  The body of `graphic-designer`, which no release has shipped yet, puts first
  the sign that decides where the capability's folder is the source: a
  capability `pkit status` marks `(externally-sourced)` is a copy wherever it is
  (#3069). Either empty grant switches the designer off, as DEC-030 point 5
  says, and both end its run in the same words; recording the location is left
  to the person because it writes in the location, and moving the grant because
  COR-073 point 6 leaves open whether an agent's run consents to that write.
  The designer's and the reviewer's bodies say plainly that the rule set loaded
  into sessions is not read, which they already did not. The pending minor that
  ships the designer declares its surface, so no surface moves.
