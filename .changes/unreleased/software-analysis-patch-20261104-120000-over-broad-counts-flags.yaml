component: software-analysis
kind: patch
custom:
  category: Changed
body: >
  The `analysis-author` skill says that an anchor of any kind which asks its
  artefact for an answer too often, alone or with the artefact's other
  anchors, is warned of as over-broad, since revalidations asked that often
  risk being answered blindly, and that `pkit friction check --all` gives the
  counts and suggests what names less (#2636). It no longer ties the warning
  to `--path` alone, nor to one matching more than half the tracked files.
