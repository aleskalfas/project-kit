component: claude-code
kind: patch
custom:
  category: Added
body: >
  The Claude Code adapter realizes the agent workspace without an allow rule:
  inside the session's working directory — the worktree root for a subagent in
  a worktree — Claude Code's own modes already approve reads, accepted edits
  and sandboxed commands, so nothing is written to `settings.json`; the hook
  allows the path-scoped `workspace` grant for the file tools on a target in
  the folder, and `permission-enforcement.yaml` declares the new
  `path-scoped-allow` dimension as hook-enforced — not a confinement
  boundary; reach stays `filesystem-confinement`, the sandbox's. A
  here-document or redirect into the folder is judged like any other shell
  write. The README states this, and that the harness's own per-session
  scratch directory lies outside a subagent's working directory, where allow
  rules did not stop the prompts.
