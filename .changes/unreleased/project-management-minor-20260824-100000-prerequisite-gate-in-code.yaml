component: project-management
kind: minor
custom:
  category: Changed
body: >
  The prerequisite gate is code, not documentation (#747). DEC-017 named
  `pre-check` the hard gate on every pm operation and the pm skill told the
  agent to refuse on a non-zero exit, but nothing enforced it: no script called
  pre-check, and a missing adopter config was silently read as an empty one, so
  an un-bootstrapped project was not refused — it quietly got defaults for the
  classification substrate, the board flag, review mode, doc mappings and
  workstreams. Now 60 of the 65 registered verbs call an explicit gate at the
  top of their entry point and refuse when prerequisites are unmet, with an
  error naming the exact command that fixes it (both the `pkit
  project-management bootstrap` form and the direct-script form) plus
  `pre-check` for the full diagnosis. Exempt, because each is either how a
  project BECOMES bootstrapped or how you diagnose why it is not: `bootstrap`,
  `pre-check`, `migrate`, `adopt-existing`, `self-test`. The read-only verbs
  (`show-*`, `list-workstreams`, `history`) and the engine-called predicates
  (`detect-*`, `gate-*`, `cascade-*`, `parent-active-descendant`,
  `context-workstream`) are gated too — a read that assumes kit labels
  misreports an adopter who remapped them, and a predicate answering "where is
  this issue?" from assumed defaults is the same silent-wrong-answer shape; a
  refusing predicate is read by the process engine as indeterminate and fails
  closed, which is the correct answer for a project that genuinely cannot say.
  "Bootstrapped" is two local file reads, no network and no API calls: a
  bootstrap STAMP that `bootstrap` writes on a clean completion (and `migrate`
  refreshes) at `project/bootstrap-stamp.yaml`, plus the adopter config still
  being shape-valid against its companion schema. The stamp records the
  capability version that bootstrapped, so an upgrade whose bootstrap
  obligations changed is detectable — surfaced as a `pre-check` warning rather
  than a refusal, since most upgrades change nothing about what bootstrap
  provisions. It also records the repository it was written for, so a stamp
  copied or seeded into a different repo is inert instead of opening the gate.
  Whether the setup is still HEALTHY (labels present, board resolving, host
  reachable) remains `pre-check`'s question, deliberately: a setup gate that
  fails when the tracker has a bad minute is worse than no gate. Installs made
  before this version are carried forward by a capability migration that writes
  a stamp marked as a presumption, so previously-working commands keep working;
  `context-workstream`'s contract narrows from "always exits 0" to "exits 0 on
  every derivation miss" (its backbone consumer already reads any non-zero exit
  as "no workstream", so that path is unchanged). A guard test enumerates every
  verb in `package.yaml` and asserts each one either calls the gate or appears
  on the exemption list with its reason, so a new verb cannot ship ungated.
