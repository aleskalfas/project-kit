component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual new <piece>` stamps a new piece's first files (#2985): its
  `piece.yaml`, from the top, the brand, the notations, the languages, the
  modes, the exports, `audience`, `shown` and `explains` a person gives it, a
  draft with no lock; a content file for each language, holding each field of
  the top, empty; and a brief that holds its binding and says nothing yet. The
  first render writes the lock, as for a piece written by hand. It refuses a
  name taken or not a piece's name, and a library the location lacks, naming
  `pkit visual add`, and writes nothing then; it never writes over a file. The
  `visual-author` skill starts a piece with it. It breaks nothing an adopter
  holds.
