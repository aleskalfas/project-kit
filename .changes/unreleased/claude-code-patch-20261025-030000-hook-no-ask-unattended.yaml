component: claude-code
kind: patch
custom:
  category: Changed
body: >
  The permission hook no longer asks on a Bash command that may hide a form of
  a guardrail where the session runs in auto mode or bypass mode, the modes in
  which the person chose not to be asked. There it defers, and the harness's
  own mode decides. The hook reads the mode from the payload's
  `permission_mode`, `auto` or `bypassPermissions`. In every other mode, and
  where the payload names no mode or one the hook does not know, it asks as
  before. Its allow and its deny are unchanged, and it still asks on an Edit
  or Write to an absolute path outside the repository in every mode.
