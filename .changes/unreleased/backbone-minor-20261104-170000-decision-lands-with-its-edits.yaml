component: backbone
kind: minor
body: >
  A decision lands with what it decides (#2639). COR-066 gains point 5, which
  binds every project: a new decision record's Implications name each edit
  its change makes to an accepted record, and what the edit makes that record
  say. Those edits follow its acceptance, in its change, and accepting the
  record accepts the edits its Implications name. The person who authorises
  the change to land is shown the edits beside the records it makes accepted,
  and reads each before it lands. An edit the record forces on a rule of the
  project's own rule sets is named and made the same way. A new record
  decides nothing against a record or rule set the project receives from
  elsewhere: a change it needs there is proposed where that is kept. The
  decisions reference's "The acceptance gate" says so, and "Refining an
  accepted record" lists each kind of edit and how it is made. The
  `decision-author` skill names the edits in the Implications, shows their
  words before the person accepts the record, makes them as shown after the
  acceptance, and shows them again before the merge where no component that
  carries out merges does. The `architect` agent's line on an ADR it authors
  names the edits, and makes those to the records it owns once the ADR is
  accepted. `pkit decisions check-diff` and `pkit refs rot` behave as before:
  neither fails such a change, and the numbering check lists the edits.
