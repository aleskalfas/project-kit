component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit permissions diff` reports what each registered adapter's harness leaves
  unenforced (#3059). It reads the `permission-enforcement.yaml` of each adapter
  the backbone manifest registers, in that adapter's folder, where it read only
  the Claude Code adapter's. Where more than one adapter is registered, each
  dimension an adapter declares enforced `none` is named under that adapter's
  name. A registered adapter with no declaration, or one that declares no
  dimension, is named as declaring nothing, never as enforcing every dimension.
  With only the Claude Code adapter registered, the report is unchanged.
  `pkit permissions apply` prints the same report.
