component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The design knowledge gains a topic, "Where reading starts, and the path it
  takes" (#3089): what gives a part weight, where the eye enters a page whose
  weights are even and one where a part dominates, how the path runs along the
  direction of writing and along arrows, what matters most on a page that
  explains, reading direction by language, and the content's order for a reader
  who does not see the page, each idea with its source. `graphic-designer` names
  each page's order of explanation with its structure, writes it into the brief
  as a relation for you to confirm where the brief gives none, and settles where
  the page's path starts before it ranks what is seen first.
  `graphic-design-reviewer` traces each drawn page's path, and reports as a
  brief finding a page whose path does not follow the order its relations and
  its lead give.
