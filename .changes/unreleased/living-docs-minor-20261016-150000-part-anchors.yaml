component: living-docs
kind: minor
custom:
  category: Added
  requires_backbone: release
body: >
  The living-docs agent now proposes an anchor on the one point of a record, or
  the one section or lead of a page, that a statement rests on, in its fixes,
  reader-reviews and onboarding plans, and validation explains that a source
  anchor written with `#` names no part.
