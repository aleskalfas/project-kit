component: software-analysis
kind: patch
custom:
  category: Fixed
body: >
  Onboarding a brownfield project's analysis now starts from the surface the
  project declares, and ends once that surface is covered (DEC-001 point 9,
  #1930). Before an agent derives any candidate, the `analysis-author` skill's
  `build-analysis.md` has it run `pkit friction check --all` and read the
  declared surface. Where the check reads `no surface declared`, the agent asks
  the person which paths the analysis ought to cover, and derives nothing until
  they are declared under `friction.surface`. After the last step, onboarding
  ends only once the check counts no path of the surface uncovered, and lists
  none of the analysis's artefacts as unanchored without a reason a person
  accepted.
