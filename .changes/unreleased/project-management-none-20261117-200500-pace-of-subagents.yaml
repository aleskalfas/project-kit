component: project-management
kind: none
body: >
  DEC-082, which a person accepts in this change (#3394), decides how many
  subagents the project-manager agent runs at once: one setting of the
  capability's committed configuration, read from the default branch, gives
  the ceiling, `off`, a number or `max`, and `max` where it is absent. Every
  subagent a session runs takes a slot: builders, reviewers, fixers, helpers
  and their own, and resumed runs. The agent starts first what its work in
  flight waits for, then a Task a directive named, then the next Task
  nothing blocks, nearest the work just done; a worker's directing seat may
  set the worker's pace on its state issue, a person any seat's, and the
  lowest binds; the build and review commands hold to the pace from a
  register of the clone's runs; a lowered pace stops nothing that runs. It
  overturns DEC-059 and DEC-061 in part, and refines DEC-058, DEC-059 and
  DEC-063 in place. The configuration, the state issues, the commands, the
  agent and the work loop are unchanged until the Task that builds them,
  which declares its own changeset, so no surface moves here.
