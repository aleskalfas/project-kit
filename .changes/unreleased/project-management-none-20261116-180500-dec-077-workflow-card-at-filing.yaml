component: project-management
kind: none
body: >
  DEC-077 is proposed: at an issue's filing, the post-check workflow gives
  a missing card by running the board sync for that issue, on a board of
  the repository's own owner that does not hold the state, where the
  project turned its remediation on, set a credential the board answers
  and set the variable PM_SYNC_AT_FILING to on, which is its consent: under
  a person's token only for an issue the repository's own people open, and
  under an App's token for every issue. It adds none elsewhere (#3271). A
  design-ahead record: the template and the commands change in the Task
  that builds it, which declares its own changeset, so no surface moves
  here.
