component: backbone
kind: minor
custom:
  category: Added
body: >
  The friction writers write a change's answers into answer files of its own,
  as COR-062 and ADR-068 decide. Where an artefact's block holds no answer,
  `pkit friction revalidate`, `defer` and `revisit` write into the one answer
  file in `.pkit/project/friction/answers/` that no commit holds, or add one
  named for its UTC time and eight random hexadecimal digits. The entry's
  `read` names every other answer file present on the artefact. Two
  uncommitted files that each answer one artefact refuse the write, and a
  revalidation re-states the deferrals it keeps in its own entry. Where the
  block still holds answers, the writers write there as before, until the move.
  The new reading command `pkit friction move-plan [--json]` plans that move:
  each `moved-<hash>.yaml` it would add and each artefact file's new text. The
  backbone migration `2.0.0/002-move-answers-to-files.sh` writes those bytes.
  It leaves what the project receives by sync, never writes over an answer
  file, and writes nothing on a second run. An artefact the project receives
  by sync, such as a rule of a method rule set, owes it no answer: neither
  check asks it one or reports it stale, `explain` gives its state as
  `received`, and the writers refuse it (COR-062 point 9).
