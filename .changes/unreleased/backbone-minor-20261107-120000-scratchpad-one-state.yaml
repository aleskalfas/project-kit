component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit validate` gains a thirteenth backbone member, `scratchpad`, which holds
  each scratchpad note to one state folder, since the folder a note lies in is
  its state (COR-012; #2263). A slug whose notes lie in more than one of
  `active/`, `reported/`, `done/` and `dropped/` is an error, one for each such
  slug, located at `.pkit/scratchpad :: <slug>` and naming every file. Two
  notes of one slug in one folder are not its concern, and it reads only `.md`
  files. A project whose notes already lie in two folders now fails `pkit
  validate` until it keeps the note in the folder of its state and removes or
  renames each other file. No migration removes one, since only a person can
  tell which copy holds the note's state. The scratchpad README says so under
  "States".
