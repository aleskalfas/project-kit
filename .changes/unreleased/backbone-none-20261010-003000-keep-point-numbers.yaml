component: backbone
kind: none
body: >
  project-kit's own operational rules (.pkit/rules/project.md) gain a rule
  that keeps every point of a decision record at its number until
  project-kit's records are converted to numbered headings. The file is
  project-owned and sync never touches it, so nothing reaches an adopter.
  The changeset guard counts any change under .pkit/rules/ as the
  backbone's.
