component: claude-code
kind: minor
custom:
  category: Security
  requires_backbone: release
body: >
  The permission hook asks the person where the decision core defers on a Bash
  command that may hide a form of a guardrail, such as
  `git push origin --forc[e]` or `HOME=/tmp/x git push origin main`. Claude
  Code's own rules, such as the baseline's `Bash(git:*)`, would otherwise run
  such a command unasked. The hook answers `ask`, and its reason names the
  guardrail and what keeps the core from seeing the form, never the command's
  text. A strict posture still denies such a command, a project's own deny
  that the core cannot tell still defers, and a fault in the check, or a
  backbone without it, keeps the deferral.
