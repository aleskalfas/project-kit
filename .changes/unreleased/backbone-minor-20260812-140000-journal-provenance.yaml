component: backbone
kind: minor
custom:
  category: Added
body: >
  The process engine's journal is now the **canonical, provenance-carrying audit
  trail** (#697, DEC-049). Each move entry is stamped with the **pkit version**
  that governed it (best-effort — a version hiccup never blocks a move), so
  `pkit pm history` and `--check-drift` can attribute governed moves and sharpen
  the governed-vs-ungoverned boundary. The `journal_entry` schema documents the
  new `version` field.
