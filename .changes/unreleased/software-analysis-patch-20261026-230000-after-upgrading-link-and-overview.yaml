component: software-analysis
kind: patch
custom:
  category: Changed
body: >
  After you upgrade a project that keeps an analysis, run `pkit analysis link`
  and then `pkit analysis overview`. This version links each citation of a
  record, a point or a rule, and each mention of an artefact's id. Until
  `pkit analysis link` writes those links, `pkit analysis validate` fails on
  an analysis holding such a citation or mention. Then
  `pkit analysis overview` writes each overview anew, as validation reports
  one that is missing or out of date.
