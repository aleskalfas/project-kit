kind: none
body: The new DEC-062 puts each axis on the board through the substrate map, with the board flag saying only that a board exists, and DEC-006, DEC-012, DEC-036, DEC-037 and DEC-051 are refined to agree, a board-carried state read from the board's Status among them. A design-ahead decision that #2271 builds, so no adopter-facing behaviour changes here.
