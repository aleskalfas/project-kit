component: backbone
kind: patch
custom:
  category: Fixed
body: >
  Reporting a scratchpad note never leaves a key twice in its front matter
  (#2923). A report refuses, before it posts, stages or prints a link, an
  active note that holds a field its stamp would write, naming the field: `reported`,
  `reported_to`, `reported_hash`, or `project` or `workstream` where the post
  would write the report's context. `pkit scratchpad reported` refuses such a
  note before it writes, and `pkit report submit` checks the note again before
  it posts, keeping the draft. A note whose front matter holds a key twice
  already is refused any send. `pkit scratchpad done` and `drop` refuse such a
  note naming the key, and refuse front matter that does not read as YAML,
  where both failed with an uncaught error.
