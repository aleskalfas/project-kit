component: backbone
kind: patch
custom:
  category: Fixed
body: >
  A later send of a reported scratchpad note rewrites only the lines its stamp
  wrote (#2924). It adds its issue under the stamp's own `reported_to` and
  rewrites the stamp's own `reported_hash` line. Before, it rewrote every line
  starting `reported_hash:` in the note, its body included, and added the
  issue under the first `reported_to:` line in the front matter. A note whose
  body holds such a line now reads as unchanged right after the send, its body
  as it was. A later send that adds an issue to a reported note whose stamp's
  fields no longer stand in the order the stamp wrote them is refused: by a
  report before it posts, stages or prints a link, and by `pkit scratchpad
  reported` before it writes.
