component: backbone
kind: minor
custom:
  category: Added
body: >
  The deterministic command tier of COR-044's process-authoring layer (#683),
  under the existing `pkit process` namespace: `process new` scaffolds a
  lint-clean definition (subject incl. cardinality, states with meanings,
  transitions, entry/terminal marks) into a NAMED owning capability — erroring
  cleanly without one — with a fail-closed predicate stub for every evaluable
  the declared shape demands (detection always; gates / entry guards /
  resume_when / invariant checks when declared), each registered in the
  capability's package.yaml per the predicate-runner contract; `process
  couple` appends a `depends_on` entry to the invoker-named definition, with
  relation/mode validated against COR-038's closed vocabularies read as data
  from the shape contract; `process hand-off` adds a COR-042 contract
  (trigger + both seams, stubs scaffolded when new) to an existing coupling,
  validating the trigger against the upstream where resolvable. Neither
  mutation bumps the definition version (additive inert/report-only edits per
  COR-044). And `process health --interpretation-only` re-renders the same
  health walk (a consumer of the walker per COR-042 point 5, never a parallel
  contract-walker) as the authoring completion signal: indeterminates only,
  misses not counted, the default run's exit contract unchanged.
