component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit friction explain <artefact> --json` carries what a capability's script
  reading an artefact's change would otherwise compute again: each path anchor's
  `files` at the revalidation point and at HEAD (`{point, head}`), matched by the
  rule the check decides a dead anchor by, so a file `friction.exclude` names is
  never among them even where the anchor's glob covers it; the commits behind a
  dead path anchor, in its finding's `commits` — every commit after the
  revalidation point that touched a file it matched; and the artefact's `body`,
  for a collection entry the section headed by its id. Keys are added, none
  changed in meaning; the human view lists a dead path anchor's commits too.
