component: backbone
kind: none
body: >
  The scratchpad README becomes a reference for the AI agent that starts,
  stamps, lists and retires notes (#2435). It opens with a one-line purpose
  and a link to the scratchpad guide, then holds the layout, the states, the
  file name, the body, each state's front matter and the commands with their
  refusals. Why notes exist and how people work with them move to a guide
  that does not ship. Every heading address other text may name is kept. The
  README and the CLI reference now say what the commands did before: a move
  writes the new file, deletes the old one and stages nothing in git, a slug
  finds each note whose file name ends in it (#2439), and the recorded hash
  leaves out the fields a send writes. Nothing the backbone ships or runs
  changes.
