component: project-management
kind: minor
custom:
  category: Added
body: >
  A comment posted through `comment-issue` or `comment-pr` now says which
  clone posted it (#2272). It ends with a line naming the seat and instance of
  the clone that runs the verb, such as `🪑 Posted by seat planner, instance
  1`, or saying that the clone holds no seat. A hidden
  `<!-- pkit:posted-by v=1 ... -->` stamp carries the same, with the clone's
  key. A clone that took a seat confirms it on the seat's state issue first
  (DEC-059 point 6), and where it cannot, the verb refuses with exit 1 and
  posts nothing. The pm skill now says that a comment reporting the person's
  decision names the seat or the session the person gave it in.
