component: software-analysis
kind: minor
custom:
  category: Added
body: >
  A project may name the commits whose removed files' numbers are free again
  — a pilot cleared before its analysis is established, say (DEC-001 point
  3): `numbering.freed-by` in the capability's new project configuration,
  `.pkit/capabilities/software-analysis/project/config.yaml`, whose shape is
  `schemas/config.schema.json`. A number the default branch's history gave a
  file one of those commits deleted is no longer counted: `pkit analysis new`
  numbers as though it was never given, saying so and naming the commit when
  it is a number the stamp would have followed, and `pkit analysis
  check-numbers` reports no collision for it. Nothing else frees a number: a
  file another commit removed, a file a named commit renamed rather than
  deleted, and every file the working tree or the default branch holds keep
  theirs. Each entry is a commit's full id, or an abbreviation naming it alone,
  on the default branch's history; one that names no commit here, is
  ambiguous, or lies off that history refuses the stamp of a use case or
  journey and fails `pkit analysis check-numbers` — whether the working tree
  numbers anything or not — at the entry. Without the file, nothing changes.
