component: software-analysis
kind: minor
custom:
  category: Added
body: >
  A project can remove use cases and journeys that nothing cites, and declare
  their ids free again: a pilot abandoned before anything cited it, say
  (DEC-001 point 3). The
  declaration is `numbering.freed-by` in the capability's new settings file,
  `.pkit/capabilities/software-analysis/project/config.yaml`, whose shape is
  `schemas/config.schema.json`. Each entry names the commit that removed the
  artefacts, by its full id, and lists the ids it frees; only a listed id is
  freed. `pkit analysis new` gives a listed id again and says so when it is
  the number it would have followed. `pkit analysis check-numbers` reports no
  collision for it and lists the ids each entry frees, with a `freed` list in
  its `--json` document. An id the commit would free that no entry lists
  stays taken, and both report it. An entry the tools cannot honour refuses
  the stamp of a use case or journey and fails `pkit analysis check-numbers`,
  saying why; a clone too shallow to hold the commit's parent, and git older
  than 2.31, are named as such. The capability's README, "Configuration",
  says what cites an id and which ids a commit can free. Without the file,
  nothing changes.
