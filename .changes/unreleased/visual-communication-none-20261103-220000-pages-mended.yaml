component: visual-communication
kind: none
body: >
  The capability's reference pages are mended (#2549). outputs.md says how the
  SVG renderer writes a font family's name, and names the page of each section
  of What the check reports it refers to. checks.md says that
  `brand-unreadable` names the version its folder holds, so it asks for
  attention in a released one. files.md's Notations links each fact it
  recapped to its home on the page, and the README links the section of
  `pkit visual add` from step 1 of "Drawing a piece". The pages only say what
  the code already does: no command, path, file format, check or output
  changes, so no surface moves.
