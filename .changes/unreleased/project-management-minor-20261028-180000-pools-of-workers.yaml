component: project-management
kind: minor
custom:
  category: Added
body: >
  A topology may now declare pools of workers (DEC-061, #2256). Each seat that
  builds names the pools it serves, and a person puts a Milestone into a pool
  with a `Pool: <name>` line, through `create-milestone --pool` or the new
  `set-pool`. Either asks the person's consent and logs it in the Milestone's
  description. `next-task` then takes only ready Tasks whose native Milestone is
  an open Milestone of the seat's pools, and takes nothing where the Milestones
  cannot be read. Each write that brings a Task into a pool, or moves it between
  pools, asks the person: `create-issue`, `edit-issue` and `promote-issue` with
  `--milestone`, and an `assign-milestone` hook. Closing a Milestone rolls its
  open Tasks forward within its pool, and `seats`, `take-seat` and
  `check-topology` show and check the pools. Every adopter with a topology
  meets one change of behaviour: code that cannot read the topology in full, a
  key it does not know among it, now refuses in `next-task`, `start-work`,
  `take-seat` and `release-seat --force` rather than warn. The order of work
  (DEC-061 point 9): add pools to a topology only once every clone that may
  take a seat runs its taking commands from a checkout at or past this
  release, since older code ignores the pools and takes from the whole
  Backlog. A project with no pools declared behaves as before.
