component: software-engineering
kind: patch
custom:
  category: Changed
body: >
  The `software-engineer` agent stages and commits only the paths its change
  touched, each by name, the answer files it wrote among them, and never the
  whole working tree (#3034). So another repository cloned inside the tree, a
  file a person or another session left there, or a tool's output stays out of
  its commits on every machine. Where it finds a path changed that its change
  did not touch, it leaves the path out of the commit, unaltered, and names it
  in its hand-off.
