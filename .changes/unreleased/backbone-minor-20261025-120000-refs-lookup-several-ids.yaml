component: backbone
kind: minor
custom:
  category: Added
body: >
  `pkit refs lookup --json` takes several ids and answers each in one
  document, `{schema_version, lookups}`, in the order given: where it lies, or
  why it does not resolve. The exit is 0 either way, since each entry says
  which. A script that reads several records starts `pkit` once for all of
  them (#2025). Without `--json` the command takes one id and prints as
  before.
