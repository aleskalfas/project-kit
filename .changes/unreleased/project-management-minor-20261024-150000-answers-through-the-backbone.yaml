component: project-management
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  Landing and the review floors read a change's answers through the backbone,
  so they need no change when the answers move into answer files of their own
  (COR-062, #1872). An answer file never counts as code for the `touches-code`
  floor, whatever `review.floors.not_code` says: a change that only answers
  draws no code review, and a push that only answers keeps a code-floor
  approval standing (DEC-032 D1). The folder is read from the backbone's
  `pkit friction check --all --json`, once for a run and only where the paths
  the list leaves touch code. `land-work`'s firm stop on a base that moved on
  reads the file the change check names for each listed answer, an answer
  file or the artefact's own. Beside the list, and never in the description,
  `land-work` prints each revalidation on the base's tip that the change's
  answer did not read, which the merge would leave answered apart, and its
  `ready:` line counts them. They stop nothing (DEC-055 point 3). With every
  answer still in a block, each command gives the results it gave before.
