component: visual-communication
kind: minor
custom:
  category: Added
body: >
  A text part that shows a field of runs can choose, by each run's style,
  whether a run that names a concept draws its concept's sign before its text,
  and a `ground`, a paint or none, behind it (#3046, DEC-036 point 3). The sign
  lies before the run's first character that is no space or line feed, as wide
  as the run's font size and in its paint, and no line breaks between the two.
  The ground lies behind each piece of the run on each line, its sign
  included, and the run's contrast is measured against it. Runs next to each
  other that name one concept draw one sign, and runs that take one ground take
  it once. The foundations being built, 1.1.0, declare their lengths as
  `space.sign-gap`, `space.ground-room` and `space.ground-corner`, each
  defaulting to `{space.1}`. The scene's lines hold each sign and ground, so
  the seam rose to 8, and the SVG renderer rose to 1.3.0, the PDF renderer to
  1.5.0 and the HTML renderer to 1.6.0, each drawing them. A text part that
  chooses neither draws as before.
