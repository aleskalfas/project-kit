component: backbone
kind: patch
custom:
  category: Fixed
body: >
  After a merge, `pkit release merge` switches its clone to the release PR's
  base and pulls it only where the clone is on the PR's head branch with a
  clean working tree, as project-management's merge verbs do. A clone on
  another branch or a detached HEAD, or with uncommitted changes, untracked
  files included, is now left where it is, nothing pulled, and the merged
  branch's local copy is kept, said in one line. Before, the clean-up checked
  out the base whatever the clone held, so a clone in the middle of other
  work was moved onto it with its changes, and its next commit could land
  there. A clean clone already on the base is fast-forwarded with no switch,
  said in one line, and a fast-forward that fails warns and changes nothing.
  Where the switch fails, the clone stays on the head branch and its local
  copy is kept, with a warning, rather than a delete that cannot succeed. The
  deletion of the head branch on GitHub is unchanged.
