component: project-management
kind: patch
custom:
  category: Fixed
body: >
  The doc check (`check-doc-mapping`) meets a page's friction obligation by an
  answer the change adds on the page, as the change check lists and accepts it
  against the same base, as well as by a change to the page itself (#2095).
  The check reads a pull request as the one squash commit it lands as, so a fix
  round that edits an anchor after the commit that answered for it no longer
  fails the check while the change check asks nothing. Where the change check
  gives no list, the check says why and meets a page only by its change in the
  diff.
