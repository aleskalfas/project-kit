component: visual-communication
kind: none
body: >
  Design-ahead: DEC-034 decides how a brand declares its drawing of a layout,
  and what DEC-009 leaves to that change (#2965). The drawing's own file
  names the top and the layout. A page's size and a top's physical size stay
  the top's. A top a brand holds is drawn by its own drawing alone. What each
  field shows keeps its trace id under every drawing. A base brand that
  begins to serve a top breaks nothing. DEC-003, DEC-005, DEC-009, DEC-021
  and DEC-022 state what it decides of them. Nothing is built yet, so no
  command, file or check moves.
