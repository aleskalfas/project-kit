component: living-docs
kind: minor
custom:
  category: Changed
body: >
  On a project whose two documentation roots are one folder, as both are by
  default, `pkit living-docs new space`, and `new page` for the user or
  technical space, first offer to set the internal root apart, as living-docs
  DEC-001 point 2 decides (#2084). The internal root goes to `tech-docs`, or to
  the folder `--internal-root <path>` names. A folder that lies in the user
  root, or holds it, is refused. The write is `pkit config set docs.internal`,
  which asks once at a terminal. Off a terminal it needs the stamp's new
  `--yes`, and without it the stamp refuses and writes nothing. A dry run says
  it would set the root first. So a fresh project creates its spaces with no
  layout step before them, whatever order it installed its capabilities in.
  The validator's report on roots that are one folder now names the stamp and
  the folder it recommends. No migration.
