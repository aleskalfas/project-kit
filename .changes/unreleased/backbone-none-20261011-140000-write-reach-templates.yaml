component: backbone
kind: none
body: >
  project-kit's own operational rules (.pkit/rules/project.md) widen the rule
  that sends the analysis's writers to WRITE, project-kit's general writing
  rule set. It now also sends whoever writes software-analysis's templates,
  or the structures its kinds declare. The file is project-owned and sync
  never touches it, so nothing reaches an adopter. The changeset guard
  counts any change under .pkit/rules/ as the backbone's.
