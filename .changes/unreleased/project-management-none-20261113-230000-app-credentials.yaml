component: project-management
kind: none
body: >
  Design-ahead: the record DEC-076 decides that the account a credential acts
  as is the actor of each act the commands record, and that under a
  credential that names no user's account that account never acts or counts
  as a person. The commands take a person's identity for the acting account
  only from GitHub's answer that the credential names that person's account,
  so under an app's credential, such as a GitHub App installation's token or a
  CI workflow's, and wherever GitHub gives no answer, no person stands for the
  acting account and no comment names a person as its authoriser. Under every
  credential, no audit comment names an authoriser beside the account that
  posts it. Where the commands know no acting account, an act names no actor,
  and a move into a state whose gate is an authorisation artifact, such as
  Done, refuses until the backbone decides what its gate takes then. In every
  project, nothing an account the service records as a bot writes counts as a
  person's claim or approval. The person the agent works for serves only where
  naming a person grants nothing: the default assignee, start-work's refusal
  of another's Task, and a view of the work assigned to whoever runs it.
  Building waits on a record that decides where the reading of the acting
  account lives. Once accepted, it partially supersedes DEC-014, DEC-021,
  DEC-035, DEC-044, DEC-049, DEC-050 and DEC-052, refines DEC-019, DEC-021,
  DEC-026, DEC-027, DEC-028, DEC-043, DEC-044, DEC-058, DEC-059, ADR-041 and
  ADR-071 in place, and corrects facts in DEC-019, DEC-021, DEC-047 and
  DEC-073. No behaviour changes until the record is built.
