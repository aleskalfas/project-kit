component: project-management
kind: none
body: >
  Design-ahead: the record DEC-070 decides how the commands act under a
  credential that names no person, such as a GitHub App installation's token
  or a CI workflow's. They never take a person's identity for the acting
  account, nothing such an account writes counts as a person's claim or
  approval, and no comment names a person as its authoriser. The person the
  agent works for serves only where naming a person grants nothing: the
  default assignee, and start-work's refusal of another's Task. Under every
  credential, a command checks that the board answers before using it. It
  refines DEC-019, DEC-021, DEC-022, DEC-026, DEC-028, DEC-035, DEC-043,
  DEC-052, DEC-058 and DEC-059 in place once accepted. No behaviour changes
  until the record is built.
