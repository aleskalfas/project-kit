component: project-management
kind: none
body: >
  Design-ahead: the record DEC-076 decides that, under a credential GitHub does
  not answer for as a user's account, such as a GitHub App installation's token
  or a CI workflow's, the commands take no person's identity for the account
  they act as. Neither git's email nor PM_INVOKER_LOGIN passes that account at
  the membership gate, and the variable names only the person the agent works
  for, who serves where naming a person grants nothing: the default assignee,
  start-work's refusal of another's Task, and a view of the work assigned to
  whoever runs it. Such a clone claims no Task, builds nothing in a project
  with a topology, and changes no member list. Where GitHub gives no answer, a
  person's own credential included, the identity is unresolved and treated the
  same way. In projects that run no agent under such a credential, a
  closed-mode workflow that passes by the variable or by git's email refuses
  until its own account is a member, a person's credential GitHub gives no
  answer for passes the gate by neither, and no command assigns a bot's account
  or hands a Task to an app's account. Once accepted, it partially supersedes
  DEC-021, DEC-035 and DEC-059, refines DEC-019, DEC-021, DEC-026, DEC-028,
  DEC-058, DEC-059 and ADR-071 in place, and corrects facts in DEC-019 and
  DEC-073. No behaviour changes until the record is built.
