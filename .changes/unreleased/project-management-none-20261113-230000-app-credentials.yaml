component: project-management
kind: none
body: >
  Design-ahead: the record DEC-076, accepted, decides that, under a credential GitHub
  does not answer for as a user's account, such as a GitHub App installation's
  token or a CI workflow's, the commands take no person's identity for the
  account they act as, which they take from the backbone's reading of the
  acting account (ADR-094). The membership gate matches only the bot's account
  the reading names, by its own login, so neither git's email nor
  PM_INVOKER_LOGIN passes that account, and the variable names only the person
  the agent works for, who serves where naming a person grants nothing: the
  default assignee, start-work's refusal of another's Task, and a view of the
  work assigned to whoever runs it. Such a clone claims no Task, builds
  nothing in a project with a topology, and changes no member list. Where
  GitHub gives no answer, a person's own credential included, the identity is
  unresolved: no person stands for it, and a clone that holds an instance id
  refuses until GitHub answers. In projects that run no agent under such a
  credential, a closed-mode workflow under its own token or an App's that
  passes by the variable or by git's email, the post-check workflow's board
  sync among them, refuses outright until the reading names its token's
  account and that account is a member, and a person's credential GitHub gives
  no answer for passes the gate by neither, while a clone of theirs that holds
  an instance id refuses, and a command that needs a person refuses where the
  variable is not set. Its build ships a migration that warns of each bare
  member entry whose login with the [bot] suffix GitHub answers as an App's
  account, giving the spelling <name>[bot] that passes the gate, both
  spellings where the bare login names an account too, and what respelling
  admits, and of each workflow that sets the variable, and that says what it
  could not read. It partially supersedes DEC-021, DEC-035, DEC-059 and
  DEC-077, whose top lines say what it overturns: DEC-021's match on any
  surface where GitHub names no user's account, git's email as the fallback
  among it, the variable's CI way through a closed gate and the refusal that
  names it; DEC-077's sync through a closed gate by the variable under an
  App's token; DEC-035's id as the sole activation gate; and DEC-059's clone
  with no seat guarded by nothing. It refines in place DEC-019's default
  assignee and --me, DEC-021's member changes, which no command makes under
  such a credential, its deferral, which fixes a fail-closed read of the
  acting account, and its Rationale's open question, DEC-026's start-work
  rows, DEC-028's local path, which names the account that runs the command
  and no person responsible under such a credential, DEC-058 point 5 and
  DEC-059 point 4 on seats, DEC-067 point 4's prompt, and ADR-071 point 5,
  and corrects facts in DEC-019 and DEC-073. It was accepted together with
  ADR-094, ADR-098, DEC-078 and DEC-079, all five at once. No behaviour
  changes until the record is built.
