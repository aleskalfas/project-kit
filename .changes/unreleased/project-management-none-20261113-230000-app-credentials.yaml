component: project-management
kind: none
body: >
  Design-ahead: the record DEC-070 decides how the commands act under a
  credential that acts as an app, such as a GitHub App installation's token.
  They act as the app's account and never take a person's identity in its
  place, and nothing that account writes counts as a person's claim, approval
  or authorisation. A command takes a person named in the call where naming
  them grants nothing, and refuses otherwise. A project with a board is left
  out for now. It refines DEC-019, DEC-021, DEC-026, DEC-035, DEC-043, DEC-052,
  DEC-058 and DEC-059 in place once accepted. No behaviour changes until the
  record is built.
