component: project-management
kind: none
body: >
  Design-ahead: the record DEC-076 decides that, under a credential GitHub does
  not answer for as a user's account, such as a GitHub App installation's token
  or a CI workflow's, the commands take no person's identity for the account
  they act as, which they take from the backbone's reading of the acting
  account (ADR-094). The membership gate matches only the bot's account the
  reading names, by its own login, so neither git's email nor PM_INVOKER_LOGIN
  passes that account, and the variable names only the person the agent works
  for, who serves where naming a person grants nothing: the default assignee,
  start-work's refusal of another's Task, and a view of the work assigned to
  whoever runs it. Such a clone claims no Task, builds nothing in a project
  with a topology, and changes no member list. Where GitHub gives no answer, a
  person's own credential included, the identity is unresolved: no person
  stands for it, and a clone that holds an instance id refuses until GitHub
  answers. In projects that run no agent under such a credential, a
  closed-mode workflow under its own token or an App's that passes by the
  variable or by git's email, the post-check workflow's board sync among them,
  refuses outright until the reading names its token's account and that
  account is a member, and a person's credential GitHub gives no answer for
  passes the gate by neither, while a clone of theirs that holds an instance
  id refuses, and a command that needs a person refuses where the variable is
  not set. Its build ships a migration that warns of each bare member entry
  GitHub answers as an App's account, giving the spelling <name>[bot] that
  passes the gate, and of each workflow that sets the variable, and that says
  what it could not read. Once accepted, it partially supersedes DEC-021,
  DEC-035, DEC-059 and DEC-077, refines DEC-019, DEC-021, DEC-026, DEC-028,
  DEC-058, DEC-059, DEC-067 and ADR-071 in place, and corrects facts in DEC-019
  and DEC-073. It is accepted together with ADR-094, ADR-098, DEC-078 and
  DEC-079, all five at once. No behaviour changes until the record is built.
