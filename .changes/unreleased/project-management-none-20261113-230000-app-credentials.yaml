component: project-management
kind: none
body: >
  Design-ahead: the record DEC-070 decides that an account that names no
  person never acts or counts as one. Under a credential that names no
  person, such as a GitHub App installation's token or a CI workflow's, the
  commands never take a person's identity for the acting account, and no
  comment names a person as its authoriser. In every project, nothing an
  account the service records as a bot writes counts as a person's claim or
  approval. The person the agent works for serves only where naming a person
  grants nothing: the default assignee, and start-work's refusal of another's
  Task. Building waits on a record that decides where the reading of the
  acting account lives. Once accepted, it partially supersedes DEC-021,
  DEC-022 and DEC-052, and refines DEC-019, DEC-026, DEC-028, DEC-035,
  DEC-043, DEC-058, DEC-059, ADR-041 and ADR-071 in place. No behaviour
  changes until the record is built.
