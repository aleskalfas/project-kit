component: project-management
kind: minor
custom:
  category: Changed
body: >
  A pull request's description carries no list of the answers its change wrote
  (#2664, DEC-065). `open-pr`, `edit-pr` and `land-work` write no
  `## Documentation this change affects` section. `open-pr` and `edit-pr` drop
  the region an earlier run wrote from the body they write, with a warning, and
  `land-work` removes one before it stops ready, asks or merges. Only a region
  with both its markers is removed: a section typed under that heading stays,
  and a start marker with no end marker draws a warning. The author's
  `## What changed in each updated document` section stays. `review-work` runs
  the change check at the pull request's head on every move, and refuses each
  document marked `updated` there with no sentence in that section. Under
  `--force`, a change check it cannot run refuses nothing, with a warning.
  `land-work` prints what the person who authorises the merge is told just
  before it stops ready, asks or merges: what changed in each updated document,
  what is left out of date, each answer the change check did not ask for, each
  friction setting changed, and how many files the check could not read. It
  prints no line for any other answer, such as a document still accurate, and
  none of the check's other flags. `show-pr <PR> --field answers` prints the same
  lines, derived at the pull request's head against its base, for anyone not at
  `land-work`. Away from a checkout at that head it starts no program the head
  holds: where an anchor needs its resolver, it says why and exits 2, and says
  that a checkout at the head can read the answers, in a run that starts the
  head's own programs. `done-work`, `merge-pr` and the host's button print
  nothing, so a person merging there runs it. `land-work --yes` now holds at
  `ready:` on an updated document with no sentence, and at a later head on
  something left out of date that the head authorised did not leave.
  `review-work` and `land-work` refuse a sentence that reads as a closing
  reference, as `land-work` did. Three things went with the list: the stop on a
  description too long to hold it, the refusal of a word of the list that reads as a closing reference and of a word
  or sentence that holds an HTML comment's delimiter, and the head its start
  marker named. `edit-pr` derives nothing, so it no longer warns of a missing
  sentence. `open-pr --doc-impact-from-friction` writes a line that counts the
  documents and points at the change check.
