component: software-analysis
kind: minor
custom:
  category: Changed
body: >
  The terms are linked where an actor, a use case, a journey or a
  requirement mentions them, as DEC-004 point 7 decides (#1895). In an
  analysis that keeps a domain model, `pkit analysis link` links the first
  mention of each term in each part of their bodies to the term's glossary
  entry, by a path from the file. A part opens at each heading and each label
  its kind declares, a label your own structures add or relabel included,
  whatever any rule's status. Front matter takes no link. Nor do a use
  case's or a journey's goal, a journey's step lines and an actor's first
  sentence, which say a need, a title and the summary again. An actor's
  name, of the analysis or listed by its glossary's head, holds no mention
  of a term only part of it, in every kind. Whatever any
  rule's status, `pkit analysis validate` reports such a link missing, extra
  or stale, and names the command. So an analysis with a view fails
  validation until you run `pkit analysis link` once. The places of the
  actors, the use cases, the journeys and the requirements declare the
  links' form, so a change that only moves links asks no answer of what
  rests on them.
