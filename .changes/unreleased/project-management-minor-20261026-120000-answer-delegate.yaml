component: project-management
kind: minor
custom:
  category: Added
body: >
  The project manager decides the fixers' proposals in your place where the
  default branch names it your delegate in `friction.delegate` (COR-064). It
  reads every word of each proposal, judges it from what the files hold, and
  accepts, rewords or refuses it without changing its outcome or its diff. The
  pull request that writes them tells you what it decided, and it tells you
  what it refused. It never decides an answer it drafted, a question a fixer
  held, one only an account could settle, a proposal whose type's owner keeps
  its answers for you, or anything else you decide, such as a merge. It
  decides nothing where the project chose no reviewer of the answers. DEC-055
  point 3 and DEC-056 are refined to match, and so are the `fix-drift`
  sub-procedure and the README's "Deciding the proposals".
