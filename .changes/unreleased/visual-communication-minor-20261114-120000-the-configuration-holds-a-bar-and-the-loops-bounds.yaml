component: visual-communication
kind: minor
custom:
  category: Added
body: >
  The configuration holds a project's bar and the bounds of the designer's loop
  (#3222). `bar: {covers: [COMM@2, GRAPHIC@3], at-least: professional}` names the
  rule sets or single rules it covers, each with its set's major, and the grade
  each page and the piece must reach, `professional` or `excellent`.
  `bounds: {to-the-bar: 5, polish: 2}` sets the rounds the loop may run to the
  bar and the rounds of polish, with those two as the schema's default. The
  schema refuses another shape and a grade below `professional`. The check fails
  a bar that covers what the review does not grade (`bar-ungraded`) and one
  whose major for a set differs from the major the project pins for it, or the
  set's own where it pins none (`bar-major`). The capability ships no bar, and a
  configuration without one reads as before.
