component: backbone
kind: patch
custom:
  category: Security
body: >
  The permission decision core no longer allows a Bash command that holds a
  construct its splitter cannot trust, anywhere in the command (ADR-025
  point 2). Those are a quote, a backtick, a `<` / `>` redirection and a `(`,
  which opens `$(…)`, `<(…)`, zsh's `=(…)` and zsh's glob qualifiers. It used
  to look for them only after a leading `cd`. The core now defers such a
  command to the harness, a strict posture denies it, and a deny still wins.
  It also splits a command at a newline and a background `&`, and keeps an
  assignment such as `X=$(./x.sh)` as a segment that needs a grant. So where
  `gh` is granted, `gh pr list > ~/.bashrc`, `gh pr list $(python3 x.py)` and
  `gh pr list & python3 x.py` are no longer allowed unasked. **A quoted
  argument is deferred too,** such as `git commit -m "fix: x"`, so the
  harness's own allow list decides it. Claude Code's adapter baseline allows
  `git`, `gh` and `pkit` by prefix, so those still run unasked there, while a
  quoted `docker` command is now asked about.
