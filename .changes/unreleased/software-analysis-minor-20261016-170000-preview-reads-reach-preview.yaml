component: software-analysis
kind: minor
custom:
  category: Changed
  requires_backbone: release
body: >
  `pkit analysis validate --preview` places a project's group whose rule, or a
  rule it fills, is proposed where the rule would bind if every proposed rule
  were accepted, as `pkit rule-sets reach --preview` reads it (DEC-001 point 1,
  #1607). What the group finds there is a report opening `preview:`. What binds
  without the preview still comes from `pkit rule-sets reach` without it, so
  the exit stays the normal check's. The check no longer reports such a group
  as not previewed, and reads a fill's chain on an artefact from the backbone
  alone. A group whose accepted rule binds on no artefact of its kind, because
  a rule it fills is proposed, is reported as binding on none, the report
  naming that cause. A group of the record's kind binds as it did. The preview
  reads `pkit rule-sets reach --preview`, which only the backbone this release
  ships has, so the capability requires it.
