component: visual-communication
kind: none
body: >
  DEC-071 proposes how the designer starts a new piece, or a whole piece
  redesigned (#3482): a sketch of every page, drawn outside the engine by a
  fresh session the designer starts, from the piece's words, its takeaways
  and where it is shown alone, with no method, no library and no brand. The
  designer rebuilds the sketch at once by its method, with the piece's brand
  and the project's libraries, draws the nearest that keeps the meaning of a
  part they cannot carry, and reports that part as a need on what lacks it.
  DEC-070's one round then runs on the rebuilt piece, and the person sees the
  sketch beside it at the ship call. It is a design-ahead record: the
  designer's definition, the build skill, the capability's pages and UC-111
  follow in slices under #3468 once it is accepted. No surface moves here.
