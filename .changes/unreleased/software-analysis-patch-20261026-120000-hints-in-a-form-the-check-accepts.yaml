component: software-analysis
kind: patch
custom:
  category: Fixed
body: >
  A freshly stamped analysis artefact tells its writer once what to write
  (#2088). `pkit analysis validate` reports a part that still holds its hint
  once, by the placeholder check, and no longer also as empty or missing where
  the format rule binds. Each hint's example is now written in a form the check
  accepts. The hint of a use case's *Main path*, and of a use case's or a
  journey's *Variants*, stands on a line of its own below its label, where the
  list goes, and its example is the list's first item. So a writer who puts the
  example in the hint's place writes a list item the check reads.
