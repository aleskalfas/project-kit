component: visual-communication
kind: minor
custom:
  category: Added
body: >
  `pkit visual add` replaces a copy not yet released under a lock that moves
  only on purpose once the person names each such lock (#2608, DEC-013 point
  5): `--piece <name>` names a pinned draft, and `--declaration <name>` a
  declaration of written code. Naming it is the move on purpose: the lock keeps
  its number, and no `piece.yaml` and no declaration is written. With any left
  unnamed, the copy stays as it is, the command names those left, and the run
  goes on. A run that leaves such a copy shows what replacing it would change.
  It draws a pinned draft's scenes both ways, under `before-after/<piece>/` in
  the clone's local folder, and prints the difference in the code a
  declaration's writer writes. It prints the line that names them all. A piece
  or a declaration named that locks no copy the run would replace is refused,
  naming what it locks. The command now takes the dependencies of drawing and
  of reading a declaration.
