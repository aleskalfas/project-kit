component: backbone
kind: patch
custom:
  category: Fixed
body: >
  Installing pkit from a release, or running one as a project's pinned or
  candidate release, works on a machine where mise supplies `git` or `sed`
  through its shims. The release's download holds no mise configuration: the
  `mise.toml` that mise read there and refused as untrusted is gone. Releases
  before this one still hold `mise.toml`: on such a machine, setting the
  environment variable `MISE_IGNORED_CONFIG_PATHS` to uv's cache folder, such
  as `export MISE_IGNORED_CONFIG_PATHS="$HOME/.cache/uv"` in the shell's
  profile, lets uv's downloads of them work.
