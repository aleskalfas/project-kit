pkit_schema: visual-communication:piece
schema_version: 1

# A site that draws every web part of the starter (DEC-022 point 4): a header with its
# navigation, a page of sections, a form and a table, and a section as its footer. Drawn
# at each size the test brand gives, in English and in German, and under the neutral brand
# with no content file changed.
top: foundations/site
brand: test-brand
languages: [en, de]
audience: The capability's tests, which draw every web part in one site.
shown: In the capability's tests, as a site of every web part.
explains: false
exports: [svg]
state: draft
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
  device: [desktop, tablet, phone]
lock:
  foundations: 1.1.0
  starter: 1.1.0
  test-brand: 1.1.0
