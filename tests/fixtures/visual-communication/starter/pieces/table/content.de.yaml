pkit_schema: visual-communication:content
schema_version: 1

pages:
  - id: head
    layout: standard
    main:
      use: starter/table
      head: Was jede Veröffentlichung brachte
      rows:
        - id: names
          cells:
            - {id: version, span: narrow, head: Nr.}
            - {id: what, head: Was sie brachte}
            - {id: who, span: wide, head: Wer sie liest}
        - id: first
          cells:
            - {id: version, span: narrow, text: "1.0"}
            - {id: what, text: "Die Karten, die Listen und die Pfeile einer Folie."}
            - id: who
              span: wide
              text: Wer eine Präsentation oder eine Abbildung zeichnet, und wer sie gegen die Marke prüft.
        - id: second
          cells:
            - {id: version, span: narrow, text: "1.1"}
            - {id: what, text: "Die Teile einer Webseite, in jeder Größe."}
            - {id: who, span: wide, text: Wer eine Website zeichnet.}

  - id: bare
    layout: standard
    main:
      use: starter/table
      rows:
        - id: names
          cells:
            - {id: size, head: Größe}
            - {id: width, head: Breite}
        - id: phone
          cells:
            - {id: size, text: Telefon}
            - {id: width, text: So breit wie ein aufrecht gehaltenes Telefon.}

  # Ohne eigenen Einzug, wie auf einer Folie, deren Rand die Folie hält: Kopf und Zeilen
  # reichen an die Kanten des Raums, den die Tabelle bekommt.
  - id: no-inset
    layout: standard
    main:
      use: starter/table
      inset: none
      head: Wo die Zeilen einer Tabelle stehen
      rows:
        - id: names
          cells:
            - {id: place}
            - {id: rows, head: Ihre Zeilen}
            - {id: inset, head: Ihr Einzug}
        - id: page
          cells:
            - {id: place, head: Eine Webseite}
            - {id: rows, text: Im Einzug der Tabelle.}
            - {id: inset, text: Der Einzug der Tabelle.}
        - id: slide
          cells:
            - {id: place, head: Eine Folie}
            - {id: rows, text: Auf dem Folienrand.}
            - {id: inset, text: Der Rand der Folie.}
