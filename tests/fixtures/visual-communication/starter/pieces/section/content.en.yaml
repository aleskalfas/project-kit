pkit_schema: visual-communication:content
schema_version: 1

pages:
  - id: right
    layout: standard
    main:
      use: starter/section
      head: Every rule in one place
      text: >-
        A project writes each of its rules down once, where every agent and every person
        who works on it reads the same words.
      picture: window.png

  - id: left
    layout: standard
    main:
      use: starter/section
      fill: tint
      side: left
      head: Applied by the tools
      text: >-
        The tools read the rules and apply them, so no one has to remember a rule for it
        to hold.
      picture: window.png

  - id: words
    layout: standard
    main:
      use: starter/section
      side: left
      head: No picture
      text: >-
        A section that names no picture holds its words alone, at the start of the page,
        whichever side it gives.
