pkit_schema: visual-communication:content
schema_version: 1

slides:
  - id: session
    layout: slide
    title: A terminal's session, its prompts, its commands and its comments
    visual:
      use: starter/list
      widths: own
      item: {use: starter/code}
      items:
        - id: install
          head: Install it once
          text:
            - {text: "# once, on your machine\n", style: comment}
            - {text: "$ ", style: prompt}
            - {text: "uv tool install pkit\n", style: command}
            - {text: "$ ", style: prompt}
            - {text: "pkit --version\n", style: command}
            - "pkit 2.0.0"
        - id: status
          head: What the status shows
          text:
            - {text: "$ ", style: prompt}
            - {text: "pkit status\n", style: command}
            - "  Connections\n"
            - "    roles   3 named: 3 active\n"
            - "    points  6 defined: 2 unfilled"

  - id: file
    layout: slide
    title: A file's text, with no head, each line as written
    visual:
      use: starter/list
      widths: own
      item: {use: starter/code}
      items:
        - id: tree
          text:
            - "your-project/\n"
            - "├── .pkit/"
            - {text: "              # the methodology\n", style: comment}
            - "│   ├── decisions/"
            - {text: "      # choices, and why\n", style: comment}
            - "│   └── rules/"
            - {text: "          # what to do\n", style: comment}
            - "└── src/"
            - {text: "                # your code, untouched", style: comment}
        - id: plain
          text: "name: starter\nversion: 1.0.0\nkind: components"

  - id: signs
    layout: slide
    title: Its concept's sign ends its head's row, and a plain run starts with its own
    visual:
      use: starter/list
      widths: own
      item: {use: starter/code}
      items:
        - id: head
          concept: test-notation/person
          head: A person's file
          text:
            - "owner: "
            - {text: "ada", concept: test-notation/person}
            - "\nsince: 2024"
        - id: text
          concept: test-notation/person
          text:
            - "reviewer: "
            - {text: "grace", concept: test-notation/person}
