pkit_schema: visual-communication:content
schema_version: 1

slides:
  - id: stack
    layout: slide
    title: Ebenen übereinander gestapelt, die oberste zuerst, jede eine Stufe der Reihenfolge
    visual:
      use: starter/layers
      levels:
        - id: decisions
          head: Entscheidungen
          text: Getroffene Entscheidungen und ihre Begründung.
        - id: rules
          head: Arbeitsregeln
          text: Genau, was zu tun ist, für jede Sitzung und jedes Werkzeug.
        - id: commands
          head: Befehle und Prüfungen
          text: Setzen um, was entschieden ist, und prüfen jede Änderung.
        - id: work
          head: Quellcode und Dokumente
          text: Die Arbeit selbst, verknüpft mit ihren Abhängigkeiten.

  - id: tinted
    layout: slide
    title: Jede Ebene getönt nach dem Begriff, den sie nennt, ohne Schattierung nach ihrem Platz
    visual:
      use: starter/layers
      shade: plain
      levels:
        - id: people
          concept: test-notation/person
          head: Menschen
          text: Wer die Arbeit anfordert.
        - id: services
          concept: test-notation/service
          head: Dienste
          text: Was ihnen antwortet.
        - id: stores
          concept: test-notation/store
          head: Datenspeicher
          text: Wo liegt, was sie aufbewahren.

  - id: notes
    layout: slide
    title: Je eine Notiz auf jeder Seite des Stapels gilt über alle seine Ebenen hinweg
    visual:
      use: starter/layers
      level: {use: starter/card, fill: tint, concept: test-notation/service}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          head: Entscheidungen
          text: Getroffene Entscheidungen und ihre Begründung.
        - id: rules
          head: Arbeitsregeln
          text: Genau, was zu tun ist.
        - id: work
          head: Quellcode
          text: Die Arbeit selbst.
      left-notes:
        - id: carried-out
          head: Umgesetzt
          text: Jede Ebene setzt die darüberliegenden Ebenen um.
      notes:
        - id: checked
          head: Überprüft
          text: Eine abweichende Ebene wird zuerst überprüft.

  - id: steps
    layout: slide
    title: Stufen, die sich nach oben verjüngen, an ihrer Kante mit einer Notiz verbunden
    visual:
      use: starter/layers
      shape: steps
      level: {use: starter/card, fill: tint, concept: test-notation/service}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          head: Entscheidungen
        - id: rules
          head: Arbeitsregeln
        - id: commands
          head: Befehle und Prüfungen
        - id: work
          head: Quellcode und Dokumente
      notes:
        - id: start
          head: Wo Ideen entstehen
          text: Im Gespräch, und in einer Notiz, wenn eine länger braucht.
      ties:
        - id: start-decisions
          from: {item: "notes[start]"}
          to: {item: "levels[decisions]"}

  - id: leaders
    layout: slide
    title: Notizen auf beiden Seiten der Stufen, jede mit einer dünnen Linie an das gebunden, was sie erklärt
    visual:
      use: starter/layers
      shape: steps
      tie: {use: starter/connector, weight: thin, arrow: none}
      levels:
        - id: decisions
          head: Entscheidungen
        - id: rules
          head: Arbeitsregeln
        - id: commands
          head: Befehle und Prüfungen
        - id: work
          head: Quellcode und Dokumente
      left-notes:
        - id: consulted
          head: Bei jeder Änderung befragt
          text: Die Entscheidungen, auf denen sie beruht, und die Prüfungen, die sie bestehen muss.
      notes:
        - id: loaded
          head: In jede Sitzung geladen
          text: Die Regeln, denen jeder Agent folgt.
      ties:
        - id: consulted-decisions
          from: {item: "left-notes[consulted]"}
          to: {item: "levels[decisions]"}
        - id: consulted-commands
          from: {item: "left-notes[consulted]"}
          to: {item: "levels[commands]"}
        - id: loaded-rules
          from: {item: "notes[loaded]"}
          to: {item: "levels[rules]"}
