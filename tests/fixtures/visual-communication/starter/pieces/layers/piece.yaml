pkit_schema: visual-communication:piece
schema_version: 1

# The layers' reference renders (DEC-007 point 3): levels alone, tinted by the concepts
# they name, and with notes beside them, as the talk's slide of how the parts fit
# together draws them, in English and in German, whose compound words and diacritics
# stress its text. It has no option and no field of runs; its ties are the connector's
# renders. Pinned with the test brand, the starter and the test notation, so only a
# person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the layers against their job and their form.
shown: In the capability's tests, as the layers' reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
