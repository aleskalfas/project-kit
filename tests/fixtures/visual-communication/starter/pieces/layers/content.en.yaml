pkit_schema: visual-communication:content
schema_version: 1

slides:
  - id: stack
    layout: slide
    title: Levels stacked one on another, the top first, each a step of the order
    visual:
      use: starter/layers
      levels:
        - id: decisions
          head: Decisions
          text: Choices you accepted, and why.
        - id: rules
          head: Working rules
          text: Exactly what to do, for every session and tool.
        - id: commands
          head: Commands and checks
          text: Carry out what is decided, and check every change.
        - id: work
          head: Your code and documents
          text: The work itself, tied to what it depends on.

  - id: tinted
    layout: slide
    title: Each level tinted by the concept it names, with no shade by its place
    visual:
      use: starter/layers
      shade: plain
      levels:
        - id: people
          concept: test-notation/person
          head: People
          text: Who asks for the work.
        - id: services
          concept: test-notation/service
          head: Services
          text: What answers them.
        - id: stores
          concept: test-notation/store
          head: Stores
          text: Where what they keep lies.

  - id: notes
    layout: slide
    title: A note on each side of the stack holds across all its levels
    visual:
      use: starter/layers
      level: {use: starter/card, fill: tint, concept: test-notation/service}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          head: Decisions
          text: Choices you accepted, and why.
        - id: rules
          head: Working rules
          text: Exactly what to do.
        - id: work
          head: Your code
          text: The work itself.
      left-notes:
        - id: carried-out
          head: Carried out
          text: Each level carries out the ones above it.
      notes:
        - id: checked
          head: Checked
          text: A level that disagrees is checked first.

  - id: steps
    layout: slide
    title: Steps that narrow to the top, tied from a note at their edge
    visual:
      use: starter/layers
      shape: steps
      level: {use: starter/card, fill: tint, concept: test-notation/service}
      note: {use: starter/card, bar: left}
      levels:
        - id: decisions
          head: Decisions
        - id: rules
          head: Working rules
        - id: commands
          head: Commands and checks
        - id: work
          head: Your code and documents
      notes:
        - id: start
          head: Where ideas start
          text: In conversation, and in a note when one needs longer.
      ties:
        - id: start-decisions
          from: {item: "notes[start]"}
          to: {item: "levels[decisions]"}

  - id: leaders
    layout: slide
    title: Notes on both sides of the steps, each tied by a thin leader to what it explains
    visual:
      use: starter/layers
      shape: steps
      tie: {use: starter/connector, weight: thin, arrow: none}
      levels:
        - id: decisions
          head: Decisions
        - id: rules
          head: Working rules
        - id: commands
          head: Commands and checks
        - id: work
          head: Your code and documents
      left-notes:
        - id: consulted
          head: Consulted on every change
          text: The decisions it rests on, and the checks it must pass.
      notes:
        - id: loaded
          head: Loaded into every session
          text: The rules each agent follows.
      ties:
        - id: consulted-decisions
          from: {item: "left-notes[consulted]"}
          to: {item: "levels[decisions]"}
        - id: consulted-commands
          from: {item: "left-notes[consulted]"}
          to: {item: "levels[commands]"}
        - id: loaded-rules
          from: {item: "notes[loaded]"}
          to: {item: "levels[rules]"}
