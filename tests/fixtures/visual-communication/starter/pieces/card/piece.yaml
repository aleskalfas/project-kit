pkit_schema: visual-communication:piece
schema_version: 1

# The card's reference renders (DEC-007 point 3): each word of each of its options, and
# each run word of its text, drawn once, and the sign of a concept that has one, at the
# end of its head's row and before a run that names it, in English and in German, whose
# compound words and diacritics stress its text. Pinned with the test brand, the starter
# and the test notation, so only a person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the card against its job and its form.
shown: In the capability's tests, as the card's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
