pkit_schema: visual-communication:content
schema_version: 1

slides:
  - id: straight
    layout: slide
    title: Ein gerader Verbinder, seine Pfeilspitze am Ende oder am Anfang
    visual:
      use: piece/rows
      upper:
        - id: ideas
          head: Ideenfindung
          text: Im Gespräch oder in einer Notiz.
        - id: decisions
          head: Entscheidungen
          text: Getroffene Entscheidungen.
        - id: review
          head: Überprüfung
          text: Jede Änderung wird erneut gelesen.
      lower:
        - id: checks
          head: Prüfungen
          text: Laufen bei jeder Änderung.
        - id: rules
          head: Arbeitsregeln
          text: Genau, was zu tun ist.
        - id: work
          head: Quellcode
          text: Die Arbeit selbst.
      ties:
        - id: ideas-decisions
          from: {item: "upper[ideas]"}
          to: {item: "upper[decisions]"}
        - id: work-decisions
          from: {item: "lower[work]"}
          to: {item: "upper[decisions]"}
          arrow: start

  - id: corners
    layout: slide
    title: Ein Verbinder mit Ecken, Pfeilspitzen an beiden Enden oder an keinem
    visual:
      use: piece/rows
      tie: {use: starter/connector, route: corners}
      upper:
        - id: ideas
          head: Ideenfindung
          text: Im Gespräch oder in einer Notiz.
        - id: decisions
          head: Entscheidungen
          text: Getroffene Entscheidungen.
        - id: review
          head: Überprüfung
          text: Jede Änderung wird erneut gelesen.
      lower:
        - id: checks
          head: Prüfungen
          text: Laufen bei jeder Änderung.
        - id: rules
          head: Arbeitsregeln
          text: Genau, was zu tun ist.
        - id: work
          head: Quellcode
          text: Die Arbeit selbst.
      ties:
        - id: ideas-rules
          from: {item: "upper[ideas]"}
          to: {item: "lower[rules]"}
          arrow: both
          concept: test-notation/service
        - id: review-rules
          from: {item: "upper[review]"}
          to: {item: "lower[rules]"}
          arrow: none
