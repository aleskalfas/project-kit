pkit_schema: visual-communication:piece
schema_version: 1

# The connector's reference renders (DEC-007 point 3): each word of each of its options
# drawn once, in its default family and in a concept's, in English and in German, whose
# compound words and diacritics stress the text around it. It has no field of runs. The
# connector routes around nothing, so its ties join cards the piece's own pattern `rows`
# sets well apart, each line clear of every card but its ends: across, down and aslant.
# Pinned with the test brand, the starter and the test notation, so only a person moves
# what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the connector against its job and its form.
shown: In the capability's tests, as the connector's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
