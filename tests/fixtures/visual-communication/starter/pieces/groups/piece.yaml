pkit_schema: visual-communication:piece
schema_version: 1

# The groups' reference renders (DEC-007 point 3): groups side by side, in their default
# family and tinted by the concepts they name, and the component field `group` naming the
# block for every group, in English and in German, whose compound words and diacritics
# stress its text. It has no option and no field of runs. Pinned with the test brand, the
# starter and the test notation, so only a person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the groups pattern against its job and its form.
shown: In the capability's tests, as the groups pattern's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
