pkit_schema: visual-communication:piece
schema_version: 1

# The reference renders of the form (DEC-007 point 3): a form with a head and two buttons,
# and one with neither, in English and in German, whose compound words stress its text, at
# each size the test brand gives. Pinned with the test brand and the starter, so only a
# person moves what they draw.
top: foundations/site
brand: test-brand
languages: [en, de]
audience: The starter's owner, who reviews the form against its job and its form.
shown: In the capability's tests, as the reference renders of the form.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
  device: [desktop, tablet, phone]
lock:
  foundations: 1.1.0
  starter: 1.1.0
  test-brand: 1.1.0
