pkit_schema: visual-communication:piece
schema_version: 1

# The network's reference renders (DEC-007 point 3): each word of its option drawn once,
# ties from cards to the items of a group that a pattern of groups in a column draws, and
# ties with corners across three columns, in English and in German, whose compound words
# and diacritics stress its text. It has no field of runs. The connector routes around
# nothing, so each tie runs in the lane between two columns, clear of every item but its
# ends and what holds them. Pinned with the test brand, the starter and the test notation,
# so only a person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the network against its job and its form.
shown: In the capability's tests, as the network's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
