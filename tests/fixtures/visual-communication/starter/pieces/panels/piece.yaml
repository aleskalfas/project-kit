pkit_schema: visual-communication:piece
schema_version: 1

# The panels' reference renders (DEC-007 point 3): each word of its span drawn, a network
# beside a code block, a component under the panels, and a panel that holds panels of its
# own, as the talk's slides of installing and connecting draw them, in English and in
# German, whose compound words and diacritics stress its text. It has no option and no
# field of runs. Pinned with the test brand, the starter and the test notation, so only a
# person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the panels pattern against its job and its form.
shown: In the capability's tests, as the panels pattern's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
