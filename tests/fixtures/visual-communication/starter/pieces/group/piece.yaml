pkit_schema: visual-communication:piece
schema_version: 1

# The group's reference renders (DEC-007 point 3): a head, a tag and its items, each where
# given, in its default family and in a concept's, its items drawn by the card and by a
# component the content names, in English and in German, whose compound words and
# diacritics stress its text. It has no option and no field of runs. Pinned with the test
# brand, the starter and the test notation, so only a person moves what they draw.
top: foundations/deck
brand: test-brand
notations: [test-notation]
languages: [en, de]
audience: The starter's owner, who reviews the group against its job and its form.
shown: In the capability's tests, as the group's reference renders.
explains: false
exports: [svg]
state: draft
pinned: true
modes:
  colour-scheme: [light, dark]
  contrast: [standard, high]
lock:
  foundations: 1.0.0
  starter: 1.0.0
  test-brand: 1.0.0
  test-notation: 1.0.0
