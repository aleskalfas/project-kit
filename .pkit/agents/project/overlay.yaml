# Adopter overlay (per COR-013). project-kit is its own first adopter,
# so this file populates the agent-template categories with values
# meaningful for the methodology source itself. Adopting projects ship
# their own overlay with project-specific paths.

workflow-docs:
  - CONTRIBUTING.md

project-root-docs:
  - CLAUDE.md
  - CONTRIBUTING.md

# Architecture documentation roots (per COR-024). project-kit's
# architectural surface is distributed across CONTRIBUTING.md,
# and the COR records. Adopters with conventional doc layouts will
# point these at tech-docs/architecture/ and tech-docs/architecture/decisions/.
architecture-docs:
  - CONTRIBUTING.md
  - .pkit/decisions/core/

# ADR records (per COR-024 + COR-025). Project-kit has adopted ADRs for
# its architectural decisions per PRJ-005; records land here.
adr-records:
  - tech-docs/architecture/decisions/

# The conventions corpus (per software-engineering DEC-001 point 2 and
# ADR-013). The software-engineer writes code to it, and the code-review
# panel's reviewers judge changes by its rules (software-engineering DEC-002
# point 4), so it names one page of coding conventions and nothing else
# (PRJ-013 point 4).
project-conventions:
  - tech-docs/coding-conventions.md

# Process-authoring targets (per ADR-051) — the `process-author` agent's write
# authority, file by file (the agents README, "Write-carrying categories").
# project-kit ships the process substrate and its definitions, so the
# definitions of the capabilities it ships are not named here. The one grant is
# lean-business's (#3426, the person's decision 15 in its design note): its three
# process definitions, their predicate scripts and the module that works out
# each subject's position. The capability incubates here unregistered, so its
# folder is the project's, and the grant holds only while it stays so. Its
# `package.yaml` is never named: registering a predicate is the process
# commands' stamp.
process-authoring-targets:
  - .pkit/capabilities/lean-business/schemas/desk-stage.yaml
  - .pkit/capabilities/lean-business/schemas/experiment-lifecycle.yaml
  - .pkit/capabilities/lean-business/schemas/cycle-lifecycle.yaml
