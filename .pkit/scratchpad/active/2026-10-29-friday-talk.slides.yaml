  minutes: 1.5
  notes: 'pkit init writes pkit''s files into .pkit/, merges your AI tool''s settings without overwriting them,
    and installs the skills and agents where Claude Code reads them. Today that is Claude Code. A sync refreshes
    only pkit''s own entries; your agents, skills and settings stay. In a newcomer''s
    trial run, the setup committed 689 files for a 4-file project. What sits in the agent''s context: one rules
    file, and one line per skill and agent.'
- id: ideas
  part: P1
  title: Where ideas start
  message: In conversation. A scratchpad note keeps what you agreed past the session, until it becomes records, issues
    or docs.
  problem: ''
  does: []
  show: 'In project-kit: 28 notes done, which became 41 records, 31 issues and 15 docs'
  visual:
    kind: ideas
    font_size: 26
    conversation:
      icon: row-chat
      head: A conversation
      text: You and the agent work an idea out, until the session ends or its context fills.
      text_h: 150
    note:
      icon: row-doc
      head: A scratchpad note
      text: Keeps what you agreed. It waits without a deadline, and the next session reads it.
      terminal: |-
        .pkit/scratchpad/active/
          2026-10-29-friday-talk.md
        # this talk: each new session
        # began by reading its hand-off
    becomes_head: When it is done, it becomes
    becomes:
    - head: Decision records
      text: COR-041 and ADR-040, from a note of 3 July
    - head: Issues
      text: '14 issues: one big feature, planned'
    - head: Docs
      text: 10 use cases and 2 journeys, from one note
    dropped:
      text: Or dropped, kept with why it did not pan out.
  limit: 'Nothing writes the note for you: what stays only in the conversation is lost with it.'
  minutes: 1
  notes: 'Everyone here has hit the context limit. This talk is itself a scratchpad note: it was built over several
    sessions, and each new one began by reading the note''s hand-off. A note can wait: 14 of the 33 active ones
    have been open since May or June, and that is fine. The folder is the note''s state (COR-012): pkit new
    scratchpad <slug> starts one in .pkit/scratchpad/active/, pkit scratchpad done <slug> --produced <ref>
    moves it to done/ and lists what it became, pkit scratchpad drop moves it to dropped/. It is a file in the
    repository, not a chat or a tool''s memory, so colleagues and every agent read the same note, and a done
    note stays as the story of how a decision was reached. The 28 done notes also produced a schema, a pull
    request and a milestone. COR-041 and ADR-040 come back under the release guide. Next: what a record is.'
- id: decisions
  part: P1
  title: Decision records
  message: A decision record keeps one choice and why it was made. Where it lives says what it is about, and who
    may change it.
  problem: ''
  does: []
  show: 'This week: COR-065 overturned a sentence of COR-006, by a new record, not an edit'
  visual:
    kind: kinds
    groups:
    - head: How work is done
      path: .pkit/decisions/
      kinds:
      - tag: COR
        tone: pkit
        head: pkit's principles
        text: How the method works, the same in every project.
        path: core/COR-065-records-and-projection.md
        why: 'Apart from yours: each upgrade replaces them, so you never edit them.'
      - tag: PRJ
        tone: yours
        head: Your way of working
        text: How your team works, in the choices pkit leaves to you.
        path: project/PRJ-002-version-bump-policy.md
        why: 'Yours alone: no upgrade ever writes here.'
    - head: What you build, at a path you choose
      path: docs/architecture/decisions/
      kinds:
      - tag: ADR
        tone: architecture
        head: Your architecture
        text: How your system is built, its structure, technologies and boundaries.
        path: ADR-001-project-root-resolution.md
        why: 'Apart from how you work: they sit with your system''s docs, where its architect keeps them.'
  limit: 'Writing and reviewing a record takes time: worth it only for choices that bind later work.'
  minutes: 1.5
  notes: 'Two questions give the three places: what the record is about, how work is done or what you build, and
    who may change it, pkit or you. pkit never decides your architecture, so there is no fourth. pkit''s principles
    change by a new record you can read, never by a quiet edit: 39 in June, 67 now, and this week COR-065 overturned
    a sentence of COR-006. In project-kit itself, 11 PRJ and 74 ADR. The next slide follows one of them
    through its life. Add-ons bring decision records of their own; they come with the capabilities. Unfinished ideas live in
    scratchpad notes, which may contradict and be dropped: this talk is one.'
- id: found
  part: P1
  title: Decided once, found later
  message: You accept a choice before work builds on it, and a later session finds it before changing what it
    governs.
  problem: ''
  does: []
  show: 'This week: ADR-075 decided how every session''s working rules are made, and merged accepted with the code
    that carries it out'
  visual:
    kind: story
    stages:
    - role: agents
      head: The agent drafts it
      text: It writes the record, and ties the release guide to it.
      terminal: |-
        $ cat .pkit/decisions/project/PRJ-002-….md
        id: PRJ-002
        title: Version-bump policy
        status: proposed    # until you accept it
        ## Context          # why it came up
        ## Decision         # what is decided
        ## Rationale        # why, what was rejected
        ## Implications     # what follows

        # .pkit/release/README.md, its front matter:
          friction:
            anchors:
        +     record: [PRJ-002]
    - role: people
      head: You accept it
      text: You see the record and its tie in the pull request, before it merges.
      terminal: |-
        # the pull request, before it merges:
          .pkit/decisions/project/PRJ-002-….md
        - status: proposed
        + status: accepted

          .pkit/release/README.md
            anchors:
        +     record: [PRJ-002]
    - role: agents
      head: A later session finds it
      text: Before changing a file, the agent looks up its records.
      terminal: |-
        $ pkit refs records-for .pkit/release/README.md
        6 records tied directly:
          PRJ-002  Version-bump policy …
          PRJ-004  Distribution via direct git URL …
          ADR-040  Fetch externally-sourced content …
          COR-010  Lifecycle of installed resources
          …
        # the agent reads these before changing it
    font_size: 24
  limit: Only records tied to a file are found, directly or through a document that depends on it.
  minutes: 1
  notes: 'One record, PRJ-002, through its life: drafted as proposed, accepted in the pull request by one line,
    and found by a later session behind the release guide, beside records of the other two kinds. Accepting is yours:
    a check can refuse to merge a record still proposed, and whoever authorises a merge sees every record it accepts.
    The agent ties the release guide to the record as it drafts it, since the guide carries the record out: a change
    to PRJ-002 then asks whether the guide still holds, the docs slide shows how, and the lookup reads the same tie
    backwards. In project-kit the tie was written when the guide became such a document. Before changing a file,
    the agent runs this lookup, one of the working rules every session is told. A choice made in a chat is gone the
    next session; a record is found.'
- id: sessions
  part: P1
  title: What every session is told
  message: A few short rules on how to work, pkit's and yours. Each rule names the decision behind it.
  problem: ''
  does: []
  show: 'This week: each rule got a permanent id and a status, and the file every session loads is generated from them'
  visual:
    kind: rules
    center: 868
    top_w: 1000
    step: 240
    level_h: 200
    levels:
    - head: The decision (COR-065)
      text: An agent reads the records only when it changes something, not in every session.
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: The rule every session gets (rule 22)
      text: Before you change files, read the records behind them.
      fill: '#6929C4FF'
      ink: '@text_on_color'
    - head: What the agent does
      text: That is why, on the slide before, it looked up the release guide's records.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    font_size: 28
    terminal:
    - - - '# loaded at the start of every session'
        - comment
    - - - .pkit/rules/core.md
        - pkit
      - - '      # pkit''s, in every project'
        - comment
    - - - .pkit/rules/project.md
        - yours
      - - '   # yours, never touched by pkit'
        - comment
    - []
    - - - '# looked up when needed'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' refs records-for <files>'
        - args
      - - '  # the records behind'
        - comment
    - - - '                                 # what it changes'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' rule-sets reach <paths>'
        - args
      - - '   # rules about what'
        - comment
    - - - '                                 # it writes'
        - comment
  limit: 'A rule is advice: an agent can still break it.'
  minutes: 1.5
  notes: 'Records are many, and read when something changes: the slide before. A few rules on how to act are loaded
    into every session instead, and each points to the decision it carries out. Rule 22 is why the agent looked
    up the release guide''s records; it carries out COR-065 point 7, the record behind the pyramid. Each rule has
    a permanent id, a status and an origin, the record it carries out or the dated words of whoever decided it,
    and a changed record asks its rules to recheck (COR-068, ADR-075, on main since 29 October). Your
    project.md is yours; sync never touches it. Rules about particular files, such as Python code rules, are
    not loaded: they are rule sets scoped to those files, looked up with pkit rule-sets reach and checked by a
    reviewer at merge (#2273 and #2274, in review). Also in review: a size budget pkit validate checks (#2262),
    and a rule on when a decision record starts (#2258). Next: each installed capability brings its own rules,
    loaded while it is installed (#2269, shown with the capabilities), and the rules trimmed to a sentence or
    two each (#2261). Today: 22 rules, about 2,800 words, in every session. Next slide: what must hold becomes
    data a tool checks.'
- id: schemas
  part: P1
  title: Rules and processes as data
  message: 'Rules precise enough for a program are data the tools read, and a staged process is data too: every
    move is checked and logged.'
  problem: A rule only in prose is applied differently by each script; a rule only in code is invisible.
  does:
  - A decision says why; the data says exactly what
  - Every move is checked, and logged with why
  show: 'This week: who may move an issue back, and how strictly, is two settings in workflow.yaml'
  visual:
    kind: lifecycle
    stages:
    - role: agents
      head: Todo
      text: Filed, not yet scheduled.
    - role: people
      head: Backlog
      text: You scheduled it into a milestone.
    - role: agents
      head: In Progress
      text: Someone is working on it.
    - role: checks
      head: Review
      text: A pull request is open and checked.
    - role: people
      head: Done
      text: Merged on your yes, or closed by you.
    code: "# workflow.yaml (project-management)\n- from: in-progress\n  to: backlog\n  authorisation: user\n  severity:\
      \ hard-reject\n"
  limit: Two processes run on it so far; whether it fits a third kind of work is untested.
  minutes: 2
  notes: 'The YAML is the rule; a JSON Schema checks its shape. 37 of them: the engine''s rules, a project''s settings,
    kinds of document, how capabilities plug in, permissions. Two uses today, project-management''s issue lifecycle
    among them. A new staged process is a definition, not new machinery.'
- id: skills
  part: P2
  title: Skills and the commands they pair with
  message: A skill carries the judgement; the command it pairs with does the part that must come out the same every
    time.
  problem: Asked to add a record, an agent improvises a number, a layout and a level of care, different each time.
  does:
  - A written procedure an agent follows for one kind of task
  - Only its short description is in every session; the rest loads on use
  show: A record once filed by hand got the wrong number; since then agents must use the skill
  visual:
    kind: compare
    left:
      space: user
      space_label: Skill
      heading: The judgement
      k1: Example
      v1: decision-author
      k2: Carries
      v2: which kind of record, what it must argue, how to word it
    right:
      space: tech
      space_label: Command
      heading: The mechanics
      k1: Example
      v1: pkit new decision
      k2: Carries
      v2: the next number, the file's layout
  limit: 'Nothing checks that the skill was used: the command stamps the file either way.'
  minutes: 2
  notes: Skills and commands turn decisions into one kind of task, done the same way every time.
- id: agents
  part: P2
  title: 'Agents: roles with limits'
  message: 'No agent judges its own work: separate reviewers each catch one kind of failure.'
  problem: One agent doing everything judges its own work, and agrees with itself.
  does:
  - Each role gets only the tools it needs
  - The critic opposes a draft before you see it
  - Reviewers check every change before it merges
  show: 'This week: the critic changed two designs; reviewers caught two doc claims that were no longer true'
  visual:
    kind: actors
    actors:
    - role: people
      icon: people
      name: 'You: decide'
    - role: agents
      icon: agents
      name: 'Builder: writes'
    - role: checks
      icon: checks
      name: 'Critic: reads only'
    - role: checks
      icon: checks
      name: 'Reviewers: can block'
  limit: Every review round costs several agent runs.
  minutes: 2.5
  notes: A builder is the agent that writes code. Each capability brings its own agents. An agent's behaviour is
    designed as scenarios first (storyboards).
- id: permissions
  part: P2
  title: Permissions you write down
  message: What agents may do is your project's written rules, not the tool's guesses.
  problem: 'The AI tool decides action by action: nobody can see its rules, and every role is treated the same.'
  does:
  - 'Always refused, whatever is granted: rm -rf, sudo, force-push'
  - Some raw commands refused, so agents use the ones that check
  - A scratch folder agents never have to ask about
  show: 'This week: a builder''s rm -rf was refused; it asked another agent to run it, and that agent said no'
  visual:
    kind: compare
    left:
      space: user
      space_label: The tool's auto mode
      heading: A guess per action
      k1: Who decides
      v1: the model, each time
      k2: Visible
      v2: 'no'
    right:
      space: tech
      space_label: pkit's permissions
      heading: Rules you write down
      k1: Who decides
      v1: your project, once
      k2: Visible
      v2: 'yes: pkit permissions explain'
  limit: The rules stop ordinary commands, not a determined workaround; the OS sandbox is off on macOS.
  minutes: 2
  notes: Fewer prompts is mostly the tool's job now. pkit adds fixed rules, limits per role, and steering onto the
    checked path.
- id: checked
  part: P2
  title: Checked every time
  message: An agent follows the ties between files without doubting them, so every tie is checked on every change.
  problem: ''
  does: []
  show: In project-kit, this check runs before every push and on every pull request
  visual:
    kind: ties
    center:
    - head: The release guide
      path: .pkit/release/README.md
    - head: Use case UC-008
      path: UC-008-release-backbone.md
      height: 144
    left_head: The code they describe
    right_head: The guide's records
    left:
    - label: release.py
    - label: changesets.py
    - label: versioning.py
    - label: .changie.yaml
    - label: release-pr.yml
    - label: release-tag.yml
    - label: latest_tag.py
      broken: true
      to: [0, 1]
      note: renamed to last_tag.py
    right:
    - label: COR-010  Lifecycle
      tone: pkit
    - label: COR-030  Dependencies
      tone: pkit
    - label: COR-041  External sources
      tone: pkit
    - label: PRJ-002  Versioning
      tone: yours
    - label: PRJ-004  Distribution
      tone: yours
    - label: ADR-040  Fetch at the pin
      tone: architecture
    terminal:
    - - - '$ '
        - prompt
      - - git
        - command
      - - ' mv scripts/latest_tag.py scripts/last_tag.py'
        - args
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' friction check'
        - args
    - - - FINDINGS
        - output
    - - - '  .pkit/release/README.md'
        - args
    - - - '    '
        - output
      - - dead-anchor
        - del
      - - '  path scripts/latest_tag.py'
        - args
    - - - '      matches no file; the diff removed or'
        - output
    - - - '      moved its target'
        - output
    - - - '  tech-docs/analysis/…/UC-008-release-backbone.md'
        - args
    - - - '    '
        - output
      - - dead-anchor
        - del
      - - '  path scripts/latest_tag.py'
        - args
    - - - 'Result: '
        - output
      - - failed
        - del
      - - '   (2 dead anchors)'
        - output
    - - - '# the change fails until both ties follow the file'
        - comment
    font_size: 24
  limit: It checks that every tie leads somewhere, not that the document is still right.
  minutes: 1
  notes: 'The release guide from "Decided once, found later", with the ties its front matter declares: the seven files it
    describes and the six records it carries out. Someone renames scripts/latest_tag.py in a refactor. Two
    documents still name the old file: the guide, and a use case nobody renaming a script would think of.
    Without the check nothing warns: pkit refs records-for scripts/last_tag.py finds no records, so the next
    agent to change the file reads none of the guide''s six, nor the use case''s seven. The change check fails
    the rename and names both documents; the fix is to move the ties with the file. Checked on 29 October in a
    throwaway copy of the repository. A tie that is already dead on main is reported by the whole-repository
    check, pkit friction check --all.'
- id: docs
  part: P2
  title: Docs that know when they're wrong
  message: When code changes, the documents that depend on it are named, not found later by accident.
  problem: Documentation goes stale silently, and you find out when someone acts on it.
  does:
  - Each document declares what it depends on
  - 'The change says, per document: updated, still true, or fixed later'
  - A reviewer checks the answers; what is out of date is counted
  show: 'This week: a builder marked a requirement ''still accurate''; the docs reviewer showed it wasn''t'
  visual:
    kind: code
    code: "# trial run: the greeting in cli.py changed\n$ pkit friction check\n  ACT-cli-user     depends on cli.py\n\
      \  UC-001           depends on cli.py\n  docs/usage.md    depends on cli.py\n3 documents to answer for\n"
  limit: Only documents that declare what they depend on are covered; the rest go stale as before.
  minutes: 2
  notes: Probably pkit's most distinctive idea. 50 deferred answers in project-kit today, all visible.
- id: pm
  part: P3
  title: project-management
  message: You talk to one agent; it plans the work and runs builders in parallel.
  problem: ''
  does: []
  show: 'This week, in one evening: six builders, four pull requests merged'
  visual:
    kind: fanout
    left:
    - role: people
      head: You
      text: Describe the work, approve the plan, say yes to each merge.
    - role: agents
      head: Project-manager agent
      text: Files and plans the work, then starts one builder per task, each in its own copy of the repository.
    middle:
    - icon: agents
      head: 'Builder: task A'
    - icon: agents
      head: 'Builder: task B'
    - icon: agents
      head: 'Builder: task C'
    right:
      role: checks
      head: Reviewers, then merge
      text: Reviewers check each result; on your yes, the agent merges it.
  limit: 'GitHub only, and large: 62 records, 88 commands; you meet it through the agent, not the manual.'
  minutes: 3
  notes: 'Underneath: a structure (EPIC, Feature, Task), a lifecycle with gates, merging with reviewers, planning
    a batch of work in one approval, fixers after a merge, a board. Parallel agents in separate clones also exist,
    still experimental (the last slide). Like every capability, it brings its own decision records (DEC),
    kept beside pkit''s and yours, and replaced by its upgrades.'
- id: se
  part: P3
  title: software-engineering
  message: The builder follows your conventions; its three reviewers join every code merge with nothing to wire.
  problem: An AI writes in its default style, and the code is merged on a glance, or reviewed by its author.
  does:
  - The builder reads your conventions first, then follows them
  - 'Code, security, docs reviewers: each blocks only on what it can prove'
  show: 'This week: the code reviewer blocked code that couldn''t find organisation-owned boards; fixed before merge'
  visual:
    kind: flow
    stages:
    - role: code
      head: software-engineering
      text: Brings the builder and three reviewers.
    - role: neutral
      head: A slot
      text: '"Which reviewers a merge needs": software-engineering fills it.'
    - role: agents
      head: project-management
      text: Requires them on every code change, without naming who.
  limit: With no conventions written down, the builder falls back on generic habits.
  minutes: 2
  notes: 'Capabilities never name each other: one fills a slot another defines. Swap one for another that fills
    the same slot, and nothing connected notices.'
- id: current
  part: P4
  title: Over time
  message: Improvements arrive by one command and never overwrite your files, and three new things already run,
    still being shaped.
  problem: ''
  does: []
  show: 'Coming in 2.0: a migration that keeps each project''s current setup, so nothing changes until you decide'
  visual:
    kind: flow
    stages:
    - role: code
      head: pkit improves
      text: A release with its changelog.
    - role: people
      head: You upgrade
      text: One command, when you choose.
    - role: checks
      head: Migrations repair
      text: Renames and moves brought across, safe to re-run.
    - role: people
      head: You report back
      text: Updates come down, reports go up.
    cards:
    - ident: A
      space: tech
      space_label: software-analysis
      heading: What the software must do
      body: Actors, use cases and requirements, kept true as the code changes.
    - ident: B
      space: user
      space_label: living-docs
      heading: Docs by audience
      body: Every page depends on what makes it true, and agents fix it after a merge.
    - ident: C
      space: tech
      space_label: parallel agents
      heading: Agents in separate clones
      body: A planner and workers, each taking only the work its pool allows.
  limit: ''
  minutes: 2
  notes: 'One version for pkit''s core, one per capability. pkit upgrade replaces only pkit''s files; pkit pin holds
    a version; pkit report sends what hurts upstream. The three cards: Experimental: say so.'
