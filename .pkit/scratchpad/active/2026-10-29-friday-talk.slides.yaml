    the skills and agents where Claude Code reads them. Today that is Claude Code. A sync refreshes only pkit''s own entries;
    your agents, skills and settings stay. In a newcomer''s trial run, the setup committed 689 files for a 4-file project.
    What sits in the agent''s context: one rules file, and one line per skill and agent.'
- id: ideas
  part: P1
  title: Where ideas start
  message: In conversation. A scratchpad note keeps what you agreed past the session, until it becomes records, issues 
    or docs.
  problem: ''
  does: []
  show: 'In project-kit: 28 notes done, which became 41 records, 31 issues and 15 docs'
  visual:
    kind: ideas
    font_size: 26
    conversation:
      icon: row-chat
      head: A conversation
      text: You and the agent shape an idea, until the session ends or its context is full.
      text_h: 150
    note:
      icon: row-doc
      head: A scratchpad note
      text: Keeps what you agreed. It waits without a deadline, and the next session reads it.
      terminal: |-
        .pkit/scratchpad/active/
          2026-06-01-cli-design-conventions.md
        # how should a pkit command be designed?
        # open since June, no deadline
    becomes_head: When it is done, it becomes
    becomes:
    - head: Decision records
      text: COR-041 and ADR-040, from a note of 3 July
    - head: Issues
      text: '14 issues: one big feature, planned'
    - head: Docs
      text: 10 use cases and 2 journeys, from one note
    dropped:
      text: Or dropped, kept with the reason it was dropped.
  limit: 'Nothing writes the note for you: what stays only in the conversation is lost with it.'
  minutes: 1
  notes: 'Everyone here has hit the context limit. A scratchpad note is where what you agreed survives it: the next session
    reads the note. A note can wait: the one shown, on how a pkit command should be designed, has been open since June, as
    have 13 others of the 33 active, and that is fine. The folder is the note''s state (COR-012): pkit new scratchpad <slug>
    starts one in .pkit/scratchpad/active/, pkit scratchpad done <slug> --produced <ref> moves it to done/ and lists what
    it became, pkit scratchpad drop moves it to dropped/. It is a file in the repository, not a chat or a tool''s memory,
    so colleagues and every agent read the same note, and a done note stays as the story of how a decision was reached. The
    28 done notes also produced a schema, a pull request and a milestone. COR-041 and ADR-040 come back under the release
    guide.'
- id: decisions
  part: P1
  title: Decision records
  message: A decision record keeps one choice and why it was made. Where it lives says what it is about, and who may 
    change it.
  problem: ''
  does: []
  show: 'This week: a new record, COR-065, replaced a sentence of COR-006, without editing the old one'
  visual:
    kind: kinds
    groups:
    - head: How work is done
      path: .pkit/decisions/
      kinds:
      - tag: COR
        tone: pkit
        head: pkit's principles
        text: How the method works, the same in every project.
        path: core/COR-065-records-and-projection.md
        why: 'Kept apart from yours: each upgrade replaces them, so you never edit them.'
      - tag: PRJ
        tone: yours
        head: Your way of working
        text: How your team works, in the choices pkit leaves to you.
        path: project/PRJ-002-version-bump-policy.md
        why: 'Yours alone: no upgrade ever writes here.'
    - head: What you build, at a path you choose
      path: docs/architecture/decisions/
      kinds:
      - tag: ADR
        tone: architecture
        head: Your architecture
        text: How your system is built, its structure, technologies and boundaries.
        path: ADR-001-project-root-resolution.md
        why: 'Kept with your system''s docs, where its architect keeps them.'
  limit: 'Writing and reviewing a record takes time: worth it only for choices that later work builds on.'
  minutes: 1.5
  notes: 'Two questions give the three places: what the record is about, how work is done or what you build, and who may change
    it, pkit or you. pkit never decides your architecture, so there is no fourth. pkit''s principles change by a new record
    you can read, never by a quiet edit: 39 in June, 67 now, and this week COR-065 replaced a sentence of COR-006. In project-kit
    itself, 11 PRJ and 74 ADR. Add-ons bring decision records of their own, shown with the capabilities.'
- id: found
  part: P1
  title: Decided once, found later
  message: You accept a decision before work builds on it. Later, an agent finds the decision before changing the files 
    it covers.
  problem: ''
  does: []
  show: 'This week: ADR-075 decided how the rules every session loads are made. It was accepted and merged with its code.'
  visual:
    kind: story
    stages:
    - role: agents
      head: The agent drafts it
      text: It writes the record, and ties the release guide to it.
      terminal: |-
        $ cat .pkit/decisions/project/PRJ-002-….md
        id: PRJ-002
        title: Version-bump policy
        status: proposed    # until you accept it
        ## Context          # why it came up
        ## Decision         # what is decided
        ## Rationale        # why, what was rejected
        ## Implications     # what follows

        # .pkit/release/README.md, its front matter:
          friction:
            anchors:
        +     record: [PRJ-002]
    - role: people
      head: You accept it
      text: You see it before it merges, while it is cheapest to change.
      terminal: |-
        # the pull request, before it merges:
          .pkit/decisions/project/PRJ-002-….md
        - status: proposed
        + status: accepted

          .pkit/release/README.md
            anchors:
        +     record: [PRJ-002]
    - role: agents
      head: A later session finds it
      text: It starts with none of your reasons, so it looks up the records first.
      terminal: |-
        $ pkit refs records-for .pkit/release/README.md
        6 records tied directly:
          PRJ-002  Version-bump policy …
          PRJ-004  Distribution via direct git URL …
          ADR-040  Fetch externally-sourced content …
          COR-010  Lifecycle of installed resources
          …
        # the agent reads these before changing it
    font_size: 24
  limit: Only records tied to a file are found, directly or through a document that depends on it.
  minutes: 1
  notes: 'One record, PRJ-002, through its life: drafted as proposed, accepted in the pull request by one line, and found
    by a later session behind the release guide, beside records of the other two kinds. Accepting is yours: a check can refuse
    to merge a record still proposed, and whoever authorises a merge sees every record it accepts. The agent ties the release
    guide to the record as it drafts it, since the guide carries the record out: a change to PRJ-002 then asks whether the
    guide still holds, the docs slide shows how, and the lookup reads the same tie backwards. In project-kit the tie was written
    when the guide became such a document. Before changing a file, the agent runs this lookup, one of the working rules every
    session is told. A choice made in a chat is gone the next session; a record is found.'
- id: sessions
  part: P1
  title: What every session is told
  message: A few short rules on how to work, pkit's and yours. Records are too many to load, so each rule names the one 
    behind it.
  problem: ''
  does: []
  show: 'This week: each rule got a permanent id and a status. The file every session loads is now generated from the rules.'
  visual:
    kind: rules
    center: 868
    top_w: 1000
    step: 240
    level_h: 200
    levels:
    - head: The decision (COR-065)
      text: An agent reads the records only when it changes something, not in every session.
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: The rule every session gets (rule 22)
      text: Before you change files, read the records behind them.
      fill: '#6929C4FF'
      ink: '@text_on_color'
    - head: What the agent does
      text: Before it changes a file, it runs pkit refs records-for and reads what it lists.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    font_size: 28
    terminal:
    - - - '# loaded at the start of every session'
        - comment
    - - - .pkit/rules/core.md
        - pkit
      - - '      # pkit''s, in every project'
        - comment
    - - - .pkit/rules/project.md
        - yours
      - - '   # yours, never touched by pkit'
        - comment
    - []
    - - - '# looked up when needed'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' refs records-for <files>'
        - args
      - - '  # the records behind'
        - comment
    - - - '                                 # what it changes'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' rule-sets reach <paths>'
        - args
      - - '   # rules about what'
        - comment
    - - - '                                 # it writes'
        - comment
  limit: 'A rule is advice: an agent can still break it.'
  minutes: 1.5
  notes: 'Records are many, and read when something changes. A few rules on how to act are loaded into every session instead,
    and each points to the decision it carries out. Rule 22 is why an agent looks up a file''s records before changing it;
    it carries out COR-065 point 7, the record behind the pyramid. Each rule has a permanent id, a status and an origin, the
    record it carries out or the dated words of whoever decided it, and a changed record asks its rules to recheck (COR-068,
    ADR-075, on main since 29 October). Your project.md is yours; sync never touches it. Rules about particular files, such
    as Python code rules, are not loaded: they are rule sets scoped to those files, looked up with pkit rule-sets reach and
    checked by a reviewer at merge (#2273 and #2274, in review). Also in review: a size budget pkit validate checks (#2262),
    and a rule on when a decision record starts (#2258). Next: each installed capability brings its own rules, loaded while
    it is installed (#2269, shown with the capabilities), and the rules trimmed to a sentence or two each (#2261). Today:
    22 rules, about 2,800 words, in every session.'
- id: skillsfrom
  part: P2
  title: Where skills come from
  message: Each kind of file pkit's decisions define gets a skill for the choices, and a command for the exact part.
  problem: ''
  does: []
  show: 'In project-kit: pkit ships 11 skills, each with its command.'
  visual:
    kind: map
    chip_font: 32
    columns:
    - head: The decision
      text: defines a kind of file
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: The skill
      text: writes one as decided
      fill: '#BE95FFFF'
      cell: name
    - head: The command
      text: creates the file
      fill: '#D4BBFFFF'
      cell: chip
    - head: What you get
      text: a new file, ready to fill in
      fill: '#E8DAFFFF'
    rows:
    - [{head: COR-012, text: Scratchpad notes}, scratchpad-author, pkit new scratchpad, A dated note in active/]
    - [{head: COR-006, text: Decision records}, decision-author, pkit new decision, 'The next number, proposed until you accept
        it']
    - [{head: COR-013, text: Agents}, agent-author, pkit new agent, An agent file in pkit's shape]
    head_h: 136
    row_h: 112
    why:
      head: Why pkit splits the work this way
      items:
      - The reason lives in one place. The skill points to it and never copies it.
      - A command cannot pick a name or write the body. Without a skill, agents skipped the writing rules.
      - An agent can miscount. A record written by hand once got a wrong number.
      - Every file of a kind has the same shape, whoever writes it.
  limit: pkit's skills cover only pkit's own files. For work that keeps coming back in your project, you write your own.
  minutes: 1
  notes: 'Skills in pkit are not written at random. pkit''s decisions define kinds of file: scratchpad notes, decision records,
    agents, migrations and more. Each kind has a skill and a command. 11 such pairs ship with pkit. Why the split: a decision
    holds the reason, in one place, and a skill points to it instead of copying it (COR-006). A command cannot make the choices:
    which kind, a good name, the body, and your review. When no skill existed, agents skipped the writing rules (COR-005).
    A skill alone is not enough either: an agent can miscount, and a record written by hand once got a wrong number (COR-005,
    PR #16). So numbers, layout and names go in a command. Work that comes back two or three times gets a tool, so it costs
    less and comes out the same each time (COR-007). A skill names the decisions it follows in its first lines, and pkit validate
    checks those names. Your own skills go in .pkit/skills/project/, beside pkit''s, and a sync never changes them.'
- id: skills
  part: P2
  title: One skill, step by step
  message: The agent follows the steps in order. At step 6 it runs the command, so the number and the layout are always 
    right.
  problem: ''
  does: []
  show: 'Every session holds only each skill''s short description. The steps load when the task comes up.'
  visual:
    kind: checklist
    head: 'The skill decision-author: a new decision record'
    steps:
    - Check that its decisions are accepted
    - Pick the kind of record
    - Read the writing rules
    - Read the record's shape
    - Pick a short name
    - Create the file
    - Write the body
    - Check it against the rules
    - Show you the draft
    - Commit, after you approve
    mark: 6
    mark_note: its command
    terminal_head: 'Its command: pkit new decision'
    font_size: 28
    terminal: |-
      $ pkit new decision project test-coverage-floor
      Stamped: .pkit/decisions/project/PRJ-012-test-coverage-floor.md
      # in the file:
      id: PRJ-012          # the next number, never guessed
      status: proposed     # until you accept it
      ## Context
      ## Decision
      ## Rationale
      ## Implications
  limit: 'Nothing checks that an agent used the skill: the command creates the file either way.'
  minutes: 1.5
  notes: 'A skill is a written procedure for one kind of task: write a decision record, file an issue, write a migration.
    The agent follows its steps, and its command does the steps that must be exact: the next number, the file''s layout. The
    command also refuses a name already taken. Every session holds only each skill''s short description, so 14 skills cost
    a few hundred words. The steps load when the task comes up. Why agents must use the skill: a record filed by hand once
    got a wrong number (PR #16), and core rule 3 came from it. A skill also names the decision records it follows, and stops
    if one is not accepted. Its first step checks that the decisions it names in its first lines are accepted: COR-006, COR-008
    and COR-025. If one is not, the skill stops.'
- id: agentsfrom
  part: P2
  title: Where agents come from
  message: 'When the same kind of check keeps coming back, a decision names a role for it: one job, and only the tools it
    needs.'
  problem: ''
  does: []
  show: 'In project-kit: pkit ships 6 agents, each a file with its job, its tools and the decisions it follows.'
  visual:
    kind: map
    head_h: 136
    row_h: 112
    columns:
    - head: The decision
      text: names a role
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: The agent
      text: does one job
      fill: '#BE95FFFF'
      cell: name
    - head: Its limit
      text: only the tools it needs
      fill: '#D4BBFFFF'
    - head: What it catches
      text: so you do not have to
      fill: '#E8DAFFFF'
    rows:
    - [{head: COR-024, text: A second opinion}, critic, Reads only, 'A draft''s gaps, before you read it']
    - [{head: COR-024, text: A keeper of the whole system}, architect, Edits only architecture docs, A change that 
        breaks the whole]
    - [{head: COR-057, text: One reviewer for the rules}, rule-set-reviewer, Never edits what it checks, 'A broken rule, with
        its line']
    why:
      head: Why pkit has agents
      items:
      - A decision makes each check one role's job. By default, nobody watches the whole system.
      - The agent that writes agrees with itself. A second agent does not.
      - A reviewer that cannot edit stays independent.
      - Caught here, a mistake costs an agent's time, not yours.
  limit: The AI tool enforces an agent's tools. Which files it may change is a rule it follows, not a lock.
  minutes: 1
  notes: 'Agents in pkit are not written at random either. When the same kind of check keeps coming back, it becomes a role
    (COR-007). A decision names the role, its job and its limits. COR-024 names the critic and the architect. COR-057 names
    the rule-set-reviewer. COR-044 names the process-author, which writes code only where you allow it. Two more reviewers
    are older than any record of their own, and COR-024 gives them their place. Why: the agent that writes a draft shows it
    while it is half done, so cheap mistakes reach your review. The agent you talk to does not watch the whole system, and
    by default nobody does. An agent''s time is cheap, and yours is not. A reviewer that only reads cannot fix its own findings,
    so it stays independent (COR-024). Each file has one owning agent (COR-013). The AI tool enforces the tools in an agent''s
    file. The files an agent owns are a rule it follows. Your own agents go in .pkit/agents/project/, made with the agent-author
    skill and pkit new agent.'
- id: agents
  part: P2
  title: 'One piece of work, and who sees it'
  message: 'Each role sees the work at its own moment: the critic before you, the reviewers on the change.'
  problem: ''
  does: []
  show: 'pkit''s own agents advise and never block. Add-ons bring agents that can block a merge.'
  visual:
    kind: roles
    stops:
    - name: The agent you talk to
      job: Writes the draft.
      limit: the tools you allow
    - name: Critic
      job: Opposes the draft before you see it.
      limit: reads only
    - name: Architect
      job: When the draft touches the whole system, checks that it fits.
      limit: edits only architecture docs
    - name: You
      job: Decide.
      tone: yours
    - name: Three reviewers
      job: 'Check the change: its writing, its conventions, its rules.'
      limit: never edit what they check
  limit: Every review round costs several agent runs.
  minutes: 1.5
  notes: 'The work moves from left to right. The agent you talk to writes a draft, with the tools your permissions allow.
    The critic opposes it before you see it. The architect checks it when it touches the whole system. You decide. Three reviewers
    check the change. methodology-reviewer checks how records and skills are written. convention-compliance-reviewer checks
    commits, branches and who owns which file. rule-set-reviewer checks the rules on the files the change touches. Only you
    accept a decision or let a change merge (COR-064 point 6).'
- id: permissions
  part: P2
  title: Permissions you write down
  message: What agents may do is your project's written rules, not the tool's guesses.
  problem: 'The AI tool decides action by action: nobody can see its rules, and every role is treated the same.'
  does:
  - 'Always refused, whatever is granted: rm -rf, sudo, force-push'
  - Some raw commands refused, so agents use the ones that check
  - A scratch folder agents never have to ask about
  show: 'This week: a builder''s rm -rf was refused; it asked another agent to run it, and that agent said no'
  visual:
    kind: compare
    left:
      space: user
      space_label: The tool's auto mode
      heading: A guess per action
      k1: Who decides
      v1: the model, each time
      k2: Visible
      v2: 'no'
    right:
      space: tech
      space_label: pkit's permissions
      heading: Rules you write down
      k1: Who decides
      v1: your project, once
      k2: Visible
      v2: 'yes: pkit permissions explain'
  limit: The rules stop ordinary commands, not a determined workaround; the OS sandbox is off on macOS.
  minutes: 2
  notes: Fewer prompts is mostly the tool's job now. pkit adds fixed rules, limits per role, and steering onto the 
    checked path.
- id: checked
  part: P2
  title: Checked every time
  message: An agent follows the ties between files without doubting them, so every tie is checked on every change.
  problem: ''
  does: []
  show: In project-kit, this check runs before every push and on every pull request
  visual:
    kind: ties
    center:
    - head: The release guide
      path: .pkit/release/README.md
    - head: Use case UC-008
      path: UC-008-release-backbone.md
      height: 144
    left_head: The code they describe
    right_head: The guide's records
    left:
    - label: release.py
    - label: changesets.py
    - label: versioning.py
    - label: .changie.yaml
    - label: release-pr.yml
    - label: release-tag.yml
    - label: latest_tag.py
      broken: true
      to: [0, 1]
      note: renamed to last_tag.py
    right:
    - label: COR-010  Lifecycle
      tone: pkit
    - label: COR-030  Dependencies
      tone: pkit
    - label: COR-041  External sources
      tone: pkit
    - label: PRJ-002  Versioning
      tone: yours
    - label: PRJ-004  Distribution
      tone: yours
    - label: ADR-040  Fetch at the pin
      tone: architecture
    terminal:
    - - - '$ '
        - prompt
      - - git
        - command
      - - ' mv scripts/latest_tag.py scripts/last_tag.py'
        - args
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' friction check'
        - args
    - - - FINDINGS
        - output
    - - - '  .pkit/release/README.md'
        - args
    - - - '    '
        - output
      - - dead-anchor
        - del
      - - '  path scripts/latest_tag.py'
        - args
    - - - '      matches no file; the diff removed or'
        - output
    - - - '      moved its target'
        - output
    - - - '  tech-docs/analysis/…/UC-008-release-backbone.md'
        - args
    - - - '    '
        - output
      - - dead-anchor
        - del
      - - '  path scripts/latest_tag.py'
        - args
    - - - 'Result: '
        - output
      - - failed
        - del
      - - '   (2 dead anchors)'
        - output
    - - - '# the change fails until both ties follow the file'
        - comment
    font_size: 24
  limit: It checks that every tie leads somewhere, not that the document is still right.
  minutes: 1
  notes: 'The release guide, with the ties its front matter declares: the seven files it describes and the six records it
    carries out. Someone renames scripts/latest_tag.py in a refactor. Two documents still name the old file: the guide, and
    a use case nobody renaming a script would think of. Without the check nothing warns: pkit refs records-for scripts/last_tag.py
    finds no records, so the next agent to change the file reads none of the guide''s six, nor the use case''s seven. The
    change check fails the rename and names both documents; the fix is to move the ties with the file. Checked on 29 October
    in a throwaway copy of the repository. A tie that is already dead on main is reported by the whole-repository check, pkit
    friction check --all.'
- id: docs
  part: P2
  title: Docs that know when they're wrong
  message: When code changes, the documents that depend on it are named, not found later by accident.
  problem: Documentation goes stale silently, and you find out when someone acts on it.
  does:
  - Each document declares what it depends on
  - 'The change says, per document: updated, still true, or fixed later'
  - A reviewer checks the answers; what is out of date is counted
  show: 'This week: a builder marked a requirement ''still accurate''; the docs reviewer showed it wasn''t'
  visual:
    kind: code
    code: "# trial run: the greeting in cli.py changed\n$ pkit friction check\n  ACT-cli-user     depends on cli.py\n  UC-001\
      \           depends on cli.py\n  docs/usage.md    depends on cli.py\n3 documents to answer for\n"
  limit: Only documents that declare what they depend on are covered; the rest go stale as before.
  minutes: 2.5
  notes: Probably pkit's most distinctive idea. 50 deferred answers in project-kit today, all visible.
- id: pm
  part: P3
  title: project-management
  message: You talk to one agent; it plans the work and runs builders in parallel.
  problem: ''
  does: []
  show: 'This week, in one evening: six builders, four pull requests merged'
  visual:
    kind: fanout
    left:
    - role: people
      head: You
      text: Describe the work, approve the plan, say yes to each merge.
    - role: agents
      head: Project-manager agent
      text: Files and plans the work, then starts one builder per task, each in its own copy of the repository.
    middle:
    - icon: agents
      head: 'Builder: task A'
    - icon: agents
      head: 'Builder: task B'
    - icon: agents
      head: 'Builder: task C'
    right:
      role: checks
      head: Reviewers, then merge
      text: Reviewers check each result; on your yes, the agent merges it.
  limit: 'GitHub only, and large: 62 records, 88 commands; you meet it through the agent, not the manual.'
  minutes: 4
  notes: 'Underneath: a structure (EPIC, Feature, Task), a lifecycle with gates, merging with reviewers, planning a batch
    of work in one approval, fixers after a merge, a board. Parallel agents in separate clones also exist, still experimental
    (the last slide). Like every capability, it brings its own decision records (DEC), kept beside pkit''s and yours, and
    replaced by its upgrades.'
- id: se
  part: P3
  title: software-engineering
  message: The builder follows your conventions; its three reviewers join every code merge with nothing to wire.
  problem: An AI writes in its default style, and the code is merged on a glance, or reviewed by its author.
  does:
  - The builder reads your conventions first, then follows them
  - 'Code, security, docs reviewers: each blocks only on what it can prove'
  show: 'This week: the code reviewer blocked code that couldn''t find organisation-owned boards; fixed before merge'
  visual:
    kind: flow
    stages:
    - role: code
      head: software-engineering
      text: Brings the builder and three reviewers.
    - role: neutral
      head: A slot
      text: '"Which reviewers a merge needs": software-engineering fills it.'
    - role: agents
      head: project-management
      text: Requires them on every code change, without naming who.
  limit: With no conventions written down, the builder falls back on generic habits.
  minutes: 2
  notes: 'Capabilities never name each other: one fills a slot another defines. Swap one for another that fills the same slot,
    and nothing connected notices.'
