# The Friday talk's slides as data. One entry per slide, in the talk's order
# (see 2026-10-29-friday-talk.md, "The talk's order" and "The slides' structure").
# A generator (2026-10-29-friday-talk.gen.py) turns these entries into instances
# of the board's library templates in 2026-10-29-friday-talk.board.yaml.
# Fields: title, message (the slide's lead), problem, does (2-4), show (the
# week's evidence, the slide's small bottom line), visual (drawn from library
# components), limit, minutes, notes (spoken, not on the slide).
#
# Vocabulary, one word per thing: you (never "the person" or "the user"); merge
# (never "land"); depends on (never "rests on" or "anchored"); capability (an
# optional add-on, defined on the install slide); the project-manager agent;
# builder (defined on the agents slide); "rules" always qualified.

talk:
  project: project-kit (pkit)
  title: Building with AI, the way your project decided
  author: Aleš Kalfas
  date: 30 October 2026
  version: pkit 1.149
  length_minutes: 30
parts:
- id: P0
  title: pkit at a glance
  summary: Why pkit exists, how to install it, and how its parts fit together.
- id: P1
  title: From idea to rule
  summary: Where ideas start, your decisions, and what every session is told.
- id: P2
  title: How the agent works
  summary: Procedures, roles, and what each agent may do.
- id: P3
  title: Staying consistent
  summary: What pkit checks, and documents that stay true.
- id: P4
  title: What you install
  summary: 'Capabilities: optional add-ons for your kind of work, and how they connect.'
- id: P5
  title: Over time
  summary: How pkit improves without breaking your work, and what comes next.
slides:
- id: opening
  part: P0
  title: Why pkit?
  message: Your AI agent works fast, and forgets everything your project decided.
  problem: ''
  does: []
  show: 'The question: how do you make it work your project''s way, without a heavy framework?'
  visual:
    kind: pairs
    style: tinted
    icons: true
    pairs:
    - left:
        role: neutral
        icon: row-chat
        head: Choices stay in chats and in people's heads
        text: so the agent cannot know them, and decides again
      right:
        role: code
        icon: row-write
        head: Capture each decision, with why
        text: you accept it, and every session can read it · Part 2
    - left:
        role: neutral
        icon: row-question
        head: Conventions stay unwritten
        text: so the agent falls back on its own habits
      right:
        role: code
        icon: row-conventions
        head: Write your conventions down
        text: every session loads them, and agents follow them · Parts 2, 5
    - left:
        role: neutral
        icon: row-doc
        head: Docs aren't tied to the code
        text: so a code change leaves them false, and nobody notices
      right:
        role: code
        icon: row-link
        head: Tie each doc to what it depends on
        text: each change rechecks the docs it affects · Part 4
    - left:
        role: neutral
        icon: row-unguarded
        head: What the agent may do is never said
        text: so the tool guesses, action by action
      right:
        role: code
        icon: row-shield
        head: Write down what it may do
        text: decided once by your project, the same in every session · Part 3
  limit: ''
  minutes: 1.5
  notes: 'pkit is installed into a repository, so an AI agent works the way the project decided. project-kit is built with
    pkit itself: every example shown is from this week.'
- id: fits
  part: P0
  title: How pkit fits together
  message: 'In five layers, from your decisions down to your code: each carries out the ones above it.'
  problem: ''
  does: []
  show: 'This week: pkit wrote this order down as a decision of its own, COR-065'
  visual:
    kind: pyramid
    center: 1280
    top_w: 720
    step: 280
    levels:
    - head: Decisions
      text: Choices you accepted, and why.
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Working rules · schemas · processes
      text: Exactly what to do, for every session and tool.
      fill: '#6929C4FF'
      ink: '@text_on_color'
    - head: Skills · agents · permissions
      text: How agents act, in which role, with what rights.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    - head: pkit's commands and checks
      text: Carry out what is decided, and check every change.
      fill: '#D4BBFFFF'
      ink: '@text_primary'
    - head: Your code and documents
      text: The work itself, tied to what it depends on.
      fill: '#E8DAFFFF'
      ink: '@text_primary'
    side:
    - head: Where ideas start
      text: In conversation, and in a scratchpad note when one needs longer.
      role: code
      arrow: right
      at: 0
      h: 300
      w: 600
    - head: Carried out
      text: Each layer carries out the decisions above it. The reasons stay in one place, where an agent reads them 
        before it changes anything.
      arrow: down
      at: 0
      h: 440
    - head: Checked
      text: If a layer and a decision disagree, the layer is checked first, so decisions never drift to match the code. 
        Only you change a decision.
      arrow: up
      at: 492
      h: 440
  limit: ''
  minutes: 1.5
  notes: 'A conversation ends. What it decides goes into a decision, what it leaves open into a scratchpad note. Where no
    decision exists yet, what was built stands, until a change makes that choice; then the decision comes first. A layer that
    disagrees with a decision falls short and is fixed, or a new decision is written and you accept it. Most layers are written
    by hand, so they can lag; what is tied to a decision is flagged when the decision changes. After the install, the slides
    take the layers from the top.'
