  notes: 'pkit se instaluje do repozitáře a AI agent pak pracuje podle toho, co jste v projektu rozhodli. I samotný project-kit
    se vyvíjí s pkitem: všechny ukázky, které uvidíte, jsou z tohoto týdne.'
- id: fits
  part: P0
  title: Jak je pkit poskládaný
  message: Skládá se z pěti vrstev, od vašich rozhodnutí až po váš kód. Každá vrstva provádí to, co určují vrstvy nad ní.
