    (COR-033). pkit process new přidá proces do add-onu. Každý gate v něm je zatím stub, který selhává, dokud skutečnou kontrolu
    nenapíše agent process-author (COR-044). Vaše vlastní datové soubory mohou uvést schéma, kterým se řídí, a pkit data validate
    je zkontroluje (COR-023).'
