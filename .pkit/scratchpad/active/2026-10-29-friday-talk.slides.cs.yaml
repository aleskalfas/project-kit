# Slajdy páteční přednášky jako data, česká verze. Stejná struktura jako
# 2026-10-29-friday-talk.slides.yaml, klíč po klíči a seznam po seznamu; generátor ji
# staví pod anglickou verzi (třetí argument gen.py).
# Přeloženo z anglické verze (2026-10-29-friday-talk.slides.yaml), slajd po slajdu podle smyslu.
#
# Slovník, jedno slovo pro jednu věc. Technické výrazy, které čeští vývojáři říkají anglicky,
# zůstávají anglicky: add-on (add-ony, capabilities jen v závorce nebo v příkazu), engine, slot, role,
# builder, gate, reviewer, review, merge, pull request, commit, hook, issue, session, skill, scratchpad.
# Česky: rozhodnutí, záznam o rozhodnutí; jádro pkitu; oprávnění; schéma, proces, stav, přechod;
# kontrola; vazba; repozitář, větev; vy (vykání, malými písmeny). Věty se staví česky, ne podle
# anglického slovosledu (zadání revize: .agent-workspace/cs/rev/brief.md, jen na tomto stroji).

talk:
  project: project-kit (pkit)
  link: github.com/aleskalfas/project-kit
  title: Vývoj s AI podle rozhodnutí vašeho projektu
  author: Aleš Kalfas
  date: 30. října 2026
  version: pkit 1.149
  length_minutes: 30
parts:
- id: P0
  title: pkit v kostce
  summary: Proč pkit vznikl, jak ho nainstalovat a jak do sebe zapadají jeho části.
- id: P1
  title: Od nápadu k pravidlu
  summary: Kde vznikají nápady, vaše rozhodnutí, co se dozví každá session a pravidla, která hlídá program.
- id: P2
  title: Jak agent pracuje
  summary: Postupy, role a co smí každý agent.
- id: P3
  title: Udržet vše v souladu
  summary: Co pkit kontroluje a dokumenty, které nezastarají.
- id: P4
  title: Co si doinstalujete
  summary: Volitelné add-ony (capabilities) podle druhu vaší práce a jak se propojují.
- id: P5
  title: Otázky
  summary: ''
  section: false
slides:
- id: opening
  part: P0
  title: Proč pkit?
  message: Váš AI agent pracuje rychle, ale zapomíná všechno, co jste v projektu rozhodli.
  problem: ''
  does: []
  show: 'Otázka: jak ho přimět pracovat po vašem, a to bez těžkopádného frameworku?'
  visual:
