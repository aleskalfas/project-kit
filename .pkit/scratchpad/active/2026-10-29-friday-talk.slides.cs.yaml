  limit: ''
  minutes: 1.5
  notes: Rozhovor jednou skončí. Co se v něm rozhodne, zapíše se do záznamu o rozhodnutí. Co zůstane otevřené, zapíše se do
    poznámky ve scratchpadu. Kde rozhodnutí ještě chybí, platí to, co už je postavené. Až bude nějaká změna tu volbu potřebovat,
    napíše se nejdřív rozhodnutí. Když vrstva s rozhodnutím nesedí, buď zaostává a opraví se, nebo se napíše nové rozhodnutí
    a vy ho schválíte. Většina vrstev se píše ručně, takže může zaostávat. Co je ale na rozhodnutí navázané, se ozve, jakmile
    se rozhodnutí změní. Po instalaci projdeme vrstvy shora dolů.
