  limit: Když konvence sepsané nemáte, builder i revieweři se drží obecné dobré praxe.
  minutes: 1.5
  notes: 'software-engineering má dva cíle: aby kód, který píšou agenti, v každé session dodržoval vaše konvence, a aby kód
    prošel review, než se mergne (DEC-003). Jeho builder, software-engineer, nemá na kód žádné vlastní názory. Nejdřív si
    přečte vaše konvence ze souboru, který uvedete v overlay.yaml, a pak se jimi řídí. Když žádné sepsané nejsou, řekne to
    a drží se obecné dobré praxe (DEC-001). Konvence zůstávají vaše: když add-on odeberete, nezmizí. Tři revieweři kontrolují
    správnost, bezpečnost a dokumentaci, včetně odpovědí, které k ní změna napsala. Každý blokuje jen kvůli chybě, kterou
    ve změně umí ukázat. Všechno ostatní je rada. Blokace tak nikdy není jen otázka vkusu a nikdo se ji nenaučí přeskakovat
    (DEC-002). Revieweři vznikli ze skutečného selhání. V jednom projektu, který pkit používá, prošel do merge pull request
    s tokenem na příkazové řádce a se shell injection, protože kód nikdo nekontroloval (#715). Jak se revieweři k merge dostanou:
    add-on dodává jeden soubor, review-contributions.yaml. project-management ten soubor čte z každého nainstalovaného add-onu
    a vyžaduje schválení od každého reviewera, kterého soubor jmenuje (project-management DEC-032). project-management přitom
    software-engineering nikde nejmenuje. Revieweři se zapínají samotnou instalací add-onu, žádné nastavení k tomu není. Reviewer
    kódu a reviewer bezpečnosti běží, jen když změna sahá na kód. Jediný merge z 29. října, který měnil jen záznamy, proto
    review kódu neměl. Naopak software-engineering jmenuje project-management jako add-on, na kterém závisí, a proto se instaluje
    až po něm. Pull request #2279: reviewer kódu zablokoval nový kód, který zapisuje Status. Ten kód neuměl najít board, který
    vlastní organizace. Chyba se opravila, všech pět reviewerů schválilo a merge proběhl 43 minut po blokaci. project-kit
    zatím pro svůj kód žádné konvence nesepsal, a tak jeho reviewer kódu uvedl, že posuzoval jako pečlivý generalista.'
- id: connect
  part: P4
  title: Jak add-ony spolupracují
  message: Add-on nikdy nejmenuje jiný add-on, jen roli. Když něco potřebuje, otevře slot. Vyplnit ho může kterýkoli jiný.
  problem: ''
  does: []
  show: 'V project-kitu: 3 role, každou hraje jeden add-on. Ze 6 slotů jsou 4 vyplněné.'
  visual:
    kind: sockets
    font_size: 22
    provider:
      name: project-management
      role: pkit::work-tracking
      slots:
      - id: doc-check
        text: dokumenty, které změna musí upravit
      - id: fixers
        text: který agent opraví který dokument
      - id: use-cases
        text: případy užití k plánování
    contributors:
    - name: living-docs
      role: pkit::documentation
      text: dokumenty na míru čtenáři
      to:
      - doc-check
      - fixers
    - name: software-analysis
      role: pkit::analysis
      text: co musí software umět
      to:
      - fixers
      - use-cases
    terminal_head: Co vypíše pkit status v project-kitu
    terminal:
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' status'
        - args
    - - - '  Connections'
        - output
    - - - '    roles   3 named: 3 active, 0 in conflict'
        - output
    - - - '      pkit::analysis      → '
        - pkit
      - - software-analysis
        - addon
    - - - '      pkit::documentation → '
        - pkit
      - - living-docs
        - addon
    - - - '      pkit::work-tracking → '
        - pkit
      - - project-management
        - addon
    - - - '    points  6 defined: 2 unfilled'
        - output
    - - - '    pkit::work-tracking:fixers'
        - pkit
    - - - '      data v1 · project-management — filled'
        - output
    - - - '      bound  '
        - output
      - - software-analysis
        - addon
      - - ' (contributes)'
        - output
    - - - '      bound  '
        - output
      - - living-docs
        - addon
      - - ' (contributes)'
        - output
    why:
      head: Proč pkit propojuje add-ony takhle
      items:
      - Add-on vyměníte za jiný ve stejné roli. Zbytek zůstane, jak je.
      - Instalujete jen to, co potřebujete. Prázdný slot ničemu nevadí.
      - pkit status zapojení ukáže a pkit validate ho zkontroluje.
  limit: Každou roli zatím hraje jen jeden add-on. Výměna je tedy navržená, ale ještě nevyzkoušená.
  minutes: 1
  notes: 'Když jeden add-on potřebuje něco od jiného, nikdy ho nejmenuje. Otevře slot, kterému pkit říká connection point,
    a to pod nějakou rolí, třeba pkit::work-tracking. Sloty definuje add-on, který danou roli hraje, a vyplnit je může kterýkoli
    nainstalovaný add-on (COR-053). project-management hraje roli work-tracking. Jeden z jeho slotů se ptá, který agent opraví
    který druh dokumentu. living-docs tam uvede agenta pro své stránky, software-analysis pro případy užití, požadavky a zbytek
    analýzy. project-management z toho slotu čte, kterého agenta spustit ke každému zastaralému dokumentu, a přitom o žádném
    z obou add-onů neví. Slot je volitelný, pokud sám neuvede, i s důvodem, že vyplněný být musí. Add-on proto funguje i sám.
    V čisté instalaci jen s project-management zůstane slot fixers prázdný, pkit validate projde a pkit status uvede living-docs
    a software-analysis jako add-ony, které by ho mohly vyplnit. Když si stejnou roli nárokují dva add-ony, je to chyba, dokud
    jeden nevyberete příkazem pkit connections providers. Proč role: kdyby slot jmenoval konkrétní add-on, právě to by vám
    bránilo add-on vyměnit. Soubor s reviewery, který dodává software-engineering, je ve skutečnosti starší slot samotného
    project-management, ještě z doby před rolemi. Drží ale stejné pravidlo: strana, která reviewery potřebuje, nikdy nejmenuje,
    kdo je dodá. Co přijde dál: project-management dostane slot pro buildera a software-engineering ho vyplní svým software-engineerem
    (DEC-063, ve vývoji). Agenti, kteří dokumenty opravují, zatím na Claude Code bez dozoru neběží: jejich spouštěč nejdřív
    čeká na prověření tohoto nástroje.'
