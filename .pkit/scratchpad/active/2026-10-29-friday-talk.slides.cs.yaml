- id: skillsfrom
  part: P2
  title: Odkud se berou skilly
  message: Z rozhodnutí pkitu, která zavádějí druhy souborů. Co vyžaduje úsudek, řeší skill. Co musí být přesné, udělá příkaz.
  problem: ''
  does: []
  show: 'V project-kitu: pkit dodává 11 skillů a každý má svůj příkaz.'
  visual:
    kind: map
