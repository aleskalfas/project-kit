- id: checks
  part: P3
  title: Co pkit kontroluje a proč
  message: Celý projekt a každou změnu před mergem. Agent jedná podle toho, co je v souborech, a nikdy o tom
    nepochybuje.
  problem: ''
  does: []
  show: 'V čerstvé instalaci spustí pkit validate 12 kontrol bez jakéhokoli nastavení. Každý doplněk přidá své:
    v project-kitu 16.'
  visual:
    kind: wired
    font_size: 26
    note_w: 1000
    panels:
    - head: Celý projekt
      terminal:
      - [['$ ', prompt], [pkit, command], [' validate', args]]
      - [['  manifests · schemas · configuration', output]]
      - [['  packages · connections · versions', output]]
      - [['  decisions · friction · rule-sets', output]]
      - [['  refs · process · data', output]]
      - [['  12 validator(s) ran; 0 error(s)', output]]
      - [['  All checks passed.', add]]
    - head: Každá změna před mergem
      terminal:
