  minutes: 1
  notes: Nic z toho se nezapojuje ručně. Při instalaci a při každém syncu zkopíruje pkit své agenty do složky vašeho AI nástroje,
    .claude/agents/, vedle vašich vlastních. Každý agent v prvních řádcích jmenuje rozhodnutí, kterými se řídí, a dokumenty,
