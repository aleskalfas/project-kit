- id: permissions
  part: P2
  title: Odkud se berou oprávnění
  message: Z pravidel, která projekt zapíše jako data. AI nástroj je uplatní při každém volání, i když na ně agent zapomene.
  problem: ''
  does: []
  show: 'V project-kitu: agent project-manager nesmí nic měnit přímým příkazem gh. Používá příkazy pkitu, které issue nejdřív
    ověří.'
  visual:
    kind: map
    head_h: 136
    row_h: 112
    columns:
    - head: Pravidlo
      text: jak rozhodlo COR-028
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Zapsáno jako data
      text: v čitelných souborech
      fill: '#BE95FFFF'
    - head: Dostane AI nástroj
      text: a sám uplatní
      fill: '#D4BBFFFF'
    - head: Na co volání narazí
      text: pokaždé
      fill: '#E8DAFFFF'
    rows:
    - - head: Pojistky
        text: pro vás i každého agenta
      - rm -r, sudo a force-push, zakázané všem
      - Zákaz v jeho nastavení
      - Odmítnuto v každém režimu
    - - head: Vlastní nástroje agenta
        text: v souboru agenta
      - 'critic: Read, Glob, Grep, WebFetch'
      - Seznam nástrojů toho agenta
      - Nespustí příkaz, nezapíše soubor
    - - head: Pravidlo agenta
        text: z project-management
      - 'project-manager: žádné změny přímým gh'
      - Hook, před každým voláním
      - Odmítnuto, a tak použije příkazy pkitu
    why:
      head: Proč pkit oprávnění zapisuje
      items:
      - Pravidlo, které agent čte, je rada. Pravidlo, které uplatní AI nástroj, už ne.
      - Zapsané pravidlo se dá přečíst a projít v review jako každá jiná změna.
      - Nastavení platí pro všechny agenty stejně. Hook rozhoduje u každého zvlášť.
      - Příkazy pkitu mají kontroly, které přímé příkazy přeskočí. Agent je neobejde.
  limit: Zákaz zastaví jen ty podoby příkazu, které pkit pozná. Příkaz schovaný za jiným může proklouznout.
  minutes: 1
  notes: 'Podle COR-028 je to, co smí běžet, zapsané jako data: oprávnění udělená agentům, v souborech. Jednotlivá oprávnění
    pojmenovává katalog. Tři profily jsou připravené rovnou (read-only, non-destructive a autonomous) a váš projekt k nim
    přidá vlastní oprávnění. pkit to všechno zapíše do nastavení vašeho AI nástroje a volitelný hook zkontroluje každé volání,
    než se spustí. Omezení agenta sedí na třech místech. Pojistky platí pro všechny, i pro vás. Soubor agenta vyjmenuje jeho
    nástroje a váš AI nástroj ten seznam vynucuje jen u toho agenta. Pravidlo pro jednoho agenta potřebuje hook. Šest agentů
    pkitu žádné vlastní pravidlo nemá, omezují je jen jejich nástroje. Jediné pravidlo pro jednoho agenta přináší add-on project-management.
    Jeho agent project-manager nesmí používat přímé příkazy gh, které mění issues a pull requesty. Musí použít příkazy pkitu.
    Ty issue ověří a hlídají gate uzavření i gate schválení. Agent tak nic z toho ze zvyku nepřeskočí. Add-on to pravidlo
    přinese s sebou a nic nenastavujete. Zákaz je jen zpomalovací práh, ne bezpečnostní hranice. Obal jako bash -c nebo uv
    run ho může obejít, a proto skutečné kontroly sedí uvnitř příkazů pkitu.'
