        neschválíte']
    - [{head: COR-013, text: Agenti}, agent-author, pkit new agent, Soubor agenta v tvaru pkitu]
    head_h: 136
    row_h: 112
    why:
      head: Proč pkit práci takhle dělí
      items:
      - Důvod je na jednom místě. Skill na něj odkazuje a nikdy ho nekopíruje.
      - Příkaz nevybere jméno ani nenapíše obsah. Bez skillu agenti vynechávali pravidla psaní.
      - Agent se může přepočítat. Ručně psaný záznam jednou dostal špatné číslo.
      - Každý soubor daného druhu má stejný tvar, ať ho píše kdokoli.
  limit: Skilly pkitu pokrývají jen vlastní soubory pkitu. Na práci, která se ve vašem projektu opakuje, si
    napíšete vlastní.
  minutes: 1
  notes: >-
    Skilly v pkitu nevznikají nahodile. Rozhodnutí pkitu určují druhy souborů: poznámky ve scratchpadu, záznamy
    o rozhodnutí, agenty, migrace a další. Každý druh má skill a příkaz. S pkitem přichází 11 takových dvojic. Proč
    takové dělení: důvod drží rozhodnutí, na jednom místě, a skill na něj odkazuje, místo aby ho kopíroval (COR-006).
    Příkaz za vás nerozhodne: jaký druh, dobré jméno, obsah a vaše review. Když skill neexistoval, agenti vynechávali
    pravidla psaní (COR-005). Samotný skill ale taky nestačí: agent se může přepočítat a ručně psaný záznam jednou
    dostal špatné číslo (COR-005, PR #16). Proto čísla, strukturu a jména řeší příkaz. Práce, která se vrátí dvakrát
    nebo třikrát, dostane nástroj, takže stojí míň a pokaždé dopadne stejně (COR-007). Skill v prvních řádcích
    jmenuje rozhodnutí, kterými se řídí, a pkit validate ta jména kontroluje. Vaše vlastní skilly patří do
    .pkit/skills/project/, vedle skillů pkitu, a sync je nikdy nezmění.
- id: skills
  part: P2
  title: Skill krok za krokem
  message: Agent prochází kroky popořadě. V kroku 6 spustí příkaz, takže číslo i struktura souboru vždy sedí.
