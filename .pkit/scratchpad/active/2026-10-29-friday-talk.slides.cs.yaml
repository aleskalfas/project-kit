    vedle něj, říká, co taková data musí obsahovat: položka potřebuje popis a blok recognize a nic jiného v ní být nesmí.
    Příkazy, skilly a agenti pkitu čtou první soubor a pkit validate ho kontroluje podle druhého (COR-018). Právě kvůli tomuto
    pravidlu má force-push zakázaný každý agent. Uvidíte to později u oprávnění. Vlastní schémata pkitu leží v .pkit/schemas/.
