  minutes: 1
  notes: 'Kontroly jsou dvojího druhu. pkit validate kontroluje projekt tak, jak právě je. Každá část pkitu do něj registruje
    vlastní kontrolu a každý nainstalovaný add-on přidá svoje. V čisté instalaci je jich 12, v project-kitu 16. Ověřují například,
    že každý datový soubor odpovídá svému schématu, že každý záznam má správný tvar a že každý skill a agent uvádí, na co
    odkazuje. Kontroly změn posuzují diff vůči jeho základu. pkit friction check chce od každého dokumentu navázaného na změněný
    soubor odpověď: upraveno, stále platí i s důvodem, nebo odloženo (COR-050). pkit decisions check-diff odmítne záznam nebo
