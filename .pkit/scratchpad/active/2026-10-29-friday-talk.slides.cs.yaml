      ## Implications
  limit: 'Nic nekontroluje, že agent skill použil: příkaz soubor vytvoří tak i tak.'
  minutes: 1.5
  notes: >-
    Skill je sepsaný postup pro jeden druh úkolu: napsat záznam o rozhodnutí, založit issue, napsat migraci. Agent
    jde podle jeho kroků a příkaz udělá ty kroky, které musí být přesné: další číslo, strukturu souboru. Příkaz taky
    odmítne jméno, které už je obsazené. Každá session drží jen krátký popis každého skillu, takže 14 skillů stojí
    pár set slov. Kroky se načtou, až na úkol dojde. Proč agenti musí skill používat: ručně založený záznam jednou
    dostal špatné číslo (PR #16) a z toho vzniklo pravidlo jádra č. 3. Skill také jmenuje záznamy o rozhodnutí,
    kterými se řídí, a zastaví se, pokud některý není schválený. Jeho první krok ověří, že rozhodnutí jmenovaná v jeho
    prvních řádcích jsou schválená: COR-006, COR-008 a COR-025. Pokud některé není, skill se zastaví.
- id: agentsfrom
  part: P2
  title: Odkud se berou agenti
  message: 'Když se stejný druh kontroly opakuje, rozhodnutí pro něj určí roli: jednu práci a jen nástroje, které
    potřebuje.'
  problem: ''
  does: []
  show: 'V project-kitu: pkit dodává 6 agentů, každý je soubor se svou prací, nástroji a rozhodnutími, kterými se
    řídí.'
  visual:
    kind: map
    head_h: 136
    row_h: 112
    columns:
    - head: Rozhodnutí
      text: určí roli
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Agent
      text: má jeden úkol
      fill: '#BE95FFFF'
      cell: name
    - head: Jeho limit
      text: jen potřebné nástroje
      fill: '#D4BBFFFF'
    - head: Co zachytí
      text: abyste nemuseli vy
      fill: '#E8DAFFFF'
    rows:
    - [{head: COR-024, text: Druhý názor}, critic, Jen čte, 'Mezery návrhu, než ho přečtete']
    - [{head: COR-024, text: Strážce celého systému}, architect, Mění jen dokumenty architektury, 'Změnu, která
        rozbije celek']
    - [{head: COR-057, text: Reviewer pro pravidla}, rule-set-reviewer, 'Nikdy nemění, co kontroluje', Porušené
        pravidlo i s řádkem]
    why:
      head: Proč má pkit agenty
      items:
      - Rozhodnutí z každé kontroly udělá práci jedné role. Jinak celý systém nikdo nehlídá.
      - Agent, který píše, souhlasí sám se sebou. Druhý agent ne.
      - Reviewer, který nemůže upravovat, zůstává nezávislý.
      - Chyba zachycená tady stojí čas agenta, ne váš.
  limit: Nástroje agenta vynucuje AI nástroj. Které soubory smí měnit, je pravidlo, kterým se řídí, ne zámek.
  minutes: 1
  notes: >-
    Ani agenti v pkitu nevznikají nahodile. Když se stejný druh kontroly pořád vrací, stane se z něj role (COR-007).
    Rozhodnutí určí roli, její práci a její meze. COR-024 určuje agenty critic a architect. COR-057 určuje agenta
    rule-set-reviewer. COR-044 určuje agenta process-author, který píše kód jen tam, kde mu to dovolíte. Další dva
    revieweři jsou starší než jakýkoli vlastní záznam a COR-024 jim dává místo. Proč: agent, který píše návrh, ho
    ukáže napůl hotový, takže levné chyby skončí ve vašem review. Agent, se kterým mluvíte, celý systém nehlídá,
    a ve výchozím stavu ho nehlídá nikdo. Čas agenta je levný, váš ne. Reviewer, který jen čte, nemůže opravit vlastní
    nálezy, a tak zůstává nezávislý (COR-024). Každý soubor má jednoho agenta, který ho vlastní (COR-013). Nástroje
    v souboru agenta vynucuje AI nástroj. Které soubory agent vlastní, je pravidlo, kterým se řídí. Vlastní agenty
    dáte do .pkit/agents/project/ a vytvoříte je skillem agent-author a příkazem pkit new agent.
