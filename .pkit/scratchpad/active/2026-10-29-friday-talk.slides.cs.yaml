        - - pkit
          - command
        - - ' friction check'
          - args
      - - - '    '
          - output
        - - answered
          - add
        - - '  path .changie.yaml  changed in this diff;'
          - output
      - - - '              answered: updated'
          - output
      - - - 'Result: '
          - output
        - - passed
          - add
    right:
      head: Změna odpoví jedním ze tří způsobů
      answers:
      - tone: updated
        tag: Upraveno
        text: Změna opravila i dokument.
      - tone: unchanged
        tag: Stále platí
        text: V dokumentu nic nepřestalo platit. Odpověď řekne proč.
      - tone: deferred
        tag: Odloženo
        text: Odpověď uvede issue, které dokument opraví.
      terminal:
      - - - '# .pkit/project/friction/answers/20261030T024530Z-ba8d160a.yaml'
          - comment
      - - - 'answers:'
          - output
      - - - '  - artefact: '
          - output
        - - .pkit/release/README.md
          - args
      - - - '    revalidated:'
          - output
      - - - '      outcome: '
          - output
        - - updated
          - add
    why:
      head: Proč pkit chce odpověď
      items:
      - Ne každá změna dokument zneplatní. Odpověď to rozliší.
      - Každou odpověď ověří reviewer. „Stále platí“ tak musí mít pádný důvod.
      - Odložená oprava zůstane v evidenci i s issue, které ji vyřeší.
  limit: Kontrola hlídá jen dokumenty, které vyjmenujete i s tím, na čem závisí. Ostatní zastarávají jako dřív.
  minutes: 2
  notes: 'Když změna sáhne na něco, na čem dokument závisí, kontrola změn na dokument upozorní a chce k němu odpověď (COR-050).
    V příkladu změna přesouvá složku changesetů v .changie.yaml a na tomhle souboru závisí příručka k vydávání. Kontrola neprojde,
    dokud změna k příručce nepřidá odpověď. Odpovědi jsou tři. Upraveno: změna opravila i dokument, tady zmínky o té složce
    v příručce. Stále platí: v dokumentu nic nepřestalo platit a odpověď jednou větou vysvětlí proč. Odloženo: odpověď uvede
    issue, které dokument opraví, a do té doby dokument vypisuje pkit friction debt. Odpověď zapíše pkit friction revalidate
    nebo pkit friction defer do souboru odpovědí, který je součástí změny. Zůstane tak v projektu, nejen v textu pull requestu
    (COR-050, COR-062). Každou odpověď zkontroluje reviewer, který ji sám nepsal, a když neobstojí, zablokuje merge (COR-050
    bod 3). Každá session dostane pravidlo, podle kterého agenti píšou tyto odpovědi rovnou se svou změnou a neptají se vás
    (pravidlo jádra č. 20). V čisté instalaci kontrola spí, dokud dokumenty nevyjmenujete ve friction.places v .pkit/project/config.yaml
    a v front matter každého z nich neuvedete, na čem závisí. Add-ony pro dokumentaci a analýzu to obojí udělají pro své dokumenty
    samy. Vyzkoušeno 30. října na jednorázové kopii project-kitu. V project-kitu dnes čeká 21 odpovědí „odloženo“ a všechny
    kromě jedné uvádějí issue, které dokument opraví.'
