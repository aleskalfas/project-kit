  limit: 'Některé add-ony závisí na jiných: software-engineering se bez project-management nenainstaluje.'
  minutes: 1.5
  notes: 'Všechno, co jsme zatím ukázali, patří do jádra pkitu a je v každé instalaci. Některé způsoby práce se ale hodí jen
    pro některé projekty, třeba vedení issues na GitHubu nebo review kódu. Každý takový způsob práce pkit zabalí do add-onu,
    kterému říká capability (COR-017). Add-on přináší stejné vrstvy jako jádro, jen pro svůj způsob práce: vlastní záznamy
    o rozhodnutí, schémata a procesy, skilly, agenty a pravidla oprávnění, příkazy a kontroly. Všechno leží v jedné složce,
    v .pkit/capabilities/ pod jménem add-onu. pkit add-on vytvoří, jen když platí tři věci. Potřebují ho některé projekty,
    ale ne všechny (COR-014). Dá se přidat i odebrat jako jedna složka. A stejná potřeba se v praxi opakovaně vracela (COR-007).
    Stejný test rozhoduje i o agentech. Mezi prvními agenty jádra byl product manager, kterého projekt bez add-onů k ničemu
    nepotřebuje, a tak se přestěhoval do project-management (COR-026). Instalace zkopíruje složku add-onu a zaregistruje ho.
