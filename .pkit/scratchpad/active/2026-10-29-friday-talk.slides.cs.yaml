    project-kitu, přímo v jeho repozitáři (COR-031). Dnešní vydání 1.149 má 4 add-ony: project-management, software-engineering,
    evidence a demo-recording. living-docs, software-analysis a doc-examples už jsou ve větvi main a vyjdou ve verzi 2.0.'
- id: pm
  part: P4
  title: Co přináší project-management
  message: Jednoho agenta, který založí issues, naplánuje práci a souběžně spustí buildery. Vy schválíte plán a každý merge.
  problem: ''
  does: []
  show: 'V project-kitu 29. října: 22 mergnutých pull requestů, až 7 otevřených najednou, každý s verdikty svých reviewerů.'
  visual:
    kind: fanout
    left:
    - role: people
      head: Vy
      text: Řeknete, co chcete. Plán schválíte jednou.
    - role: addon
      head: project-manager
      text: Založí issues, naplánuje Tasky a na každý spustí buildera.
    middle:
    - icon: agents
      head: 'Builder: Task A'
    - icon: agents
      head: 'Builder: Task B'
    - icon: agents
      head: 'Builder: Task C'
    right:
    - role: addon
      head: Revieweři
      text: Každý ověří změnu. Schválit musí všichni.
    - role: people
      head: Vy
      text: Řeknete ano. Pak agent mergne.
    caption: 'Proč rozhodujete na začátku i na konci: plán a merge za tým schvalujete jen vy. Práci mezi tím udělá agent.'
    cards:
    - tone: addon
      head: Jeho skill a agenti
      text: Skill pm, agent project-manager a pm-reviewer, který projde každý pull request.
    - tone: addon
      head: 88 příkazů
      text: pkit pm … zakládá, posouvá a merguje. Každý krok nejdřív ověří.
    - tone: addon
      head: Workflow pro issues
      text: Každý přechod ověří engine pkitu.
    - tone: yours
      head: Co uděláte
      text: Dejte mu GitHub repozitář a jednou spusťte pkit pm bootstrap.
  limit: 'Umí jen GitHub a je velký: 63 záznamů o rozhodnutí a 88 příkazů. Stačí ale mluvit s agentem, manuál číst nemusíte.'
  minutes: 1.5
  notes: 'project-management je soubor pravidel, jak na GitHubu řídit práci: issues, pull requesty a merge. Jeho pravidla
    jsou zapsaná jako data a provádějí je jeho příkazy. Agent se jimi proto řídí a nemusí si je pamatovat (DEC-020, DEC-057).
    Mluvíte s jediným agentem, project managerem. Z toho, co chcete, sestaví plán rozdělený na Featury a Tasky a vy ho jednou
    schválíte. Na každý Task pak spustí buildera, několik najednou, každého na vlastní větvi. Builder je agent, který zpracuje
    jeden Task. Tasky, které mění stejné soubory, na sebe počkají. Každý pull request zkontrolují revieweři a schválit ho
    musí všichni. Pak řeknete ano a agent mergne. pkit pm land-work bez vašeho ano nic nemergne. Práci mezi tím dělá agent,
    ale začátek i konec patří vám: k plánu, k harmonogramu nebo k merge může tým zavázat jen člověk (DEC-057). Workflow pro
    issues jste už viděli. Běží na enginu procesů pkitu. Pravidlo oprávnění zakazuje agentovi project-manager měnit cokoli
    přímo příkazem gh, a tak musí použít tyto příkazy. Add-on má 63 vlastních záznamů o rozhodnutí. Leží v jeho složce a citují
    se ve tvaru project-management:DEC-032. Co uděláte vy: dáte mu GitHub repozitář a jednou spustíte pkit pm bootstrap, který
    založí jeho labely. Do té doby jeho úvodní kontrola selhává a příkazy odmítají pracovat. project-management umí také spouštět
    agenty v několika klonech jednoho repozitáře, pomocí seats a pools. V project-kitu to už běží, ale ještě se to dotváří.
    Co přijde dál: každý builder začne načisto, ve vlastním klonu v sandboxu (DEC-063, ve vývoji). Přečteno z project-kitu:
    z 22 pull requestů mergnutých 29. října bylo současně otevřených až 7 a každý nesl verdikty svých reviewerů.'
- id: se
  part: P4
  title: Co přináší software-engineering
  message: Buildera, který dodržuje vaše konvence, a tři reviewery, kteří zkontrolují každou změnu kódu před mergem.
  problem: ''
  does: []
  show: 'V project-kitu 29. října: 21 z 22 mergů měnilo kód a každý z nich prošel reviewery kódu, bezpečnosti a dokumentace.'
