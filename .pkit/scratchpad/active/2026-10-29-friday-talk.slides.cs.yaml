      Stamped: .pkit/decisions/project/PRJ-012-test-coverage-floor.md

      # v souboru:

      id: PRJ-012          # další číslo, nikdy odhadem

      status: proposed     # dokud ho neschválíte

      ## Context

      ## Decision

      ## Rationale

      ## Implications'
  limit: Nic nekontroluje, jestli agent skill použil. Příkaz vytvoří soubor i bez skillu.
  minutes: 1.5
  notes: 'Skill je sepsaný postup na jeden druh úkolu: napsat záznam o rozhodnutí, založit issue, napsat migraci. Agent postupuje
    podle kroků skillu. Kroky, které musí být přesné, za něj udělá příkaz: přidělí další číslo a založí soubor ve správné
    struktuře. Příkaz taky odmítne název, který už je obsazený. Každá session zná ze skillů jen jejich krátké popisy, takže
    14 skillů stojí pár set slov. Kroky si agent načte, až na úkol dojde. Proč agenti musí skill používat? Ručně založený
    záznam jednou dostal špatné číslo (PR #16) a z toho vzniklo pravidlo jádra č. 3. Skill taky v prvních řádcích jmenuje
    rozhodnutí, kterými se řídí, tady COR-006, COR-008 a COR-025. Jeho první krok ověří, že jsou všechna schválená. Pokud
    některé schválené není, skill se zastaví.'
- id: agentsfrom
  part: P2
  title: Odkud se berou agenti
  message: Když se stejná kontrola pořád vrací, rozhodnutí z ní udělá roli. Ta má jednu práci a jen nástroje, které potřebuje.
  problem: ''
  does: []
  show: 'V project-kitu: pkit dodává 6 agentů. Každý je soubor se svou prací, nástroji a rozhodnutími, kterými se řídí.'
  visual:
    kind: map
    head_h: 136
    row_h: 112
    columns:
    - head: Rozhodnutí
      text: zavede roli
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Agent
      text: má jeden úkol
      fill: '#BE95FFFF'
      cell: name
    - head: Jeho meze
      text: jen potřebné nástroje
      fill: '#D4BBFFFF'
    - head: Co zachytí
      text: abyste nemuseli vy
      fill: '#E8DAFFFF'
    rows:
    - - head: COR-024
        text: Druhý názor
      - critic
      - Jen čte
      - Díry v návrhu, než ho přečtete
    - - head: COR-024
        text: Strážce celého systému
      - architect
      - Mění jen dokumenty architektury
      - Změnu, která rozbije celek
    - - head: COR-057
        text: Jeden reviewer na pravidla
      - rule-set-reviewer
      - Nikdy nemění, co kontroluje
      - Porušené pravidlo i s řádkem
    why:
      head: Proč má pkit agenty
      items:
      - Rozhodnutí z každé kontroly udělá práci jedné role. Jinak celý systém nikdo nehlídá.
      - Agent, který píše, souhlasí sám se sebou. Druhý agent ne.
      - Reviewer, který nemůže upravovat, zůstává nezávislý.
      - Chyba zachycená tady stojí čas agenta, ne váš.
  limit: Které nástroje agent smí, hlídá AI nástroj. Které soubory smí měnit, je jen pravidlo, které dodržuje. Zámek to není.
  minutes: 1
  notes: Ani agenti v pkitu nevznikají nahodile. Když se stejný druh kontroly pořád vrací, stane se z něj role (COR-007).
    Roli zavede rozhodnutí a určí jí práci a meze. COR-024 zavádí agenty critic a architect. COR-057 zavádí agenta rule-set-reviewer.
    COR-044 zavádí agenta process-author, který píše kód jen tam, kde mu to dovolíte. Dva další revieweři jsou starší než
    jakýkoli jejich vlastní záznam a místo jim dává COR-024. K čemu to je? Agent, který návrh píše, ho ukáže napůl hotový,
    takže levné chyby skončí až ve vašem review. Agent, se kterým mluvíte, celý systém nehlídá, a ve výchozím stavu ho nehlídá
    nikdo. Čas agenta je levný, váš ne. Reviewer, který jen čte, nemůže své nálezy sám opravit, a proto zůstává nezávislý
    (COR-024). Každý soubor vlastní jeden agent (COR-013). Nástroje ze souboru agenta vynucuje AI nástroj. Které soubory agent
    vlastní, je jen pravidlo, které dodržuje. Vlastní agenty dáte do .pkit/agents/project/ a vytvoříte je skillem agent-author
    a příkazem pkit new agent.
