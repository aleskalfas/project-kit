- id: docs
  part: P3
  title: Dokumentace, která ví, že neplatí
  message: 'Když se změní něco, na čem dokument závisí, změna k němu musí dát odpověď: upraveno, stále platí, nebo
    odloženo.'
  problem: ''
  does: []
  show: 'V project-kitu dnes čeká 21 odpovědí „odloženo“. pkit friction debt vypíše každou i s důvodem.'
  visual:
    kind: answers
    font_size: 22
    left_w: 1200
    left:
      head: Kontrola jmenuje dokument
      terminal:
      - [['# změna přesune changesety do .changesets/', comment]]
      - [['$ ', prompt], [pkit, command], [' friction check', args]]
      - [['  .pkit/release/README.md', args]]
      - [['    ', output], [friction, del], ['  path .changie.yaml  changed in this diff', output]]
      - [['              and carries no answer', output]]
      - [['Result: ', output], [failed, del]]
      - []
      - [['# po odpovědi', comment]]
      - [['$ ', prompt], [pkit, command], [' friction check', args]]
      - [['    ', output], [answered, add], ['  path .changie.yaml  changed in this diff;', output]]
      - [['              answered: updated', output]]
      - [['Result: ', output], [passed, add]]
    right:
      head: Změna k němu dá jednu ze tří odpovědí
      answers:
      - {tone: updated, tag: Upraveno, text: Změna opravila i dokument.}
      - {tone: unchanged, tag: Stále platí, text: Nic v něm nepřestalo platit. Odpověď řekne proč.}
      - {tone: deferred, tag: Odloženo, text: 'Odpověď jmenuje issue, které ho opraví.'}
      terminal:
      - [['# .pkit/project/friction/answers/20261030T024530Z-ba8d160a.yaml', comment]]
      - [['answers:', output]]
      - [['  - artefact: ', output], [.pkit/release/README.md, args]]
      - [['    revalidated:', output]]
      - [['      outcome: ', output], [updated, add]]
    why:
      head: Proč pkit chce odpověď
      items:
      - Ne každá změna dokument zneplatní. Odpověď řekne, jak to je.
      - Každou odpověď ověří reviewer, takže „stále platí“ chce skutečný důvod.
      - Otevřená mezera zůstává v evidenci i s issue, které ji uzavře.
  limit: Pokryté jsou jen dokumenty, které vyjmenujete, i s tím, na čem závisí. Ostatní zastarají jako dřív.
  minutes: 2
  notes: >-
    Když změna sáhne na něco, na čem dokument závisí, kontrola změn dokument jmenuje a chce odpověď (COR-050). Tady
    změna přesune složku changesetů v .changie.yaml, souboru, na kterém závisí příručka k vydávání. Kontrola selhává,
    dokud změna k příručce nedá odpověď. Odpovědi jsou tři. Upraveno: změna opravila i dokument, tady zmínky o té
    složce v příručce. Stále platí: nic v dokumentu nepřestalo platit a odpověď jednou větou řekne proč. Odloženo:
    odpověď jmenuje issue, které dokument opraví, a do té doby mezera zůstává v pkit friction debt. Odpověď zapíše
    pkit friction revalidate nebo pkit friction defer do souboru odpovědí dané změny; ten zůstává v projektu, nejen
    v textu pull requestu (COR-050, COR-062). Odpověď zkontroluje reviewer, který ji nepsal, a když neobstojí,
    zablokuje merge (COR-050 bod 3). Každá session dostane pravidlo, podle kterého agenti píšou tyto odpovědi spolu
    se svou změnou, aniž by se vás ptali (pravidlo jádra č. 20). V čerstvé instalaci kontrola spí, dokud nevyjmenujete
    své dokumenty ve friction.places v .pkit/project/config.yaml a v front matter každého z nich neuvedete, na čem
    závisí. Doplňky pro dokumentaci a analýzu to obojí udělají pro své dokumenty samy. Vyzkoušeno 30. října na
    jednorázové kopii project-kitu. V project-kitu dnes čeká jako odložených 21 odpovědí; všechny až na jednu jmenují
    issue, které je opraví.
