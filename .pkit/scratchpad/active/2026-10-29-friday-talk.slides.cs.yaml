      terminal:
      - [['# .claude/agents/architect.md', comment]]
      - [['gates: ', output], ['[COR-024, COR-025, COR-014]', pkit]]
      - [['owns:', output]]
      - [['  - ', output], [README.md, yours]]
      - [['  - ', output], [docs/architecture/decisions/, yours]]
    ties:
    - head: Jeho rozhodnutí
      text: Jeho první řádky jmenují rozhodnutí, kterými se řídí, a dokumenty, které čte.
    - head: Ověřeno
      text: pkit validate ověří každé jméno a že žádní dva agenti nevlastní stejný soubor.
    - head: Vždy aktuální
      text: Každý upgrade ho nasadí znovu, s vašimi cestami.
    note:
      icon: step-question-important
      head: Musíte ho zapojit?
      command: '$ pkit sync   # po změně overlay.yaml'
      body: Ne. Čerstvá instalace doplní výchozí cesty a všech šest agentů je hned připraveno.
  limit: Agenty pkitu nikdy neupravujete. Pro jinou roli si napíšete vlastního v .pkit/agents/project/.
  minutes: 1
  notes: >-
    Nic z toho se nezapojuje ručně. Při instalaci a při každém syncu pkit zkopíruje své agenty do složky vašeho AI
    nástroje, .claude/agents/, vedle vašich vlastních. Každý agent v prvních řádcích jmenuje rozhodnutí, kterými se
    řídí, a dokumenty, které čte. Architect se řídí COR-024, COR-025 a COR-014 a čte COR-006, COR-007 a COR-013. Kde
    agent potřebuje cestu ve vašem projektu, má v souboru zástupný název, třeba adr-records. Nasazení ho doplní
    z vašeho overlay.yaml, na který sync nikdy nesáhne. Čerstvá instalace do tohoto souboru zapíše výchozí cesty,
    takže všech šest agentů funguje hned. Agent, kterému odeberete povinnou cestu, se vynechá a pkit agents řekne
    proč. pkit agents adopt vytvoří chybějící složku a zapíše ji. pkit validate ověří, že každý agent jmenuje každé
    rozhodnutí a dokument, na který odkazuje, a že žádní dva agenti nevlastní stejný soubor. Agenti také pracují přes
    vlastní skilly a příkazy pkitu. process-author mění proces jen přes skill process. rule-set-reviewer čte pravidla
    přes pkit rule-sets altered. Každý upgrade nahradí soubory agentů pkitu a znovu je nasadí s vašimi cestami.
    V overlay.yaml můžete agentovi nastavit i model a úsilí (effort).
- id: permissions
  part: P2
  title: Odkud se berou oprávnění
  message: Z pravidel, která projekt zapíše jako data. AI nástroj je uplatní na každé volání, i když na ně agent
    zapomene.
  problem: ''
  does: []
  show: 'V project-kitu: agent project-manager má zakázané změny přímo přes gh, a tak používá příkazy pkitu, které
    nejdřív ověří issue.'
  visual:
    kind: map
    head_h: 136
    row_h: 112
    columns:
    - head: Pravidlo
      text: rozhodlo COR-028
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Zapsáno jako data
      text: v čitelných souborech
      fill: '#BE95FFFF'
    - head: Dostane AI nástroj
      text: a sám uplatní
      fill: '#D4BBFFFF'
    - head: Na co volání narazí
      text: pokaždé
      fill: '#E8DAFFFF'
    rows:
    - [{head: Pojistky, text: pro vás i každého agenta}, 'rm -r, sudo a force-push, zakázané všem', Zákaz v jeho
        nastavení, Odmítnuto v každém režimu]
    - [{head: Vlastní nástroje agenta, text: v souboru agenta}, 'critic: Read, Glob, Grep, WebFetch', Seznam nástrojů
        toho agenta, 'Žádný příkaz, žádný zápis souboru']
    - [{head: Pravidlo agenta, text: z project-management}, 'project-manager: žádné změny přes gh', 'Hook, před
        každým voláním', 'Odmítnuto, a tak použije příkazy pkitu']
    why:
      head: Proč pkit oprávnění zapisuje
      items:
      - Pravidlo, které agent čte, je rada. Pravidlo, které uplatní AI nástroj, ne.
      - Zapsané pravidlo jde přečíst a zrevidovat jako každou změnu.
      - Nastavení nástroje platí pro všechny stejně. Hook rozhoduje u každého agenta.
      - Příkazy pkitu mají brány, které přímé příkazy přeskočí. Agent je neobejde.
  limit: Zákaz zastaví ty podoby příkazu, které pkit rozpozná. Příkaz schovaný za jiným může proklouznout.
  minutes: 1
  notes: >-
    COR-028 rozhoduje, že to, co smí běžet, jsou data: oprávnění udělená agentům, v souborech. Katalog oprávnění
    pojmenuje, tři profily jsou připravené (read-only, non-destructive a autonomous) a váš projekt přidá vlastní
    udělení. pkit je zapíše do nastavení vašeho AI nástroje a volitelný hook zkontroluje každé volání, než se spustí.
    Agent je omezený na třech místech. Pojistky platí pro všechny, vás nevyjímaje. Vlastní soubor agenta vyjmenuje
    jeho nástroje a váš AI nástroj ten seznam vynucuje jen u toho agenta. Pravidlo pro jednoho agenta potřebuje hook.
    Šest agentů pkitu žádné vlastní pravidlo nemá: jejich mezí jsou jejich nástroje. Jediné pravidlo pro jednoho
    agenta přichází s doplňkem project-management. Jeho agent project-manager nesmí používat přímé příkazy gh, které
    mění issues a pull requesty. Musí použít příkazy pkitu, které issue ověří a hlídají brány pro uzavření a pro
    schválení, takže je nepřeskočí ze zvyku. Doplněk to pravidlo přinese s sebou, bez jakéhokoli nastavování. Zákaz
    je zpomalovací práh, ne bezpečnostní hranice: obal jako bash -c nebo uv run ho může obejít, a proto skutečné
    brány sedí uvnitř příkazů pkitu.
