# Slajdy páteční přednášky jako data, česká verze. Stejná struktura jako
# 2026-10-29-friday-talk.slides.yaml, klíč po klíči a seznam po seznamu; generátor ji
# staví pod anglickou verzi (třetí argument gen.py).
# Přeloženo z anglické verze (2026-10-29-friday-talk.slides.yaml), slajd po slajdu podle smyslu.
#
# Slovník, jedno slovo pro jednu věc (podrobně .agent-workspace/cs/glossary.md, jen na tomto stroji):
# vy (vykání, malými písmeny); merge; závisí na; vazba (tie); doplněk (capability);
# záznam o rozhodnutí, krátce záznam; skill; agent; oprávnění; schéma; proces, stav,
# přechod, brána; kontrola; session; poznámka ve scratchpadu; reviewer; schválit
# (accept); "pravidla" vždy upřesněná; vývojářský agent (builder), na obrázku "Vývojář: Task A";
# slot, sloty; role; vyplnit slot (fill).

talk:
  project: project-kit (pkit)
  link: github.com/aleskalfas/project-kit
  title: Vývoj s AI tak, jak rozhodl váš projekt
  author: Aleš Kalfas
  date: 30. října 2026
  version: pkit 1.149
  length_minutes: 30
parts:
- id: P0
  title: pkit v kostce
  summary: Proč pkit vznikl, jak ho nainstalovat a jak do sebe zapadají jeho části.
- id: P1
  title: Od nápadu k pravidlu
  summary: Kde začínají nápady, vaše rozhodnutí, co se dozví každá session a pravidla, která uplatňuje program.
- id: P2
  title: Jak agent pracuje
  summary: Postupy, role a co smí každý agent.
- id: P3
  title: Udržet vše v souladu
  summary: Co pkit kontroluje a dokumenty, které stále platí.
- id: P4
  title: Co si doinstalujete
  summary: 'Doplňky (capabilities): volitelné části pro váš druh práce a jak se propojují.'
- id: P5
  title: Otázky
  summary: ''
  section: false
slides:
- id: opening
  part: P0
  title: Proč pkit?
  message: Váš AI agent pracuje rychle a zapomíná všechno, co váš projekt rozhodl.
  problem: ''
  does: []
  show: 'Otázka: jak ho přimět pracovat podle vašeho projektu, bez těžkopádného frameworku?'
  visual:
    kind: pairs
