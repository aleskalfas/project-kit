    - head: Skilly · agenti · oprávnění
      text: Jak agenti jednají, v jaké roli a s jakými právy.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    - head: Příkazy a kontroly pkitu
      text: Provádějí, co je rozhodnuto, a kontrolují každou změnu.
      fill: '#D4BBFFFF'
      ink: '@text_primary'
    - head: Váš kód a dokumenty
      text: Samotná práce, navázaná na to, na čem závisí.
      fill: '#E8DAFFFF'
      ink: '@text_primary'
    side:
    - head: Kde začínají nápady
      text: V rozhovoru, a když to trvá déle, v poznámce ve scratchpadu.
      role: code
      arrow: right
      at: 0
      h: 300
      w: 600
    - head: Provedeno
      text: Každá vrstva provádí rozhodnutí nad sebou. Důvody zůstávají na jednom místě, kde si je agent přečte dřív,
        než cokoli změní.
      arrow: down
      at: 0
      h: 440
    - head: Ověřeno
      text: Když vrstva nesedí s rozhodnutím, nejdřív se prověří vrstva, takže se rozhodnutí nikdy nepřizpůsobí kódu.
        Rozhodnutí měníte jen vy.
      arrow: up
      at: 492
      h: 440
  limit: ''
  minutes: 1.5
  notes: >-
    Rozhovor skončí. Co se v něm rozhodne, jde do záznamu o rozhodnutí; co zůstane otevřené, do poznámky ve
    scratchpadu. Kde rozhodnutí ještě není, platí to, co je postavené, dokud tu volbu neudělá nějaká změna; pak jde
    rozhodnutí první. Vrstva, která s rozhodnutím nesedí, zaostává a opraví se, nebo se napíše nové rozhodnutí a vy
    ho schválíte. Většina vrstev se píše ručně, takže může zaostávat; co je na rozhodnutí navázané, se ozve, když se
    rozhodnutí změní. Po instalaci projdeme vrstvy odshora.
- id: install
  part: P0
  title: Instalace pkitu
  message: Nástroj nainstalujete jednou, pak pkit přidáte do každého projektu jedním příkazem. Upgrade nahradí
    soubory pkitu, nikdy vaše.
  problem: ''
  does: []
  show: pkit status ukáže, co pkit v projektu nastavil. Volitelné doplňky (capabilities) přijdou později.
  visual:
    kind: install
    terminal: |-
      # jednou, na vašem počítači
      $ uv tool install \
          git+ssh://git@github.com/aleskalfas/project-kit.git@latest
      $ pkit --version

      # v každém projektu
      $ cd your-project
      $ pkit init
    highlight:
      icon: step-lock-important
      head: Nechcete pkit ve svém repozitáři?
      command: $ pkit visibility private
      body: pkit zůstane jen ve vašem klonu, skrytý gitovým souborem exclude. Nic z něj se necommitne a agent ho
        přesto používá celý.
    listing:
    - [['$ ', prompt], [tree, command], [' -a -L 2 your-project', args]]
    - [[your-project/, plain]]
    - [['├── ', branch], [.pkit/, plain], ['                        # metodika', comment]]
    - [['│   ├── ', branch], [adapters/, pkit], ['                 # most k vašemu AI nástroji', comment]]
    - [['│   ├── ', branch], ['agents/ ', plain], [core/, pkit], [' ', plain], [project/, yours]]
    - [['│   ├── ', branch], [cli/, pkit], ['                      # popis příkazu pkit', comment]]
    - [['│   ├── ', branch], ['decisions/ ', plain], [core/, pkit], [' ', plain], [project/, yours]]
    - [['│   ├── ', branch], [lifecycle/, pkit], ['                # instalace, sync, upgrade', comment]]
    - [['│   ├── ', branch], [migrations/, pkit], ['               # převedou projekt na nové verze', comment]]
    - [['│   ├── ', branch], ['permissions/ ', plain], [project/, yours], ['     # co smějí agenti', comment]]
    - [['│   ├── ', branch], [process/, pkit], ['                  # procesy se stavy, jako data', comment]]
    - [['│   ├── ', branch], ['rules/ ', plain], [core.md, pkit], [' ', plain], [project.md, yours], [' # sem píšete vy', comment]]
    - [['│   ├── ', branch], [schemas/, pkit], ['                  # co čtou nástroje', comment]]
    - [['│   ├── ', branch], [scratchpad/, yours], ['               # vaše nedotažené nápady', comment]]
    - [['│   ├── ', branch], ['skills/ ', plain], [core/, pkit], [' ', plain], [project/, yours]]
    - [['│   ├── ', branch], [manifest.yaml, pkit], ['             # co je nainstalováno a v jaké verzi', comment]]
    - [['│   └── ', branch], [.gitignore, pkit], ['                # běhové soubory pkitu', comment]]
    - [['├── ', branch], [.claude/, plain], ['                      # vaše nastavení Claude Code', comment]]
    - [['│   ├── ', branch], ['agents/  skills/', plain], ['          # ', comment], [pkitu, pkit], [' vedle ', comment], [vašich, yours]]
    - [['│   └── ', branch], [settings.json, plain], ['             # ', comment], [vaše, yours], [', ', comment], [pkit, pkit], [' přidá svoje', comment]]
    - [['├── ', branch], [.agent-workspace/, plain], ['             # pracovní soubory agentů, bez commitu', comment]]
    - [['├── ', branch], [CLAUDE.md, yours], ['                     # načte pravidla do každé session', comment]]
    - [['└── ', branch], [src/, yours], ['                          # váš kód, pkit na něj nesahá', comment]]
    - [['# ', comment], [fialové, pkit], [': pkitu, každý upgrade je nahradí · ', comment], [modré, yours], [': vaše', comment]]
    font_size: 26
  limit: ''
  minutes: 1.5
  notes: >-
    pkit init zapíše soubory pkitu do .pkit/, sloučí nastavení vašeho AI nástroje, aniž by ho přepsal, a nainstaluje
    skilly a agenty tam, kde je Claude Code čte. Dnes je to Claude Code. Sync obnoví jen vlastní položky pkitu; vaši
    agenti, skilly a nastavení zůstanou. Při zkušební instalaci očima nováčka se pro projekt o čtyřech souborech
    commitlo 689 souborů. V kontextu agenta je jen jeden soubor pravidel a jeden řádek na každý skill a agenta.
- id: ideas
  part: P1
  title: Kde začínají nápady
  message: V rozhovoru. Poznámka ve scratchpadu uchová vaši dohodu i po konci session, než z ní vzejdou záznamy,
    issues či dokumenty.
  problem: ''
  does: []
  show: 'V project-kitu: 28 hotových poznámek, z nich vzešlo 41 záznamů, 31 issues a 15 dokumentů'
  visual:
    kind: ideas
    font_size: 26
    conversation:
      icon: row-chat
      head: Rozhovor
      text: Spolu s agentem dáváte nápadu tvar, dokud session neskončí nebo nedojde kontext.
      text_h: 150
    note:
      icon: row-doc
      head: Poznámka ve scratchpadu
      text: Uchová, na čem jste se dohodli. Čeká bez termínu a další session si ji přečte.
      terminal: |-
        .pkit/scratchpad/active/
          2026-06-01-cli-design-conventions.md
        # jak navrhovat příkaz pkitu?
        # otevřená od června, bez termínu
    becomes_head: Když je hotová, vzniknou z ní
    becomes:
    - head: Rozhodnutí
      text: COR-041 a ADR-040, z poznámky ze 3. července
    - head: Issues
      text: '14 issues: plán jedné velké feature'
    - head: Dokumenty
      text: 10 případů užití a 2 cesty, z jedné poznámky
    dropped:
      text: Nebo zahozená, i s důvodem, proč byla zahozena.
  limit: 'Poznámku za vás nikdo nenapíše: co zůstane jen v rozhovoru, zmizí spolu s ním.'
  minutes: 1
  notes: >-
    Na limit kontextu tady narazil každý. Poznámka ve scratchpadu je místo, kde to, na čem jste se dohodli, ten limit
    přežije: další session si poznámku přečte. Poznámka může počkat: ta ukázaná, o tom, jak navrhovat příkaz pkitu,
    je otevřená od června, stejně jako 13 dalších z 33 aktivních, a to je v pořádku. Stav poznámky určuje složka, ve
    které leží (COR-012): pkit new scratchpad <slug> založí poznámku v .pkit/scratchpad/active/, pkit scratchpad done
    <slug> --produced <ref> ji přesune do done/ a zapíše, co z ní vzniklo, pkit scratchpad drop ji přesune do
    dropped/. Je to soubor v repozitáři, ne chat ani paměť nástroje, takže kolegové i každý agent čtou stejnou
    poznámku, a hotová poznámka zůstává jako příběh toho, jak se k rozhodnutí došlo. Z 28 hotových poznámek vzniklo
    také jedno schéma, jeden pull request a jeden milník. COR-041 a ADR-040 se ještě vrátí u příručky k vydávání.
- id: decisions
  part: P1
  title: Záznamy o rozhodnutí
  message: Záznam o rozhodnutí uchová jednu volbu a důvod, proč padla. Místo, kde leží, říká, čeho se týká a kdo ho
    smí měnit.
  problem: ''
  does: []
  show: 'Tento týden: nový záznam COR-065 nahradil větu z COR-006, aniž by se starý záznam upravoval'
  visual:
    kind: kinds
    groups:
    - head: Jak se pracuje
      path: .pkit/decisions/
      kinds:
      - tag: COR
        tone: pkit
        head: Principy pkitu
        text: Jak metodika funguje, stejně v každém projektu.
        path: core/COR-065-records-and-projection.md
        why: 'Odděleně od vašich: každý upgrade je nahradí, takže je nikdy neupravujete.'
      - tag: PRJ
        tone: yours
        head: Váš způsob práce
        text: Jak pracuje váš tým, ve volbách, které pkit nechává na vás.
        path: project/PRJ-002-version-bump-policy.md
        why: 'Jen vaše: sem žádný upgrade nikdy nepíše.'
    - head: Co stavíte, ve složce, kterou zvolíte
      path: docs/architecture/decisions/
      kinds:
      - tag: ADR
        tone: architecture
        head: Vaše architektura
        text: 'Jak je postavený váš systém: struktura, technologie a hranice.'
        path: ADR-001-project-root-resolution.md
        why: Leží u dokumentace vašeho systému, kde je drží jeho architekt.
  limit: 'Napsat a zrevidovat záznam stojí čas: vyplatí se jen u voleb, na kterých staví další práce.'
  minutes: 1.5
  notes: >-
    Dvě otázky dávají tři místa: čeho se záznam týká, tedy jak se pracuje, nebo co stavíte, a kdo ho smí měnit, pkit,
    nebo vy. pkit nikdy nerozhoduje o vaší architektuře, proto čtvrté místo není. Principy pkitu se mění novým
    záznamem, který si můžete přečíst, nikdy tichou úpravou: v červnu jich bylo 39, teď 67, a tento týden COR-065
    nahradil větu z COR-006. V samotném project-kitu je 11 PRJ a 74 ADR. Doplňky přinášejí vlastní záznamy
    o rozhodnutí, ukážeme je u doplňků.
- id: found
  part: P1
  title: Rozhodnuto, později nalezeno
  message: Rozhodnutí schválíte dřív, než na něm začne stavět práce. Později ho agent najde, než změní soubory,
    kterých se týká.
  problem: ''
  does: []
  show: 'Tento týden: ADR-075 rozhodl, jak vznikají pravidla, která každá session načítá. Byl schválen a mergnut
    spolu se svým kódem.'
  visual:
    kind: story
    stages:
    - role: agents
      head: Agent ho navrhne
      text: Napíše záznam a naváže na něj příručku k vydávání.
      terminal: |-
        $ cat .pkit/decisions/project/PRJ-002-….md
        id: PRJ-002
        title: Version-bump policy
        status: proposed    # dokud ho neschválíte
        ## Context          # proč se to řeší
        ## Decision         # co se rozhodlo
        ## Rationale        # proč, co se zamítlo
        ## Implications     # co z toho plyne

        # .pkit/release/README.md, jeho front matter:
          friction:
            anchors:
        +     record: [PRJ-002]
    - role: people
      head: Vy ho schválíte
      text: Vidíte ho před mergem, kdy je jeho změna nejlevnější.
      terminal: |-
        # pull request, před mergem:
          .pkit/decisions/project/PRJ-002-….md
        - status: proposed
        + status: accepted

          .pkit/release/README.md
            anchors:
        +     record: [PRJ-002]
    - role: agents
      head: Pozdější session ho najde
      text: Nezná žádný z vašich důvodů, a tak nejdřív vyhledá záznamy.
      terminal: |-
        $ pkit refs records-for .pkit/release/README.md
        6 records tied directly:
          PRJ-002  Version-bump policy …
          PRJ-004  Distribution via direct git URL …
          ADR-040  Fetch externally-sourced content …
          COR-010  Lifecycle of installed resources
          …
        # agent je přečte, než soubor změní
    font_size: 24
  limit: Najdou se jen záznamy navázané na soubor, přímo nebo přes dokument, který na něm závisí.
  minutes: 1
  notes: >-
    Jeden záznam, PRJ-002, během svého života: vznikne jako navržený (proposed), schválí se v pull requestu jedním
    řádkem a pozdější session ho najde za příručkou k vydávání, vedle záznamů dalších dvou druhů. Schválení je na
    vás: kontrola může odmítnout merge záznamu, který je pořád jen navržený, a kdo merge povoluje, vidí každý
    záznam, který tím schvaluje. Agent naváže příručku na záznam už při jeho psaní, protože příručka záznam provádí:
    změna PRJ-002 se pak zeptá, jestli příručka stále platí, jak ukáže slajd o dokumentaci, a vyhledávání čte tutéž
    vazbu pozpátku. V project-kitu vznikla tahle vazba ve chvíli, kdy se z příručky stal takový dokument. Než agent
    změní soubor, spustí tohle vyhledávání; je to jedno z pracovních pravidel, která se dozví každá session. Volba
    z chatu je v další session pryč; záznam se najde.
- id: sessions
  part: P1
  title: Co se dozví každá session
  message: Pár krátkých pravidel, jak pracovat, pkitu i vašich. Záznamů je moc na načtení, a tak každé pravidlo
    uvádí ten, ze kterého vychází.
  problem: ''
  does: []
  show: 'Tento týden: každé pravidlo dostalo trvalé id a stav. Soubor, který každá session načítá, se teď
    z pravidel generuje.'
  visual:
    kind: rules
    center: 868
    top_w: 1000
    step: 240
    level_h: 200
    levels:
    - head: Rozhodnutí (COR-065)
      text: Agent čte záznamy, jen když něco mění, ne v každé session.
      fill: '#491D8BFF'
      ink: '@text_on_color'
    - head: Pravidlo pro každou session (pravidlo 22)
      text: Než změníte soubory, přečtěte si záznamy za nimi.
      fill: '#6929C4FF'
      ink: '@text_on_color'
    - head: Co agent udělá
      text: Než změní soubor, spustí pkit refs records-for a přečte, co vypíše.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    font_size: 28
    terminal:
    - [['# načte se na začátku každé session', comment]]
    - [[.pkit/rules/core.md, pkit], ['      # od pkitu, v každém projektu', comment]]
    - [[.pkit/rules/project.md, yours], ['   # vaše, pkit na něj nesahá', comment]]
    - []
    - [['# vyhledá se, když je potřeba', comment]]
    - [['$ ', prompt], [pkit, command], [' refs records-for <files>', args], ['  # záznamy za tím,', comment]]
    - [['                                 # co se mění', comment]]
    - [['$ ', prompt], [pkit, command], [' rule-sets reach <paths>', args], ['   # pravidla pro to,', comment]]
    - [['                                 # co agent píše', comment]]
  limit: 'Pravidlo je jen rada: agent ho může porušit.'
  minutes: 1.5
  notes: >-
    Záznamů je hodně a čtou se, když se něco mění. Do každé session se místo nich načte pár pravidel, jak jednat,
    a každé odkazuje na rozhodnutí, které provádí. Pravidlo 22 je důvod, proč agent před změnou souboru vyhledá jeho
    záznamy; provádí bod 7 COR-065, tedy záznamu za pyramidou. Každé pravidlo má trvalé id, stav a původ, tedy
    záznam, který provádí, nebo datovaná slova toho, kdo o něm rozhodl, a změněný záznam vyzve svá pravidla
    k nové kontrole (COR-068, ADR-075, v main od 29. října). Váš project.md je váš; sync na něj nikdy nesáhne.
    Pravidla pro konkrétní soubory, třeba pravidla pro kód v Pythonu, se nenačítají: jsou to sady pravidel omezené
    na ty soubory, vyhledají se přes pkit rule-sets reach a při merge je zkontroluje reviewer (#2273 a #2274, ve
    review). Také ve review: limit velikosti, který kontroluje pkit validate (#2262), a pravidlo, kdy začíná záznam
    o rozhodnutí (#2258). Dál: každý nainstalovaný doplněk přinese vlastní pravidla, načtená, dokud je nainstalovaný
    (#2269, ukážeme u doplňků), a pravidla zkrácená na jednu až dvě věty (#2261). Dnes: 22 pravidel, asi 2 800 slov,
    v každé session.
- id: schemaslook
  part: P1
  title: Jak vypadají schémata a procesy
  message: 'Schéma tvoří dva soubory: pravidlo jako data a tvar, který ta data musí mít. Proces je schéma ze stavů
    a přechodů.'
  problem: ''
  does: []
  show: 'V čerstvé instalaci: 8 vlastních schémat pkitu a tvar, který musí mít každý proces. pkit validate je
    zkontroluje všechny.'
  visual:
    kind: files
    font_size: 22
    groups:
    - head: 'Schéma: dva soubory'
      tag: V jádře pkitu
      tone: core
      panels:
      - head: Pravidlo jako data
        terminal:
        - [['# .pkit/schemas/privilege-catalog.yaml', comment]]
        - [['vcs-history-rewrite:', output]]
        - [['  description: ', output], ['Rewriting published git history (force-push).', args]]
        - [['  guardrail: ', output], ['true', args]]
        - [['  recognize:', output]]
        - [['    bash:', output]]
        - [['      - cmd: ', output], [git, args]]
        - [['        subcommand: ', output], ['[push]', args]]
        - [['        flag_any: ', output], ['["--force", "-f", …]', args]]
      - head: Tvar, který musí mít
        terminal:
        - [['# .pkit/schemas/privilege-catalog.schema.json', comment]]
        - [['"entry": {', output]]
        - [['  "type": ', output], ['"object",', args]]
        - [['  "additionalProperties": ', output], ['false,', args]]
        - [['  "required": ', output], ['["description", "recognize"],', args]]
        - [['  "properties": {', output]]
        - [['    "description": {', output]]
        - [['      "type": ', output], ['"string",', args]]
        - [['      "minLength": ', output], ['1,', args]]
    - head: 'Proces: jeden druh schématu'
      tag: 'Příklad z doplňku: není v jádře pkitu'
      tone: example
      panels:
      - head: Workflow pro issues
        terminal:
        - [['# .pkit/capabilities/project-management/', comment]]
        - [['#   schemas/workflow.yaml', comment]]
        - [['process:', output]]
        - [['  id: ', output], [issue-lifecycle, args]]
        - [['  states:  ', output], ['# todo … done, pět', comment]]
        - [['  transitions:', output]]
        - [['    - from: ', output], [review, args]]
        - [['      to: ', output], [done, args]]
        - [['      authorisation: ', output], [user, yours]]
    below:
      head: Co přináší jádro pkitu, aby to žádný doplněk ani projekt nestavěl znovu
      terminals:
      - - [['# pro schémata', comment]]
        - [['$ ', prompt], [pkit, command], [' new schema <capability> <name>', args], ['   # pravidlo a jeho tvar, jako pár', comment]]
        - [['$ ', prompt], [pkit, command], [' validate', args], ['                         # každý soubor proti jeho tvaru', comment]]
        - [['$ ', prompt], [pkit, command], [' data validate <file>', args], ['             # i vaše vlastní datové soubory', comment]]
      - - [['# pro procesy', comment]]
        - [['$ ', prompt], [pkit, command], [' process new <capability>:<id>', args], ['    # proces, brány zatím jako stuby', comment]]
        - [['$ ', prompt], [pkit, command], [' process status', args], ['                   # kde je a proč', comment]]
        - [['$ ', prompt], [pkit, command], [' process move', args], ['                     # přechod, odmítnutý, když není povolený', comment]]
  limit: pkit validate kontroluje, že soubor má svůj tvar, ne že je pravidlo v něm správné.
  minutes: 1
  notes: >-
    Než přijde příklad, nejdřív samotné soubory. Schéma je dvojice souborů. Jeden drží pravidlo jako data, tady
    oprávnění, které pokrývá force-push: co to je, že jde o pojistku a podle čeho se takový příkaz pozná. Druhý,
    soubor .schema.json vedle něj, říká, co taková data musí obsahovat: položka potřebuje popis a blok recognize a nic
    jiného v ní být nesmí. Příkazy, skilly a agenti pkitu čtou první soubor; pkit validate ho kontroluje proti
    druhému (COR-018). Právě kvůli tomuto pravidlu je force-push zakázaný každému agentovi; uvidíte to později
    u oprávnění. Vlastní schémata pkitu leží v .pkit/schemas/, je jich 8 a většinou patří k modelu oprávnění. Každý
    doplněk má svá ve vlastní složce schemas/. Proces je jeden druh schématu: soubor stavů a přechodů, s bránou na
    každém přechodu (COR-033). Ukázaný proces není součástí jádra pkitu: je to workflow pro issues z doplňku
    project-management, jediný proces, který se dnes používá. Jádro pkitu dodává to, co potřebuje každý proces: tvar,
    který musí mít každý soubor procesu (.pkit/schemas/_defs/process.schema.json), engine a příkazy. O tom je spodní
    řada: pkit přináší příkazy pro schémata a procesy, takže doplněk ani projekt nikdy nestaví vlastní validátor ani
    vlastní stavový automat. Proč je pravidlo data: leží na jednom místě, odděleně od kódu, který ho uplatňuje, takže
    jeho změna je úprava dat, ne změna kódu (COR-018); a nový proces je nový soubor, ne nová mašinérie (COR-033).
    pkit process new přidá proces do doplňku, s kostrou (stubem) každé brány, která selhává, dokud ji nenapíše agent
    process-author (COR-044). Vaše vlastní datové soubory mohou uvést schéma, kterým se řídí, a pkit data validate je
    zkontroluje (COR-023).
- id: schemas
  part: P1
  title: Jak doplněk používá proces
  message: project-management přináší workflow pro issues. Každý přechod kontroluje engine pkitu, takže doplněk
    vlastní engine nepsal.
  problem: ''
  does: []
  show: 'V project-kitu dnes: Feature #2270 nejde uzavřít, dokud 7 jejích políček není zaškrtnutých.'
  visual:
    kind: board
    font_size: 22
    states: [Todo, Backlog, In Progress, Review, Done]
    moves:
    - {who: you, text: vy naplánujete}
    - {who: agent, text: agent začne}
    - {who: agent, text: agent otevře pull request}
    - {who: you, text: vy mergnete}
    card:
      at: 2
      to: 4
      head: 'Feature #2270'
      text: uzavře se, až je vše zaškrtnuté
      refused: Odmítnuto
      reason: chybí 7 zaškrtnutí
    panels:
    - head: Přechod ve workflow.yaml doplňku
      terminal:
      - [['# workflow.yaml, from project-management', comment]]
      - [['- from: ', output], [in-progress, args]]
      - [['  to: ', output], [done, args]]
      - [['  authorisation: ', output], [user, yours]]
      - [['  gate:', output]]
      - [['    kind: ', output], [deterministic, args]]
      - [['    predicate:', output]]
      - [['      run: ', output], [gate-checkboxes-ticked, pkit]]
      caption: Jeho tvar dává jádro pkitu, stejný pro každý proces.
    - head: Na co se agent ptá pkitu
      terminal:
      - [['$ ', prompt], [pkit, command], [' process status \', args]]
      - [['    project-management:issue-lifecycle', args]]
      - [['    --subject 2270', args]]
      - [['Where: ', output], ['in-progress — Branch open, work in flight.', args]]
      - [['Legal moves (live precheck):', output]]
      - [['  ✗ done  [close-issue]', del]]
      - [['      7 unticked checkbox(es) remain', del]]
    - head: Proč to pomáhá
      items:
      - Agent se zeptá, jak je práce daleko, místo aby hádal.
      - Přechod potřebuje svou kontrolu nebo vaše ano, nikdy jen slovo agenta.
      - Doplněk zapisuje každý přechod přes engine pkitu a žádný vlastní nepostavil.
  limit: 'pkit přináší engine, ne proces: ten, který se dnes používá, přichází s doplňkem project-management.'
  minutes: 1
  notes: >-
    Řekněte to jasně: takhle doplněk používá proces; jádro pkitu žádné workflow pro issues nemá. Tabuli úkolů zná
    každý: Todo, In Progress, Done. Tabule jen ukazuje, kde práce je. Tento proces navíc říká, kdo smí který přechod
    udělat a co musí předtím platit. Na tabuli Feature přeskakuje Review: uzavře se, až je zaškrtnuté každé políčko
    a vy řeknete ano. Feature #2270 má 7 políček nezaškrtnutých, takže pkit Done odmítne; přečteno živě 30. října
    příkazem pkit process status, který patří k jádru. Engine odpoví, kde issue je, jestli smí dál a proč ne,
    pokaždé stejně. Brána projde na základě kontroly nebo záznamu od někoho jiného, než je agent, kterého hlídá,
    nikdy jen na slovo agenta (COR-033 bod 4). Doplněk napsal pravidlo a jeho brány, nic víc: jeho příkaz pro
    uzavření zapisuje každý přechod přes pkit process move a přes pkit process cascade nechá rodiče následovat své
    potomky. Další schéma téhož doplňku, titles.yaml, drží formát názvu pro každý typ issue a pkit pm create-issue
    odmítne název ve špatném tvaru dřív, než issue založí. Záznam každého přechodu je volitelný a vypnutý, dokud ho
    nezapnete (COR-033 bod 7).
- id: skillsfrom
  part: P2
  title: Odkud se berou skilly
  message: Každý druh souboru, který určují rozhodnutí pkitu, dostane skill pro úsudek a příkaz pro to, co musí být
    přesné.
  problem: ''
  does: []
  show: 'V project-kitu: pkit dodává 11 skillů, každý se svým příkazem.'
  visual:
    kind: map
    chip_font: 32
    columns:
