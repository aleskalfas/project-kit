    druh schématu: soubor stavů a přechodů, kde na každém přechodu stojí gate, tedy kontrola, která musí projít (COR-033).
    Ukázaný proces není součástí jádra pkitu. Je to workflow pro issues z add-onu project-management a zatím jediný proces,
    který se používá. Jádro pkitu dodává to, co potřebuje každý proces: tvar, který musí mít každý soubor procesu (.pkit/schemas/_defs/process.schema.json),
