    ties:
    - head: Vaše konvence
      text: Napíšete je jednou a builder si je přečte nejdřív. Zůstanou vaše i bez add-onu.
    - head: Kód projde review
      text: Dřív pkit kód nekontroloval. Mergla se tak i změna se dvěma bezpečnostními dírami.
    - head: Blokace má váhu
      text: Reviewer blokuje, jen když umí chybu ukázat. Všechno ostatní je rada.
