      - Soubor agenta podle vzoru pkitu
    head_h: 136
    row_h: 112
    why:
      head: Proč pkit práci takhle dělí
      items:
      - Důvod je zapsaný na jednom místě. Skill na něj odkazuje a nikdy ho nekopíruje.
      - Příkaz nevybere název ani nenapíše obsah. Bez skillu agenti pravidla psaní vynechávali.
      - Agent se může přepočítat. Záznam psaný ručně jednou dostal špatné číslo.
      - Každý soubor daného druhu má stejný tvar, ať ho píše kdokoli.
  limit: Skilly pkitu pokrývají jen jeho vlastní soubory. Na práci, která se ve vašem projektu opakuje, si napíšete vlastní.
  minutes: 1
  notes: 'Skilly v pkitu nevznikají nahodile. Rozhodnutí pkitu zavádějí druhy souborů: poznámky ve scratchpadu, záznamy o
    rozhodnutí, agenty, migrace a další. Každý druh má svůj skill a svůj příkaz. S pkitem přichází 11 takových dvojic. Proč
    je práce rozdělená takhle? Důvod je zapsaný jen v rozhodnutí a skill na něj odkazuje, místo aby ho kopíroval (COR-006).
    Příkaz neumí to, co vyžaduje úsudek: vybrat druh, vymyslet dobrý název, napsat obsah a dát vám ho k review. Dokud skill
    neexistoval, agenti pravidla psaní vynechávali (COR-005). Samotný skill ale taky nestačí. Agent se může přepočítat a záznam
    psaný ručně jednou dostal špatné číslo (COR-005, PR #16). Čísla, strukturu a názvy proto řeší příkaz. Když se stejná práce
    vrátí dvakrát nebo třikrát, dostane vlastní nástroj. Pak stojí míň a pokaždé dopadne stejně (COR-007). Skill v prvních
    řádcích jmenuje rozhodnutí, kterými se řídí, a pkit validate ta jména kontroluje. Vlastní skilly dáte do .pkit/skills/project/,
    vedle skillů pkitu, a sync na ně nikdy nesáhne.'
