    - [['  created  .claude/agents/project-manager.md', output]]
    - [['$ ', prompt], [pkit, command], [' permissions explain', args]]
    - [['agent:project-manager', output]]
    - [['  deny  issue-tracker-write', del]]
    - [['  (contributed by capability: project-management)', comment]]
    - [['$ ', prompt], [pkit, command], [' validate', args]]
    - [['  13 validator(s) ran; 0 error(s)', output], ['     # předtím 12', comment]]
    - [['  All checks passed.', add]]
    why:
      head: Proč má pkit doplňky
      items:
      - Jádro má jen to, co potřebuje každý projekt. Zbytek by jen zatěžoval.
      - Doplněk dostane každý upgrade, stejně jako jádro. Ruční kopie ne.
      - 'Jedna složka: z cesty poznáte, čí soubor je.'
      - Vzniká jen z potřeby, která se ve skutečné práci vracela.
  limit: Některé doplňky potřebují nejdřív jiný. software-engineering se bez project-management nenainstaluje.
  minutes: 1.5
  notes: >-
    Všechno, co jste zatím viděli, je jádro pkitu a je v každé instalaci. Některé způsoby práce se ale hodí jen pro
    některé projekty, třeba vedení issues na GitHubu nebo review kódu. pkit každý takový zabalí jako doplněk, anglicky
    capability (COR-017). Doplněk přináší stejné vrstvy jako jádro, jen pro svůj způsob práce: vlastní záznamy
    o rozhodnutí, schémata a procesy, skilly, agenty a pravidla oprávnění, příkazy a kontroly. Všechno to leží v jedné
    složce, .pkit/capabilities/ a jméno doplňku. pkit doplněk vytvoří, jen když platí tři věci. Potřebují ho některé
    projekty, ale ne všechny (COR-014). Dá se přidat i odebrat jako jedna složka. Stejná potřeba se vracela ve
    skutečné práci (COR-007). Stejný test přesouvá i agenty: mezi prvními agenty jádra byl product manager, kterého
    projekt bez doplňků k ničemu nepotřebuje, a tak se přestěhoval do project-management (COR-026). Instalace zkopíruje
    složku doplňku a zaregistruje ho. Nasadí jeho skilly a agenty do .claude/, přidá jeho pravidla oprávnění do
    modelu oprávnění pkitu a jeho kontroly do pkit validate. Přečteno z čerstvé instalace: project-management se
    nainstaloval asi za 8 sekund, bez jakékoli přípravy. Doplněk může potřebovat jiný, a to ve verzi, kterou přijme:
    software-engineering se odmítne nainstalovat, dokud v projektu není project-management (COR-030). Odinstalace
    složku odstraní, ale odmítne, dokud na doplněk odkazují vaše vlastní soubory. Vlastní doplněk napíšete skillem
    capability-author a příkazem pkit new capability; tři doplňky project-kitu vznikly právě tak, v jeho vlastním
    repozitáři (COR-031). Vydání, které dnes nainstalujete, 1.149, má 4 doplňky: project-management,
    software-engineering, evidence a demo-recording. living-docs, software-analysis a doc-examples jsou ve větvi main
    a vyjdou ve verzi 2.0.
- id: pm
  part: P4
  title: Co přidává project-management
  message: Jednoho agenta, který práci zapíše, naplánuje a souběžně spustí vývojářské agenty. Vy schválíte plán
    i každý merge.
  problem: ''
  does: []
  show: 'V project-kitu 29. října: 22 mergnutých pull requestů, až 7 otevřených najednou, každý s verdikty svých
    reviewerů.'
  visual:
    kind: fanout
    left:
    - {role: people, head: Vy, text: 'Řeknete, co chcete. Plán schválíte jednou.'}
    - {role: addon, head: project-manager, text: 'Založí issues, naplánuje Tasky a na každý spustí vývojářského agenta.'}
    middle:
    - {icon: agents, head: 'Vývojář: Task A'}
    - {icon: agents, head: 'Vývojář: Task B'}
    - {icon: agents, head: 'Vývojář: Task C'}
    right:
    - {role: addon, head: Revieweři, text: Každý ověří změnu. Schválit musí všichni.}
    - {role: people, head: Vy, text: Řeknete ano. Pak agent mergne.}
    caption: 'Proč oba konce držíte vy: jen vy můžete tým zavázat k plánu nebo k merge. Práci mezi tím odvede agent.'
    cards:
    - {tone: addon, head: Jeho skill a agenti, text: 'Skill pm, agent project-manager a pm-reviewer pro každý pull request.'}
    - {tone: addon, head: 88 příkazů, text: 'pkit pm … zakládá, posouvá a merguje. Každý krok nejdřív ověří.'}
    - {tone: addon, head: Workflow pro issues, text: Každý přechod kontroluje engine pkitu.}
    - {tone: yours, head: Co uděláte, text: 'Dejte mu GitHub repozitář a jednou spusťte pkit pm bootstrap.'}
  limit: 'Jen pro GitHub a velký: 63 záznamů o rozhodnutí a 88 příkazů. Poznáte ho přes agenta, ne z manuálu.'
  minutes: 1.5
  notes: >-
    project-management je sada pravidel pro řízení práce na GitHubu: issues, pull requesty a merge. Jeho pravidla
    pro práci jsou data a jeho příkazy je provádějí, takže agent se jimi řídí, místo aby si je pamatoval (DEC-020,
    DEC-057). Mluvíte s jedním agentem, project managerem. Z toho, co chcete, udělá plán rozdělený na Features a Tasky
    a vy ho jednou schválíte. Na každý Task spustí vývojářského agenta, několik najednou, každého na vlastní větvi.
    Vývojářský agent je agent, který postaví jeden Task. Tasky, které mění stejné soubory, na sebe počkají. Každý pull
    request zkontrolují revieweři a schválit ho musí všichni. Pak řeknete ano a agent mergne: pkit pm land-work bez
    vašeho ano nic nemergne. Práci mezi tím dělá agent, oba konce držíte vy: k plánu, k harmonogramu nebo k merge může
    tým zavázat jen člověk (DEC-057). Jeho workflow pro issues, které jste už viděli, běží na enginu procesů pkitu.
    Jeho pravidlo oprávnění zakazuje agentovi project-manager měnit cokoli přímo přes gh, takže jde přes tyto příkazy.
    Má 63 vlastních záznamů o rozhodnutí, uložených v jeho složce a citovaných jako project-management:DEC-032. Co
    uděláte vy: dáte mu GitHub repozitář a jednou spustíte pkit pm bootstrap, který založí jeho labely; do té doby
    jeho úvodní kontrola selhává a jeho příkazy odmítají. Umí také spouštět agenty v několika klonech jednoho
    repozitáře, přes seats a pools; v project-kitu to běží a ještě se to dotváří. Dál: každý vývojářský agent začne
    načisto, ve vlastním klonu v sandboxu (DEC-063, ve vývoji). Přečteno z project-kitu: z 22 pull requestů
    mergnutých 29. října bylo současně otevřených až 7 a každý nesl verdikty svých reviewerů.
- id: se
  part: P4
  title: Co přidává software-engineering
  message: Vývojářského agenta, který se řídí vašimi konvencemi, a tři reviewery jeho kódu u každého merge, který
    mění kód.
  problem: ''
  does: []
  show: 'V project-kitu 29. října: 21 z 22 mergů měnilo kód a každý z nich prošel reviewery kódu, bezpečnosti
    a dokumentace.'
  visual:
    kind: wired
    font_size: 22
    card_h: 330
    signs: ['+', '→']
    panels:
    - head: Jeho agenti po instalaci
      terminal:
      - [['$ ', prompt], [pkit, command], [' capabilities install software-engineering', args]]
      - [['  created  .claude/agents/', output], [software-engineer, addon], ['.md', output]]
      - [['  created  .claude/agents/', output], [code-reviewer, addon], ['.md', output]]
      - [['  created  .claude/agents/', output], [security-reviewer, addon], ['.md', output]]
      - [['  created  .claude/agents/', output], [docs-reviewer, addon], ['.md', output]]
      - [['# software-engineer: vyvíjí podle vašich konvencí', comment]]
      - [['# code-reviewer: je kód správně?', comment]]
      - [['# security-reviewer: tajné údaje, injekce', comment]]
      - [['# docs-reviewer: platí ještě dokumentace?', comment]]
    - head: Jeho seznam pro merge
      terminal:
      - [['# review-contributions.yaml', comment]]
      - [['- floor: ', output], [touches-code, args]]
      - [['  reviewer: ', output], [code-reviewer, addon]]
      - [['- floor: ', output], [touches-code, args]]
      - [['  reviewer: ', output], [security-reviewer, addon]]
      - [['- floor: ', output], [touches-code, args]]
      - [['  reviewer: ', output], [docs-reviewer, addon]]
      - [['- match: ', output], ['{type: "*"}', args]]
      - [['  reviewer: ', output], [docs-reviewer, addon]]
    - head: 'Merge pull requestu #2279'
      terminal:
      - [['# první kolo', comment]]
      - [['pm-reviewer        ', output], [APPROVED, add]]
      - [['docs-reviewer      ', output], [APPROVED, add]]
      - [['code-reviewer      ', output], [CHANGES_REQUESTED, del]]
      - [['  [block] The new Status writer', del]]
      - [['  can''t find an org-owned board …', del]]
      - [['security-reviewer  ', output], [APPROVED, add]]
      - [['rule-set-reviewer  ', output], [APPROVED, add]]
      - [['# opraveno, schválilo všech pět, mergnuto', comment]]
    ties:
    - {head: Vaše konvence, text: 'Napíšete je jednou. Vývojářský agent je čte jako první. Zůstanou vaše i bez doplňku.'}
    - {head: Kód projde review, text: 'Dřív pkit kód nekontroloval. Do merge tak prošla změna se dvěma bezpečnostními dírami.'}
    - {head: Blokace má váhu, text: 'Každý reviewer blokuje jen kvůli chybě, kterou umí ukázat. Zbytek je rada.'}
    - {head: Co uděláte, tone: yours, text: 'Sepište své konvence a jejich soubor uveďte v overlay.yaml.'}
  limit: Bez sepsaných konvencí se vývojářský agent i jeho revieweři řídí obecnou dobrou praxí.
  minutes: 1.5
  notes: >-
    software-engineering má dva cíle: kód, který píšou agenti, se v každé session řídí vašimi konvencemi, a kód
    projde review, než se mergne (DEC-003). Jeho vývojářský agent, software-engineer, nemá žádné vlastní názory na
    kód. Nejdřív si přečte vaše konvence ze souboru, který uvedete v overlay.yaml, a řídí se jimi; když žádné sepsané
    nejsou, řekne to a pracuje podle obecné dobré praxe (DEC-001). Vaše konvence zůstávají vaše: odebrání doplňku je
    nikdy neodstraní. Jeho tři revieweři kontrolují správnost, bezpečnost a dokumentaci, i s odpověďmi, které k ní
    změna napsala. Každý blokuje jen kvůli chybě, kterou umí ve změně ukázat. Všechno ostatní je rada, takže blokace
    nikdy není jen otázka vkusu a nikdo se ji nenaučí přeskakovat (DEC-002). Revieweři vznikli ze skutečného selhání:
    v jednom projektu, který pkit používá, prošel do merge pull request s tokenem na příkazové řádce a se shell
    injection, protože kód nic nekontrolovalo (#715). Jak se zapojí do merge: doplněk dodává jeden soubor,
    review-contributions.yaml. project-management ten soubor čte z každého nainstalovaného doplňku a vyžaduje každého
    reviewera, kterého jmenuje (project-management DEC-032). software-engineering přitom nikde nejmenuje. Přepínačem
    je samotná instalace doplňku: žádné nastavení, kterým by se revieweři zapínali, neexistuje. Reviewer kódu
    a reviewer bezpečnosti běží, jen když změna sahá na kód; 29. října neměl review kódu jediný merge, který měnil
    jen záznamy. software-engineering naopak project-management jmenuje jako doplněk, který potřebuje, takže se
    instaluje až po něm. Pull request #2279: reviewer kódu zablokoval nový kód pro zápis stavu, který nenašel tabuli
    patřící organizaci. Chyba se opravila, všech pět reviewerů schválilo a merge proběhl 43 minut po blokaci.
    project-kit pro svůj kód zatím žádné konvence nesepsal, takže jeho reviewer kódu uvedl, že posuzoval jako pečlivý
    generalista.
- id: connect
  part: P4
  title: Jak doplňky spolupracují
  message: Přes sloty s názvem role, nikdy doplňku. Doplněk, který něco potřebuje, otevře slot; vyplnit ho může
    kterýkoli jiný.
  problem: ''
  does: []
  show: 'V project-kitu: 3 role, každou hraje jeden doplněk, a 6 slotů, z toho 4 vyplněné.'
  visual:
    kind: sockets
    font_size: 22
    provider:
      name: project-management
      role: pkit::work-tracking
      slots:
      - {id: doc-check, text: 'dokumenty, které změna musí upravit'}
      - {id: fixers, text: který agent opraví který dokument}
      - {id: use-cases, text: případy užití pro plánování}
    contributors:
    - {name: living-docs, role: 'pkit::documentation', text: dokumenty na míru čtenáři, to: [doc-check, fixers]}
    - {name: software-analysis, role: 'pkit::analysis', text: co musí software umět, to: [fixers, use-cases]}
    terminal_head: Co ukáže pkit status v project-kitu
    terminal:
    - [['$ ', prompt], [pkit, command], [' status', args]]
    - [['  Connections', output]]
    - [['    roles   3 named: 3 active, 0 in conflict', output]]
    - [['      pkit::analysis      → ', pkit], [software-analysis, addon]]
    - [['      pkit::documentation → ', pkit], [living-docs, addon]]
    - [['      pkit::work-tracking → ', pkit], [project-management, addon]]
    - [['    points  6 defined: 2 unfilled', output]]
    - [['    pkit::work-tracking:fixers', pkit]]
    - [['      data v1 · project-management — filled', output]]
    - [['      bound  ', output], [software-analysis, addon], [' (contributes)', output]]
    - [['      bound  ', output], [living-docs, addon], [' (contributes)', output]]
    why:
      head: Proč pkit propojuje doplňky takhle
      items:
      - Doplněk vyměníte za jiný ve stejné roli. Zbytek zůstane, jak je.
      - Instalujete jen to, co potřebujete. Prázdný slot nevadí.
      - pkit status zapojení ukáže a pkit validate ho zkontroluje.
  limit: Každou roli zatím hraje jen jeden doplněk, takže výměna je navržená, ale ještě nevyzkoušená.
  minutes: 1
  notes: >-
    Když jeden doplněk potřebuje něco od jiného, nikdy ho nejmenuje. Otevře slot, kterému pkit říká connection point,
    místo připojení, a to pod rolí, například pkit::work-tracking. Doplněk, který roli hraje, definuje její sloty
    a vyplnit je může kterýkoli nainstalovaný doplněk (COR-053). project-management hraje roli work-tracking. Jeden
    z jeho slotů se ptá, který agent opraví který druh dokumentu: living-docs tam uvede agenta pro své stránky,
    software-analysis pro případy užití, požadavky a zbytek analýzy. project-management z tohoto slotu čte, kterého
    agenta spustit pro každý zastaralý dokument, a o žádném z obou doplňků neví. Slot je volitelný, pokud sám
    neřekne, i s důvodem, že vyplněný být musí, takže doplněk funguje i sám. V čerstvé instalaci jen
    s project-management zůstane slot fixers prázdný, pkit validate projde a pkit status jmenuje living-docs
    a software-analysis jako doplňky, které by ho mohly vyplnit. Dva doplňky, které si nárokují stejnou roli, jsou
    chyba, dokud jeden nevyberete příkazem pkit connections providers. Proč role: kdyby slot jmenoval doplněk, právě
    to by vám bránilo ho vyměnit. Soubor reviewerů ze software-engineering je starší slot přímo v project-management,
    z doby před rolemi; drží stejné pravidlo, protože strana, která reviewery potřebuje, nikdy nejmenuje, kdo je
    dodá. Dál: project-management dostane slot pro vývojářského agenta a software-engineering ho vyplní svým
    software-engineer (DEC-063, ve vývoji). Samotní opravující agenti, fixers, na Claude Code zatím neběží bez
    dozoru: jejich spouštěč nejdřív čeká na prověření toho nástroje.
