- id: ideas
  part: P1
  title: Kde vznikají nápady
  message: V rozhovoru. Dohodu uchová i po konci session poznámka ve scratchpadu. Pak z ní vzniknou záznamy, issues či dokumenty.
  problem: ''
  does: []
  show: 'V project-kitu: z 28 hotových poznámek vzniklo 41 záznamů, 31 issues a 15 dokumentů'
  visual:
    kind: ideas
    font_size: 26
    conversation:
      icon: row-chat
      head: Rozhovor
      text: Spolu s agentem dáváte nápadu tvar, dokud session neskončí nebo nedojde kontext.
      text_h: 150
    note:
      icon: row-doc
      head: Poznámka ve scratchpadu
      text: Uchová, na čem jste se dohodli. Čeká bez termínu a další session si ji přečte.
      terminal: ".pkit/scratchpad/active/\n  2026-06-01-cli-design-conventions.md\n# jak navrhovat příkazy pkitu?\n# otevřená\
        \ od června, bez termínu"
    becomes_head: Když je hotová, vzniknou z ní
    becomes:
    - head: Rozhodnutí
      text: COR-041 a ADR-040, z poznámky ze 3. července
    - head: Issues
      text: '14 issues: rozplánovaná velká feature'
    - head: Dokumenty
      text: 10 případů užití a 2 cesty, z jedné poznámky
    dropped:
      text: Nebo zahozená, i s důvodem, proč byla zahozena.
  limit: Poznámka se sama nenapíše. Co zůstane jen v rozhovoru, zmizí spolu s ním.
  minutes: 1
  notes: 'Na limit kontextu tady už narazil každý. Poznámka ve scratchpadu je místo, kde vaše dohoda ten limit přežije: další
    session si poznámku přečte. Poznámka může počkat. Ta ukázaná, o tom, jak navrhovat příkazy pkitu, je otevřená od června,
    stejně jako 13 dalších z 33 aktivních, a to je v pořádku. Stav poznámky určuje složka, ve které leží (COR-012). pkit new
    scratchpad <slug> založí poznámku v .pkit/scratchpad/active/. pkit scratchpad done <slug> --produced <ref> ji přesune
    do done/ a zapíše, co z ní vzniklo. pkit scratchpad drop ji přesune do dropped/. Poznámka je soubor v repozitáři, ne chat
    ani paměť nástroje. Kolegové i všichni agenti tak čtou tutéž poznámku, a hotová poznámka zůstane jako příběh toho, jak
    se k rozhodnutí došlo. Z 28 hotových poznámek vzniklo také jedno schéma, jeden pull request a jeden milník. COR-041 a
    ADR-040 ještě uvidíte u příručky k vydávání.'
- id: decisions
  part: P1
  title: Záznamy o rozhodnutí
  message: Záznam o rozhodnutí uchová jednu volbu i její důvod. Podle toho, kde leží, poznáte, čeho se týká a kdo ho smí měnit.
  problem: ''
  does: []
  show: 'Tento týden: nový záznam COR-065 nahradil větu z COR-006, aniž by kdokoli sáhl do toho starého'
  visual:
    kind: kinds
    groups:
    - head: Jak se pracuje
      path: .pkit/decisions/
      kinds:
      - tag: COR
        tone: pkit
        head: Principy pkitu
        text: Jak metodika funguje, stejně v každém projektu.
        path: core/COR-065-records-and-projection.md
        why: Leží odděleně od vašich. Každý upgrade je nahradí, proto je nikdy neupravujete.
      - tag: PRJ
        tone: yours
        head: Váš způsob práce
        text: Jak pracuje váš tým tam, kde pkit volbu nechává na vás.
        path: project/PRJ-002-version-bump-policy.md
        why: Patří jen vám. Upgrade sem nikdy nic nezapíše.
    - head: Co stavíte, ve složce, kterou si zvolíte
      path: docs/architecture/decisions/
      kinds:
      - tag: ADR
        tone: architecture
        head: Vaše architektura
        text: 'Jak je postavený váš systém: struktura, technologie a hranice.'
        path: ADR-001-project-root-resolution.md
        why: Leží u dokumentace vašeho systému, kde se o ně stará architekt.
  limit: Napsat a zrevidovat záznam zabere čas. Vyplatí se jen u rozhodnutí, na kterých stojí další práce.
  minutes: 1.5
  notes: 'Tři místa vycházejí ze dvou otázek. Čeho se záznam týká: jak se pracuje, nebo co stavíte? A kdo ho smí měnit: pkit,
    nebo vy? O vaší architektuře pkit nikdy nerozhoduje, proto čtvrté místo neexistuje. Principy pkitu se mění novým záznamem,
    který si můžete přečíst, nikdy tichou úpravou. V červnu jich bylo 39, teď jich je 67, a tento týden COR-065 nahradil větu
    z COR-006. Samotný project-kit má 11 PRJ a 74 ADR. Add-ony přinášejí vlastní záznamy o rozhodnutí. Ukážeme je, až přijdou
    na řadu add-ony.'
- id: found
  part: P1
  title: Rozhodnete jednou, agent to pak najde
  message: Rozhodnutí schválíte, než na něm začne stavět práce. Později ho agent najde dřív, než změní soubory, kterých se
    týká.
  problem: ''
  does: []
  show: 'Tento týden: ADR-075 určil, jak vznikají pravidla, která načítá každá session. Schválený se mergnul spolu se svým
    kódem.'
  visual:
    kind: story
    stages:
    - role: agents
      head: Agent napíše návrh
      text: Připraví záznam a naváže na něj příručku k vydávání.
      terminal: "$ cat .pkit/decisions/project/PRJ-002-….md\nid: PRJ-002\ntitle: Version-bump policy\nstatus: proposed   \
        \ # dokud ho neschválíte\n## Context          # proč se to řeší\n## Decision         # co se rozhodlo\n## Rationale\
        \        # proč, co se zamítlo\n## Implications     # co z toho plyne\n\n# .pkit/release/README.md, jeho front matter:\n\
        \  friction:\n    anchors:\n+     record: [PRJ-002]"
    - role: people
      head: Vy ho schválíte
      text: Uvidíte ho ještě před mergem, dokud je změna nejlevnější.
      terminal: "# pull request, před mergem:\n  .pkit/decisions/project/PRJ-002-….md\n- status: proposed\n+ status: accepted\n\
        \n  .pkit/release/README.md\n    anchors:\n+     record: [PRJ-002]"
    - role: agents
      head: Pozdější session ho najde
      text: Vaše důvody nezná, a tak si nejdřív vyhledá záznamy.
      terminal: "$ pkit refs records-for .pkit/release/README.md\n6 records tied directly:\n  PRJ-002  Version-bump policy\
        \ …\n  PRJ-004  Distribution via direct git URL …\n  ADR-040  Fetch externally-sourced content …\n  COR-010  Lifecycle\
        \ of installed resources\n  …\n# agent je přečte, než soubor změní"
    font_size: 24
  limit: Najde se jen záznam navázaný na soubor, nebo na dokument, který na tom souboru závisí.
  minutes: 1
  notes: Jeden záznam, PRJ-002, a jeho život. Agent ho napíše jako navržený (proposed), vy ho v pull requestu jedním řádkem
    schválíte a pozdější session ho najde za příručkou k vydávání, vedle záznamů dalších dvou druhů. Schválení je na vás.
    Kontrola může odmítnout merge záznamu, který je pořád jen navržený, a kdo merge povoluje, vidí každý záznam, který se
    tím mergem schvaluje. Agent naváže příručku na záznam hned při psaní, protože příručka ten záznam provádí. Když se pak
    PRJ-002 změní, musí ta změna odpovědět, jestli příručka stále platí. Jak to funguje, ukáže slajd o dokumentaci. Vyhledávání
    čte tutéž vazbu opačným směrem. V project-kitu vznikla tahle vazba ve chvíli, kdy se z příručky stal takový dokument.
    Než agent změní soubor, spustí tohle vyhledávání. Je to jedno z pracovních pravidel, která dostane každá session. Volba
    z chatu je v další session pryč. Záznam se najde.
