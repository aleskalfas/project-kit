    icons: true
    pairs:
    - left:
        role: neutral
        icon: row-chat
        head: Rozhodnutí zůstávají v chatech a v hlavách lidí
        text: takže o nich agent neví a rozhoduje znovu
      right:
        role: code
        icon: row-write
        head: Zapište každé rozhodnutí s důvodem
        text: vy ho schválíte a každá session si ho přečte · Část 2
    - left:
        role: neutral
        icon: row-question
        head: Konvence nejsou sepsané
        text: takže se agent řídí vlastními zvyky
      right:
