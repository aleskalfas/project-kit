    pojistky, které žádné udělené oprávnění neobejde. Pravidla pro jednoho agenta potřebují hook. pkit permissions
    setup autonomy zapne profil, zaregistruje hook, nastaví sandbox OS (kromě macOS) a spouští sondy, dokud výsledek
