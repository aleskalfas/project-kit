- id: fits
  part: P0
  title: Jak je pkit poskládaný
  message: 'Z pěti vrstev, od vašich rozhodnutí až po váš kód: každá provádí to, co určí vrstvy nad ní.'
  problem: ''
  does: []
  show: 'Tento týden: pkit toto pořadí zapsal jako vlastní rozhodnutí, COR-065'
  visual:
    kind: pyramid
    center: 1280
    top_w: 720
    step: 280
    levels:
