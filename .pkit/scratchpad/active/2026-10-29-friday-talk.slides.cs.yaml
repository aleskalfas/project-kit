    instalace 30. října: pkit nepřidává žádný git hook ani CI a kontrola změn spí, dokud projekt neřekne, kde má dokumenty.
    Každá session ale dostane pravidlo, aby agenti před commitem spustili kontrolu změn a odpověděli na ni (pravidlo jádra
    č. 20).'
