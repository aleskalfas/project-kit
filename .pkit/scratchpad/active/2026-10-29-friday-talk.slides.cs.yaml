      limit: nikdy nemění, co kontrolují
  limit: Každé kolo review stojí několik běhů agentů.
  minutes: 1.5
  notes: >-
    Práce jde zleva doprava. Agent, se kterým mluvíte, napíše návrh s nástroji, které povolí vaše oprávnění. Critic
    mu oponuje dřív, než ho uvidíte. Architect ho zkontroluje, když zasahuje celý systém. Vy rozhodnete. Tři
    revieweři zkontrolují změnu. methodology-reviewer kontroluje, jak jsou napsané záznamy a skilly.
    convention-compliance-reviewer kontroluje commity, větve a kdo vlastní který soubor. rule-set-reviewer kontroluje
    pravidla pro soubory, kterých se změna dotýká. Jen vy schvalujete rozhodnutí nebo pouštíte změnu do merge (COR-064
    bod 6).
