    - head: Pravidlo 22, které dostane každá session
      text: Než změníte soubory, přečtěte si jejich záznamy.
      fill: '#6929C4FF'
      ink: '@text_on_color'
    - head: Co agent udělá
      text: Než změní soubor, spustí pkit refs records-for a přečte, co vypíše.
      fill: '#BE95FFFF'
      ink: '@text_primary'
    font_size: 28
    terminal:
    - - - '# načte se na začátku každé session'
        - comment
    - - - .pkit/rules/core.md
        - pkit
      - - '      # od pkitu, v každém projektu'
        - comment
    - - - .pkit/rules/project.md
        - yours
      - - '   # váš, pkit ho nikdy nemění'
        - comment
    - []
    - - - '# vyhledá se podle potřeby'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' refs records-for <files>'
        - args
      - - '  # záznamy k tomu,'
        - comment
    - - - '                                 # co se mění'
        - comment
    - - - '$ '
        - prompt
      - - pkit
        - command
      - - ' rule-sets reach <paths>'
        - args
      - - '   # pravidla k tomu,'
        - comment
    - - - '                                 # co agent píše'
        - comment
  limit: 'Pravidlo je jen rada: agent ho může porušit.'
  minutes: 1.5
  notes: 'Záznamů je hodně a čtou se, až když se něco mění. Do každé session se místo nich načte pár pravidel, jak jednat,
    a každé z nich odkazuje na rozhodnutí, které provádí. Kvůli pravidlu 22 agent před změnou souboru vyhledá jeho záznamy.
    To pravidlo provádí bod 7 COR-065, tedy záznamu, na kterém stojí pyramida. Každé pravidlo má trvalé id, stav a původ:
    buď záznam, který provádí, nebo datovaná slova toho, kdo o něm rozhodl. Když se záznam změní, vyzve svá pravidla, aby
    se znovu ověřila (COR-068, ADR-075, v mainu od 29. října). Váš project.md patří vám a sync na něj nikdy nesáhne. Pravidla,
    která se týkají jen určitých souborů, třeba kódu v Pythonu, se nenačítají. Jsou to sady pravidel omezené na ty soubory.
    Agent je vyhledá příkazem pkit rule-sets reach a při merge je zkontroluje reviewer (#2273 a #2274, v review). V review
    je také limit velikosti, který hlídá pkit validate (#2262), a pravidlo o tom, kdy začít psát záznam o rozhodnutí (#2258).
    Dál přijde tohle: každý nainstalovaný add-on přinese vlastní pravidla, která se načítají, dokud je nainstalovaný (#2269,
    ukážeme u add-onů), a pravidla se zkrátí na jednu až dvě věty (#2261). Dnes: 22 pravidel, asi 2 800 slov, v každé session.'
