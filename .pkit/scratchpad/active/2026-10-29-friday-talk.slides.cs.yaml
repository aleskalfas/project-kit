      - [['  # bez odpovědi', comment]]
      - [['$ ', prompt], [pkit, command], [' decisions check-diff', args]]
      - [['  # záznam nebo bod s číslem', comment]]
      - [['  # dvakrát, nebo přečíslovaný', comment]]
    ties:
    - head: Lidé zapomínají
      text: Změna upraví jeden soubor. Co na něm závisí, je jinde.
    - head: Review to nevidí
      text: Review čte změnu, kterou má před sebou, ne soubor, který zastaral.
    - head: Agenti věří souborům
      text: Agent jedná podle souboru. Kontrola najde, co agent nikdy nezpochybní.
    note:
      icon: step-question-important
      head: Při každém push?
      command: $ pkit validate && pkit friction check
      body: pkit nepřidá git hook ani CI. Zapojte oba příkazy do svých, jako project-kit.
  limit: 'Kontrola najde, co je rozbité nebo bez odpovědi. Zda dokument stále platí, posoudí reviewer.'
  minutes: 1
  notes: >-
    Dva druhy kontrol. pkit validate kontroluje projekt tak, jak právě je: každá část pkitu registruje vlastní kontrolu
    a každý nainstalovaný doplněk přidá své, 12 v čerstvé instalaci a 16 v project-kitu. Mezi nimi: každý datový
    soubor proti svému schématu, tvar každého záznamu, každý skill a agent jmenuje to, na co odkazuje. Kontroly změn
    posuzují diff proti jeho základu. Kontrola friction chce od každého dokumentu navázaného na změněný soubor
    odpověď: upraveno, stále platí (a proč), nebo odloženo (COR-050). Kontrola rozhodnutí odmítne
    záznam nebo bod, který použije číslo dvakrát nebo nějaké ztratí (COR-058). Důvody jsou z COR-050: lidé zapomínají
    aktualizovat to, co závisí na tom, co změnili, a review se dívá na změnu před sebou, zatímco zastaralý popis je
    obvykle jinde. Přečteno z čerstvé instalace 30. října: pkit nepřidává žádný git hook ani CI a kontrola změn spí,
    dokud projekt neřekne, kde má své dokumenty. Každá session dostane pravidlo, podle kterého agenti před commitem
    spustí kontrolu změn a odpoví na ni (pravidlo jádra č. 20).
