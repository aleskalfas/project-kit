      limit: nikdy nemění, co kontrolují
  limit: Každé kolo review stojí několik běhů agentů.
  minutes: 1.5
  notes: Práce jde zleva doprava. Agent, se kterým mluvíte, napíše návrh. Používá přitom nástroje, které mu povolí vaše oprávnění.
    Critic návrhu oponuje dřív, než ho uvidíte. Když se návrh týká celého systému, zkontroluje ho architect. Pak rozhodnete
    vy. Změnu nakonec zkontrolují tři revieweři. methodology-reviewer hlídá, jak jsou napsané záznamy a skilly. convention-compliance-reviewer
    hlídá commity, větve a to, kdo vlastní který soubor. rule-set-reviewer hlídá pravidla, která platí pro soubory, na které
    změna sahá. Jen vy schválíte rozhodnutí a jen vy dovolíte změnu mergnout (COR-064 bod 6).
