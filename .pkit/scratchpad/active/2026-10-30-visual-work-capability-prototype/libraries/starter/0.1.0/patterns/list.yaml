schema_version: 1
name: list
kind: pattern
status: experimental
about: What the items are, each of equal standing, in one row of equal widths and heights, under an optional heading.
fields:
  type: object
  required: [items]
  properties:
    head: {type: string, x-pkit-prose: true}
    items: {type: array, minItems: 1, items: {type: object}}
draws: {item: starter/card}
parts:
  head: {when: head, text: "{head}", style: key, width: =width}
  items: {repeat: items, draw: item, y: "=head.bottom + min(head.height, @space.03)", width: =width, row: {gap: =@space.07, equal: height}}
preferred: {height: =items.bottom}
