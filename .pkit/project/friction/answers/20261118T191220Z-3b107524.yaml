      outcome: unchanged
      unchanged-because: The page cites core.md for its include, rule 13 on headings, the permission-layer rule and the workspace rule; core.md changes only the acceptance gate (RS-OPS-002), RS-OPS-020 and RS-OPS-023, and COR-070 points 3 and 4 only add that a rule the delegate accepted is seen and judged before its merge by the person who authorises it, so the includes and the rules it names stand.
      deferred:
        - anchor:
            kind: record
            value: ADR-002
          reason: "ADR-002 now has sessions run a copy of the hook made from the installed release, bounds what it allows by the model last realized, has it ask where it cannot judge by that model and keep its own verdicts through a decision fault, and adds native locks beside the guardrail denies, and the README registers the hook from the project's tree and gives sync its lifecycle and a decision fault a silent abstain; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-005
          reason: "ADR-005 now serves the realizing that profile activate runs from the installed release, and under a session anchor or the harness's mark has it write the activation and realize nothing that widens, and says a call asking to leave the sandbox meets a prompt under the seal, which the README's account of realizing does not yet say; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-014
          reason: "ADR-014 now has the hook run outside the sandbox, from the copy, under an interpreter the copy names by its fixed path, since a hook started through uv would read configuration a sandboxed command can write, and has uv run confined on Linux with a cache for each checkout, and the README has the hook start under the system python3 inside the sandbox; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-025
          reason: "ADR-025 now has the decision core ask before the commands ADR-095 point 3 interlocks and deny a shell call that names a folder, read by the same reading as its denies, and corrects that the hook runs outside the sandbox, and the README gives the hook's ask on a hidden guardrail as its only ask on a shell call; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-066
          reason: "ADR-066 now has the hook inside an unconfined run judge by the snapshot of the nearest realized folder that holds the run's folder, and a clone outside every realized folder get the hook's own verdicts, which the README's account of the hook in a run does not yet say; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-073
          reason: "ADR-073 now has a working run's runner read the asks of the default branch's settings beside its allows and denies, so a working run gets every native lock ADR-095 point 4 lists, and names a working run's hook and model, read from history, as what is left, and the README's settings carry no such locks; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
