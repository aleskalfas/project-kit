      - 20261117T113804Z-95a59178.yaml
    revalidated:
      at: 2026-11-19T00:01:18Z
      outcome: unchanged
      unchanged-because: A won't-do close still ends an issue in Todo or Backlog whose work is dropped, on a person's authorisation with a reason. The change refuses only the cascade-eligibility close of a container not at In Progress, and names the won't-do close as the way to end such a container's dropped work (#3248).
