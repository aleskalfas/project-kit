      unchanged-because: The completed close of a Task is as it was. The change to close-issue adds a check of where a container stands to the cascade-eligibility close alone, which no Task takes (#3248).
  - artefact: tech-docs/analysis/project-management/glossary.md#TERM-wont-do-close
