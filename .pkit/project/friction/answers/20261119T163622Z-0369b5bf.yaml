        - anchor:
            kind: record
            value: ADR-039
          reason: "ADR-039 now serves the permission commands that report the hook's verdict or its model, realize, make the hook's copy, turn the hook on or off or name a folder from the installed release wherever the machine holds one, whatever the checkout or its pin say, and the reference has the installed binary route every invocation by the checkout and the pin; #3412 builds it and rewrites the reference."
        - anchor:
            kind: record
            value: ADR-040
          reason: "Its account of install from another repository holds main's refusal, which the refined ADR-040's Implications have: install with --from or --ref refuses, writing nothing, until #3349, and the reference says so before the bullets on what install does once offered. Those bullets describe the commands as main built them: install records the commit the ref named, sync keeps the copy and warns where the fetch fails or the tag names another commit than the pin records, its kept state names content whose requires_backbone excludes the recorded backbone, a branch as the ref and a transition that moves a pin are named as not built, and an uninstall and an install take another tag or commit. The refined points 1 and 3 have every later fetch take the pin's commit, by its id where the ref names another or is gone, and report the move, sync read no pin that records no commit, and sync keep a copy whose content declares another backbone range than the manifest records beside the pin, or whose manifest records no version there, which the open #3349 builds and brings the reference in line with. Its point 4 also has pkit upgrade refuse a copy out of line where the page says it leaves it, which the open #3229 builds and brings the reference in line with. Main's other answers made apart, on a capability's or an adapter's contract and its marks, on the pointer of pkit visual look to its capability's README, and on the passages of ADR-097 that now cite DEC-074, touch none of this."
        - anchor:
            kind: record
            value: ADR-049
          reason: "ADR-049 now leaves the permission commands the installed release serves (ADR-095 point 2) outside point 4's routing of every command alike, and the reference has the installed binary route every invocation by the checkout and the pin; #3412 builds it and rewrites the reference."
        - anchor:
            kind: record
            value: ADR-059
          reason: "ADR-059 now has route 1 run the source repository's own code for every command but the permission commands the installed release serves where the machine holds one, and the reference has a source checkout run its working tree for every command; #3412 builds it and rewrites the reference."
        - anchor:
            kind: record
            value: ADR-063
          reason: "ADR-063 now has the upgrade install nothing under a session anchor or the harness's mark of a process its tools start, and says an install moves, in every project, the permission commands the installed release serves and the hook's copy, and the reference's upgrade installs wherever a terminal runs it under the installed tool; #3412 builds it and rewrites the reference."
        - anchor:
            kind: record
            value: ADR-064
          reason: "ADR-064 now has a pinned project keep its version for every command but the permission commands the installed release serves, and its hook run the copy made from that release, and the reference has a pinned project run its pin for every command; #3412 builds it and rewrites the reference."
