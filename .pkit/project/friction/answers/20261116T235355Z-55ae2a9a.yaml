    revalidated:
      at: 2026-11-16T23:53:55Z
      outcome: unchanged
      unchanged-because: "Under the refined ADR-065 point 1 sync brings an externally-sourced copy to the commit its pin records, and no command on that point's list moves a pin, the point citing ADR-040 point 8 for who moves one; that record's line on the code only points to ADR-040's list of where the code differs, and leaves point 1 as it was. The page says as much: what sync writes includes each such copy at its pin, and its section on matching the pin has the pin never move, a transition that moves one not built, and pkit upgrade leave the capability as it is. How that section treats a moved or deleted ref, a pin that records no commit and the content's backbone range is left to the ADR-040 deferral, which #3349 answers."
      deferred:
        - anchor:
            kind: record
            value: ADR-040
          reason: "Its section on matching the pin describes sync as main built it: sync keeps the copy and warns where the source holds no such ref or the tag names another commit than the pin records, a pin that records no commit follows its tag, sync's check of the content's backbone range is only that it admits the recorded backbone, and only an uninstall and an install take the tag's new content. The refined ADR-040 has every later fetch take the pin's commit, by its id where the ref names another or is gone, and report the move, sync read no pin that records no commit, and sync keep the copy where the content declares another backbone range than the manifest records beside the pin, or where the manifest records no version or range there (points 1 and 3), which #3349 builds and brings this section in line with. Its point 4 also has every transition refuse a copy out of line, which the open #3229 builds and brings the page in line with."
