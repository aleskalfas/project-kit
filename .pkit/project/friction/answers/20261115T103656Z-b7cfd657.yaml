      unchanged-because: "Its steps need from UC-060, UC-061 and UC-062 a Task filed, the Task in Review with its pull request open, and the merge. The use cases change their entry check, which judges whoever runs the command, a user's account wherever GitHub names one, and anchor the code of that check. UC-061's new variant 6k adds a refusal: under a user's account other than the developer's, start-work refuses a Task assigned to the developer, as variant 6a refuses one assigned to someone else. The journey names no account, and where the account that runs the commands takes the Task up, each hand-off it needs holds, so it holds."
