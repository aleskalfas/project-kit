      unchanged-because: "Judged on the changes together. 20261106T150052Z-c9ff2ad6 found that the page states nothing of a final piece or of a version handed out. 20261107T124642Z-7a8e773a found that DEC-021's edits leave true what the engine does today: a switch and a when read an option or a filled field, and a scene is computed at the size key default, since format 1 has no size axis. This change narrows a brand's axes to every value axis whole and each size it gives, and makes a new shared axis an addition to the release's comparison. The foundations still declare no size axis, so the size key, the switches and the sources stay as the page gives them. The page reads What a release compares only for what a component's status promises, which this change leaves as it was. So the three answers stand together."
