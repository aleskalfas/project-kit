    revalidated:
      at: 2026-10-28T17:37:12Z
      outcome: unchanged
      unchanged-because: The cascade is defined as the effect of an issue's move on the issues above it. The move back moves no other issue, and both the forward and the closure cascade are as they were, so the definition still holds.
