    revalidated:
      at: 2026-10-28T17:37:15Z
      outcome: unchanged
      unchanged-because: The definition names the five states in their order and says a person holds the start and the end. The move back adds a way from In Progress to Backlog or Todo, held by a person too, and changes neither the states nor who holds the start and the end.
