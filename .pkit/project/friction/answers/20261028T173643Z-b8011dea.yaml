      at: 2026-10-28T17:37:09Z
      outcome: unchanged
      unchanged-because: An authorisation is defined as a person's decision that one issue may make a move the issue lifecycle leaves to a person. The move back from In Progress is one more such move, held by the user at hard-reject, so the definition covers it as written.
