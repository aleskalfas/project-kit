            value: project-management:DEC-006
          reason: "DEC-062 overturns DEC-006's projection sentence in two cases. Where a project's map puts state on its board, the board's Status is the source of an open issue's position, and where a present map leaves state out, the agent keeps no projection on the board. So the entry's line that a board's Status column is a projection of the state, which the state the issue carries wins over, holds only by default. #2271 builds that read and rewords the distinction."
