      outcome: unchanged
      unchanged-because: "Its account of what sync writes has sync bring each externally-sourced copy to its pin, and its section on matching the pin says a transition that moves a pin is not built and pkit upgrade leaves the capability as it is. That is what the refined ADR-065 point 1 says: sync brings such a copy to the commit its pin records, and no command on its list moves a pin. What the section says of a moved tag and of a pin with no commit is the deferral's, on ADR-040."
      deferred:
        - anchor:
            kind: record
            value: ADR-040
          reason: "Its section on matching the pin describes sync as main built it: sync keeps the copy and warns where the tag names another commit than the pin records, a pin that records no commit follows its tag, and only an uninstall and an install take the tag's new content. The refined ADR-040 has every later fetch take the pin's commit by its id and report the move, and sync read no pin that records no commit (points 1 and 3), which #TBD builds and brings this section in line with. Its point 3 also has sync keep the copy where the content declares another backbone range than the manifest records beside the pin, or where the manifest records no version or range there, and point 4 has every transition refuse a copy out of line, which the open #3229 builds and brings the page in line with."
