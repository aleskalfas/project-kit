      outcome: unchanged
      unchanged-because: Judged against both earlier changes together and this one. In the CLI reference's Surface table, the account change (e43eb148) adds the `account` row and takes the default actor from the `process` rows, and the lock change (148daddf) has the `permissions enable` and `apply` rows also ensure the native locks. Together they leave the `capabilities show` and `capabilities install` rows this guide links to as they were. None of the guide's commands reads the account or takes an actor, and only `pkit upgrade` is locked, its ask put on a harness session's call, never on the reader's terminal, where the guide's fences run. A raise of a budget stays the reader's, and an install stays consent to a capability's rules, as COR-069 point 4 and COR-070 points 3 and 4 keep them under COR-072, which both answered. This change names `pkit` in the `uvx` runs of the `sync` section's remedies, as the guide's own `uvx … pkit init` line already does, and sync still stops and names its remedy as the guide says. It also has the `upgrade` section's rollout note say that a pin below the release that runs another release as `pkit` is raised by the installed pkit, not by its own `pkit pin <version>`; the guide upgrades a project that release 1.134.0's `init` set up with no pin, and raises no pin. So it holds as written.
