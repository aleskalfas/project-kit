        - anchor:
            kind: record
            value: ADR-002
          reason: "ADR-002 now has sessions run a copy of the hook made from the installed release, bounds what it allows by the model last realized and has it ask where it cannot judge by that model, and adds native asks before leaving the sandbox and before a move into another tree, and a native deny on a file tool's write into the folders ADR-095 guards, beside the locks on the interlocked commands; the README registers the hook from the project's tree, gives sync its lifecycle and lists only those locks; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-005
          reason: "ADR-005 now serves the realizing that profile activate runs from the installed release, and under a session anchor or the harness's mark has it write the activation and realize nothing that widens, which the README's account of realizing does not yet say, though it now gives the hook's ask before a call that asks to leave the sandbox; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-014
          reason: "ADR-014 now has the hook run outside the sandbox, from the copy, under an interpreter the copy names by its fixed path, since a hook started through uv would read configuration a sandboxed command can write, and has uv run confined on Linux with a cache for each checkout, and the README has the hook start under the system python3 inside the sandbox; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
