      unchanged-because: "Judged against this change and ADR-102, answered apart on main, together. This change has the CLI reference's `sync` section name `pkit` in the `uvx` runs its remedies give, and drops from ADR-095 point 3 the claim that ADR-049 gives the pinned route as `uvx project-kit`; no `uvx` run the README names takes the package as its command. ADR-102 lets a reviewer's runner register the copy's hook naming a copy of the seat's snapshot (ADR-095 points 2 and 3), which #3467 builds and extends the README for; the README describes the hook as built. The two edits to ADR-095 fall on separate bullets and neither moves what the other rests on, so the README holds as written, and its deferrals still wait on #3412, which rewrites it where it describes where the hook, the core and the model live."
