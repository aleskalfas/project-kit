      unchanged-because: "Judged against this change and ADR-102, answered apart on main, together. This change has the install script's failure line name `pkit` in the `uvx` run it prints, and drops from ADR-095 point 3 the claim that ADR-049 gives the pinned route as `uvx project-kit`; the README names `uvx project-kit` only among the forms the hook reads, which point 3 still reads. ADR-102 adds to ADR-095 points 2 and 3 that a reviewer's runner registers the copy's hook naming a copy of the seat's snapshot, and to ADR-066 and ADR-073 a reviewer's clone, none of it built until #3467, which adds a reviewer's clone's settings to the runner's unconfined form and updates the README. The README's runner passes no settings in that form and runs in the folder its caller names, as it still does. The two edits to ADR-095 fall on separate bullets and neither moves what the other rests on, so the README holds as written, and its deferrals still wait on #3412, which rewrites it where it describes the hook and the sandbox."
