      unchanged-because: "Judged against the three changes to versioning.py and what it reads together: aaa8e11 updated the page to read the migration window's lower bound in PEP 440 order, compare public versions and admit a candidate in every range; 7fc6a0b changed only `version tag`'s target, and a tagged install still names one content; this change adds `is_candidate_version` and cuts candidates `X.Y.ZrcN`. Such a version is the pre-release the page's window and comparisons already read, as its `0.55.0rc1` example shows, and the latest release's lookup still skips it, so the page holds. Its pinned upgrade's refusals of a candidate stay deferred to #2211."
      deferred:
        - anchor:
            kind: record
            value: ADR-049
          reason: "ADR-092 point 7 has neither pkit pin <version> nor pkit upgrade raise a project whose manifest records a release candidate to another release, which no code does yet. The page's pin raise gains the refusal with the build for #2211."
        - anchor:
            kind: record
            value: ADR-065
          reason: "ADR-092 has a pinned project's upgrade refuse first to move a project on a release candidate to another release, and a candidate's own upgrade refuse a window above its cut's base, none built. The page's pinned upgrade, which checks first for a newer release, gains them with the build for #2211."
