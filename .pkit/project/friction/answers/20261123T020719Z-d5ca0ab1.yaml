    revalidated:
      at: 2026-11-23T02:07:19Z
      outcome: updated
      deferred:
        - anchor:
            kind: record
            value: ADR-002
          reason: "ADR-002 now has sessions run a copy of the hook made from the installed release, bounds what it allows by the model last realized and has it ask where it cannot judge by that model, and adds native asks before leaving the sandbox and before a move into another tree, and a native deny on a file tool's write into the folders ADR-095 guards, beside the locks on the interlocked commands; the README registers the hook from the project's tree, gives sync its lifecycle and lists only those locks; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-005
          reason: "ADR-005 now serves the realizing that profile activate runs from the installed release, and under a session anchor or the harness's mark has it write the activation and realize nothing that widens, which the README's account of realizing does not yet say, though it now gives the hook's ask before a call that asks to leave the sandbox; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-014
          reason: "ADR-014 now has the hook run outside the sandbox, from the copy, under an interpreter the copy names by its fixed path, since a hook started through uv would read configuration a sandboxed command can write, and has uv run confined on Linux with a cache for each checkout, and the README has the hook start under the system python3 inside the sandbox; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-025
          reason: "ADR-025 now has the core ask where the bound that binds cannot be used and give a revoked grant's ask, and corrects that the hook runs outside the sandbox, from a copy of the installed release; the README gives the interlock's ask and the naming deny, but neither of those asks, and has the hook start inside macOS Seatbelt; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-066
          reason: "ADR-066 now has the hook inside an unconfined run judge by the snapshot of the nearest realized folder that holds the run's folder, and a clone outside every realized folder get the hook's own verdicts, which the README's account of the hook in a run does not yet say; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
        - anchor:
            kind: record
            value: ADR-073
          reason: "ADR-073 now has a working run's runner read the asks of the default branch's settings beside its allows and denies, so a working run gets every native lock ADR-095 point 4 lists, and names a working run's hook and model, read from history, as what is left; the README's baseline settings now carry the locks on the interlocked commands, but the run's settings take only the denies; #3412 builds it and rewrites the README where it describes the hook and the sandbox."
