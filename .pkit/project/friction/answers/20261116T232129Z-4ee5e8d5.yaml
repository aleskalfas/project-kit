            value: ADR-040
          reason: "Its account of install from another repository describes the commands as main built them: install records the commit the ref named, sync keeps the copy and warns where the fetch fails or the tag names another commit than the pin records, its kept state names content whose requires_backbone excludes the recorded backbone, a branch as the ref and a transition that moves a pin are named as not built, and an uninstall and an install take another tag or commit. The refined ADR-040's Implications have pkit capabilities install --from refuse until #3349 lands, which the open #3359 builds and brings the reference's 'From another repository' in line with. Its points 1 and 3 have every later fetch take the pin's commit, by its id where the ref names another or is gone, and report the move, sync read no pin that records no commit, and sync keep a copy whose content declares another backbone range than the manifest records beside the pin, or whose manifest records no version there, which #3349 builds and brings the reference in line with. Its point 4 also has pkit upgrade refuse a copy out of line where the page says it leaves it, which the open #3229 builds and brings the reference in line with. Main's answers made apart, an update that has a capability's or an adapter's contract and its marks stand in its README or a page it links to, and two re-checks that keep the pointer of pkit visual look to its capability's README, touch none of this."
