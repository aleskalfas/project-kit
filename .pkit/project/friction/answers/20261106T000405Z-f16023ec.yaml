      unchanged-because: Judged on the three revalidations made apart together. This change's earlier answer (aedda51f) found that UC-060, UC-083, UC-084, UC-089 and UC-092 change no need the steps state, and that ACT-worker-agent's reworded need is UC-087's, which variant 2a still tells. The answer to the audit comment (25d2581b) found that the comment comes only on a `--force`, which the pm skill's work loop keeps from the worker, and that it moves no head and is no edit. The answer to the reviewers' start (9823200c) found that the journey states no order of checks and review, and lands through UC-089, which defers to UC-062. They hold together. This change adds only anchors here, on COR-050, COR-051 and COR-066, which neither of the other two changes touched. UC-089 now also takes a Task from UC-088 and names the merge gate, which leaves step 2's need of the Task in Review with its pull request open, however early the review starts. The merge gate and the authorisation of a head stand as the two guarantees say them.
