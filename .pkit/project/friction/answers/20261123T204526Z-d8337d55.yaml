      outcome: unchanged
      unchanged-because: start-work still writes an ownership that names the seat, its number and the clone's key, and a seat's release still stops it counting. This change has a lead's seat file with --for-workers and claim nothing at creation, which changes which issues gain an ownership at filing, not what an ownership is or names.
