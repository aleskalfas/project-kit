      at: 2026-11-23T20:45:33Z
      outcome: unchanged
      unchanged-because: A Task in Backlog with no owner whose dependencies are closed is still ready, and next-task still starts one. This change adds next-task --task, which takes a named Task only where it is among the ready Tasks the clone may take, and gives the reason by the same filters, so what counts as ready is as the entry says.
