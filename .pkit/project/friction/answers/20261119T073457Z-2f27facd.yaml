    revalidated:
      at: 2026-11-19T07:34:57Z
      outcome: unchanged
      unchanged-because: "Judged with the base's latest revalidation on this README, 20261119T013318Z-c0734647.yaml, and this change together. That answer came with main's b8030cf51, under which the capability's commands act under a credential that names no person, as DEC-076, DEC-078 and DEC-079 decide, and found the README updated for it: who runs a command, whose account a claim, an assignee or a start names, one actor for each act in the audit comments, and only a person's approval counting at the merge gate. The answers before it, which 20261119T004304Z-e84ccc6b.yaml read, judged main's earlier sets with this change. This change touches none of that. It adds four proposed records, DEC-081 and DEC-082 of this capability, ADR-100 and ADR-101, makes none of the edits their Implications name, and changes no code, schema, configuration, grant, skill, agent or README text. DEC-081 fits messages between sessions to the topology of seats, with the agent's tools for messaging and the listing allowed by a privilege the capability defines and grants to its own agent, reported as a widening, as ADR-101 lets a capability allow a privilege it defines to an agent it ships, coming into the model on install, as a deny does, composing once the bound holds the picker's answer for its agent, binding once a person realizes the model or, in a working run, once it reaches the default branch, and refused by the loader past that bound. DEC-082 counts the agent's runs in slots held at once in a clone under a committed ceiling, and ADR-100 has a clone run its builds at once and count its runs in one register. None of the four changes who acts, which account an act names or whose approval counts, and the README says nothing of the four, so main's set and this change meet in no passage of the README. Its sections on topologies of seats, state issues, next-task, the work loop, review-pr's cap, fix-drift's cap and the configuration still describe the capability as it ships, and so does its account of the capability's permission grant, which names the fragment's two denies and no allow; each changes with the Task that builds its record. The deferrals kept, DEC-074's to #3243, which is open, stand for what they name."
      deferred:
        - anchor:
            kind: path
            value: .pkit/capabilities/project-management/decisions/**
          reason: "DEC-074, accepted in this change, has pre-check's board check read the board on each run and warn where the board does not answer, fail a configuration that declares a board and gives no board number its schema admits, and give each check's outcome under a key that keeps its check for good, the report kept stable as ADR-097 and the CLI reference's statement of it keep every command's machine-readable output, and has the skill's first step show pre-check's warnings; DEC-017 and DEC-037 take the edits it names, and ADR-031 and ADR-096 the facts it corrects. The change builds none of it, so pre-check, the skill and back-fill still run as the README describes them, with main's statement of the documents the commands print among it, which already has no key come to mean anything else. The README's table of what pre-check covers, its account of Step 0 under 'Verify with pre-check', the pre-check row under 'When the board does not answer', which leaves to project-kit#3193 whether the check reads the board, and the fields 'The prerequisites: pre-check' lists for its report, which name no key for each check, change with DEC-074's build, #3243, which brings pre-check, the skill and the README to the record together."
        - anchor:
            kind: record
            value: ADR-031
          reason: "ADR-031 point 5 now says the fourth member of back-fill's gate is back-fill's own, computed apart from pre-check, the fact DEC-074 corrects. The README's account of back-fill's gate and of what pre-check covers changes with DEC-074's build, #3243, which brings pre-check, the skill and the README to the record together."
        - anchor:
            kind: record
            value: ADR-096
          reason: "ADR-096 now cites DEC-074 where it said project-kit#3193 proposes that the board check warn. The README's pre-check row under 'When the board does not answer', which still leaves that to project-kit#3193, changes with DEC-074's build, #3243, which brings pre-check, the skill and the README to the record together."
        - anchor:
            kind: record
            value: ADR-097
          reason: "ADR-097 now cites DEC-074 point 4 where it spoke of project-kit#3193's draft: DEC-074 gives each of pre-check's checks a key in its report that keeps its check for good, and cites ADR-097 for how the report stays stable. None of ADR-097's points changes, so 'What the commands print for a program' keeps to the rule as it did. The fields 'The prerequisites: pre-check' lists for the report, which name no key for each check, change with DEC-074's build, #3243, which brings pre-check, the skill and the README to the record together."
