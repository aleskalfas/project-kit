      unchanged-because: Judged against both earlier changes together and this one. In the CLI reference's Surface table, the account change (e43eb148) adds the `account` row and takes the default actor from the `process` rows, and the lock change (148daddf) has the `permissions enable` and `apply` rows also ensure the native locks. Together they leave the `refs rot` row this page links to as it was, and none of the commands the page names, `pkit init`, `sync`, `upgrade`, `status`, `validate`, `refs validate`, `refs rot` and a capability's install and upgrade, reads the account or takes an actor. Of them only an agent's call of `pkit upgrade` now meets the interlock's ask, and the page says only that an upgrade deploys skills, never that it runs unasked. A skill still stops while a record its gates name is not `accepted`, whoever accepts it under COR-072's edit of COR-066, which both answered. This change only names `pkit` in the `uvx` runs of the `sync` section's remedies, and the page names no such run. So it holds as written.
