      unchanged-because: "Judged with the two revalidations made apart that this one replaces. 20261105T214520Z-1bee3213.yaml (511723f5) updated the Rationale: a version transition never chooses which colliding skill or agent definition stays. It also anchored COR-061 point 3, a question asked only where a person can answer, which the measure follows. 20261106T042059Z-9e1949f8.yaml (a36e095b) has the source copy in tests/test_upgrade.py leave out __pycache__. So the tests of a new collision with no terminal, and of a gate's warning, still find no choice taken silently. This change brings the collision check of a capability's install and register to both forms of a skill or agent (COR-015). The transitions' check, detect_new_collisions, already read both forms and is left as it was. So a transition still never chooses which colliding skill or agent definition stays, in either form, as the Rationale says. The statement, measure and applies-to are untouched, so the requirement holds."
