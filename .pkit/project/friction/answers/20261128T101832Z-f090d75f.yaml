      deferred:
        - anchor:
            kind: record
            value: ADR-002
          reason: "ADR-002 now has sessions run a copy of the hook made from the installed release, bounds what it allows by the model last realized and has it ask where it cannot judge by that model, which the guide's section on how a tool call is decided does not yet say, though the guide now has a fault drop only the judgement that rests on it and the hook print an ask; #3412 builds it and rewrites that section."
        - anchor:
            kind: record
            value: ADR-003
          reason: "ADR-003 now has the hook load the decision core from a copy made from the installed release, and each permission command from the release that serves it, not from the project's tree, which the guide does not yet say; #3412 builds it and rewrites the guide's section on how a tool call is decided."
        - anchor:
            kind: record
            value: ADR-005
          reason: "ADR-005 now serves the realizing that profile activate runs from the installed release, and under a session anchor or the harness's mark has it write the activation and realize nothing that widens, which the guide does not yet say, though it now gives the hook's ask before a call that asks to leave the sandbox; #3412 builds it and rewrites the guide's section on how a tool call is decided."
        - anchor:
            kind: record
            value: ADR-007
          reason: "ADR-007 now serves setup autonomy from the installed release, and under a session anchor or the harness's mark has it and its down form stop at a step that widens, makes the hook's copy or turns the hook on or off, naming the person's terminal, which the guide does not yet say; #3412 builds it and rewrites the guide's section on how a tool call is decided."
        - anchor:
            kind: record
            value: ADR-016
          reason: "ADR-016 now has the hook run the fragment merge from the copy, under the interpreter the copy names, not from the adopter's tree, which the guide does not yet say; #3412 builds it and rewrites the guide's section on how a tool call is decided."
        - anchor:
            kind: record
            value: ADR-021
          reason: "ADR-021 now bars a capability's fragment from declaring an entry of the kind ADR-095 point 3 adds to the backbone's catalog, and has the hook run the catalog's walk from the copy, which the guide does not yet say; #3412 builds it and rewrites the guide's section on how a tool call is decided."
        - anchor:
            kind: record
            value: ADR-025
          reason: "ADR-025 now has the core ask where the bound that binds cannot be used and give a revoked grant's ask, and corrects that the hook runs outside the sandbox, from a copy of the installed release; the guide gives the interlock's ask and the naming deny, but neither of those asks, nor where the hook runs; #3412 builds it and rewrites the guide's section on how a tool call is decided."
