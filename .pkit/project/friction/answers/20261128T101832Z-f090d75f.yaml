    revalidated:
      at: 2026-11-28T10:18:32Z
      outcome: unchanged
      unchanged-because: "In the CLI reference's Surface table this change alters one row, that of status: it now says that in a pinned project status reads the pin against the latest release from the release source's tags, unless the offline marker is set. This page cites the table for pkit permissions grant, revoke, profile activate and enable, whose rows are untouched, and says nothing of pkit status."
      deferred:
        - anchor:
            kind: record
            value: ADR-002
          reason: "ADR-002 now has sessions run a copy of the hook made from the installed release, bounds what it allows by the model last realized and has it ask where it cannot judge by that model, which the README does not yet say, though the README now has a fault drop only the judgement that rests on it; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-003
          reason: "ADR-003 now has the hook load the decision core from a copy made from the installed release, and each permission command from the release that serves it, not from the project's tree, which the README does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-005
          reason: "ADR-005 now serves the realizing that profile activate runs from the installed release, and under a session anchor or the harness's mark has it write the activation and realize nothing that widens, and says a call asking to leave the sandbox meets a prompt under the seal, which the README's account of activation does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-014
          reason: "ADR-014 now has the hook run outside the sandbox, from the copy, under an interpreter the copy names by its fixed path, since a hook started through uv would read configuration a sandboxed command can write, and has uv run confined on Linux with a cache for each checkout, which the README does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-016
          reason: "ADR-016 now has the hook run the fragment merge from the copy, under the interpreter the copy names, not from the adopter's tree, which the README does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-021
          reason: "ADR-021 now has the hook run the catalog's walk from the copy, which the README does not yet say, though its merge rule now rejects a fragment's locks as ADR-021 bars them; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-025
          reason: "ADR-025 now has the core ask where the bound that binds cannot be used and give a revoked grant's ask, and corrects that the hook runs outside the sandbox, from a copy of the installed release; the README gives the interlock's ask, the naming deny and the scan that reads them, but neither of those asks, nor where the hook runs; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-060
          reason: "ADR-060 now gives the hook's reading of .git by hand the reason that git runs programs its configuration names, which a sandboxed command can write, and has the removal command take its tests as the permission commands take the core, from the release that serves them, which the README does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: ADR-066
          reason: "ADR-066 now has the hook inside an unconfined run judge by the snapshot of the nearest realized folder that holds the run's folder, and a clone outside every realized folder get the hook's own verdicts, which the README's account of a run's session does not yet say; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
        - anchor:
            kind: record
            value: PRJ-006
          reason: "PRJ-006 point 2 now has the log hold the prompts that follow the hook's deferrals, a call it treats as the core's abstain among them, and none of the asks the core and the hook's own verdicts give, and puts the log of a hook run from its copy in the backbone's state folder, outside every checkout, one for each project, needing no ignore rule; the README calls the log a superset of real prompts; #3412 builds it and rewrites the README where it describes where the hook, the core and the model live."
