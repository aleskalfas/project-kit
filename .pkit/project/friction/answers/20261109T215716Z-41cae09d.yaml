      unchanged-because: "Judged with 20261109T103219Z-76953beb and 20261109T124057Z-59586467, answered apart. The first's change widens only the descriptions of `loaded_rules` and `line` in the package schema, no key or shape, and adds a validation check of core's include, which the page does not describe. The second's has ADR-066 point 3 say the runner passes an agent run's tool access, which the page does not describe either, beside COR-013's reserved `provides` mapping of hooks that it cites. This change: COR-017 lets a capability's package metadata declare the overlay categories its agents write, each with one owning agent and an optional default query, COR-052 point 6 lists that query among the query commands, taking no subject, and COR-013 point 5 names the declaration. The page gives the package metadata's fields, their validation and the registered commands as the schema and the code take them today, and neither holds the declaration or its query yet: COR-073 leaves its layout to the build in #2961 and its architecture record. The page anchors package.schema.json, package_validate.py and command_runner.py, so the change that adds them is asked of it. Its fields and commands hold with all three."
