      unchanged-because: "Judged with the two revalidations answered apart on it, the merge queue's and DEC-073's, against the use case as it stands at the head and every change since each. The merge queue's change brought the use case to its edits of DEC-026, DEC-028, DEC-055 point 5 and ADR-061 point 5: the enqueue is pinned at the request to the head the gate judged, a push the system reads while it waits for the queue has it take the pull request out, which races the queue, and after an exit 4 nothing takes it out, so the queue may merge a later head that neither the verdicts nor the authorisation cover. Variants 14a to 14d, and the minimal guarantees on the pin, on a push while the system waits and on the authorisation's one exception, say this as the records do. DEC-073's edits to DEC-021 have every run of a command that can write take the membership gate, its dry runs included, and a command that only reads and reports take none. land-work, done-work and review-pr each write, so step 2 and variant 2a keep the gate, variant 1b's dry run makes that check among its others, and the account GitHub names stands for whoever runs the command. This change's edits to DEC-021 add, to the closed-mode refusal, ways through the gate in a run with no terminal, and say that a workflow's run under a person's own token acts as that person and passes where an entry names them, leaving whom the gate passes as it was, so step 2 and variant 2a, which give none of the refusal's wording, still hold. Its edit to DEC-072 point 3 has the project's switch consent for no run an event on an issue starts, and leaves its hold at every merge as it was, so variant 12c still holds: it quotes none of the switch's words, which DEC-077's build changes. None of the three changes touches a command the use case names, and none reaches a step another settled, so, read together, the use case holds as it stands."
