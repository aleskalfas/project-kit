      unchanged-because: Judged with the two revalidations answered apart on it, the merge queue's and DEC-073's, against every change since each. The merge queue's edits to DEC-026, which the use case rests on whole, and to DEC-028, which it does not rest on, say how a push after a merge verb's enqueue ends, and that the queue may merge a head the gates did not check. They come after done-work's clash guard and its merge gate, which the use case does not describe, and leave as they were the clash guard variant 1a meets and the comparison of a Task's assignee with whoever runs start-work, which variant 2b rests on. Its edit to ADR-061 is to point 5, and the use case rests on point 3 alone. DEC-073's edits to DEC-021 have every run of a command that can write take the membership gate, its dry runs included, and a command that only reads and reports take none. start-work, handoff-issue, done-work, edit-issue and move-issue each write, so each keeps the gate, and the identity resolution that names whose account a command runs as stands. This change's edits to DEC-021 add, to its closed-mode refusal, ways through the gate in a run with no terminal, and say that a workflow's run under a person's own token acts as that person and passes where an entry names them. The use case's refusals are the clash guard's and start-work's, which none of these edits reaches, and none of the three changes touches a command the use case names. So, read together, its paths, its guarantees and its note that every agent acts under its person's account still hold.
