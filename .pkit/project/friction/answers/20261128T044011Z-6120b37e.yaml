      unchanged-because: "Every ownership fold reads the Task's whole comment log, as ADR-041 point 1 has it, and next-task skips a Task whose log cannot be read whole, as it skips one whose claim cannot be judged, such as a claim whose seat its clone holds with no take named, which no command passes. ADR-041 point 4 has whatever a command or an agent acts on, an agent's narrowing to its own issues among it, come from the fold in every project, and lets only a view shown to a person read the mirror; DEC-059's Implication on the fold points there. So step 1's signed listing, which the worker reads, takes from the fold each sign the worker acts on, and next-task judges each Task it offers from its folded log, so a claim a seat's release voided keeps no Task out of the pool. Variant 2b stands: a Task whose claim no longer counts is ready, and a claim made before its seat's current take is such a claim."
