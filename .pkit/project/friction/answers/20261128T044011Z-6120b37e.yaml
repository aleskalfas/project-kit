      unchanged-because: DEC-043's Implication on read cost and DEC-059's Implication on ADR-041's fold now say that only a view shown to a person reads the description mirror, and that even such a view folds a Task In Progress's log; DEC-059 leaves to ADR-041 point 4 the rule that whatever a command or an agent acts on comes from the fold of the issue's whole comment log. The domain model names neither the mirror nor how a fold reads the log, so its seats, ownerships, pool and state issues stand as written.
      deferred:
        - anchor:
            kind: record
            value: project-management:DEC-059
          reason: DEC-082's edits of DEC-059, accepted and not built, keep a seat's pace on its state issue, folded apart from its holder. They have a worker build as many Tasks at once as its pace allows, and rank a seat's ready Tasks nearest the Task whose work freed its slot. The Seat section's attributes and its state issue change with DEC-082's build, project-kit#3462. DEC-081's edit also lets a directing seat's message name the ready Task a worker takes next, which the view gains with the agent's messaging, project-kit#3523.
