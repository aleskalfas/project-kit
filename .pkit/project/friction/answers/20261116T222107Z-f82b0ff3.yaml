      at: 2026-11-16T22:25:08Z
      outcome: unchanged
      unchanged-because: "Under the refined ADR-065 the page's 'never moves a recorded version down' speaks of an adapter, a component its bundle ships, which point 7 scopes that sentence to; 'before anything else' means anything of the project, as that record's Summary says a transition records where it is going before it writes anything; and the pin entry's 'Moving a pin is not built yet' holds under point 1, under which no command on its list moves a pin. Main's answers made apart, which updated the page for install from another repository, the pin's commit and ADR-097's document versions, were judged together in the answer this one reads. What the pin entry says of a moved tag and of a pin that records no commit is left to the ADR-040 deferral, which #3349 answers."
      deferred:
        - anchor:
            kind: record
            value: ADR-040
          reason: "Its pin entry describes sync as main built it: sync takes the pin's commit only, keeps the copy and warns where the tag names another, and a pin that records no commit follows its tag. The refined ADR-040 has every later fetch take the pin's commit by its id and report the move, and sync read no pin that records no commit (points 1 and 3), which #3349 builds and brings this entry in line with."
