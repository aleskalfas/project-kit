# yaml-language-server: $schema=../schemas/backbone/config.schema.json
# Adopter-owned backbone project config (project namespace — never touched
# by `pkit sync`). Holds project-level declarations the backbone reads.
#
# Schema: .pkit/schemas/backbone/config.schema.json (COR-048); every key is
# owned by a core record and documented in .pkit/cli/README.md,
# "Configuration file". `pkit validate` checks this file strictly.
#
# `name` — the declared project identity for report context (pkit ADR-050):
# rendered on every `pkit report` as the body context line, the `project=`
# marker key, and the title parenthetical. Declared here precisely so it is
# never derived from a filesystem path segment.
name: project-kit

# `docs` — the documentation roots by audience (COR-049; ADR-055 point 1):
# users read `docs/`, maintainers and agents read `tech-docs/`. `docs/` does
# not exist yet, so `pkit validate` warns until the first user page lands.
docs:
  user: docs/
  internal: tech-docs/

# `friction` — anchors and friction (COR-050 point 14). `enforcing` from the
# day the check exists (ADR-055 point 5).
friction:
  mode: enforcing
  # The project's own places: the documents *outside both roots* that hold
  # documentation. The roots are the living-docs capability's default places
  # and are never declared here (living-docs DEC-001 point 1). The principle
  # is ADR-055 point 3's — a document is a place of the space matching its
  # audience; a README an adopter reads to use an area, capability or adapter
  # is a page, a maintainer-facing sub-README is not. This explicit list is the
  # source of truth; each place's space is assigned in
  # `.pkit/capabilities/living-docs/project/config.yaml`. Not places: CLAUDE.md
  # and `.pkit/rules/{core,project}.md` (included into the harness file, so no
  # front matter) and the maintainer sub-READMEs under templates and
  # migrations. Decision records and rule sets are anchor targets, not pages.
  places:
    # technical space — its entry point until tech-docs/README.md exists
    - CONTRIBUTING.md
    # technical space — project-kit's own release process: a maintainer guide,
    # which COR-049 counts as technical documentation
    - .pkit/release/README.md
    # user space
    - README.md
    - .pkit/README.md
    - .pkit/adapters/README.md
    - .pkit/adapters/claude-code/README.md
    - .pkit/agents/README.md
    - .pkit/capabilities/demo-recording/README.md
    - .pkit/capabilities/evidence/README.md
    - .pkit/capabilities/living-docs/README.md
    - .pkit/capabilities/project-management/README.md
    - .pkit/capabilities/software-analysis/README.md
    - .pkit/capabilities/software-engineering/README.md
    - .pkit/cli/README.md
    - .pkit/decisions/README.md
    - .pkit/lifecycle/README.md
    - .pkit/permissions/README.md
    - .pkit/process/README.md
    - .pkit/rules/README.md
    - .pkit/schemas/README.md
    - .pkit/scratchpad/README.md
    - .pkit/skills/README.md
  # The declared surface (COR-050 point 8): the code project-kit says ought to
  # be described. It is the code the project-management code-to-doc mapping
  # obliged documentation for, kept when the mapping's rules became page
  # anchors (#1010): what no page anchors to stays counted as uncovered
  # surface instead of dropping out of sight with the rules. Each path of it no
  # page anchors is an obligation living-docs contributes to the documentation
  # check, which project-kit enforces (#1012), so the surface names only what a
  # page should describe. Component trees are named by their parts; these are
  # left out, since nothing should anchor them:
  #   - `migrations/` — one-off upgrade steps `pkit upgrade` runs once, each
  #     describing itself in its header; the lifecycle README describes the
  #     framework (COR-010).
  #   - `package.yaml` — component metadata whose version the release step
  #     rewrites on `main`: a page anchored to it would go stale on every
  #     release.
  #   - project-management's `manifest.yaml` — install state the capability
  #     lifecycle writes, not source.
  #   - project-management's `project/` — project-kit's own configuration of the
  #     capability, a project tier; the README describes the settings through
  #     the schemas it anchors, not the values project-kit chose.
  #   - each component's README, and the adapters' — the page itself, not what
  #     a page describes.
  #   - evidence's `agents/` — it holds only the `.gitkeep` that keeps the
  #     folder in git until an agent lands; name it here then.
  # `tests/test_self_host_documentation.py` holds every file under these trees
  # to the surface or one of these reasons, so a new one cannot land unsorted.
  surface:
    - src/**
    - .pkit/cli/**
    - .pkit/capabilities/project-management/adapters/**
    - .pkit/capabilities/project-management/agents/**
    - .pkit/capabilities/project-management/decisions/**
    - .pkit/capabilities/project-management/permissions/**
    - .pkit/capabilities/project-management/schemas/**
    - .pkit/capabilities/project-management/scripts/**
    - .pkit/capabilities/project-management/skills/**
    - .pkit/capabilities/project-management/templates/**
    - .pkit/capabilities/evidence/decisions/**
    - .pkit/capabilities/evidence/schemas/**
    - .pkit/capabilities/evidence/scripts/**
    - .pkit/capabilities/evidence/skills/**
    - .pkit/capabilities/software-engineering/agents/**
    - .pkit/capabilities/software-engineering/decisions/**
    - .pkit/capabilities/software-engineering/review-contributions.yaml
    - .pkit/capabilities/software-engineering/schemas/**
    - .pkit/capabilities/software-engineering/scripts/**
    - .pkit/capabilities/software-engineering/skills/**
    - .pkit/adapters/claude-code/*.py
    - .pkit/adapters/claude-code/*.sh
    - .pkit/adapters/claude-code/permission-enforcement.yaml
    - .pkit/adapters/claude-code/settings/**
  # Left out of anchoring and of the measures (COR-050 point 7).
  exclude:
    # scratchpad notes are working drafts, never anchored (ADR-055 point 3)
    - .pkit/scratchpad/active/
    - .pkit/scratchpad/done/
    - .pkit/scratchpad/dropped/
    # generated: the harness copies deploy writes from `.pkit/` (anchor the
    # source), the changelog the release step writes, the lockfile
    - .claude/
    - CHANGELOG.md
    - uv.lock
