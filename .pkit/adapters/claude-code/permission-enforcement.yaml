schema_version: 1

# Per-adapter enforcement-capability declaration (per COR-028) — which dimensions
# of the permission model the claude-code adapter realizes natively, and via which
# layer. `pkit permissions diff` reads this to label declared intent the harness
# cannot faithfully enforce (the fidelity / out-of-harness report). Adapter-side
# data; a future harness adapter ships its own declaration.
#
# layer:       frontmatter | settings | hook | sandbox | out-of-harness
#              (`sandbox` = the harness's OS-level sandbox enforces it — Seatbelt/
#              bubblewrap — not the harness config or the hook; per ADR-004)
# enforcement: native (the harness config/sandbox enforces it) | runtime (a
#              generated PreToolUse hook enforces it; fail-open — see ADR-002) |
#              none (not enforceable in-harness; reported for the OS/container layer)

adapter: claude-code

dimensions:
  tool-gating:
    layer: frontmatter
    enforcement: native
    granularity: per-agent
  command-allow:
    layer: settings
    enforcement: native
    granularity: session-wide
  command-deny:
    layer: settings
    enforcement: native
    granularity: session-wide
    fail_closed: true
  per-agent-command:
    layer: hook
    enforcement: runtime
  directory-scope:
    layer: hook
    enforcement: runtime
  # A path-scoped allow (the agent workspace, #1043): a file tool's grant keyed
  # on its target path, which only the hook sees. Not a confinement boundary;
  # shell reach is `filesystem-confinement` (sandbox); the file tools run
  # outside it, so the recogniser's precision is the gate. It reduces prompts on the
  # allow side; no settings rule is written for it — inside the working
  # directory the harness's own modes already approve the folder, and a
  # session-wide rule would reach beyond it.
  path-scoped-allow:
    layer: hook
    enforcement: runtime
  domain-scope:
    # Per-agent domain rules the hook inspects (model intent); distinct from the
    # session-wide sandbox `domain-allowlist` below (the OS-enforced host list).
    layer: hook
    enforcement: runtime
  # Confinement dimensions (per ADR-004) — enforced by the harness OS sandbox,
  # NOT by the command-inspection hook (a shell escapes any cwd check). pkit
  # declares + manages the sandbox config but delegates enforcement to it.
  filesystem-confinement:
    layer: sandbox
    enforcement: native
    granularity: session-wide
  domain-allowlist:
    layer: sandbox
    enforcement: native
    granularity: session-wide
    # Allowlists on client-supplied hostname; NO TLS inspection. Bounds
    # well-behaved egress; NOT an exfil control (domain fronting / IP-literal /
    # DNS-rebind bypass it) — hence network-egress below stays the gap truth.
  network-egress:
    layer: out-of-harness
    enforcement: none

# A confined agent run (ADR-066): a run the drift command starts through the
# adapter's runner, `run-agent.py` (its README, "The agent runner"). The runner
# writes the run's own settings and passes them inline, never into a settings
# file of the project's. So a session's report above does not read this block,
# and nothing here changes a session. The same vocabulary, per run: what holds a
# confined run, and what stays open (COR-028 point 3, ADR-066 point 11).
confined-run:
  dimensions:
    # The run's allow list: the run's rules, held the other way round (ADR-066
    # point 5). `dontAsk` refuses every call no rule allows, and
    # `--permission-prompts none` lets nobody answer.
    command-allow:
      layer: settings
      enforcement: native
      granularity: per-run
    # The run's floor of denies, with the deny rules of each settings file the
    # run leaves out, copied into the run's settings.
    command-deny:
      layer: settings
      enforcement: native
      granularity: per-run
      fail_closed: true
    # The file tools' reads and writes: path rules in the run's settings on the
    # clone and the workspace (ADR-060 point 6, refined by ADR-066), not the hook.
    directory-scope:
      layer: settings
      enforcement: native
      granularity: per-run
    path-scoped-allow:
      layer: settings
      enforcement: native
      granularity: per-run
    # The five tools, from the checked definition and `--tools`. No MCP server
    # and no skill. The harness's start report is read back, and a mismatch
    # ends the run at once.
    tool-gating:
      layer: frontmatter
      enforcement: native
      granularity: per-run
    # Only the run's settings and a checked definition load: no hook, no MCP
    # server, no plugin of the person's or the project's.
    run-configuration:
      layer: settings
      enforcement: native
      granularity: per-run
    # The shell writes only the workspace, with no retry outside the sandbox,
    # and the sandbox failing closed.
    filesystem-confinement:
      layer: sandbox
      enforcement: native
      granularity: per-run
    # No host is allowed. Like the session's list, not a control on data
    # leaving: see network-egress.
    domain-allowlist:
      layer: sandbox
      enforcement: native
      granularity: per-run
    # What stays open. The sandbox checks the host a client names, and the
    # harness's own connection to its model carries what the run reads.
    network-egress:
      layer: out-of-harness
      enforcement: none
    # On macOS, an allowed command that starts `uv` runs outside the sandbox,
    # held by the run's rules alone. Its writes outside the clone go unseen.
    excluded-commands:
      layer: out-of-harness
      enforcement: none
    # The harness's own read-only commands run under `dontAsk` with no rule.
    read-only-commands:
      layer: out-of-harness
      enforcement: none
    # The file tools read only the workspace and what a rule opens
    # (`blockReadsOutsideWorkingDirectories`). The shell's reads are not
    # narrowed yet: it reads what the sandbox's defaults let it read, since the
    # request names no folders of the installed tool to reopen under a denyRead.
    shell-reads:
      layer: out-of-harness
      enforcement: none
    # An organisation's managed settings reach every run, and nothing drops
    # them. The person's own CLAUDE.md, and any above the workspace, load too.
    managed-configuration:
      layer: out-of-harness
      enforcement: none
    # A process that left the harness's tree before the limit is not ended.
    stray-processes:
      layer: out-of-harness
      enforcement: none
