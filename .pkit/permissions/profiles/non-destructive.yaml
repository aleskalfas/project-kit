# Permission profile: non-destructive (per ADR-005). Domain work without
# destructive power — git, gh, the kit CLI, repo reads, the read-only text
# filters and the agent workspace. Every shipped profile grants the last two:
# `text-filter` (`cat`, `grep`, `head`, `sort` with no output file, …), so a
# pipe of granted programs needs no prompt, and the workspace (rules/core.md,
# the workspace rule). Only the hook realizes `text-filter`, which is never
# written into the native allow list. Assumes the rest of the low-risk
# native-allow shell tier (text processing that may write / fs-cleanup /
# temp-files) when present; the guardrail floor (recursive rm, sudo,
# force-push) always denies underneath. read-only ⊂ non-destructive ⊂ autonomous.
schema_version: 1

description: Domain work, no destructive power — vcs, issue-tracker, kit, repo-read, text-filter, workspace.
posture: lenient
grants:
  - subject: all
    privilege:
      - "[privilege-catalog:vcs]"
      - "[privilege-catalog:issue-tracker]"
      - "[privilege-catalog:kit]"
      - "[privilege-catalog:repo-read]"
      - "[privilege-catalog:text-filter]"
      - "[privilege-catalog:workspace]"
    effect: allow
