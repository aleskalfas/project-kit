# Reviewer-contribution declaration format (per project-management:DEC-032).
#
# This file DOCUMENTS the shape of the `review-contributions.yaml` a
# *contributing* capability ships at its own root
# (`.pkit/capabilities/<cap>/review-contributions.yaml`). It is the
# format reference, paired with `review-contributions.schema.json` which
# validates an instance. It is NOT itself a live contribution — pm ships
# no reviewer-contribution rules (a capability contributes; pm collects).
#
# Per DEC-032 D2: a capability declares reviewer-contribution rules, each
# pairing a classification match-predicate with a required reviewer-agent
# name. pm builds the resolution map by walking the capabilities
# registered in `.pkit/manifest.yaml`'s `components:` list (orphan-safe,
# mirroring DEC-030's collect_capability_overlays) — not arbitrary
# directories under `.pkit/capabilities/`.
#
# Per DEC-032 D5: activation is install-driven. The declaration's mere
# presence under a manifest-registered capability activates its rules;
# there is no separate enable/disable toggle. The file is core-owned
# (the capability ships it; sync refreshes it), NOT adopter-toggled.
#
# Per DEC-032 D2 + DEC-028: a contributed `reviewer` name carries the
# same constraint as a `review.agents.local_registered:` entry — it must
# correspond to a deployed agent file at `.claude/agents/<name>.md` (or
# wherever the harness deploys agents). The collector surfaces a clear
# error when an installed contribution names an undeployed agent rather
# than silently dropping it.
#
# Per DEC-032 D2 (scope): contributed reviewers register on the LOCAL
# path only at v1 — a contributed reviewer is always a local-path agent.

schema_version: 1

# `contributions` is a list of rules. Each rule requires a `reviewer`
# agent name plus at least one of two predicate kinds — a classification
# `match` and/or a diff-property `floor` — and may carry both:
#
#   * `match` — keyed on classification axes (DEC-012). `workstream` and
#     `type` are supported (both mutually_exclusive, so single-valued per
#     issue). The rule's reviewer is required when the predicate matches a
#     closing issue's classification.
#   * `floor` — keyed on the PR's DIFF, not the closing issue. The rule's
#     reviewer is required whenever the diff matches the property, even for
#     an unclassified / `type:docs` PR. Two floor kinds:
#       - `touches-code` fires when the diff touches any non-documentation
#         file. It backstops the classification gate-escape for a
#         code-review reviewer. A changed path the adopting project lists as
#         not code — `review.floors.not_code` in its pm `project/config.yaml`,
#         `.changes/**` (changesets) when unset — is excluded: it satisfies
#         no `touches-code` floor.
#       - `touches-ruled-artefact` fires when the change alters an artefact
#         on which an accepted rule binds, at the base or at the head
#         (COR-051 point 7): adds it, removes it, or changes its content.
#         A change to the declared places alone alters the artefacts it
#         brings in or takes out. A change that only writes a revalidation,
#         or a move the pairing follows that keeps the content, alters
#         nothing. It also fires when the change brings an artefact under
#         an accepted rule without altering it: a wider scope, an accepted
#         rule, a raised pin, a typed place (COR-057 point 2). pm reads it
#         from the backbone's `pkit rule-sets altered` for every pull
#         request while a contribution in force names the floor. The
#         not-code list does not narrow it.
#     Any other non-empty floor name is accepted: a floor a later pm
#     defines, or a misspelt one, requires its reviewer on every change
#     rather than refusing the declaration, and `pre-check` names it.
#
# A `match.<axis>` value may be a single string, the `"*"` wildcard, OR a
# list of strings:
#   * scalar  → the rule matches that one value.
#   * "*"     → the rule matches EVERY value of the axis (axis-present).
#               Forward-safe versus enumerating a fixed value set — if a
#               new value is added to the axis, a `"*"` rule still fires.
#   * list    → the rule matches if the issue's value is ANY listed one
#               (OR *within* an axis). A `"*"` inside a list is a literal
#               value, not the wildcard.
# Multiple axes in one `match` are AND-composed (every axis must hold).
# Per DEC-032 D1 the required set across multiple closing issues is the
# UNION of each issue's matched rules (∪ the floor-matched rules) — pm's
# collector owns that union.
#
# Activation is install-driven (DEC-032 D5): the mere presence of this
# file under a manifest-registered capability activates its rules. An
# empty list — `contributions: []` — is VALID and contributes nothing
# (a capability that ships the file as a placeholder, or temporarily
# carries no rules, without becoming a malformed declaration).
#
# The examples below are illustrative of the format only — the first
# real consumer is the `ux-ui-design` capability shipping a
# `design-reviewer` (per DEC-032's Implications). They show the
# envelope's range, not just its centroid: a multi-value match and a
# capability contributing more than one rule.
contributions:
  # Single-value match: design-workstream PRs require `design-reviewer`.
  - match:
      workstream: design
    reviewer: design-reviewer

  # Multi-value match (OR within the axis): a PR in EITHER the `design`
  # or `ui` workstream requires `design-reviewer`. This is the case a
  # scalar-only `workstream` could not express — hence scalar-or-list is
  # committed at schema_version 1 rather than deferred to a later bump.
  - match:
      workstream:
        - design
        - ui
    reviewer: design-reviewer

  # A second rule from the same capability: `accessibility` PRs require a
  # distinct `a11y-reviewer`. One capability may contribute many rules;
  # the collector flattens them and de-duplicates by reviewer name.
  - match:
      workstream: accessibility
    reviewer: a11y-reviewer

  # `type`-axis match: every non-docs `type` requires `code-reviewer`. The
  # `"*"` wildcard matches EVERY value of the axis without enumerating the
  # fixed set — forward-safe if a new `type` value is ever added.
  - match:
      type: "*"
    reviewer: code-reviewer

  # Diff-property FLOOR: require `code-reviewer` whenever the diff touches
  # code, independent of classification. This backstops the classification
  # gate-escape — a code-touching PR filed against a `type:docs` issue (or
  # an unclassified sub-task) still pulls in the reviewer. A rule may carry
  # a `floor`, a `match`, or both.
  - floor: touches-code
    reviewer: code-reviewer

  # Diff-property FLOOR on ruled artefacts: require `rule-set-reviewer`
  # whenever the change alters a document an accepted rule binds on, or
  # brings one under an accepted rule — a page, an analysis artefact —
  # however the closing issue is classified.
  - floor: touches-ruled-artefact
    reviewer: rule-set-reviewer
