# Issue-body shape per type + universal body rules + checkbox semantics.
#
# Per-issue-type required sections (with `## <Name>` headings, checkbox
# flags, severities); the universal body rules every body must satisfy
# regardless of type; the optional `Integration:` pre-line shape; the
# checkbox semantics (validated at tick, hard-stop at close, sticky
# ticks, two ticked-states); and the sub-task promotion procedure.
#
# Consumed by create-issue (generates the right scaffold at filing) and
# validate-body (checks required sections, universal rules, integration
# marker shape, checkbox close-gate, sub-task promotion mechanics).

schema_version: 1

source:
  upstream: pm-workflow
  commit: 9d1f0237f5d5778ed9811c72f22ae8268e5faff3
  decisions: [MET-006, MET-009]
  captured_at: 2026-05-21

bodies:
  epic:
    required_sections:
      - heading: "## Outcome"
        purpose: |
          Describes the thesis or de-risking goal — what this EPIC is
          for at a workstream level.
        has_checkboxes: false
        severity: "[validation-severity:hard-reject]"
      - heading: "## Success criteria"
        purpose: |
          Checkboxes describing what proves the thesis. Distinct from
          acceptance criteria — success is at the EPIC level, not a
          single capability.
        has_checkboxes: true
        severity: "[validation-severity:hard-reject]"
    optional_section_recommendations:
      - "## Why"
      - "## Out of scope"
      - "## Approach"
      - "## Related"

  feature:
    required_sections:
      - heading: "## What"
        purpose: |
          Describes the capability claim — what this Feature delivers.
        has_checkboxes: false
        severity: "[validation-severity:hard-reject]"
      - heading: "## Acceptance criteria"
        purpose: |
          Checkboxes describing how the capability is verified. Gate
          the Feature's close per MET-006.
        has_checkboxes: true
        severity: "[validation-severity:hard-reject]"
    optional_section_recommendations:
      - "## Why"
      - "## Out of scope"
      - "## Dependencies"
      - "## Approach"
      - "## Use cases"

  umbrella:
    required_sections:
      - heading: "## Purpose"
        purpose: |
          Describes what holds these Tasks together — the theme. No
          acceptance criteria — Umbrellas don't claim a capability.
        has_checkboxes: false
        severity: "[validation-severity:hard-reject]"
    optional_section_recommendations:
      - "## Why"
      - "## Out of scope"
      - "## Related"

  task:
    required_sections:
      - heading: "## What"
        purpose: |
          Describes the concrete change this Task makes.
        has_checkboxes: false
        severity: "[validation-severity:hard-reject]"
      - heading: "## Acceptance criteria"
        purpose: |
          Checkboxes describing concrete claims tied to code. Gate the
          Task's close per MET-006.
        has_checkboxes: true
        severity: "[validation-severity:hard-reject]"
      - heading: "## Doc impact"
        purpose: |
          Captures which docs change (or asserts no doc impact). Per
          MET-014 — mandatory on every Task even when no docs change.
        has_checkboxes: false
        severity: "[validation-severity:hard-reject]"
    optional_section_recommendations:
      - "## Why"
      - "## Approach"
      - "## Implementation notes"
      - "## Related"
      - "## Out of scope"
      - "## Use cases"

universal_body_rules:
  - rule: |
      First line of the body is the parent-ref per the issue type's
      `parent_ref_form` in issue-types.yaml (e.g., `EPIC: #42`). The
      `Integration:` pre-line — when present — precedes it with no
      blank line between; the parent-ref is followed by a blank line,
      then the content. This is the parent-REQUIREDNESS rule: under
      `hierarchy: advisory` (a flat brownfield tracker, per
      [project-management:DEC-036] D4) it degrades to
      `[validation-severity:warning]` — a parent-ref is recorded as
      body-text when given, but a missing one is not gated. Greenfield /
      `hierarchy: gated` keeps the hard-reject below. The containment
      invariants in issue-types.yaml are NOT softened by advisory mode.
    severity: "[validation-severity:hard-reject]"
  - rule: |
      No h1 (`# ...`) headings — the issue title is the h1. Sections
      use `## Title`.
    severity: "[validation-severity:hard-reject]"
  - rule: |
      No `file:line` references like `foo/bar.py:42`. Line numbers go
      stale; name the file and the identifier separately.
    severity: "[validation-severity:warning]"
  - rule: |
      No `## Implementation` or `## How` recipes. Bodies describe
      outcomes, not how to build them. Implementation belongs in the
      PR or a separate design doc.
    severity: "[validation-severity:warning]"
  - rule: |
      No predicted decision IDs (e.g., references to DEC-NNN that
      haven't been authored yet). Reference only IDs that already
      exist.
    severity: "[validation-severity:warning]"
  - id: body.use-case-citation
    rule: |
      On a Feature or Task body, a use case cited in a `## Use cases`
      section and not held by the use-case point
      (`pkit::work-tracking:use-cases`, the use cases settled on the
      default branch) is reported. The check is of existence only: a
      cited id that exists but names another use case than the one meant
      passes, and so does a withdrawn use case. Only an id in that
      section, matching the point's id pattern, is a citation; on a body
      of another type the rule reads nothing. A report, never a refusal,
      at the severity below, which validators read from here. While
      nothing defines or fills the point it says nothing, and when the
      point cannot be read it says, at the same severity, that the
      citations were not checked. Per
      [project-management:DEC-054-use-case-validation].
    severity: "[validation-severity:warning]"
  - rule: |
      Checkboxes follow the close-gate rule (every box ticked before
      Done) and the living-document edit rules (wording free; scope
      changes gated by author).
    severity: "[validation-severity:hard-reject]"
  - rule: |
      A required checkbox section (has_checkboxes: true) with zero filled
      items signals an unedited template skeleton. At the first lifecycle
      transition (Todo → Backlog onward) this is a hard-reject; at create
      it is a warning. A trailing empty `- [ ]` alongside real filled items
      is tolerated (lenient). Per DEC-031.
    severity: "[validation-severity:hard-reject]"
  - rule: |
      Surviving template placeholder prose (text derived at runtime from the
      matching templates/<Type>.md that still appears verbatim in the body)
      signals an unedited skeleton. Always a warning. Per DEC-031.
    severity: "[validation-severity:warning]"

integration_marker:
  pattern: '^Integration: integration/([a-z0-9][a-z0-9-]*[a-z0-9])$'
  position: |
    The marker sits on its own line immediately above the parent-ref
    first line, with no blank line between. When absent, the body
    opens directly with the parent-ref.
  agent_managed: true
  removal_authorisation_severity: "[validation-severity:bypassable-with-audit]"

# Methodology-managed version-provenance footer (per DEC-041 / ADR-037).
# A sentinel-delimited region the capability's scripts maintain at the
# foot of an issue/PR body; agents and humans never author or edit it.
# The write seam (ADR-037) keeps exactly one region here via
# strip-then-append-exactly-one; this entry is the read/validation-side
# contract — how the region is recognised, stripped before scanning, and
# shape-constrained so an un-stripped footer stays inert.
provenance_marker:
  start_marker: "<!-- pkit-provenance:start -->"
  end_marker: "<!-- pkit-provenance:end -->"
  position: |
    Trailing: the region occupies the very end of the body, after all
    content. The write seam (per ADR-037) appends exactly one region
    there; nothing follows it.
  agent_managed: true
  strip_before_scan: true
  strip_rule: |
    Strip from `start_marker` through end-of-document before the body
    validators and checkbox extractors scan. Stripping to EOF — rather
    than matching a start/end pair — removes complete, partial, orphaned,
    or doubled regions alike; it is the read/validation-side twin of the
    write-side strip-then-append-exactly-one seam in ADR-037. Because the
    footer is methodology-managed (agent_managed: true), it is exempt
    from the required-section, checkbox, and universal body rules — it is
    never validated as body content.
  shape_constraints:
    - "No leading list bullet (`- ` or `* `): the region must not parse as a list item or checkbox."
    - "No Markdown heading (ATX `#` or setext) inside the region."
    - "The separator line must not be able to render as a setext-heading underline (no bare `---`/`===` directly beneath a text line)."
    - "No `file:line` reference token."
    - "No surviving template-placeholder prose."
    - "No checkbox (`- [ ]` / `- [x]`)."
  misplacement_severity: "[validation-severity:warning]"

# The answers a change wrote, in its PR body (per DEC-055). A section the
# capability's scripts write from the change check's own list — open-pr,
# edit-pr and land-work, never an agent — replaced whole on every write.
# The artefacts' words are never input: every reader of the body strips
# the section before it scans.
friction_answers_marker:
  heading: "## Friction answers"
  start_marker: "<!-- pkit-friction-answers:start"
  end_marker: "<!-- pkit-friction-answers:end -->"
  position: |
    The last section of the body, before the provenance footer. Each
    marker is a line of its own; the start marker's line goes on to name
    the head the list is for and the merge-base it was taken against
    (`head=<oid> base=<oid> -->`). A change that wrote no answers has no
    such section.
  agent_managed: true
  strip_before_scan: true
  strip_rule: |
    Strip each region — the start marker's line through the end marker's
    — with the heading directly above it, before a reader scans the body:
    the closing references, the Doc impact requirement, the mapping's
    override and the placeholder check read the body without it. A marker
    line with no partner is stripped alone.

checkbox_rules:
  validation_timing: |
    Every check is an audit record of validation by the actor who
    ticked it. The agent ticks when it has evidence; the user ticks
    when they've inspected. Validation happens at the moment of
    ticking, never re-validated at close.
  close_gate_severity: "[validation-severity:hard-reject]"
  ticked_boxes_sticky: true
  two_kinds:
    inline_claim:
      pattern_example: "- [ ] All endpoints respond <100ms p95"
      ticked_by: |
        The actor (human or agent) validating the claim. The tick is
        the audit record; evidence in a comment is courtesy, not
        required.
    issue_reference:
      pattern_example: "- [ ] #99 — Install Claude Code CLI"
      ticked_by: |
        Auto-ticked by GitHub when the referenced issue closes. The
        parent Task cannot close until #99 closes (per MET-006).

sub_task_promotion:
  description: |
    A sub-task lives as a markdown checkbox in a Task's body. When it
    grows up — needs its own PR, owner, discussion, or labels — the
    agent promotes it to a standalone Task.
  new_task_parent_rule: |
    The new Task's parent is the *original Task's parent* (Feature,
    Umbrella, or EPIC) — not the original Task itself. Tasks contain
    only markdown sub-tasks, not other issues (per the containment
    invariants in issue-types.yaml).
  original_task_body_update: |
    The original Task's body has the plain checkbox replaced with a
    task-list reference: `- [ ] foo` becomes `- [ ] #<N> foo` where
    `<N>` is the promoted Task's number. GitHub auto-ticks
    `- [ ] #<N>` when the promoted Task closes; the original Task
    can't close until the promoted Task closes (per MET-006).
