# project-kit's topology of seats (project-management DEC-059).
#
# Every clone reads this file from the default branch. A seat's number is
# its place in the list, counted from one: new seats go at the end, and a
# seat that leaves stays in its place, marked `retired: true`.
#
# The planner files the work with no owner; the two workers serve the pool
# `alpha` and take the next ready Task only from an open milestone whose
# description carries `Pool: alpha` (project-management DEC-061). A new
# line of work is a new milestone marked into a pool; this file changes
# only when a pool or a seat does (#2264).
schema_version: 1
settings:
  release_mode: tolerant
pools: [alpha]
seats:
  - name: planner
    role: planner
    organizer: true
    state_issue: 2251
  - name: worker-1
    role: worker
    pools: [alpha]
    state_issue: 2252
  - name: worker-2
    role: worker
    pools: [alpha]
    state_issue: 2253
