# Project-side adopter config for the project-management capability.
# Dogfooded in project-kit itself — single-repo, label-fallback mode.

schema_version: 1

# Self-describing binding tag (COR-023) — resolves this file to its schema for
# `pkit data validate`. The `binds_to` glob on schemas/config.yaml also resolves
# it, so this is belt-and-suspenders (and the recommended path for a generic
# filename: it makes the binding independent of the glob entirely).
pkit_schema: project-management:config

# The default branch (branch-name generation + base-branch enforcement, per
# [project-management:DEC-013-branch-and-pr-conventions]) is the backbone's
# `repository.default-branch` (COR-054), `main` by default; this file no
# longer declares it — its `default_branch` key is a deprecated alias.

# GitHub host for `gh api` calls in capability scripts. `gh issue create`
# / `edit` auto-infer the host from the git remote; `gh api` does not,
# so scripts that hit raw endpoints (milestone lookup, project field
# mutations) need this explicitly. Read by scripts/_lib/gh.py and
# threaded as GH_HOST.
gh:
  host: github.com

# project-kit doesn't use a Projects v2 board today — Priority and
# Workstream fall back to `priority:*` / `workstream:*` labels per
# [project-management:DEC-012-classification-axes].
has_projects_v2_board: false

# Pre-close triage lead-time in days (per
# [project-management:DEC-016-time-bound-containers]).
pre_close_triage_lead_days: 3

# Code-path -> doc-path mappings per [project-management:DEC-015-doc-update-obligations]
# + [ADR-019]. Checked by `pkit project-management check-doc-mapping`.
#   enforce: false (default) -> advisory: report would-fire mappings, exit 0.
#   enforce: true            -> hard-reject (exit 1) when mapped code changed
#                               without the mapped doc. Wire the check as a
#                               REQUIRED CI status check to make it a real
#                               boundary; the merge-pr layer is only a speed-bump
#                               (ADR-004). Override a false positive with a
#                               `## Doc impact` line naming the code path.
# Keep enforce: false for BROAD tree->README rules — they false-positive on most
# PRs (see the dry-run audit). Only enforce SURGICAL 1:1 surface->doc couplings.
# The mandatory `## Doc impact` section stays the universal hard gate.
#
# project-kit keeps no rules here (#1010). Its six tree->README rules became
# page anchors: each README now anchors, in its own front matter, the code it
# describes, and the enforcing friction check (COR-050; ADR-055 point 5)
# holds the page to it — a stricter obligation than an advisory rule. The
# rules' code patterns stay the declared surface (`friction.surface` in
# .pkit/project/config.yaml), so code no page anchors to is still reported —
# as uncovered surface, and as living-docs' `code-undocumented` obligation
# (below). A rule belongs here again only for documentation that is not a
# page.
code_path_to_doc_mapping:
  enforce: false
  rules: []
  # To hard-enforce a surgical 1:1 coupling, e.g.:
  #   enforce: true
  #   rules:
  #     - { code: "packages/cli/src/commands/registry.ts", docs: ["packages/cli/README.md"] }

# The rules above are the always-included default filler of the
# `pkit::work-tracking:doc-check` point, one obligation per rule, and `enforce`
# above stays the mapping's enforcement setting (DEC-053). Obligations another
# source contributes are never met by a `## Doc impact` line: a documentation
# capability's friction on an anchored page is met only by the page changed in
# the diff, and code nothing documents only once a page anchors it. Each source
# has its own setting here: advisory (the default) or enforcing. living-docs
# contributes the `friction` source — a stale page (a deferred one carries its
# answer and owes nothing), and each declared-surface path no page anchors —
# and project-kit enforces it (#1012):
# a pull request leaving either is refused by `check-doc-mapping`, as the core
# friction check refuses the stale page. The declared surface was narrowed to
# what a page should describe and fully anchored first, so the point held no
# obligation when the setting took effect; CONTRIBUTING.md says what to do
# when the check refuses.
doc_check:
  sources:
    friction: enforcing

# Transitional shim — pre-check.py still requires this field, but the
# canonical workstreams list lives in project/workstreams.yaml per
# [project-management:DEC-018-workstream-taxonomy-and-lifecycle].
# Follow-up: update pre-check.py's REQUIRED_ADOPTER_CONFIG_FIELDS to
# accept the workstreams.yaml-based shape and drop this shim.
workstreams: []

# Milestone categories per [project-management:DEC-016-time-bound-containers].
# project-kit is feature-driven (no calendar; releases when work lands), so the
# primary Milestone is an outcome bundle wrapping related EPICs that close
# together. A second, date-based `housekeeping` category is the closable rolling
# parent for standing maintenance/tooling work — paired with workstream:housekeeping
# for cross-period grouping. A rolling container, never a forever-bucket
# (DEC-016 "closability is the test").
milestone_categories:
  milestone:
    title_format: "Milestone {n}: {name}"
    close_trigger_default: content-based
    description: "Outcome bundle of related EPICs; closes when every child EPIC closes. No date."
  housekeeping:
    title_format: "Housekeeping {n}: {name}"
    close_trigger_default: date-based
    description: "Rolling per-period bucket of maintenance/tooling tasks; date-based, closes each period and rolls open items forward. Cross-period grouping is workstream:housekeeping."

# Review-mode configuration per [project-management:DEC-027-review-modes]
# and [project-management:DEC-028-agent-as-approver-paths].
#
# project-kit dogfoods its own capability: agent-mode (the default) with
# the capability's default `pm-reviewer` agent registered. The remote path
# is unconfigured today — project-kit has no bot identity. Adopters who
# want the autonomous-loop closure point ship a bot via the remote path.
review:
  mode: agent
  agents:
    # Reviewers reason at medium effort (#1046): a review pass does not
    # need the operator's interactive effort, and four reviewers re-run
    # after every push. Override once with `review-pr --effort <level>`.
    effort: medium
    local_registered:
      - name: pm-reviewer

# Audit/journal comment projection (per DEC-049). The engine journal is the
# canonical audit trail regardless; this controls how much is projected as
# GitHub comments:
#   off   — no journal comments (engine journal only)
#   audit — only override/authorisation justifications (default)
#   full  — every governed move, provenance-stamped with the pkit version
# `pkit pm history <N> [--check-drift]` reads the journal + governance boundary.
audit:
  projection: audit
