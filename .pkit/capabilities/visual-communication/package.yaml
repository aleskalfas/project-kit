schema_version: 1
component:
  kind: capability
  name: visual-communication
  version: 0.2.0
description: Visual work from reusable parts — pieces whose content is data, styled by libraries of components, brands and notations, and drawn by several renderers.
requires_backbone: ">=2.0.0,<3.0.0"
aliases:
  - visual
# What a render or an export makes that is not committed — previews, exports nobody
# has handed out, hand-overs to a producer — lies under this path, local to each clone
# (DEC-002 point 1). Declared repository-relative; the renderer rebases it onto
# `.pkit/.gitignore`.
runtime_ignore:
  - .pkit/capabilities/visual-communication/project/local/
commands:
  status:
    script: scripts/status.py
    help: "Show where the visual work lies, and each piece with its state and its lock (DEC-002 point 1, DEC-003 point 8): the location, and whether a command recorded it in the capability's configuration or it is the default, `visual/`, not recorded yet; then each piece of the location with its state, pinned or not, and the version of each library its lock names. Reads only; exit 1 when the configuration cannot be read or records a location that is refused or missing."
  check:
    script: scripts/check.py
    help: "Check every piece of the location, or the one named, without drawing anything (DEC-004 points 8, 9 and 11, DEC-005 points 5, 6, 9 to 11): the binding of each file of the capability's format, the library folder and its list, each lock against the libraries the location holds, each content file against the parts and options of the components it uses, the brand's tokens and the contrast of each pair it declares, and each scene's findings — overflow, a missing picture, a missing font, contrast as drawn, what a renderer the piece exports in would lose. A draft's committed `findings.yaml` is read where its key still verifies; otherwise its scenes are computed, until the validation's bound, and a draft left fails as not checked. A final piece is read by its files, its lock and the version handed out alone (DEC-017 points 4 and 6): the binding of each file, what its lock names, its state and lock against that version, and each file of the version against its hash, no scene, findings record, content or produced picture, and a finding at its lock that only a move would mend states a fact. Whatever its lock shows, a file of that version missing or changed, `state: final` with no version handed out, a version handed out with another state or lock, and a version whose lock or files cannot be read fail. A piece whose record of exports cannot be read is read as final, and the check says why. A published piece is held to the version that wrote its current copy (DEC-017 points 5 to 7), whatever its lock shows: a stale copy, no whole copy of its own and no format fail, and a copy made over a stale output asks for attention. A draft with a file of its current copy standing asks for attention. A published piece's lock behind a newer released version the installed capability reads states a fact (DEC-003 point 9, DEC-019 point 8): within the lock's majors it names `pkit visual upgrade`, and of a later major it says a person takes that version on purpose, by naming it. It judges no fit and names `pkit visual outdated`, and it stops no export. A finding that fails in a released library version, or in a copy of a library the capability ships, asks for attention instead. The `visual-communication:check` member of `pkit validate`; --json prints the findings document validation reads. A query: read-only, offline; `pkit sync` provisions its dependencies. Exit 1 when a finding fails."
    query-contract: true
  add:
    script: scripts/add.py
    help: "Copy a library the capability ships into the location's library folder, list it, and bring every copy of it up to date (DEC-002 point 3, DEC-003 points 4, 5 and 8, DEC-005 point 7, DEC-013 point 5): take the newest released version, another released version that `<library>@<version>` names, or with `--being-built` the version being built, which it takes too where none is released, and the released version of its number where it carries a released one; copy it whole to `libraries/<library>/<version>/`, beside the others, and list it in `libraries/libraries.yaml` with the source `shipped`, `released: true` and the hash the library's record keeps, as it is, or `released: false`, with no hash, every other byte of the list kept. In the same run, replace whole each copy the list marks not released, of a number the capability ships, by what it ships under that number, listed released with its hash where that number is released, only where every lock that names it is a draft's that is not pinned or a final piece's, or the person names it, `--piece <name>` a pinned draft or a published piece and `--declaration <name>` a declaration of written code, each of which may repeat: naming it is the move on purpose, and its lock keeps its number. Under a pinned draft's lock, a published piece's, written code's, or one it cannot read, left unnamed, leave the copy as it is and name each, reading only a piece's `lock`, `pinned`, `state` and record of exports, and show each one it can read as a before-and-after: the piece's scenes drawn both ways in the clone's local folder, under `before-after/<piece>/`, or the difference in the code its writer writes. A record of exports that cannot be read makes the piece final, so its lock holds no copy. Restore each released copy whose files no longer match its hash, and leave one that matches; leave a copy of a number the installed capability does not ship, and a version folder the list does not name; bring in a version the list names whose folder is missing as a copy of its kind. Prints each copy written, as copied, replaced or restored, with each piece and declaration whose lock names it, and each copy left, with why. Running it is the consent for each copy; no version transition copies a library into the location. Refuses a library the capability does not ship, naming the ones it ships, a released version it does not ship, files it ships that no longer match their hash or lack their binding, a hash the list keeps for a released version that differs from the one the capability records, naming both, a version folder the list does not name where the version is to be copied, a library the list names from another source, and a piece or a declaration named that locks no copy the run would replace, naming what it locks. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  release:
    script: scripts/release.py
    help: "Release a version of a library, after reading it in full and comparing it with the library's previous release (DEC-003 points 6 and 7, DEC-013, DEC-014 point 1). `<library>` releases the newest version the location holds of a library the list names from the source `project`: it writes the installed capability's version as the release the version needs in its `library.yaml`, then lists it `released: true` with its hash, every other byte of the list kept, and writes nothing else. `<library> --shipped` releases the version being built of a library the capability ships, where the capability is authored: only where no change touched it since the release step's change that wrote the capability's current version, on the newest released version of each library it builds on; it adds the released place and the entry in the library's record, and writes the change's patch changeset. Shows the segment the comparison finds before it writes, and refuses a break in a version that keeps the previous release's major. Refuses a finding that fails, naming each, a version already released, and a library the project does not own. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  render:
    script: scripts/render.py
    help: "Draw a piece in each of its languages and each combination of modes it names (DEC-002 point 5, DEC-003 point 9, DEC-005 points 13 and 14): move the piece's lock to the newest version the project holds of each library it needs, within the major the lock names, and write it in `piece.yaml`, unless the piece is a pinned draft, final or published, whose lock it checks and never moves; compute every scene, each with the stand-in for a version's number and its date; write `findings.yaml` beside it, keyed by the fingerprint of what the scenes were computed from; draw each scene as an SVG preview in the clone's local `previews/<piece>/`, replacing the piece's previews from before. A preview shows this clone's next number and the date of the run where a component shows them (DEC-016 point 5). It takes the stand-ins where the record of exports cannot be read, and for a final piece, and the render says each it shows, with why. It says what a fact's real text finds in a preview, such as a number that overflows, which no record keeps. A final piece's render writes no findings record, and leaves one from before (DEC-017 point 3): it draws the previews. A piece is final by its state or by a version handed out, or where its record of exports cannot be read. Prints the lock, each finding and each loss a renderer reports that the piece does not accept. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  export:
    script: scripts/export.py
    help: "Make a numbered export of a piece in each format it declares (DEC-006 point 7): `svg`, one file for each page, language and combination, `pdf`, one file for each language and combination that holds every page in order, and `html`, one page file for each language and each set of combinations at one key over the size axes that differ only in modes a reader's signal names, which holds every page in order, while a mode no signal names takes a file of its own (DEC-023 point 1), each carrying the piece's next number, past every version `exports.yaml` records and every file of the exports folder, `<piece>.v<N>.<language>.<key>.<format>`, a page file under the first key it serves, or `<piece>.v<N>.<language>.<key>.<n>.svg` for page `n`, from 1, of a piece of more than one page, in the clone's local `exports/<piece>/`, never overwriting another; then record the version in `exports.yaml` with the fingerprint of what its scenes were computed from, each file's hash, and when, in which state, by which release and renderers. Where a component shows a version's number or its date, every file shows the run's number and the date of the time its record keeps (DEC-016 point 5). It measures that text where it fills it, from a font file, and stops on a text that overflows its width or a component around it that gets less than it asks for, naming the fact, its text and the element, whether or not the stand-in overflowed too and in any library, unless `--use-overflowing version` or `--use-overflowing date` names the fact; the record keeps each text let through, and an overflow measured from a table or by an estimate stops nothing and is said (DEC-016 point 6). A published piece's run also writes its current copy, an unnumbered copy of each file, replacing the piece's `current-copy/` whole, or at the folder the piece names under `copy-place`, and the record names the version that wrote it (DEC-017 point 7). It removes nothing else: it names each file of the last copy it did not write again, which stays where it lies. Uses the lock `piece.yaml` holds and never moves it. Refuses a final piece, which takes no export, naming `pkit visual take-up`, which copies it for new work, a published piece whose lock differs from the lock of the version that wrote its current copy, naming `pkit visual upgrade` and writing back that lock (DEC-017 point 5), a place the rules refuse, any file at a path it writes at a place but one of the piece's own current copy with the hash the record keeps, naming it (DEC-017 point 8), a piece with no lock yet, a lock that does not hold, a produced picture that is missing, one that is stale unless `--use-stale <output>` names it, and `--use-overflowing` naming the language or the state, which the check measures as they stand. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  produce:
    script: scripts/produce.py
    help: "Run the producer a piece declares for one of its produced outputs, and keep its picture (DEC-006 points 1 to 5): resolve the roles its inputs name in every combination the piece names, under the piece's lock; make one variant for each distinct set of values; hand them over and run the producer under the capability's local folder; then, only when no input changed during the run and every variant is a PNG of the declared pixel size exposing the same points, write `produced/<output>/<key>.png` and `produced/<output>/record.yaml` in the piece's folder, removing a variant file left from before. Refuses a final piece, and a piece with no lock yet: run `pkit visual render <piece>` first, or set a published piece back to a draft for its first render. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written in the location, or when a write fails, naming the file, every file then as it was before the run or named."
  look:
    script: scripts/look.py
    help: "Draw a piece's pages as images a person or an agent reads (DEC-015, DEC-020 points 5, 7 and 8): under the lock `piece.yaml` holds, which it never moves, one PNG for each page, language and key asked for, by default every page in the source language in the first key, `--page <page>`, `--language <language>` and `--key <key>` naming others and `--every-language` and `--every-key` all of them, each at 1568 pixels on its long edge, or more where the page's smallest text would land under 10 pixels. It reads the pages of the HTML renderer for a piece that declares `html`, and of the SVG renderer otherwise; `--renderer svg` or `--renderer html` names one, and another name is refused. Each renderer has a folder of its own in the clone's local `look/`: `<piece>/` for the SVG renderer's pages, which resvg draws with no network from what `pkit sync` provisions, and `<piece>.html/` for the HTML renderer's, which a browser of the Chromium family draws, the one the capability's configuration names under `browser` or else the first found where Chrome and Chromium install themselves, one start for each page file, its pages at the largest scale any of them asks. A run replaces only what an earlier run left in its renderer's folder. Beside each image lies each element's frame in its pixels with its trace id, and the lock; beside them all `report.json`, with the lock, the renderer, the tool, each page that lies on white, each text or run the tool drew nothing of, each loss the renderer reports, accepted or not, and each run it may draw otherwise. Through the browser the report also names the browser with its version, each text whose words differ from the scene, each span with no face or drawn in a font of the machine, and each request refused, says an image stands for that browser alone, and the folder holds each page file, to open in your own browser. Prints what the report holds, then each stand-in an image shows, with why: an image shows an export's facts as a preview does (DEC-016 point 5). Runs no helper and no producer, draws a produced picture as it stands, keeps no finding, takes no number and records no location. Refuses a piece with no lock yet, a lock that does not hold, a page, language or key the piece does not have, a page with no size or past 134217728 pixels, and a configuration whose `browser` names no path. Exit 1 when refused, with the renderer's folder as it was, or when a write fails, naming the file, every file then as it was before the run or named; 2 on a usage error; 3 when it stopped, where no browser runs, one stops part way or its first read fails: the HTML renderer's folder then holds the page files and a report that says what stopped it, under which lock, and what is missing, and no image, and the command names the SVG renderer as a way to go on."
  pages:
    script: scripts/pages.py
    help: "List what `pkit visual look` can draw of a piece (DEC-015 points 2 and 5, DEC-020 points 5 and 7): its languages and keys, what it draws by default, each page in each language by its number and trace id, computed under the lock `piece.yaml` holds, the renderer a run reads by default, and each renderer's tool: resvg with its version, and the browser a run would start, named in the configuration or the first found, or where it looked where it found none. It starts no browser, so it names no browser's version. --json prints one document. A query: read-only, offline; `pkit sync` provisions its dependencies, and through it those of `pkit visual look`. Refuses a piece it cannot draw, such as one with no lock yet or a lock that does not hold, and a configuration that cannot be read. Exit 1 when refused."
    query-contract: true
  before-after:
    script: scripts/before-after.py
    help: "Draw each of a piece's pages under two locks, in the clone's local folder, and print each page that differs (DEC-019 point 5). `--ahead` looks ahead, before a move: its before is the lock of the version that wrote a published piece's current copy, and otherwise the lock the piece holds; its after is what a run would propose, with each newer version held back and why, or the versions named, each `<library>@<version>`, with each clash or lost end they go past. A draft takes it only with versions named, which may include one not yet released, and a published piece's may not; a final piece takes it with none named, and its two locks are one. `--back` looks back, at a change: its base is where the branch left the base `pkit repository base` answers, or `--base <ref>`; its before is the lock of the version that wrote the copy at that commit, or the lock held there, read through the converters; its after is the lock the piece holds now. A piece the base does not hold has no before, and it says so. Both drawings take today's engine, the piece's files and pictures as they lie, and one filling of an export's facts, as a preview fills them, so what differs is the locks'; it says each stand-in they show, with why. It says where the two locks are one, where the engine's release differs from the one the copy's version recorded, and which pictures are stale. It runs no program, moves no lock, keeps no finding, takes no number and records no location, and no validator runs it. It writes only under `before-after/<piece>/`, in `before/` and `after/`, replacing what an earlier run left there. A drawing it cannot make, as where a library version left the project, stops nothing: it says why. Refuses a piece with no lock yet, a draft with no version named, a version named for a final piece, what the search refuses, and a base that resolves to nothing. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named; 2 on a usage error."
  upgrade:
    script: scripts/upgrade.py
    help: "Propose a move of a published piece's lock, as what one run leaves in the working tree (DEC-019 points 1 to 4, 6 and 7): the moved lock, a new version in `exports.yaml`, the current copy it wrote, and the findings record of a render under that lock, with no preview, as one change. It commits nothing, makes no branch and opens nothing on a work tracker: a person lands the diff, or discards it. It takes a published piece alone, and refuses any other, naming what moves that lock. It reads the lock in the piece's own file, whoever wrote it. It moves that lock among released versions, within its majors, to versions that fit, and states each newer version it held back, with why. Each `<library>@<version>`, as `pkit visual add` takes one, moves what it names and only what that needs, past a clash or a lost end and past the lock's majors. It looks ahead as `pkit visual before-after --ahead` does, and keeps that drawing under `before-after/<piece>/`. Where it would propose the lock the piece holds, and the version that wrote the copy was made under it, it says so and writes nothing. An edit since the copy stops it, read with the lock put back and the lock's library files left out, naming each input, unless `--edited <input>` names it: a file by its path in the piece's folder, a font as the refusal writes it. A produced picture stale under the moved lock stops it, naming what changed, unless `--use-stale <output>` names it. A number or a date that does not fit where its export fills it stops it, as it stops an export, unless `--use-overflowing <fact>` names the fact. It runs no program, and each refusal prints the line that names them all. A fingerprint it cannot read refuses, naming the record. With no copy standing, or none of its own, it goes on, writes the copy whole and says no file stood. Its export run follows every rule of an export but the gate. It names each finding that fails under the moved lock and stops on none. `--dry-run` stops where the run would, says what it would write and prints each page that differs, keeping no drawing. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named; 2 on a usage error."
  outdated:
    script: scripts/outdated.py
    help: "List what each lock a person moves could still take, across majors (DEC-019 points 8 and 11): a published piece's lock, a pinned draft's and written code's, as `pkit visual add` reads the locks. An unpinned draft's render moves its own lock and a final piece's never moves, so both are left out. For each library a lock names, it names the newest version that fits within the lock's major, as the search of a proposed move works it out, and each other newer version with why that search would not take it: a later major, a clash, a lost end, a version the installed capability cannot read. A published piece's search takes released versions alone, and a hand-moved lock's takes every version. A piece is placed under each combination the search judges, and written code's lock is judged alone. Each lock behind names what moves it. It says so where none is behind, and names each lock it could not judge, with why. Reads only, needs no network and writes nothing. Exit 0 when listed, whatever is behind; 1 when the location cannot be read."
  prune:
    script: scripts/prune.py
    help: "Remove each library version that lies behind, with its entry in `libraries/libraries.yaml`, after showing the list and asking once (DEC-019 points 9 to 11): a version no lock names, a piece's in any state, a declaration's of written code, or that of the version that wrote a piece's current copy, read from its fingerprint; that no lock that moves can still reach, a draft's, pinned or not, a published piece's or written code's, since each that names its major names a newer version; that a newer version of its major serves in place of, one the installed capability reads, released where it is; and that holds no unreleased work. A final piece's lock and a kept export's keep what they name and no more. So it spares a version the list does not name, the project's own not yet released, one a lock that moves lies below in its major, a library's last version, the newest of each major the installed capability reads, which a first lock and a `builds-on` take, and the newest release of each major, which a release is compared with. It lists each version it would remove, each it spares with why, each kept export made under a version it removes, which marking final leaves a finding on until that version is back, and each kept export whose lock it cannot read. `--dry-run` shows that list and removes nothing. Otherwise it asks a terminal once, `--yes` consents up front, and with nobody to ask and no consent it refuses and removes nothing. It removes each version's folder and its entry, every other byte of the list kept, from the working tree alone, and stages nothing; it takes no version by name. Says so where nothing lies behind. Stops, removing nothing and naming the file, on a lock it cannot read, a record of exports it cannot read, a fingerprint it cannot read of the version that wrote a current copy, a list it cannot read or whose text cannot lose an entry, and a folder or the list reached through a link. Records the location at its first write; `--location <path>` names it. Exit 1 when it stops or refuses, with nothing removed, or when a removal fails, naming the file, every file then as it was before the run or named; 2 on a usage error."
  mark-final:
    script: scripts/mark-final.py
    help: "Mark a piece final, naming the version handed out, whatever changed since (DEC-017 points 1, 2 and 8): put back the lock that version was made under, read from its fingerprint, whatever lock the piece holds, a published piece's included, and only the lock; move every file of the version from the clone's local `exports/<piece>/` into `handed-out/` in the piece's folder, under the names they carry, to be committed; write `state` and `lock` in `piece.yaml`, every other byte kept; and end `exports.yaml` with the line `handed-out: <version>`, as one change. Prints the lock it put back, each input of the version's fingerprint that still does not verify with that lock, each file the version read whole, made before an export left fields out of it, what no longer holds of the lock, that the version did not write the piece's current copy, which stays, and each number or date the version let through (DEC-016 point 6). None of these stops it. Takes a piece set final by hand. Refuses a version whose file is missing from the clone's local folder or differs from the record's hash, naming each, a version whose fingerprint is missing or no longer matches its own inputs, a piece with a version handed out, and anything lying at `handed-out/`. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named; 2 on a usage error."
  take-up:
    script: scripts/take-up.py
    help: "Take a final piece up again, as a new piece copied from it, a draft with its lock pinned (DEC-003 point 8, DEC-017 points 1, 3 and 8): from a piece with a version handed out, write the folder of a new piece under `<name>`, which no piece holds, copying the piece's folder whole, as git sees it, but for what only its past holds: `exports.yaml`, `findings.yaml`, `handed-out/` and `current-copy/`. In the new `piece.yaml`, every other byte kept, set `state: draft` and `pinned: true`, write the lock the version handed out was made under, read from its fingerprint, and drop `copy-place`, as one change. So the new piece draws as the piece it copies until a person moves its lock. Prints the lock it pinned, each input of the piece's own that changed since that version, since only the lock comes back and the copy holds the later words, and the new piece. Reads the final piece only, which stays as it was. Refuses a piece with no version handed out, a piece set final by hand among them, naming `pkit visual mark-final`, a name taken or not a piece's name, a version whose lock cannot be read, and a file it copies or writes that is reached through a link. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named, and no part of the new piece; 2 on a usage error."
  write-code:
    script: scripts/write-code.py
    help: "Write a brand out as code, as a declaration in the location asks (DEC-005 point 7, DEC-006 points 4 and 5): read `code/<name>.yaml`, its code writer, the form of its spelling, its brand and the lock of the brand and what it builds on; resolve every token the brand exports in every combination of its axes at the versions the lock names, which it never moves; write the code to the declaration's `out` and its record beside it, `<out>.record.yaml`, with the fingerprint `pkit visual check` verifies. Writes nothing where the record verifies and the code is what the writer writes now. Prints each token the writer has no form for as a loss, unless the declaration accepts it. Writes `out` and its record; exit 1 when refused, or when a write fails, naming the file, every file then as it was before the run or named."
# The `visual-communication:check` member of `pkit validate`: a component joins
# validation by naming a command it registers (COR-055 point 3); the block's
# keys are ADR-058's.
validators:
  check:
    command: check
