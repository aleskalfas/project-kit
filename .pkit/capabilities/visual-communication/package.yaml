schema_version: 1
component:
  kind: capability
  name: visual-communication
  version: 0.1.0
description: Visual work from reusable parts — pieces whose content is data, styled by libraries of components, brands and notations, and drawn by several renderers.
requires_backbone: ">=2.0.0,<3.0.0"
aliases:
  - visual
# What a render or an export makes that is not committed — previews, exports nobody
# has handed out, hand-overs to a producer — lies under this path, local to each clone
# (DEC-002 point 1). Declared repository-relative; the renderer rebases it onto
# `.pkit/.gitignore`.
runtime_ignore:
  - .pkit/capabilities/visual-communication/project/local/
commands:
  status:
    script: scripts/status.py
    help: "Show where the visual work lies, and each piece with its state and its lock (DEC-002 point 1, DEC-003 point 8): the location, and whether a command recorded it in the capability's configuration or it is the default, `visual/`, not recorded yet; then each piece of the location with its state, pinned or not, and the version of each library its lock names. Reads only; exit 1 when the configuration cannot be read or records a location that is refused or missing."
  check:
    script: scripts/check.py
    help: "Check every piece of the location, or the one named, without drawing anything (DEC-004 points 8, 9 and 11, DEC-005 points 5, 6, 9 to 11): the binding of each file of the capability's format, the library folder and its list, each lock against the libraries the location holds, each content file against the parts and options of the components it uses, the brand's tokens and the contrast of each pair it declares, and each scene's findings — overflow, a missing picture, a missing font, contrast as drawn, what a renderer the piece exports in would lose. A draft's committed `findings.yaml` is read where its key still verifies; otherwise its scenes are computed, until the validation's bound, and a draft left fails as not checked. A finding that fails in a released library version, or in a copy of a library the capability ships, asks for attention instead. The `visual-communication:check` member of `pkit validate`; --json prints the findings document validation reads. A query: read-only, offline; `pkit sync` provisions its dependencies. Exit 1 when a finding fails."
    query-contract: true
  add:
    script: scripts/add.py
    help: "Copy a library the capability ships into the location's library folder, list it, and bring every copy of it up to date (DEC-002 point 3, DEC-003 points 4, 5 and 8, DEC-005 point 7, DEC-013 point 5): take the newest released version, another released version that `<library>@<version>` names, or with `--being-built` the version being built, which it takes too where none is released, and the released version of its number where it carries a released one; copy it whole to `libraries/<library>/<version>/`, beside the others, and list it in `libraries/libraries.yaml` with the source `shipped`, `released: true` and the hash the library's record keeps, as it is, or `released: false`, with no hash, every other byte of the list kept. In the same run, replace whole each copy the list marks not released, of a number the capability ships, by what it ships under that number, listed released with its hash where that number is released, only where every lock that names it is a draft's that is not pinned, or the person names it, `--piece <name>` a pinned draft and `--declaration <name>` a declaration of written code, each of which may repeat: naming it is the move on purpose, and its lock keeps its number. Under a pinned draft's lock, written code's, or one it cannot read, left unnamed, leave the copy as it is and name each, reading only a piece's `lock`, `pinned` and `state`, and show each one it can read as a before-and-after: the piece's scenes drawn both ways in the clone's local folder, under `before-after/<piece>/`, or the difference in the code its writer writes. Restore each released copy whose files no longer match its hash, and leave one that matches; leave a copy of a number the installed capability does not ship, and a version folder the list does not name; bring in a version the list names whose folder is missing as a copy of its kind. Prints each copy written, as copied, replaced or restored, with each piece and declaration whose lock names it, and each copy left, with why. Running it is the consent for each copy; no version transition copies a library into the location. Refuses a library the capability does not ship, naming the ones it ships, a released version it does not ship, files it ships that no longer match their hash or lack their binding, a hash the list keeps for a released version that differs from the one the capability records, naming both, a version folder the list does not name where the version is to be copied, a library the list names from another source, and a piece or a declaration named that locks no copy the run would replace, naming what it locks. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  release:
    script: scripts/release.py
    help: "Release a version of a library, after reading it in full and comparing it with the library's previous release (DEC-003 points 6 and 7, DEC-013, DEC-014 point 1). `<library>` releases the newest version the location holds of a library the list names from the source `project`: it writes the installed capability's version as the release the version needs in its `library.yaml`, then lists it `released: true` with its hash, every other byte of the list kept, and writes nothing else. `<library> --shipped` releases the version being built of a library the capability ships, where the capability is authored: only where no change touched it since the release step's change that wrote the capability's current version, on the newest released version of each library it builds on; it adds the released place and the entry in the library's record, and writes the change's patch changeset. Shows the segment the comparison finds before it writes, and refuses a break in a version that keeps the previous release's major. Refuses a finding that fails, naming each, a version already released, and a library the project does not own. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  render:
    script: scripts/render.py
    help: "Draw a piece in each of its languages and each combination of modes it names (DEC-002 point 5, DEC-003 point 9, DEC-005 points 13 and 14): move the piece's lock to the newest version the project holds of each library it needs, within the major the lock names, unless the piece is pinned, and write it in `piece.yaml`; compute every scene; write `findings.yaml` beside it, keyed by the fingerprint of what the scenes were computed from; draw each scene as an SVG preview in the clone's local `previews/<piece>/`, replacing the piece's previews from before. Prints the lock, each finding and each loss a renderer reports that the piece does not accept. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  export:
    script: scripts/export.py
    help: "Make a numbered export of a piece in each format it declares (DEC-006 point 7): `svg`, one file for each page, language and combination, and `pdf`, one file for each language and combination that holds every page in order, each carrying the piece's next number, past every version `exports.yaml` records and every file of the exports folder, `<piece>.v<N>.<language>.<key>.<format>`, or `<piece>.v<N>.<language>.<key>.<n>.svg` for page `n`, from 1, of a piece of more than one page, in the clone's local `exports/<piece>/`, never overwriting another; then record the version in `exports.yaml` with the fingerprint of what its scenes were computed from, each file's hash, and when, in which state, by which release and renderers. Uses the lock `piece.yaml` holds and never moves it. Refuses a piece with no lock yet, a lock that does not hold, a produced picture that is missing, and one that is stale unless `--use-stale <output>` names it. Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written, or when a write fails, naming the file, every file then as it was before the run or named."
  produce:
    script: scripts/produce.py
    help: "Run the producer a piece declares for one of its produced outputs, and keep its picture (DEC-006 points 1 to 5): resolve the roles its inputs name in every combination the piece names, under the piece's lock; make one variant for each distinct set of values; hand them over and run the producer under the capability's local folder; then, only when no input changed during the run and every variant is a PNG of the declared pixel size exposing the same points, write `produced/<output>/<key>.png` and `produced/<output>/record.yaml` in the piece's folder, removing a variant file left from before. Refuses a piece with no lock yet (run `pkit visual render <piece>` first). Records the location at its first write; `--location <path>` names it. Exit 1 when refused, with nothing written in the location, or when a write fails, naming the file, every file then as it was before the run or named."
  look:
    script: scripts/look.py
    help: "Draw a piece's pages as images a person or an agent reads (DEC-015): under the lock `piece.yaml` holds, which it never moves, one PNG for each page, language and key asked for, by default every page in the source language in the first key, `--page <page>`, `--language <language>` and `--key <key>` naming others and `--every-language` and `--every-key` all of them, each at 1568 pixels on its long edge, or more where the page's smallest text would land under 10 pixels, in the clone's local `look/<piece>/`, replacing what an earlier run left there. Beside each image lies each element's frame in its pixels with its trace id, and the lock; beside them all `report.json`, with the lock, the tool, each page that lies on white, each text or run the tool drew nothing of, each loss the renderer reports, accepted or not, and each run measured in more than one family. Prints what the report holds. Runs no helper and no producer, draws a produced picture as it stands, keeps no finding, takes no number and records no location. A local tool draws the pages with no network, from what `pkit sync` provisions. Refuses a piece with no lock yet, a lock that does not hold, a page, language or key the piece does not have, and a page with no size or past 134217728 pixels. Exit 1 when refused, with `look/<piece>/` as it was, or when a write fails, naming the file, every file then as it was before the run or named."
  pages:
    script: scripts/pages.py
    help: "List what `pkit visual look` can draw of a piece (DEC-015 points 2 and 5): its languages and keys, what it draws by default, each page in each language by its number and trace id, and the tool that draws, computed under the lock `piece.yaml` holds; --json prints one document. A query: read-only, offline; `pkit sync` provisions its dependencies, and through it those of `pkit visual look`. Refuses a piece it cannot draw, such as one with no lock yet or a lock that does not hold. Exit 1 when refused."
    query-contract: true
  write-code:
    script: scripts/write-code.py
    help: "Write a brand out as code, as a declaration in the location asks (DEC-005 point 7, DEC-006 points 4 and 5): read `code/<name>.yaml`, its code writer, the form of its spelling, its brand and the lock of the brand and what it builds on; resolve every token the brand exports in every combination of its axes at the versions the lock names, which it never moves; write the code to the declaration's `out` and its record beside it, `<out>.record.yaml`, with the fingerprint `pkit visual check` verifies. Writes nothing where the record verifies and the code is what the writer writes now. Prints each token the writer has no form for as a loss, unless the declaration accepts it. Writes `out` and its record; exit 1 when refused, or when a write fails, naming the file, every file then as it was before the run or named."
# The `visual-communication:check` member of `pkit validate`: a component joins
# validation by naming a command it registers (COR-055 point 3); the block's
# keys are ADR-058's.
validators:
  check:
    command: check
