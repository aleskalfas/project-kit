# The accepted calibration's data (visual-communication DEC-042 point 9): the values a
# refinement of DEC-042 writes, as `calibration.yaml` in the capability's folder, when whoever
# maintains the capability accepts a calibration's report. Nothing else writes them, and
# `pkit visual verdict` reads them to tell whether its verdict ends the designer's loop
# (DEC-042 points 9 and 10). The capability ships no such file until a report is accepted.
#
# - `rules` — each rule with evidence of its own in the accepted report, by its id: the
#   major of the set that holds it, and the digest of its text. A bar that covers any other
#   rule gets no hold.
# - `reviewer` — the digest of the reviewer's definition, `agents/graphic-design-reviewer.md`.
# - `design-knowledge` — the digest of the design knowledge, `design-knowledge/`.
# - `code` — the digest of the capability's code, each program file of `scripts/`. Every
#   change to the code lapses the hold, and a compiled cache or another kind of file beside
#   it lapses nothing.
# - `checks` — the digest of the list of checks, the body of `checks.md` after its front
#   matter.
# - `model` — the model the calibration's review ran on, by its full name, with its effort
#   where the harness has one.
#
# Each digest is SHA-256, written `sha256:<hex>`. `pkit visual verdict --json` gives the
# same values as they stand, under `reading`, for the rules a bar covers and the model a
# round's report names. The hold lapses where any of them differs from the data.
#
# The body below is the reference instance. Its values stand for no calibration.

pkit_schema: visual-communication:calibration
schema_version: 1

# --- reference instance -------------------------------------------------

rules:
  RS-GRAPHIC-001:
    major: 1
    text: sha256:a6012703a941d9f7d83332f6570b0291280c17df87130dcad0fc04b98eecdffa
  RS-GRAPHIC-002:
    major: 1
    text: sha256:78e2cf9d0ee17c9ec50649ae515e30248896c5d1ea3db8fd33f6562c4b4e9057
reviewer: sha256:3edcdaedaf46b44fa8a96059fea380438bbebc9ca23ac39d0b548b0c507cf3f9
design-knowledge: sha256:9d50099cf7a74e87485070baa8ad7e662d518490f1e8c5f47aa9a3c14f7307c4
code: sha256:06d7a586b4757751ea904e35b1c8b172226bccbee950138f5f036ababfd3d8f2
checks: sha256:dbfd837e678aaf5d68615b6fe0505136182897f1db7c4f5fef5715c88ae60589
