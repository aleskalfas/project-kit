# A round's review report, the document `graphic-design-reviewer` opens its grades with
# (visual-communication DEC-042 points 1 and 4, DEC-015 point 7): a grade in words for each
# rule it read, on each page it takes one and once for the piece where it takes one, with
# its evidence; the marks it alone sets; what it had read when it wrote its grades, and what
# it read after; and the full name of the model it ran on, with its effort where the harness
# has one. A command gives the verdict from this document and the project's bar. The
# reviewer writes it as its reply, and whoever dispatched it keeps it as written, in
# `.pkit/capabilities/visual-communication/project/local/reviews/<piece>/round-<n>.yaml`,
# local to the clone.
#
# The body below is the reference instance: a second round, one of whose grades differs
# from the round before.

pkit_schema: visual-communication:review
schema_version: 1

# --- reference instance -------------------------------------------------

piece: deck
round: 2
model:
  name: example-model-1.0
  effort: high
read-before-grading:
  - kind: images
    what: Every image of the run, each band of each page, and the forced images.
  - kind: frames
    what: The frames beside each image.
  - kind: report
    what: report.json of the run.
  - kind: piece
    what: piece.yaml, the content of each language, and the brand it names.
  - kind: intent
    what: The goals, relations and takeaways the dispatcher handed over, without their reasons.
  - kind: rule-sets
    what: The rule sets the capability ships, each from its file.
  - kind: design-knowledge
    what: The index, and the topics the pages needed.
read-after-grading:
  - kind: brief-file
    what: brief.yaml, for its reasons.
  - kind: earlier-reports
    what: round-1.yaml, as it was written.
grades:
  - rule: RS-COMM-001
    on:
      page: layers
    grade: professional
    evidence: The lead answers the title, and the stepped figure shows the answer.
  - rule: RS-GRAPHIC-001
    on:
      page: layers
    grade: competent
    evidence: The eye enters at the footer's mark before it reaches the top level.
    other-cause: The page's frame, which the library draws, carries the mark.
    since-last-round:
      was: below competent
      why: The mark is smaller than in the round before, so it no longer outranks the figure.
  - rule: RS-GRAPHIC-005
    on:
      page: layers
    grade: competent
    evidence: The top level's text is too fine for a projector.
    mark:
      kind: need
      names: A size of the library's text that reads at a projector's distance.
  - rule: RS-COMM-003
    on:
      piece: true
    grade: professional
    evidence: Each lead follows from the one before it.
not-graded:
  - rule: RS-COMM-001
    on:
      page: cover
    why: A page whose layout has no lead is not judged by this rule.
