# A round's review report, the document `graphic-design-reviewer` opens its grades with
# (visual-communication DEC-042 points 1 and 4, DEC-015 point 7): a grade in words for each
# rule it read, on each page it takes one and once for the piece where it takes one, with
# its evidence; the marks it alone sets; what it had read when it wrote its grades, and what
# it read after; and the full name of the model it ran on, with its effort where the harness
# has one. A command gives the verdict from this document and the project's bar. The
# reviewer writes its report as its reply, and whoever dispatched it keeps the report as
# written in `.pkit/capabilities/visual-communication/project/local/reviews/<piece>/`,
# local to the clone: whole in `round-<n>.md`, and this document alone in
# `round-<n>.yaml`.
#
# The body below is the reference instance: a second round, one of whose grades differs
# from the round before. Two faults hold one grade, and its evidence names each by the id
# the report gives it, then the reading beyond them. One grade only the asker's words would
# raise. Each grade of `professional` names the strongest weakness it weighed, and a page a
# rule does not judge quotes the rule's words that leave it out. It shows some grades of some
# pages, to show the form, and is no whole review: a review grades each rule it reads on each
# page it reads, and once for the piece where the rule takes a grade there, or lists it under
# `not-graded` with why.
#
# Each value in words is written as a folded block scalar, `>-` after its key and its words
# on the lines below, which parses words that hold `: `, quote marks, a ` #` or a
# backslash. The evidence of `RS-GRAPHIC-005` holds `: `, and opens with a quoted phrase
# and goes on after it. Written plain, a value that does either does not parse.

pkit_schema: visual-communication:review
schema_version: 1

# --- reference instance -------------------------------------------------

piece: deck
round: 2
model:
  name: >-
    example-model-1.0
  effort: >-
    high
read-before-grading:
  - kind: images
    what: >-
      Every image of the run, each band of each page, and the forced images.
  - kind: frames
    what: >-
      The frames beside each image.
  - kind: report
    what: >-
      report.json of the run.
  - kind: piece
    what: >-
      piece.yaml, the content of each language, and the brand it names.
  - kind: intent
    what: >-
      The goals, relations and takeaways the dispatcher handed over, without their reasons.
  - kind: rule-sets
    what: >-
      The rule sets the capability ships, each from its file.
  - kind: design-knowledge
    what: >-
      The index, and the topics the pages needed.
read-after-grading:
  - kind: brief-file
    what: >-
      brief.yaml, for its reasons.
  - kind: earlier-reports
    what: >-
      round-1.md, the whole report of round 1, as it was written.
grades:
  - rule: RS-COMM-001
    on:
      page: layers
    grade: professional
    evidence: >-
      The lead answers the title, and the stepped figure shows the answer. The strongest
      weakness weighed is the lead's second clause, which the figure shows through its labels
      alone, and a professional would hand the page over as it is.
  - rule: RS-GRAPHIC-001
    on:
      page: layers
    grade: competent
    evidence: >-
      The head and the stepped figure stand above the rest but for the note on the levels, a
      part of the rest, which ties with the figure's top level in size and weight, so the
      figure does not stand above it.
    other-cause: >-
      The library whose component draws the note sets it in the type of the levels' names.
    since-last-round:
      was: below competent
      why: >-
        The note is smaller than in the round before, so the head stands above it, though the
        figure does not.
  - rule: RS-GRAPHIC-002
    on:
      page: layers
    grade: competent
    evidence: >-
      F1, alignment, at deck/slides[layers]/body/levels[middle]; F2, alignment, at
      deck/slides[layers]/body/levels[base]. Beyond them, the note on the levels stands
      nearer the footer than the figure it explains.
  - rule: RS-GRAPHIC-005
    on:
      page: layers
    grade: professional
    evidence: >-
      "Readable where it is shown": each text and part reads as drawn where the deck is
      projected, and the page is taken in at a glance. The strongest weakness weighed is the
      note's five lines, the most text the page holds, which a professional would polish.
  - rule: RS-COMM-001
    on:
      page: plan
    grade: competent
    evidence: >-
      The lead lists the plan's three phases, and answers no question the title asks.
    mark:
      kind: asker
      names: >-
        The title and the lead of the page plan, which the asker has seen.
  - rule: RS-COMM-003
    on:
      piece: true
    grade: professional
    evidence: >-
      The sections keep a deductive order, from what the layers are to the plan that builds
      them, and the pages within each keep an order of structure, from the whole to its
      parts. The strongest weakness weighed is the title of the second section's opening
      page, which repeats a word of the first's, a tie the rule does not count, and a
      professional would hand the deck over as it is.
not-graded:
  - rule: RS-COMM-001
    on:
      page: cover
    why: >-
      "Which pages": a page whose job is not to make a point is one whose job is to open,
      divide, list, close or stand outside the pages that make the piece's points, such as a
      cover, an agenda, a section's opening page, a page of references, a page of questions
      or thanks, or an appendix's divider. Its kind tells it, and it is not judged by this
      rule.
  - rule: RS-GRAPHIC-008
    on:
      page: cover
    why: >-
      The cover holds its title with the subtitle under it, and its author and its link as
      labels, and the rule does not judge a heading, a title or a label.
