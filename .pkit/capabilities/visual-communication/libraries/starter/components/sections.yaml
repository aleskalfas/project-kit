pkit_schema: visual-communication:component
schema_version: 1

status: experimental
# The design system its job and its form come from (DEC-022 point 4): the U.S. Web Design
# System's landing page template, whose sections stand one under another.
about: >-
  The sections of a page, laid down it in the content's order, one under another, each
  as wide as it is given and as tall as it asks. A section is drawn by the section unless
  the content names another, such as a form or a table. It sets no inset and no space of
  its own: each section keeps its own from the page's edge and from the next.

fields:
  type: object
  required: [sections]
  properties:
    sections:
      type: array
      minItems: 1
      description: The sections, from the top, each with the fields of the component that draws it.
      items: {type: object}
    section:
      type: object
      description: >-
        The component that draws each section that names none, with words for its
        options: the section unless the content names another.

lists:
  sections: {component: section}

parts:
  sections:
    repeat: sections
    draw: starter/section
    width: "=:width"
    column: {align-items: stretch}

preferred:
  height: "=sections.bottom"
