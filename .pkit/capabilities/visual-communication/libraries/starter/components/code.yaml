pkit_schema: visual-communication:component
schema_version: 1

status: experimental
about: >-
  Code, as a terminal or a file shows it, in a monospace type on a box with rounded
  corners, on its colour family's fill. Each line stands as written, never broken, under
  a head where the content gives one. Its text runs plain, or as a prompt, a command or a
  comment. Where its concept has a sign, the sign stands at the end of its head's row, or
  of its first line where it has no head, and a plain run that names a concept with a sign
  starts with that sign. It is as wide as its widest line, or its head, and its sign.

fields:
  type: object
  required: [text]
  properties:
    head:
      type: string
      description: What the code is, such as what a terminal shows or a file's name.
      x-pkit-prose: true
    text:
      type: string
      description: >-
        The code, a line feed between its lines. It may be given as runs, each plain, a
        prompt, a command or a comment.
      x-pkit-runs: [plain, prompt, command, comment]

colour: neutral

values:
  # The head's row holds the head and, at its end, the sign, with a gap between them where
  # the sign is drawn: `room`. Where the block has no head, the sign ends the code's first
  # line, and the box leaves room for it. `over` is how far the sign reaches below the
  # head: its whole height where there is no head, nothing where the head is as tall.
  # `beside` is the room the code leaves it: the sign's side, since a sign is square, and
  # the gap between them.
  heading: "=max(head.height, sign.height)"
  room: "=sign.width + min(sign.width, @space.2)"
  over: "=heading - head.height"
  beside: "=over + min(over, @space.2)"

parts:
  box:
    box:
      fill: ":colour.fill"
      stroke: ":colour.line"
      stroke-width: "=@starter.edge"
      rx: "=@starter.corner"
    width: "=:width"
    height: "=:height"
  # The concept's sign, at the end of the head's row, or of the code's first line where it
  # has no head, as a card draws its own, in the family's text. A code block whose family
  # comes from no concept with a sign draws none, and the sign then has no size.
  sign:
    sign: {fill: ":colour.text"}
    x: "=:width - @starter.inset - sign.width"
    y: "=@starter.inset + (heading - sign.height) / 2"
    width: "=@starter.sign"
    height: "=@starter.sign"
  # The head and a plain run are the family's text on the family's fill, a pair the
  # foundations declare. A prompt, a command and a comment take shared roles, which the
  # contrast as drawn guards.
  head:
    when: head
    text:
      content: head
      style: starter.type.head
      fill: ":colour.text"
    x: "=@starter.inset"
    y: "=@starter.inset"
  # Neither the head nor the code takes a width, so no line is broken: each stands as
  # written, and the box is as wide as the widest. A plain run, the style painted from
  # its family, starts with its concept's sign where it names one with a sign, in the
  # run's paint.
  text:
    text:
      content: text
      style:
        by: text
        plain: starter.type.code
        prompt: starter.type.code
        command: starter.type.code
        comment: starter.type.code
      fill:
        by: text
        plain: ":colour.text"
        prompt: text-secondary
        command: accent
        comment: text-secondary
      sign: {by: text, plain: true, prompt: false, command: false, comment: false}
    x: "=@starter.inset"
    y: "=@starter.inset + head.height + min(head.height, @space.2)"

preferred:
  width: "=max(head.right + room, text.right + beside) + @starter.inset"
  height: "=max(text.bottom, sign.bottom) + @starter.inset"
