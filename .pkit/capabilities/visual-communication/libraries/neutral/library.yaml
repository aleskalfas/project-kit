pkit_schema: visual-communication:library
schema_version: 1

# The neutral brand: a brand to start from, so a project can draw before it writes one of
# its own (DEC-004, Implications). It gives every shared role a value, in light and dark
# and at both contrasts. It names no library but the foundations, so it draws the starter
# at its defaults (DEC-008, Implications), and it draws no layout, so each top draws its
# own (DEC-009, Implications). It opens no role: opening one later breaks nothing, closing
# one does (DEC-004 point 5). Its fonts are Source Sans Pro, a family for each weight, and
# Source Code Pro for code, committed unchanged with their licences in fonts/. Not
# released yet, so it may still change.
name: neutral
version: 1.0.0
kind: brand
needs-release: 0.1.0
builds-on:
  - {name: foundations, major: 1}
dtcg: "2025.10"
resolver: neutral.resolver.json
open: []
