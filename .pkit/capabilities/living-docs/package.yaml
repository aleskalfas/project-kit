schema_version: 1
component:
  kind: capability
  name: living-docs
  version: 0.1.0
description: Living documentation — documentation spaces by audience, every page anchored to what makes it true, drift detected as friction and fixed by reviewed proposals.
requires_backbone: ">=1.149.0,<2.0.0"
# The review contribution (`review-contributions.yaml`, DEC-001 point 9) names
# project-management's floor on ruled artefacts, which an older release
# refuses. So an installed project-management must have the floor. The
# changeset that adds the contribution raises this floor to the release that
# ships it, at that release (`requires_capabilities: {project-management:
# release}`). The dependency is optional, since the capability works without
# it (COR-030).
requires_capabilities:
  - name: project-management
    version: ">=0.54.0,<1.0.0"
    optional: true

commands:
  new:
    script: scripts/new.py
    help: "Stamp a page, or a space's definition (DEC-001 points 2 and 4), each checked by the validator's own check before and after its write: an error the project did not have puts back what it wrote and refuses, quoting it. `new page <file> --space <space> --kind <kind> --reader <id> --title <text> [--path <glob>]… [--record <id>]… [--artefact <id>]… [--source <name>]…` writes a new page of a kind the capability declares from its template — `reader`, `kind` and the friction block with the anchors given, an empty block with none, the title in the level-1 heading, the template's other placeholders left and listed — and refuses an unknown space or kind, a file that exists, a path that is not a Markdown file of the repository or is reached through a link, a reader that is not a word, an empty or placeholder title, and a file that would not be a page of the space named. `new space <space> [--set <NAME>]` writes the space's definition under the definitions location's `rule-sets/`, inheriting `living-docs:LDOC` at its current major, scoped to the space's root and the places assigned to it by the page type, with the user space's own rule, reader paths stay unbroken, written accepted; names it as the space's `definition` in the capability's project configuration, every other byte kept, which declares a space the project adds; and records the definitions location on first use (COR-049 point 5). It refuses a space that has a definition, a set name taken, and a space no scope can select yet — two roots that are one folder, say. It refuses what its write breaks, judged against where the rules bound before, and reports the pages the space's rules then fail. `--dry-run` makes the checks before the write, prints each file it would write and writes nothing. Exit 1 on a refusal."
  validate:
    script: scripts/validate.py
    help: "Validate the documentation spaces (DEC-001): places and their assignment, what is never a page, pages' kind, each page's reader against the readers point where RS-LDOC-003 binds on it and its body against the structure its kind declares where RS-LDOC-004 binds (read from `pkit rule-sets reach`), entry points and definitions with their scopes, and counts the pages left unanchored without an accepted reason apart from those accepted with one (DEC-001 point 8), and the captured sources' layout (point 4); --json prints the findings document `pkit validate` reads. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  fill-doc-check:
    script: scripts/fill-doc-check.py
    help: "This capability's filler of the pkit::work-tracking:doc-check point (DEC-001 point 7): one page-stale obligation per page the whole-repository friction check reports stale (a deferred page carries its answer and gives none), one code-undocumented obligation per uncovered surface path; --json prints the filler envelope the backbone reads. A query: read-only, offline, no parameter; `pkit sync` provisions its dependencies."
    query-contract: true
    reads: [history]
  resolve-source:
    script: scripts/resolve-source.py
    help: "Resolve the source anchor kind (DEC-001 point 4): the file capturing a source, found from its name; --json prints {\"paths\": [...]}. A query: read-only, offline, no dependencies."
    query-contract: true

# The `living-docs:spaces` member of `pkit validate`: a component joins
# validation by naming a command it registers (COR-055 point 3); the block's
# keys are ADR-058's.
validators:
  spaces:
    command: validate

# COR-049 point 4 — the capability's documents, relative to a documentation root.
docs:
  locations:
    user-root:
      path: .
      root: user
      description: The user documentation root itself, a default place of the user space (DEC-001 point 1). Never recorded, so it follows the root.
    internal-root:
      path: .
      root: internal
      description: The internal documentation root itself, a default place of the technical space (DEC-001 point 1). Never recorded, so it follows the root.
    definitions:
      path: living-docs
      description: Where the spaces' definitions live, in the technical space (DEC-001 point 2); recorded when the first one is placed (COR-049 point 5).

# COR-050 point 1 — where the spaces' pages and this capability's artefacts are found.
#
# COR-056 point 2 — the type registry, and the type each place gives (DEC-001
# points 1, 2 and 4). `page` names `kind` as its kind field, so a document in a
# root is a page only where it declares its page kind, and admits project
# places, which the validator checks. `template` admits none: the definitions
# location is the capability's own. The rule-sets place names no type: every
# rule is `backbone:rule`.
friction:
  types:
    page:
      description: A page of a documentation space, written for one declared reader and following one page kind (DEC-001 point 4).
      kind-field: kind
      project-places: true
    template:
      description: A writer's tool in the definitions location, such as a page template copied there, never a page (DEC-001 point 2).
  places:
    - location: user-root
      path: "**"
      type: page
      description: The user space's pages, under the user root.
    - location: internal-root
      path: "**"
      type: page
      description: The technical space's pages, under the internal root.
    - location: definitions
      path: rule-sets
      description: The spaces' definitions, project rule sets that inherit LDOC (COR-051 point 2).
    - location: definitions
      path: "**"
      type: template
      description: The writers' tools beside the definitions, each a template, never a page (DEC-001 point 2).
  # COR-050 point 2 — a source outside the repository, anchored by its name and
  # captured as one file of the project tier (DEC-001 point 4).
  kinds:
    source:
      command: resolve-source

# COR-053 — the documentation role, the two data points defined under it, and
# the contribution to the work-tracking role's documentation check (DEC-001
# point 7). See the README, "Connections".
connections:
  roles: [pkit::documentation]
  extension-points:
    accepts:
      pkit::documentation:readers:
        schema_version: 1
        schema: readers.schema.json
        description: >-
          Who reads the documentation and what they need, one entry per reader:
          its id, which a page names as its reader, and a description of what
          that reader needs. A user and a maintainer are always included; a
          project filler adds or overrides readers, and a capability that keeps
          knowledge about the software's users may add its own. Where
          RS-LDOC-003 binds on a page, validation fails the page when its
          reader does not resolve, so a filler that cannot answer leaves the
          point unresolved rather than check pages against whichever readers
          survived.
        combination: union
        default:
          participation: always
          value:
            - id: user
              description: Uses the system, and needs to know what it does and how to use it — never its internals.
            - id: maintainer
              description: Builds and keeps the system — a person, or an agent that writes and checks its documentation — and needs to know why, from where and by which rules.
        inert: fail
      pkit::documentation:reading-evidence:
        schema_version: 1
        schema: reading-evidence.schema.json
        description: >-
          Results of executed checks that follow the documentation — a
          simulated reader running a guide against the system, say — one entry
          per result, keyed by the page or path, the commit and the check, the
          name its filler gives one executed check, opening with the filler's
          own name. Supplied by a capability that runs such checks, or by the
          project; this capability runs none. Advisory: evidence informs a
          reader-review and never replaces one, so a filler that cannot answer
          is warned and the rest still count.
        combination: union
        inert: fallback
  extensions:
    contributes:
      # Friction on anchored pages and uncovered surface, read from the
      # backbone's whole-repository friction check at HEAD. Inert while no
      # capability provides the work-tracking role.
      - point: pkit::work-tracking:doc-check
        schema_version: 1
        command: fill-doc-check
        description: One page-stale obligation per page carrying friction debt, one code-undocumented obligation per path of the declared surface that nothing anchors.
