schema_version: 1
component:
  kind: capability
  name: lean-business
  version: 0.1.0
description: Guides a person through the lean method of validating a business model, from the canvas and its desk checks to experiments and 90-day cycles, keeping each judgement theirs.
requires_backbone: ">=2.2.0,<3.0.0"
aliases:
  - lean
commands:
  check:
    script: scripts/check.py
    help: "Check the files of the location the capability's configuration records, or the default, `lean-business/`, until one is (DEC-002 point 14): each file's place in an idea's folder and its binding, a file of the capability's anywhere else, each day against the calendar, each id against its path and each entry's against the others of its canvas, each reference between the files (none may name a subject of another idea, or one of a kind of which the location holds no file), and each invariant DEC-002 and DEC-003 own that the files can show broken, as an error: the verdicts' order, a verdict or a shortlisting the desk gate would refuse, a split or a variant's origin that does not match, a changed declaration or plan, a declaration, a stopping rule, a result, a decision, a plan or a review the gates would refuse on the day it was recorded, an experiment on a variant its cycle does not explore, two undecided or overlapping cycles of an idea, a suspension that breaks its rules or contradicts an act already recorded, the goal set while a cycle was planned, running or suspended, and a fingerprint that cannot be checked. A guideline of the book, counted only on a box that holds entries, and a judgement gone stale, are warnings. Each file's shape, a reference that names nothing and an id given twice are the `data` member's of `pkit validate`. Reads the files git sees as they stand, never today's date. The `lean-business:check` member of `pkit validate`; --json prints the findings document validation reads. A query: read-only, offline; `pkit sync` provisions its dependencies. Exit 1 when a finding is an error."
    query-contract: true
  set-location:
    script: scripts/set_location.py
    help: "Record the folder that holds the project's ideas, relative to the repository's top, in the capability's configuration (DEC-002 point 1). Running it is the consent. Refused for a folder the location's rules refuse, and while the location in use holds an idea: move its folder first."
  set-goal:
    script: scripts/set_goal.py
    help: "Set an idea's goal: --revenue, --per month|year, --currency, --years (DEC-002 point 3). The person's act: asks at a terminal, needs --person-decided off one, and records who and when. A first goal needs every flag; it creates the idea's folder. Refused while a cycle is planned, running or suspended, and a change of currency while a declared experiment is undecided."
  new-variant:
    script: scripts/new_variant.py
    help: "Start a variant, <idea>--<variant> --archetype direct|multisided|marketplace [--author]... [--comes-from <variant>]: its canvas and an empty list of assumptions, the idea's folder created where none is (DEC-002 point 4). Content: asks nothing. Authors default to git's user.name."
  add-side:
    script: scripts/add_side.py
    help: "Name a side, a group of customers a multisided or marketplace variant serves (DEC-002 point 6). Content: asks nothing."
  add-entry:
    script: scripts/add_entry.py
    help: "Add an entry to a box of a variant's canvas, <variant> <box> <text> [--id] [--side], its links as flags: --alternative on a problem, --problem on a value proposition or a solution, --sub-headline on a value proposition, --trigger on an early adopter, --kind on a channel, --step on a key metric (DEC-002 points 4 and 7). Content: asks nothing. Prints the id it gives; warns of each judgement the change leaves stale."
  edit-entry:
    script: scripts/edit_entry.py
    help: "Change an entry's words, side or links: --text, --side, the link flags, --clear <field>, --drop-alternative, --drop-trigger. Its id never changes. Content: asks nothing; warns of each judgement the change leaves stale."
  remove-entry:
    script: scripts/remove_entry.py
    help: "Take an entry out of its canvas. Content: asks nothing. Warns, never refuses, where another entry or an assumption still names it (DEC-002 point 7); its id is never given again."
  set-inputs:
    script: scripts/set_inputs.py
    help: "Give the viability estimate its inputs, merged into the set for --side: --price <amount> <month|year>, --lifetime <length> <month|year>, --conversion, --referral-share, --clear <input> (DEC-002 point 4). Content: asks nothing; warns of each judgement the change leaves stale."
  set-traction:
    script: scripts/set_traction.py
    help: "Give a variant its traction target: --multiplier, and --first-stage-metric with --first-stage-target; --clear removes it (DEC-002 point 4). Content: asks nothing; warns of each judgement the change leaves stale."
  judge:
    script: scripts/judge.py
    help: "Record the person's yes or no on a desk step, <variant> desirability|viability|feasibility yes|no [--note], with the fingerprint of what it judged (DEC-003 point 2). A yes on the next step and a no on a passed one move the variant through the process engine; a yes judged again and a no on the next step move nothing. The person's act: asks at a terminal, needs --person-decided off one."
  shortlist:
    script: scripts/shortlist.py
    help: "Shortlist a feasible variant, or take a shortlisting again, with the fingerprint of its canvas and the goal (DEC-003 point 2). Its gate: a yes on all three steps, none stale. The person's move: asks at a terminal, needs --person-decided off one."
  canvas:
    script: scripts/canvas.py
    help: "Draw a variant's canvas as a grid arranged as in the book, with its credit and licence line (DEC-001 point 6); --ids shows each entry's own part of its id. Read-only."
  estimate:
    script: scripts/estimate.py
    help: "Work out what the idea's goal asks of a variant through the customer factory: the active customers needed, those lost and won each year, the leads needed and the customers each year on the way, for each side that pays (DEC-002 point 4). Read-only; nothing is stored. The README gives the formulas."
  status:
    script: scripts/status.py
    help: "Where the ideas stand and what waits on you (DEC-001 point 10): one line for each idea, or one idea in full, each subject's position from the process engine. --json prints the structured form, with its schema_version, whose keys the README lists. Read-only."
  desk-stage-detect:
    script: scripts/desk_stage_detect.py
    help: "Process classifier (lean-business DEC-003 points 1 and 2): read-only; answers which state of the desk stage a variant is in, from its canvas's outcome and the run of standing yes verdicts. Invoked by the process engine."
  desk-stage-gate-sketched-desirable-pass-desirability:
    script: scripts/desk_stage_gate_sketched_desirable_pass_desirability.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from sketched to desirable on pass-desirability? Invoked by the process engine."
  desk-stage-gate-desirable-viable-pass-viability:
    script: scripts/desk_stage_gate_desirable_viable_pass_viability.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from desirable to viable on pass-viability? Invoked by the process engine."
  desk-stage-gate-viable-feasible-pass-feasibility:
    script: scripts/desk_stage_gate_viable_feasible_pass_feasibility.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from viable to feasible on pass-feasibility? Invoked by the process engine."
  desk-stage-gate-feasible-shortlisted-shortlist:
    script: scripts/desk_stage_gate_feasible_shortlisted_shortlist.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from feasible to shortlisted on shortlist? Invoked by the process engine."
  desk-stage-gate-shortlisted-shortlisted-shortlist:
    script: scripts/desk_stage_gate_shortlisted_shortlisted_shortlist.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from shortlisted to shortlisted on shortlist? Invoked by the process engine."
  desk-stage-gate-sketched-shelved-shelve:
    script: scripts/desk_stage_gate_sketched_shelved_shelve.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from sketched to shelved on shelve? Invoked by the process engine."
  desk-stage-gate-desirable-shelved-shelve:
    script: scripts/desk_stage_gate_desirable_shelved_shelve.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from desirable to shelved on shelve? Invoked by the process engine."
  desk-stage-gate-viable-shelved-shelve:
    script: scripts/desk_stage_gate_viable_shelved_shelve.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from viable to shelved on shelve? Invoked by the process engine."
  desk-stage-gate-feasible-shelved-shelve:
    script: scripts/desk_stage_gate_feasible_shelved_shelve.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from feasible to shelved on shelve? Invoked by the process engine."
  desk-stage-gate-shortlisted-shelved-shelve:
    script: scripts/desk_stage_gate_shortlisted_shelved_shelve.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from shortlisted to shelved on shelve? Invoked by the process engine."
  desk-stage-gate-sketched-split-split:
    script: scripts/desk_stage_gate_sketched_split_split.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from sketched to split on split? Invoked by the process engine."
  desk-stage-gate-desirable-split-split:
    script: scripts/desk_stage_gate_desirable_split_split.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from desirable to split on split? Invoked by the process engine."
  desk-stage-gate-viable-split-split:
    script: scripts/desk_stage_gate_viable_split_split.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from viable to split on split? Invoked by the process engine."
  desk-stage-gate-feasible-split-split:
    script: scripts/desk_stage_gate_feasible_split_split.py
    help: "Process gate (lean-business DEC-003 points 1 and 2): read-only; may a variant move from feasible to split on split? Invoked by the process engine."
  experiment-lifecycle-detect:
    script: scripts/experiment_lifecycle_detect.py
    help: "Process classifier (lean-business DEC-003 points 1 and 3): read-only; answers which state of the experiment's lifecycle an experiment is in, from its decision, its declaration and stopping rule, and its time box as its cycle's suspensions move it. Invoked by the process engine."
  experiment-lifecycle-gate-drafted-declared-declare:
    script: scripts/experiment_lifecycle_gate_drafted_declared_declare.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from drafted to declared on declare? Invoked by the process engine."
  experiment-lifecycle-gate-drafted-running-declare:
    script: scripts/experiment_lifecycle_gate_drafted_running_declare.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from drafted to running on declare? Invoked by the process engine."
  experiment-lifecycle-gate-declared-running-start:
    script: scripts/experiment_lifecycle_gate_declared_running_start.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from declared to running on start? Invoked by the process engine."
  experiment-lifecycle-gate-running-due-come-due:
    script: scripts/experiment_lifecycle_gate_running_due_come_due.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from running to due on come-due? Invoked by the process engine."
  experiment-lifecycle-gate-due-running-shift-time-box:
    script: scripts/experiment_lifecycle_gate_due_running_shift_time_box.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from due to running on shift-time-box? Invoked by the process engine."
  experiment-lifecycle-gate-running-declared-shift-time-box:
    script: scripts/experiment_lifecycle_gate_running_declared_shift_time_box.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from running to declared on shift-time-box? Invoked by the process engine."
  experiment-lifecycle-gate-due-declared-shift-time-box:
    script: scripts/experiment_lifecycle_gate_due_declared_shift_time_box.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from due to declared on shift-time-box? Invoked by the process engine."
  experiment-lifecycle-gate-due-decided-decide:
    script: scripts/experiment_lifecycle_gate_due_decided_decide.py
    help: "Process gate (lean-business DEC-003 points 1 and 3): read-only; may an experiment move from due to decided on decide? Invoked by the process engine."
  cycle-lifecycle-detect:
    script: scripts/cycle_lifecycle_detect.py
    help: "Process classifier (lean-business DEC-003 points 1 and 4): read-only; answers which state of the cycle's lifecycle a cycle is in, from its decision, an ongoing suspension, and its window as its suspensions work it out. Invoked by the process engine."
  cycle-lifecycle-gate-planned-running-start:
    script: scripts/cycle_lifecycle_gate_planned_running_start.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from planned to running on start? Invoked by the process engine."
  cycle-lifecycle-gate-running-in-review-end:
