    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from running to suspended on suspend? Invoked by the process engine."
  cycle-lifecycle-gate-in-review-suspended-suspend:
    script: scripts/cycle_lifecycle_gate_in_review_suspended_suspend.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from in-review to suspended on suspend? Invoked by the process engine."
  cycle-lifecycle-gate-in-review-running-shift-window:
    script: scripts/cycle_lifecycle_gate_in_review_running_shift_window.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from in-review to running on shift-window? Invoked by the process engine."
  cycle-lifecycle-gate-suspended-running-resume:
    script: scripts/cycle_lifecycle_gate_suspended_running_resume.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from suspended to running on resume? Invoked by the process engine."
  cycle-lifecycle-gate-suspended-in-review-resume:
    script: scripts/cycle_lifecycle_gate_suspended_in_review_resume.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from suspended to in-review on resume? Invoked by the process engine."
  cycle-lifecycle-gate-in-review-decided-decide:
    script: scripts/cycle_lifecycle_gate_in_review_decided_decide.py
    help: "Process gate (lean-business DEC-003 points 1 and 4): read-only; may a cycle move from in-review to decided on decide? Invoked by the process engine."
validators:
  check:
    command: check
connections:
  extensions:
    depends-on:
      generated: true
      entries:
        - process: lean-business:cycle-lifecycle
        - process: lean-business:desk-stage
