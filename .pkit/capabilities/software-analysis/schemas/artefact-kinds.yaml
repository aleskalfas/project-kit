# Each kind's structure, declared once as data (software-analysis DEC-001
# point 1). Every artefact and every record carries every part its kind ships.
# The structure lists those parts in their order, and the forms and hints of
# the front-matter fields a writer fills. Its shape is
# `artefact-kinds.schema.json`, beside this file.
#
# - The kinds: `actor`, `use-case`, `journey` and `term` (DEC-001), and the
#   three kinds of requirement, `quality-requirement`, `functional-requirement`
#   and `constraint` (DEC-002), keyed by the types the capability's places
#   give. The revalidation record has no type, and is keyed
#   `revalidation-record`.
# - `shown-as`: the kind's name as its artefacts show it beside their id. A
#   requirement is headed `# REQ-007 · Quality · <title>` (DEC-002 point 2).
#   An actor, a use case and a journey show none, and are headed
#   `# <id> — <title>`, an actor by its name.
# - `sections`: the elements of a body, in order. Each has an `id`, permanent
#   once shipped, and a `type`:
#   - `heading`: a heading's `level` and, where the kind fixes it, its `text`
#   - `label`: a bold label, `**<text>:**`, that opens a paragraph or a
#     top-level list item
#   - `opening`: the text before the body's first label
# - `required`: true unless set to false. Every element a kind ships is
#   required, so none sets it here.
# - `allows-none`: the part may read `None.` when it has nothing to say.
# - `hint` and `example`: one line each. A hint says what goes in the part. A
#   heading the stamp writes has no hint, and its example is the heading.
# - `form`: a check on a part's content, from the closed list the schema
#   gives. The schema's description of each form says what it reads in a
#   part that holds a list.
# - `front-matter`: the fields a writer fills, each with its hint, its example
#   and any form. A field that sets `allows-none` says whether it may read
#   `None.`: true, it may, and false, it may not. A field that sets neither is
#   judged by its form alone. The kind's companion schema checks each field's
#   shape. Where
#   the stamp leaves a field to fill, it writes the field's hint as its
#   placeholder, as it writes a body part's. The template's front matter,
#   written by hand, shows the same hint.
# - `head`: a collection's file head, which the stamp writes once when it
#   creates the file. The glossary is the one collection. So `term` declares
#   the file's head in `head`, and each entry's section in `sections`.
# - `ordered`: whether the elements come in the order listed. True unless set
#   to false.
#
# An artefact kind's structure is the checkable part of the format rule,
# RS-SAN-001, and binds where that rule binds and at its status
# (`rule-sets/san.md`). The revalidation record's binds always: a record is a
# held document, which no rule binds on, so the capability checks it itself
# (DEC-001 point 1).

schema_version: 1

kinds:
  actor:
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# ACT-analyst — Analyst"
      - id: opening
        type: opening
        hint: What this role is, and what it does with the system.
        example: Someone who builds reports from their team's figures.
      - id: occasions
        type: label
        text: Occasions
        allows-none: true
        hint: On what occasions the actor comes to the system. Write `None.` when there is none.
        example: At the end of each week, and whenever a manager asks for figures.
      - id: context
        type: label
        text: Context
        allows-none: true
        hint: What the actor comes with, such as data, authority or a limit. Write `None.` when there is none.
        example: A spreadsheet of their team's figures, and no right to publish a template.
    front-matter:
      needs:
        form: sentence
        hint: What the actor needs from the system, each in one sentence in their own voice. Start with the verb, or with *Never* and the verb, with *I* and *my* where they refer to themselves.
        example: Export my report as a file.

  use-case:
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# UC-007 — Export the report as a file"
      - id: goal
        type: label
        text: Goal
        form: sentence
        hint: What the actor wants from this use case, in one sentence in their own voice. Start with the verb, or with *Never* and the verb, with *I* and *my* where they refer to themselves.
        example: Export my report as a file.
      - id: other-actors
        type: label
        text: Other actors
        allows-none: true
        hint: Each other actor who takes part, and what this use case must protect for them. Write `None.` when there is none.
        example: "**Auditor** (`ACT-auditor`): each export is logged with who made it."
      - id: preconditions
        type: label
        text: Preconditions
        allows-none: true
        hint: What the system, or an earlier use case, has already made true before the use case starts. Each is a state, not an event, and no step checks it. Write `None.` when there is none.
        example: The analyst is signed in.
      - id: assumptions
        type: label
        text: Assumptions
        allows-none: true
        hint: What must also be true for the use case to work, but nothing in the system secures. Name the record that admits each. Write `None.` when there is none.
        example: The disk keeps the file as the system wrote it (DEC-003).
      - id: trigger
        type: label
        text: Trigger
        hint: The event that starts the use case, and who or what causes it.
        example: The analyst asks to export the report on screen.
      - id: main-path
        type: label
        text: Main path
        form: numbered-steps
        hint: Numbered steps from the start to the goal, each saying who does what.
        example: 1. The analyst chooses `Export`. 2. The system writes the report to a file.
      - id: variants
        type: label
        text: Variants
        allows-none: true
        form: variants
        hint: One for each condition, lettered after the step it branches from. Say what happens instead, and where the path rejoins or ends. Write `None.` when there is none.
        example: 2a. The disk is full. The system says so and writes nothing, and the use case ends.
      - id: postconditions
        type: label
        text: Postconditions
        hint: The state that shows the goal is met.
        example: The file holds the whole report.
      - id: minimal-guarantees
        type: label
        text: Minimal guarantees
        allows-none: true
        hint: What the system still guarantees when the use case ends early or fails. Name the record or code each rests on. Write `None.` when there is none.
        example: A failed export leaves no partial file (DEC-003).

  journey:
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# JRN-003 — Build and export the first report"
      - id: goal
        type: label
        text: Goal
        form: sentence
        hint: What the actor wants from the whole path, in one sentence in their own voice. Start with the verb, or with *Never* and the verb, with *I* and *my* where they refer to themselves.
        example: Build my first report and export it as a file.
      - id: steps
        type: label
        text: Steps
        form: steps-match-front-matter
        hint: "One line for each use case in `steps`, in order: its id and its title as the use case states it. Under a step, add one line for each hand-over it needs from an earlier step or from a use case outside the journey. Say what it receives and how that can break."
        example: "`3. UC-007 — Export the report as a file`, with one hand-over under it. `**Needs from step 2 (UC-005):** the report the analyst saved. A report left unsaved is not offered for export.`"
      - id: variants
        type: label
        text: Variants
        allows-none: true
        form: variants
        hint: One for each branch of the whole path, lettered after the step it leaves. Say where the path rejoins or ends. Write `None.` when there is none.
        example: 3a. The analyst wants a second report, and the path rejoins at step 2.
      - id: postconditions
        type: label
        text: Postconditions
        hint: The state that shows the whole path succeeded.
        example: The analyst holds a file with their first report.
      - id: minimal-guarantees
        type: label
        text: Minimal guarantees
        allows-none: true
        hint: What still holds when the path stops before its end. Name the record or code each rests on. Write `None.` when there is none.
        example: Stopping after any step leaves every saved report as it was (DEC-003).

  term:
    head:
      - id: file-heading
        type: heading
        level: 1
        stamp: Glossary
      - id: file-opening
        type: opening
        stamp: The words of the domain and what each means. A term's id is stable, and its name may change. The names it replaces are kept.
        form: builds-on-matches-front-matter
    sections:
      - id: heading
        type: heading
        level: 2
        example: "## TERM-template — template"
      - id: example
        type: label
        text: Example
        allows-none: true
        hint: One case of the term, in a sentence or two that use it as the analysis would. Write `None.` when the definition needs none.
        example: the analyst builds the weekly report from the template the administrator published.
      - id: distinctions
        type: label
        text: Distinctions
        allows-none: true
        hint: Each word the term could be confused with, labelled with that word, and how the two differ. Include a word the project avoids for this thing, or a working name that now means something else. Write `None.` when there is none.
        example: "**Report:** what an analyst builds from a template. A template holds no figures."
    front-matter:
      name:
        hint: The term as running text writes it, in lower case unless it is a name, and with no article.
        example: template
      definition:
        form: definition
        hint: What the term means, in a phrase of the same part of speech that could replace it. Start with its broader kind, with no article, then say what sets it apart. End with no full stop, and never repeat the term.
        example: layout an administrator publishes, from which an analyst builds a report
      replaces:
        hint: The names this term was written as before, in the analysis or in an accepted record, newest first.
        example: report template

  quality-requirement:
    shown-as: Quality
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# REQ-004 · Quality · Show a report within two seconds"
      - id: verified-by
        type: label
        text: Verified by
        allows-none: true
        hint: Each test, check or review that shows the requirement is met, named by what it does and never by its path. Anchor the file of each test or check. Write `None.` when nothing verifies it yet.
        example: A timing test opens a report of a year's figures, and fails if it takes over two seconds to show.
      - id: rationale
        type: label
        text: Rationale
        allows-none: true
        hint: Why the system must meet the requirement, and whose need it serves. Write `None.` when a record it rests on gives the reason.
        example: Analysts read reports during meetings, and a slow report holds the meeting up.
    front-matter:
      statement:
        form: sentence
        allows-none: false
        hint: How well the system must behave, in one sentence, such as how fast, how reliably or how safely. Say what the system achieves, never how it is built.
        example: The system shows a report within two seconds of the analyst opening it.
      measure:
        allows-none: true
        hint: The value or the condition that shows the requirement is met. Write `None.` when there is none yet.
        example: 95 of every 100 reports of a year's figures show within two seconds.
      applies-to:
        allows-none: false
        hint: Where the requirement holds, in words, such as a class of commands or the whole system. Name no use case or journey here, since each one that must meet it lists it.
        example: Every report an analyst opens.
      actors:
        hint: The actors whose need the requirement meets, each by id.
        example: "[ACT-analyst]"
      refines:
        hint: The requirements this one refines, of any kind, each by id.
        example: "[REQ-003]"

  functional-requirement:
    shown-as: Functional
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# REQ-002 · Functional · Count only approved figures"
      - id: verified-by
        type: label
        text: Verified by
        allows-none: true
        hint: Each test, check or review that shows the requirement is met, named by what it does and never by its path. Anchor the file of each test or check. Write `None.` when nothing verifies it yet.
        example: A test builds a report from approved and draft figures, and checks that each total leaves the drafts out.
      - id: rationale
        type: label
        text: Rationale
        allows-none: true
        hint: Why the system must meet the requirement, and whose need it serves. Write `None.` when a record it rests on gives the reason.
        example: A draft figure may still change, so a total that counts it misleads the manager who reads it.
    front-matter:
      statement:
        form: sentence
        allows-none: false
        hint: The behaviour that holds across use cases, in one sentence, such as a business rule of the domain. Behaviour that serves one actor's goal is a use case instead.
        example: Every total in a report counts approved figures only.
      measure:
        allows-none: true
        hint: The value or the condition that shows the requirement is met. Write `None.` when there is none yet.
        example: Each total equals the sum of the approved figures it covers.
      applies-to:
        allows-none: false
        hint: Where the requirement holds, in words, such as a class of commands or the whole system. Name no use case or journey here, since each one that must meet it lists it.
        example: Every total the system shows or exports.
      actors:
        hint: The actors whose need the requirement meets, each by id.
        example: "[ACT-manager]"
      refines:
        hint: The requirements this one refines, of any kind, each by id.
        example: "[REQ-005]"

  constraint:
    shown-as: Constraint
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# REQ-001 · Constraint · Keep the figures in the client's country"
      - id: verified-by
        type: label
        text: Verified by
        allows-none: true
        hint: Each test, check or review that shows the constraint is kept, named by what it does and never by its path. Anchor the file of each test or check. Write `None.` when nothing verifies it yet.
        example: A review before each release checks where every store of figures lies.
      - id: imposed-by
        type: label
        text: Imposed by
        allows-none: true
        hint: Who or what imposes the constraint, and why the design cannot choose otherwise. Write `None.` when a record it rests on says so.
        example: The client's contract forbids storing its figures abroad, and no design can change the contract.
    front-matter:
      statement:
        form: sentence
        allows-none: false
        hint: The limit on the solution, in one sentence, which the design takes as given.
        example: The system stores every figure inside the client's own country.
      measure:
        allows-none: true
        hint: The value or the condition that shows the constraint is kept. Write `None.` when there is none yet.
        example: Every store of figures, backups included, lies in a data centre in that country.
      applies-to:
        allows-none: false
        hint: Where the constraint holds, in words, such as a class of commands or the whole system. Name no use case or journey here, since each one that must meet it lists it.
        example: The whole system, its backups included.
      actors:
        hint: The actors whose need the constraint meets, each by id.
        example: "[ACT-auditor]"
      refines:
        hint: The requirements this one refines, of any kind, each by id.
        example: "[REQ-006]"

  revalidation-record:
    sections:
      - id: heading
        type: heading
        level: 1
        example: "# 2026-01-05 — Export to a chosen folder"
      - id: outcomes
        type: heading
        level: 2
        text: Outcomes
        form: outcomes-match-front-matter
        hint: One line for each artefact in `outcomes`, in its order, with the reason for its outcome. Name any evidence the reason draws on.
        example: "**UC-007 — gap-found.** The redesign lets the analyst choose the folder, and step 2 now says so. Variant 2b is new, as the gap says."
      - id: gaps
        type: heading
        level: 2
        text: Gaps
        allows-none: true
        form: gaps-match-outcomes
        hint: "Each gap, labelled with the ids of the artefacts it affects, taken from `outcomes`. Then its resolution: the defect reported, the artefact written, or the work that carries the fix. Write `None.` when there is none."
        example: "**UC-007:** a read-only folder makes the export write nothing, and no variant described it. **Resolution:** variant 2b written."
    front-matter:
      reviewed-against:
        hint: "Each source of the design reviewed: its title, its link unless it is in this repository, and its version. A version is a commit on the default branch, `this change`, or the time tracker text was read."
        example: "[{title: \"#42's body\", url: \"https://tracker.example/issues/42\", version: \"2026-01-05T10:00:00Z\"}, {title: the redesign note, version: \"4c1d2e9a7b3f5d8e0c6a2b4f9e1d3c5a7b9f0e2d\"}]"
