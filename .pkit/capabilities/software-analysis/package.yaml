schema_version: 1
component:
  kind: capability
  name: software-analysis
  version: 0.1.0
description: Software analysis — actors, use cases, journeys, glossary, domain-model views and requirements kept as anchored artefacts and kept true by revalidation as the software changes.
requires_backbone: ">=1.149.0,<2.0.0"
# The review contribution (`review-contributions.yaml`, DEC-001 point 10) names
# project-management's floor on ruled artefacts, which an older release
# refuses. So an installed project-management must have the floor, and the
# range starts at its first release with it once that release is made. A
# change cannot name a version before it is released, so the release writes
# that start, on the declaration of the changeset that adds the contribution
# (`requires_capabilities: {project-management: release}`). The fixers
# contribution (DEC-001 point 8) names a point an older release does not
# define, so its changeset declares the same, and the range starts at the
# first release with that point too. The dependency is optional, since the
# capability works without it (COR-030).
requires_capabilities:
  - name: project-management
    version: ">=0.54.0,<1.0.0"
    optional: true
aliases:
  - analysis

commands:
  new:
    script: scripts/new.py
    help: "Stamp an analysis artefact under the analysis location (DEC-001 points 1 to 3, DEC-002), its body rendered from its kind's declared structure as the project's own `project/structures.yaml` relabels it and adds to it, each part, and each front-matter field it leaves to fill (an actor's needs, a term's definition, a requirement's statement, measure and applies-to), holding its hint, a one-line `<!-- pkit:hint … -->` comment, until a person writes it: `new use-case <slug> --actor <ACT-id> [--other-actor <ACT-id>]… [--requirement <REQ-id>]… [--area <area>]`, an area's folder a word that may open with a number and a hyphen, such as `010-develop`, which is no part of the id (DEC-001 point 2), `new journey <slug> --actor <ACT-id> --step <UC-id> --step <UC-id> … [--relies-on <UC-id>]… [--requirement <REQ-id>]…`, a use case anchored to its actor and each other actor, a journey to its actor and to the use cases of its steps and its `relies-on` (point 4), and each to the requirements it lists in `requirements`, each a requirement in force (DEC-002 point 7), `new actor <slug>`, `new term <slug>`, `new quality-requirement <slug>`, `new functional-requirement <slug>` and `new constraint <slug>`, each requirement `[--actor <ACT-id>]… [--refines <REQ-id>]… [--area <area>]`, written in its kind's folder under `requirements/`, headed by its id, its kind and its title, its actors and the requirements it refines written and anchored (DEC-002 point 6) — each in force, and none the requirement itself; each takes --title or --name, and --path and --record for its anchors; an actor, term or requirement nothing embodies takes --unanchored-because instead, written as `unanchored-because` in its friction block (COR-050 point 1). A use case, journey or requirement gets the next free number on the default branch, a requirement's one numbering across the three kinds' places (DEC-002 point 2) — every number its history ever gave a file of its place included, a note naming the file when that is the number it follows — on a base named with `--base`, and in the working tree (never on $PKIT_CHECK_BASE's, COR-054 point 3), a file's number read from its name as well as its front matter; a file `friction.exclude` leaves out holds none. An id the project declares free in its numbering setting is given again (`numbering.freed-by` in the capability's settings file, project/config.yaml; the README's \"Configuration\" says how). An actor or term is `ACT-<slug>` / `TERM-<slug>`. `new revalidation <slug> --change <ref> --trigger <trigger> --outcome <id>=<outcome> … --because <id>=<why> … [--reviewed-against \"<title> @ <version> [@ <link>]\"]… [--gap \"<ids>: <gap> => <resolution>\"]… [--by <who> | --by-agent <name> --confirmed-by <who>]` writes a revalidation record, `revalidations/<date>-<slug>.md`, with no hints, only when there is something to say — a planned revalidation, one that found a regression or a gap, or one where a person decided an artefact was stale (points 5 and 6) — and refuses a text still holding a placeholder. A planned record, and only one, names each source of the design it reviewed with --reviewed-against; a commit the default branch does not hold is written with a warning that `check-pointers` will fail the change. Each gap names the artefacts it affects, and the stamp refuses gaps the form `gaps-match-outcomes` refuses. Records the analysis location on first use. Where the project lists several analyses in its settings, `analyses` (DEC-001 point 2), every form takes `--analysis <component>`, needed where it lists more than one, and writes in that analysis's folder; an actor, a use case or a requirement it names is one of that analysis, but for an actor of an analysis it builds on, named with it (`--actor core:ACT-developer`), which its glossary's head lists and a use case or a journey anchors by the records behind it (`--record`); an id another analysis holds is held for every one, and a number runs on across them all. `new view <slug> --number <digits> --explains <TERM-id>… [--title <text>] [--record <id>]…` writes a domain-model view (DEC-004), `domain-model/<number>-<slug>.md`, its id `VIEW-<slug>` and its number, in the project's own form, no part of the id: `explains` and an anchor to each term it lists, in its order, each a term in force of its own analysis that no view in force explains yet, the records it rests on and no code, and one section for each term, headed by its name; it also writes each term's link to its section under the term's heading in the glossary, `Explained in [VIEW-<slug>](domain-model/<file>#<slug of the name>).`, the two files whole or neither (point 7)."
  validate:
    script: scripts/validate.py
    help: "Check the analysis artefacts in the working tree, a file `friction.exclude` leaves out no part of them (DEC-001 points 3 and 4): a file in a place with no front matter or one that does not parse, a file under `requirements/` outside the three kinds' folders, which is in no place (DEC-002 point 3), or a backbone too old to list such files in `pkit friction artefacts`, each artefact's own fields against its companion schema, a placeholder the stamp left unfilled (one the templates or the skill's commands ever shipped, matched exactly, in an own field, the friction block's unanchored-because or the body, and a hint left in an own field or a body, outside fenced code and code spans), a use case's or journey's heading against its id and title, an actor's against its id and name and a requirement's against its id, its kind and its title (DEC-002 point 2), ids shared by two artefacts, a number spelt with other zeros and a requirement's number across its three kinds included, two terms in force of one name, a noun form counted and case ignored, or a name another term in force replaces (DEC-001 point 1), an `other-senses` phrase holding none of its term's names or one of them alone, a use case, journey or requirement whose file's name carries a number its front matter does not give, a requirement whose file's name carries no number, an actor whose file is not named after its id, an actor, other actor, step or use case relied on that the stamp would refuse, a use case's other actors naming its own actor and a journey's `relies-on` naming a step, a use case not anchored to each actor it involves or a journey not anchored to its actor, a journey whose use-case anchors do not match its steps and its `relies-on`, a requirement's `actors` or `refines` naming what the analysis does not hold, the requirement itself, or, for one in force, a withdrawn artefact, a requirement whose anchors within the analysis do not match its `actors` and `refines` (DEC-002 points 6 and 7), a use case's or journey's `requirements` naming what is no requirement of the analysis or, for one in force, a withdrawn one, and its requirement anchors that do not match the list (point 7), and the revalidation records' front matter, the artefacts they cite and the evidence they copy; reports an open regression (a record's code-regressed artefact not revalidated since), never failing on it. Each body — a glossary entry's section as the backbone spans it, the glossary's head, a record's — is checked against its kind's declared structure, `schemas/artefact-kinds.yaml` (DEC-001 point 1), as the project's own `project/structures.yaml` relabels it and, for an artefact, where the rule each group names binds (`pkit rule-sets reach`), tightens it, a tightening of the record's kind refused; a file there that its schema or the shipped structure refuses is an error, and a group whose rule is superseded or withdrawn is reported: a declared part missing, out of order or empty, `None.` where the part may not read it, and a part or a front-matter field that breaks the form its structure gives it (one sentence with no list in a part, one in each item of a front-matter list, numbered steps, lettered variants, a journey's steps and hand-overs against its front matter, a record's outcomes and gaps against its outcomes, a term's definition), though never a field still holding its hint; a label or section a writer adds is never reported, unless a rule of the project's closes the kind's list of labels, nor a line outside a list a form reads, nor a part a withdrawn artefact lacks or a form it breaks. A record's structure binds always, since no rule binds on a record, a held document. An artefact's, and a glossary's head, binds where the format rule, RS-SAN-001, binds, as `pkit rule-sets reach` reads it, and at its status: accepted, as errors; otherwise not at all, and `--preview` shows a proposed rule's findings as reports opening `preview:` where `pkit rule-sets reach --preview` says it would bind, never changing the exit. `SAN` binds only through a set of the project's own that inherits it: the summary counts the artefacts no rule of it binds on, and where it binds on none, the check reports it while no rule of `SAN` is accepted and warns once one is. --json prints the findings document `pkit validate` reads, which runs the check with no preview. Where the project lists several analyses (`analyses`, DEC-001 point 2), it also fails a file no listed analysis holds, a component or folder listed twice, an analysis building on one its component's package metadata does not declare a dependency on (the analysis of `core` the backbone's), an id two analyses share, a field naming another analysis's artefact but an actor named with an analysis it builds on that its glossary's head lists, a glossary head's `builds-on` data off its shape or naming an analysis its entry does not build on, and a term taking a name of an analysis it builds on, whether its head lists that term or not (for one the settings do not list, such as one in another repository, the names its head lists), and two analyses it builds on sharing a name; it warns where a head's links name another version than the floor its component declares; and where the format rule binds, it holds the head's text to that data (`builds-on-matches-front-matter`). A use case's `after` is held to its schema always: one list of producers per precondition, each a use case's id or `environment`, never `environment` alone. Where the rule of logical consequence, RS-SAN-009, binds and at its status (accepted, as errors; proposed, under `--preview` alone, as reports), each use case in force that writes `after` is held to the analysis, its words and its area's number (DEC-001 points 1 and 12): each producer a use case in force of its own analysis, itself among them, or `environment`; one entry for each line of *Preconditions*, each naming the producers its line opens with, such as `**From UC-003:**`; and, in an area whose name opens with a number, a producer of each precondition in no later area. A use case that writes no `after` is not read. A domain-model view (DEC-004), whatever any rule's status: its fields against its schema, its file's name, which opens with a number and a hyphen and gives its id after them, its heading against its id and title, each term `explains` lists a term of its own analysis, in force while the view is, no term explained by two views in force, its term anchors exactly `explains`, no path anchor, and each term's link to its section under its heading in the glossary, held equal to the view in force that explains it, none where no view does; in an analysis that keeps a domain model, each view section's link to its term and each mention's link to a term's entry, against what `pkit analysis link` writes, a link missing, extra or stale, naming the command; and where the format rule binds, its body against its kind's structure, one section for each term `explains` lists, in its order, headed by its name, no two headings giving one slug, each holding its *Why*, a paragraph or `None.`, its explanation below it, *Attributes*, *Relations*, *States* and *Always true*. A project with no `domain-model/` folder fails nothing. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  check-numbers:
    script: scripts/check-numbers.py
    help: "Report a use case, journey or requirement whose number the default branch took too since this branch left it, for another line of work's artefact (DEC-001 point 3): the first to reach the default branch keeps the number. A requirement's number is one numbering across its three kinds' folders, so two kinds' requirements of one number collide (DEC-002 point 2), and each numbered kind's is one across the repository's analyses (DEC-001 point 2). An artefact is known by its id, not its path, and a number by its front matter and its file's name on both sides; a number the default branch took since and removed is still taken. An id the project declares free in its numbering setting is not taken, and the ids each entry frees are listed (`numbering.freed-by`; the README's \"Configuration\" says how). A move, a requirement's to another kind's folder included, is no collision, nor is this branch's own work landed byte for byte; the default branch's file of the name this branch gives the number is a warning — possibly its own work landed: merge and keep one file, otherwise renumber — and one of another name a collision. It also compares each use case's steps and variants with the same use case, by id, where this branch left the base, and reports a step or a variant renumbered or removed: journeys and evidence cite them by number and letter, so they are append-only. One added, and a use case new in the change, pass. That check binds where the append-only rule, RS-SAN-002, binds (`pkit rule-sets reach`), and at its status: accepted, an error; otherwise not at all, and `--preview` shows a proposed rule's findings as reports opening `preview:` where `pkit rule-sets reach --preview` says it would bind, never changing the exit. `--base <ref>` names the base (else $PKIT_CHECK_BASE, else the default branch, as the backbone resolves it — COR-054); --json prints the document. Answers about a change, not the tree, so it is a check-gate line of its own and not a validator (COR-055 point 2). Exit 1 on a collision, on a step or variant renumbered or removed where the append-only rule is accepted, on a numbering-setting entry it cannot honour, or when the base names no commit or shares no history with HEAD; an outdated base is reported and never fails. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  check-pointers:
    script: scripts/check-pointers.py
    help: "Place on the default branch each commit a planned revalidation record names in `reviewed-against` (DEC-001 point 6): each source without a `url`, whose `version` is a commit's full id; `this change` is not placed. A commit is held when the default branch's history reaches it, not held when it does not and the clone holds all of that history — a commit missing from a full clone included — and unknown when a shallow clone's history of the branch stops short. Fails on a commit the default branch does not hold in a record the change adds, naming the record and the source: a squash merge leaves a branch's commits off it. The same in a record the merge-base holds is reported and never fails, since a record is never rewritten; an unknown is reported and never fails. The commits are placed on the default branch alone, as the backbone resolves it (COR-054 point 5); the base says only which records the change adds — those whose file the merge-base of `--base <ref>`, else $PKIT_CHECK_BASE, else the default branch, does not hold at its path, the working tree read with its uncommitted changes. It asks no remote: a partial clone that lacks the merge-base's tree fails rather than fetch it. A tree with no planned record, or none naming a commit, reads no base and says so; no default branch resolved, or a base that names no commit or shares no history with HEAD, fails, saying why. --json prints the document, each source placed under `pointers` with its record, whether the change adds it, its title, its commit and `held`, `not-held` or `unknown`. Answers about a change and reads history, so it is a check-gate line of its own and not a validator (COR-055 points 1 and 2). A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  link:
    script: scripts/link.py
    help: "Write the links between the terms and the views of each analysis that keeps a domain model, one whose `domain-model/` folder holds a view (DEC-004 point 7): each section of a view in force opens with `Defined in [<TERM-id>](<glossary>#<anchor>).`, its term's entry, and the first mention of each term in each section links to that entry, in a view's opening and its sections and in each glossary entry below its heading. A term's definition, in front matter, and the glossary's head take no link. The entry's anchor is the slug of its heading, `<id> — <name>`, and a link's target is a path from the file's folder, or the anchor alone in the glossary. The terms are those in force of the analysis, and those its glossary's head lists from an analysis the repository holds; a name two of them share is linked to neither. A mention is a term's name or one of its declared `noun-forms`, whole, its first letter in either case; of overlapping mentions the first and then the longest is taken, so `payment method` wins over `payment`; a term is linked once in each section, and never in its own section or entry. Skipped: fenced code and code spans, headings, bold labels, comments, links, HTML and bare URLs. A phrase a term lists in `other-senses` never links that term, and `<!-- pkit:not-the-term -->` right before a mention marks it as no mention. A link to a glossary entry written by hand is rewritten as the command's. It writes a file only where a link changes, whole or not at all, with the file's own line ends; mixed line ends are refused. `pkit analysis validate` holds the links, whatever any rule's status, and names this command."
  met-by:
    script: scripts/met-by.py
    help: "List what meets each requirement (DEC-002 point 7): `met-by [<REQ-id>] [--json]` gives each requirement the analysis holds, or the one named, with the use cases and journeys in force that list it in their `requirements`, computed from the working tree each time and never stored on the requirement. A withdrawn requirement is listed with its status, and a withdrawn use case or journey meets nothing. Complete or no answer: exit 1 when a file of the use cases, the journeys or the requirements cannot be read as its kind, gives no id of its kind's shape, or gives a `requirements` that is no list, or when the requirement named is not in the analysis. --json prints the document, each requirement with its id, kind, the kind as its heading shows it (`shown_as`), title, status, path and `met_by`. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  diagram:
    script: scripts/diagram.py
    help: "Print the analysis's diagrams as Mermaid, drawn from its front matter (DEC-003): `diagram [<subject>] [--json]`, the subject `use-cases`, `journeys`, `requirements`, `chain`, a journey's id or a requirement's id, and every diagram the analysis has something for without one. The use-case diagram draws the system's boundary, the use cases in force inside it and the actors in force around it, an arrow from each use case's `actor` and a line from each of its `other-actors`, and is drawn only where a use case is in force. A journey's flow draws its actor, then its `steps` in order, and its `relies-on` as a group of its own with no arrow. The requirement map draws each requirement in force, the use cases and journeys that list it in `requirements`, the requirements it `refines` and its `actors`. Each diagram opens with its `accTitle` and `accDescr`, and holds no styling. A withdrawn artefact draws nothing, and nor does a reference to one the analysis does not hold in force, save a journey's step, drawn by its id alone. The chain of use cases (DEC-003 point 5) draws the use cases in force grouped by area, the areas in the order of their numbers, and an arrow from each producer each one's `after` names, the environment one node: dotted from a producer in a later area, and a solid one that other solid arrows imply through a third node left out, the use cases of a loop of solid arrows counting as one node. It is drawn where a use case in force writes `after`. Each diagram draws one analysis: where the project lists several, `--analysis <component>` names it, and an actor of another analysis, such as `core:ACT-developer`, is drawn among the actors by that id alone (DEC-003 point 6). Computed from the working tree each time, and never stored. Complete or no answer: exit 1 when a file of a place a diagram reads cannot be read as its kind, gives no id of its kind's shape or a list it reads that is no list of ids, or, for the chain, an `after` that is no list of lists of ids, or when the subject names no diagram, or no journey or requirement in force. Each diagram is printed in a `mermaid` fence. --json prints the document, each diagram with its id, title, description and `mermaid` text. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  propose:
    script: scripts/propose.py
    help: "Say what a flagged artefact's evidence decides (DEC-001 point 5), for the resolving agent: `propose <artefact> [--contradicted <quote> --contradicted-from <source>] [--intended <quote> --intended-from <source>] [--unintended <quote> --unintended-from <source>] [--json]`. Reads `pkit friction explain`, what the artefact quotes from its anchored code at its revalidation point and at HEAD, and where lost code moved. A proposal (holds when the code moved, analysis-stale, code-regressed) with the rule and evidence behind it; read, when nothing mechanical decides, with the outcome the evidence leans to; or ambiguous — the artefact and the code disagree and nothing says whether the change was meant — with the question for a person. A quote from a commit is checked against its message. For an outcome it gives the writer commands a person runs, word for word, never running them. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  fill-readers:
    script: scripts/fill-readers.py
    help: "This capability's filler of the pkit::documentation:readers point (DEC-001 point 8): one reader per actor in force, its id the actor's id in lower case (`ACT-tester` → `act-tester`) and its description the actor's name and needs, its own and then those each analysis whose glossary's head lists it states beside it, an actor such a head lists that no analysis here holds a reader by the head's name and needs; --json prints the filler envelope the backbone reads. A query: read-only, offline, no parameter; `pkit sync` provisions its dependencies."
    query-contract: true
  fill-use-cases:
    script: scripts/fill-use-cases.py
    help: "This capability's filler of the pkit::work-tracking:use-cases point (DEC-001 point 8): the use cases settled on the default branch, one entry per use case — its id as the analysis writes it, its title, `active` or `withdrawn` (a withdrawn use case is kept), and the path of its document. Reads the default branch at the commit the backbone resolves it to, never the working tree; the empty list where that branch has no commit yet. Complete or no answer: exit 1 with nothing on standard output when a reading fails or a use case there cannot be read in full. --json prints the filler envelope the backbone reads. A query: read-only, offline, no parameter; `pkit sync` provisions its dependencies."
    query-contract: true
    reads: [settled]

# The `software-analysis:artefacts` member of `pkit validate`: a component
# joins validation by naming a command it registers (COR-055 point 3); the
# block's keys are ADR-058's. The number comparison reads a base, and the
# check of a planned record's pointers reads history beyond the working tree,
# so each is a command of its own and not a validator (COR-055 point 2).
validators:
  artefacts:
    command: validate

# COR-049 point 4 — where the analysis lives, relative to the internal root.
docs:
  locations:
    analysis:
      path: analysis
      description: The analysis (DEC-001 point 2) — the glossary, the domain model, the use-case model, the requirements and the revalidation records, or one such analysis per component, each in a folder of its own; recorded the first time an artefact is stamped (COR-049 point 5), so a later change of root moves nothing.

# COR-050 point 1 — the places holding this capability's anchored artefacts,
# and its folder of held documents: the revalidation records describe an act
# and are not anchored artefacts, so their folder is not a place but held — no
# other component's place reads them as artefacts (DEC-001 point 2). No
# surface: the project declares the code its analysis ought to cover. Each
# place, and the records' folder, is declared at the location's top and one
# folder down, where a project keeps one analysis per component, each in a
# folder named after it (DEC-001 point 2): the places match both layouts.
# The records' glob folder wins over the places that reach into it.
#
# COR-056 point 2 — the type registry, one type per kind of anchored artefact,
# and the type each place gives (DEC-001 point 2; DEC-002 point 3 for the three
# kinds of requirement, each in a folder of its own under `requirements`, which
# is no place; DEC-004 point 4 for the domain model's views, in `domain-model`). No type names a kind field: the check holds every file in a
# place to that place's kind. None admits a project place (no
# `project-places`): the capability checks only the artefacts in its own
# places. The held records take no type.
#
# COR-050 point 16 — each kind of requirement's place declares the core's
# signal (DEC-002 point 4): a change to its statement, measure or applies-to
# asks for a revisit of every anchor but those its actors and refines list,
# which the check holds equal to its anchors within the analysis (point 6).
friction:
  types:
    actor:
      description: An actor — a named role that uses the system, with the needs it brings (DEC-001 point 1).
    use-case:
      description: A use case — one actor's goal and how the system fulfils it (DEC-001 point 1).
    journey:
      description: A journey — one actor's end-to-end path across several of its use cases (DEC-001 point 1).
    term:
      description: A glossary term — a domain word, with a stable id apart from its name, and its definition (DEC-001 point 1).
    domain-model-view:
      description: A domain-model view — a group of related concepts, each explained in a section of its own and drawn as they relate (DEC-004).
    quality-requirement:
      description: A quality requirement — how well the system must behave, such as how fast, how reliably or how safely (DEC-002 point 1).
    functional-requirement:
      description: A functional requirement — behaviour that holds across use cases, such as a business rule (DEC-002 point 1).
    constraint:
      description: A constraint — a limit on the solution, which the design takes as given (DEC-002 point 1).
  places:
    - location: analysis
      path: glossary.md
      type: term
      description: The glossary, one entry per term.
    - location: analysis
      path: domain-model
      type: domain-model-view
      description: The domain model, one file per view of a group of related concepts.
    - location: analysis
      path: use-case-model/actors
      type: actor
      description: The actors, one file each.
    - location: analysis
      path: use-case-model/use-cases
      type: use-case
      description: The use cases, one file each, in folders by functional area when the project groups them.
    - location: analysis
      path: use-case-model/journeys
      type: journey
      description: The journeys, one file each.
    - location: analysis
      path: requirements/quality
      type: quality-requirement
      description: The quality requirements, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: requirements/functional
      type: functional-requirement
      description: The functional requirements, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: requirements/constraints
      type: constraint
      description: The constraints, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    # One analysis per component (DEC-001 point 2): where a project lists several, each
    # lies in a folder named after its component, with the layout above. The same eight
    # places, one folder down, give the same types.
    - location: analysis
      path: "*/glossary.md"
      type: term
      description: The glossary of each analysis kept in a component's folder.
    - location: analysis
      path: "*/domain-model/**"
      type: domain-model-view
      description: The domain-model views of each analysis kept in a component's folder.
    - location: analysis
      path: "*/use-case-model/actors/**"
      type: actor
      description: The actors of each analysis kept in a component's folder.
    - location: analysis
      path: "*/use-case-model/use-cases/**"
      type: use-case
      description: The use cases of each analysis kept in a component's folder.
    - location: analysis
      path: "*/use-case-model/journeys/**"
      type: journey
      description: The journeys of each analysis kept in a component's folder.
    - location: analysis
      path: "*/requirements/quality/**"
      type: quality-requirement
      description: The quality requirements of each analysis kept in a component's folder.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: "*/requirements/functional/**"
      type: functional-requirement
      description: The functional requirements of each analysis kept in a component's folder.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: "*/requirements/constraints/**"
      type: constraint
      description: The constraints of each analysis kept in a component's folder.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
  held:
    - location: analysis
      path: revalidations
      description: The revalidation records, one file each — the record of an act, not an anchored artefact.
    - location: analysis
      path: "*/revalidations"
      description: The revalidation records of each analysis kept in a component's folder.

# COR-017 — the one project rule set this capability declares. SAN takes no
# scope, so its rules bind only through a set of the project's own that
# inherits it (COR-051 point 7). Installing the capability creates this set,
# where no set of the project's own inherits SAN, directly or not, pinned at
# SAN's major then. A migration creates it for an earlier install (DEC-001,
# Implications). Its scope selects the analysis by this capability's types,
# wherever the analysis lies, and so never a revalidation record.
project_rule_set:
  name: ANALYSIS
  inherits: SAN
  scope:
    types: [software-analysis:actor, software-analysis:term, software-analysis:domain-model-view, software-analysis:use-case, software-analysis:journey, software-analysis:quality-requirement, software-analysis:functional-requirement, software-analysis:constraint]
  title: The project's rules for its analysis

# COR-053 — the analysis role, the evidence point defined under it, and the
# contributions to the documentation role's readers point and the
# work-tracking role's use-case point (DEC-001 points 7 and 8). See the
# README, "Connections".
connections:
  roles: [pkit::analysis]
  extension-points:
    accepts:
      pkit::analysis:revalidation-evidence:
        schema_version: 1
        schema: revalidation-evidence.schema.json
        description: >-
          Executed results that confirm or refute an analysis artefact at a
          commit — a test run against a use case, a trace through a journey —
          one entry per result, keyed by the artefact, the commit and the
          check, the name its filler gives one executed check, opening with
          the filler's own name. Supplied by a capability that runs such checks, or by
          the project; this capability runs none. Advisory: a revalidation
          record copies the entries it draws on as support for an artefact's
          outcome and never in place of one, so a filler that cannot answer is
          warned and the rest still count.
        combination: union
        inert: fallback
  extensions:
    contributes:
      # The actors in force as readers of the documentation, read from the
      # analysis in the working tree. Inert while no capability provides the
      # documentation role.
      - point: pkit::documentation:readers
        schema_version: 1
        command: fill-readers
        description: One reader per actor in force, its id the actor's id in lower case and its description the actor's name and needs.
      # The use cases settled on the default branch, read at its commit and
      # never from the working tree. Inert while no capability provides the
      # work-tracking role.
      - point: pkit::work-tracking:use-cases
        schema_version: 1
        command: fill-use-cases
        description: Every use case the default branch holds, withdrawn ones included, each with its id, title, status and document path — complete, or no answer.
      # The analysis-resolver as the fixer of each of this capability's types
      # (DEC-001 points 5 and 8): where the project grants it, the role's
      # provider may start it on the default branch's stale analysis
      # artefacts, and it only proposes. A static value, so it reads here and
      # resolving it runs nothing. Each description says what the agent keeps
      # true (project-management DEC-056 point 1). Inert while no capability
      # provides the work-tracking role.
      - point: pkit::work-tracking:fixers
        schema_version: 1
        description: The analysis-resolver fixes the analysis's artefacts of every type.
        value:
          - id: software-analysis:actor
            agent: analysis-resolver
            description: your actors
          - id: software-analysis:use-case
            agent: analysis-resolver
            description: your use cases
          - id: software-analysis:journey
            agent: analysis-resolver
            description: your journeys
          - id: software-analysis:term
            agent: analysis-resolver
            description: your glossary terms
          - id: software-analysis:domain-model-view
            agent: analysis-resolver
            description: your domain-model views
          - id: software-analysis:quality-requirement
            agent: analysis-resolver
            description: your quality requirements
          - id: software-analysis:functional-requirement
            agent: analysis-resolver
            description: your functional requirements
          - id: software-analysis:constraint
            agent: analysis-resolver
            description: your constraints
