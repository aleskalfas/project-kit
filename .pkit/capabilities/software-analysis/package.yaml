schema_version: 1
component:
  kind: capability
  name: software-analysis
  version: 0.1.0
description: Software analysis — actors, use cases, journeys, glossary and requirements kept as anchored artefacts and kept true by revalidation as the software changes.
requires_backbone: ">=1.149.0,<2.0.0"
# The review contribution (`review-contributions.yaml`, DEC-001 point 10) names
# project-management's floor on ruled artefacts, which an older release
# refuses. So an installed project-management must have the floor, and the
# range starts at its first release with it once that release is made. A
# change cannot name a version before it is released, so the release writes
# that start, on the declaration of the changeset that adds the contribution
# (`requires_capabilities: {project-management: release}`). The dependency is
# optional, since the capability works without it (COR-030).
requires_capabilities:
  - name: project-management
    version: ">=0.54.0,<1.0.0"
    optional: true
aliases:
  - analysis

commands:
  new:
    script: scripts/new.py
    help: "Stamp an analysis artefact under the analysis location (DEC-001 points 1 to 3, DEC-002), its body rendered from its kind's declared structure as the project's own `project/structures.yaml` relabels it and adds to it, each part, and each front-matter field it leaves to fill (an actor's needs, a term's definition, a requirement's statement, measure and applies-to), holding its hint, a one-line `<!-- pkit:hint … -->` comment, until a person writes it: `new use-case <slug> --actor <ACT-id> [--other-actor <ACT-id>]… [--area <area>]`, `new journey <slug> --actor <ACT-id> --step <UC-id> --step <UC-id> … [--relies-on <UC-id>]…`, a use case anchored to its actor and each other actor, a journey to its actor and to the use cases of its steps and its `relies-on` (point 4), `new actor <slug>`, `new term <slug>`, `new quality-requirement <slug>`, `new functional-requirement <slug>` and `new constraint <slug>`, each requirement `[--actor <ACT-id>]… [--refines <REQ-id>]… [--area <area>]`, written in its kind's folder under `requirements/`, headed by its id, its kind and its title, its actors and the requirements it refines written and anchored (DEC-002 point 6) — each in force, and none the requirement itself; each takes --title or --name, and --path and --record for its anchors; an actor, term or requirement nothing embodies takes --unanchored-because instead, written as `unanchored-because` in its friction block (COR-050 point 1). A use case, journey or requirement gets the next free number on the default branch, a requirement's one numbering across the three kinds' places (DEC-002 point 2) — every number its history ever gave a file of its place included, a note naming the file when that is the number it follows — on a base named with `--base`, and in the working tree (never on $PKIT_CHECK_BASE's, COR-054 point 3), a file's number read from its name as well as its front matter; a file `friction.exclude` leaves out holds none. An id the project declares free in its numbering setting is given again (`numbering.freed-by` in the capability's settings file, project/config.yaml; the README's \"Configuration\" says how). An actor or term is `ACT-<slug>` / `TERM-<slug>`. `new revalidation <slug> --change <ref> --trigger <trigger> --outcome <id>=<outcome> … --because <id>=<why> … [--reviewed-against \"<title> @ <version> [@ <link>]\"]… [--gap \"<ids>: <gap> => <resolution>\"]… [--by <who> | --by-agent <name> --confirmed-by <who>]` writes a revalidation record, `revalidations/<date>-<slug>.md`, with no hints, only when there is something to say — a planned revalidation, one that found a regression or a gap, or one where a person decided an artefact was stale (points 5 and 6) — and refuses a text still holding a placeholder. A planned record, and only one, names each source of the design it reviewed with --reviewed-against; a commit the default branch does not hold is written with a warning that `check-pointers` will fail the change. Each gap names the artefacts it affects, and the stamp refuses gaps the form `gaps-match-outcomes` refuses. Records the analysis location on first use."
  validate:
    script: scripts/validate.py
    help: "Check the analysis artefacts in the working tree, a file `friction.exclude` leaves out no part of them (DEC-001 points 3 and 4): a file in a place with no front matter or one that does not parse, each artefact's own fields against its companion schema, a placeholder the stamp left unfilled (one the templates or the skill's commands ever shipped, matched exactly, in an own field, the friction block's unanchored-because or the body, and a hint left in an own field or a body, outside fenced code and code spans), a use case's or journey's heading against its id and title, an actor's against its id and name and a requirement's against its id, its kind and its title (DEC-002 point 2), ids shared by two artefacts, a number spelt with other zeros and a requirement's number across its three kinds included, a use case, journey or requirement whose file's name carries a number its front matter does not give, a requirement whose file's name carries no number, an actor whose file is not named after its id, an actor, other actor, step or use case relied on that the stamp would refuse, a use case's other actors naming its own actor and a journey's `relies-on` naming a step, a use case not anchored to each actor it involves or a journey not anchored to its actor, a journey whose use-case anchors do not match its steps and its `relies-on`, a requirement's `actors` or `refines` naming what the analysis does not hold, the requirement itself, or, for one in force, a withdrawn artefact, a requirement whose anchors within the analysis do not match its `actors` and `refines` (DEC-002 points 6 and 7), and the revalidation records' front matter, the artefacts they cite and the evidence they copy; reports an open regression (a record's code-regressed artefact not revalidated since), never failing on it. Each body — a glossary entry's section as the backbone spans it, the glossary's head, a record's — is checked against its kind's declared structure, `schemas/artefact-kinds.yaml` (DEC-001 point 1), as the project's own `project/structures.yaml` relabels it and, for an artefact, where the rule each group names binds (`pkit rule-sets reach`), tightens it, a tightening of the record's kind refused; a file there that its schema or the shipped structure refuses is an error, and a group whose rule is superseded or withdrawn is reported: a declared part missing, out of order or empty, `None.` where the part may not read it, and a part or a front-matter field that breaks the form its structure gives it (one sentence with no list in a part, one in each item of a front-matter list, numbered steps, lettered variants, a journey's steps and hand-overs against its front matter, a record's outcomes and gaps against its outcomes, a term's definition), though never a field still holding its hint; a label or section a writer adds is never reported, unless a rule of the project's closes the kind's list of labels, nor a line outside a list a form reads, nor a part a withdrawn artefact lacks or a form it breaks. A record's structure binds always, since no rule binds on a record, a held document. An artefact's, and a glossary's head, binds where the format rule, RS-SAN-001, binds, as `pkit rule-sets reach` reads it, and at its status: accepted, as errors; otherwise not at all, and `--preview` shows a proposed rule's findings as reports opening `preview:` where `pkit rule-sets reach --preview` says it would bind, never changing the exit. `SAN` binds only through a set of the project's own that inherits it: the summary counts the artefacts no rule of it binds on, and where it binds on none, the check reports it while no rule of `SAN` is accepted and warns once one is. --json prints the findings document `pkit validate` reads, which runs the check with no preview. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  check-numbers:
    script: scripts/check-numbers.py
    help: "Report a use case, journey or requirement whose number the default branch took too since this branch left it, for another line of work's artefact (DEC-001 point 3): the first to reach the default branch keeps the number. A requirement's number is one numbering across its three kinds' folders, so two kinds' requirements of one number collide (DEC-002 point 2). An artefact is known by its id, not its path, and a number by its front matter and its file's name on both sides; a number the default branch took since and removed is still taken. An id the project declares free in its numbering setting is not taken, and the ids each entry frees are listed (`numbering.freed-by`; the README's \"Configuration\" says how). A move, a requirement's to another kind's folder included, is no collision, nor is this branch's own work landed byte for byte; the default branch's file of the name this branch gives the number is a warning — possibly its own work landed: merge and keep one file, otherwise renumber — and one of another name a collision. It also compares each use case's steps and variants with the same use case, by id, where this branch left the base, and reports a step or a variant renumbered or removed: journeys and evidence cite them by number and letter, so they are append-only. One added, and a use case new in the change, pass. That check binds where the append-only rule, RS-SAN-002, binds (`pkit rule-sets reach`), and at its status: accepted, an error; otherwise not at all, and `--preview` shows a proposed rule's findings as reports opening `preview:` where `pkit rule-sets reach --preview` says it would bind, never changing the exit. `--base <ref>` names the base (else $PKIT_CHECK_BASE, else the default branch, as the backbone resolves it — COR-054); --json prints the document. Answers about a change, not the tree, so it is a check-gate line of its own and not a validator (COR-055 point 2). Exit 1 on a collision, on a step or variant renumbered or removed where the append-only rule is accepted, on a numbering-setting entry it cannot honour, or when the base names no commit or shares no history with HEAD; an outdated base is reported and never fails. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  check-pointers:
    script: scripts/check-pointers.py
    help: "Place on the default branch each commit a planned revalidation record names in `reviewed-against` (DEC-001 point 6): each source without a `url`, whose `version` is a commit's full id; `this change` is not placed. A commit is held when the default branch's history reaches it, not held when it does not and the clone holds all of that history — a commit missing from a full clone included — and unknown when a shallow clone's history of the branch stops short. Fails on a commit the default branch does not hold in a record the change adds, naming the record and the source: a squash merge leaves a branch's commits off it. The same in a record the merge-base holds is reported and never fails, since a record is never rewritten; an unknown is reported and never fails. The commits are placed on the default branch alone, as the backbone resolves it (COR-054 point 5); the base says only which records the change adds — those whose file the merge-base of `--base <ref>`, else $PKIT_CHECK_BASE, else the default branch, does not hold at its path, the working tree read with its uncommitted changes. It asks no remote: a partial clone that lacks the merge-base's tree fails rather than fetch it. A tree with no planned record, or none naming a commit, reads no base and says so; no default branch resolved, or a base that names no commit or shares no history with HEAD, fails, saying why. --json prints the document, each source placed under `pointers` with its record, whether the change adds it, its title, its commit and `held`, `not-held` or `unknown`. Answers about a change and reads history, so it is a check-gate line of its own and not a validator (COR-055 points 1 and 2). A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  propose:
    script: scripts/propose.py
    help: "Say what a flagged artefact's evidence decides (DEC-001 point 5), for the resolving agent: `propose <artefact> [--contradicted <quote> --contradicted-from <source>] [--intended <quote> --intended-from <source>] [--unintended <quote> --unintended-from <source>] [--json]`. Reads `pkit friction explain`, what the artefact quotes from its anchored code at its revalidation point and at HEAD, and where lost code moved. A proposal (holds when the code moved, analysis-stale, code-regressed) with the rule and evidence behind it; read, when nothing mechanical decides, with the outcome the evidence leans to; or ambiguous — the artefact and the code disagree and nothing says whether the change was meant — with the question for a person. A quote from a commit is checked against its message. For an outcome it gives the writer commands a person runs, word for word, never running them. A query: read-only, offline; `pkit sync` provisions its dependencies."
    query-contract: true
  fill-readers:
    script: scripts/fill-readers.py
    help: "This capability's filler of the pkit::documentation:readers point (DEC-001 point 8): one reader per actor in force, its id the actor's id in lower case (`ACT-tester` → `act-tester`) and its description the actor's name and needs; --json prints the filler envelope the backbone reads. A query: read-only, offline, no parameter; `pkit sync` provisions its dependencies."
    query-contract: true
  fill-use-cases:
    script: scripts/fill-use-cases.py
    help: "This capability's filler of the pkit::work-tracking:use-cases point (DEC-001 point 8): the use cases settled on the default branch, one entry per use case — its id as the analysis writes it, its title, `active` or `withdrawn` (a withdrawn use case is kept), and the path of its document. Reads the default branch at the commit the backbone resolves it to, never the working tree; the empty list where that branch has no commit yet. Complete or no answer: exit 1 with nothing on standard output when a reading fails or a use case there cannot be read in full. --json prints the filler envelope the backbone reads. A query: read-only, offline, no parameter; `pkit sync` provisions its dependencies."
    query-contract: true
    reads: [settled]

# The `software-analysis:artefacts` member of `pkit validate`: a component
# joins validation by naming a command it registers (COR-055 point 3); the
# block's keys are ADR-058's. The number comparison reads a base, and the
# check of a planned record's pointers reads history beyond the working tree,
# so each is a command of its own and not a validator (COR-055 point 2).
validators:
  artefacts:
    command: validate

# COR-049 point 4 — where the analysis lives, relative to the internal root.
docs:
  locations:
    analysis:
      path: analysis
      description: The analysis (DEC-001 point 2) — the glossary, the use-case model, the requirements and the revalidation records; recorded the first time an artefact is stamped (COR-049 point 5), so a later change of root moves nothing.

# COR-050 point 1 — the places holding this capability's anchored artefacts,
# and its folder of held documents: the revalidation records describe an act
# and are not anchored artefacts, so their folder is not a place but held — no
# other component's place reads them as artefacts (DEC-001 point 2). No
# surface: the project declares the code its analysis ought to cover.
#
# COR-056 point 2 — the type registry, one type per kind of anchored artefact,
# and the type each place gives (DEC-001 point 2; DEC-002 point 3 for the three
# kinds of requirement, each in a folder of its own under `requirements`, which
# is no place). No type names a kind field: the check holds every file in a
# place to that place's kind. None admits a project place (no
# `project-places`): the capability checks only the artefacts in its own
# places. The held records take no type.
#
# COR-050 point 16 — each kind of requirement's place declares the core's
# signal (DEC-002 point 4): a change to its statement, measure or applies-to
# asks for a revisit of every anchor but those its actors and refines list,
# which the check holds equal to its anchors within the analysis (point 6).
friction:
  types:
    actor:
      description: An actor — a named role that uses the system, with the needs it brings (DEC-001 point 1).
    use-case:
      description: A use case — one actor's goal and how the system fulfils it (DEC-001 point 1).
    journey:
      description: A journey — one actor's end-to-end path across several of its use cases (DEC-001 point 1).
    term:
      description: A glossary term — a domain word, with a stable id apart from its name, and its definition (DEC-001 point 1).
    quality-requirement:
      description: A quality requirement — how well the system must behave, such as how fast, how reliably or how safely (DEC-002 point 1).
    functional-requirement:
      description: A functional requirement — behaviour that holds across use cases, such as a business rule (DEC-002 point 1).
    constraint:
      description: A constraint — a limit on the solution, which the design takes as given (DEC-002 point 1).
  places:
    - location: analysis
      path: glossary.md
      type: term
      description: The glossary, one entry per term.
    - location: analysis
      path: use-case-model/actors
      type: actor
      description: The actors, one file each.
    - location: analysis
      path: use-case-model/use-cases
      type: use-case
      description: The use cases, one file each, in folders by functional area when the project groups them.
    - location: analysis
      path: use-case-model/journeys
      type: journey
      description: The journeys, one file each.
    - location: analysis
      path: requirements/quality
      type: quality-requirement
      description: The quality requirements, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: requirements/functional
      type: functional-requirement
      description: The functional requirements, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
    - location: analysis
      path: requirements/constraints
      type: constraint
      description: The constraints, one file each, in folders by functional area when the project groups them.
      revisits:
        - all-but: [actors, refines]
          when: [statement, measure, applies-to]
          description: A changed obligation asks for a revisit of every anchor outside the analysis, the records, views, tests and code it names. The anchors its actors and refines list stay out (DEC-002 point 4).
  held:
    - location: analysis
      path: revalidations
      description: The revalidation records, one file each — the record of an act, not an anchored artefact.

# COR-017 — the one project rule set this capability declares. SAN takes no
# scope, so its rules bind only through a set of the project's own that
# inherits it (COR-051 point 7). Installing the capability creates this set,
# where no set of the project's own inherits SAN, directly or not, pinned at
# SAN's major then. A migration creates it for an earlier install (DEC-001,
# Implications). Its scope selects the analysis by this capability's types,
# wherever the analysis lies, and so never a revalidation record.
project_rule_set:
  name: ANALYSIS
  inherits: SAN
  scope:
    types: [software-analysis:actor, software-analysis:term, software-analysis:use-case, software-analysis:journey, software-analysis:quality-requirement, software-analysis:functional-requirement, software-analysis:constraint]
  title: The project's rules for its analysis

# COR-053 — the analysis role, the evidence point defined under it, and the
# contributions to the documentation role's readers point and the
# work-tracking role's use-case point (DEC-001 points 7 and 8). See the
# README, "Connections".
connections:
  roles: [pkit::analysis]
  extension-points:
    accepts:
      pkit::analysis:revalidation-evidence:
        schema_version: 1
        schema: revalidation-evidence.schema.json
        description: >-
          Executed results that confirm or refute an analysis artefact at a
          commit — a test run against a use case, a trace through a journey —
          one entry per result, keyed by the artefact, the commit and the
          check, the name its filler gives one executed check, opening with
          the filler's own name. Supplied by a capability that runs such checks, or by
          the project; this capability runs none. Advisory: a revalidation
          record copies the entries it draws on as support for an artefact's
          outcome and never in place of one, so a filler that cannot answer is
          warned and the rest still count.
        combination: union
        inert: fallback
  extensions:
    contributes:
      # The actors in force as readers of the documentation, read from the
      # analysis in the working tree. Inert while no capability provides the
      # documentation role.
      - point: pkit::documentation:readers
        schema_version: 1
        command: fill-readers
        description: One reader per actor in force, its id the actor's id in lower case and its description the actor's name and needs.
      # The use cases settled on the default branch, read at its commit and
      # never from the working tree. Inert while no capability provides the
      # work-tracking role.
      - point: pkit::work-tracking:use-cases
        schema_version: 1
        command: fill-use-cases
        description: Every use case the default branch holds, withdrawn ones included, each with its id, title, status and document path — complete, or no answer.
