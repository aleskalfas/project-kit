# project-kit's software-analysis settings. Project-owned.
# Shape: ../schemas/config.schema.json.

pkit_schema: software-analysis:config
schema_version: 1

# The analyses project-kit keeps, one for each component that keeps one
# (software-analysis DEC-001 point 2; RS-ANA-004 in ANA,
# tech-docs/rule-sets/analysis.md). The core's, and one for each capability.
# Each capability's builds on the analyses of the components its package.yaml
# depends on, required or optional.
analyses:
  - component: core
    folder: core
    # The record that states what project-kit is for (software-analysis
    # DEC-003 point 8).
    purpose: PRJ-011
    # Each area's goal, in the order the areas build on each other
    # (software-analysis DEC-003 point 8; RS-ANA-005 in ANA).
    areas:
      010-develop: "Develop the methodology in its own source repository, and extend it with capabilities, adapters, and a project's own skills and agent definitions."
      020-set-up: "Set up a project once, so its people and AI agents work with the same backbone configuration, capabilities, rules and limits."
      030-change: "Record a project's decisions and rules, and check, answer and land each change to it, so what the project states stays true as it changes."
      040-release: "Release the backbone and each component on its own version, so projects can move to it and pin it."
      050-adopt: "Take the system into another project, keep it current, and report what goes wrong with it."
  - component: project-management
    folder: project-management
    # The record that states what project-management is for (software-analysis
    # DEC-003 point 8).
    purpose: project-management:DEC-057
    builds-on:
      - analysis: core
  - component: evidence
    folder: evidence
    builds-on:
      - analysis: core
  - component: demo-recording
    folder: demo-recording
    builds-on:
      - analysis: core
  - component: software-engineering
    folder: software-engineering
    builds-on:
      - analysis: core
      - analysis: project-management
  - component: software-analysis
    folder: software-analysis
    builds-on:
      - analysis: core
      - analysis: project-management
        optional: true
  - component: living-docs
    folder: living-docs
    builds-on:
      - analysis: core
      - analysis: project-management
        optional: true

numbering:
  # Ids declared free again. An entry may list only ids that nothing cites
  # (software-analysis DEC-001 point 3; the capability's README,
  # "Configuration", says what cites an id). The first entry: the pilot
  # analysis of the multi-clone coordination work, ten use cases and two
  # journeys, removed before the full analysis of pkit began, so that analysis
  # numbers from UC-001 and JRN-001.
  freed-by:
    - commit: "6107ae77e537ff669bf54c566d0be6cf636b4b1e"
      ids: [UC-001, UC-002, UC-003, UC-004, UC-005, UC-006, UC-007, UC-008, UC-009, UC-010, JRN-001, JRN-002]
