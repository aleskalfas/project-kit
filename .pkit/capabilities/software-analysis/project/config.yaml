# project-kit's software-analysis settings. Project-owned.
# Shape: ../schemas/config.schema.json.

pkit_schema: software-analysis:config
schema_version: 1

# The analyses project-kit keeps, one for each component that keeps one
# (software-analysis DEC-001 point 2; RS-ANA-004 in ANA,
# tech-docs/rule-sets/analysis.md). The core's, and one for each capability.
# Each capability's builds on the analyses of the components its package.yaml
# depends on, required or optional.
analyses:
  - component: core
    folder: core
    # The record that states what project-kit is for (software-analysis
    # DEC-003 point 8).
    purpose: PRJ-011
    # Each area's goal, in the order the areas build on each other
    # (software-analysis DEC-003 point 8; RS-ANA-005 in ANA).
    areas:
      010-develop: "Develop the methodology in its own source repository, and extend it with capabilities, adapters, and a project's own skills and agent definitions."
      020-set-up: "Set up a project once, so its people and AI agents work with the same backbone configuration, capabilities, rules and limits."
      030-change: "Record a project's decisions and rules, and check, answer and land each change to it, so what the project states stays true as it changes."
      040-release: "Release the backbone and each component on its own version, so projects can move to it and pin it."
      050-adopt: "Put the system on a machine and into another project, run each project at the version it pins and keep it current, and report what goes wrong with it, each report linked to its fix."
  - component: project-management
    folder: project-management
    # The record that states what project-management is for (software-analysis
    # DEC-003 point 8).
    purpose: project-management:DEC-057
    # Each area's goal, in the order the areas build on each other
    # (software-analysis DEC-003 point 8).
    areas:
      010-plan: "Define the Milestones and workstreams a project's work falls into, and plan each intent into an EPIC and the work under it."
      020-file-and-move: "File each Task under its parent, and move each issue through its lifecycle, each filing and each move checked."
      030-review-and-land: "Have each pull request reviewed by the reviewers its change requires, and land it once the merge authoriser authorises its head."
      040-work-in-parallel: "Run several AI agents on one project at once, each on its own scope and never on another's issue, and see and measure their work."
    builds-on:
      - analysis: core
  - component: evidence
    folder: evidence
    builds-on:
      - analysis: core
  - component: demo-recording
    folder: demo-recording
    builds-on:
      - analysis: core
  - component: software-engineering
    folder: software-engineering
    # The record that states what software-engineering is for
    # (software-analysis DEC-003 point 8).
    purpose: software-engineering:DEC-003
    builds-on:
      - analysis: core
      - analysis: project-management
  - component: software-analysis
    folder: software-analysis
    # The record that states what software-analysis is for (software-analysis
    # DEC-003 point 8).
    purpose: software-analysis:DEC-001
    builds-on:
      - analysis: core
      - analysis: project-management
        optional: true
  - component: living-docs
    folder: living-docs
    # The record that states what living-docs is for (software-analysis DEC-003
    # point 8).
    purpose: living-docs:DEC-001
    builds-on:
      - analysis: core
      - analysis: project-management
        optional: true
  - component: visual-communication
    folder: visual-communication
    # The record that states what visual-communication is for
    # (software-analysis DEC-003 point 8).
    purpose: visual-communication:DEC-001
    # Each area's goal, in the order the areas build on each other
    # (software-analysis DEC-003 point 8).
    areas:
      010-make: "Make each piece, such as a deck or a figure in a documentation page, from library components and content of its own, so nothing made once is made again."
      020-build-libraries: "Build the libraries pieces are made from, and carry their look into code, so all share one look and take each improvement only on purpose."
      030-draw-and-hand-out: "Draw a piece in each brand, mode, language and renderer it needs, hand it out as files, and take back what people change where it is drawn."
      040-draw-for-capabilities: "Draw what another capability shows in the look of the project's libraries, with what they do not cover drawn the capability's own way."
    builds-on:
      - analysis: core

numbering:
  # Ids declared free again. An entry may list only ids that nothing cites
  # (software-analysis DEC-001 point 3; the capability's README,
  # "Configuration", says what cites an id). The first entry: the pilot
  # analysis of the multi-clone coordination work, ten use cases and two
  # journeys, removed before the full analysis of pkit began, so that analysis
  # numbers from UC-001 and JRN-001.
  freed-by:
    - commit: "6107ae77e537ff669bf54c566d0be6cf636b4b1e"
      ids: [UC-001, UC-002, UC-003, UC-004, UC-005, UC-006, UC-007, UC-008, UC-009, UC-010, JRN-001, JRN-002]
