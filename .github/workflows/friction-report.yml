name: friction-report

# The whole-repository friction check (COR-050 point 6; ADR-055 point 5), where
# a person reads it (#1266). The change check guards a pull request; friction no
# pull request touches — an anchor changed outside its artefact's own change,
# debt older than the gate — is found only here. Every artefact is judged
# against the current history: stale debt and deferrals with their origins, the
# other findings, unanchored artefacts and uncovered surface.
#
# It reports and never fails on what it finds (COR-050 point 12): `pkit friction
# check --all` exits 0 whatever it finds, and so do the renderer and the
# publisher. The run fails only when the check could not run, its findings
# could not be published, or there is more than one tracking issue, and its log
# says which. It is no required status.
#
# The findings go to one tracking issue, kept by `scripts/friction_tracking_issue.py`
# from the body `scripts/friction_report_body.py` renders: rewritten in place
# when the findings change, open exactly while a finding needs an answer, never
# a comment per run. One tracking issue; a second is a failed run that names
# both. The run's step summary carries the same body.

on:
  push:
    branches: [main]
  schedule:
    # Daily, 05:41 UTC. The check is a function of `main`'s history, so this run
    # finds nothing a push did not; it repeats a publication that failed and
    # restores an issue changed by hand.
    - cron: "41 5 * * *"
  workflow_dispatch: {}

# Read the repository; keep the one issue. No secret beyond the built-in token.
permissions:
  contents: read
  issues: write

# One run at a time, so that two cannot each find no issue and open one. The run
# in progress is never cancelled; a newly queued run replaces one still pending
# in the group, and the newest is the one whose findings matter.
concurrency:
  group: friction-report
  cancel-in-progress: false

jobs:
  friction-report:
    # Always on what `main` holds (ADR-055 point 5): a run dispatched by hand
    # from another branch publishes nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # The token stays out of the clone's configuration: only the publishing
      # step is handed it.
      - name: Checkout (full history, back to every revalidation point)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Each artefact's file is walked back to its revalidation point; a shallow
      # clone would report the points beyond it as unreachable instead of
      # judging them. Stop here rather than publish that.
      - name: Confirm the full history
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The clone is shallow; the whole-repository friction check needs the full history (fetch-depth: 0)."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # As `checks.yml` does before its aggregator: provisions every registered
      # query command's environment, so a resolver a capability registers for
      # an anchor kind runs here as it does in the required check, and no
      # anchor is published as unresolved for want of it.
      - name: Sync (provisions the query commands)
        run: uv run pkit sync

      - name: Whole-repository friction check (reports, never fails)
        run: uv run pkit friction check --all --json > "$RUNNER_TEMP/friction.json"

      # The body and the count of findings that need an answer, rendered from
      # the document above; the body also goes to the run's step summary.
      - name: Render the findings
        run: |
          uv run python scripts/friction_report_body.py "$RUNNER_TEMP/friction.json" --json > "$RUNNER_TEMP/friction-report.json"
          uv run python scripts/friction_report_body.py "$RUNNER_TEMP/friction.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish to the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/friction_tracking_issue.py "$RUNNER_TEMP/friction-report.json"
