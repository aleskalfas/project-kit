name: release-pr

# Opens a reviewable release PR from the pending changesets — the automated
# form of the manual sequence in .pkit/release/README.md (apply → commit →
# open the PR). NEVER auto-merges: a human reviews the version bumps + the
# generated changelog and merges. Post-merge tagging is release-tag.yml.
#
# Started by hand only (workflow_dispatch): a release is cut when the
# maintainer starts it. A no-op when nothing moves a version.
#
# Started with the input "pre-release", the run cuts a release candidate from
# the head of the branch it is started on instead (ADR-092 point 2), in the job
# `pre-release`: it opens no pull request and merges nothing. Started without
# it, the run is the ordinary release run, job `release-pr`, which refuses on
# any branch but the default branch (ADR-092 point 5).
#
# Either run starts in the job `start`, which first refuses an ordinary run off
# the default branch, then finishes the notes an earlier run left unpublished: a
# tag on origin, of a release or a candidate, with no GitHub Release. Where that
# fails, it says so and goes on (ADR-089 point 9; ADR-092 point 5).
#
# The run's checks are an interlock against a mistake, not a defence: a run on
# a branch runs that branch's workflow and the pkit it runs (ADR-092 point 10).
# Neither job forces a push or deletes a tag.

on:
  workflow_dispatch:
    inputs:
      pre-release:
        description: >-
          Cut a release candidate from the head of the branch this run starts
          on, which has taken in the default branch's head (ADR-092 point 2).
        type: boolean
        default: false

# One group keeps two runs apart, whichever job each runs (ADR-089 point 9).
concurrency:
  group: release
  cancel-in-progress: false

# Minimal scope: push the release branch or the candidate's tag, and publish
# notes (contents), and open the PR (pull-requests). No merge permission — a
# human merges the PR.
permissions:
  contents: write
  pull-requests: write

# Token note: the default GITHUB_TOKEN opens the PR but, by GitHub's
# loop-prevention rule, a PR it opens does NOT trigger `on: pull_request`
# workflows — so checks.yml would not auto-run on the release PR. Provide a
# repo/environment secret RELEASE_PAT (a PAT or fine-grained token with
# contents+pull-requests write) to have the PR trigger checks; without it the
# workflow still works, but a maintainer must kick the PR's checks (re-run /
# empty commit) — and checks.yml runs on push to main after the merge anyway.
env:
  GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}

jobs:
  # Every run starts here. Without the input it refuses on any branch but the
  # default branch, before anything else. Then it finishes the notes an earlier
  # run left unpublished, whichever job that run ran.
  start:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history and tags, so every tag's notes can be read)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # Without the input, the run is the ordinary release run, and a final
      # release is planned from the default branch's head alone (ADR-092 points
      # 1 and 5). The default branch is the one the project declares (COR-054).
      - name: Refuse on any branch but the default branch
        if: ${{ !inputs.pre-release }}
        run: |
          set -euo pipefail
          default="$(uv run pkit repository base --json | jq -r '.default_branch.name')"
          if [ "${GITHUB_REF}" != "refs/heads/${default}" ]; then
            echo "::error::Started without the input pre-release on ${GITHUB_REF}: the ordinary release run is started on ${default} alone (ADR-092 point 5). Start it there, or start it here with pre-release to cut a candidate."
            exit 1
          fi

      # A tag on origin with no GitHub Release lacks its notes: a run that pushed
      # it stopped before publishing them. Finish them first, oldest first; where
      # one fails, say so and go on (ADR-092 point 5). A final release's notes
      # are read from the changelog here, a candidate's at its tag.
      - name: Finish the notes an earlier run left unpublished
        run: |
          set -uo pipefail
          tags="${RUNNER_TEMP}/tags.txt"
          releases="${RUNNER_TEMP}/releases.txt"
          if ! git ls-remote --tags origin > "${tags}" \
             || ! gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name' > "${releases}"; then
            echo "::warning::The tags and Releases on origin could not be read, so notes an earlier run left unpublished stay so. This run goes on."
            exit 0
          fi
          if ! versions="$(uv run python scripts/release_pr.py unpublished --tags "${tags}" --releases "${releases}")"; then
            echo "::warning::The tags without notes could not be found. This run goes on."
            exit 0
          fi
          for version in ${versions}; do
            if ! uv run pkit release publish-notes "${version}"; then
              echo "::warning::The notes of v${version} could not be published. This run goes on, and the next run tries again."
            fi
          done

  release-pr:
    needs: start
    if: ${{ !inputs.pre-release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the release computes from main's state)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # Compute the release BEFORE applying (apply consumes the changesets), so
      # the branch name, PR title, and PR body can use it. `empty` is true when
      # no changeset moves a version — the clean no-op case (also true when only
      # `none` changesets are pending; they are swept up by the next real
      # release rather than warranting a version-less PR).
      - name: Compute the release plan
        id: plan
        run: |
          plan="$(uv run pkit release plan --json)"
          printf '%s' "$plan" > "${RUNNER_TEMP}/release-plan.json"
          {
            echo "empty=$(printf '%s' "$plan" | jq -r '.empty')"
            echo "version=$(printf '%s' "$plan" | jq -r '.backbone_version // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: No-op when nothing to release
        if: steps.plan.outputs.empty == 'true'
        run: echo "No pending changesets move a version — nothing to release."

      # The way on (ADR-092 point 6). A release PR (any head under release/)
      # whose body's trailer line names main's head, the commit this run plans
      # from, is the one a human reviews: the run opens no second. Every other
      # one was planned from an older head, or names none, so `pkit release
      # merge` refuses it: the run closes it, deletes its branch, and opens one
      # planned from this head (scripts/release_pr.py).
      - name: Replace a release PR planned from an older head
        id: existing
        if: steps.plan.outputs.empty != 'true'
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          prs="${RUNNER_TEMP}/open-prs.json"
          gh pr list --state open --json number,headRefName,body > "${prs}"
          found="$(uv run python scripts/release_pr.py open --prs "${prs}" --head "${head}")"
          current="$(printf '%s\n' "${found}" | sed -n 's/^current=//p')"
          stale="$(printf '%s\n' "${found}" | sed -n 's/^stale=//p')"
          for number in ${stale}; do
            gh pr close "${number}" --delete-branch --comment "Replaced by a release planned from ${head}, the head of main: this one was planned from an older head, so \`pkit release merge\` refuses it (ADR-092 point 6)."
          done
          count=0
          for number in ${current}; do count=$((count + 1)); done
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" != "0" ]; then
            echo "A release PR planned from ${head} is already open — skipping."
          fi

      # The release branch, from the computed backbone version: release/v<version>,
      # or release/<run id> for a component-only release with no backbone move.
      # Where origin already holds release/v<version> — a run that failed after
      # its push left it, with no PR open from it, as the step above found — the
      # branch is release/v<version>-<run id>, so the push does not fail on it.
      # `pkit release merge` takes any head under release/ (scripts/release_pr.py).
      - name: Derive the release branch name
        id: branch
        if: steps.plan.outputs.empty != 'true' && steps.existing.outputs.count == '0'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          name="$(uv run python scripts/release_pr.py branch --version "${VERSION}" --run-id "${RUN_ID}")"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Apply the release and open the PR
        if: steps.plan.outputs.empty != 'true' && steps.existing.outputs.count == '0'
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          branch="${{ steps.branch.outputs.name }}"
          version="${{ steps.plan.outputs.version }}"
          plan="${RUNNER_TEMP}/release-plan.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"

          # Write versions + CHANGELOG and consume the changesets. No tag here:
          # the tag points at the MERGED release commit and is cut post-merge by
          # release-tag.yml (PRJ-004 / .pkit/release/README.md). `apply` prints
          # the trailer line naming the commit its plan read, which the release
          # commit and the PR's body carry (ADR-092 point 6).
          applied="${RUNNER_TEMP}/apply.txt"
          uv run pkit release apply --yes | tee "${applied}"
          trailer="$(uv run python scripts/release_pr.py trailer --apply-output "${applied}")"

          # PR body, built before the push, so a body that cannot be built leaves
          # no branch behind: the computed bumps, each with the requires_backbone
          # floor, the requires_capabilities floors and the upper bounds on
          # capabilities a changeset declared for it (the lines `pkit release
          # plan` prints), any migration-dir prediction warnings (#465), and the
          # freshly generated changelog entry (the top block of CHANGELOG.md) for
          # review, then the trailer line. Where that entry would take the body
          # past the 65,536 characters GitHub keeps in a PR's description, a link
          # to CHANGELOG.md on the release branch takes its place, and the bumps,
          # the warnings and the trailer line stay whole (scripts/release_pr.py).
          # A range on a capability that excludes a dependency's version never
          # reaches here: the plan step refuses it (PRJ-002 D4).
          body="${RUNNER_TEMP}/pr-body.md"
          uv run python scripts/release_pr.py body --plan "${plan}" --branch "${branch}" --repository-url "${REPOSITORY_URL}" --trailer "${trailer}" > "${body}"

          title="chore(release): v${version:-$(date -u +%Y-%m-%d)}"
          git add -A
          git commit -m "${title}" -m "${trailer}"
          git push --set-upstream origin "${branch}"

          gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}"

  # The pre-release run (ADR-092 point 2; ADR-089 point 9): a candidate cut from
  # the head of the branch it is started on, which `pkit release apply --pre`
  # refuses where that head has not taken in the default branch's head. It
  # commits the candidate on no branch and tags it there; the tag is pushed
  # alone, and only once the wheel built from its commit is checked. It reads no
  # label, so a branch whose pull request passes by `skip-changeset` is cut only
  # once it carries a `none` changeset.
  pre-release:
    needs: start
    if: ${{ inputs.pre-release }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history and tags, so the cut reads the default branch's head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # No candidate carries a surface change no changeset moves (ADR-092 point 2).
      - name: Check the branch's changesets against the default branch
        run: |
          set -euo pipefail
          default="$(uv run pkit repository base --json | jq -r '.default_branch.name')"
          uv run pkit release check --base "${default}"

      # Plans from this commit, refusing where the default branch's head on origin
      # is not in its history; numbers the cut across every candidate tag on
      # origin; records its base; commits on no branch and tags that commit.
      - name: Cut the candidate
        id: cut
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run pkit release apply --pre --tag --yes
          echo "version=$(cat .pkit/VERSION)" >> "$GITHUB_OUTPUT"

      # From the candidate's commit, before its tag fixes its content for good: the
      # wheel builds, and the pkit it installs names the candidate's version. Run
      # outside the checkout, so the pkit is the wheel's and routes nowhere.
      - name: Build the wheel and check its version
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: |
          set -euo pipefail
          dist="${RUNNER_TEMP}/dist"
          venv="${RUNNER_TEMP}/wheel-check"
          uv build --wheel --out-dir "${dist}"
          uv venv "${venv}"
          uv pip install --python "${venv}/bin/python" "${dist}"/*.whl
          said="$(cd "${RUNNER_TEMP}" && PKIT_NO_ROUTE=1 "${venv}/bin/pkit" --version)"
          if [ "${said}" != "pkit, version ${VERSION}" ]; then
            echo "::error::The wheel built from the candidate's commit says '${said}', not 'pkit, version ${VERSION}'. The tag is not pushed."
            exit 1
          fi

      # The tag alone, never forced: git refuses a push that would move a tag
      # origin holds (ADR-092 point 10).
      - name: Push the candidate's tag
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: git push origin "refs/tags/v${VERSION}"

      # A pre-release Release, its notes read at the tag. Where this fails, the
      # next run finishes them.
      - name: Publish the candidate's notes
        env:
          VERSION: ${{ steps.cut.outputs.version }}
        run: uv run pkit release publish-notes "${VERSION}"
