name: release-pr

# Opens a reviewable release PR from the pending changesets — the automated
# form of the manual sequence in .pkit/release/README.md (apply → commit →
# open the PR). NEVER auto-merges: a human reviews the version bumps + the
# generated changelog and merges. Post-merge tagging is release-tag.yml.
#
# Started by hand only (workflow_dispatch): a release is cut when the
# maintainer starts it. A no-op when nothing moves a version.

on:
  workflow_dispatch: {}

# Minimal scope: push the release branch (contents) and open the PR
# (pull-requests). No merge permission — a human merges the PR.
permissions:
  contents: write
  pull-requests: write

# Token note: the default GITHUB_TOKEN opens the PR but, by GitHub's
# loop-prevention rule, a PR it opens does NOT trigger `on: pull_request`
# workflows — so checks.yml would not auto-run on the release PR. Provide a
# repo/environment secret RELEASE_PAT (a PAT or fine-grained token with
# contents+pull-requests write) to have the PR trigger checks; without it the
# workflow still works, but a maintainer must kick the PR's checks (re-run /
# empty commit) — and checks.yml runs on push to main after the merge anyway.
env:
  GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the release computes from main's state)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # Compute the release BEFORE applying (apply consumes the changesets), so
      # the branch name, PR title, and PR body can use it. `empty` is true when
      # no changeset moves a version — the clean no-op case (also true when only
      # `none` changesets are pending; they are swept up by the next real
      # release rather than warranting a version-less PR).
      - name: Compute the release plan
        id: plan
        run: |
          plan="$(uv run pkit release plan --json)"
          printf '%s' "$plan" > "${RUNNER_TEMP}/release-plan.json"
          {
            echo "empty=$(printf '%s' "$plan" | jq -r '.empty')"
            echo "version=$(printf '%s' "$plan" | jq -r '.backbone_version // ""')"
          } >> "$GITHUB_OUTPUT"

      - name: No-op when nothing to release
        if: steps.plan.outputs.empty == 'true'
        run: echo "No pending changesets move a version — nothing to release."

      # The way on (ADR-092 point 6). A release PR (any head under release/)
      # whose body's trailer line names main's head, the commit this run plans
      # from, is the one a human reviews: the run opens no second. Every other
      # one was planned from an older head, or names none, so `pkit release
      # merge` refuses it: the run closes it, deletes its branch, and opens one
      # planned from this head (scripts/release_pr.py).
      - name: Replace a release PR planned from an older head
        id: existing
        if: steps.plan.outputs.empty != 'true'
        run: |
          set -euo pipefail
          head="$(git rev-parse HEAD)"
          prs="${RUNNER_TEMP}/open-prs.json"
          gh pr list --state open --json number,headRefName,body > "${prs}"
          found="$(uv run python scripts/release_pr.py open --prs "${prs}" --head "${head}")"
          current="$(printf '%s\n' "${found}" | sed -n 's/^current=//p')"
          stale="$(printf '%s\n' "${found}" | sed -n 's/^stale=//p')"
          for number in ${stale}; do
            gh pr close "${number}" --delete-branch --comment "Replaced by a release planned from ${head}, the head of main: this one was planned from an older head, so \`pkit release merge\` refuses it (ADR-092 point 6)."
          done
          count=0
          for number in ${current}; do count=$((count + 1)); done
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          if [ "${count}" != "0" ]; then
            echo "A release PR planned from ${head} is already open — skipping."
          fi

      # The release branch, from the computed backbone version: release/v<version>,
      # or release/<run id> for a component-only release with no backbone move.
      # Where origin already holds release/v<version> — a run that failed after
      # its push left it, with no PR open from it, as the step above found — the
      # branch is release/v<version>-<run id>, so the push does not fail on it.
      # `pkit release merge` takes any head under release/ (scripts/release_pr.py).
      - name: Derive the release branch name
        id: branch
        if: steps.plan.outputs.empty != 'true' && steps.existing.outputs.count == '0'
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          name="$(uv run python scripts/release_pr.py branch --version "${VERSION}" --run-id "${RUN_ID}")"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Apply the release and open the PR
        if: steps.plan.outputs.empty != 'true' && steps.existing.outputs.count == '0'
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          branch="${{ steps.branch.outputs.name }}"
          version="${{ steps.plan.outputs.version }}"
          plan="${RUNNER_TEMP}/release-plan.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"

          # Write versions + CHANGELOG and consume the changesets. No tag here:
          # the tag points at the MERGED release commit and is cut post-merge by
          # release-tag.yml (PRJ-004 / .pkit/release/README.md). `apply` prints
          # the trailer line naming the commit its plan read, which the release
          # commit and the PR's body carry (ADR-092 point 6).
          applied="${RUNNER_TEMP}/apply.txt"
          uv run pkit release apply --yes | tee "${applied}"
          trailer="$(uv run python scripts/release_pr.py trailer --apply-output "${applied}")"

          # PR body, built before the push, so a body that cannot be built leaves
          # no branch behind: the computed bumps, each with the requires_backbone
          # floor, the requires_capabilities floors and the upper bounds on
          # capabilities a changeset declared for it (the lines `pkit release
          # plan` prints), any migration-dir prediction warnings (#465), and the
          # freshly generated changelog entry (the top block of CHANGELOG.md) for
          # review, then the trailer line. Where that entry would take the body
          # past the 65,536 characters GitHub keeps in a PR's description, a link
          # to CHANGELOG.md on the release branch takes its place, and the bumps,
          # the warnings and the trailer line stay whole (scripts/release_pr.py).
          # A range on a capability that excludes a dependency's version never
          # reaches here: the plan step refuses it (PRJ-002 D4).
          body="${RUNNER_TEMP}/pr-body.md"
          uv run python scripts/release_pr.py body --plan "${plan}" --branch "${branch}" --repository-url "${REPOSITORY_URL}" --trailer "${trailer}" > "${body}"

          title="chore(release): v${version:-$(date -u +%Y-%m-%d)}"
          git add -A
          git commit -m "${title}" -m "${trailer}"
          git push --set-upstream origin "${branch}"

          gh pr create --base main --head "${branch}" --title "${title}" --body-file "${body}"
