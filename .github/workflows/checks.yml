name: checks

# The unbypassable backstop + Linux / clean-env / post-merge coverage that a
# local pre-push hook structurally can't give. Runs the SAME aggregator the
# pre-push hook runs (scripts/check.sh) — one source of truth, no drift.
# Replaces the former migrations-check + schemas-validate workflows (both are
# now steps inside the aggregator).

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` so the changeset guard's `skip-changeset` escape
    # hatch actually re-runs the check when the label is added/removed.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # The merge queue (#1011; ADR-055 point 5): when `main` merges through a
  # queue, `checks` — the status `main` requires — runs on the merge the queue
  # is about to make, so the friction and migration results that gate it are
  # computed against the true base, not the one the pull request last saw.
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the migration-diff base ref resolves)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      # Self-host sync: re-runs the deploy primitives and provisions every
      # registered query command's environment into uv's cache, once, online —
      # `pkit validate` in the aggregator runs those commands offline, so a
      # fresh runner needs them provisioned first (#1092). `uv run pkit` routes
      # to this checkout's own dispatcher.
      - name: Sync (provisions the query commands)
        run: uv run pkit sync

      - name: Run the check aggregator
        env:
          # PR: diff against the PR base. Merge queue: against the commit the
          # queued merge is built on (`merge_group.base_sha` — `main`, or the
          # merge queued ahead of this one), so the diff is this pull request's
          # alone and the base is never outdated. Push to main: against main
          # (no-op diff).
          PKIT_CHECK_BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.event.pull_request.base.ref || 'main') }}
        run: ./scripts/check.sh

      # Changeset guard (PRJ-002). PR-scoped: it needs the PR base ref and the
      # PR labels (the `skip-changeset` escape hatch), neither of which a local
      # pre-push hook has — so it lives here, not in scripts/check.sh. Two
      # checks: a surface change carries a changeset of its own (one the PR
      # adds or edits; another PR's pending changeset does not count), and a
      # requires_backbone floor the PR declares rides on a change to its
      # component or a release of it. Escape hatches for the surface check: a `none` changeset for the
      # component, or the `skip-changeset` label (surfaced below as
      # PKIT_CHANGESET_SKIP).
      #
      # Release PRs (from release-pr.yml) need no hatch: the guard recognises a
      # diff that is only what `pkit release apply` writes — versions, the
      # self-host manifest's backbone_version, CHANGELOG, the changesets it
      # consumed — by its content, whatever the branch is called, and passes
      # its surface check. The floor tie runs on every PR; a release diff only
      # deletes changesets, so it declares no floor.
      #
      # It does not run on the queue's merge: a merge group carries no pull
      # request labels to read the escape hatch from, and the guard has already
      # judged the pull request's diff, which the queued merge does not change.
      - name: Changeset guard (surface change ⇒ changeset; floor ⇒ its component)
        if: github.event_name == 'pull_request'
        env:
          PKIT_CHANGESET_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'skip-changeset') && '1' || '' }}
        run: uv run pkit release check --base "origin/${{ github.event.pull_request.base.ref }}"

  # The whole-repository friction check (COR-050 point 6; ADR-055 point 5) on
  # every push to main: every artefact against the current history, stale and
  # deferred debt with their origins, unanchored artefacts and uncovered
  # surface. It reports and never fails the push — `pkit friction check --all`
  # exits 0 by construction — so stale debt that slipped past the change check
  # through an outdated base shows up here rather than blocking anything. It
  # needs the full history: each artefact's file is walked back to its
  # revalidation point, and a shallow clone would report the points beyond it
  # as unreachable instead of judging them. Read it in this job's log, or in
  # the step summary on the run's page.
  friction-report:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, back to every revalidation point)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install project (clean resolve)
        run: uv sync

      - name: Whole-repository friction check (reports, never fails)
        run: |
          uv run pkit friction check --all | tee friction-report.txt
          { echo '```'; cat friction-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
