[build-system]
# `pathspec` is imported directly by `hatch_build.py` to apply the sdist's
# `withhold` globs. Hatchling depends on it today, but that is hatchling's
# business; a direct import is a direct dependency. The hatchling floor is the
# version the tracked-state hook and the SPDX `license` / `license-files` form
# below were verified against (#930).
requires = ["hatchling>=1.32.4", "pathspec"]
build-backend = "hatchling.build"

[project]
name = "project-kit"
description = "Methodology framework for AI-assisted software projects"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [{ name = "Ales Kalfas", email = "kalfas.ales@gmail.com" }]
license = "MIT"
# Declared, not left to hatchling's default globs (`LICEN[CS]E*`, `COPYING*`,
# ...): those match whatever sits at the root, so an untracked `LICENSE.orig`
# shipped in the sdist and in the wheel's `.dist-info/licenses/` (#930).
license-files = ["LICENSE"]
dependencies = [
    "click>=8.1",
    "ruamel.yaml>=0.18",
    "packaging>=24.0",
    "jsonschema>=4.20",
]

# The console script routes before importing the heavy CLI (ADR-039): it picks
# a source-checkout / pinned-version / run-self route cheaply, then hands off.
[project.scripts]
pkit = "project_kit.router:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # The floor the ruff settings below need (`per-file-target-version`); the
    # lock pins the exact version the gate formats and lints with.
    "ruff>=0.15",
    # The `nodejs` extra puts the Node runtime pyright runs on into the lock, so
    # syncing installs it and no run downloads one or needs it on the host's
    # path (PRJ-010 point 7). The lock pins the version the gate checks with.
    "pyright[nodejs]>=1.1.380",
    "pathspec>=0.12",  # used by check-doc-mapping.py (PM script); needed to import it under pytest
    "pytest-xdist>=3.8.0",  # scripts/check.sh runs the suite in parallel workers (#1182)
]

[tool.hatch.version]
path = ".pkit/VERSION"
pattern = "^(?P<version>[0-9]+\\.[0-9]+\\.[0-9]+)$"

[tool.hatch.build.targets.sdist]
# EVERYTHING is excluded from the sdist's own walk and force-included by
# `hatch_build.py` instead, from TRACKED files (#909 for `.pkit/`, #930 for the
# rest). Hatchling's walk takes every file the root `.gitignore` does not match,
# so an untracked file in a local checkout shipped in the sdist — and, since
# `uv build` builds the wheel FROM the sdist, in the wheel too. The walk cannot
# be narrowed to tracked files (its options are static; the tracked set is not),
# so it is switched off: `*` excludes every path, and `skip-excluded-dirs` stops
# it descending into `.git` or a `.venv` only to discard what it finds. Do not
# "restore" a narrower exclude here — whatever the walk takes, it takes
# untracked. Hatchling still adds its own defaults (`pyproject.toml`, this
# hook, the README, the declared `license-files`, `.gitignore`) and `PKG-INFO`.
exclude = ["*"]
skip-excluded-dirs = true

# What the hook withholds from the sdist's `.pkit/`. These are gitignore-style
# globs applied with the same `pathspec` engine hatchling uses for `exclude`,
# so the sdist keeps a filter of its own — globs, where the wheel calls the
# ownership predicate — for `tests/test_packaging_boundary.py`'s cross-artifact
# check. Globs by CHOICE: the hook could call the predicate for the sdist too,
# and deliberately does not, so do not "simplify" this away. The two targets
# are independent in filter, shared in enumeration — across the whole artifact,
# not only `.pkit/`: both list every file through the hook's `git ls-files`
# path. So the cross-artifact check cannot see an enumeration defect; the
# external checks against `git ls-files` are `test_sdist_is_the_tracked_tree`,
# `test_wheel_package_is_the_tracked_package` and
# `test_untracked_file_ships_in_no_artifact`.
#
# Without this the sdist carried project-kit's own project-side state including
# 36 git-ignored journals, so it had the same non-reproducibility as the wheel:
# its contents depended on the build machine's untracked files.
# Rule-shaped rather than enumerated: any `project/` directory anywhere under
# `.pkit/` is the adopter tier, at every depth — which is the same positional
# rule `ownership.is_adopter_owned_by_tier` applies. The wheel asks that
# predicate directly; the sdist deliberately does not, so this mirrors the rule
# as globs.
#
# That covers the `project/` globs only. EVERY OTHER LINE BELOW IS A HAND-COPY
# of a specific case in `.pkit/lifecycle/ownership.py`, and hand-copies drift —
# which is this whole change's thesis. The mapping:
#   `.pkit/rules/project.md`      <- the `rules/project.md` case
#   `.pkit/scratchpad/{active,done,dropped}` <- `_SCRATCHPAD_STATE_DIRS`
#   `.pkit/manifest.yaml`, `.pkit/.gitignore` <- `_ADOPTER_OWNED_KIT_FILES`
# Widening any of those in that module requires a matching line here, or the
# sdist ships what the wheel withholds. `_ADOPTER_OWNED_KIT_FILES`' remaining
# entry, `version-pin`, needs no line today only because no `.pkit/version-pin`
# is tracked — so the sdist test passes vacuously on it.
[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"
withhold = [
  ".pkit/**/project",
  ".pkit/project",
  ".pkit/rules/project.md",
  ".pkit/scratchpad/active",
  ".pkit/scratchpad/done",
  ".pkit/scratchpad/dropped",
  # Install state and generated files. The wheel's comment already calls these
  # "adopter- or maintainer-owned, never shipped"; the sdist had been shipping
  # them regardless.
  ".pkit/manifest.yaml",
  ".pkit/.gitignore",
]

[tool.hatch.build.targets.wheel]
# The package is named here, which keeps hatchling's own package detection off,
# and then EXCLUDED from hatchling's walk: `hatch_build.py` force-includes it
# file by file from TRACKED files (#930), since the walk shipped whatever it
# found — an untracked `.py` included, as importable code. With the walk empty,
# build caches are kept out by the hook, which applies its own exclusions to
# every force-include. (NB: hatchling's `exclude` does not filter force-included
# paths — force-include is the higher-priority mechanism — so it can only prune
# what the walk picks up. That is exactly why the filtering lives in
# `hatch_build.py`; missing that once shipped 87 `.pyc` files.)
#
# One stale per-capability `manifest.yaml` still travels — project-kit's own
# self-host install-state receipt, functionally inert since a capability install
# overwrites it with a freshly-stamped one. It is not withheld because
# `is_adopter_owned_by_tier` is a TIER rule and that file is install *state*
# sitting in a kit-owned directory, so the predicate cannot see it. ADR-033 does
# not pursue a single declaration of the kit-owned tree shared by build and
# propagator (its COR-007 follow-on implication), so removing this file needs a
# plan of its own rather than a pointer to that record.
packages = ["src/project_kit"]
exclude = ["/src/project_kit"]
# The editable wheel exposes `src/` through a `.pth` rather than shipping the
# package. Named explicitly because hatchling's default finds the directory to
# expose by walking the package — which the `exclude` above now empties.
dev-mode-dirs = ["src"]

# Bundle the methodology content into the wheel as package data under
# `project_kit/_kit/` (ADR-033), plus capability source (a distribution medium
# per ADR-033 §3) and migrations.
#
# WHAT DEFINES THE SET, since this changed (#813): the bundle is everything
# under `hatch_build.py`'s `FILTERED_TREES` plus the static entries below,
# whose CONTENT is not adopter-owned by tier, as
# `.pkit/lifecycle/ownership.py`'s `is_adopter_owned_by_tier` decides — plus the
# empty directory markers described below. It is
# deliberately NOT the sync-propagation surface. ADR-033 D1 originally defined
# it that way, reasoning the wheel could then never drift from what sync
# copies; but sync-management additionally depends on capability registration
# and treats everything outside `.pkit/` as unmanaged, so it cannot answer
# "may this be distributed?" — and defining the bundle by it is what let this
# project's own `project/` state ship to every adopter (#811).
#
# The two answers therefore CAN differ — `src/` ships and is not under `.pkit/`
# at all, so the sync predicate reads it as not-its while the bundle carries it.
# They no longer differ on any tracked adopter-tier path: the one that did,
# `.pkit/adapters/claude-code/settings/project/settings.json`, was a bug in the
# sync predicate rather than in the bundle, and is fixed (#823). Do not "fix" a
# future disagreement by reverting this rule — check which side is wrong.
#
# `tests/test_packaging_boundary.py` asserts the built artifacts against the
# predicate, and the wheel against the sdist, so the manifest cannot drift from
# the rule again.
#
# Excluded by construction (adopter- or maintainer-owned, never shipped):
#   - decisions/project/   project-kit's own PRJ records
#   - scratchpad/{active,done,dropped}  exploratory notes (only the README ships)
#   - manifest.yaml        the maintainer's backbone manifest
#   - .gitignore           rendered runtime artifact, regenerated per-adopter
#   - __pycache__          build cache (also excluded above)
# These are achieved by enumerating the included paths rather than the whole
# tree: `decisions/` ships `core` (hook-filtered, below) + `README.md` only;
# `scratchpad/` lists its `README.md` only.
# TWELVE `.pkit/` trees are deliberately absent from the list below —
# `decisions/core`, `capabilities`, `agents`, `permissions`, `adapters`,
# `skills`, `rules`, `schemas`, `cli`, `process`, `lifecycle`, `migrations`.
# Only single tracked files remain here: a static DIRECTORY entry ships
# whatever sits in it, untracked files included (#909). Do not "helpfully"
# restore any of them: they are force-included by `hatch_build.py`, file by
# file, with every adopter-owned path withheld — with one deliberate carve-out:
# four EMPTY `.gitkeep` markers do ship at adopter-owned paths, listed in that
# file's `ADOPTER_TIER_MARKERS`, because `install.py` reads the bundle's SHAPE
# to decide whether to stub an adopter's `project/` scaffolding. They are layout,
# not content, and a test asserts each is byte-empty. Finding
# `agents/project/.gitkeep` in the wheel is correct, not a bug to "fix". The
# canonical tree list is that file's `FILTERED_TREES`; a static entry here would
# ship the tree unfiltered and silently reintroduce the defect.
#
# Why: a `project/` subtree at any depth is the ADOPTER's tier, so shipping this
# project's copy seeded one project's state into every adopter (#811/#812) — and
# because some of it is git-ignored runtime state, the artifact depended on the
# build machine's untracked files (#813). The hook asks
# `.pkit/lifecycle/ownership.py` rather than carrying its own rule, and
# `tests/test_packaging_boundary.py` asserts the built artifacts against that
# predicate *and against each other*, so neither the manifest nor the two
# targets can drift.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel.force-include]
".pkit/VERSION" = "project_kit/_kit/VERSION"
".pkit/decisions/README.md" = "project_kit/_kit/decisions/README.md"
".pkit/scratchpad/README.md" = "project_kit/_kit/scratchpad/README.md"

# Lint and format are gated by `scripts/check.sh` (#840). The settings below
# are the house style, settled so that a finding the gate reports is a defect
# to fix, not a disagreement to argue: every rule this project writes against
# on purpose is switched off here with its reason, and every other finding is
# fixed rather than silenced.
[tool.ruff]
# One length for code and prose alike: the formatter lays code out to it, and
# the line-length rule holds the strings, docstrings and comments the
# formatter cannot break to the same limit.
line-length = 100
target-version = "py311"
src = ["src", "tests"]

# Where a tree runs on an older Python than the package's own floor, ruff is
# told so; otherwise pyupgrade offers rewrites onto an API that runtime lacks
# (`datetime.UTC` and `enum.StrEnum` are 3.11).
[tool.ruff.per-file-target-version]
# Capability scripts run under `uv run --script`, and their PEP 723 headers
# declare `requires-python = ">=3.10"`.
".pkit/capabilities/**/*.py" = "py310"
# The permission hook and the modules it imports run under the bare system
# `python3` inside the macOS sandbox (ADR-014) — Python 3.9 on a stock macOS.
".pkit/adapters/claude-code/permission-hook.py" = "py39"
".pkit/permissions/*.py" = "py39"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
]
ignore = [
    # A nested `if` here separates a precondition from the check it guards —
    # typically a call made for its effect, often with a comment between the
    # two. Folding them into one `and` hides that call inside a condition.
    "SIM102",  # collapsible-if
    # Predicates here are written as guard ladders: `if a: return False`,
    # `if b: return False`, … then `return True`. Returning the last condition
    # directly breaks the ladder's parallel shape, which is what makes each
    # case readable on its own.
    "SIM103",  # needless-bool
]
# The prose in strings, docstrings and comments uses typographic characters on
# purpose: the en dash in ranges (`1–3`), the multiplication sign (`3×`), the
# minus sign, set union (`∪`) and the information sign in a status line. They
# are allowed by name, so the ambiguous-unicode rules (RUF001–RUF003) still
# catch a confusable nobody chose. The em dash, the arrows and the middle dot
# the project also writes are not in ruff's confusables table and need no entry.
allowed-confusables = ["–", "×", "−", "∪", "ℹ"]

[tool.ruff.lint.per-file-ignores]
# A capability script runs by path and puts its own folder on `sys.path` before
# it imports its `_lib` package, so code ahead of those imports is the script's
# shape rather than a stray import (E402, module-import-not-at-top-of-file).
".pkit/capabilities/**/scripts/**/*.py" = ["E402"]

# Type checking is gated by `scripts/check.sh` (PRJ-010): the package in pyright's
# strict mode through a ratchet, everything else pyright checks in standard mode,
# outright. `scripts/pyright_ratchet.py` runs pyright and judges both, and it
# refuses this table narrowing what the package is checked for: an `include`,
# `exclude` or `ignore` entry that leaves part of `src` out, a strict list that
# stops covering it, or `reportMissingModuleSource` (the one rule strict mode does
# not override) set below a warning. A rule relaxed for the tests is relaxed here,
# with its reason.
[tool.pyright]
# The package, its tests, and the gate's own tooling.
include = ["src", "tests", "scripts"]
# The mode is set by directory (PRJ-010 point 1): a module in the package is
# strict from its first commit without being listed anywhere.
strict = ["src"]
typeCheckingMode = "standard"
pythonVersion = "3.11"
# pyright honours no `# type: ignore` (PRJ-010 point 5); a suppression names its
# rules, only outside the package, with its reason on the line.
enableTypeIgnoreComments = false
# The import paths (PRJ-010 point 7). `src` is the package's, which pyright adds on
# its own only while this list is unset. The tests put project-management's
# `scripts` directory on their import path at run time to import its `_lib`
# package, and a few put `_lib` itself there to patch `gh` as a top-level
# module; pyright is told the same.
extraPaths = [
    "src",
    ".pkit/capabilities/project-management/scripts",
    ".pkit/capabilities/project-management/scripts/_lib",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# `scripts/check.sh` runs the suite in parallel workers, then the `serial` tests
# on their own, in one process (tests/README.md, "Running the suite").
markers = [
    "serial: cannot share the machine with other test workers; runs after the parallel pass",
]
